, "t": "第一位要求 vs 根本原則", "p": "新聞輿論工作有鮮明的意識形態屬性。堅持正確的政治方向是做好新聞輿論工作的「第一位要求」；黨性原則是新聞輿論工作的「根本原則」。", "o": "坚持〖正确的政治方向〗是做好新闻舆论工作的〖第一位要求〗；〖党性原则〗是新闻舆论工作的〖根本原则〗", "m": "「方向第一，黨性根本」。"}, {"id": "C34-07", "l": 34, "ch": 10, "s": [12], "src": "", "tag": ["必背", "選擇題考點"], "t": "發射器和放大器；互聯網主陣地", "p": "新聞媒體是社會輿論的發射器和放大器；互聯網是意識形態工作的主陣地、主戰場、最前沿。", "o": "新闻媒体是社会舆论的〖发射器和放大器〗；互联网是意识形态工作的〖主阵地、主战场、最前沿〗", "m": "媒體像喇叭（發射＋放大）；互聯網像戰場（陣地・戰場・前沿）。"}, {"id": "C35-01", "l": 35, "ch": 10, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "多選題考點", "易混"], "t": "社會主義核心價值觀24字三個層面", "p": "國家層面（建設什麼樣的國家）：富強、民主、文明、和諧；社會層面（建設什麼樣的社會）：自由、平等、公正、法治；公民個人層面（培育什麼樣的公民）：愛國、敬業、誠信、友善。講師：選擇題要記住；多選注意哪個層面對應什麼。", "o": "国家层面：〖富强、民主、文明、和谐〗；社会层面：〖自由、平等、公正、法治〗；公民个人层面：〖爱国、敬业、诚信、友善〗", "m": "國家「富民文和」、社會「自平公法」、個人「愛敬誠友」。", "items": ["国家：富强、民主、文明、和谐", "社会：自由、平等、公正、法治", "公民：爱国、敬业、诚信、友善"]}, {"id": "C35-02", "l": 35, "ch": 10, "s": [3, 4], "src": "", "tag": ["選擇題考點"], "t": "核心價值觀的意義", "p": "社會主義核心價值觀集中體現全體人民共同的價值追求；承載著民族、國家的精神追求，體現著評判是非曲直的價值標準。", "o": "集中体现〖全体人民共同的价值追求〗；承载着民族、国家的〖精神追求〗；体现着评判〖是非曲直的价值标准〗", "m": "「價值追求・精神追求・價值標準」。"}, {"id": "C35-03", "l": 35, "ch": 10, "s": [5, 7], "src": "", "tag": ["簡答題考點"], "t": "核心價值觀建設的要求（只記標題）", "p": "講師：內文不需要背，只記兩個標題。重點人群：黨員幹部、公眾人物和先進模範、青年。", "o": "（1）让社会主义核心价值观成为〖广泛的社会共识〗；（2）注重〖区分层次、突出重点〗，抓好〖重点人群〗", "m": "「共識・分層抓重點」。", "items": ["让社会主义核心价值观成为广泛的社会共识", "注重区分层次、突出重点，抓好重点人群"]}, {"id": "C35-04", "l": 35, "ch": 10, "s": [9], "src": "", "tag": ["必背", "簡答題考點"], "t": "偉大建黨精神（32字）", "p": "1921年建黨時形成的精神，四組八字：堅持真理、堅守理想；踐行初心、擔當使命；不怕犧牲、英勇鬥爭；對黨忠誠、不負人民。", "o": "〖坚持真理〗、〖坚守理想〗，〖践行初心〗、〖担当使命〗，〖不怕牺牲〗、〖英勇斗争〗，〖对党忠诚〗、〖不负人民〗", "m": "「真理想・初使命・犧鬥爭・忠人民」：先信（真理理想）→再做（初心使命）→不怕（犧牲鬥爭）→忠誠（黨和人民）。", "items": ["坚持真理、坚守理想", "践行初心、担当使命", "不怕牺牲、英勇斗争", "对党忠诚、不负人民"]}, {"id": "C35-05", "l": 35, "ch": 10, "s": [10, 11], "src": "", "tag": ["必背", "簡答題考點", "多選題考點"], "t": "中國共產黨人的精神譜系（四個時期）", "p": "講師：不一定要一字不差，但至少要知道包含哪些時期、各時期的重要精神。①新民主主義革命時期：井岡山、蘇區、長征、遵義會議、延安、抗戰、紅巖、西柏坡精神；②社會主義革命和建設時期：抗美援朝、「兩彈一星」、雷鋒、焦裕祿、大慶精神（鐵人精神）、紅旗渠精神；③改革開放和社會主義現代化建設新時期：改革開放、特區、抗洪、抗擊非典、抗震救災、載人航天精神；④中國特色社會主義新時代：脫貧攻堅、抗疫、探月、新時代北斗精神。", "o": "〖新民主主义革命时期〗；〖社会主义革命和建设时期〗；〖改革开放和社会主义现代化建设新时期〗；〖中国特色社会主义新时代〗", "m": "四個時期＝革命→建設→改革→新時代；按事件時間排精神。", "items": ["新民主主义革命时期", "社会主义革命和建设时期", "改革开放和社会主义现代化建设新时期", "中国特色社会主义新时代"]}, {"id": "C35-06", "l": 35, "ch": 10, "s": [12, 13], "src": "", "tag": ["簡答題考點"], "t": "提高全社會文明程度（只記標題）", "p": "講師：「只記標題。」三項：共產主義遠大理想和中特共同理想教育；實施公民道德建設工程；培育時代新風新貌（小標印「样貌」，內文印「新貌」）。", "o": "〖共产主义远大理想和中国特色社会主义共同理想教育〗；实施〖公民道德建设〗工程；培育〖时代新风新貌〗", "m": "「理想・道德・新風」。", "items": ["共产主义远大理想和中国特色社会主义共同理想教育", "实施公民道德建设工程", "培育时代新风新貌"]}, {"id": "C36-01", "l": 36, "ch": 10, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "中華優秀傳統文化＝中華民族的根和魂", "p": "講師：一定要突出「優秀」兩字。中華優秀傳統文化是中華文明的智慧結晶和精華所在，是中華民族的根和魂。", "o": "中华〖优秀〗传统文化是中华文明的〖智慧结晶和精华所在〗，是中华民族的〖根和魂〗", "m": "「根和魂＝優秀傳統文化」；對比「旗幟和靈魂＝馬克思主義」（第34堂）。"}, {"id": "C36-02", "l": 36, "ch": 10, "s": [3], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "中華文明的五個突出特性", "p": "連續性（一直沒斷）、創新性（不斷出新）、統一性（追求統一）、包容性（能吸收各種文化）、和平性（愛好和平）。", "o": "中华文明的〖连续性〗、〖创新性〗、〖统一性〗、〖包容性〗、〖和平性〗", "m": "「連・創・統・包・和」——「連創統包和」。", "items": ["连续性", "创新性", "统一性", "包容性", "和平性"]}, {"id": "C36-03", "l": 36, "ch": 10, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "創造性轉化、創新性發展", "p": "對傳統文化不是原封不動，而是改造（轉化）並發展；堅持古為今用、推陳出新。中國共產黨既是中國先進文化的積極引領者和踐行者，又是中華優秀傳統文化的忠實傳承者和弘揚者。", "o": "推动中华优秀传统文化〖创造性转化〗、〖创新性发展〗；坚持〖古为今用〗、〖推陈出新〗", "m": "「創造轉化・創新發展」兩個「創」；「古今・陳新」。"}, {"id": "C36-04", "l": 36, "ch": 10, "s": [6], "src": "", "tag": ["必背", "簡答題考點", "易混"], "t": "文藝的崇高使命 vs 神聖職責", "p": "崇高使命＝舉精神旗幟、立精神支柱、建精神家園（三個「精神」）；神聖職責＝弘揚中國精神、傳播中國價值、凝聚中國力量（三個「中國」）。", "o": "举〖精神旗帜〗、立〖精神支柱〗、建〖精神家园〗是当代中国文艺的〖崇高使命〗；弘扬〖中国精神〗、传播〖中国价值〗、凝聚〖中国力量〗是文艺工作者的〖神圣职责〗", "m": "「使命＝三精神（旗柱園）；職責＝三中國（精神價值力量）」。"}, {"id": "C36-05", "l": 36, "ch": 10, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "社會效益放在首位", "p": "發展文化產業，要堅持把社會效益放在首位（先看對社會好不好，再看賺不賺錢），社會效益和經濟效益相統一。", "o": "坚持把〖社会效益〗放在〖首位〗，社会效益和经济效益相统一", "m": "「社會第一，經濟第二，兩者統一」。"}, {"id": "C36-06", "l": 36, "ch": 10, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "文化軟實力集中體現為凝聚力和生命力", "p": "講師：「把這兩個記住。」文化軟實力集中體現一個國家基於文化而具有的凝聚力和生命力，以及由此產生的吸引力和影響力。講好中國故事、傳播好中國聲音。", "o": "文化软实力集中体现一个国家基于文化而具有的〖凝聚力和生命力〗，以及由此产生的〖吸引力和影响力〗；〖讲好中国故事〗、传播好中国声音", "m": "「內在：凝聚＋生命；外在：吸引＋影響」。"}], "qs": [{"s": [7, 8, 9, 10, 11], "src": "", "card": "C01-01", "tag": ["必背", "簡答題考點", "錯題"], "auto": 1, "k": "默", "q": "默寫｜思想創立的時代背景（五個標題）", "model": "（一）世界百年未有之大变局加速演进；（二）中华民族伟大复兴进入关键时期；（三）中国式现代化全面推进拓展；（四）科学社会主义在21世纪的中国焕发蓬勃生机；（五）中国共产党自我革命开辟新的境界", "pts": ["世界百年未有之大变局加速演进", "中华民族伟大复兴进入关键时期", "中国式现代化全面推进拓展", "科学社会主义在21世纪的中国焕发蓬勃生机", "中国共产党自我革命开辟新的境界"], "e": "記法：口訣「世・復・現・科・革」＝世界→復興→現代化→科社→自我革命（由外到內、由大到小）。易錯字：中华、伟大、中国式、拓展、蓬勃、开辟；「关键时期」不是「時刻」。", "id": "Q01-001", "l": 1, "ch": 0}, {"s": [7, 8, 9, 10, 11], "src": "", "card": "C01-01", "tag": ["必背", "簡答題考點", "錯題"], "auto": 1, "k": "多", "q": "以下哪些是習近平新時代中國特色社會主義思想創立的時代背景（標題）？", "o": ["世界百年未有之大变局加速演进", "中华民族伟大复兴进入关键时期", "中国式现代化全面推进拓展", "科学社会主义在21世纪的中国焕发蓬勃生机", "中国特色社会主义进入全面小康时期"], "a": [0, 1, 2, 3], "e": "正確：世界百年未有之大变局加速演进；中华民族伟大复兴进入关键时期；中国式现代化全面推进拓展；科学社会主义在21世纪的中国焕发蓬勃生机。干擾項：中国特色社会主义进入全面小康时期。", "id": "Q01-002", "l": 1, "ch": 0}, {"s": [7, 8, 9, 10, 11], "src": "", "card": "C01-01", "tag": ["必背", "簡答題考點", "錯題"], "auto": 1, "k": "多", "q": "以下哪些是習近平新時代中國特色社會主義思想創立的時代背景（標題）？", "o": ["中华民族伟大复兴进入关键时期", "世界百年未有之大变局加速演进", "中国共产党自我革命开辟新的境界", "科学社会主义在21世纪的中国焕发蓬勃生机", "中华民族伟大复兴进入关键时刻"], "a": [0, 1, 2, 3], "e": "正確：中华民族伟大复兴进入关键时期；世界百年未有之大变局加速演进；中国共产党自我革命开辟新的境界；科学社会主义在21世纪的中国焕发蓬勃生机。干擾項：中华民族伟大复兴进入关键时刻。", "id": "Q01-003", "l": 1, "ch": 0}, {"s": [7], "src": "", "card": "C01-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜世界百年未有之大變局（曾考過）：\n世界百年未有之大变局加速演进：1. （＿①＿）；2. 世界进入新的（＿②＿）", "a": ["和平、发展、合作、共赢", "动荡变革期"], "e": "「百年未有之大變局」是講師說「曾經考過的考點」。意思是：世界局勢正出現一百年來都沒有過的大變化。投影片黃字還寫了時代潮流是「和平、發展、合作、共贏」，而世界也進入「新的動盪變革期」。補充：毛澤東思想的時代主題是「戰爭與革命」，鄧小平理論以後是「和平與發展」。", "id": "Q01-004", "l": 1, "ch": 0}, {"s": [8], "src": "", "card": "C01-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中華民族偉大復興＝共同夢想＋奮鬥目標：\n实现中华民族伟大复兴是近代以来中国人民的（＿①＿），是中国共产党（＿②＿）的奋斗目标", "a": ["共同梦想", "矢志不渝"], "e": "民族復興對中國人民來說是「大家一直的共同夢想」；對共產黨來說是「一直不放棄的奮鬥目標」。講師說標黃的這句要記住。", "id": "Q01-005", "l": 1, "ch": 0}, {"s": [8], "src": "", "card": "C01-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜中華民族偉大復興＝共同夢想＋奮鬥目標", "model": "实现中华民族伟大复兴是近代以来中国人民的共同梦想，是中国共产党矢志不渝的奋斗目标", "pts": ["共同梦想", "矢志不渝"], "e": "記法：「人民→夢想；黨→目標」。矢志不渝＝發誓不改變。", "id": "Q01-006", "l": 1, "ch": 0}, {"s": [9], "src": "", "card": "C01-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜三個「獨特」決定中國走自己的現代化道路：\n（＿①＿）、（＿②＿）、（＿③＿），决定了中国必然走适合自己特点的现代化道路", "a": ["独特的文化传统", "独特的历史命运", "独特的基本国情"], "e": "中國有自己獨特的文化、歷史和國情，所以不能照抄別人，一定要走適合自己的現代化道路。", "id": "Q01-007", "l": 1, "ch": 0}, {"s": [10], "src": "", "card": "C01-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中國特色社會主義＝旗幟＋中流砥柱：\n中国特色社会主义正式成为21世纪科学社会主义发展的（＿①＿），成为振兴世界社会主义的（＿②＿）", "a": ["旗帜", "中流砥柱"], "e": "中國特色社會主義已成為21世紀科學社會主義的「代表旗幟」，也是讓世界社會主義重新振作的「最重要支柱」（中流砥柱＝激流中穩穩站着的大石頭）。", "id": "Q01-008", "l": 1, "ch": 0}, {"s": [11], "src": "", "card": "C01-06", "tag": ["必背", "選擇題考點", "錯題", "易混"], "auto": 1, "k": "填", "q": "填空｜跳出歷史周期律的兩個答案：\n第一个答案：（＿①＿）（毛泽东回答黄炎培）；第二个答案：自我革命——「（＿②＿）这个跳出治乱兴衰历史周期律的第二个答案」", "a": ["人民监督", "自我革命"], "e": "「歷史周期律」＝古代王朝總是興起後又衰敗的循環。怎樣跳出？第一個答案（毛澤東回答黃炎培）：讓人民來監督政府；第二個答案（新時代找到的）：黨自己改正自己的錯誤，就是自我革命。選擇題常考「第二個答案＝自我革命」，千萬不要對調。", "id": "Q01-009", "l": 1, "ch": 0}, {"s": [11], "src": "", "card": "C01-06", "tag": ["必背", "選擇題考點", "錯題", "易混"], "auto": 1, "k": "單", "q": "跳出治亂興衰歷史周期律的「第一个答案」是？", "o": ["人民监督", "自我革命", "全面从严治党", "民主集中制"], "a": 0, "e": "「第一个答案」→「人民监督」。記法：次序口訣「先靠人民，後靠自己」：一＝人民監督（外人看着你），二＝自我革命（自己管自己）。", "id": "Q01-010", "l": 1, "ch": 0}, {"s": [11], "src": "", "card": "C01-06", "tag": ["必背", "選擇題考點", "錯題", "易混"], "auto": 1, "k": "判", "q": "跳出治亂興衰歷史周期律的「第一个答案」是「人民监督」。", "a": true, "e": "對。「第一个答案」→「人民监督」。", "id": "Q01-011", "l": 1, "ch": 0}, {"s": [11], "src": "", "card": "C01-06", "tag": ["必背", "選擇題考點", "錯題", "易混"], "auto": 1, "k": "單", "q": "跳出治亂興衰歷史周期律的「第二个答案」是？", "o": ["自我革命", "人民监督", "全面从严治党", "民主集中制"], "a": 0, "e": "「第二个答案」→「自我革命」。記法：次序口訣「先靠人民，後靠自己」：一＝人民監督（外人看着你），二＝自我革命（自己管自己）。", "id": "Q01-012", "l": 1, "ch": 0}, {"s": [11], "src": "", "card": "C01-06", "tag": ["必背", "選擇題考點", "錯題", "易混"], "auto": 1, "k": "判", "q": "跳出治亂興衰歷史周期律的「第二个答案」是「人民监督」。", "a": false, "e": "錯。「第二个答案」應對應「自我革命」，「人民监督」對應的是「第一个答案」。", "id": "Q01-013", "l": 1, "ch": 0}, {"s": [12], "src": "", "card": "C01-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「兩個結合」：\n马克思主义基本原理同（＿①＿）相结合、同（＿②＿）相结合", "a": ["中国具体实际", "中华优秀传统文化"], "e": "把馬克思主義和兩樣東西結合：一是中國的實際情況，二是中華「優秀」傳統文化（是優秀的，不是腐朽的）。講師說這是「我們取得成功的最大法寶」。", "id": "Q01-014", "l": 1, "ch": 0}, {"s": [12], "src": "", "card": "C01-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜「兩個結合」", "model": "马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合", "pts": ["中国具体实际", "中华优秀传统文化"], "e": "記法：「一個馬，兩條繩」：一條繫「中國實際」，一條繫「優秀傳統文化」。注意「優秀」兩字。", "id": "Q01-015", "l": 1, "ch": 0}, {"s": [14], "src": "", "card": "C01-08", "tag": ["必背", "多選題考點"], "auto": 1, "k": "默", "q": "默寫｜思想回答的重大時代課題（三問）", "model": "新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国，怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党，怎样建设长期执政的马克思主义政党", "pts": ["新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义", "建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国", "建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党"], "e": "記法：三個「什麼樣＋怎樣」：中特（主義）→強國（國家）→政黨（黨）。「主義・國・黨」。", "id": "Q01-016", "l": 1, "ch": 0}, {"s": [15], "src": "", "card": "C01-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜思想的豐富內涵（四大部分）：\n“（＿①＿）”“（＿②＿）”“（＿③＿）”“（＿④＿）”", "a": ["十个明确", "十四个坚持", "十三个方面成就", "六个必须坚持"], "e": "這個思想的內容主要由四組組成：十個明確、十四個堅持、十三個方面成就、六個必須堅持。講師說十個明確、十四個堅持、六個必須堅持都「必須背熟」。", "id": "Q01-017", "l": 1, "ch": 0}, {"s": [16], "src": "", "card": "C01-10", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜十個明確（1）最本質的特徵：\n明确中国特色社会主义最本质的特征是（＿①＿）", "a": ["中国共产党领导"], "e": "中國特色社會主義「最」重要、最根本的特點是什麼？就是由中國共產黨領導。題目只要出現「最本質的特徵」，答案就是黨的領導。", "id": "Q01-018", "l": 1, "ch": 0}, {"s": [16], "src": "", "card": "C01-11", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "填", "q": "填空｜十個明確（2）總任務：\n明确坚持和发展中国特色社会主义，总任务是实现（＿①＿）和（＿②＿），在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴", "a": ["社会主义现代化", "中华民族伟大复兴"], "e": "「總任務」就是最大的總目標：實現社會主義現代化和中華民族偉大復興。分兩步走，到本世紀中葉（2050年）建成現代化強國。", "id": "Q01-019", "l": 1, "ch": 0}, {"s": [16], "src": "", "card": "C01-11", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "默", "q": "默寫｜十個明確（2）總任務", "model": "明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴", "pts": ["社会主义现代化", "中华民族伟大复兴"], "e": "記法：總任務＝「現代化＋復興」兩件事；強國五個形容詞「富強・民主・文明・和諧・美麗」（富民文和美）。手寫：2021、2050。", "id": "Q01-020", "l": 1, "ch": 0}, {"s": [17], "src": "", "card": "C01-12", "tag": ["必背"], "auto": 1, "k": "填", "q": "填空｜十個明確（3）社會主要矛盾：\n明确新时代我国社会主要矛盾是人民日益增长的（＿①＿）和（＿②＿）的发展之间的矛盾；（＿③＿）", "a": ["美好生活需要", "不平衡不充分", "坚持以人民为中心"], "e": "現在中國社會最主要的「問題」：人民想要更好的生活，但發展還不夠平衡、不夠充分。所以要以人民為中心。", "id": "Q01-021", "l": 1, "ch": 0}, {"s": [18], "src": "", "card": "C01-13", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜十個明確（4）總體布局與戰略布局：\n明确中国特色社会主义事业（＿①＿）是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，（＿②＿）是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面", "a": ["总体布局", "战略布局"], "e": "總體布局「五位一體」＝五個方面一起建設（經濟、政治、文化、社會、生態文明）；戰略布局「四個全面」＝四件大事全面推進。注意：五位一體是「總體」布局，四個全面是「戰略」布局，不要調轉。", "id": "Q01-022", "l": 1, "ch": 0}, {"s": [18], "src": "", "card": "C01-13", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "默", "q": "默寫｜十個明確（4）總體布局與戰略布局", "model": "明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面", "pts": ["总体布局", "战略布局"], "e": "記法：「五總四戰」：五位一體→總體；四個全面→戰略。五位：經・政・文・社・生（「經政文社生」）。", "id": "Q01-023", "l": 1, "ch": 0}, {"s": [18], "src": "", "card": "C01-14", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜十個明確（5）全面深化改革總目標：\n完善和发展（＿①＿），推进（＿②＿）", "a": ["中国特色社会主义制度", "国家治理体系和治理能力现代化"], "e": "全面深化改革要做到兩件事：把中國特色社會主義制度弄得更好，並讓國家管理的體系和能力現代化。", "id": "Q01-024", "l": 1, "ch": 0}, {"s": [19], "src": "", "card": "C01-15", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜十個明確（6）（7）法治總目標、經濟要點：\n（6）全面推进依法治国总目标；（7）市场在资源配置中起（＿①＿）；贯彻（＿②＿）；以（＿③＿）为主体、国内国际双循环相互促进", "a": ["决定性作用", "创新、协调、绿色、开放、共享", "国内大循环"], "e": "（6）講全面推進依法治國的總目標；（7）講經濟：市場在資源配置中起決定性作用；貫徹新發展理念（創新、協調、綠色、開放、共享）；以國內大循環為主體、國內國際雙循環相互促進。", "id": "Q01-025", "l": 1, "ch": 0}, {"s": [20], "src": "", "card": "C01-16", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜十個明確（8）強軍目標：\n（＿①＿）、（＿②＿）、（＿③＿）", "a": ["听党指挥", "能打胜仗", "作风优良"], "e": "人民軍隊要做到三點：聽黨的指揮、能打勝仗、作風優良。講師說「能打勝仗是核心，是最重要的」。", "id": "Q01-026", "l": 1, "ch": 0}, {"s": [20], "src": "", "card": "C01-17", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜十個明確（9）（10）外交與從嚴治黨：\n（9）（＿①＿）；（10）全面从严治党的战略方针……把（＿②＿）贯穿其中", "a": ["中国特色大国外交", "制度建设"], "e": "（9）中國特色大國外交；（10）全面從嚴治黨的戰略方針。講師特別提醒：「把制度建設貫穿其中」很喜歡考選擇題。", "id": "Q01-027", "l": 1, "ch": 0}, {"k": "單", "s": [11], "q": "新時代，中國共產黨找到了跳出治亂興衰歷史周期律的「第二個答案」，它是：", "o": ["自我革命", "人民監督", "民主集中制", "全面依法治國"], "a": 0, "e": "第二個答案是「自我革命」；第一個答案（毛澤東回答黃炎培）才是「人民監督」。", "id": "Q01-028", "l": 1, "ch": 0}, {"k": "單", "s": [11], "q": "毛澤東回答黃炎培「怎樣跳出歷史周期律」時，給出的第一個答案是：", "o": ["人民監督", "自我革命", "全面從嚴治黨", "改革開放"], "a": 0, "e": "第一個答案＝人民監督（讓人民來監督黨和政府）。第二個答案才是自我革命。", "id": "Q01-029", "l": 1, "ch": 0}, {"k": "判", "s": [11], "q": "「人民監督」是跳出治亂興衰歷史周期律的第二個答案。", "a": false, "e": "錯。人民監督是第一個答案，自我革命才是第二個答案。", "id": "Q01-030", "l": 1, "ch": 0}, {"k": "單", "s": [16], "q": "中國特色社會主義最本質的特徵是：", "o": ["中國共產黨領導", "人民當家作主", "依法治國", "共同富裕"], "a": 0, "e": "看到「最本質的特徵」就選「中國共產黨領導」。", "id": "Q01-031", "l": 1, "ch": 0}, {"k": "單", "s": [16], "q": "堅持和發展中國特色社會主義的「總任務」是：", "o": ["實現社會主義現代化和中華民族偉大復興", "全面建成小康社會", "解決社會主要矛盾", "推進國家治理體系和治理能力現代化"], "a": 0, "e": "總任務＝實現社會主義現代化和中華民族偉大復興。「推進國家治理體系和治理能力現代化」屬於全面深化改革總目標。", "id": "Q01-032", "l": 1, "ch": 0}, {"k": "單", "s": [18], "q": "中國特色社會主義事業的「總體布局」是：", "o": ["五位一體", "四個全面", "兩個結合", "兩步走"], "a": 0, "e": "五位一體＝總體布局；四個全面＝戰略布局。", "id": "Q01-033", "l": 1, "ch": 0}, {"k": "判", "s": [18], "q": "「四個全面」是中國特色社會主義事業的總體布局。", "a": false, "e": "錯。四個全面是「戰略布局」；五位一體才是「總體布局」。", "id": "Q01-034", "l": 1, "ch": 0}, {"k": "單", "s": [20], "q": "講師指出，強軍目標「聽黨指揮、能打勝仗、作風優良」之中，核心是：", "o": ["能打勝仗", "聽黨指揮", "作風優良", "依法治軍"], "a": 0, "e": "講師：「能打勝仗是核心，是最重要的。」", "id": "Q01-035", "l": 1, "ch": 0}, {"k": "單", "s": [7], "q": "毛澤東思想所處時代的主題是「戰爭與革命」，鄧小平理論以後的時代主題是：", "o": ["和平與發展", "戰爭與革命", "改革與開放", "合作與共贏"], "a": 0, "e": "投影片手寫：毛→「戰爭與革命」；之後→「和平與發展」。", "id": "Q01-036", "l": 1, "ch": 0}, {"k": "判", "s": [12], "q": "「兩個結合」是指馬克思主義基本原理同中國具體實際相結合、同中華傳統文化（包括其中一切內容）相結合。", "a": false, "e": "錯。是同「中華優秀傳統文化」相結合，講師強調「是優秀的，而非腐朽的」。", "id": "Q01-037", "l": 1, "ch": 0}, {"k": "單", "s": [10], "q": "中國特色社會主義正式成為21世紀科學社會主義發展的旗幟，成為振興世界社會主義的：", "o": ["中流砥柱", "根本保證", "行動指南", "精神力量"], "a": 0, "e": "原文：成為振興世界社會主義的「中流砥柱」。", "id": "Q01-038", "l": 1, "ch": 0}, {"k": "多", "s": [9], "q": "決定了中國必然走適合自己特點的現代化道路的「三個獨特」是：", "o": ["獨特的文化傳統", "獨特的歷史命運", "獨特的基本國情", "獨特的地理位置"], "a": [0, 1, 2], "e": "原文：獨特的文化傳統、獨特的歷史命運、獨特的基本國情。", "id": "Q01-039", "l": 1, "ch": 0}, {"k": "填", "s": [7, 8, 9, 10, 11], "q": "時代背景五標題：（一）世界百年未有之大变局（＿①＿）；（二）中华民族伟大复兴进入（＿②＿）；（三）中国式现代化全面推进（＿③＿）；（四）科学社会主义在21世纪的中国焕发（＿④＿）生机；（五）中国共产党自我革命（＿⑤＿）新的境界", "a": ["加速演进", "关键时期", "拓展", "蓬勃", "开辟"], "e": "五個易漏關鍵詞：加速演進、關鍵時期（不是時刻）、拓展、蓬勃、開闢。", "id": "Q01-040", "l": 1, "ch": 0}, {"k": "簡", "s": [7, 8, 9, 10, 11], "q": "簡答：簡述習近平新時代中國特色社會主義思想創立的時代背景。", "sum": "一句白話：世界在大變、民族復興到了關鍵期、現代化在推進、科學社會主義在中國有活力、黨的自我革命有新境界。", "pts": ["世界百年未有之大变局加速演进", "中华民族伟大复兴进入关键时期", "中国式现代化全面推进拓展", "科学社会主义在21世纪的中国焕发蓬勃生机", "中国共产党自我革命开辟新的境界"], "e": "講師（第02堂總複習）：簡答題「只需要去答標題就可以了」。", "id": "Q01-041", "l": 1, "ch": 0}, {"s": [2, 3], "src": "", "card": "C02-01", "tag": ["必背"], "auto": 1, "k": "默", "q": "默寫｜十四個堅持（基本方略）", "model": "（1）坚持党对一切工作的领导；（2）坚持以人民为中心；（3）坚持全面深化改革；（4）坚持新发展理念；（5）坚持人民当家作主；（6）坚持全面依法治国；（7）坚持社会主义核心价值体系；（8）坚持在发展中保障和改善民生；（9）坚持人与自然和谐共生；（10）坚持总体国家安全观；（11）坚持党对人民军队的绝对领导；（12）坚持“一国两制”和推进祖国统一；（13）坚持推动构建人类命运共同体；（14）坚持全面从严治党", "pts": ["坚持党对一切工作的领导", "坚持以人民为中心", "坚持全面深化改革", "坚持新发展理念", "坚持人民当家作主", "坚持全面依法治国", "坚持社会主义核心价值体系", "坚持在发展中保障和改善民生", "坚持人与自然和谐共生", "坚持总体国家安全观", "坚持党对人民军队的绝对领导", "坚持“一国两制”和推进祖国统一", "坚持推动构建人类命运共同体", "坚持全面从严治党"], "e": "記法：頭尾記牢：「黨領導開頭、從嚴治黨收尾」。中間口訣：「人・改・新・主・法・價・民・生・安・軍・統・命」（人民中心→改革→新理念→當家作主→法治→核心價值體系→民生→生態→安全→軍隊→統一→命運共同體）。", "id": "Q02-001", "l": 2, "ch": 0}, {"s": [2, 3], "src": "", "card": "C02-01", "tag": ["必背"], "auto": 1, "k": "多", "q": "以下哪些屬於「十四個堅持」？", "o": ["坚持党对一切工作的领导", "坚持以人民为中心", "坚持全面深化改革", "坚持新发展理念", "坚持胸怀天下"], "a": [0, 1, 2, 3], "e": "正確：坚持党对一切工作的领导；坚持以人民为中心；坚持全面深化改革；坚持新发展理念。干擾項：坚持胸怀天下。", "id": "Q02-002", "l": 2, "ch": 0}, {"s": [2, 3], "src": "", "card": "C02-01", "tag": ["必背"], "auto": 1, "k": "多", "q": "以下哪些屬於「十四個堅持」？", "o": ["坚持“一国两制”和推进祖国统一", "坚持党对人民军队的绝对领导", "坚持人与自然和谐共生", "坚持以人民为中心", "坚持守正创新"], "a": [0, 1, 2, 3], "e": "正確：坚持“一国两制”和推进祖国统一；坚持党对人民军队的绝对领导；坚持人与自然和谐共生；坚持以人民为中心。干擾項：坚持守正创新。", "id": "Q02-003", "l": 2, "ch": 0}, {"s": [11, 12, 13, 14], "src": "", "card": "C02-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜六個必須堅持——各自的定位：\n必须坚持（＿①＿），是根本价值立场；必须坚持（＿②＿），是内在精神特质；必须坚持（＿③＿），是鲜明理论品格；必须坚持（＿④＿），是重要实践要求；必须坚持（＿⑤＿），是基本思想和工作方法；必须坚持（＿⑥＿），中国共产党人的境界格局", "a": ["人民至上", "自信自立", "守正创新", "问题导向", "系统观念", "胸怀天下"], "e": "六個「必須堅持」是這個思想的「立場、觀點、方法」。每一個都有自己的「身份」：人民至上是立場，自信自立是精神特質，守正創新是理論品格，問題導向是實踐要求，系統觀念是思想和工作方法，胸懷天下是境界格局。", "id": "Q02-004", "l": 2, "ch": 0}, {"s": [11, 12, 13, 14], "src": "", "card": "C02-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜六個必須堅持——各自的定位", "model": "必须坚持人民至上，是根本价值立场；必须坚持自信自立，是内在精神特质；必须坚持守正创新，是鲜明理论品格；必须坚持问题导向，是重要实践要求；必须坚持系统观念，是基本思想和工作方法；必须坚持胸怀天下，中国共产党人的境界格局", "pts": ["必须坚持人民至上——根本价值立场", "必须坚持自信自立——内在精神特质", "必须坚持守正创新——鲜明理论品格", "必须坚持问题导向——重要实践要求", "必须坚持系统观念——基本思想和工作方法", "必须坚持胸怀天下——中国共产党人的境界格局"], "e": "記法：六個名稱口訣「人・自・守・問・系・胸」（人自守問系胸＝「人自守，問系胸」）；定位口訣「立場・特質・品格・要求・方法・格局」。", "id": "Q02-005", "l": 2, "ch": 0}, {"s": [11, 12, 13, 14], "src": "", "card": "C02-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「六個必須堅持」中，「必須堅持人民至上」的定位是：", "o": ["根本价值立场", "基本思想和工作方法", "内在精神特质", "鲜明理论品格"], "a": 0, "e": "「人民至上」→「根本价值立场」。記法：六個名稱口訣「人・自・守・問・系・胸」（人自守問系胸＝「人自守，問系胸」）；定位口訣「立場・特質・品格・要求・方法・格局」。", "id": "Q02-006", "l": 2, "ch": 0}, {"s": [11, 12, 13, 14], "src": "", "card": "C02-03", "tag": ["必背", "選擇題考點"], "aut "id": "Q02-027", "l": 2, "ch": 0}, {"s": [11, 12, 13, 14], "src": "", "card": "C02-04", "tag": ["必背", "易混"], "auto": 1, "k": "判", "q": "「必須堅持胸怀天下」體現了「马克思主义追求人类进步和解放的崇高理想」。", "a": true, "e": "對。「胸怀天下」→「马克思主义追求人类进步和解放的崇高理想」。", "id": "Q02-028", "l": 2, "ch": 0}, {"s": [11], "src": "", "card": "C02-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民性是馬克思主義的本質屬性：\n（＿①＿）是马克思主义的本质属性", "a": ["人民性"], "e": "馬克思主義最根本的特點是「為人民」。講師說這句「當選擇題來準備」。（同頁白字：人民至上體現了歷史唯物主義群眾史觀。）", "id": "Q02-029", "l": 2, "ch": 0}, {"s": [13], "src": "逐字稿", "card": "C02-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜問題是時代的聲音：\n问题是（＿①＿），回答并指导解决问题是理论的（＿②＿）", "a": ["时代的声音", "根本任务"], "e": "每個時代都有自己要解決的問題；理論最根本的任務，就是回答並指導解決這些問題。（講師講「問題導向」時說的話）", "id": "Q02-030", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-07", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "填", "q": "填空｜思想的歷史地位：寫入黨章、寫入憲法：\n2017年10月，（＿①＿）……把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并庄严地写入党章；2018年3月，（＿②＿）通过的宪法修正案，郑重地把习近平新时代中国特色社会主义思想载入宪法", "a": ["党的十九大", "十三届全国人大一次会议"], "e": "這個思想先寫進黨的「規章」（黨章），再寫進國家的「根本法」（憲法）。時間節點是選擇題考點：2017年10月黨的十九大寫入黨章；2018年3月十三屆全國人大一次會議寫入憲法。", "id": "Q02-031", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-07", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "單", "q": "習近平新時代中國特色社會主義思想「写入党章」是在：", "o": ["2017年10月党的十九大", "2018年3月十三届全国人大一次会议", "2012年11月党的十八大", "2021年11月党的十九届六中全会"], "a": 0, "e": "「写入党章」→「2017年10月党的十九大」。記法：「先黨後國」：先黨章（十九大，2017.10）→後憲法（人大，2018.3）。黨的事看「黨代會」，國家的事看「人大」。", "id": "Q02-032", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-07", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "判", "q": "習近平新時代中國特色社會主義思想「写入党章」是在2017年10月党的十九大。", "a": true, "e": "對。「写入党章」→「2017年10月党的十九大」。", "id": "Q02-033", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-07", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "單", "q": "習近平新時代中國特色社會主義思想「载入宪法」是在：", "o": ["2018年3月十三届全国人大一次会议", "2017年10月党的十九大", "2012年11月党的十八大", "2021年11月党的十九届六中全会"], "a": 0, "e": "「载入宪法」→「2018年3月十三届全国人大一次会议」。記法：「先黨後國」：先黨章（十九大，2017.10）→後憲法（人大，2018.3）。黨的事看「黨代會」，國家的事看「人大」。", "id": "Q02-034", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-07", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "判", "q": "習近平新時代中國特色社會主義思想「载入宪法」是在2017年10月党的十九大。", "a": false, "e": "錯。「载入宪法」應對應「2018年3月十三届全国人大一次会议」，「2017年10月党的十九大」對應的是「写入党章」。", "id": "Q02-035", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜歷代指導思想寫入黨章的會議（串聯記憶）：\n毛泽东思想——党的（＿①＿）；邓小平理论——（＿②＿）；“三个代表”重要思想——（＿③＿）；习近平新时代中国特色社会主义思想——（＿④＿）", "a": ["七大", "十五大", "十六大", "十九大"], "e": "講師把歷代指導思想寫入黨章的大會串起來記：毛澤東思想—七大；鄧小平理論—十五大；「三個代表」—十六大；習近平新時代中國特色社會主義思想—十九大。（科學發展觀講師說「十七和十八」，投影片該處被擋。）", "id": "Q02-036", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師串聯記憶：「毛泽东思想」寫入黨章（列為指導思想）是在黨的：", "o": ["七大", "十六大", "十五大", "十九大"], "a": 0, "e": "「毛泽东思想」→「七大」。記法：「七・十五・十六・十九」；習思想最新＝十九大。", "id": "Q02-037", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「毛泽东思想」是在黨的七大寫入黨章的。", "a": true, "e": "對。「毛泽东思想」→「七大」。", "id": "Q02-038", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師串聯記憶：「邓小平理论」寫入黨章（列為指導思想）是在黨的：", "o": ["十五大", "十六大", "七大", "十九大"], "a": 0, "e": "「邓小平理论」→「十五大」。記法：「七・十五・十六・十九」；習思想最新＝十九大。", "id": "Q02-039", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「邓小平理论」是在黨的十六大寫入黨章的。", "a": false, "e": "錯。「邓小平理论」應對應「十五大」，「十六大」對應的是「“三个代表”重要思想」。", "id": "Q02-040", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師串聯記憶：「“三个代表”重要思想」寫入黨章（列為指導思想）是在黨的：", "o": ["十六大", "七大", "十五大", "十九大"], "a": 0, "e": "「“三个代表”重要思想」→「十六大」。記法：「七・十五・十六・十九」；習思想最新＝十九大。", "id": "Q02-041", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「“三个代表”重要思想」是在黨的十六大寫入黨章的。", "a": true, "e": "對。「“三个代表”重要思想」→「十六大」。", "id": "Q02-042", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師串聯記憶：「习近平新时代中国特色社会主义思想」寫入黨章（列為指導思想）是在黨的：", "o": ["十九大", "十六大", "十五大", "七大"], "a": 0, "e": "「习近平新时代中国特色社会主义思想」→「十九大」。記法：「七・十五・十六・十九」；習思想最新＝十九大。", "id": "Q02-043", "l": 2, "ch": 0}, {"s": [15], "src": "", "card": "C02-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「习近平新时代中国特色社会主义思想」是在黨的七大寫入黨章的。", "a": false, "e": "錯。「习近平新时代中国特色社会主义思想」應對應「十九大」，「七大」對應的是「毛泽东思想」。", "id": "Q02-044", "l": 2, "ch": 0}, {"s": [16], "src": "", "card": "C02-09", "tag": ["必背", "錯題"], "auto": 1, "k": "填", "q": "填空｜「兩個確立」的內涵：\n党的（＿①＿）指出，党确立（＿②＿），确立（＿③＿）", "a": ["十九届六中全会", "习近平同志党中央的核心、全党的核心地位", "习近平新时代中国特色社会主义思想的指导地位"], "e": "「兩個確立」＝兩件被確定下來的事：一是確立習近平同志的核心地位（人），二是確立習近平新時代中國特色社會主義思想的指導地位（思想）。是十九屆六中全會提出的。兩條都要寫齊。", "id": "Q02-045", "l": 2, "ch": 0}, {"s": [16], "src": "", "card": "C02-09", "tag": ["必背", "錯題"], "auto": 1, "k": "默", "q": "默寫｜「兩個確立」的內涵", "model": "党的十九届六中全会指出，党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位", "pts": ["确立习近平同志党中央的核心、全党的核心地位", "确立习近平新时代中国特色社会主义思想的指导地位"], "e": "記法：「一人一思想」：確立「人」的核心地位＋確立「思想」的指導地位。", "id": "Q02-046", "l": 2, "ch": 0}, {"s": [17], "src": "", "card": "C02-10", "tag": ["必背", "錯題"], "auto": 1, "k": "填", "q": "填空｜「兩個確立」的決定性意義（三個「最大」）：\n是党和人民应对一切不确定性的（＿①＿）、（＿②＿）、（＿③＿）", "a": ["最大确定性", "最大底气", "最大保证"], "e": "「兩個確立」為什麼重要？因為世界上有很多不確定的事，而它是黨和人民面對一切不確定時「最可靠的確定、最大的信心、最大的保障」。講師：記住標黃的這句就行。", "id": "Q02-047", "l": 2, "ch": 0}, {"s": [17], "src": "", "card": "C02-10", "tag": ["必背", "錯題"], "auto": 1, "k": "默", "q": "默寫｜「兩個確立」的決定性意義（三個「最大」）", "model": "是党和人民应对一切不确定性的最大确定性、最大底气、最大保证", "pts": ["最大确定性", "最大底气", "最大保证"], "e": "記法：三個「最大」：「確定性・底氣・保證」（定・氣・保）。", "id": "Q02-048", "l": 2, "ch": 0}, {"k": "單", "s": [15], "q": "習近平新時代中國特色社會主義思想被寫入黨章，是在：", "o": ["2017年10月黨的十九大", "2018年3月十三屆全國人大一次會議", "2012年11月黨的十八大", "2021年11月十九屆六中全會"], "a": 0, "e": "寫入黨章＝2017年10月黨的十九大；寫入憲法＝2018年3月十三屆全國人大一次會議。", "id": "Q02-049", "l": 2, "ch": 0}, {"k": "單", "s": [16], "q": "「兩個確立」是在哪一次會議上指出的？", "o": ["黨的十九屆六中全會", "黨的十九大", "黨的二十大", "十三屆全國人大一次會議"], "a": 0, "e": "原文：「党的十九届六中全会指出，党确立……」。", "id": "Q02-050", "l": 2, "ch": 0}, {"k": "多", "s": [16], "q": "「兩個確立」包括：", "o": ["確立習近平同志黨中央的核心、全黨的核心地位", "確立習近平新時代中國特色社會主義思想的指導地位", "確立中國特色社會主義的總體布局", "確立全面從嚴治黨的戰略方針"], "a": [0, 1], "e": "兩個確立＝核心地位（人）＋指導地位（思想），兩條都要答。", "id": "Q02-051", "l": 2, "ch": 0}, {"k": "判", "s": [17], "q": "「兩個確立」是黨和人民應對一切不確定性的最大確定性、最大底氣、最大保證。", "a": true, "e": "對。這是投影片黃字原文，三個「最大」。", "id": "Q02-052", "l": 2, "ch": 0}, {"k": "單", "s": [11], "q": "「必須堅持人民至上」是：", "o": ["根本價值立場", "內在精神特質", "鮮明理論品格", "重要實踐要求"], "a": 0, "e": "人民至上＝根本價值立場。", "id": "Q02-053", "l": 2, "ch": 0}, {"k": "判", "s": [14], "q": "「必須堅持系統觀念」是中國共產黨人的境界格局。", "a": false, "e": "錯。系統觀念＝基本思想和工作方法；胸懷天下才是境界格局。", "id": "Q02-054", "l": 2, "ch": 0}, {"k": "單", "s": [11], "q": "講師要求「當選擇題來準備」的一句：馬克思主義的本質屬性是：", "o": ["人民性", "實踐性", "科學性", "革命性"], "a": 0, "e": "原文：人民性是馬克思主義的本質屬性。", "id": "Q02-055", "l": 2, "ch": 0}, {"k": "多", "s": [2, 3], "q": "以下哪些是「十四個堅持」的第一條和最後一條？", "o": ["坚持党对一切工作的领导", "坚持全面从严治党", "坚持以人民为中心", "坚持总体国家安全观"], "a": [0, 1], "e": "講師：黨的領導總擺第一位，全面從嚴治黨總在最後「兜底」。", "id": "Q02-056", "l": 2, "ch": 0}, {"k": "填", "s": [15], "q": "2017年10月，（＿①＿）把習近平新時代中國特色社會主義思想寫入黨章；2018年3月，（＿②＿）通過憲法修正案，把它載入憲法。", "a": ["党的十九大|十九大", "十三届全国人大一次会议"], "e": "先黨章（十九大）後憲法（十三屆全國人大一次會議）。", "id": "Q02-057", "l": 2, "ch": 0}, {"k": "簡", "s": [11, 12, 13, 14], "q": "簡答：「六個必須堅持」是什麼？各自的定位是什麼？", "sum": "一句白話：六個必須堅持就是看問題、做事情的六條原則——為人民、靠自己、守正又創新、抓問題、看整體、看天下。", "pts": ["必须坚持人民至上——根本价值立场", "必须坚持自信自立——内在精神特质", "必须坚持守正创新——鲜明理论品格", "必须坚持问题导向——重要实践要求", "必须坚持系统观念——基本思想和工作方法", "必须坚持胸怀天下——中国共产党人的境界格局"], "e": "講師：六個必須堅持「必須背過」，基本上就是標黃的部分。", "id": "Q02-058", "l": 2, "ch": 0}, {"s": [5], "src": "", "card": "C03-01", "tag": ["必背", "錯題"], "auto": 1, "k": "填", "q": "填空｜道路問題是第一位的問題（屬知識點1）：\n道路问题是关系党的事业（＿①＿）（＿②＿）的问题", "a": ["兴衰成败", "第一位"], "e": "走哪一條路，決定黨的事業成功還是失敗，所以「道路問題」排第一位。講師：「這一句話你必須要記住。」注意它屬於知識點1「中國特色社會主義是歷史和人民的選擇」，不是知識點2。", "id": "Q03-001", "l": 3, "ch": 1}, {"s": [5], "src": "", "card": "C03-01", "tag": ["必背", "錯題"], "auto": 1, "k": "默", "q": "默寫｜道路問題是第一位的問題（屬知識點1）", "model": "道路问题是关系党的事业兴衰成败第一位的问题", "pts": ["兴衰成败", "第一位"], "e": "記法：「路對了，事業才興」。歸屬口訣：「道路→選擇」（選路＝歷史和人民的選擇＝知識點1）。", "id": "Q03-002", "l": 3, "ch": 1}, {"s": [6], "src": "", "card": "C03-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜一個國家實行什麼主義的標準：\n一个国家实行什么样的主义，关键要看这个主义能否解决这个国家面临的（＿①＿）", "a": ["历史性课题"], "e": "判斷一個「主義」好不好，就看它能不能解決這個國家當時面對的大問題。", "id": "Q03-003", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜歷代領導人串聯記憶（中特道路的探索）：\n毛泽东同志——（＿①＿）、确立（＿②＿）；邓小平同志——中特开创人；江泽民同志——对什么是社会主义、怎样建设社会主义、（＿③＿）的认识；胡锦涛同志——（＿④＿）等重大问题；十八大以来——（＿⑤＿）", "a": ["新民主主义革命", "社会主义基本制度", "建设什么样的党、怎样建设党", "新形势下实现什么样的发展、怎样发展", "更好坚持和发展中国特色社会主义"], "e": "講師要求把歷代領導人「串聯着記憶」：毛澤東領導新民主主義革命、確立社會主義基本制度；鄧小平是中特的開創人；江澤民深化了對「建設什麼樣的黨、怎樣建設黨」的認識；胡錦濤回答「新形勢下實現什麼樣的發展、怎樣發展」；十八大以來是「更好堅持和發展中國特色社會主義」。", "id": "Q03-004", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師的串聯記憶中，與「毛泽东同志」對應的是：", "o": ["领导新民主主义革命、确立社会主义基本制度", "更好坚持和发展中国特色社会主义", "新形势下实现什么样的发展、怎样发展", "中国特色社会主义的开创人"], "a": 0, "e": "「毛泽东同志」→「领导新民主主义革命、确立社会主义基本制度」。記法：「毛定制度、鄧開中特、江建黨、胡講發展、十八大以來更好發展中特」。", "id": "Q03-005", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "串聯記憶：「毛泽东同志」對應「领导新民主主义革命、确立社会主义基本制度」。", "a": true, "e": "對。「毛泽东同志」→「领导新民主主义革命、确立社会主义基本制度」。", "id": "Q03-006", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師的串聯記憶中，與「邓小平同志」對應的是：", "o": ["中国特色社会主义的开创人", "新形势下实现什么样的发展、怎样发展", "更好坚持和发展中国特色社会主义", "深化对建设什么样的党、怎样建设党的认识"], "a": 0, "e": "「邓小平同志」→「中国特色社会主义的开创人」。記法：「毛定制度、鄧開中特、江建黨、胡講發展、十八大以來更好發展中特」。", "id": "Q03-007", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "串聯記憶：「邓小平同志」對應「深化对建设什么样的党、怎样建设党的认识」。", "a": false, "e": "錯。「邓小平同志」應對應「中国特色社会主义的开创人」，「深化对建设什么样的党、怎样建设党的认识」對應的是「江泽民同志」。", "id": "Q03-008", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師的串聯記憶中，與「江泽民同志」對應的是：", "o": ["深化对建设什么样的党、怎样建设党的认识", "中国特色社会主义的开创人", "领导新民主主义革命、确立社会主义基本制度", "更好坚持和发展中国特色社会主义"], "a": 0, "e": "「江泽民同志」→「深化对建设什么样的党、怎样建设党的认识」。記法：「毛定制度、鄧開中特、江建黨、胡講發展、十八大以來更好發展中特」。", "id": "Q03-009", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "串聯記憶：「江泽民同志」對應「深化对建设什么样的党、怎样建设党的认识」。", "a": true, "e": "對。「江泽民同志」→「深化对建设什么样的党、怎样建设党的认识」。", "id": "Q03-010", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師的串聯記憶中，與「胡锦涛同志」對應的是：", "o": ["新形势下实现什么样的发展、怎样发展", "深化对建设什么样的党、怎样建设党的认识", "更好坚持和发展中国特色社会主义", "领导新民主主义革命、确立社会主义基本制度"], "a": 0, "e": "「胡锦涛同志」→「新形势下实现什么样的发展、怎样发展」。記法：「毛定制度、鄧開中特、江建黨、胡講發展、十八大以來更好發展中特」。", "id": "Q03-011", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "串聯記憶：「胡锦涛同志」對應「更好坚持和发展中国特色社会主义」。", "a": false, "e": "錯。「胡锦涛同志」應對應「新形势下实现什么样的发展、怎样发展」，「更好坚持和发展中国特色社会主义」對應的是「十八大以来」。", "id": "Q03-012", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師的串聯記憶中，與「十八大以来」對應的是：", "o": ["更好坚持和发展中国特色社会主义", "领导新民主主义革命、确立社会主义基本制度", "新形势下实现什么样的发展、怎样发展", "深化对建设什么样的党、怎样建设党的认识"], "a": 0, "e": "「十八大以来」→「更好坚持和发展中国特色社会主义」。記法：「毛定制度、鄧開中特、江建黨、胡講發展、十八大以來更好發展中特」。", "id": "Q03-013", "l": 3, "ch": 1}, {"s": [7, 8, 9, 10], "src": "", "card": "C03-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "串聯記憶：「十八大以来」對應「更好坚持和发展中国特色社会主义」。", "a": true, "e": "對。「十八大以来」→「更好坚持和发展中国特色社会主义」。", "id": "Q03-014", "l": 3, "ch": 1}, {"s": [8], "src": "", "card": "C03-04", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜鄧小平是中特的開創人：\n中国特色社会主义道路是中国走向发展繁荣的正确道路；（＿①＿），是中国共产党人思考的（＿②＿）", "a": ["什么是社会主义、怎样建设社会主义", "基本问题"], "e": "中國特色社會主義是鄧小平開創的（十二大提出把它作為全黨實踐的主題）。講師提醒：如果選項說在毛澤東時期就出現「中特」，那是錯的。同頁黃字：「什麼是社會主義、怎樣建設社會主義，是中國共產黨人思考的基本問題」。", "id": "Q03-015", "l": 3, "ch": 1}, {"s": [11], "src": "", "card": "C03-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中特高度契合中國文化和價值觀念：\n中国特色社会主义高度契合中国文化和价值观念……是因为它回答了近代以来中华民族面临的（＿①＿）、指明了实现伟大复兴的（＿②＿）", "a": ["历史性课题", "正确道路"], "e": "中國特色社會主義受到中國人民擁護，因為它回答了近代以來中華民族遇到的大問題，也指出了民族復興的正確道路。", "id": "Q03-016", "l": 3, "ch": 1}, {"s": [12], "src": "", "card": "C03-06", "tag": ["論述題考點"], "auto": 1, "k": "填", "q": "填空｜中特是社會主義而不是其他什麼主義（三要點）：\n中国特色社会主义是科学社会主义（＿①＿）和中国社会发展（＿②＿）的辩证统一……既坚持了（＿③＿），又根据时代条件赋予其（＿④＿）", "a": ["理论逻辑", "历史逻辑", "科学社会主义基本原则", "鲜明的中国特色"], "e": "中國特色社會主義「歸根到底是社會主義」。理由：它是「理論邏輯（科學社會主義）＋歷史邏輯（中國發展）」的統一；它堅持了科學社會主義的基本原則，又加上中國特色。講師：「可能考大題的概率比較大。」", "id": "Q03-017", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "填", "q": "填空｜寫出科學社會主義的「新版本」——四個不是：\n当代中国的伟大社会变革，不是简单延续我国历史文化的（＿①＿），不是简单套用马克思主义经典作家设想的（＿②＿），不是其他国家社会主义实践的（＿③＿），也不是国外现代化发展的（＿④＿）", "a": ["母版", "模板", "再版", "翻版"], "e": "當代中國的偉大社會變革是「全新的版本」：不是照抄中國古代、不是照搬馬克思的設想、不是複製別的社會主義國家、更不是模仿外國的現代化。四個詞：母版、模板、再版、翻版（以投影片為準，第一個是「母版」）。", "id": "Q03-018", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "默", "q": "默寫｜寫出科學社會主義的「新版本」——四個不是", "model": "当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版", "pts": ["母版", "模板", "再版", "翻版"], "e": "記法：「母・模・再・翻」＝「古・馬・社・外」：古代歷史文化→母版（媽媽生的原版）；馬克思設想→模板（照着刻）；其他社會主義國家→再版（再印一次）；國外現代化→翻版（翻印外國的）。", "id": "Q03-019", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "單", "q": "「四個不是」：當代中國的偉大社會變革，不是「简单延续我国历史文化的＿＿」？", "o": ["母版", "模板", "再版", "翻版"], "a": 0, "e": "「简单延续我国历史文化的」→「母版」。記法：「母・模・再・翻」＝「古・馬・社・外」：古代歷史文化→母版（媽媽生的原版）；馬克思設想→模板（照着刻）；其他社會主義國家→再版（再印一次）；國外現代化→翻版（翻印外國的）。", "id": "Q03-020", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "判", "q": "「四個不是」中：不是「简单延续我国历史文化的母版」。", "a": true, "e": "對。「简单延续我国历史文化的」→「母版」。", "id": "Q03-021", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "單", "q": "「四個不是」：當代中國的偉大社會變革，不是「简单套用马克思主义经典作家设想的＿＿」？", "o": ["模板", "再版", "母版", "翻版"], "a": 0, "e": "「简单套用马克思主义经典作家设想的」→「模板」。記法：「母・模・再・翻」＝「古・馬・社・外」：古代歷史文化→母版（媽媽生的原版）；馬克思設想→模板（照着刻）；其他社會主義國家→再版（再印一次）；國外現代化→翻版（翻印外國的）。", "id": "Q03-022", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "判", "q": "「四個不是」中：不是「简单套用马克思主义经典作家设想的再版」。", "a": false, "e": "錯。「简单套用马克思主义经典作家设想的」應對應「模板」，「再版」對應的是「其他国家社会主义实践的」。", "id": "Q03-023", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "單", "q": "「四個不是」：當代中國的偉大社會變革，不是「其他国家社会主义实践的＿＿」？", "o": ["再版", "模板", "母版", "翻版"], "a": 0, "e": "「其他国家社会主义实践的」→「再版」。記法：「母・模・再・翻」＝「古・馬・社・外」：古代歷史文化→母版（媽媽生的原版）；馬克思設想→模板（照着刻）；其他社會主義國家→再版（再印一次）；國外現代化→翻版（翻印外國的）。", "id": "Q03-024", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "判", "q": "「四個不是」中：不是「其他国家社会主义实践的再版」。", "a": true, "e": "對。「其他国家社会主义实践的」→「再版」。", "id": "Q03-025", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "單", "q": "「四個不是」：當代中國的偉大社會變革，不是「国外现代化发展的＿＿」？", "o": ["翻版", "再版", "母版", "模板"], "a": 0, "e": "「国外现代化发展的」→「翻版」。記法：「母・模・再・翻」＝「古・馬・社・外」：古代歷史文化→母版（媽媽生的原版）；馬克思設想→模板（照着刻）；其他社會主義國家→再版（再印一次）；國外現代化→翻版（翻印外國的）。", "id": "Q03-026", "l": 3, "ch": 1}, {"s": [13], "src": "", "card": "C03-07", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "判", "q": "「四個不是」中：不是「国外现代化发展的母版」。", "a": false, "e": "錯。「国外现代化发展的」應對應「翻版」，「母版」對應的是「简单延续我国历史文化的」。", "id": "Q03-027", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "填", "q": "填空｜四個自信的角色（途徑・指南・保障・力量）：\n道路是（＿①＿），理论体系是（＿②＿），制度是（＿③＿），文化是（＿④＿），四者统一于中国特色社会主义伟大实践", "a": ["实现途径", "行动指南", "根本保障", "精神力量"], "e": "四個「自信」各自扮演一個角色：道路＝實現的途徑（走哪條路）；理論體系＝行動指南（怎麼想）；制度＝根本保障（靠什麼保證）；文化＝精神力量（心裏的力量）。四者統一於中國特色社會主義偉大實踐。", "id": "Q03-028", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "默", "q": "默寫｜四個自信的角色（途徑・指南・保障・力量）", "model": "道路是实现途径，理论体系是行动指南，制度是根本保障，文化是精神力量，四者统一于中国特色社会主义伟大实践", "pts": ["实现途径", "行动指南", "根本保障", "精神力量"], "e": "記法：「路・指・保・力」：走「路」靠途徑，「理論」當指南針，「制度」做保險，「文化」給力量。", "id": "Q03-029", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "單", "q": "中國特色社會主義的「道路」是：", "o": ["实现途径", "根本保障", "行动指南", "精神力量"], "a": 0, "e": "「道路」→「实现途径」。記法：「路・指・保・力」：走「路」靠途徑，「理論」當指南針，「制度」做保險，「文化」給力量。", "id": "Q03-030", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "判", "q": "中國特色社會主義的「道路」是「实现途径」。", "a": true, "e": "對。「道路」→「实现途径」。", "id": "Q03-031", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "單", "q": "中國特色社會主義的「理论体系」是：", "o": ["行动指南", "根本保障", "精神力量", "实现途径"], "a": 0, "e": "「理论体系」→「行动指南」。記法：「路・指・保・力」：走「路」靠途徑，「理論」當指南針，「制度」做保險，「文化」給力量。", "id": "Q03-032", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "判", "q": "中國特色社會主義的「理论体系」是「根本保障」。", "a": false, "e": "錯。「理论体系」應對應「行动指南」，「根本保障」對應的是「制度」。", "id": "Q03-033", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "單", "q": "中國特色社會主義的「制度」是：", "o": ["根本保障", "实现途径", "行动指南", "精神力量"], "a": 0, "e": "「制度」→「根本保障」。記法：「路・指・保・力」：走「路」靠途徑，「理論」當指南針，「制度」做保險，「文化」給力量。", "id": "Q03-034", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "判", "q": "中國特色社會主義的「制度」是「根本保障」。", "a": true, "e": "對。「制度」→「根本保障」。", "id": "Q03-035", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "單", "q": "中國特色社會主義的「文化」是：", "o": ["精神力量", "实现途径", "行动指南", "根本保障"], "a": 0, "e": "「文化」→「精神力量」。記法：「路・指・保・力」：走「路」靠途徑，「理論」當指南針，「制度」做保險，「文化」給力量。", "id": "Q03-036", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-08", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "判", "q": "中國特色社會主義的「文化」是「实现途径」。", "a": false, "e": "錯。「文化」應對應「精神力量」，「实现途径」對應的是「道路」。", "id": "Q03-037", "l": 3, "ch": 1}, {"s": [14], "src": "", "card": "C03-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜四個自信的來源與文化自信：\n“四个自信”来源于（＿①＿）、来源于（＿②＿）、来源于（＿③＿）；坚定“四个自信”，中国共产党和中国人民有着深厚的（＿④＿）", "a": ["实践", "人民", "真理", "根基和底气"], "e": "四個自信從哪裏來？來自實踐、來自人民、來自真理。中國共產黨和中國人民有深厚的根基和底氣。講師補充：文化自信是更加深沉、更加持久的自信。", "id": "Q03-038", "l": 3, "ch": 1}, {"k": "單", "s": [5], "q": "「道路問題是關係黨的事業興衰成敗第一位的問題」屬於第一章第一節的哪一個知識點？", "o": ["中國特色社會主義是歷史和人民的選擇", "中國特色社會主義是社會主義而不是其他什麼主義", "堅定四個自信", "新時代是新的歷史方位"], "a": 0, "e": "屬知識點1「中國特色社會主義是歷史和人民的選擇」（slide 005），不是知識點2。", "id": "Q03-039", "l": 3, "ch": 1}, {"k": "判", "s": [8], "q": "中國特色社會主義是在毛澤東時期開創的。", "a": false, "e": "錯。講師：「鄧小平同志是中特的開創人」，毛澤東時期出現中特「顯然是不對的」。", "id": "Q03-040", "l": 3, "ch": 1}, {"k": "單", "s": [13], "q": "「當代中國的偉大社會變革，不是簡單延續我國歷史文化的＿＿」，橫線處應填：", "o": ["母版", "模板", "再版", "翻版"], "a": 0, "e": "以投影片 03-013 為準：歷史文化→母版；馬克思主義經典作家設想→模板；其他國家社會主義實踐→再版；國外現代化發展→翻版。", "id": "Q03-041", "l": 3, "ch": 1}, {"k": "單", "s": [14], "q": "在中國特色社會主義中，「行動指南」是指：", "o": ["理論體系", "道路", "制度", "文化"], "a": 0, "e": "理論體系＝行動指南；道路＝實現途徑；制度＝根本保障；文化＝精神力量。", "id": "Q03-042", "l": 3, "ch": 1}, {"k": "判", "s": [14], "q": "中國特色社會主義制度是精神力量，中國特色社會主義文化是根本保障。", "a": false, "e": "錯（對調了）。制度＝根本保障；文化＝精神力量。", "id": "Q03-043", "l": 3, "ch": 1}, {"k": "多", "s": [14], "q": "「四個自信」來源於：", "o": ["實踐", "人民", "真理", "西方經驗"], "a": [0, 1, 2], "e": "原文：來源於實踐、來源於人民、來源於真理。", "id": "Q03-044", "l": 3, "ch": 1}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說哪一種自信是「更加深沉、更加持久的自信」？", "o": ["文化自信", "道路自信", "理論自信", "制度自信"], "a": 0, "e": "「文化自信是更加深沉、更加持久的自信」。", "id": "Q03-045", "l": 3, "ch": 1}, {"k": "單", "s": [6], "q": "一個國家實行什麼樣的主義，關鍵要看這個主義能否解決這個國家面臨的：", "o": ["歷史性課題", "主要矛盾", "發展難題", "國際挑戰"], "a": 0, "e": "原文：能否解決這個國家面臨的歷史性課題。", "id": "Q03-046", "l": 3, "ch": 1}, {"k": "多", "s": [12], "q": "關於「中國特色社會主義是社會主義而不是其他什麼主義」，以下說法正確的是：", "o": ["它是科學社會主義理論邏輯和中國社會發展歷史邏輯的辯證統一", "它堅持了科學社會主義基本原則", "它根據時代條件賦予科學社會主義鮮明的中國特色", "它是國外現代化發展的翻版"], "a": [0, 1, 2], "e": "前三項是投影片原意；「翻版」是四個「不是」之一，所以 D 錯。", "id": "Q03-047", "l": 3, "ch": 1}, {"k": "填", "s": [13], "q": "當代中國的偉大社會變革，不是簡單延續我國歷史文化的（＿①＿），不是簡單套用馬克思主義經典作家設想的（＿②＿），不是其他國家社會主義實踐的（＿③＿），也不是國外現代化發展的（＿④＿）。", "a": ["母版", "模板", "再版", "翻版"], "e": "口訣「母・模・再・翻」對應「古・馬・社・外」。", "id": "Q03-048", "l": 3, "ch": 1}, {"k": "論", "s": [12, 13], "q": "論述：為什麼說中國特色社會主義是社會主義而不是其他什麼主義？", "sum": "一句白話總結：中特既守住了科學社會主義的「根」（基本原則），又長出了中國的「枝葉」（中國特色），是全新的版本，所以它歸根到底是社會主義。", "pts": ["中国特色社会主义是科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一", "科学社会主义基本原则是马克思主义的核心内容；中国特色社会主义坚持了科学社会主义基本原则", "并根据新的时代条件赋予其鲜明的中国特色", "中国特色社会主义写出了科学社会主义的“新版本”", "当代中国的伟大社会变革不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版", "结论：它是社会主义，不是任何其他的什么主义"], "e": "講師：此部分「可能考大題的一個概率是比較大的」。論述時每點要展開一兩句，不要只寫關鍵詞。", "id": "Q03-049", "l": 3, "ch": 1}, {"s": [3], "src": "", "card": "C04-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜新時代是我國發展新的「歷史方位」：\n中国特色社会主义新时代是我国发展新的（＿①＿）", "a": ["历史方位"], "e": "「歷史方位」＝我們現在站在歷史上的哪個位置。中國特色社會主義進入新時代，就是我國發展的新位置、新的發展階段。講師：不是「歷史方向」，也不是「歷史定位」，「一個字都不能錯」。", "id": "Q04-001", "l": 4, "ch": 1}, {"s": [4], "src": "", "card": "C04-02", "tag": ["必背", "論述題考點", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜新時代的內涵（五個「的時代」）", "model": "（一）承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代；（二）决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代；（三）全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代；（四）全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代；（五）我国日益走近世界舞台中央、不断为人类作出更大贡献的时代", "pts": ["承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代", "决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代", "全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代", "全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代", "我国日益走近世界舞台中央、不断为人类作出更大贡献的时代"], "e": "記法：五個關鍵詞「承・決・富・夢・世」：承前啟後→決勝小康→共同富裕→中國夢→世界舞台。由過去→現在→人民→民族→世界。", "id": "Q04-002", "l": 4, "ch": 1}, {"s": [5], "src": "", "card": "C04-03", "tag": ["必背"], "auto": 1, "k": "填", "q": "填空｜新時代的意義（三個「意味着」）：\n（一）意味着近代以来久经磨难的中华民族迎来了从（＿①＿）的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景；（二）意味着科学社会主义在21世纪的中国焕发出强大（＿②＿），在世界上高高举起了中国特色社会主义伟大旗帜；（三）意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了（＿③＿），为解决人类问题贡献了（＿④＿）", "a": ["站起来、富起来到强起来", "生机活力", "全新选择", "中国智慧和中国方案"], "e": "進入新時代意味着什麼？（一）對民族：從站起來、富起來到強起來；（二）對科學社會主義：在21世紀的中國煥發生機活力；（三）對世界：給發展中國家走向現代化提供了全新選擇和中國方案。講師：三個意義也要背。", "id": "Q04-003", "l": 4, "ch": 1}, {"s": [5], "src": "", "card": "C04-03", "tag": ["必背"], "auto": 1, "k": "默", "q": "默寫｜新時代的意義（三個「意味着」）", "model": "（一）意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景；（二）意味着科学社会主义在21世纪的中国焕发出强大生机活力，在世界上高高举起了中国特色社会主义伟大旗帜；（三）意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案", "pts": ["中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景", "科学社会主义在21世纪的中国焕发出强大生机活力，高高举起了中国特色社会主义伟大旗帜", "拓展了发展中国家走向现代化的途径，提供了全新选择，为解决人类问题贡献了中国智慧和中国方案"], "e": "記法：「民族・科社・世界」三層：站富強→生機活力→全新選擇＋中國方案。", "id": "Q04-004", "l": 4, "ch": 1}, {"s": [6], "src": "", "card": "C04-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會主要矛盾的轉化：\n人民日益增长的（＿①＿）同（＿②＿）之间的矛盾，转化为人民日益增长的（＿③＿）和（＿④＿）之间的矛盾", "a": ["物质文化需要", "落后的社会生产", "美好生活需要", "不平衡不充分的发展"], "e": "以前的主要矛盾：人民想要更多物質文化，但生產落後；現在：人民想要更美好的生活，但發展不平衡、不充分。例子：以前是「吃不飽」，現在是「想吃得好、住得好、環境好」，但城鄉、地區發展還不平均。講師：主要矛盾變化是黨作出「進入新時代」重大判斷的根本依據。", "id": "Q04-005", "l": 4, "ch": 1}, {"s": [6], "src": "", "card": "C04-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜社會主要矛盾的轉化", "model": "人民日益增长的物质文化需要同落后的社会生产之间的矛盾，转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾", "pts": ["物质文化需要", "落后的社会生产", "美好生活需要", "不平衡不充分的发展"], "e": "記法：「舊：物質文化 vs 落後生產；新：美好生活 vs 不平衡不充分」。舊用「同」，新用「和」。", "id": "Q04-006", "l": 4, "ch": 1}, {"s": [7], "src": "", "card": "C04-05", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜進入新時代黨的主要任務：\n坚持和发展新时代中国特色社会主义，要牢牢把握（＿①＿），密切关注国际形势发展变化，始终扭住新时代党的（＿②＿），全面推进党和国家事业发展，以更加昂扬的姿态发展（＿③＿），为人类进步事业作出新的更大贡献", "a": ["国内国际两个大局", "主要任务", "科学社会主义"], "e": "講師：問「進入新時代的主要任務有哪些」，就把這一整段答進去。白話：顧好國內國際兩個大局、留意國際形勢、抓住黨的主要任務、全面推進事業、發展科學社會主義、為人類作貢獻。", "id": "Q04-007", "l": 4, "ch": 1}, {"s": [7], "src": "", "card": "C04-05", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜進入新時代黨的主要任務", "model": "坚持和发展新时代中国特色社会主义，要牢牢把握国内国际两个大局，密切关注国际形势发展变化，始终扭住新时代党的主要任务，全面推进党和国家事业发展，以更加昂扬的姿态发展科学社会主义，为人类进步事业作出新的更大贡献", "pts": ["国内国际两个大局", "主要任务", "科学社会主义"], "e": "記法：六步「兩局→形勢→任務→事業→科社→人類」。", "id": "Q04-008", "l": 4, "ch": 1}, {"s": [9], "src": "", "card": "C04-06", "tag": ["選擇題考點", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜美好生活需要的新內容：\n人民……在（＿①＿）等方面的要求日益增长……（＿②＿）", "a": ["民主、法治、公平、正义、安全、环境", "发展不平衡不充分"], "e": "人民的需要不只是吃穿，還要求民主、法治、公平、正義、安全、環境等方面更好；而問題主要是發展不平衡不充分。", "id": "Q04-009", "l": 4, "ch": 1}, {"s": [9], "src": "", "card": "C04-06", "tag": ["選擇題考點", "多選題考點"], "auto": 1, "k": "多", "q": "人民對美好生活的需要中，投影片黃字列出日益增長的要求有哪些方面？", "o": ["民主", "法治", "公平", "正义", "军事"], "a": [0, 1, 2, 3], "e": "正確：民主；法治；公平；正义。干擾項：军事。", "id": "Q04-010", "l": 4, "ch": 1}, {"s": [9], "src": "", "card": "C04-06", "tag": ["選擇題考點", "多選題考點"], "auto": 1, "k": "多", "q": "人民對美好生活的需要中，投影片黃字列出日益增長的要求有哪些方面？", "o": ["安全", "公平", "环境", "民主", "宗教"], "a": [0, 1, 2, 3], "e": "正確：安全；公平；环境；民主。干擾項：宗教。", "id": "Q04-011", "l": 4, "ch": 1}, {"s": [11], "src": "逐字稿", "card": "C04-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「一個變，兩個沒有變」：\n我国仍将长期处于（＿①＿）的基本国情没有变；我国仍然是世界上（＿②＿）的国际地位没有变", "a": ["社会主义初级阶段", "最大的发展中国家"], "e": "主要矛盾「變了」，但兩件事「沒變」：我國仍處於並將長期處於社會主義初級階段的基本國情沒變；我國是世界最大發展中國家的國際地位沒變。", "id": "Q04-012", "l": 4, "ch": 1}, {"s": [12, 13, 14, 15], "src": "", "card": "C04-08", "tag": ["了解", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新時代的偉大變革（13方面黃字關鍵詞）：\n党的领导全面加强；全面从严治党不断深化；（＿①＿）；全过程人民民主得到全面发展；……牢牢把握两岸关系（＿②＿）", "a": ["把握新发展阶段、贯彻新发展理念、构建新发展格局", "主导权和主动权"], "e": "新時代在13個方面發生偉大變革（與第02堂「十三個方面成就」對應）。黃字關鍵詞包括：黨的領導全面加強、全面從嚴治黨不斷深化、新發展階段／新發展理念／新發展格局、全過程人民民主、依法治國、核心價值觀、優秀傳統文化、人民生活、美麗中國、人民軍隊、國家安全、兩岸關係主導權和主動權、外交。講師：反腐敗鬥爭「取得了壓倒性勝利」。", "id": "Q04-013", "l": 4, "ch": 1}, {"s": [16], "src": "", "card": "C04-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜偉大變革的里程碑意義（1）：\n党同人民群众始终保持（＿①＿）", "a": ["血肉联系"], "e": "新時代的偉大變革使黨和人民群眾一直保持「血肉」般的緊密聯繫。", "id": "Q04-014", "l": 4, "ch": 1}, {"k": "單", "s": [3], "q": "中國特色社會主義新時代是我國發展新的：", "o": ["歷史方位", "歷史方向", "歷史定位", "歷史階段"], "a": 0, "e": "講師：「它不是歷史方向也不是歷史定位，它就叫做歷史方位，一個字都不能錯。」", "id": "Q04-015", "l": 4, "ch": 1}, {"k": "單", "s": [6], "q": "新時代我國社會主要矛盾是：", "o": ["人民日益增長的美好生活需要和不平衡不充分的發展之間的矛盾", "人民日益增長的物質文化需要同落後的社會生產之間的矛盾", "無產階級和資產階級之間的矛盾", "人民日益增長的美好生活需要同落後的社會生產之間的矛盾"], "a": 0, "e": "新矛盾：美好生活需要 vs 不平衡不充分的發展。B 是舊的主要矛盾；D 把新舊混在一起。", "id": "Q04-016", "l": 4, "ch": 1}, {"k": "判", "s": [11], "q": "社會主要矛盾轉化以後，我國已不再處於社會主義初級階段。", "a": false, "e": "錯。「一個變，兩個沒有變」：仍將長期處於社會主義初級階段，仍是世界最大的發展中國家。", "id": "Q04-017", "l": 4, "ch": 1}, {"k": "多", "s": [11], "q": "「一個變，兩個沒有變」中，「兩個沒有變」是指：", "o": ["我國仍將長期處於社會主義初級階段的基本國情沒有變", "我國是世界上最大的發展中國家的國際地位沒有變", "社會主要矛盾沒有變", "黨的基本路線的內容沒有變"], "a": [0, 1], "e": "變的是主要矛盾；不變的是初級階段國情、最大發展中國家地位。", "id": "Q04-018", "l": 4, "ch": 1}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師指出，社會主要矛盾的變化是黨作出「中國特色社會主義進入新時代」這一重大判斷的：", "o": ["根本依據", "重要條件", "歷史起點", "最終目標"], "a": 0, "e": "原話：主要矛盾變化「是我們黨做出中國特色社會主義進入到新時代重大判斷的根本依據」。", "id": "Q04-019", "l": 4, "ch": 1}, {"k": "單", "s": [5], "q": "新時代意味着近代以來久經磨難的中華民族迎來了：", "o": ["從站起來、富起來到強起來的偉大飛躍", "從富起來到強起來的歷史轉變", "從站起來到富起來的根本轉折", "從落後到領先的全面超越"], "a": 0, "e": "原文：從站起來、富起來到強起來的偉大飛躍。", "id": "Q04-020", "l": 4, "ch": 1}, {"k": "判", "s": [16], "q": "新時代偉大變革的里程碑意義之一是：黨同人民群眾始終保持血肉聯繫。", "a": true, "e": "對。講師提醒是「血肉聯繫」，不是普通聯繫。", "id": "Q04-021", "l": 4, "ch": 1}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，新時代反腐敗鬥爭最重要的一點是：", "o": ["取得了壓倒性勝利", "取得了階段性成果", "取得了決定性進展", "取得了全面勝利"], "a": 0, "e": "原話：「反腐敗的鬥爭，最重要的一點是取得了壓倒性的勝利。」", "id": "Q04-022", "l": 4, "ch": 1}, {"k": "論", "s": [4], "q": "論述：如何理解中國特色社會主義新時代的內涵？", "sum": "一句白話：新時代是接過前人的接力棒、建成現代化強國、讓大家一起富起來、實現中國夢、並為世界作更大貢獻的時代。", "pts": ["承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代", "决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代", "全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代", "全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代", "我国日益走近世界舞台中央、不断为人类作出更大贡献的时代"], "e": "講師：新時代內涵是大題考點（論述／簡答／材料分析第二小問），五點要背。", "id": "Q04-023", "l": 4, "ch": 1}, {"k": "簡", "s": [5], "q": "簡答：中國特色社會主義進入新時代的意義是什麼？", "sum": "一句白話：對中華民族、對科學社會主義、對世界都有重大意義。", "pts": ["中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景", "科学社会主义在21世纪的中国焕发出强大生机活力，高高举起了中国特色社会主义伟大旗帜", "拓展了发展中国家走向现代化的途径，提供了全新选择，为解决人类问题贡献了中国智慧和中国方案"], "e": "講師：「三個意義也一樣需要大家去背過。」", "id": "Q04-024", "l": 4, "ch": 1}, {"s": [3], "src": "", "card": "C05-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的基本理論＝行動指南；馬克思主義行：\n中国共产党为什么能，中国特色社会主义为什么好，归根到底是（＿①＿），是（＿②＿）", "a": ["马克思主义行", "中国化时代化的马克思主义行"], "e": "黨的基本理論是中國特色社會主義的「行動指南」。共產黨為什麼「能」、中特為什麼「好」？說到底是因為馬克思主義行，而且是中國化時代化的馬克思主義行。", "id": "Q05-001", "l": 5, "ch": 1}, {"s": [0], "src": "逐字稿", "card": "C05-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜習近平新時代中國特色社會主義思想的地位：\n习近平新时代中国特色社会主义思想是新时代中国共产党的（＿①＿），是新时代党和国家事业发展的（＿②＿）", "a": ["思想旗帜", "根本遵循"], "e": "這個思想是新時代共產黨的「思想旗幟」，也是新時代黨和國家事業發展的「根本遵循」（最根本要跟着做的規則）。", "id": "Q05-002", "l": 5, "ch": 1}, {"s": [4], "src": "", "card": "C05-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的基本路線（全文）：\n领导和团结全国各族人民，以（＿①＿）为中心，坚持（＿②＿），坚持（＿③＿），（＿④＿），为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗", "a": ["经济建设", "四项基本原则", "改革开放", "自力更生，艰苦创业"], "e": "基本路線是社會主義初級階段的「總路線圖」：一個中心（經濟建設）、兩個基本點（四項基本原則、改革開放），作風是自力更生、艱苦創業，目標是建成社會主義現代化強國。講師：要把基本路線全部背過。", "id": "Q05-003", "l": 5, "ch": 1}, {"s": [4], "src": "", "card": "C05-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜黨的基本路線（全文）", "model": "领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗", "pts": ["领导和团结全国各族人民", "以经济建设为中心（一个中心）", "坚持四项基本原则、坚持改革开放（两个基本点）", "自力更生，艰苦创业（作风）", "为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗（目标）"], "e": "記法：「一中心、兩基本點、一作風、一目標」＝經濟建設｜四項基本原則＋改革開放｜自力更生艱苦創業｜富民文和美強國。", "id": "Q05-004", "l": 5, "ch": 1}, {"s": [4], "src": "", "card": "C05-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：基本路線 vs 群眾路線：\n党的基本路线是（＿①＿）；群众路线是（＿②＿）", "a": ["国家的生命线、人民的幸福线", "党的生命线"], "e": "兩條「生命線」別搞混！黨的「基本路線」是「國家的」生命線、人民的幸福線；「群眾路線」是「黨的」生命線（第14堂再講：群眾路線是黨的根本工作方法）。講師：「一定注意他們之間是有區別的。」", "id": "Q05-005", "l": 5, "ch": 1}, {"s": [4], "src": "", "card": "C05-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師辨析：「党的基本路线」是：", "o": ["国家的生命线、人民的幸福线", "党的生命线", "党的根本政治立场", "国家的根本领导制度"], "a": 0, "e": "「党的基本路线」→「国家的生命线、人民的幸福线」。記法：「基本→國家；群眾→黨」。記：「基本國策顧國家，群眾路線顧自家（黨）」。", "id": "Q05-006", "l": 5, "ch": 1}, {"s": [4], "src": "", "card": "C05-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「党的基本路线」是国家的生命线、人民的幸福线。", "a": true, "e": "對。「党的基本路线」→「国家的生命线、人民的幸福线」。", "id": "Q05-007", "l": 5, "ch": 1}, {"s": [4], "src": "", "card": "C05-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師辨析：「群众路线」是：", "o": ["党的生命线", "国家的生命线、人民的幸福线", "党的根本政治立场", "国家的根本领导制度"], "a": 0, "e": "「群众路线」→「党的生命线」。記法：「基本→國家；群眾→黨」。記：「基本國策顧國家，群眾路線顧自家（黨）」。", "id": "Q05-008", "l": 5, "ch": 1}, {"s": [4], "src": "", "card": "C05-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「群众路线」是国家的生命线、人民的幸福线。", "a": false, "e": "錯。「群众路线」應對應「党的生命线」，「国家的生命线、人民的幸福线」對應的是「党的基本路线」。", "id": "Q05-009", "l": 5, "ch": 1}, {"s": [5], "src": "", "card": "C05-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的基本方略＝十四個堅持：\n党的基本方略：党的十九大概括的（＿①＿）", "a": ["“十四个坚持”"], "e": "「基本方略」就是十九大概括的「十四個堅持」（第02堂已背）。三個「基本」：基本理論＝行動指南；基本路線＝國家生命線、人民幸福線；基本方略＝十四個堅持。", "id": "Q05-010", "l": 5, "ch": 1}, {"s": [5], "src": "", "card": "C05-05", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "三個「基本」中，「党的基本理论」對應：", "o": ["中国特色社会主义的行动指南", "党的十九大概括的“十四个坚持”", "国家的生命线、人民的幸福线"], "a": 0, "e": "「党的基本理论」→「中国特色社会主义的行动指南」。記法：「理論＝指南；路線＝生命線；方略＝十四條」。", "id": "Q05-011", "l": 5, "ch": 1}, {"s": [5], "src": "", "card": "C05-05", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「党的基本理论」對應「中国特色社会主义的行动指南」。", "a": true, "e": "對。「党的基本理论」→「中国特色社会主义的行动指南」。", "id": "Q05-012", "l": 5, "ch": 1}, {"s": [5], "src": "", "card": "C05-05", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "三個「基本」中，「党的基本路线」對應：", "o": ["国家的生命线、人民的幸福线", "中国特色社会主义的行动指南", "党的十九大概括的“十四个坚持”"], "a": 0, "e": "「党的基本路线」→「国家的生命线、人民的幸福线」。記法：「理論＝指南；路線＝生命線；方略＝十四條」。", "id": "Q05-013", "l": 5, "ch": 1}, {"s": [5], "src": "", "card": "C05-05", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「党的基本路线」對應「党的十九大概括的“十四个坚持”」。", "a": false, "e": "錯。「党的基本路线」應對應「国家的生命线、人民的幸福线」，「党的十九大概括的“十四个坚持”」對應的是「党的基本方略」。", "id": "Q05-014", "l": 5, "ch": 1}, {"s": [5], "src": "", "card": "C05-05", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "三個「基本」中，「党的基本方略」對應：", "o": ["党的十九大概括的“十四个坚持”", "国家的生命线、人民的幸福线", "中国特色社会主义的行动指南"], "a": 0, "e": "「党的基本方略」→「党的十九大概括的“十四个坚持”」。記法：「理論＝指南；路線＝生命線；方略＝十四條」。", "id": "Q05-015", "l": 5, "ch": 1}, {"s": [5], "src": "", "card": "C05-05", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「党的基本方略」對應「党的十九大概括的“十四个坚持”」。", "a": true, "e": "對。「党的基本方略」→「党的十九大概括的“十四个坚持”」。", "id": "Q05-016", "l": 5, "ch": 1}, {"s": [6], "src": "", "card": "C05-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「五位一體」的形成過程：\n两个文明（邓小平）→（＿①＿）→（＿②＿）→（＿③＿）", "a": ["三位一体", "四位一体", "五位一体"], "e": "總體布局是一步步擴大的：先是鄧小平講的「兩個文明」（物質文明、精神文明），再到三位一體、四位一體，最後到經濟、政治、文化、社會、生態文明「五位一體」。", "id": "Q05-017", "l": 5, "ch": 1}, {"s": [7], "src": "", "card": "C05-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：五位一體＝總體布局 vs 四個全面＝戰略布局：\n五位一体是（＿①＿），四个全面是（＿②＿）；具有内在理论和实践逻辑关系的统一体来把握和推进，努力做到（＿③＿）", "a": ["总体布局", "战略布局", "相辅相成、相互促进、相得益彰"], "e": "兩個都是「布局」，但不同：五位一體是「總體」布局（五個方面一起建設），四個全面是「戰略」布局（四件大事）。四個全面要作為「有內在邏輯關係的統一體」去推進，做到相輔相成、相互促進、相得益彰。", "id": "Q05-018", "l": 5, "ch": 1}, {"s": [7], "src": "", "card": "C05-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「“五位一体”」是中國特色社會主義事業的：", "o": ["总体布局", "战略布局", "战略目标", "根本方略"], "a": 0, "e": "「“五位一体”」→「总体布局」。記法：「五總四戰」；統一體三個「相」：相輔相成、相互促進、相得益彰。", "id": "Q05-019", "l": 5, "ch": 1}, {"s": [7], "src": "", "card": "C05-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「“五位一体”」是总体布局。", "a": true, "e": "對。「“五位一体”」→「总体布局」。", "id": "Q05-020", "l": 5, "ch": 1}, {"s": [7], "src": "", "card": "C05-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「“四个全面”」是中國特色社會主義事業的：", "o": ["战略布局", "总体布局", "战略目标", "根本方略"], "a": 0, "e": "「“四个全面”」→「战略布局」。記法：「五總四戰」；統一體三個「相」：相輔相成、相互促進、相得益彰。", "id": "Q05-021", "l": 5, "ch": 1}, {"s": [7], "src": "", "card": "C05-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「“四个全面”」是总体布局。", "a": false, "e": "錯。「“四个全面”」應對應「战略布局」，「总体布局」對應的是「“五位一体”」。", "id": "Q05-022", "l": 5, "ch": 1}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜四個全面：一個戰略目標＋三個戰略舉措：\n（＿①＿）——战略目标；（＿②＿）——三大战略举措", "a": ["全面建设社会主义现代化国家", "全面深化改革、全面依法治国、全面从严治党"], "e": "四個全面裏，「全面建設社會主義現代化國家」是要到達的「目標」；其餘三個（全面深化改革、全面依法治國、全面從嚴治黨）是達到目標的「手段（舉措）」。以前叫「全面建成小康社會」，現已改為「全面建設社會主義現代化國家」。", "id": "Q05-023", "l": 5, "ch": 1}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在「四個全面」中，「全面建设社会主义现代化国家」屬於：", "o": ["战略目标", "战略举措", "总体布局", "战略方针"], "a": 0, "e": "「全面建设社会主义现代化国家」→「战略目标」。記法：「一目標三舉措」：目標是「現代化國家」，舉措是「改・法・黨」。", "id": "Q05-024", "l": 5, "ch": 1}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "在「四個全面」中，「全面建设社会主义现代化国家」屬於战略目标。", "a": true, "e": "對。「全面建设社会主义现代化国家」→「战略目标」。", "id": "Q05-025", "l": 5, "ch": 1}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在「四個全面」中，「全面深化改革」屬於：", "o": ["战略举措", "战略目标", "总体布局", "战略方针"], "a": 0, "e": "「全面深化改革」→「战略举措」。記法：「一目標三舉措」：目標是「現代化國家」，舉措是「改・法・黨」。", "id": "Q05-026", "l": 5, "ch": 1}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "在「四個全面」中，「全面深化改革」屬於战略目标。", "a": false, "e": "錯。「全面深化改革」應對應「战略举措」，「战略目标」對應的是「全面建设社会主义现代化国家」。", "id": "Q05-027", "l": 5, "ch": 1}, {"s": [9], "src": "", "card": "C05-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜推動中國特色社會主義不斷開拓前進：\n（1）社会主义是一个（＿①＿）的实践过程；（2）社会主义发展道路充满着（＿②＿）", "a": ["不断发展和完善", "险阻曲折"], "e": "社會主義不是一次就完成的，要不斷發展和完善；而且發展的路上會有困難和曲折。", "id": "Q05-028", "l": 5, "ch": 1}, {"k": "單", "s": [4], "q": "黨的基本路線是：", "o": ["國家的生命線、人民的幸福線", "黨的生命線", "黨的根本工作方法", "黨的根本政治立場"], "a": 0, "e": "基本路線＝國家的生命線、人民的幸福線；群眾路線＝黨的生命線、根本工作方法。", "id": "Q05-029", "l": 5, "ch": 1}, {"k": "判", "s": [4], "q": "群眾路線是國家的生命線、人民的幸福線。", "a": false, "e": "錯。這是「基本路線」。群眾路線是「黨的生命線」。", "id": "Q05-030", "l": 5, "ch": 1}, {"k": "單", "s": [4], "q": "黨的基本路線中，「一個中心」是指：", "o": ["以經濟建設為中心", "以人民為中心", "以黨的建設為中心", "以改革開放為中心"], "a": 0, "e": "一個中心＝以經濟建設為中心；兩個基本點＝堅持四項基本原則、堅持改革開放。", "id": "Q05-031", "l": 5, "ch": 1}, {"k": "多", "s": [4], "q": "黨的基本路線中，「兩個基本點」是：", "o": ["堅持四項基本原則", "堅持改革開放", "以經濟建設為中心", "自力更生、艱苦創業"], "a": [0, 1], "e": "兩個基本點＝四項基本原則＋改革開放。以經濟建設為中心是「一個中心」；自力更生艱苦創業是作風。", "id": "Q05-032", "l": 5, "ch": 1}, {"k": "單", "s": [8], "q": "「四個全面」中處於戰略目標位置的是：", "o": ["全面建設社會主義現代化國家", "全面深化改革", "全面依法治國", "全面從嚴治黨"], "a": 0, "e": "第一個全面是戰略目標，其餘三個是戰略舉措。", "id": "Q05-033", "l": 5, "ch": 1}, {"k": "多", "s": [8], "q": "「四個全面」中屬於戰略舉措的有：", "o": ["全面深化改革", "全面依法治國", "全面從嚴治黨", "全面建設社會主義現代化國家"], "a": [0, 1, 2], "e": "三大戰略舉措＝全面深化改革、全面依法治國、全面從嚴治黨。", "id": "Q05-034", "l": 5, "ch": 1}, {"k": "單", "s": [3], "q": "黨的基本理論是中國特色社會主義的：", "o": ["行動指南", "生命線", "根本保障", "精神力量"], "a": 0, "e": "講師：「黨的基本理論是什麼？是中國特色社會主義的行動指南。」", "id": "Q05-035", "l": 5, "ch": 1}, {"k": "填", "s": [7], "q": "「四個全面」要作為具有內在理論和實踐邏輯關係的統一體來把握和推進，努力做到（＿①＿）、（＿②＿）、（＿③＿）。", "a": ["相辅相成", "相互促进", "相得益彰"], "e": "三個「相」，順序：相輔相成、相互促進、相得益彰。", "id": "Q05-036", "l": 5, "ch": 1}, {"k": "判", "s": [9], "q": "社會主義是一個不斷發展和完善的實踐過程，社會主義發展道路充滿着險阻曲折。", "a": true, "e": "對。這是投影片兩句黃字。", "id": "Q05-037", "l": 5, "ch": 1}, {"s": [5], "src": "", "card": "C06-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中國夢的提出與「最偉大的夢想」：\n（＿①＿），参观（＿②＿）展览，首次提出“中国梦”；实现中华民族伟大复兴，就是中华民族近代以来（＿③＿）", "a": ["2012年11月", "《复兴之路》", "最伟大的梦想"], "e": "2012年11月，習近平參觀《復興之路》展覽時首次提出「中國夢」。中華民族近代以來最偉大的夢想，就是實現中華民族偉大復興。講師：這句就是選擇題考點。", "id": "Q06-001", "l": 6, "ch": 2}, {"s": [6], "src": "", "card": "C06-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜中國夢的本質：\n中国梦的本质是（＿①＿）、（＿②＿）、（＿③＿）", "a": ["国家富强", "民族振兴", "人民幸福"], "e": "中國夢的本質是三件事：國家富強、民族振興、人民幸福。講師：「多選題，多選題」，要記。", "id": "Q06-002", "l": 6, "ch": 2}, {"s": [6], "src": "", "card": "C06-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "多", "q": "中國夢的本質是：", "o": ["国家富强", "民族振兴", "人民幸福", "社会和谐", "文化繁荣"], "a": [0, 1, 2], "e": "正確：国家富强；民族振兴；人民幸福。干擾項：社会和谐；文化繁荣。", "id": "Q06-003", "l": 6, "ch": 2}, {"s": [7], "src": "", "card": "C06-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜全面建成小康社會的內涵：「小康」與「全面」：\n‘小康’讲的是（＿①＿），‘全面’讲的是发展的（＿②＿）", "a": ["发展水平", "平衡性、协调性、可持续性"], "e": "「小康」講的是發展到什麼「水平」；「全面」講的是發展是否平衡、協調、可持續——即不能落下任何地區、任何人。講師：更重要、更難做到的是「全面」，「這個才是考點」。", "id": "Q06-004", "l": 6, "ch": 2}, {"s": [7], "src": "", "card": "C06-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "全面建成小康社會中，「“小康”」講的是：", "o": ["发展水平", "发展的平衡性、协调性、可持续性", "发展速度", "发展的质量和效益"], "a": 0, "e": "「“小康”」→「发展水平」。記法：「小康看高度（水平），全面看寬度（平衡、協調、可持續）」。", "id": "Q06-005", "l": 6, "ch": 2}, {"s": [7], "src": "", "card": "C06-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "全面建成小康社會中，“小康”講的是发展水平。", "a": true, "e": "對。「“小康”」→「发展水平」。", "id": "Q06-006", "l": 6, "ch": 2}, {"s": [7], "src": "", "card": "C06-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "全面建成小康社會中，「“全面”」講的是：", "o": ["发展的平衡性、协调性、可持续性", "发展水平", "发展速度", "发展的质量和效益"], "a": 0, "e": "「“全面”」→「发展的平衡性、协调性、可持续性」。記法：「小康看高度（水平），全面看寬度（平衡、協調、可持續）」。", "id": "Q06-007", "l": 6, "ch": 2}, {"s": [7], "src": "", "card": "C06-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "全面建成小康社會中，“全面”講的是发展水平。", "a": false, "e": "錯。「“全面”」應對應「发展的平衡性、协调性、可持续性」，「发展水平」對應的是「“小康”」。", "id": "Q06-008", "l": 6, "ch": 2}, {"s": [8], "src": "", "card": "C06-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜小康目標實現：歷史性解決「絕對貧困」：\n（＿①＿）……历史性地解决了（＿②＿）问题", "a": ["2021年7月1日", "绝对贫困"], "e": "2021年7月1日宣告全面建成小康社會，歷史性地解決了「絕對貧困」問題。講師：注意迷惑選項「相對貧困」——解決的是絕對貧困，不是相對貧困（相對貧困仍然存在）。", "id": "Q06-009", "l": 6, "ch": 2}, {"s": [9, 10], "src": "", "card": "C06-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜全面建成小康社會的意義（歷史・實踐・世界）：\n（1）全面建成小康社会是实现中华民族伟大复兴中国梦的（＿①＿）；（2）高质量完成了社会主义现代化建设“三步走”战略的（＿②＿）；（3）全面建成小康社会，探索了人类解决贫困问题的（＿③＿），为推动人类文明进步作出了重大贡献", "a": ["关键一步", "第二步", "新路径"], "e": "三個意義：歷史意義＝實現中國夢的關鍵一步；實踐意義＝高質量完成「三步走」的第二步；世界意義＝探索了人類解決貧困問題的新路徑（世界意義只記這句即可）。", "id": "Q06-010", "l": 6, "ch": 2}, {"s": [9, 10], "src": "", "card": "C06-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "全面建成小康社會的「历史意义」是：", "o": ["实现中华民族伟大复兴中国梦的关键一步", "探索了人类解决贫困问题的新路径", "高质量完成了社会主义现代化建设“三步走”战略的第二步"], "a": 0, "e": "「历史意义」→「实现中华民族伟大复兴中国梦的关键一步」。記法：「關鍵一步・第二步・新路徑」＝歷史・實踐・世界。", "id": "Q06-011", "l": 6, "ch": 2}, {"s": [9, 10], "src": "", "card": "C06-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "全面建成小康社會的历史意义是：实现中华民族伟大复兴中国梦的关键一步。", "a": true, "e": "對。「历史意义」→「实现中华民族伟大复兴中国梦的关键一步」。", "id": "Q06-012", "l": 6, "ch": 2}, {"s": [9, 10], "src": "", "card": "C06-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "全面建成小康社會的「实践意义」是：", "o": ["高质量完成了社会主义现代化建设“三步走”战略的第二步", "实现中华民族伟大复兴中国梦的关键一步", "探索了人类解决贫困问题的新路径"], "a": 0, "e": "「实践意义」→「高质量完成了社会主义现代化建设“三步走”战略的第二步」。記法：「關鍵一步・第二步・新路徑」＝歷史・實踐・世界。", "id": "Q06-013", "l": 6, "ch": 2}, {"s": [9, 10], "src": "", "card": "C06-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "全面建成小康社會的实践意义是：探索了人类解决贫困问题的新路径。", "a": false, "e": "錯。「实践意义」應對應「高质量完成了社会主义现代化建设“三步走”战略的第二步」，「探索了人类解决贫困问题的新路径」對應的是「世界意义」。", "id": "Q06-014", "l": 6, "ch": 2}, {"s": [9, 10], "src": "", "card": "C06-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "全面建成小康社會的「世界意义」是：", "o": ["探索了人类解决贫困问题的新路径", "实现中华民族伟大复兴中国梦的关键一步", "高质量完成了社会主义现代化建设“三步走”战略的第二步"], "a": 0, "e": "「世界意义」→「探索了人类解决贫困问题的新路径」。記法：「關鍵一步・第二步・新路徑」＝歷史・實踐・世界。", "id": "Q06-015", "l": 6, "ch": 2}, {"s": [9, 10], "src": "", "card": "C06-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "全面建成小康社會的世界意义是：探索了人类解决贫困问题的新路径。", "a": true, "e": "對。「世界意义」→「探索了人类解决贫困问题的新路径」。", "id": "Q06-016", "l": 6, "ch": 2}, {"s": [11], "src": "", "card": "C06-06", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "填", "q": "填空｜二十大「兩步走」總的戰略安排：\n（1）从2020年到2035年（＿①＿）；（2）从2035年到本世纪中叶把我国建成（＿②＿）", "a": ["基本实现社会主义现代化", "富强民主文明和谐美丽的社会主义现代化强国"], "e": "黨的二十大明確：分兩步走。第一步 2020—2035 年「基本」實現社會主義現代化；第二步 2035 年到本世紀中葉（2050年）建成富強民主文明和諧美麗的社會主義現代化強國。講師：必須背誦，注意「基本」二字。", "id": "Q06-017", "l": 6, "ch": 2}, {"s": [11], "src": "", "card": "C06-06", "tag": ["必背", "錯題", "易混"], "auto": 1, "k": "默", "q": "默寫｜二十大「兩步走」總的戰略安排", "model": "（1）从2020年到2035年基本实现社会主义现代化；（2）从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国", "pts": ["从2020年到2035年基本实现社会主义现代化", "从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国"], "e": "記法：「15＋15」：2020→2035（15年，基本實現）→2050（15年，建成強國）。2035 一律配「基本」。", "id": "Q06-018", "l": 6, "ch": 2}, {"s": [11], "src": "", "card": "C06-07", "tag": ["必背", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：十九大的戰略安排 vs 二十大兩步走：\n党的（＿①＿）作出了从（＿②＿）到（＿③＿），再到（＿④＿）的战略安排；党的（＿⑤＿）进一步明确，全面建成社会主义现代化强国总的战略安排是（＿⑥＿）", "a": ["十九大", "全面建成小康社会", "基本实现社会主义现代化", "全面建成社会主义现代化强国", "二十大", "分两步走"], "e": "投影片【注意】：十九大作出的是「從全面建成小康社會到基本實現社會主義現代化，再到全面建成社會主義現代化強國」的戰略安排（三段：小康→基本現代化→強國）；二十大「進一步明確」全面建成現代化強國分兩步走（2020—2035、2035—本世紀中葉）。", "id": "Q06-019", "l": 6, "ch": 2}, {"s": [11], "src": "", "card": "C06-07", "tag": ["必背", "易混"], "auto": 1, "k": "單", "q": "下列哪一項是「党的十九大」的表述？", "o": ["作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排", "进一步明确全面建成社会主义现代化强国总的战略安排是分两步走", "首次提出“中国梦”"], "a": 0, "e": "「党的十九大」→「作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排」。記法：十九大＝「小康→基本→強國」三個台階；二十大＝「兩步走」(2035/2050)。", "id": "Q06-020", "l": 6, "ch": 2}, {"s": [11], "src": "", "card": "C06-07", "tag": ["必背", "易混"], "auto": 1, "k": "判", "q": "「党的十九大」作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排。", "a": true, "e": "對。「党的十九大」→「作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排」。", "id": "Q06-021", "l": 6, "ch": 2}, {"s": [11], "src": "", "card": "C06-07", "tag": ["必背", "易混"], "auto": 1, "k": "單", "q": "下列哪一項是「党的二十大」的表述？", "o": ["进一步明确全面建成社会主义现代化强国总的战略安排是分两步走", "作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排", "首次提出“中国梦”"], "a": 0, "e": "「党的二十大」→「进一步明确全面建成社会主义现代化强国总的战略安排是分两步走」。記法：十九大＝「小康→基本→強國」三個台階；二十大＝「兩步走」(2035/2050)。", "id": "Q06-022", "l": 6, "ch": 2}, {"s": [11], "src": "", "card": "C06-07", "tag": ["必背", "易混"], "auto": 1, "k": "判", "q": "「党的二十大」作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排。", "a": false, "e": "錯。「党的二十大」應對應「进一步明确全面建成社会主义现代化强国总的战略安排是分两步走」，「作出了从全面建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排」對應的是「党的十九大」。", "id": "Q06-023", "l": 6, "ch": 2}, {"s": [12, 13], "src": "", "card": "C06-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜到2035年我國發展的總體目標（黃字關鍵詞）：\n（＿①＿）……；（＿②＿）……；（＿③＿）……；（＿④＿）……；（＿⑤＿）……；（＿⑥＿）……", "a": ["经济实力", "治理体系和治理能力现代化", "教育强国", "人民生活更加幸福美好", "绿色生产生活方式", "军队现代化"], "e": "到2035年的目標涉及六方面：經濟實力（及科技、綜合國力）大躍升；基本實現國家治理體系和治理能力現代化；建成教育強國等；人民生活更加幸福美好；廣泛形成綠色生產生活方式（碳排放）；國家安全與軍隊現代化。講師圈出兩處「基本」。", "id": "Q06-024", "l": 6, "ch": 2}, {"k": "單", "s": [5], "q": "中華民族近代以來最偉大的夢想是：", "o": ["實現中華民族偉大復興", "全面建成小康社會", "實現共同富裕", "建成社會主義現代化強國"], "a": 0, "e": "講師：「實現中華民族偉大復興，就是中華民族近代以來最偉大的夢想」，這是選擇題考點。", "id": "Q06-025", "l": 6, "ch": 2}, {"k": "單", "s": [5], "q": "「中國夢」首次提出的時間是：", "o": ["2012年11月", "2017年10月", "2021年7月", "2013年3月"], "a": 0, "e": "2012年11月參觀《復興之路》展覽時首次提出。", "id": "Q06-026", "l": 6, "ch": 2}, {"k": "單", "s": [8], "q": "全面建成小康社會，歷史性地解決了：", "o": ["絕對貧困問題", "相對貧困問題", "發展不平衡問題", "城鄉差距問題"], "a": 0, "e": "講師：注意迷惑選項「相對貧困」——解決的是「絕對貧困」。", "id": "Q06-027", "l": 6, "ch": 2}, {"k": "判", "s": [8], "q": "全面建成小康社會意味着我國已經解決了相對貧困問題。", "a": false, "e": "錯。解決的是「絕對貧困」，不是相對貧困。", "id": "Q06-028", "l": 6, "ch": 2}, {"k": "單", "s": [7], "q": "全面建成小康社會中，「全面」講的是：", "o": ["發展的平衡性、協調性、可持續性", "發展水平", "發展速度", "發展的質量和效益"], "a": 0, "e": "「小康」講發展水平；「全面」講平衡性、協調性、可持續性。", "id": "Q06-029", "l": 6, "ch": 2}, {"k": "單", "s": [11], "q": "按照二十大的戰略安排，從2020年到2035年要：", "o": ["基本實現社會主義現代化", "全面建成社會主義現代化強國", "全面建成小康社會", "實現中華民族偉大復興"], "a": 0, "e": "2035年＝「基本」實現社會主義現代化；本世紀中葉＝建成社會主義現代化強國。", "id": "Q06-030", "l": 6, "ch": 2}, {"k": "判", "s": [11], "q": "按二十大部署，到2035年要把我國建成富強民主文明和諧美麗的社會主義現代化強國。", "a": false, "e": "錯。2035年是「基本實現社會主義現代化」；建成現代化強國是2035年到本世紀中葉（2050年）。", "id": "Q06-031", "l": 6, "ch": 2}, {"k": "單", "s": [11], "q": "「從全面建成小康社會到基本實現社會主義現代化，再到全面建成社會主義現代化強國」的戰略安排是哪次大會作出的？", "o": ["黨的十九大", "黨的二十大", "黨的十八大", "黨的十九屆六中全會"], "a": 0, "e": "投影片【注意】：這是十九大的表述；二十大進一步明確「分兩步走」。", "id": "Q06-032", "l": 6, "ch": 2}, {"k": "填", "s": [11], "q": "二十大明確：（1）從2020年到（＿①＿）年基本實現社會主義現代化；（2）從2035年到（＿②＿）把我國建成富強民 為了誰→靠什麼動力→用什麼精神。", "id": "Q08-002", "l": 8, "ch": 2}, {"s": [3, 4, 5], "src": "", "card": "C08-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "推進中國式現代化需要牢牢把握的重大原則有：", "o": ["坚持和加强党的全面领导", "坚持中国特色社会主义道路", "坚持以人民为中心的发展思想", "坚持深化改革开放", "坚持效率优先"], "a": [0, 1, 2, 3], "e": "正確：坚持和加强党的全面领导；坚持中国特色社会主义道路；坚持以人民为中心的发展思想；坚持深化改革开放。干擾項：坚持效率优先。", "id": "Q08-003", "l": 8, "ch": 2}, {"s": [3, 4, 5], "src": "", "card": "C08-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "推進中國式現代化需要牢牢把握的重大原則有：", "o": ["坚持以人民为中心的发展思想", "坚持发扬斗争精神", "坚持和加强党的全面领导", "坚持深化改革开放", "坚持效率优先"], "a": [0, 1, 2, 3], "e": "正確：坚持以人民为中心的发展思想；坚持发扬斗争精神；坚持和加强党的全面领导；坚持深化改革开放。干擾項：坚持效率优先。", "id": "Q08-004", "l": 8, "ch": 2}, {"s": [3], "src": "逐字稿", "card": "C08-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨是主心骨和領航者；舉旗與走路：\n中国共产党是全面建设社会主义现代化国家的（＿①＿）和（＿②＿）；举的是（＿③＿）的旗帜，走的是中国特色社会主义的道路", "a": ["主心骨", "领航者", "中国特色社会主义"], "e": "中國共產黨是全面建設社會主義現代化國家的「主心骨」和「領航者」。中國式現代化舉的是中國特色社會主義的旗幟，走的是中國特色社會主義的道路——講師說要搞清楚。", "id": "Q08-005", "l": 8, "ch": 2}, {"s": [6, 7, 8, 9, 10, 11], "src": "", "card": "C08-03", "tag": ["必背", "多選題考點"], "auto": 1, "k": "默", "q": "默寫｜需要正確處理的六組重大關係", "model": "顶层设计与实践探索；战略与策略；守正与创新；效率与公平；活力与秩序；自立自强与对外开放", "pts": ["顶层设计与实践探索", "战略与策略", "守正与创新", "效率与公平", "活力与秩序", "自立自强与对外开放"], "e": "記法：六對「上下・長短・新舊・快公・活序・內外」：頂層vs實踐（上下）、戰略vs策略（長短）、守正vs創新（舊新）、效率vs公平、活力vs秩序、自立vs開放（內外）。", "id": "Q08-006", "l": 8, "ch": 2}, {"s": [6, 7, 8, 9, 10, 11], "src": "", "card": "C08-03", "tag": ["必背", "多選題考點"], "auto": 1, "k": "多", "q": "推進中國式現代化需要正確處理的重大關係包括：", "o": ["顶层设计与实践探索", "战略与策略", "守正与创新", "效率与公平", "政治与法治"], "a": [0, 1, 2, 3], "e": "正確：顶层设计与实践探索；战略与策略；守正与创新；效率与公平。干擾項：政治与法治。", "id": "Q08-007", "l": 8, "ch": 2}, {"s": [6, 7, 8, 9, 10, 11], "src": "", "card": "C08-03", "tag": ["必背", "多選題考點"], "auto": 1, "k": "多", "q": "推進中國式現代化需要正確處理的重大關係包括：", "o": ["活力与秩序", "自立自强与对外开放", "顶层设计与实践探索", "守正与创新", "政治与法治"], "a": [0, 1, 2, 3], "e": "正確：活力与秩序；自立自强与对外开放；顶层设计与实践探索；守正与创新。干擾項：政治与法治。", "id": "Q08-008", "l": 8, "ch": 2}, {"s": [7], "src": "", "card": "C08-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜戰略與策略的關係：\n战略是从（＿①＿）上作出判断和决策，策略是在战略指导下（＿②＿）的，战略和策略是（＿③＿）的", "a": ["全局、长远、大势", "为战略服务", "辩证统一"], "e": "戰略＝從全局、長遠、大勢來判斷和決策（大方向）；策略＝在戰略指導下、為戰略服務（具體做法）。兩者是辯證統一的。講師：「一定要注意。」", "id": "Q08-009", "l": 8, "ch": 2}, {"s": [7], "src": "", "card": "C08-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜戰略與策略的關係", "model": "战略是从全局、长远、大势上作出判断和决策，策略是在战略指导下为战略服务的，战略和策略是辩证统一的", "pts": ["全局、长远、大势", "为战略服务", "辩证统一"], "e": "記法：「戰略看遠（全局、長遠、大勢），策略服務戰略」。", "id": "Q08-010", "l": 8, "ch": 2}, {"s": [8], "src": "", "card": "C08-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜守正與創新：創新擺在突出位置：\n（＿①＿）摆在国家发展全局的（＿②＿）", "a": ["创新", "突出位置"], "e": "要把創新放在國家發展全局的突出位置。講師補充：「創新是第一動力。」", "id": "Q08-011", "l": 8, "ch": 2}, {"s": [9, 10], "src": "", "card": "C08-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜效率與公平；活力與秩序：\n（＿①＿）……（＿②＿）；应该既充满（＿③＿）又拥有良好（＿④＿）", "a": ["效率", "社会公平", "活力", "秩序"], "e": "既要有效率又要社會公平；既要充滿活力又要有良好秩序（活而不亂）。講師以手寫圖說明：中國式現代化是「並聯」式、同步發展的。", "id": "Q08-012", "l": 8, "ch": 2}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜自立自強與對外開放：\n（＿①＿）是中华民族精神之魂，是我们立党立国的（＿②＿）。（＿③＿）是中国的（＿④＿），任何时候都不能动摇", "a": ["独立自主", "重要原则", "对外开放", "基本国策"], "e": "獨立自主是中華民族的精神之魂、立黨立國的重要原則；對外開放是中國的基本國策，任何時候都不能動搖。", "id": "Q08-013", "l": 8, "ch": 2}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「独立自主」是：", "o": ["中华民族精神之魂，是我们立党立国的重要原则", "中国的基本国策，任何时候都不能动摇", "中国特色社会主义最本质的特征", "党的根本工作方法"], "a": 0, "e": "「独立自主」→「中华民族精神之魂，是我们立党立国的重要原则」。記法：「獨立自主＝魂＋原則；對外開放＝國策」。", "id": "Q08-014", "l": 8, "ch": 2}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「独立自主」是中华民族精神之魂，是我们立党立国的重要原则。", "a": true, "e": "對。「独立自主」→「中华民族精神之魂，是我们立党立国的重要原则」。", "id": "Q08-015", "l": 8, "ch": 2}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「对外开放」是：", "o": ["中国的基本国策，任何时候都不能动摇", "中华民族精神之魂，是我们立党立国的重要原则", "中国特色社会主义最本质的特征", "党的根本工作方法"], "a": 0, "e": "「对外开放」→「中国的基本国策，任何时候都不能动摇」。記法：「獨立自主＝魂＋原則；對外開放＝國策」。", "id": "Q08-016", "l": 8, "ch": 2}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「对外开放」是中华民族精神之魂，是我们立党立国的重要原则。", "a": false, "e": "錯。「对外开放」應對應「中国的基本国策，任何时候都不能动摇」，「中华民族精神之魂，是我们立党立国的重要原则」對應的是「独立自主」。", "id": "Q08-017", "l": 8, "ch": 2}, {"s": [12, 13], "src": "", "card": "C08-08", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜必須堅持團結奮鬥：\n（1）团结奋斗是中国人民创造历史伟业的（＿①＿）；（2）只有持续团结奋斗，才能完成（＿②＿）；（3）大力弘扬（＿③＿）", "a": ["必由之路", "中国式现代化", "团结奋斗精神"], "e": "團結奮鬥是中國人民創造歷史偉業的「必由之路」（講師：把這一句記住）。只有持續團結奮鬥，才能完成中國式現代化；要大力弘揚團結奮鬥精神。", "id": "Q08-018", "l": 8, "ch": 2}, {"k": "單", "s": [12], "q": "團結奮鬥是中國人民創造歷史偉業的：", "o": ["必由之路", "根本保證", "重要法寶", "精神支撐"], "a": 0, "e": "原文：團結奮鬥是中國人民創造歷史偉業的必由之路。", "id": "Q08-019", "l": 8, "ch": 2}, {"k": "單", "s": [11], "q": "獨立自主是中華民族＿＿，是我們立黨立國的重要原則。", "o": ["精神之魂", "根和魂", "生命線", "最大法寶"], "a": 0, "e": "原文：獨立自主是中華民族精神之魂。", "id": "Q08-020", "l": 8, "ch": 2}, {"k": "判", "s": [11], "q": "對外開放是中國的基本國策，任何時候都不能動搖。", "a": true, "e": "對。投影片黃字原文。", "id": "Q08-021", "l": 8, "ch": 2}, {"k": "單", "s": [7], "q": "「從全局、長遠、大勢上作出判斷和決策」的是：", "o": ["戰略", "策略", "頂層設計", "實踐探索"], "a": 0, "e": "戰略看全局、長遠、大勢；策略在戰略指導下為戰略服務。", "id": "Q08-022", "l": 8, "ch": 2}, {"k": "判", "s": [7], "q": "戰略是在策略指導下為策略服務的。", "a": false, "e": "錯（對調了）。是「策略在戰略指導下為戰略服務」。", "id": "Q08-023", "l": 8, "ch": 2}, {"k": "判", "s": [3, 4, 5], "q": "「堅持發揚鬥爭精神」是推進中國式現代化需要牢牢把握的重大原則之一。", "a": true, "e": "對。五大原則第五條。", "id": "Q08-024", "l": 8, "ch": 2}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師指出，中國共產黨是全面建設社會主義現代化國家的：", "o": ["主心骨和領航者", "根本保證和精神支撐", "行動指南和根本遵循", "中流砥柱和旗幟"], "a": 0, "e": "原話：「中國共產黨是全面建設社會主義現代化國家的主心骨和領航者。」", "id": "Q08-025", "l": 8, "ch": 2}, {"k": "填", "s": [7], "q": "戰略是從（＿①＿）、（＿②＿）、（＿③＿）上作出判斷和決策，策略是在戰略指導下為戰略服務的，戰略和策略是（＿④＿）的。", "a": ["全局", "长远", "大势", "辩证统一"], "e": "講師：「一定要注意」這句。", "id": "Q08-026", "l": 8, "ch": 2}, {"k": "簡", "s": [3, 4, 5], "q": "簡答：推進中國式現代化需要牢牢把握哪些重大原則？", "sum": "一句白話：跟着黨、走中特的路、為人民、靠改革開放、敢於鬥爭。", "pts": ["坚持和加强党的全面领导", "坚持中国特色社会主义道路", "坚持以人民为中心的发展思想", "坚持深化改革开放", "坚持发扬斗争精神"], "e": "五個黃字小標題。", "id": "Q08-027", "l": 8, "ch": 2}, {"s": [4, 5, 6], "src": "", "card": "C09-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜中國最大的國情就是中國共產黨的領導（四點）：\n（1）中国共产党的领导地位是在（＿①＿）中形成的；（2）中国共产党领导是人民当家作主的（＿②＿）；（3）中国共产党领导关系中国特色社会主义的（＿③＿）；（4）中国共产党领导是实现中华民族伟大复兴的（＿④＿）", "a": ["历史奋斗", "可靠保障", "性质、方向和命运", "根本保证"], "e": "中國最大的「實際情況」就是由共產黨領導。原因四點：領導地位是歷史奮鬥中形成的；黨的領導是人民當家作主的可靠保障；關係中特的性質、方向和命運；是實現民族復興的根本保證。講師：「沒有共產黨就沒有新中國，就沒有中國特色社會主義。」", "id": "Q09-001", "l": 9, "ch": 3}, {"s": [4, 5, 6], "src": "", "card": "C09-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜中國最大的國情就是中國共產黨的領導（四點）", "model": "（1）中国共产党的领导地位是在历史奋斗中形成的；（2）中国共产党领导是人民当家作主的可靠保障；（3）中国共产党领导关系中国特色社会主义的性质、方向和命运；（4）中国共产党领导是实现中华民族伟大复兴的根本保证", "pts": ["中国共产党的领导地位是在历史奋斗中形成的", "中国共产党领导是人民当家作主的可靠保障", "中国共产党领导关系中国特色社会主义的性质、方向和命运", "中国共产党领导是实现中华民族伟大复兴的根本保证"], "e": "記法：「歷史・人民・中特・復興」四對象；配「形成・可靠保障・性質方向命運・根本保證」。", "id": "Q09-002", "l": 9, "ch": 3}, {"s": [4, 5, 6], "src": "", "card": "C09-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "中國共產黨領導是「人民当家作主」的：", "o": ["可靠保障", "根本保证", "主要来源", "行动指南"], "a": 0, "e": "「人民当家作主」→「可靠保障」。記法：「歷史・人民・中特・復興」四對象；配「形成・可靠保障・性質方向命運・根本保證」。", "id": "Q09-003", "l": 9, "ch": 3}, {"s": [4, 5, 6], "src": "", "card": "C09-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "中國共產黨領導是人民当家作主的可靠保障。", "a": true, "e": "對。「人民当家作主」→「可靠保障」。", "id": "Q09-004", "l": 9, "ch": 3}, {"s": [4, 5, 6], "src": "", "card": "C09-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "中國共產黨領導是「实现中华民族伟大复兴」的：", "o": ["根本保证", "可靠保障", "主要来源", "行动指南"], "a": 0, "e": "「实现中华民族伟大复兴」→「根本保证」。記法：「歷史・人民・中特・復興」四對象；配「形成・可靠保障・性質方向命運・根本保證」。", "id": "Q09-005", "l": 9, "ch": 3}, {"s": [4, 5, 6], "src": "", "card": "C09-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "中國共產黨領導是实现中华民族伟大复兴的可靠保障。", "a": false, "e": "錯。「实现中华民族伟大复兴」應對應「根本保证」，「可靠保障」對應的是「人民当家作主」。", "id": "Q09-006", "l": 9, "ch": 3}, {"s": [4], "src": "", "card": "C09-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「最」本質的特徵＝黨的領導；最大國情：\n中国特色社会主义（＿①＿）是中国共产党领导；中国（＿②＿）就是中国共产党的领导", "a": ["最本质的特征", "最大的国情"], "e": "講師：「一定要注意有一個『最』字，涉及到最本質的特徵，那就一定是黨的領導。」中國最大的國情也是中國共產黨的領導。", "id": "Q09-007", "l": 9, "ch": 3}, {"s": [7, 8], "src": "", "card": "C09-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的領導是中特制度的最大優勢（三點）：\n（1）中国共产党为坚持和完善中国特色社会主义制度提供强大（＿①＿）；（2）中国共产党的（＿②＿）是中国特色社会主义制度优势的（＿③＿）；（3）中国共产党确保中国特色社会主义制度的显著优势（＿④＿）", "a": ["理论优势", "自身优势", "主要来源", "充分彰显"], "e": "黨的領導為什麼是制度的「最大優勢」？①黨為制度提供強大理論優勢；②黨自身的優勢是制度優勢的主要來源；③黨確保制度的顯著優勢充分彰顯（發揮出來）。講師：第一、第二個標黃字體要記住。", "id": "Q09-008", "l": 9, "ch": 3}, {"s": [9, 10, 11], "src": "", "card": "C09-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜加強黨的全面領導提供堅強保證（三點）：\n（1）使党的（＿①＿）充分彰显；（2）使党的（＿②＿）显著增强；（3）为推进新时代中国特色社会主义事业提供了（＿③＿）", "a": ["领导核心作用", "政治领导力、思想引领力、群众组织力、社会号召力", "政治保证"], "e": "堅持和加強黨的全面領導帶來三個結果：領導核心作用充分彰顯；黨的「四力」顯著增強；為事業提供政治保證。講師：只記標黃部分。", "id": "Q09-009", "l": 9, "ch": 3}, {"s": [10], "src": "", "card": "C09-05", "tag": ["必背", "多選題考點", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的「四力」；政治領導力是第一位：\n（＿①＿）、（＿②＿）、（＿③＿）、（＿④＿）；政治领导力是马克思主义政党（＿⑤＿）的能力", "a": ["政治领导力", "思想引领力", "群众组织力", "社会号召力", "第一位"], "e": "黨的四種能力：政治領導力、思想引領力、群眾組織力、社會號召力。其中「政治領導力」是馬克思主義政黨第一位的能力。", "id": "Q09-010", "l": 9, "ch": 3}, {"s": [10], "src": "", "card": "C09-05", "tag": ["必背", "多選題考點", "選擇題考點"], "auto": 1, "k": "多", "q": "黨的「四力」包括：", "o": ["政治领导力", "思想引领力", "群众组织力", "社会号召力", "经济发展力"], "a": [0, 1, 2, 3], "e": "正確：政治领导力；思想引领力；群众组织力；社会号召力。干擾項：经济发展力。", "id": "Q09-011", "l": 9, "ch": 3}, {"k": "單", "s": [8], "q": "中國特色社會主義制度優勢的主要來源是：", "o": ["中國共產黨的自身優勢", "人民當家作主", "社會主義市場經濟", "中華優秀傳統文化"], "a": 0, "e": "原文：中國共產黨的自身優勢是中國特色社會主義制度優勢的主要來源。", "id": "Q09-012", "l": 9, "ch": 3}, {"k": "單", "s": [10], "q": "馬克思主義政黨第一位的能力是：", "o": ["政治領導力", "思想引領力", "群眾組織力", "社會號召力"], "a": 0, "e": "講師：「政治領導力是我們馬克思主義政黨的第一位的能力。」", "id": "Q09-013", "l": 9, "ch": 3}, {"k": "單",
