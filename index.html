＿）、（＿②＿）、（＿③＿）三条红线；打好（＿④＿）、（＿⑤＿）、（＿⑥＿）保卫战", "a": ["生态保护红线", "环境质量底线", "资源利用上线", "蓝天", "碧水", "净土"], "e": "講師：「這裏稍微記一下。」嚴守生態保護紅線、環境質量底線、資源利用上線三條紅線；打好藍天、碧水、淨土保衛戰；我國成為全球大氣環境質量改善速度最快的國家。", "id": "Q40-030", "l": 40, "ch": 12, "pt": "B", "ps": 6, "pr": ["老師：…資源利用上線 這裏稍微記一下 第一個是環境保護紅線（40-018）"]}, {"s": [19], "src": "", "card": "C40-13", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜綠色成為新時代中國的鮮明底色：\n（＿①＿）成为新时代中国的（＿②＿）", "a": ["绿色", "鲜明底色"], "e": "我國天更藍、地更綠、水更清，綠色成為新時代中國的鮮明底色；新時代生態文明建設的成就成為黨和國家事業取得歷史性成就、發生歷史性變革的顯著標誌。（講師：這一節要背的東西不多。）", "id": "Q40-031", "l": 40, "ch": 12, "pt": "C", "ps": 0, "pr": []}, {"k": "單", "s": [10], "q": "闡明經濟發展與生態環境保護之間關係的重要發展理念是：", "o": ["綠水青山就是金山銀山", "山水林田湖草沙是生命共同體", "生態興則文明興", "人與自然和諧共生"], "a": 0, "e": "講師：「可能考一個選擇題……就是綠水青山就是金山銀山。」", "id": "Q40-032", "l": 40, "ch": 12, "pt": "A", "ps": 35, "pr": ["老師：…要注意一下 可能考一個選擇題 問你說什麼（40-010）", "投影片黃字／黃筆標記（40-010）"]}, {"k": "判", "s": [10], "q": "保護生態環境就是保護生產力，改善生態環境就是發展生產力。", "a": true, "e": "對（slide 010）。", "id": "Q40-033", "l": 40, "ch": 12, "pt": "A", "ps": 25, "pr": ["老師：…要注意一下 可能考一個選擇題 問你說什麼（40-010）", "投影片黃字／黃筆標記（40-010）"]}, {"k": "單", "s": [10], "q": "生態環境問題歸根到底是：", "o": ["經濟發展方式和生活方式問題", "科學技術問題", "人口數量問題", "國際合作問題"], "a": 0, "e": "slide 010。", "id": "Q40-034", "l": 40, "ch": 12, "pt": "A", "ps": 26, "pr": ["老師：…要注意一下 可能考一個選擇題 問你說什麼（40-010）", "投影片黃字／黃筆標記（40-010）"]}, {"k": "判", "s": [11], "q": "生態環境保護和經濟發展是相互對立的，必須二選一。", "a": false, "e": "錯。二者是辯證統一、相輔相成的關係；不能割裂，更不能對立。", "id": "Q40-035", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-011）"]}, {"k": "單", "s": [9], "q": "尊重自然、順應自然、保護自然是全面建設社會主義現代化國家的：", "o": ["內在要求", "根本目的", "重要前提", "本質特徵"], "a": 0, "e": "講師：「請注意」（slide 009）。", "id": "Q40-036", "l": 40, "ch": 12, "pt": "B", "ps": 11, "pr": ["老師：請注意（40-009）", "投影片黃字／黃筆標記（40-009）"]}, {"k": "單", "s": [16], "q": "「美麗中國」被納入：", "o": ["社會主義現代化強國目標", "新發展理念", "中國式現代化的本質要求", "三大攻堅戰"], "a": 0, "e": "綠色→新發展理念；促進和諧共生→本質要求；污染防治→三大攻堅戰。", "id": "Q40-037", "l": 40, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（40-016）"]}, {"k": "單", "s": [16], "q": "黨的十九大把哪一項寫入黨章？", "o": ["增強綠水青山就是金山銀山的意識", "建設美麗中國", "碳達峰碳中和", "山水林田湖草沙一體化保護"], "a": 0, "e": "slide 016。", "id": "Q40-038", "l": 40, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（40-016）"]}, {"k": "判", "s": [16], "q": "2018年3月十三屆全國人大一次會議通過的憲法修正案把生態文明寫入憲法。", "a": true, "e": "對（slide 016）。", "id": "Q40-039", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-016）"]}, {"k": "多", "s": [18], "q": "要嚴守的「三條紅線」是：", "o": ["生態保護紅線", "環境質量底線", "資源利用上線", "經濟增長下線"], "a": [0, 1, 2], "e": "講師：「這裏稍微記一下。」", "id": "Q40-040", "l": 40, "ch": 12, "pt": "B", "ps": 9, "pr": ["老師：…資源利用上線 這裏稍微記一下 第一個是環境保護紅線（40-018）"]}, {"k": "單", "s": [15], "q": "在全球環境治理中，新時代我國實現了由什麼到什麼的轉變？", "o": ["由參與者到引領者", "由引領者到參與者", "由旁觀者到參與者", "由追隨者到旁觀者"], "a": 0, "e": "slide 015 ③。", "id": "Q40-041", "l": 40, "ch": 12, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（40-014）"]}, {"k": "單", "s": [14], "q": "生態文明建設是關係黨的使命宗旨的重大：", "o": ["政治問題", "經濟問題", "社會問題", "文化問題"], "a": 0, "e": "經濟問題；政治問題（使命宗旨）；社會問題（民生福祉）。", "id": "Q40-042", "l": 40, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（40-014）"]}, {"k": "填", "s": [13], "q": "處理好綠水青山和金山銀山的關係，關鍵在（＿①＿），關鍵在（＿②＿）。", "a": ["人", "思路"], "e": "slide 013。", "id": "Q40-043", "l": 40, "ch": 12, "pt": "C", "ps": 0, "pr": []}, {"k": "填", "s": [7], "q": "（＿①＿）是人類文明發展的歷史趨勢。", "a": ["生态文明"], "e": "slide 007。", "id": "Q40-044", "l": 40, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（40-007）"]}, {"k": "簡", "s": [10, 11, 12, 13], "q": "簡答：如何理解「綠水青山就是金山銀山」？", "sum": "一句白話：環境就是生產力；保護和發展不是對立，而是互相促進；綠水青山本身就是財富。", "pts": ["阐明了经济发展与生态环境保护之间的关系，揭示了保护生态环境就是保护生产力、改善生态环境就是发展生产力的道理", "生态环境保护和经济发展是辩证统一、相辅相成的关系，要坚持在发展中保护、在保护中发展", "绿水青山既是自然财富、生态财富，又是社会财富、经济财富", "处理好绿水青山和金山银山的关系，关键在人，关键在思路"], "e": "第40堂知識點2（slide 010–013）。", "id": "Q40-045", "l": 40, "ch": 12, "pt": "A", "ps": 27, "pr": ["老師：…要注意一下 可能考一個選擇題 問你說什麼（40-010）", "投影片黃字／黃筆標記（40-010）"]}, {"s": [3, 4, 5, 6, 7], "src": "", "card": "C41-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜加快形成綠色生產方式和生活方式（五個做法）：\n（＿①＿）；（＿②＿）；（＿③＿）；（＿④＿）；坚持把建设美丽中国转化为（＿⑤＿）", "a": ["推动经济结构调整优化", "推进各类资源节约集约利用", "积极稳妥推进碳达峰碳中和", "健全绿色发展的保障体系", "全体人民自觉行动"], "e": "講師：「知識點一，我們只需要去記住標黃色的位置。」五個標題：推動經濟結構調整優化；推進各類資源節約集約利用；積極穩妥推進碳達峰碳中和；健全綠色發展的保障體系；堅持把建設美麗中國轉化為全體人民自覺行動。", "id": "Q41-001", "l": 41, "ch": 12, "pt": "A", "ps": 25, "pr": ["老師：知識點一，我們只需要去記住標黃色的位置。（41-003）", "投影片黃字／黃筆標記（41-003）"]}, {"s": [3, 4, 5, 6, 7], "src": "", "card": "C41-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜加快形成綠色生產方式和生活方式（五個做法）", "model": "推动经济结构调整优化；推进各类资源节约集约利用；积极稳妥推进碳达峰碳中和；健全绿色发展的保障体系；坚持把建设美丽中国转化为全体人民自觉行动", "pts": ["推动经济结构调整优化", "推进各类资源节约集约利用", "积极稳妥推进碳达峰碳中和", "健全绿色发展的保障体系", "坚持把建设美丽中国转化为全体人民自觉行动"], "e": "記法：「結構・節約・雙碳・保障・全民」。", "id": "Q41-002", "l": 41, "ch": 12, "pt": "A", "ps": 25, "pr": ["老師：知識點一，我們只需要去記住標黃色的位置。（41-003）", "投影片黃字／黃筆標記（41-003）"]}, {"s": [3, 4, 5, 6, 7], "src": "", "card": "C41-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "加快形成綠色生產方式和生活方式，要：", "o": ["推动经济结构调整优化", "推进各类资源节约集约利用", "积极稳妥推进碳达峰碳中和", "健全绿色发展的保障体系", "先污染后治理"], "a": [0, 1, 2, 3], "e": "正確：推动经济结构调整优化；推进各类资源节约集约利用；积极稳妥推进碳达峰碳中和；健全绿色发展的保障体系。干擾項：先污染后治理。", "id": "Q41-003", "l": 41, "ch": 12, "pt": "A", "ps": 25, "pr": ["老師：知識點一，我們只需要去記住標黃色的位置。（41-003）", "投影片黃字／黃筆標記（41-003）"]}, {"s": [3, 4, 5, 6, 7], "src": "", "card": "C41-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "加快形成綠色生產方式和生活方式，要：", "o": ["健全绿色发展的保障体系", "坚持把建设美丽中国转化为全体人民自觉行动", "推进各类资源节约集约利用", "推动经济结构调整优化", "以牺牲环境换取经济增长"], "a": [0, 1, 2, 3], "e": "正確：健全绿色发展的保障体系；坚持把建设美丽中国转化为全体人民自觉行动；推进各类资源节约集约利用；推动经济结构调整优化。干擾項：以牺牲环境换取经济增长。", "id": "Q41-004", "l": 41, "ch": 12, "pt": "A", "ps": 25, "pr": ["老師：知識點一，我們只需要去記住標黃色的位置。（41-003）", "投影片黃字／黃筆標記（41-003）"]}, {"s": [3], "src": "", "card": "C41-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜產業結構調整是關鍵：變「輕」變「綠」：\n要抓住（＿①＿）这个关键，促进产业结构变（＿②＿）、发展模式变（＿③＿）", "a": ["产业结构调整", "“轻”", "“绿”"], "e": "調整優化經濟結構是從源頭推動發展方式綠色轉型的重要任務，要抓住產業結構調整這個關鍵，促進產業結構變「輕」、發展模式變「綠」。生態環境問題歸根到底是資源過度開發、粗放利用、奢侈消費造成的。", "id": "Q41-005", "l": 41, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（41-003）"]}, {"s": [4, 5], "src": "", "card": "C41-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「雙碳」工作：系統性變革與四對關係：\n推进“双碳”工作……是一场广泛而深刻的（＿①＿）；处理好（＿②＿）、（＿③＿）、（＿④＿）、（＿⑤＿）的关系", "a": ["经济社会系统性变革", "发展和减排", "整体和局部", "长远目标和短期目标", "政府和市场"], "e": "推進「雙碳」工作是破解資源環境約束突出問題、實現可持續發展的迫切需要，是一場廣泛而深刻的經濟社會系統性變革。要處理好發展和減排、整體和局部、長遠目標和短期目標、政府和市場的關係，既堅定不移，又不急於求成、偏激冒進。目標堅定不移，但路徑和方式、節奏和力度必須由我們自己作主，決不受他人左右。", "id": "Q41-006", "l": 41, "ch": 12, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（41-004）"]}, {"s": [8], "src": "", "card": "C41-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜建設美麗中國＝重要目標＋必然要求：\n建设美丽中国，是全面建设社会主义现代化国家的（＿①＿），也是满足人民日益增长的优美生态环境需要的（＿②＿）", "a": ["重要目标", "必然要求"], "e": "講師：「同學們請注意了。」建設美麗中國，是全面建設社會主義現代化國家的重要目標，也是滿足人民日益增長的優美生態環境需要的必然要求。", "id": "Q41-007", "l": 41, "ch": 12, "pt": "A", "ps": 17, "pr": ["老師：…知識點一同學們 我們只需要去記住標黃色的位置 第一（41-008）", "老師：同學們請注意了。（41-008）", "投影片黃字／黃筆標記（41-008）"]}, {"s": [8], "src": "", "card": "C41-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜綠色發展：發展觀的一場深刻革命：\n绿色发展是新发展理念的重要内容，是（＿①＿）。“绿色发展，就其要义来讲，是要解决好（＿②＿）问题。”坚持把绿色低碳发展作为解决生态环境问题的（＿③＿）", "a": ["发展观的一场深刻革命", "人与自然和谐共生", "治本之策"], "e": "綠色發展是新發展理念的重要內容，是發展觀的一場深刻革命。習近平指出：「綠色發展，就其要義來講，是要解決好人與自然和諧共生問題。」要堅持把綠色低碳發展作為解決生態環境問題的治本之策。", "id": "Q41-008", "l": 41, "ch": 12, "pt": "A", "ps": 14, "pr": ["老師：…知識點一同學們 我們只需要去記住標黃色的位置 第一（41-008）", "投影片黃字／黃筆標記（41-008）"]}, {"s": [9, 10, 11, 12, 13], "src": "", "card": "C41-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜山水林田湖草沙一體化保護和系統治理（六個標題）：\n（＿①＿）是不可分割的生态系统；加快实施重要（＿②＿）重大工程；推进（＿③＿）建设；科学推进（＿④＿）综合治理，持续开展大规模国土绿化行动；实施（＿⑤＿）保护重大工程；推行草原森林河流湖泊湿地（＿⑥＿）", "a": ["山水林田湖草沙是一个生命共同体", "生态系统保护和修复", "自然保护地体系", "荒漠化、石漠化、水土流失", "生物多样性", "休养生息"], "e": "講師：「總共就是這六個……六個標題大家記住就可以了。」山水林田湖草沙是一個生命共同體，是不可分割的生態系統；要堅持系統觀念，進行整體保護、系統修復、綜合治理。", "id": "Q41-009", "l": 41, "ch": 12, "pt": "B", "ps": 10, "pr": ["投影片黃字／黃筆標記（41-009）"]}, {"s": [9, 10, 11, 12, 13], "src": "", "card": "C41-06", "tag": ["必背", "簡答題考點"], "auto": 1,  0, "e": "綠色發展是新發展理念的重要內容，是發展觀的一場深刻革命。", "id": "Q41-030", "l": 41, "ch": 12, "pt": "A", "ps": 32, "pr": ["老師：…知識點一同學們 我們只需要去記住標黃色的位置 第一（41-008）", "投影片黃字／黃筆標記（41-008）"]}, {"k": "單", "s": [8], "q": "習近平指出，綠色發展就其要義來講，是要解決好：", "o": ["人與自然和諧共生問題", "發展動力問題", "發展不平衡問題", "社會公平正義問題"], "a": 0, "e": "slide 008 注意2。", "id": "Q41-031", "l": 41, "ch": 12, "pt": "A", "ps": 32, "pr": ["老師：…知識點一同學們 我們只需要去記住標黃色的位置 第一（41-008）", "投影片黃字／黃筆標記（41-008）"]}, {"k": "判", "s": [8], "q": "建設美麗中國，是全面建設社會主義現代化國家的重要目標。", "a": true, "e": "對（slide 008 注意1）。", "id": "Q41-032", "l": 41, "ch": 12, "pt": "A", "ps": 32, "pr": ["老師：…知識點一同學們 我們只需要去記住標黃色的位置 第一（41-008）", "老師：同學們請注意了。（41-008）", "投影片黃字／黃筆標記（41-008）"]}, {"k": "單", "s": [10], "q": "我國自然保護地體系以什麼為主體？", "o": ["國家公園", "自然保護區", "各類自然公園", "森林公園"], "a": 0, "e": "國家公園為主體、自然保護區為基礎、各類自然公園為補充。", "id": "Q41-033", "l": 41, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（41-009）"]}, {"k": "多", "s": [10], "q": "要劃定落實的「三條控制線」是：", "o": ["生態保護紅線", "永久基本農田", "城鎮開發邊界", "資源利用上線"], "a": [0, 1, 2], "e": "資源利用上線屬第40堂的「三條紅線」（生態保護紅線、環境質量底線、資源利用上線），易混。", "id": "Q41-034", "l": 41, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（41-010）"]}, {"k": "判", "s": [5], "q": "「雙碳」目標的路徑和方式、節奏和力度，可以根據國際要求由他人決定。", "a": false, "e": "錯。必須由我們自己作主，決不受他人左右。", "id": "Q41-035", "l": 41, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（41-005）"]}, {"k": "單", "s": [15], "q": "固定污染源監管制度體系以什麼為核心？", "o": ["排污許可制", "環境影響評價", "河湖長制", "生態補償制度"], "a": 0, "e": "slide 015（4）。", "id": "Q41-036", "l": 41, "ch": 12, "pt": "B", "ps": 8, "pr": ["投影片黃字／黃筆標記（41-015）", "老師：要求大家去重點記憶一下這七個內容。（41-015）"]}, {"k": "填", "s": [3], "q": "要抓住產業結構調整這個關鍵，促進產業結構變“（＿①＿）”、發展模式變“（＿②＿）”。", "a": ["轻", "绿"], "e": "slide 003。", "id": "Q41-037", "l": 41, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（41-003）"]}, {"k": "填", "s": [19], "q": "制度的生命力在於（＿①＿），關鍵在（＿②＿），靠的是（＿③＿）。", "a": ["执行", "真抓", "严管"], "e": "知識點7 標題。", "id": "Q41-038", "l": 41, "ch": 12, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（41-019）"]}, {"k": "多", "s": [18], "q": "嚴明生態環境保護責任制度包括：", "o": ["建立生態文明建設目標評價考核制度", "開展領導幹部自然資源資產離任審計", "健全河湖長制、林長制", "實行環境責任任期屆滿即免除"], "a": [0, 1, 2], "e": "講師：「把這個責任制度給老師背過。」實行的是終身追究制。", "id": "Q41-039", "l": 41, "ch": 12, "pt": "A", "ps": 44, "pr": ["老師：…把這個責任制度給老師背過 第一考覈制度（41-018）", "投影片黃字／黃筆標記（41-018）"]}, {"k": "單", "s": [9], "q": "「不可分割的生態系統」「生命共同體」指的是：", "o": ["山水林田湖草沙", "長江黃河", "國家公園", "城鄉社區"], "a": 0, "e": "slide 009。", "id": "Q41-040", "l": 41, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（41-009）"]}, {"k": "簡", "s": [3, 4, 5, 6, 7], "q": "簡答：如何加快形成綠色生產方式和生活方式？", "sum": "一句白話：調結構、省資源、穩步推進雙碳、建保障體系、讓全民行動起來。", "pts": ["推动经济结构调整优化", "推进各类资源节约集约利用", "积极稳妥推进碳达峰碳中和", "健全绿色发展的保障体系", "坚持把建设美丽中国转化为全体人民自觉行动"], "e": "講師：「只需要去記住標黃色的位置。」", "id": "Q41-041", "l": 41, "ch": 12, "pt": "A", "ps": 43, "pr": ["老師：只需要去記住標黃色的位置。（41-003）", "投影片黃字／黃筆標記（41-003）"]}, {"k": "論", "s": [14, 15, 17, 18, 19], "q": "論述：如何用最嚴格制度最嚴密法治保護生態環境？", "sum": "一句白話：把制度建設當作重中之重，從保護、利用、責任三方面建制度，並且嚴格執行。", "pts": ["保护生态环境必须依靠制度、依靠法治，把制度建设作为生态文明建设的重中之重", "实行最严格的生态环境保护制度", "全面建立资源高效利用制度", "严明生态环境保护责任制度（如目标评价考核、离任审计、损害责任终身追究制、河湖长制林长制）", "制度的生命力在于执行，关键在真抓，靠的是严管"], "e": "第41堂知識點3–7。", "id": "Q41-042", "l": 41, "ch": 12, "pt": "A", "ps": 54, "pr": ["老師：…作爲生態文明建設中的重中之重 去構建起我們的產權清…（41-014）", "老師：…把這個責任制度給老師背過 第一考覈制度（41-018）", "投影片黃字／黃筆標記（41-018）"]}, {"k": "簡", "s": [9, 10, 11, 12, 13], "q": "簡答：如何堅持山水林田湖草沙一體化保護和系統治理？", "sum": "一句白話：把山水林田湖草沙當成一個整體，修復、保護地、治沙治土、保護生物多樣性、讓自然休養生息。", "pts": ["山水林田湖草沙是一个生命共同体，是不可分割的生态系统", "加快实施重要生态系统保护和修复重大工程", "推进自然保护地体系建设", "科学推进荒漠化、石漠化、水土流失综合治理，持续开展大规模国土绿化行动", "实施生物多样性保护重大工程", "推行草原森林河流湖泊湿地休养生息"], "e": "講師：「六個標題大家記住就可以了。」", "id": "Q41-043", "l": 41, "ch": 12, "pt": "B", "ps": 13, "pr": ["投影片黃字／黃筆標記（41-009）"]}, {"s": [3], "src": "", "card": "C42-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜生態環境問題是全人類共同面臨的問題：\n生态环境问题是（＿①＿）的问题；保持良好生态环境是各国人民的（＿②＿）和（＿③＿）；国际社会应当秉持（＿④＿）理念", "a": ["全人类共同面临", "共同心愿", "共同责任", "地球生命共同体"], "e": "保持良好生態環境是各國人民的共同心願和共同責任。國際社會應秉持地球生命共同體理念，開展全球行動、全球應對、全球合作；秉持共商共建共享的全球治理觀，實現聯合國2030年可持續發展目標。", "id": "Q42-001", "l": 42, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-003）"]}, {"s": [3], "src": "", "card": "C42-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜五個「追求」：\n追求（＿①＿）、追求（＿②＿）、追求（＿③＿）、追求（＿④＿）、追求（＿⑤＿）", "a": ["人与自然和谐", "绿色发展繁荣", "热爱自然情怀", "科学治理精神", "携手合作应对"], "e": "國際社會要追求人與自然和諧、追求綠色發展繁榮、追求熱愛自然情懷、追求科學治理精神、追求攜手合作應對。", "id": "Q42-002", "l": 42, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-003）"]}, {"s": [4], "src": "", "card": "C42-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中國是全球生態文明建設的重要參與者、貢獻者、引領者：\n中国致力于推动共建（＿①＿），积极参与全球环境治理，是全球生态文明建设的重要（＿②＿）、（＿③＿）、（＿④＿）", "a": ["地球生命共同体", "参与者", "贡献者", "引领者"], "e": "講師：「那注意了。」建設綠色家園是人類的共同夢想，也是各國人民的共同期盼。中國致力於推動共建地球生命共同體，積極參與全球環境治理，是全球生態文明建設的重要參與者、貢獻者、引領者。順應自然、保護自然、綠色發展，人類才有美好的未來。", "id": "Q42-003", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["老師：那注意了。（42-004）", "投影片黃字／黃筆標記（42-004）"]}, {"s": [5, 6, 7], "src": "", "card": "C42-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜共建清潔美麗世界（四個堅持）：\n坚持（＿①＿）；坚持（＿②＿）；坚持（＿③＿）；坚持（＿④＿）", "a": ["以人为本", "科学治理", "多边主义", "共同但有区别的责任原则"], "e": "建設人與自然和諧共生的地球家園，以綠色轉型為驅動，堅持多邊主義，推動全球環境治理體系更加公平合理。四個標題：堅持以人為本；堅持科學治理；堅持多邊主義（打造多元共治的全球生態治理體系，不「甩鍋推責」）；堅持共同但有區別的責任原則。", "id": "Q42-004", "l": 42, "ch": 12, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（42-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C42-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜共建清潔美麗世界（四個堅持）", "model": "坚持以人为本；坚持科学治理；坚持多边主义；坚持共同但有区别的责任原则", "pts": ["坚持以人为本", "坚持科学治理", "坚持多边主义", "坚持共同但有区别的责任原则"], "e": "記法：「人本・科學・多邊・共同但有區別」。", "id": "Q42-005", "l": 42, "ch": 12, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（42-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C42-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "共建清潔美麗世界，要堅持：", "o": ["坚持以人为本", "坚持科学治理", "坚持多边主义", "坚持共同但有区别的责任原则", "坚持单边主义"], "a": [0, 1, 2, 3], "e": "正確：坚持以人为本；坚持科学治理；坚持多边主义；坚持共同但有区别的责任原则。干擾項：坚持单边主义。", "id": "Q42-006", "l": 42, "ch": 12, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（42-005）"]}, {"s": [7], "src": "", "card": "C42-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜共同但有區別的責任原則：\n坚持（＿①＿）的责任原则；发展中国家大多只是（＿②＿）排放，而发达国家早已是（＿③＿）或（＿④＿）排放", "a": ["共同但有区别", "“生存型”", "“奢侈型”", "“浪费型”"], "e": "講師：「雖然要共同擔責，但是又有區別……發展中國家只是生存型排放，發達國家早已是奢侈型或浪費型排放，所以責任是有區別的。」發達國家和發展中國家處於不同發展階段，在環境問題上的歷史責任和現實能力存在差異。", "id": "Q42-007", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["老師：…然要共同擔責，但是又有區別……發展中國家只是生存型排…（42-007）", "投影片黃字／黃筆標記（42-007）"]}, {"s": [8], "src": "", "card": "C42-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜積極推動全球可持續發展：中國的大國擔當：\n深度参与（＿①＿），同世界各国共同推进（＿②＿），积极共建（＿③＿）", "a": ["全球气候治理", "全球生物多样性治理", "绿色“一带一路”"], "e": "中國作為世界上最大的發展中國家，深度參與全球氣候治理，同世界各國共同推進全球生物多樣性治理，積極共建綠色「一帶一路」，承擔大國責任，展現大國擔當。", "id": "Q42-008", "l": 42, "ch": 12, "pt": "C", "ps": 0, "pr": []}, {"s": [8], "src": "", "card": "C42-06", "tag": ["選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜積極推動全球可持續發展：中國的大國擔當", "model": "深度参与全球气候治理，同世界各国共同推进全球生物多样性治理，积极共建绿色“一带一路”", "pts": ["积极参与全球气候治理", "积极推进全球生物多样性治理", "积极打造绿色“一带一路”"], "e": "記法：「氣候・生物多樣性・綠色一帶一路」三件事。", "id": "Q42-009", "l": 42, "ch": 12, "pt": "C", "ps": 0, "pr": []}, {"s": [9], "src": "", "card": "C42-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜氣候治理：中國的成績：\n中国提前完成（＿①＿）应对气候变化和设立自然保护区相关目标，（＿②＿）居全球第一，是对全球（＿③＿）贡献最大的国家", "a": ["2020年", "人工林面积", "臭氧层保护"], "e": "氣候變化問題是全球生態環境治理領域的突出問題。中國提前完成2020年應對氣候變化和設立自然保護區相關目標，人工林面積居全球第一，是對全球臭氧層保護貢獻最大的國家；努力推動構建公平合理、合作共贏的全球氣候治理體系。", "id": "Q42-010", "l": 42, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-009）"]}, {"s": [10], "src": "", "card": "C42-08", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜碳達峰、碳中和時間表與2030年目標：\n力争（＿①＿）前实现碳达峰，努力争取（＿②＿）前实现碳中和；到2030年，单位国内生产总值二氧化碳排放将比2005年下降（＿③＿）以上，非化石能源占一次能源消费比重将达到（＿④＿）左右", "a": ["2030年", "2060年", "65%", "25%"], "e": "力爭2030年前實現碳達峰，努力爭取2060年前實現碳中和。到2030年，單位國內生產總值二氧化碳排放將比2005年下降65%以上，非化石能源占一次能源消費比重將達到25%左右。", "id": "Q42-011", "l": 42, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-010）"]}, {"s": [11], "src": "", "card": "C42-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜生物多樣性治理：COP15 與「昆明－蒙特利爾框架」：\n中国成功承办联合国《生物多样性公约》（＿①＿）缔约方大会，推动国际社会达成（＿②＿）", "a": ["第十五次", "“昆明—蒙特利尔全球生物多样性框架”"], "e": "中國成功承辦聯合國《生物多樣性公約》第十五次締約方大會，推動達成「昆明－蒙特利爾全球生物多樣性框架」等里程碑成果；積極落實聯合國生態系統恢復十年行動計劃。", "id": "Q42-012", "l": 42, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-011）"]}, {"s": [12], "src": "", "card": "C42-10", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜綠色「一帶一路」：\n“一带一路”是一条（＿①＿）；实施“一带一路”应对气候变化（＿②＿）计划；继续实施（＿③＿）计划；让（＿④＿）切实成为共建“一带一路”的底色", "a": ["绿色发展之路", "南南合作", "绿色丝路使者", "绿色"], "e": "「一帶一路」是一條綠色發展之路。完善「一帶一路」綠色發展國際聯盟；實施「一帶一路」應對氣候變化南南合作計劃；繼續實施綠色絲路使者計劃；讓綠色切實成為共建「一帶一路」的底色。", "id": "Q42-013", "l": 42, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-012）"]}, {"k": "單", "s": [4], "q": "在全球生態文明建設中，中國的角色是：", "o": ["重要參與者、貢獻者、引領者", "旁觀者、評論者", "唯一的主導者", "被動的接受者"], "a": 0, "e": "slide 004 注意。", "id": "Q42-014", "l": 42, "ch": 12, "pt": "B", "ps": 8, "pr": ["老師：那注意了。（42-004）", "投影片黃字／黃筆標記（42-004）"]}, {"k": "單", "s": [10], "q": "中國力爭在哪一年前實現碳達峰？", "o": ["2030年", "2025年", "2035年", "2060年"], "a": 0, "e": "2030年前碳達峰；2060年前碳中和。", "id": "Q42-015", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（42-010）"]}, {"k": "單", "s": [10], "q": "中國努力爭取在哪一年前實現碳中和？", "o": ["2060年", "2050年", "2030年", "2049年"], "a": 0, "e": "slide 010。", "id": "Q42-016", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（42-010）"]}, {"k": "判", "s": [7], "q": "在應對環境問題上，發達國家和發展中國家應承擔完全相同的責任。", "a": false, "e": "錯。堅持共同但有區別的責任原則；發展中國家多為生存型排放。", "id": "Q42-017", "l": 42, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-007）"]}, {"k": "單", "s": [7], "q": "在居民人均消費碳排放方面，發展中國家大多屬於：", "o": ["生存型排放", "奢侈型排放", "浪費型排放", "零排放"], "a": 0, "e": "講師：「發展中國家大多只是生存型排放，而發達國家早已是奢侈型或浪費型排放。」", "id": "Q42-018", "l": 42, "ch": 12, "pt": "B", "ps": 8, "pr": ["老師：…然要共同擔責，但是又有區別……發展中國家只是生存型排…（42-007）", "投影片黃字／黃筆標記（42-007）"]}, {"k": "單", "s": [11], "q": "中國承辦《生物多樣性公約》第十五次締約方大會，推動達成的框架是：", "o": ["昆明－蒙特利爾全球生物多樣性框架", "巴黎協定", "京都議定書", "格拉斯哥氣候公約"], "a": 0, "e": "slide 011。", "id": "Q42-019", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（42-011）"]}, {"k": "判", "s": [9], "q": "中國是對全球臭氧層保護貢獻最大的國家，人工林面積居全球第一。", "a": true, "e": "對（slide 009）。", "id": "Q42-020", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（42-009）"]}, {"k": "填", "s": [10], "q": "到2030年，單位國內生產總值二氧化碳排放將比2005年下降（＿①＿）以上，非化石能源占一次能源消費比重將達到（＿②＿）左右。", "a": ["65%", "25%"], "e": "slide 010。", "id": "Q42-021", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（42-010）"]}, {"k": "單", "s": [12], "q": "讓什麼切實成為共建「一帶一路」的底色？", "o": ["綠色", "開放", "和平", "創新"], "a": 0, "e": "slide 012。", "id": "Q42-022", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（42-012）"]}, {"k": "多", "s": [3], "q": "國際社會應當開展的是：", "o": ["全球行動", "全球應對", "全球合作", "單邊制裁"], "a": [0, 1, 2], "e": "slide 003。", "id": "Q42-023", "l": 42, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-003）"]}, {"k": "判", "s": [6], "q": "堅持多邊主義，就是要打造多元共治的全球生態治理體系，而不是「甩鍋推責」。", "a": true, "e": "對（slide 006（3））。", "id": "Q42-024", "l": 42, "ch": 12, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（42-005）"]}, {"k": "簡", "s": [8, 9, 10, 11, 12], "q": "簡答：中國如何積極推動全球可持續發展？", "sum": "一句白話：作為最大的發展中國家，中國參與氣候治理（雙碳）、推進生物多樣性治理（COP15）、打造綠色一帶一路。", "pts": ["积极参与全球气候治理（力争2030年前实现碳达峰，努力争取2060年前实现碳中和）", "积极推进全球生物多样性治理（承办《生物多样性公约》第十五次缔约方大会）", "积极打造绿色“一带一路”"], "e": "第42堂知識點3（slide 008–012）。", "id": "Q42-025", "l": 42, "ch": 12, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（42-011）"]}, {"s": [5], "src": "", "card": "C43-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜國家安全的含義：\n国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于（＿①＿），以及（＿②＿）", "a": ["没有危险和不受内外威胁的状态", "保障持续安全状态的能力"], "e": "白話：國家安全指國家政權、主權、統一和領土完整、人民福祉、經濟社會可持續發展和國家其他重大利益「相對處於沒有危險和不受內外威脅的狀態」，以及「保障持續安全狀態的能力」——既是狀態，也是能力。「利莫大於治，害莫大於亂。」", "id": "Q43-001", "l": 43, "ch": 13, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-005）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [6], "src": "", "card": "C43-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜國家安全是民族復興的根基，社會穩定是國家強盛的前提：\n（＿①＿）是民族复兴的（＿②＿），（＿③＿）是国家强盛的（＿④＿）", "a": ["国家安全", "根基", "社会稳定", "前提"], "e": "講師：「把這個選擇題記住。」國家安全＝民族復興的根基；社會穩定＝國家強盛的前提（投影片寫「國家強盛」）。改革開放以來，黨始終把維護國家安全和社會安定作為黨和國家的一項基礎性工作。", "id": "Q43-002", "l": 43, "ch": 13, "pt": "A", "ps": 25, "pr": ["老師：…國家安全的前提 把這個選擇題記住 國家安全是什麼（43-006）", "投影片黃字／黃筆標記（43-006）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [6], "src": "", "card": "C43-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「国家安全」是：", "o": ["民族复兴的根基", "国家强盛的前提", "国家治理的基石", "立国之基"], "a": 0, "e": "「国家安全」→「民族复兴的根基」。記法：「安全打根基，穩定做前提」。", "id": "Q43-003", "l": 43, "ch": 13, "pt": "A", "ps": 25, "pr": ["老師：…國家安全的前提 把這個選擇題記住 國家安全是什麼（43-006）", "投影片黃字／黃筆標記（43-006）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [6], "src": "", "card": "C43-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「国家安全」是民族复兴的根基。", "a": true, "e": "對。「国家安全」→「民族复兴的根基」。", "id": "Q43-004", "l": 43, "ch": 13, "pt": "A", "ps": 25, "pr": ["老師：…國家安全的前提 把這個選擇題記住 國家安全是什麼（43-006）", "投影片黃字／黃筆標記（43-006）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [6], "src": "", "card": "C43-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「社会稳定」是：", "o": ["国家强盛的前提", "民族复兴的根基", "国家治理的基石", "立国之基"], "a": 0, "e": "「社会稳定」→「国家强盛的前提」。記法：「安全打根基，穩定做前提」。", "id": "Q43-005", "l": 43, "ch": 13, "pt": "A", "ps": 25, "pr": ["老師：…國家安全的前提 把這個選擇題記住 國家安全是什麼（43-006）", "投影片黃字／黃筆標記（43-006）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [6], "src": "", "card": "C43-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「社会稳定」是民族复兴的根基。", "a": false, "e": "錯。「社会稳定」應對應「国家强盛的前提」，「民族复兴的根基」對應的是「国家安全」。", "id": "Q43-006", "l": 43, "ch": 13, "pt": "A", "ps": 25, "pr": ["老師：…國家安全的前提 把這個選擇題記住 國家安全是什麼（43-006）", "投影片黃字／黃筆標記（43-006）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [7], "src": "", "card": "C43-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新時代國家安全形勢：「三個比歷史上任何時候」：\n当前我国国家安全（＿①＿）比历史上任何时候都要丰富，（＿②＿）比历史上任何时候都要宽广，（＿③＿）比历史上任何时候都要复杂；（＿④＿）的时代主题面临严峻挑战", "a": ["内涵和外延", "时空领域", "内外因素", "和平与发展"], "e": "習近平指出，當前我國國家安全內涵和外延比歷史上任何時候都要豐富，時空領域比歷史上任何時候都要寬廣，內外因素比歷史上任何時候都要複雜。外部：和平與發展的時代主題面臨嚴峻挑戰（講師：「時代主題這個一定要記住」）。", "id": "Q43-007", "l": 43, "ch": 13, "pt": "A", "ps": 28, "pr": ["老師：…之中 時代主題這個一定要記住 時代主題（43-007）", "投影片黃字／黃筆標記（43-007）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [8], "src": "", "card": "C43-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜風險的特點：關聯度高、傳導快、共振強：\n各种风险（＿①＿）、（＿②＿）、（＿③＿）……使小风险演变成大风险、局部风险演变成（＿④＿）、经济社会风险演变成（＿⑤＿）、国际风险演变成（＿⑥＿）", "a": ["关联度高", "传导快", "共振强", "系统风险", "政治风险", "国内风险"], "e": "各種風險關聯度高、傳導快、共振強，容易使小風險演變成大風險、局部風險演變成系統風險、經濟社會風險演變成政治風險、國際風險演變成國內風險。既有「黑天鵝」事件又有「灰犀牛」事件。", "id": "Q43-008", "l": 43, "ch": 13, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-008）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [9], "src": "", "card": "C43-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜由大向強、將強未強之際是高風險期：\n由大向强、将强未强之际往往是国家安全的（＿①＿）", "a": ["高风险期"], "e": "當前我國正處於中華民族偉大復興的關鍵時期，也處於從發展中大國邁向社會主義現代化強國的關鍵階段；由大向強、將強未強之際往往是國家安全的高風險期。距離民族復興越近，越不能懈怠。", "id": "Q43-009", "l": 43, "ch": 13, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-009）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [10], "src": "", "card": "C43-06", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜總體國家安全觀的提出（2014年4月15日）：\n（＿①＿），习近平在（＿②＿）上首次提出（＿③＿），强调必须坚持总体国家安全观，走出一条（＿④＿）", "a": ["2014年4月15日", "中央国家安全委员会第一次会议", "总体国家安全观", "中国特色国家安全道路"], "e": "講師：「首次提出，選擇題。」2014年4月15日，習近平在中央國家安全委員會第一次會議上首次提出總體國家安全觀，強調必須走出一條中國特色國家安全道路。", "id": "Q43-010", "l": 43, "ch": 13, "pt": "A", "ps": 24, "pr": ["老師：首次提出 選擇題 嗯（43-010）", "投影片黃字／黃筆標記（43-010）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"s": [11, 12], "src": "", "card": "C43-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜總體國家安全觀的豐富內涵（宗旨・根本・基礎・保障・依托）：\n以（＿①＿）为宗旨；以（＿②＿）为根本；以（＿③＿）为基础；以（＿④＿）为保障；以（＿⑤＿）为依托", "a": ["人民安全", "政治安全", "经济安全", "军事、科技、文化、社会安全", "促进国际安全"], "e": "講師：「相對來說很重要，需要大家去背」「以人民安全為宗旨，選擇」「以政治安全為根本」「以經濟安全為基礎」。五句：以人民安全為宗旨；以政治安全為根本；以經濟安全為基礎；以軍事、科技、文化、社會安全為保障；以促進國際安全為依托。", "id": "Q43-011", "l": 43, "ch": 13, "pt": "A", "ps": 53, "pr": ["老師：…對來說很重要 需要大家去背顧 好（43-011）", "老師：以人民 回答了民族復興關鍵時期面臨的特殊安全問題。", "a": true, "e": "對（講師：「需要大家去背一下」）。", "id": "Q43-045", "l": 43, "ch": 13, "pt": "A", "ps": 46, "pr": ["老師：…觀的指導意義 需要大家去背一下 回答了什麼問題（43-015）", "投影片黃字／黃筆標記（43-015）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"k": "簡", "s": [11, 12], "q": "簡答：總體國家安全觀的豐富內涵是什麼？", "sum": "一句白話：為了人民（宗旨），政治最根本，經濟打基礎，軍事科技文化社會作保障，國際安全作依托。", "pts": ["以人民安全为宗旨", "以政治安全为根本", "以经济安全为基础", "以军事、科技、文化、社会安全为保障", "以促进国际安全为依托"], "e": "講師：「相對來說很重要，需要大家去背。」", "id": "Q43-046", "l": 43, "ch": 13, "pt": "A", "ps": 71, "pr": ["老師：…對來說很重要 需要大家去背顧 好（43-011）", "老師：以人民安全爲宗旨 選擇題 堅實國家安全要怎麼樣（43-011）", "老師：…哪個位置 放在首要位置選擇題 完善這些政治工作的體系…（43-011）"]}, {"k": "簡", "s": [15], "q": "簡答：總體國家安全觀的指導意義是什麼？", "sum": "一句白話：它同時解決大國普遍會遇到的安全問題和中國復興關鍵期特有的安全問題，是國家安全工作的基本遵循。", "pts": ["回答了如何解决好大国发展进程中面临的共性安全问题", "回答了如何解决好中华民族伟大复兴关键时期面临的特殊安全问题", "为破解我国国家安全面临的难题、推进新时代国家安全工作提供了基本遵循"], "e": "講師：「需要大家去背一下。」", "id": "Q43-047", "l": 43, "ch": 13, "pt": "A", "ps": 46, "pr": ["老師：…觀的指導意義 需要大家去背一下 回答了什麼問題（43-015）", "投影片黃字／黃筆標記（43-015）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"k": "論", "s": [10, 11, 12, 13, 14, 15], "q": "論述：如何理解和堅持總體國家安全觀？", "sum": "一句白話：2014年提出；五個「以…為…」是內涵；關鍵在「總體」（大安全、系統思維、全過程、總體戰）；指導意義是同時回答共性和特殊安全問題。", "pts": ["2014年4月15日在中央国家安全委员会第一次会议上首次提出，走出一条中国特色国家安全道路", "以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托", "总体国家安全观的关键是“总体”：强调“大安全”理念、系统思维和方法、贯穿各方面全过程、打总体战", "必须把安全和发展置于同等重要地位", "既回答了大国发展进程中面临的共性安全问题，又回答了中华民族伟大复兴关键时期面临的特殊安全问题"], "e": "第43堂知識點5–8。", "id": "Q43-048", "l": 43, "ch": 13, "pt": "A", "ps": 97, "pr": ["老師：…對來說很重要 需要大家去背顧 好（43-011）", "老師：首次提出 選擇題 嗯（43-010）", "老師：以人民安全爲宗旨 選擇題 堅實國家安全要怎麼樣（43-011）"]}, {"s": [3], "src": "", "card": "C44-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜統籌發展和安全是黨治國理政的一個重大原則：\n统筹发展和安全，是党和国家的一项（＿①＿），是我们党治国理政的一个（＿②＿）。党的（＿③＿）首次把统筹发展和安全纳入（＿④＿）时期我国经济社会发展的指导思想，党的（＿⑤＿）强调“统筹发展和安全”，并将其写入（＿⑥＿）", "a": ["基础性工作", "重大原则", "十九届五中全会", "“十四五”", "二十大", "党章"], "e": "統籌發展和安全，是黨和國家的一項基礎性工作，是我們黨治國理政的一個重大原則。黨的十九屆五中全會首次把統籌發展和安全納入「十四五」時期經濟社會發展的指導思想；黨的二十大強調「統籌發展和安全」，並將其寫入黨章；黨中央明確提出加快構建新安全格局。", "id": "Q44-001", "l": 44, "ch": 13, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（44-003）"]}, {"s": [4], "src": "", "card": "C44-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜發展和安全是兩件大事：動力 vs 保障：\n发展解决的是（＿①＿）问题，是推动国家和民族永续绵延的（＿②＿）；安全解决的是（＿③＿）问题，是确保国家和民族行稳致远的（＿④＿）。发展具有基础性、根本性，是解决安全问题的（＿⑤＿），发展就是（＿⑥＿）", "a": ["动力", "根本支撑", "保障", "坚强柱石", "总钥匙", "最大的安全"], "e": "講師：「發展就是最大的安全，這是第一層含義要背過的。」發展解決的是動力問題，是推動國家和民族永續綿延的根本支撐；安全解決的是保障問題，是確保國家和民族行穩致遠的堅強柱石。發展是解決安全問題的總鑰匙。", "id": "Q44-002", "l": 44, "ch": 13, "pt": "A", "ps": 26, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"s": [4], "src": "", "card": "C44-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「发展」解決的是：", "o": ["动力问题——根本支撑", "保障问题——坚强柱石", "效率问题——总体布局", "公平问题——价值目标"], "a": 0, "e": "「发展」→「动力问题——根本支撑」。記法：「發展＝動力＝根本支撐＝總鑰匙＝最大的安全；安全＝保障＝堅強柱石」。", "id": "Q44-003", "l": 44, "ch": 13, "pt": "A", "ps": 26, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"s": [4], "src": "", "card": "C44-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「发展」解決的是动力问题——根本支撑。", "a": true, "e": "對。「发展」→「动力问题——根本支撑」。", "id": "Q44-004", "l": 44, "ch": 13, "pt": "A", "ps": 26, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"s": [4], "src": "", "card": "C44-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「安全」解決的是：", "o": ["保障问题——坚强柱石", "动力问题——根本支撑", "效率问题——总体布局", "公平问题——价值目标"], "a": 0, "e": "「安全」→「保障问题——坚强柱石」。記法：「發展＝動力＝根本支撐＝總鑰匙＝最大的安全；安全＝保障＝堅強柱石」。", "id": "Q44-005", "l": 44, "ch": 13, "pt": "A", "ps": 26, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"s": [4], "src": "", "card": "C44-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「安全」解決的是动力问题——根本支撑。", "a": false, "e": "錯。「安全」應對應「保障问题——坚强柱石」，「动力问题——根本支撑」對應的是「发展」。", "id": "Q44-006", "l": 44, "ch": 13, "pt": "A", "ps": 26, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"s": [4], "src": "", "card": "C44-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜發展和安全是一體之兩翼、驅動之雙輪：\n发展和安全是（＿①＿）、（＿②＿），必须同步推进；以发展（＿③＿）安全、以安全（＿④＿）发展", "a": ["一体之两翼", "驱动之双轮", "促", "保"], "e": "講師：「第二層含義……是一體兩翼，就像一隻鳥它有翅膀。」必須同步推進：堅持發展和安全並重，以發展促安全、以安全保發展，努力建久安之勢、成長治之業。", "id": "Q44-007", "l": 44, "ch": 13, "pt": "A", "ps": 15, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"s": [5], "src": "", "card": "C44-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜以新安全格局保障新發展格局：\n牢牢守住（＿①＿）这条底线是构建新发展格局的（＿②＿）；实现（＿③＿）和（＿④＿）的良性互动", "a": ["安全发展", "重要前提和保障", "高质量发展", "高水平安全"], "e": "牢牢守住安全發展這條底線，是構建新發展格局的重要前提和保障。增強我國的生存力、競爭力、發展力、持續力，確保中華民族偉大復興進程不被遲滯甚至中斷。必須統籌維護國家安全各類要素、各個領域、各方資源、各種手段，實現高質量發展和高水平安全的良性互動。", "id": "Q44-008", "l": 44, "ch": 13, "pt": "C", "ps": 0, "pr": []}, {"s": [6], "src": "", "card": "C44-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜構建新安全格局＝戰略選擇＋重大舉措：\n构建新安全格局是应对国家安全形势新变化新趋势的（＿①＿），是全面贯彻落实总体国家安全观的（＿②＿）；把维护（＿③＿）放在（＿④＿）", "a": ["战略选择", "重大举措", "政治安全", "首要位置"], "e": "講師：「那麼注意了。」構建新安全格局是應對國家安全形勢新變化新趨勢的戰略選擇，是全面貫徹落實總體國家安全觀的重大舉措。要把維護政治安全放在首要位置（講師：「注意這裏，這是一個選擇題。」）。", "id": "Q44-009", "l": 44, "ch": 13, "pt": "A", "ps": 25, "pr": ["老師：注意這裏, 這是一個選擇題, 我們的政治安全要放在…（44-006）", "老師：那麼注意了。（44-006）", "投影片黃字／黃筆標記（44-006）"]}, {"s": [7], "src": "", "card": "C44-06", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜政治安全是國家安全的根本（心臟）：\n必须把维护政治安全作为应对各领域安全风险挑战的（＿①＿）。（＿②＿）是国家安全的（＿③＿）；在国家安全这一肌体中，政治安全是（＿④＿）", "a": ["首要任务", "政治安全", "根本", "心脏"], "e": "講師：「政治安全是國家安全的根本，這個是我們需要去記憶的選擇題。」必須把維護政治安全作為應對各領域安全風險挑戰的首要任務。政治安全涉及國家主權、政權、制度和意識形態的穩固；形象地說，在國家安全這一肌體中，政治安全是心臟。", "id": "Q44-010", "l": 44, "ch": 13, "pt": "A", "ps": 27, "pr": ["老師：…全的根本, 這個是我們需要去記憶的選擇題, 提到安全…（44-007）", "投影片黃字／黃筆標記（44-007）"]}, {"s": [8, 9, 10], "src": "", "card": "C44-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜維護政治安全：政權・制度・意識形態：\n维护（＿①＿），就是要毫不动摇坚持和巩固党的领导和长期执政地位；维护（＿②＿），就是要毫不动摇坚持和完善中国特色社会主义制度；维护（＿③＿），就是要毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位", "a": ["政权安全", "制度安全", "意识形态安全"], "e": "講師：「這五個標題要背過。」維護政權安全＝堅持和鞏固黨的領導和長期執政地位；維護制度安全＝堅持和完善中國特色社會主義制度；維護意識形態安全＝堅持和鞏固馬克思主義在意識形態領域的指導地位。", "id": "Q44-011", "l": 44, "ch": 13, "pt": "A", "ps": 62, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）"]}, {"s": [8, 9, 10], "src": "", "card": "C44-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "「维护政权安全」就是要：", "o": ["毫不动摇坚持和巩固党的领导和长期执政地位", "毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位", "毫不动摇坚持和完善中国特色社会主义制度"], "a": 0, "e": "「维护政权安全」→「毫不动摇坚持和巩固党的领导和长期执政地位」。記法：「政權→黨的領導；制度→中特制度；意識形態→馬克思主義指導地位」。", "id": "Q44-012", "l": 44, "ch": 13, "pt": "A", "ps": 62, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）"]}, {"s": [8, 9, 10], "src": "", "card": "C44-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "「维护政权安全」，就是要毫不动摇坚持和巩固党的领导和长期执政地位。", "a": true, "e": "對。「维护政权安全」→「毫不动摇坚持和巩固党的领导和长期执政地位」。", "id": "Q44-013", "l": 44, "ch": 13, "pt": "A", "ps": 62, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）"]}, {"s": [8, 9, 10], "src": "", "card": "C44-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "「维护制度安全」就是要：", "o": ["毫不动摇坚持和完善中国特色社会主义制度", "毫不动摇坚持和巩固党的领导和长期执政地位", "毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位"], "a": 0, "e": "「维护制度安全」→「毫不动摇坚持和完善中国特色社会主义制度」。記法：「政權→黨的領導；制度→中特制度；意識形態→馬克思主義指導地位」。", "id": "Q44-014", "l": 44, "ch": 13, "pt": "A", "ps": 62, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）"]}, {"s": [8, 9, 10], "src": "", "card": "C44-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "「维护制度安全」，就是要毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位。", "a": false, "e": "錯。「维护制度安全」應對應「毫不动摇坚持和完善中国特色社会主义制度」，「毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位」對應的是「维护意识形态安全」。", "id": "Q44-015", "l": 44, "ch": 13, "pt": "A", "ps": 62, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）"]}, {"s": [8, 9, 10], "src": "", "card": "C44-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "「维护意识形态安全」就是要：", "o": ["毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位", "毫不动摇坚持和完善中国特色社会主义制度", "毫不动摇坚持和巩固党的领导和长期执政地位"], "a": 0, "e": "「维护意识形态安全」→「毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位」。記法：「政權→黨的領導；制度→中特制度；意識形態→馬克思主義指導地位」。", "id": "Q44-016", "l": 44, "ch": 13, "pt": "A", "ps": 62, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）"]}, {"s": [8, 9, 10], "src": "", "card": "C44-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "「维护意识形态安全」，就是要毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位。", "a": true, "e": "對。「维护意识形态安全」→「毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位」。", "id": "Q44-017", "l": 44, "ch": 13, "pt": "A", "ps": 62, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）"]}, {"s": [8], "src": "", "card": "C44-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨在國家政權結構中總攬全局、協調各方的核心地位：\n确认了党在国家政权结构中（＿①＿）、（＿②＿）的核心地位", "a": ["总揽全局", "协调各方"], "e": "講師：「總攬全局協調各方的核心地位，這個作為選擇題你要知道。」我國憲法確認了中國共產黨的領導地位，確認了黨在國家政權結構中總攬全局、協調各方的核心地位。絕不能犯戰略性、顛覆性錯誤。", "id": "Q44-018", "l": 44, "ch": 13, "pt": "A", "ps": 34, "pr": ["老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）", "老師：…的核心地位, 這個作爲選擇題你要知道。 我們黨在國家…（44-008）", "投影片黃字／黃筆標記（44-008）"]}, {"s": [9], "src": "", "card": "C44-09", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜社會主義制度是根本制度 vs 人民代表大會制度是根本政治制度：\n制度稳则国家稳，（＿①＿）是我国的（＿②＿）", "a": ["社会主义制度", "根本制度"], "e": "講師：「這裏涉及到一個比較容易混淆的考點……社會主義制度是我國的根本制度，而人民代表大會制度是我國的根本政治制度……少了一個政治，就完全是不同的答案。」制度穩則國家穩。", "id": "Q44-019", "l": 44, "ch": 13, "pt": "A", "ps": 40, "pr": ["老師：…及到一個比較容易混淆的考點哈。 社會主義制度是我國的…（44-009）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：所以這一答案一定要注意不要混淆。 在這個考試過程中…（44-009）"]}, {"s": [10], "src": "", "card": "C44-10", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜意識形態事關舉什麼旗、走什麼路：\n意识形态事关（＿①＿）、（＿②＿）的重大问题；把意识形态工作的（＿③＿）、（＿④＿）、（＿⑤＿）牢牢掌握在党的手中", "a": ["举什么旗", "走什么路", "领导权", "管理权", "话语权"], "e": "搞亂一個社會、顛覆一個政權，往往先從意識形態領域打開缺口。要把維護意識形態安全擺在極端重要位置，把意識形態工作的領導權、管理權、話語權牢牢掌握在黨的手中。", "id": "Q44-020", "l": 44, "ch": 13, "pt": "B", "ps": 5, "pr": ["同頁有考點提示：…態安全, 來第四個標題要背, 來第五個,（44-010）", "投影片黃字／黃筆標記（44-010）"]}, {"s": [11], "src": "", "card": "C44-11", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜政治安全、人民安全、國家利益至上有機統一：\n（＿①＿）是维护人民安全和国家利益的（＿②＿）；（＿③＿）居于（＿④＿）；（＿⑤＿）是实现政治安全和人民安全的（＿⑥＿）", "a": ["政治安全", "根本保证", "人民安全", "中心地位", "国家利益至上", "要求和原则"], "e": "講師：「一定要記住他們之間的關係。」政治安全是維護人民安全和國家利益的根本保證；人民安全居於中心地位；國家利益至上是實現政治安全和人民安全的要求和原則。", "id": "Q44-021", "l": 44, "ch": 13, "pt": "A", "ps": 24, "pr": ["老師：…係再來梳理一遍, 一定要記住他們之間的關係, 政治安…（44-011）"]}, {"s": [11], "src": "", "card": "C44-11", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在三者有機統一中，「政治安全」是／居於：", "o": ["根本保证", "中心地位", "要求和原则"], "a": 0, "e": "「政治安全」→「根本保证」。記法：「政治＝根本保證；人民＝中心地位；國家利益＝要求和原則」。", "id": "Q44-022", "l": 44, "ch": 13, "pt": "A", "ps": 24, "pr": ["老師：…係再來梳理一遍, 一定要記住他們之間的關係, 政治安…（44-011）"]}, {"s": [11], "src": "", "card": "C44-11", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「政治安全」是（居於）根本保证。", "a": true, "e": "對。「政治安全」→「根本保证」。", "id": "Q44-023", "l": 44, "ch": 13, "pt": "A", "ps": 24, "pr": ["老師：…係再來梳理一遍, 一定要記住他們之間的關係, 政治安…（44-011）"]}, {"s": [11], "src": "", "card": "C44-11", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在三者有機統一中，「人民安全」是／居於：", "o": ["中心地位", "根本保证", "要求和原则"], "a": 0, "e": "「人民安全」→「中心地位」。記法：「政治＝根本保證；人民＝中心地位；國家利益＝要求和原則」。", "id": "Q44-024", "l": 44, "ch": 13, "pt": "A", "ps": 24, "pr": ["老師：…係再來梳理一遍, 一定要記住他們之間的關係, 政治安…（44-011）"]}, {"s": [11], "src": "", "card": "C44-11", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「人民安全」是（居於）要求和原则。", "a": false, "e": "錯。「人民安全」應對應「中心地位」，「要求和原则」對應的是「国家利益至上」。", "id": "Q44-025", "l": 44, "ch": 13, "pt": "A", "ps": 24, "pr": ["老師：…係再來梳理一遍, 一定要記住他們之間的關係, 政治安…（44-011）"]}, {"s": [11], "src": "", "card": "C44-11", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在三者有機統一中，「国家利益至上」是／居於：", "o": ["要求和原则", "中心地位", "根本保证"], "a": 0, "e": "「国家利益至上」→「要求和原则」。記法：「政治＝根 驅動之（＿②＿），必須同步推進。", "a": ["两翼", "双轮"], "e": "slide 004（2）。", "id": "Q44-050", "l": 44, "ch": 13, "pt": "A", "ps": 33, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"k": "多", "s": [10], "q": "要牢牢掌握在黨的手中的意識形態工作權力包括：", "o": ["領導權", "管理權", "話語權", "否決權"], "a": [0, 1, 2], "e": "slide 010。", "id": "Q44-051", "l": 44, "ch": 13, "pt": "A", "ps": 20, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "投影片黃字／黃筆標記（44-010）"]}, {"k": "簡", "s": [12, 13, 14, 15, 16, 17], "q": "簡答：如何維護重點領域國家安全？", "sum": "一句白話：守好國土、經濟、社會、網絡人工智能數據、生物和公共衛生、外部這六個安全。", "pts": ["维护国土安全（国土安全是立国之基）", "维护经济安全（经济安全是国家安全的基础）", "维护社会安全", "维护网络、人工智能、数据安全", "维护生物安全和公共卫生安全", "维护外部安全"], "e": "講師：「這六個安全一定要把它記住，作為一個簡答題。」", "id": "Q44-052", "l": 44, "ch": 13, "pt": "A", "ps": 77, "pr": ["老師：…機統一的, 這五個標題要背過, 我們繼續來第五個知識…（44-012）", "老師：…安全, 這六個安全一定要把它記住, 作爲一個簡答題,…（44-017）", "老師：…的耕地紅線, 所以一個選擇題吧, 18億的耕地紅線,…（44-013）"]}, {"k": "論", "s": [7, 8, 9, 10, 11], "q": "論述：為什麼和如何把維護政治安全放在首要位置？", "sum": "一句白話：政治安全是國家安全的根本（心臟），要守住政權、制度、意識形態三樣，並把政治安全、人民安全、國家利益至上統一起來。", "pts": ["构建新安全格局，必须把维护政治安全作为应对各领域安全风险挑战的首要任务；政治安全是国家安全的根本", "维护政权安全，就是要毫不动摇坚持和巩固党的领导和长期执政地位", "维护制度安全，就是要毫不动摇坚持和完善中国特色社会主义制度", "维护意识形态安全，就是要毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位", "政治安全与人民安全、国家利益至上是有机统一的"], "e": "講師：「這五個標題要背過。」（slide 007–011）", "id": "Q44-053", "l": 44, "ch": 13, "pt": "A", "ps": 113, "pr": ["老師：…全的根本, 這個是我們需要去記憶的選擇題, 提到安全…（44-007）", "老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…係再來梳理一遍, 一定要記住他們之間的關係, 政治安…（44-011）"]}, {"s": [3], "src": "", "card": "C45-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜推進國家安全體系和能力現代化的原因：\n国家安全体系和能力是国家安全制度及其执行能力的（＿①＿）；推进国家安全体系和能力现代化，是新时代维护国家安全的（＿②＿），也是推进国家治理体系和治理能力现代化的（＿③＿）", "a": ["集中体现", "迫切要求", "重要工程"], "e": "國家安全體系和能力是國家安全制度及其執行能力的集中體現。推進國家安全體系和能力現代化，是新時代維護國家安全的迫切要求，也是推進國家治理體系和治理能力現代化的重要工程；要全面構建系統完備、科學規範、運行有效的國家安全制度體系。", "id": "Q45-001", "l": 45, "ch": 13, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（45-003）"]}, {"s": [4], "src": "", "card": "C45-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜開創新時代國家安全工作新局面（二十大部署）：\n推进（＿①＿），推动建设（＿②＿），着力提高（＿③＿）能力和水平，不断塑造总体有利的国家安全战略态势", "a": ["国家安全体系和能力现代化", "更高水平的平安中国", "防范化解重大风险"], "e": "講師：「來注意了。」黨的二十大對推進國家安全體系和能力現代化、堅決維護國家安全和社會穩定作出戰略部署：推進國家安全體系和能力現代化，推動建設更高水平的平安中國，著力提高防範化解重大風險能力和水平。", "id": "Q45-002", "l": 45, "ch": 13, "pt": "B", "ps": 5, "pr": ["老師：來注意了。（45-004）", "投影片黃字／黃筆標記（45-004）"]}, {"s": [5], "src": "", "card": "C45-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜健全國家安全體系是保障國家安全的治本之策：\n健全国家安全体系、加强国家安全制度建设，是保障国家安全的（＿①＿），是维护和塑造国家安全的（＿②＿）；坚持（＿③＿）对国家安全工作的（＿④＿）", "a": ["治本之策", "重要支撑", "党中央", "集中统一领导"], "e": "講師：「就是我們治本之策，選擇題。」健全國家安全體系、加強國家安全制度建設，是保障國家安全的治本之策，是維護和塑造國家安全的重要支撐。首先要堅持黨中央對國家安全工作的集中統一領導。", "id": "Q45-003", "l": 45, "ch": 13, "pt": "A", "ps": 12, "pr": ["老師：就是我們治本之策，選擇題。（45-005）", "投影片黃字／黃筆標記（45-005）"]}, {"s": [5, 6], "src": "", "card": "C45-04", "tag": ["簡答題考點"], "auto": 1, "k": "填", "q": "填空｜健全完善國家安全體系（四點）：\n坚持党中央对国家安全工作的集中统一领导；强化（＿①＿）；加快（＿②＿）工作战略布局，健全反制裁、反干涉、反（＿③＿）；构建（＿④＿）、（＿⑤＿）的国家安全防护体系", "a": ["国家安全工作协调机制", "涉外法治", "“长臂管辖”", "全域联动", "立体高效"], "e": "（1）堅持黨中央對國家安全工作的集中統一領導，完善高效權威的國家安全領導體制；（2）強化國家安全工作協調機制，完善法治、戰略、政策、風險監測預警、國家應急管理等體系；（3）加快涉外法治工作戰略布局，健全反制裁、反干涉、反「長臂管轄」機制；（4）完善國家安全力量布局，構建全域聯動、立體高效的國家安全防護體系。", "id": "Q45-004", "l": 45, "ch": 13, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（45-005）"]}, {"s": [7], "src": "", "card": "C45-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜國家安全能力建設：基礎性、根本性、長期性：\n国家安全能力建设具有（＿①＿）、（＿②＿）、（＿③＿）的意义；全面加强（＿④＿）……筑牢国家安全（＿⑤＿）", "a": ["基础性", "根本性", "长期性", "国家安全教育", "人民防线"], "e": "國家安全能力建設具有基礎性、根本性、長期性的意義。要從實現中華民族偉大復興的戰略高度分析需求；突出實戰實用鮮明導向；加強重點領域安全能力和海外安全保障能力建設；全面加強國家安全教育，築牢國家安全人民防線。", "id": "Q45-005", "l": 45, "ch": 13, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-007）"]}, {"s": [8], "src": "", "card": "C45-06", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜建設更高水平的平安中國：\n建设平安中国，是全面建设社会主义现代化国家的（＿①＿）和（＿②＿）；全面提升平安中国建设（＿③＿）、（＿④＿）、（＿⑤＿）、（＿⑥＿）水平", "a": ["重要内容", "重要保障", "科学化", "社会化", "法治化", "智能化"], "e": "建設平安中國，是全面建設社會主義現代化國家的重要內容和重要保障。要全面提升平安中國建設科學化、社會化、法治化、智能化水平，努力建設治理效能更強、安全穩定局面更鞏固、人民更滿意的平安中國。", "id": "Q45-006", "l": 45, "ch": 13, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-008）"]}, {"s": [8], "src": "", "card": "C45-06", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜建設更高水平的平安中國", "model": "建设平安中国，是全面建设社会主义现代化国家的重要内容和重要保障；全面提升平安中国建设科学化、社会化、法治化、智能化水平", "pts": ["努力建设治理效能更强的平安中国", "努力建设安全稳定局面更巩固的平安中国", "努力建设人民更满意的平安中国"], "e": "記法：「四化：科學・社會・法治・智能」；三個「更」：治理效能更強・安全穩定更鞏固・人民更滿意。", "id": "Q45-007", "l": 45, "ch": 13, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-008）"]}, {"s": [8], "src": "", "card": "C45-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜公共安全治理模式轉型：事後處置→事前預防：\n坚持（＿①＿）、（＿②＿），建立（＿③＿）框架……推动公共安全治理模式由以（＿④＿）为主向以（＿⑤＿）为主转型", "a": ["安全第一", "预防为主", "大安全大应急", "事后处置", "事前预防"], "e": "堅持安全第一、預防為主，建立大安全大應急框架，完善公共安全體系，推動公共安全治理模式由以事後處置為主向以事前預防為主轉型。", "id": "Q45-008", "l": 45, "ch": 13, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-008）"]}, {"s": [9], "src": "", "card": "C45-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜安全穩定局面更鞏固：源頭防範、多元化解、信訪：\n社会更加安全稳定有序，是检验更高水平的平安中国建设成效的（＿①＿）；坚持（＿②＿）……坚持（＿③＿）", "a": ["重要标志", "源头防范", "多元化解"], "e": "社會更加安全穩定有序，是檢驗更高水平的平安中國建設成效的重要標誌。堅持源頭防範（抓早抓小抓苗頭）；堅持多元化解（注重運用非訴訟糾紛解決機制）；加強和改進信訪工作。", "id": "Q45-009", "l": 45, "ch": 13, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-009）"]}, {"s": [11], "src": "", "card": "C45-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新形勢下國家安全和社會穩定面臨的威脅和挑戰增多：\n新形势下我国国家安全和社会稳定面临的（＿①＿）；当前和今后一个时期是我国各类矛盾和风险（＿②＿）", "a": ["威胁和挑战增多", "易发期"], "e": "講師：「這一塊呢我們需要去背誦。」當前和今後一個時期是我國各類矛盾和風險易發期；風險有外部風險也有內部風險，有一般風險也有重大風險。", "id": "Q45-010", "l": 45, "ch": 13, "pt": "A", "ps": 26, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "投影片黃字／黃筆標記（45-011）"]}, {"s": [11, 12, 13], "src": "", "card": "C45-10", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜多措並舉提高防範化解重大風險能力（三點）：\n坚持（＿①＿）和（＿②＿）；下好（＿③＿）、打好（＿④＿），力争把风险化解在（＿⑤＿）；运用（＿⑥＿）应对风险挑战的冲击", "a": ["底线思维", "极限思维", "先手棋", "主动仗", "源头", "制度威力"], "e": "①堅持底線思維和極限思維：從最壞處着眼，做最充分的準備，朝好的方向努力，爭取最好的結果；②下好先手棋、打好主動仗，力爭把風險化解在源頭：既要警惕「黑天鵝」也要防範「灰犀牛」；③運用制度威力應對風險挑戰的衝擊。", "id": "Q45-011", "l": 45, "ch": 13, "pt": "A", "ps": 20, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "投影片黃字／黃筆標記（45-011）"]}, {"s": [11, 12, 13], "src": "", "card": "C45-10", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜多措並舉提高防範化解重大風險能力（三點）", "model": "坚持底线思维和极限思维；下好先手棋、打好主动仗，力争把风险化解在源头；运用制度威力应对风险挑战的冲击", "pts": ["坚持底线思维和极限思维", "下好先手棋、打好主动仗，力争把风险化解在源头", "运用制度威力应对风险挑战的冲击"], "e": "記法：「底線極限・先手主動・制度威力」。", "id": "Q45-012", "l": 45, "ch": 13, "pt": "A", "ps": 20, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "投影片黃字／黃筆標記（45-011）"]}, {"s": [12], "src": "", "card": "C45-11", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜「黑天鵝」與「灰犀牛」：\n既要高度警惕（＿①＿）事件，也要防范（＿②＿）事件；……打好化险为夷、转危为机的（＿③＿）", "a": ["“黑天鹅”", "“灰犀牛”", "战略主动战"], "e": "既要高度警惕「黑天鵝」事件，也要防範「灰犀牛」事件；既要有防範風險的先手，也要有應對和化解風險挑戰的高招；力爭不出現重大風險或在出現重大風險時扛得住、過得去。總想過太平日子、不想鬥爭是不切實際的。", "id": "Q45-013", "l": 45, "ch": 13, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-012）"]}, {"k": "單", "s": [5], "q": "保障國家安全的「治本之策」是：", "o": ["健全國家安全體系、加強國家安全制度建設", "加強國家安全教育", "建設平安中國", "擴大國防開支"], "a": 0, "e": "講師：「就是我們治本之策，選擇題。」", "id": "Q45-014", "l": 45, "ch": 13, "pt": "A", "ps": 30, "pr": ["老師：就是我們治本之策，選擇題。（45-005）", "投影片黃字／黃筆標記（45-005）"]}, {"k": "單", "s": [7], "q": "國家安全能力建設具有：", "o": ["基礎性、根本性、長期性的意義", "臨時性、局部性的意義", "戰術性、短期性的意義", "象徵性的意義"], "a": 0, "e": "slide 007。", "id": "Q45-015", "l": 45, "ch": 13, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（45-007）"]}, {"k": "單", "s": [8], "q": "建設平安中國，是全面建設社會主義現代化國家的：", "o": ["重要內容和重要保障", "根本目的", "首要任務", "本質要求"], "a": 0, "e": "slide 008。", "id": "Q45-016", "l": 45, "ch": 13, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（45-008）"]}, {"k": "判", "s": [8], "q": "要推動公共安全治理模式由以事前預防為主向以事後處置為主轉型。", "a": false, "e": "錯，方向相反：由事後處置為主向事前預防為主轉型。", "id": "Q45-017", "l": 45, "ch": 13, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（45-008）"]}, {"k": "多", "s": [8], "q": "要全面提升平安中國建設的哪些水平？", "o": ["科學化", "社會化", "法治化", "智能化", "軍事化"], "a": [0, 1, 2, 3], "e": "slide 008。", "id": "Q45-018", "l": 45, "ch": 13, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（45-008）"]}, {"k": "單", "s": [11], "q": "「從最壞處着眼，做最充分的準備，朝好的方向努力，爭取最好的結果」體現的是：", "o": ["底線思維和極限思維", "戰略思維", "創新思維", "歷史思維"], "a": 0, "e": "slide 011 ①。", "id": "Q45-019", "l": 45, "ch": 13, "pt": "A", "ps": 33, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "投影片黃字／黃筆標記（45-011）"]}, {"k": "判", "s": [12], "q": "既要高度警惕「黑天鵝」事件，也要防範「灰犀牛」事件。", "a": true, "e": "對（slide 012）。", "id": "Q45-020", "l": 45, "ch": 13, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（45-012）"]}, {"k": "單", "s": [9], "q": "檢驗更高水平的平安中國建設成效的重要標誌是：", "o": ["社會更加安全穩定有序", "經濟增長速度", "軍費規模", "城市化率"], "a": 0, "e": "slide 009。", "id": "Q45-021", "l": 45, "ch": 13, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（45-009）"]}, {"k": "填", "s": [6], "q": "加快涉外法治工作戰略布局，健全反制裁、反干涉、反“（＿①＿）”。", "a": ["长臂管辖"], "e": "slide 006（3）。", "id": "Q45-022", "l": 45, "ch": 13, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（45-005）"]}, {"k": "單", "s": [5], "q": "對國家安全工作實行集中統一領導的是：", "o": ["黨中央", "國務院", "全國人大", "中央軍委"], "a": 0, "e": "slide 005（1）。", "id": "Q45-023", "l": 45, "ch": 13, "pt": "A", "ps": 20, "pr": ["老師：就是我們治本之策，選擇題。（45-005）", "投影片黃字／黃筆標記（45-005）"]}, {"k": "判", "s": [11], "q": "當前和今後一個時期是我國各類矛盾和風險易發期。", "a": true, "e": "對（講師：「這一塊呢我們需要去背誦」）。", "id": "Q45-024", "l": 45, "ch": 13, "pt": "A", "ps": 44, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "投影片黃字／黃筆標記（45-011）"]}, {"k": "簡", "s": [11, 12, 13], "q": "簡答：如何多措並舉提高防範化解重大風險能力？", "sum": "一句白話：做最壞打算（底線極限思維）、先出手化解在源頭、用制度的力量應對衝擊。", "pts": ["坚持底线思维和极限思维", "下好先手棋、打好主动仗，力争把风险化解在源头", "运用制度威力应对风险挑战的冲击"], "e": "第45堂知識點5（slide 011–013）。", "id": "Q45-025", "l": 45, "ch": 13, "pt": "A", "ps": 39, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "投影片黃字／黃筆標記（45-011）"]}, {"k": "論", "s": [3, 5, 7, 8, 11], "q": "論述：如何開創新時代國家安全工作新局面？", "sum": "一句白話：推進國家安全體系和能力現代化（健全體系、增強能力），建設更高水平的平安中國，提高防範化解重大風險能力。", "pts": ["推进国家安全体系和能力现代化（是新时代维护国家安全的迫切要求）", "健全完善国家安全体系（保障国家安全的治本之策）", "增强维护国家安全能力（国家安全能力建设具有基础性、根本性、长期性的意义）", "建设更高水平的平安中国", "提高防范化解重大风险能力"], "e": "第45堂知識點1–5 標題。", "id": "Q45-026", "l": 45, "ch": 13, "pt": "A", "ps": 41, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "老師：就是我們治本之策，選擇題。（45-005）", "投影片黃字／黃筆標記（45-005）"]}, {"s": [5], "src": "", "card": "C46-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜國防和軍隊建設是捍衛國家主權、安全、發展利益的堅強後盾：\n国防和军队建设是捍卫国家（＿①＿）、（＿②＿）、（＿③＿）的（＿④＿）；国无防（＿⑤＿），民无兵（＿⑥＿）", "a": ["主权", "安全", "发展利益", "坚强后盾", "不立", "不安"], "e": "白話：沒有強大軍隊，就沒有強大祖國。國無防不立，民無兵不安。近代中國被動挨打，重要原因就是國防落後、軍隊虛弱。", "id": "Q46-001", "l": 46, "ch": 14, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（46-005）"]}, {"s": [5, 6], "src": "", "card": "C46-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜堅強後盾的三個理由：\n（＿①＿）；（＿②＿），遇到的阻力和压力就会越大，面临的风险就会越多；当今世界，和平与发展仍然是（＿③＿），但并（＿④＿）", "a": ["国无防不立，民无兵不安", "中国越发展壮大", "时代主题", "不太平"], "e": "講師：「這就是這三個點，如果作為選擇題的話，你把這三個點羅列上去，其實不難。」（1）國無防不立，民無兵不安；（2）中國越發展壯大，遇到的阻力和壓力就會越大，面臨的風險就會越多——只有以強大軍事實力為後盾，其他安全才能托底；（3）當今世界，和平與發展仍然是時代主題，但並不太平，家門口生亂生戰的可能性增大。", "id": "Q46-002", "l": 46, "ch": 14, "pt": "A", "ps": 24, "pr": ["老師：…就是這三個點 如果作爲選擇題的話 你把這三個點（46-006）", "投影片黃字／黃筆標記（46-005）"]}, {"s": [6], "src": "", "card": "C46-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜鞏固國防和強大人民軍隊：戰略支撐＋必然要求：\n巩固国防和强大人民军队是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的（＿①＿）；建设同我国（＿②＿）、同国家安全和发展利益（＿③＿）的巩固国防和强大人民军队，是新时代党和国家事业发展的（＿④＿）", "a": ["战略支撑", "国际地位相称", "相适应", "必然要求"], "e": "注意1：鞏固國防和強大人民軍隊是新時代堅持和發展中國特色社會主義、實現中華民族偉大復興的戰略支撐。注意2：建設同我國國際地位相稱、同國家安全和發展利益相適應的鞏固國防和強大人民軍隊，是新時代黨和國家事業發展的必然要求。", "id": "Q46-003", "l": 46, "ch": 14, "pt": "A", "ps": 12, "pr": ["老師：…就是這三個點 如果作爲選擇題的話 你把這三個點（46-006）", "投影片黃字／黃筆標記（46-006）"]}, {"s": [7, 8], "src": "", "card": "C46-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜新時代人民軍隊使命任務：「四個戰略支撐」：\n为巩固（＿①＿）和我国（＿②＿）提供战略支撑；为捍卫（＿③＿）提供战略支撑；为维护我国（＿④＿）提供战略支撑；为促进（＿⑤＿）提供战略支撑", "a": ["中国共产党领导", "社会主义制度", "国家主权、统一和领土完整", "海外利益", "世界和平与发展"], "e": "講師：「簡答題，總共四個戰略支撐，要背過的」「標黃的一定要背」。（1）為鞏固中國共產黨領導和我國社會主義制度提供戰略支撐；（2）為捍衛國家主權、統一和領土完整提供戰略支撐；（3）為維護我國海外利益提供戰略支撐；（4）為促進世界和平與發展提供戰略支撐。", "id": "Q46-004", "l": 46, "ch": 14, "pt": "A", "ps": 76, "pr": ["老師：…麼這一塊 那裏面是需要去背的 "投影片黃字／黃筆標記（48-003）"]}, {"s": [4], "src": "", "card": "C48-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨對軍隊絕對領導的一整套制度：\n军队最高领导权和指挥权属于（＿①＿）、（＿②＿），中央军委实行（＿③＿）；实行（＿④＿）", "a": ["党中央", "中央军委", "主席负责制", "支部建在连上"], "e": "堅持黨對人民軍隊的絕對領導必須有一整套制度作保證：軍隊最高領導權和指揮權屬於黨中央、中央軍委，中央軍委實行主席負責制；實行黨委制、政治委員制、政治機關制；實行黨委（支部）統一的集體領導下的首長分工負責制；實行支部建在連上。這些制度是人民軍隊完全區別於一切舊軍隊的政治特質和根本優勢（具體制度講師說「不需要去背」）。", "id": "Q48-002", "l": 48, "ch": 14, "pt": "A", "ps": -1, "pr": ["老師：你要注意 它會考一個選擇題 軍委主席負責制（48-004）", "投影片黃字／黃筆標記（48-004）"]}, {"s": [4], "src": "", "card": "C48-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜軍委主席負責制：根本制度和根本實現形式：\n（＿①＿）是坚持党对人民军队绝对领导的（＿②＿）和（＿③＿），在党领导军队的一整套制度体系中处于（＿④＿），居于（＿⑤＿）", "a": ["军委主席负责制", "根本制度", "根本实现形式", "最高层次", "统领地位"], "e": "講師：「它會考一個選擇題：軍委主席負責制是黨對人民軍隊領導的根本制度和根本實現形式……屬於統領的地位。」軍委主席負責制在黨領導軍隊的一整套制度體系中處於最高層次，居於統領地位；中央軍委主席負責中央軍委全面工作、領導指揮全國武裝力量、決定國防和軍隊建設一切重大問題。", "id": "Q48-003", "l": 48, "ch": 14, "pt": "A", "ps": 18, "pr": ["老師：你要注意 它會考一個選擇題 軍委主席負責制（48-004）", "投影片黃字／黃筆標記（48-004）"]}, {"s": [5, 6, 7, 8, 9], "src": "", "card": "C48-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜政治建軍、改革強軍、科技強軍、人才強軍、依法治軍：\n（＿①＿）是人民军队的（＿②＿）；（＿③＿）是决定人民军队发展壮大、制胜未来的（＿④＿）；（＿⑤＿）是（＿⑥＿），是军事发展中最活跃、最具革命性的因素；强军之道，要在（＿⑦＿）；（＿⑧＿）是我们党建军治军（＿⑨＿）", "a": ["政治建军", "立军之本", "改革", "关键一招", "科技", "核心战斗力", "得人", "依法治军", "基本方式"], "e": "知識點2 五個「強軍」各有一句定位（都是選擇題考點）：政治建軍是人民軍隊的立軍之本；改革是決定人民軍隊發展壯大、制勝未來的關鍵一招；科技是核心戰鬥力，是軍事發展中最活躍、最具革命性的因素；強軍之道，要在得人；依法治軍是我們黨建軍治軍基本方式。", "id": "Q48-004", "l": 48, "ch": 14, "pt": "A", "ps": 21, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"s": [5, 6, 7, 8, 9], "src": "", "card": "C48-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜政治建軍、改革強軍、科技強軍、人才強軍、依法治軍", "model": "政治建军是人民军队的立军之本；改革是决定人民军队发展壮大、制胜未来的关键一招；科技是核心战斗力，是军事发展中最活跃、最具革命性的因素；强军之道，要在得人；依法治军是我们党建军治军基本方式", "pts": ["政治建军是人民军队的立军之本", "改革是决定人民军队发展壮大、制胜未来的关键一招", "科技是核心战斗力，是军事发展中最活跃、最具革命性的因素", "强军之道，要在得人", "依法治军是我们党建军治军基本方式"], "e": "記法：「政治＝立軍之本；改革＝關鍵一招；科技＝核心戰鬥力；人才＝要在得人；依法＝基本方式」。", "id": "Q rue, "e": "對。「科技」→「核心战斗力」。", "id": "Q48-011", "l": 48, "ch": 14, "pt": "A", "ps": 21, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"s": [5, 6, 7, 8, 9], "src": "", "card": "C48-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "「依法治军」是：", "o": ["我们党建军治军基本方式", "决定人民军队发展壮大、制胜未来的关键一招", "核心战斗力", "立军之本"], "a": 0, "e": "「依法治军」→「我们党建军治军基本方式」。記法：「政治＝立軍之本；改革＝關鍵一招；科技＝核心戰鬥力；人才＝要在得人；依法＝基本方式」。", "id": "Q48-012", "l": 48, "ch": 14, "pt": "A", "ps": 21, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"s": [5, 6, 7, 8, 9], "src": "", "card": "C48-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "「依法治军」是立军之本。", "a": false, "e": "錯。「依法治军」應對應「我们党建军治军基本方式」，「立军之本」對應的是「政治建军」。", "id": "Q48-013", "l": 48, "ch": 14, "pt": "A", "ps": 21, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"s": [5], "src": "", "card": "C48-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜政治工作是人民軍隊的生命線：\n政治工作永远是人民军队的（＿①＿）；培养（＿②＿）的新时代革命军人；锻造具有铁一般信仰、铁一般信念、铁一般纪律、铁一般担当的过硬部队", "a": ["生命线", "有灵魂、有本事、有血性、有品德"], "e": "講師：「要充分發揮政治工作對強軍興軍的生命線作用，來注意這個選擇。」政治工作永遠是人民軍隊的生命線；培養有靈魂、有本事、有血性、有品德的新時代革命軍人；鍛造具有鐵一般信仰、鐵一般信念、鐵一般紀律、鐵一般擔當的過硬部隊。黨的領導和黨的建設是人民軍隊建設發展的關鍵。", "id": "Q48-014", "l": 48, "ch": 14, "pt": "B", "ps": 3, "pr": ["老師：…軍興軍的生命線作用，來注意這個選擇。（48-005）"]}, {"s": [6], "src": "", "card": "C48-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜改革強軍：軍委管總、戰區主戰、軍種主建：\n按照（＿①＿）、（＿②＿）、（＿③＿）的总原则改革领导指挥体制", "a": ["军委管总", "战区主战", "军种主建"], "e": "按照軍委管總、戰區主戰、軍種主建的總原則改革領導指揮體制，實現軍隊組織架構的歷史性變革；人民軍隊實現整體性革命性重塑，體制一新、結構一新、格局一新、面貌一新（下面細節講師說「不須背，只需理解」）。", "id": "Q48-015", "l": 48, "ch": 14, "pt": "B", "ps": 5, "pr": ["同頁有考點提示：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"s": [8], "src": "", "card": "C48-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜政治標準是人才第一位的標準：\n坚持（＿①＿）是人民军队人才（＿②＿）；坚持把（＿③＿）作为人才工作出发点和落脚点", "a": ["政治标准", "第一位的标准", "能打仗、打胜仗"], "e": "人才是推動人民軍隊高質量發展、贏得軍事競爭和未來戰爭主動的關鍵因素；堅持政治標準是人民軍隊人才第一位的標準；堅持把能打仗、打勝仗作為人才工作出發點和落腳點（講師：「選擇題」）。", "id": "Q48-016", "l": 48, "ch": 14, "pt": "A", "ps": 12, "pr": ["老師：選擇題（48-008）", "投影片黃字／黃筆標記（48-008）"]}, {"s": [9], "src": "", "card": "C48-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜一支現代化軍隊必然是法治軍隊：\n一支现代化军队必然是（＿①＿）；厉行法治、严肃军纪，是治军带兵的（＿②＿），也是建设强大军队的（＿③＿）", "a": ["法治军队", "铁律", "基本规律"], "e": "一支現代化軍隊必然是法治軍隊。厲行法治、嚴肅軍紀，是治軍帶兵的鐵律，也是建設強大軍隊的基本規律。全面加強軍事治理是治軍理念和方式的一場深刻變革。", "id": "Q48-017", "l": 48, "ch": 14, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（48-009）"]}, {"s": [11], "src": "", "card": "C48-09", "tag": ["必背", "選擇題考點", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜戰鬥力是唯一的根本的標準：\n牢固树立（＿①＿）这个（＿②＿）；人民军队的生命力在于（＿③＿），主责主业是（＿④＿）；军事训练……是（＿⑤＿）", "a": ["战斗力", "唯一的根本的标准", "战斗力", "备战打仗", "最直接的军事斗争准备"], "e": "講師：「在於戰鬥力，選擇題」「這個唯一的根本標準，簡答題」。人民軍隊永遠是戰鬥隊，人民軍隊的生命力在於戰鬥力，主責主業是備戰打仗。軍事訓練是提高實戰能力的重要途徑和抓手，是最直接的軍事鬥爭準備；堅持實戰實訓、聯戰聯訓、科技強訓、依法治訓。", "id": "Q48-018", "l": 48, "ch": 14, "pt": "A", "ps": 32, "pr": ["老師：作爲選擇提名是嗎 我們就永遠都記住 只要是打仗（48-011）", "老師：這個唯一的根本標準 簡答題 好（48-011）", "老師：在於戰鬥力，選擇題（48-011）"]}, {"s": [11, 12, 13], "src": "", "card": "C48-10", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜全面加強練兵備戰（四點）：\n牢固树立（＿①＿）这个唯一的根本的标准；深入推进（＿②＿）；创新（＿③＿）；大力培育（＿④＿）的战斗精神", "a": ["战斗力", "实战化军事训练", "军事战略指导", "“一不怕苦、二不怕死”"], "e": "（1）牢固樹立戰鬥力這個唯一的根本的標準；（2）深入推進實戰化軍事訓練；（3）創新軍事戰略指導（軍事戰略科學準確，就是最大的勝算）；（4）大力培育「一不怕苦、二不怕死」的戰鬥精神。", "id": "Q48-019", "l": 48, "ch": 14, "pt": "A", "ps": 26, "pr": ["老師：作爲選擇提名是嗎 我們就永遠都記住 只要是打仗（48-011）", "老師：這個唯一的根本標準 簡答題 好（48-011）", "投影片黃字／黃筆標記（48-011）"]}, {"s": [11, 12, 13], "src": "", "card": "C48-10", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜全面加強練兵備戰（四點）", "model": "牢固树立战斗力这个唯一的根本的标准；深入推进实战化军事训练；创新军事战略指导；大力培育“一不怕苦、二不怕死”的战斗精神", "pts": ["牢固树立战斗力这个唯一的根本的标准", "深入推进实战化军事训练", "创新军事战略指导", "大力培育“一不怕苦、二不怕死”的战斗精神"], "e": "記法：「戰鬥力標準・實戰化訓練・戰略指導・戰鬥精神」。", "id": "Q48-020", "l": 48, "ch": 14, "pt": "A", "ps": 26, "pr": ["老師：作爲選擇提名是嗎 我們就永遠都記住 只要是打仗（48-011）", "老師：這個唯一的根本標準 簡答題 好（48-011）", "投影片黃字／黃筆標記（48-011）"]}, {"s": [14, 15, 16], "src": "", "card": "C48-11", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜鞏固提高一體化國家戰略體系和能力：\n统一（＿①＿）两大目标、统筹（＿②＿）两件大事、统合（＿③＿）两种实力；巩固提高一体化国家战略体系和能力，关键是要在（＿④＿）上下功夫；（＿⑤＿）是实现富国和强军相统一的（＿⑥＿）", "a": ["富国和强军", "发展和安全", "经济和国防", "一体化", "军政军民团结", "重要政治保障"], "e": "是黨中央著眼更好統籌發展和安全、更好統籌經濟建設和國防建設作出的戰略部署；在國家總體戰略中統一富國和強軍兩大目標、統籌發展和安全兩件大事、統合經濟和國防兩種實力。關鍵是要在一體化上下功夫（講師：「選擇題考點」）。軍政軍民團結是實現富國和強軍相統一的重要政治保障。", "id": "Q48-021", "l": 48, "ch": 14, "pt": "A", "ps": 19, "pr": ["老師：選擇題考點（48-014）", "投影片黃字／黃筆標記（48-016）"]}, {"k": "單", "s": [3], "q": "「建軍之本、強軍之魂」是：", "o": ["黨對人民軍隊的絕對領導", "能打勝仗", "科技強軍", "依法治軍"], "a": 0, "e": "講師：「是建軍之本、強軍之魂，選擇題。」", "id": "Q48-022", "l": 48, "ch": 14, "pt": "A", "ps": 52, "pr": ["老師：黃色內容呢 要重點背誦 好（48-003）", "老師：…麼 是建軍之本強軍之魂選擇題 怎麼考（48-003）", "投影片黃字／黃筆標記（48-003）"]}, {"k": "單", "s": [4], "q": "堅持黨對人民軍隊絕對領導的根本制度和根本實現形式是：", "o": ["軍委主席負責制", "支部建在連上", "政治委員制", "黨委制"], "a": 0, "e": "講師：「它會考一個選擇題……軍委主席負責制。」", "id": "Q48-023", "l": 48, "ch": 14, "pt": "A", "ps": 35, "pr": ["老師：你要注意 它會考一個選擇題 軍委主席負責制（48-004）", "投影片黃字／黃筆標記（48-004）"]}, {"k": "單", "s": [5], "q": "人民軍隊的「立軍之本」是：", "o": ["政治建軍", "改革強軍", "科技強軍", "人才強軍"], "a": 0, "e": "講師：「政治建軍是人民軍隊的立軍之本，選擇。」", "id": "Q48-024", "l": 48, "ch": 14, "pt": "A", "ps": 21, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）", "老師：…是人民軍隊的立軍之本，選擇。（48-005）"]}, {"k": "單", "s": [6], "q": "決定人民軍隊發展壯大、制勝未來的關鍵一招是：", "o": ["改革", "科技", "人才", "法治"], "a": 0, "e": "講師：「選擇題又來了。」", "id": "Q48-025", "l": 48, "ch": 14, "pt": "A", "ps": 33, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"k": "單", "s": [7], "q": "「核心戰鬥力」「軍事發展中最活躍、最具革命性的因素」指的是：", "o": ["科技", "人才", "改革", "政治工作"], "a": 0, "e": "slide 007。", "id": "Q48-026", "l": 48, "ch": 14, "pt": "A", "ps": 21, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"k": "單", "s": [9], "q": "我們黨建軍治軍的基本方式是：", "o": ["依法治軍", "政治建軍", "科技強軍", "從嚴治軍"], "a": 0, "e": "slide 009。", "id": "Q48-027", "l": 48, "ch": 14, "pt": "A", "ps": 21, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"k": "判", "s": [5], "q": "政治工作永遠是人民軍隊的生命線。", "a": true, "e": "對（講師：「生命線作用，來注意這個選擇」）。", "id": "Q48-028", "l": 48, "ch": 14, "pt": "B", "ps": 6, "pr": ["老師：生命線作用，來注意這個選擇（48-005）"]}, {"k": "單", "s": [11], "q": "人民軍隊建設的「唯一的根本的標準」是：", "o": ["戰鬥力", "規模", "裝備數量", "軍費"], "a": 0, "e": "講師：「這個唯一的根本標準，簡答題。」", "id": "Q48-029", "l": 48, "ch": 14, "pt": "A", "ps": 50, "pr": ["老師：作爲選擇提名是嗎 我們就永遠都記住 只要是打仗（48-011）", "老師：這個唯一的根本標準 簡答題 好（48-011）", "投影片黃字／黃筆標記（48-011）"]}, {"k": "判", "s": [8], "q": "人民軍隊人才第一位的標準是專業技術標準。", "a": false, "e": "錯。堅持政治標準是人民軍隊人才第一位的標準。", "id": "Q48-030", "l": 48, "ch": 14, "pt": "A", "ps": 20, "pr": ["老師：選擇題（48-008）", "投影片黃字／黃筆標記（48-008）"]}, {"k": "填", "s": [6], "q": "按照軍委管總、（＿①＿）主戰、（＿②＿）主建的總原則改革領導指揮體制。", "a": ["战区", "军种"], "e": "slide 006。", "id": "Q48-031", "l": 48, "ch": 14, "pt": "A", "ps": 23, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"k": "單", "s": [15], "q": "鞏固提高一體化國家戰略體系和能力，關鍵是要在什麼上下功夫？", "o": ["一體化", "現代化", "信息化", "市場化"], "a": 0, "e": "講師：「在一體化上下功夫，選擇題考點。」", "id": "Q48-032", "l": 48, "ch": 14, "pt": "A", "ps": 32, "pr": ["老師：…一體化上下功夫，選擇題考點。（48-015）", "老師：選擇題考點（48-014）", "投影片黃字／黃筆標記（48-016）"]}, {"k": "單", "s": [16], "q": "實現富國和強軍相統一的重要政治保障是：", "o": ["軍政軍民團結", "軍委主席負責制", "依法治軍", "國防動員"], "a": 0, "e": "slide 016（3）。", "id": "Q48-033", "l": 48, "ch": 14, "pt": "A", "ps": 21, "pr": ["老師：選擇題考點（48-014）", "投影片黃字／黃筆標記（48-016）"]}, {"k": "多", "s": [4], "q": "投影片列出的、保證黨對人民軍隊絕對領導的制度包括：", "o": ["中央軍委實行主席負責制", "實行黨委制、政治委員制、政治機關制", "實行支部建在連上", "實行軍隊國家化"], "a": [0, 1, 2], "e": "slide 004（3）。", "id": "Q48-034", "l": 48, "ch": 14, "pt": "A", "ps": 18, "pr": ["老師：你要注意 它會考一個選擇題 軍委主席負責制（48-004）", "投影片黃字／黃筆標記（48-004）"]}, {"k": "填", "s": [13], "q": "大力培育“一不怕（＿①＿）、二不怕（＿②＿）”的戰鬥精神。", "a": ["苦", "死"], "e": "slide 013。", "id": "Q48-035", "l": 48, "ch": 14, "pt": "A", "ps": 20, "pr": ["老師：作爲選擇提名是嗎 我們就永遠都記住 只要是打仗（48-011）", "老師：這個唯一的根本標準 簡答題 好（48-011）", "投影片黃字／黃筆標記（48-013）"]}, {"k": "簡", "s": [5, 6, 7, 8, 9], "q": "簡答：如何堅持政治建軍、改革強軍、科技強軍、人才強軍、依法治軍？", "sum": "一句白話：政治是立軍之本，改革是關鍵一招，科技是核心戰鬥力，人才要在得人，依法是基本方式。", "pts": ["政治建军是人民军队的立军之本", "改革是决定人民军队发展壮大、制胜未来的关键一招", "科技是核心战斗力，是军事发展中最活跃、最具革命性的因素", "强军之道，要在得人", "依法治军是我们党建军治军基本方式"], "e": "第48堂知識點2（slide 005–010）。", "id": "Q48-036", "l": 48, "ch": 14, "pt": "A", "ps": 37, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"k": "簡", "s": [11, 12, 13], "q": "簡答：如何全面加強練兵備戰？", "sum": "一句白話：以戰鬥力為唯一標準，實戰化訓練，創新戰略指導，培育不怕苦不怕死的精神。", "pts": ["牢固树立战斗力这个唯一的根本的标准", "深入推进实战化军事训练", "创新军事战略指导", "大力培育“一不怕苦、二不怕死”的战斗精神"], "e": "第48堂知識點3（slide 011–013）。", "id": "Q48-037", "l": 48, "ch": 14, "pt": "A", "ps": 44, "pr": ["老師：作爲選擇提名是嗎 我們就永遠都記住 只要是打仗（48-011）", "老師：這個唯一的根本標準 簡答題 好（48-011）", "投影片黃字／黃筆標記（48-011）"]}, {"s": [5], "src": "", "card": "C49-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「一國兩制」的含義（基本國策）：\n在统一的国家之内，主体实行（＿①＿），个别地区依法实行（＿②＿）。这一制度以（＿③＿）为基础……享有（＿④＿），包括行政管理权、立法权、独立的司法权和终审权", "a": ["社会主义制度", "资本主义制度", "宪法和基本法", "高度自治权"], "e": "講師：「注意啊，以憲法和基本法為基礎」「享有，注意，叫做高度的自治權」。作為一項基本國策，「一國兩制」是指在統一的國家之內，主體實行社會主義制度，個別地區依法實行資本主義制度；保持港澳原有的資本主義制度和生活方式不變、法律基本不變；特別行政區享有高度自治權，包括行政管理權、立法權、獨立的司法權和終審權。", "id": "Q49-001", "l": 49, "ch": 15, "pt": "A", "ps": 17, "pr": ["老師：…我們一國兩制 你們需要去背的是哪些呢 一國兩制（49-005）", "老師：注意啊，以憲法和基本法為基礎（49-005）", "投影片黃字／黃筆標記（49-005）"]}, {"s": [5, 6], "src": "", "card": "C49-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜「一國兩制」是中國特色社會主義的偉大創舉（三點）：\n“一国两制”是中国特色社会主义（＿①＿）；“一国两制”是中国共产党领导人民实现祖国和平统一的（＿②＿）；“一国两制”为国际社会解决类似问题提供了（＿③＿）", "a": ["制度创新的重要成果", "伟大构想", "新思路新方案"], "e": "講師：「你們需要去背的是……黃色的標題背過。」（1）「一國兩制」是中國特色社會主義制度創新的重要成果；（2）「一國兩制」是中國共產黨領導人民實現祖國和平統一的偉大構想；（3）「一國兩制」為國際社會解決類似問題提供了新思路新方案。", "id": "Q49-002", "l": 49, "ch": 15, "pt": "A", "ps": 33, "pr": ["老師：…我們一國兩制 你們需要去背的是哪些呢 一國兩制（49-005）", "同頁有考點提示：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-005）"]}, {"s": [5, 6], "src": "", "card": "C49-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜「一國兩制」是中國特色社會主義的偉大創舉（三點）", "model": "“一国两制”是中国特色社会主义制度创新的重要成果；“一国两制”是中国共产党领导人民实现祖国和平统一的伟大构想；“一国两制”为国际社会解决类似问题提供了新思路新方案", "pts": ["“一国两制”是中国特色社会主义制度创新的重要成果", "“一国两制”是中国共产党领导人民实现祖国和平统一的伟大构想", "“一国两制”为国际社会解决类似问题提供了新思路新方案"], "e": "記法：「制度創新成果・和平統一構想・國際新方案」。", "id": "Q49-003", "l": 49, "ch": 15, "pt": "A", "ps": 33, "pr": ["老師：…我們一國兩制 你們需要去背的是哪些呢 一國兩制（49-005）", "同頁有考點提示：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-005）"]}, {"s": [6], "src": "", "card": "C49-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「一國兩制」最早是針對台灣問題提出的：\n“一国两制”伟大构想，最早是针对（＿①＿）提出来的，首先运用于解决（＿②＿）", "a": ["台湾问题", "香港和澳门问题"], "e": "講師：「它會問你一國兩制最早是針對什麼提出來的，你記住要解決台灣問題。」「一國兩制」偉大構想，最早是針對台灣問題提出來的，首先運用於解決香港和澳門問題。", "id": "Q49-004", "l": 49, "ch": 15, "pt": "B", "ps": 5, "pr": ["同頁有考點提示：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-006）"]}, {"s": [6], "src": "", "card": "C49-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「一國兩制」是一項重要制度、一項基本國策：\n“一国两制”是党领导人民实现祖国和平统一的一项（＿①＿），是国家的一项（＿②＿）；包含了中华文化中的（＿③＿）", "a": ["重要制度", "基本国策", "和合理念"], "e": "講師：「是我國的一項基本國策，選擇題應該會做。」「一國兩制」是黨領導人民實現祖國和平統一的一項重要制度，是國家的一項基本國策；包含了中華文化中的和合理念，體現了尊重差異、求同存異的思維方式。", "id": "Q49-005", "l": 49, "ch": 15, "pt": "A", "ps": 22, "pr": ["老師：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-006）"]}, {"s": [7], "src": "", "card": "C49-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「一國兩制」的根本宗旨：\n“一国两制”的根本宗旨是维护国家（＿①＿），保持香港、澳门（＿②＿）", "a": ["主权、安全、发展利益", "长期繁荣稳定"], "e": "講師：「根本宗旨，把它記住。」「一國兩制」的根本宗旨是維護國家主權、安全、發展利益，保持香港、澳門長期繁榮穩定。", "id": "Q49-006", "l": 49, "ch": 15, "pt": "A", "ps": 14, "pr": ["老師：…需要去把那個黃色的標題背過 就回答的是什麼（49-007）", "投影片黃字／黃筆標記（49-007）"]}, {"s": [8], "src": "", "card": "C49-06", "tag": ["必背", "選擇題考點", "簡答題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜「一國」和「兩制」的關係：\n维护国家主权、安全、发展利益是“一国两制”方针的（＿①＿）；“一国”是实行“两制”的（＿②＿），“两制”（＿③＿）于“一国”，并统一于“一国”之内；“一国是（＿④＿），根深才能叶茂；“一国”是（＿⑤＿），本固才能枝荣", "a": ["最高原则", "前提和基础", "从属和派生", "根", "本"], "e": "講師：「選擇題考點，同樣這也是簡答題考點，它要讓你去論述一國和兩制的關係。」維護國家主權、安全、發展利益是「一國兩制」方針的最高原則。「一國」是實行「兩制」的前提和基礎，「兩制」從屬和派生於「一國」，並統一於「一國」之內。「一國是根，根深才能葉茂；一國是本，本固才能枝榮。」", "id": "Q49-007", "l": 49, "ch": 15, "pt": "A", "ps": 58, "pr": ["老師：來了 選擇提考點 同樣（49-008）", "老師：同樣 這也是簡單提考點 它要讓你去論述一國和兩制的…（49-008）", "老師：…這就是一國兩制的關係 選擇題 選擇題（49-008）"]}, {"s": [9], "src": "", "card": "C49-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「兩制」並非等量齊觀：\n“一国”之内的“两制”并非（＿①＿）、比肩并列，国家的主体必须实行（＿②＿）；中国共产党领导是中国特色社会主义（＿③＿）", "a": ["等量齐观", "社会主义制度", "最本质的特征"], "e": "「一國」之內的「兩制」並非等量齊觀、比肩並列，國家的主體必須實行社會主義制度。社會主義制度是中華人民共和國的根本制度，中國共產黨領導是中國特色社會主義最本質的特徵（講師：「也是選擇題」），特別行政區所有居民應該自覺尊重和維護國家的根本制度。", "id": "Q49-008", "l": 49, "ch": 15, "pt": "A", "ps": 22, "pr": ["老師：最本質的特徵 也是選擇題 特別行政區（49-009）", "老師：也是選擇題（49-009）", "投影片黃字／黃筆標記（49-009）"]}, {"s": [10], "src": "", "card": "C49-08", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜準確把握「一國兩制」的科學內涵（五點）：\n牢牢把握“一国两制”的（＿①＿）；准确把握“一国”和“两制”的（＿②＿）；坚持（＿③＿）和保障特别行政区（＿④＿）相统一；坚定落实（＿⑤＿）“爱国者治澳”原则；坚持（＿⑥＿）", "a": ["根本宗旨", "关系", "中央全面管治权", "高度自治权", "“爱国者治港”", "依法治港治澳"], "e": "（1）牢牢把握「一國兩制」的根本宗旨；（2）準確把握「一國」和「兩制」的關係；（3）堅持中央全面管治權和保障特別行政區高度自治權相統一（我國是單一制國家）；（4）堅定落實「愛國者治港」「愛國者治澳」原則；（5）堅持依法治港治澳。", "id": "Q49-009", "l": 49, "ch": 15, "pt": "C", "ps": 0, "pr": []}, {"s": [10], "src": "", "card": "C49-08", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜準確把握「一國兩制」的科學內涵（五點）", "model": "牢牢把握“一国两制”的根本宗旨；准确把握“一国”和“两制”的关系；坚持中央全面管治权和保障特别行政区高度自治权相统一；坚定落实“爱国者治港”“爱国者治澳”原则；坚持依法治港治澳", "pts": ["牢牢把握“一国两制”的根本宗旨", "准确把握“一国”和“两制”的关系", "坚持中央全面管治权和保障特别行政区高度自治权相统一", "坚定落实“爱国者治港”“爱国者治澳”原则", "坚持依法治港治澳"], "e": "記法：「宗旨・關係・管治權+自治權・愛國者・依法」。", "id": "Q49-010", "l": 49, "ch": 15, "pt": "C", "ps": 0, "pr": []}, {"s": [10], "src": "", "card": "C49-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜單一制國家、愛國者治港、依法治港：\n我国是（＿①＿）国家；政权必须掌握在（＿②＿）手中，这是世界通行的政治法则；（＿③＿）共同构成特别行政区的（＿④＿）", "a": ["单一制", "爱国者", "宪法和基本法", "宪制基础"], "e": "我國是單一制國家，中央對包括港澳在內的所有地方行政區域擁有全面管治權。政權必須掌握在愛國者手中，這是世界通行的政治法則。依法治理是最可靠、最穩定的治理；憲法和基本法共同構成特別行政區的憲制基礎；憲法是特別行政區制度的法律淵源。", "id": "Q49-011", "l": 49, "ch": 15, "pt": "C", "ps": 0, "pr": []}, {"s": [11], "src": "", "card": "C49-10", "tag": ["簡答題考點"], "auto": 1, "k": "填", "q": "填空｜堅持和完善「一國兩制」制度體系（三點）：\n加强（＿①＿）相关制度和机制建设；健全中央行使（＿②＿）的制度；为落实（＿③＿）提供制度保障", "a": ["依法治理", "全面管治权", "爱国者治理"], "e": "（1）加強依法治理相關制度和機制建設；（2）健全中央行使全面管治權的制度；（3）為落實愛國者治理提供制度保障——確保特別行政區行政、立法、司法機構的組成人員等都由真正的愛國者擔任。", "id": "Q49-012", "l": 49, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（49-011）"]}, {"k": "單", "s": [6], "q": "「一國兩制」偉大構想最早是針對什麼提出來的？", "o": ["台灣問題", "香港問題", "澳門問題", "西藏問題"], "a": 0, "e": "講師：「你記住要解決台灣問題。」首先運用於解決港澳問題。", "id": "Q49-013", "l": 49, "ch": 15, "pt": "A", "ps": 23, "pr": ["老師：…我們一國兩制 你們需要去背的是哪些呢 一國兩制（49-005）", "同頁有考點提示：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-006）"]}, {"k": "單", "s": [5], "q": "「一國兩制」這一制度的基礎是：", "o": ["憲法和基本法", "中英聯合聲明", "國際法", "特區政府法令"], "a": 0, "e": "講師：「注意啊，以憲法和基本法為基礎。」", "id": "Q49-014", "l": 49, "ch": 15, "pt": "A", "ps": 35, "pr": ["老師：…我們一國兩制 你們需要去背的是哪些呢 一國兩制（49-005）", "老師：注意啊，以憲法和基本法為基礎（49-005）", "投影片黃字／黃筆標記（49-005）"]}, {"k": "單", "s": [7], "q": "「一國兩制」的根本宗旨是：", "o": ["維護國家主權、安全、發展利益，保持香港、澳門長期繁榮穩定", "實現港澳完全自治", "推廣資本主義制度", "發展對外貿易"], "a": 0, "e": "slide 007（1）。", "id": "Q49-015", "l": 49, "ch": 15, "pt": "A", "ps": 33, "pr": ["老師：…需要去把那個黃色的標題背過 就回答的是什麼（49-007）", "投影片黃字／黃筆標記（49-007）"]}, {"k": "單", "s": [8], "q": "「一國兩制」方針的最高原則是：", "o": ["維護國家主權、安全、發展利益", "高度自治", "港人治港", "保持資本主義制度不變"], "a": 0, "e": "slide 008（2）。", "id": "Q49-016", "l": 49, "ch": 15, "pt": "A", "ps": 48, "pr": ["老師：來了 選擇提考點 同樣（49-008）", "老師：…這就是一國兩制的關係 選擇題 選擇題（49-008）", "老師：同樣 這也是簡單提考點 它要讓你去論述一國和兩制的…（49-008）"]}, {"k": "判", "s": [8], "q": "「兩制」是實行「一國」的前提和基礎。", "a": false, "e": "錯，對調了。「一國」是實行「兩制」的前提和基礎；「兩制」從屬和派生於「一國」。", "id": "Q49-017", "l": 49, "ch": 15, "pt": "A", "ps": 48, "pr": ["老師：來了 選擇提考點 同樣（49-008）", "老師：…這就是一國兩制的關係 選擇題 選擇題（49-008）", "老師：同樣 這也是簡單提考點 它要讓你去論述一國和兩制的…（49-008）"]}, {"k": "判", "s": [9], "q": "「一國」之內的「兩制」是等量齊觀、比肩並列的。", "a": false, "e": "錯。並非等量齊觀、比肩並列，國家主體必須實行社會主義制度。", "id": "Q49-018", "l": 49, "ch": 15, "pt": "A", "ps": 30, "pr": ["老師：最本質的特徵 也是選擇題 特別行政區（49-009）", "老師：也是選擇題（49-009）", "投影片黃字／黃筆標記（49-009）"]}, {"k": "單", "s": [10], "q": "我國在國家結構形式上是：", "o": ["單一制國家", "聯邦制國家", "邦聯制國家", "複合制國家"], "a": 0, "e": "slide 010（3）。", "id": "Q49-019", "l": 49, "ch": 15, "pt": "C", "ps": 0, "pr": []}, {"k": "判", "s": [6], "q": "「一國兩制」是國家的一項基本國策。", "a": true, "e": "對（講師：「選擇題應該會做」）。", "id": "Q49-020", "l": 49, "ch": 15, "pt": "A", "ps": 40, "pr": ["老師：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-006）"]}, {"k": "多", "s": [5], "q": "特別行政區享有的高度自治權包括：", "o": ["行政管理權", "立法權", "獨立的司法權和終審權", "外交權", "國防權"], "a": [0, 1, 2], "e": "slide 005；外交、國防屬中央。", "id": "Q49-021", "l": 49, "ch": 15, "pt": "A", "ps": 32, "pr": ["老師：…我們一國兩制 你們需要去背的是哪些呢 一國兩制（49-005）", "老師：注意啊，以憲法和基本法為基礎（49-005）", "投影片黃字／黃筆標記（49-005）"]}, {"k": "填", "s": [8], "q": "“一國”是根，根深才能（＿①＿）＿；“一國”是本，本固才能（＿②＿）＿。", "a": ["叶茂", "枝荣"], "e": "slide 008。", "id": "Q49-022", "l": 49, "ch": 15, "pt": "A", "ps": 30, "pr": ["老師：來了 選擇提考點 同樣（49-008）", "老師：…這就是一國兩制的關係 選擇題 選擇題（49-008）", "同頁有考點提示：同樣 這也是簡單提考點 它要讓你去論述一國和兩制的…（49-008）"]}, {"k": "單", "s": [10], "q": "「政權必須掌握在愛國者手中」被稱為：", "o": ["世界通行的政治法則", "港澳特有規定", "臨時措施", "國際慣例的例外"], "a": 0, "e": "slide 010（4）。", "id": "Q49-023", "l": 49, "ch": 15, "pt": "C", "ps": 0, "pr": []}, {"k": "簡", "s": [8], "q": "簡答：如何準確把握「一國」和「兩制」的關係？", "sum": "一句白話：一國是根本和前提，兩制從一國派生出來；一國越穩，兩制空間越大；兩制不是平起平坐，國家主體是社會主義。", "pts": ["维护国家主权、安全、发展利益是“一国两制”方针的最高原则", "“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”，并统一于“一国”之内", "“一国”原则愈坚固，“两制”优势就愈彰显；“一国”底线越牢，“两制”空间就越大", "“一国”之内的“两制”并非等量齐观、比肩并列，国家的主体必须实行社会主义制度"], "e": "講師：「它要讓你去論述一國和兩制的關係。」", "id": "Q49-024", "l": 49, "ch": 15, "pt": "A", "ps": 74, "pr": ["老師：來了 選擇提考點 同樣（49-008）", "老師：同樣 這也是簡單提考點 它要讓你去論述一國和兩制的…（49-008）", "老師：…這就是一國兩制的關係 選擇題 選擇題（49-008）"]}, {"k": "論", "s": [7, 8, 9, 10], "q": "論述：如何準確把握「一國兩制」的科學內涵？", "sum": "一句白話：記住根本宗旨，分清一國與兩制，中央管治權和高度自治統一，愛國者治港澳，依法治港澳。", "pts": ["牢牢把握“一国两制”的根本宗旨（维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定）", "准确把握“一国”和“两制”的关系（“一国”是实行“两制”的前提和基础）", "坚持中央全面管治权和保障特别行政区高度自治权相统一", "坚定落实“爱国者治港”“爱国者治澳”原则", "坚持依法治港治澳（宪法和基本法共同构成特别行政区的宪制基础）"], "e": "第49堂知識點2（slide 007–010）。", "id": "Q49-025", "l": 49, "ch": 15, "pt": "A", "ps": 91, "pr": ["老師：…需要去把那個黃色的標題背過 就回答的是什麼（49-007）", "老師：來了 選擇提考點 同樣（49-008）", "老師：同樣 這也是簡單提考點 它要讓你去論述一國和兩制的…（49-008）"]}, {"s": [3], "src": "", "card": "C50-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜青少年是港澳長期繁榮穩定的希望和未來：\n（＿①＿）是港澳长期繁荣稳定的（＿②＿）；加强对香港、澳门社会特别是青少年的（＿③＿）教育、（＿④＿）教育、（＿⑤＿）教育", "a": ["青少年", "希望和未来", "宪法和基本法", "国情", "中国历史和中华文化"], "e": "港澳特區政府大力加強對青少年的憲法和基本法教育、國情教育、中國歷史和中華文化教育，增強國家意識和愛國精神，使「一國兩制」事業後繼有人。", "id": "Q50-001", "l": 50, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-003）"]}, {"s": [4], "src": "", "card": "C50-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「一國兩制」是保持港澳長期繁榮穩定的好制度：\n走上了同祖国内地（＿①＿）、（＿②＿）的宽广道路，“一国两制”实践取得（＿③＿）的成功；“一国两制”是保持港澳（＿④＿）的好制度，是保障港澳居民（＿⑤＿）的好制度", "a": ["优势互补", "共同发展", "举世公认", "长期繁荣稳定", "根本利益和福祉"], "e": "講師：「那麼注意了。」香港、澳門回歸祖國後，走上了同祖國內地優勢互補、共同發展的寬廣道路，「一國兩制」實踐取得舉世公認的成功。「一國兩制」是保持港澳長期繁榮穩定的好制度，是保障港澳居民根本利益和福祉的好制度。", "id": "Q50-002", "l": 50, "ch": 15, "pt": "B", "ps": 5, "pr": ["老師：那麼注意了。（50-004）", "投影片黃字／黃筆標記（50-004）"]}, {"s": [5], "src": "", "card": "C50-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜由亂到治走向由治及興：\n推动香港进入由（＿①＿）到（＿②＿）走向由（＿③＿）及（＿④＿）的新阶段；“一国两制”的提出首先是为了实现和维护（＿⑤＿）", "a": ["乱", "治", "治", "兴", "国家统一"], "e": "講師：「走向由治及興的新階段，這是一個選擇題。」「一國兩制」的提出首先是為了實現和維護國家統一；面對香港局勢動盪，黨中央採取一系列標本兼治的舉措，推動香港局勢實現由亂到治的重大轉折。", "id": "Q50-003", "l": 50, "ch": 15, "pt": "A", "ps": 15, "pr": ["老師：…及興的新階段，這是一個選擇題。（50-005）", "投影片黃字／黃筆標記（50-005）"]}, {"s": [6], "src": "", "card": "C50-04", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜香港維護國家安全：中央根本責任＋特區憲制責任：\n中央政府对香港特别行政区有关的国家安全事务负有（＿①＿），香港特别行政区负有维护国家安全的（＿②＿）", "a": ["根本责任", "宪制责任"], "e": "建立健全香港特別行政區維護國家安全的法律制度和執行機制：中央政府對香港特區有關的國家安全事務負有根本責任，香港特區負有維護國家安全的憲制責任。完善香港特區選舉制度，全面落實「愛國者治港」原則。", "id": "Q50-004", "l": 50, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-006）"]}, {"s": [6], "src": "", "card": "C50-04", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在維護香港國家安全上，「中央政府」負有：", "o": ["根本责任", "宪制责任", "主要责任", "次要责任"], "a": 0, "e": "「中央政府」→「根本责任」。記法：「中央＝根本責任；特區＝憲制責任」。", "id": "Q50-005", "l": 50, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-006）"]}, {"s": [6], "src": "", "card": "C50-04", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "判", "q": "在維護香港國家安全上，中央政府負有根本责任。", "a": true, "e": "對。「中央政府」→「根本责任」。", "id": "Q50-006", "l": 50, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-006）"]}, {"s": [6], "src": "", "card": "C50-04", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在維護香港國家安全上，「香港特别行政区」負有：", "o": ["宪制责任", "根本责任", "主要责任", "次要责任"], "a": 0, "e": "「香港特别行政区」→「宪制责任」。記法：「中央＝根本責任；特區＝憲制責任」。", "id": "Q50-007", "l": 50, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-006）"]}, {"s": [6], "src": "", "card": "C50-04", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "判", "q": "在維護香港國家安全上，香港特别行政区負有根本责任。", "a": false, "e": "錯。「香港特别行政区」應對應「宪制责任」，「根本责任」對應的是「中央政府」。", "id": "Q50-008", "l": 50, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-006）"]}, {"s": [6], "src": "", "card": "C50-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜以行政長官為核心的行政主導體制：\n坚持以（＿①＿）为核心的（＿②＿）体制；行政长官和特别行政区政府是香港的（＿③＿），也是治理香港的（＿④＿）", "a": ["行政长官", "行政主导", "当家人", "第一责任人"], "e": "堅持以行政長官為核心的行政主導體制，支持行政長官和特區政府依法施政、積極作為。行政長官和特別行政區政府是香港的當家人，也是治理香港的第一責任人。", "id": "Q50-009", "l": 50, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-006）"]}, {"s": [5, 6, 7], "src": "", "card": "C50-06", "tag": ["簡答題考點"], "auto": 1, "k": "填", "q": "填空｜推動香港由亂到治走向由治及興（五個要點）：\n香港已实现（＿①＿）的重大转折，正处在（＿②＿）的关键时期", "a": ["由乱到治", "由治及兴"], "e": "講師：「我們五個要點，我已經跟大家說要去背哪些了」「把這第五個要點這一句背過就可以了」。（1）「一國兩制」的提出首先是為了實現和維護國家統一；（2）建立健全香港特區維護國家安全的法律制度和執行機制；（3）完善香港特區選舉制度；（4）堅持以行政長官為核心的行政主導體制；（5）香港已實現由亂到治的重大轉折，正處在由治及興的關鍵時期。", "id": "Q50-010", "l": 50, "ch": 15, "pt": "A", "ps": 62, "pr": ["老師：…一個關鍵時期 這個你就需要去記住就可以了 把這第五個…（50-007）", "老師：這一句 背過就可以了 那麼知識點二（50-007）", "老師：…要點 我已經跟大家說要去背哪些了 所以大家要清晰（50-007）"]}, {"s": [8, 9, 10], "src": "", "card": "C50-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜支持香港、澳門融入國家發展大局（四個「積極主動」）：\n积极主动助力（＿①＿）；积极主动参与（＿②＿）建设；积极主动参与（＿③＿）；积极主动促进（＿④＿）", "a": ["国家全面开放", "粤港澳大湾区", "国家治理实践", "国际人文交流"], "e": "（1）積極主動助力國家全面開放（以「港澳所長」對接「國家所需」，講師重複兩次）；（2）積極主動參與粵港澳大灣區建設；（3）積極主動參與國家治理實踐；（4）積極主動促進國際人文交流。", "id": "Q50-011", "l": 50, "ch": 15, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（50-008）"]}, {"s": [8, 9, 10], "src": "", "card": "C50-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜支持香港、澳門融入國家發展大局（四個「積極主動」）", "model": "积极主动助力国家全面开放；积极主动参与粤港澳大湾区建设；积极主动参与国家治理实践；积极主动促进国际人文交流", "pts": ["积极主动助力国家全面开放", "积极主动参与粤港澳大湾区建设", "积极主动参与国家治理实践", "积极主动促进国际人文交流"], "e": "記法：「開放・大灣區・治理・人文」。", "id": "Q50-012", "l": 50, "ch": 15, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（50-008）"]}, {"s": [8, 9, 10], "src": "", "card": "C50-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "支持香港、澳門融入國家發展大局，要：", "o": ["积极主动助力国家全面开放", "积极主动参与粤港澳大湾区建设", "积极主动参与国家治理实践", "积极主动促进国际人文交流", "积极主动削弱国际性城市特色"], "a": [0, 1, 2, 3], "e": "正確：积极主动助力国家全面开放；积极主动参与粤港澳大湾区建设；积极主动参与国家治理实践；积极主动促进国际人文交流。干擾項：积极主动削弱国际性城市特色。", "id": "Q50-013", "l": 50, "ch": 15, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（50-008）"]}, {"s": [8], "src": "", "card": "C50-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜以「港澳所長」對接「國家所需」：\n香港、澳门的地位和作用只会（＿①＿），不会（＿②＿）；以（＿③＿）对接（＿④＿）", "a": ["加强", "减弱", "“港澳所长”", "“国家所需”"], "e": "在國家擴大對外開放過程中，港澳的地位和作用只會加強，不會減弱。要以「港澳所長」對接「國家所需」。建設粵港澳大灣區是黨中央立足全局和長遠作出的重大決策，也是保持港澳長期繁榮穩定的重大舉措。", "id": "Q50-014", "l": 50, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-008）"]}, {"s": [10], "src": "", "card": "C50-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜香港「三個最大」與澳門「重要平台」：\n香港是我国内地最大的（＿①＿）、对外投资最大（＿②＿）、对外贸易最大（＿③＿），澳门是我国双向开放特别是与（＿④＿）经贸往来的重要平台", "a": ["外资来源地", "目的地", "转口地", "葡语国家"], "e": "講師：「它就是我們中國連接世界的兩個重要的窗口，所以我們要注意。」香港是我國內地最大的外資來源地、對外投資最大目的地、對外貿易最大轉口地；澳門是我國雙向開放特別是與葡語國家經貿往來的重要平台。港澳是中西文化交流的重要紐帶。", "id": "Q50-015", "l": 50, "ch": 15, "pt": "B", "ps": 5, "pr": ["老師：…重要的窗口，所以我們要注意。（50-010）", "投影片黃字／黃筆標記（50-010）"]}, {"k": "單", "s": [5], "q": "當前香港正處在什麼的關鍵時期？", "o": ["由治及興", "由亂到治", "由興到強", "由弱到強"], "a": 0, "e": "已實現由亂到治的重大轉折，正處在由治及興的關鍵時期（講師：「這是一個選擇題」）。", "id": "Q50-016", "l": 50, "ch": 15, "pt": "A", "ps": 40, "pr": ["老師： 2）。", "id": "Q50-025", "l": 50, "ch": 15, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（50-008）"]}, {"k": "簡", "s": [8, 9, 10], "q": "簡答：如何支持香港、澳門融入國家發展大局？", "sum": "一句白話：港澳要主動幫國家開放、參與大灣區、參與國家治理、促進國際人文交流。", "pts": ["积极主动助力国家全面开放（以“港澳所长”对接“国家所需”）", "积极主动参与粤港澳大湾区建设", "积极主动参与国家治理实践", "积极主动促进国际人文交流"], "e": "第50堂知識點3（slide 008–010）。", "id": "Q50-026", "l": 50, "ch": 15, "pt": "B", "ps": 9, "pr": ["投影片黃字／黃筆標記（50-008）"]}, {"s": [3], "src": "", "card": "C51-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜國家統一永遠是中國核心利益的核心：\n国家统一永远是中国（＿①＿）；台湾问题因民族（＿②＿）而产生，必将随着民族（＿③＿）而解决", "a": ["核心利益的核心", "弱乱", "复兴"], "e": "民族復興、國家統一是大勢所趨、大義所在、民心所向。中華文明具有突出的統一性，國家統一永遠是中國核心利益的核心。台灣問題因民族弱亂而產生，必將隨着民族復興而解決。", "id": "Q51-001", "l": 51, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-003）"]}, {"s": [3], "src": "", "card": "C51-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜台灣前途在於國家統一，台灣同胞福祉繫於民族復興：\n台湾前途在于（＿①＿），台湾同胞福祉系于（＿②＿）", "a": ["国家统一", "民族复兴"], "e": "兩岸關係和平發展是維護兩岸和平、促進兩岸共同發展、造福兩岸同胞的正確道路；要兩岸同胞共同推動、共同維護、共同分享。中國夢是兩岸同胞共同的夢。", "id": "Q51-002", "l": 51, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-003）"]}, {"s": [4], "src": "", "card": "C51-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜統一是正道，「台獨」是絕路；最大現實威脅：\n统一是历史大势，是（＿①＿）；“台独”是历史逆流，是（＿②＿）；对两岸关系和平发展的（＿③＿）是“台独”势力及其分裂活动", "a": ["正道", "绝路", "最大现实威胁"], "e": "統一是歷史大勢，是正道；「台獨」是歷史逆流，是絕路。對兩岸關係和平發展的最大現實威脅是「台獨」勢力及其分裂活動。習近平指出：「實現祖國完全統一是全體中華兒女的共同願望，是民族復興的題中之義。」", "id": "Q51-003", "l": 51, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-004）"]}, {"s": [6], "src": "", "card": "C51-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜新時代黨解決台灣問題的總體方略（十個「這是統一的……」）：\n坚持党中央对对台工作的集中统一领导，这是统一的（＿①＿）；坚持“和平统一、一国两制”基本方针，这是统一的（＿②＿）；坚持一个中国原则和“九二共识”，这是统一的（＿③＿）；坚持团结台湾同胞、争取台湾民心，这是统一的（＿④＿）", "a": ["根本保证", "大政方针", "政治基础", "根本动力"], "e": "講師：「我們這十個內容呢，必須要去把它給記住了」「很有可能是今年的我們的一個重點的考點」「我不要求大家全部一字不落的背過，但是你至少做選擇題你必須要會去做」。", "id": "Q51-004", "l": 51, "ch": 15, "pt": "A", "ps": 58, "pr": ["老師：…我們這十個內容呢 必須要去把它給記住了啊 很有可能是…（51-006）", "老師：…撐分別都是 , "q": "新時代黨解決台灣問題的總體方略中，「坚持决不承诺放弃使用武力」是統一的：", "o": ["战略支撑", "根本动力", "实践途径", "根本保证"], "a": 0, "e": "「坚持决不承诺放弃使用武力」→「战略支撑」。記法：「黨中央＝根本保證；復興進程＝歷史方位；大陸發展＝戰略思路；和統一兩＝大政方針；一中九二＝政治基礎；和平融合發展＝實踐途徑；台灣民心＝根本動力；粉碎台獨＝必然要求；反干涉＝外部條件；不放棄武力＝戰略支撐」。", "id": "Q51-023", "l": 51, "ch": 15, "pt": "A", "ps": 58, "pr": ["老師：…我們這十個內容呢 必須要去把它給記住了啊 很有可能是…（51-006）", "老師：…撐分別都是什麼 我們都需要去記住啊 記憶住（51-006）", "老師：這是統一的根本保證 選擇題 第二（51-006）"]}, {"s": [6], "src": "", "card": "C51-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "“坚持决不承诺放弃使用武力”，这是统一的根本保证。", "a": false, "e": "錯。「坚持决不承诺放弃使用武力」應對應「战略支撑」，「根本保证」對應的是「坚持党中央对对台工作的集中统一领导」。", "id": "Q51-024", "l": 51, "ch": 15, "pt": "A", "ps": 58, "pr": ["老師：…我們這十個內容呢 必須要去把它給記住了啊 很有可能是…（51-006）", "老師：…撐分別都是什麼 我們都需要去記住啊 記憶住（51-006）", "老師：這是統一的根本保證 選擇題 第二（51-006）"]}, {"s": [7], "src": "", "card": "C51-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜總體方略的地位：\n是我们党对台大政方针的（＿①＿）；是我们党解决台湾问题、实现祖国统一的（＿②＿），是新时代新征程推进祖国统一大业的（＿③＿）", "a": ["继承发展和集大成", "最新理论成果", "科学指南和行动纲领"], "e": "新時代黨解決台灣問題的總體方略是我們黨對台大政方針的繼承發展和集大成；標誌着黨的國家統一理論更加成熟，是黨解決台灣問題、實現祖國統一的最新理論成果，是新時代新征程推進祖國統一大業的科學指南和行動綱領。", "id": "Q51-025", "l": 51, "ch": 15, "pt": "C", "ps": 0, "pr": []}, {"s": [8], "src": "", "card": "C51-06", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「和平統一、一國兩制」是實現兩岸統一的最佳方式：\n“和平统一、一国两制”方针是实现两岸统一的（＿①＿）", "a": ["最佳方式"], "e": "把握兩岸關係主導權和主動權，必須堅持一個中國原則和「九二共識」，堅決反對「台獨」分裂行徑，堅決反對外部勢力干涉。「和平統一、一國兩制」既充分考慮台灣現實情況，又有利於統一後台灣長治久安，對兩岸同胞和全民族最有利。", "id": "Q51-026", "l": 51, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-008）"]}, {"s": [8, 9], "src": "", "card": "C51-07", "tag": ["簡答題考點"], "auto": 1, "k": "填", "q": "填空｜牢牢把握兩岸關係主導權和主動權（三點）：\n坚持以最大诚意、尽最大努力争取（＿①＿）的前景，但决不承诺（＿②＿）", "a": ["和平统一", "放弃使用武力"], "e": "（1）「和平統一、一國兩制」方針是實現兩岸統一的最佳方式；（2）促進兩岸經濟文化交流合作，深化兩岸各領域融合發展（推進兩岸經濟合作制度化，打造兩岸共同市場）；（3）堅持以最大誠意、盡最大努力爭取和平統一的前景，但決不承諾放棄使用武力。", "id": "Q51-027", "l": 51, "ch": 15, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（51-009）"]}, {"s": [9], "src": "", "card": "C51-08", "tag": ["選擇題考點"], "auto": 1, "k": "填",
