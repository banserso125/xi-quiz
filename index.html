id": "C28-02", "l": 28, "ch": 8, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "三項基本政治制度（記關鍵詞：多黨・民族・基層）", "p": "基本政治制度有三項：中國共產黨領導的多黨合作和政治協商制度、民族區域自治制度、基層群眾自治制度。講師：只考選擇題，記關鍵詞「多黨、民族、基層」。", "o": "〖中国共产党领导的多党合作和政治协商制度〗、〖民族区域自治制度〗、〖基层群众自治制度〗", "m": "「多・民・基」。", "items": ["中国共产党领导的多党合作和政治协商制度", "民族区域自治制度", "基层群众自治制度"], "pt": "A", "ps": 28, "pr": ["老師：…三個 A B C 你只需要去記住……它的一些關鍵詞就…（28-004）", "投影片手寫星號（28-004）", "同頁有考點提示：…的政治制度 選擇題重要考點 非常重要」；01:09…（28-004）"]}, {"id": "C28-03", "l": 28, "ch": 8, "s": [5], "src": "", "tag": ["必背"], "t": "社會主義協商民主的定義", "p": "講師：「這個背」——協商民主就是在黨的領導下，人民內部各方面就重大問題和群眾切身利益問題，在決策之前和決策實施之中廣泛商量，努力形成共識的重要民主形式。（「源自……」一段不用背。）", "o": "在中国共产党领导下，人民内部各方面围绕改革发展稳定重大问题和涉及群众切身利益的实际问题，在〖决策之前和决策实施之中〗开展〖广泛协商〗，努力〖形成共识〗的重要民主形式", "m": "「黨領導・人民內部・決策前和中・廣泛協商・形成共識」。", "pt": "A", "ps": 36, "pr": ["老師：…這下面不需要你去背 這個背（28-005）", "老師：這個背（28-005）", "投影片手寫星號（28-005）"]}, {"id": "C28-04", "l": 28, "ch": 8, "s": [6, 7], "src": "", "tag": ["必背", "選擇題考點"], "t": "協商民主是獨特的、獨有的、獨到的民主形式", "p": "講師：選擇題考點——協商民主是中國社會主義民主政治中獨特的、獨有的、獨到的民主形式。原因如：把發揚民主和增進團結相互貫通；暢通各種利益訴求進入決策程序的渠道；有發現和改正失誤和錯誤的機制；人民參與各層次管理和治理的機制；凝聚推進改革發展的智慧和力量。", "o": "协商民主是中国社会主义民主政治中〖独特的、独有的、独到的〗民主形式", "m": "「三個獨：特・有・到」。", "pt": "A", "ps": 20, "pr": ["老師：…有的獨到的 這是選擇題考點啊 我們協商民主是最獨特的…（28-007）", "投影片黃字／黃筆標記（28-006）", "老師：第八章「這一章非常重要…選擇題考點也比較多」（26 srt 01:07）"]}, {"id": "C28-05", "l": 28, "ch": 8, "s": [8], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "基層民主的地位和形式", "p": "地位（選擇題）：基層民主是全過程人民民主的重要體現。形式（多選題）：村民委員會（農村村民自治）、居民委員會（城市居民自治）、職工代表大會（企事業單位職工自治）。講師：「這三個你把我記住。」", "o": "〖基层民主〗是全过程人民民主的〖重要体现〗；形式：〖村民委员会〗、〖居民委员会〗、〖职工代表大会〗", "m": "「村・居・職」：農村、城市、單位。", "items": ["村民委员会", "居民委员会", "职工代表大会"], "pt": "A", "ps": 27, "pr": ["老師：…擇題 形式多選題 這個給我記住了（28-008）", "老師：…程人民民主的重要體現 選擇題（28-008）", "投影片黃字／黃筆標記（28-008）"]}, {"id": "C28-06", "l": 28, "ch": 8, "s": [9], "src": "", "tag": ["了解"], "t": "堅持和完善基層群眾自治制度的要求", "p": "四項要求：黨的領導貫穿基層群眾自治全過程；健全基層黨組織領導的基層群眾自治機制；完善辦事公開制度；全心全意依靠工人階級。", "o": "党的领导贯穿〖基层群众自治全过程〗；健全基层党组织领导的〖基层群众自治机制〗；完善办事〖公开制度〗；全心全意依靠〖工人阶级〗", "m": "「全過程・機制・公開・工人階級」。", "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（28-009）", "老師：第八章「這一章非常重要…選擇題考點也比較多」（26 srt 01:07）"]}, {"id": "C29-01", "l": 29, "ch": 8, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "統一戰線是凝聚人心、匯聚力量的強大法寶", "p": "講師：統一戰線的核心兩個字就是「團結」。統一戰線是中國共產黨奪取革命、建設、改革事業勝利的重要法寶，也是實現中華民族偉大復興的重要法寶。", "o": "统一战线是〖凝聚人心、汇聚力量〗的强大法宝；统一战线是中国共产党夺取革命、建设、改革事业胜利的〖重要法宝〗，也是实现中华民族伟大复兴的重要法宝", "m": "「統戰＝團結＝法寶」。", "pt": "A", "ps": 18, "pr": ["老師：…心匯聚力量的強大法寶 選擇題（29-003）", "同頁有考點提示：所以這裏需要大家記選擇題 統一戰線選擇題……第二…（29-003）", "投影片黃字／黃筆標記（29-003）"]}, {"id": "C29-02", "l": 29, "ch": 8, "s": [3, 4], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "統戰工作的本質要求與關鍵", "p": "統戰工作的「本質要求」是大團結大聯合（解決人心和力量問題）；「關鍵」是堅持求同存異——找到最大公約數，畫出最大同心圓。工作對象是黨外人士，重點是其中的代表人士。", "o": "统战工作的本质要求是〖大团结大联合〗；统战工作的关键是坚持〖求同存异〗", "m": "「本質＝大團結大聯合；關鍵＝求同存異」。", "pt": "A", "ps": 31, "pr": ["老師：所以這裏需要大家記選擇題 統一戰線選擇題……第二…（29-003）", "老師：…這個記下來（接下來） 選擇題（29-004）", "同頁有考點提示：…心匯聚力量的強大法寶 選擇題（29-003）"]}, {"id": "C29-03", "l": 29, "ch": 8, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "黨的領導是統一戰線最鮮明的特徵", "p": "講師：「黨是領導着我們統一戰線的，這是最鮮明的特徵。」坚持黨的領導是統一戰線最根本的問題；主要體現為黨委領導，而不是部門領導。", "o": "〖党的领导〗是统一战线〖最鲜明的特征〗，坚持党的领导是统一战线最根本的问题", "m": "「統戰最鮮明＝黨領導」。", "pt": "A", "ps": 17, "pr": ["老師：…是部門領導 你就把這個給我記住（29-005）", "投影片黃字／黃筆標記（29-005）", "老師：第八章「這一章非常重要…選擇題考點也比較多」（26 srt 01:07）"]}, {"id": "C29-04", "l": 29, "ch": 8, "s": [6], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "民族團結是生命線；共同體意識是民族團結之本", "p": "民族團結是我國各族人民的「生命線」（講師：選擇）；中華民族共同體意識是民族團結之「本」。注意：這是第三條「生命線」（基本路線＝國家生命線；群眾路線＝黨的生命線；民族團結＝各族人民的生命線）。", "o": "〖民族团结〗是我国各族人民的〖生命线〗，〖中华民族共同体意识〗是民族团结之〖本〗", "m": "生命線大集合：「基本路線→國家、群眾路線→黨、民族團結→各族人民」。", "pt": "B", "ps": 8, "pr": ["老師：…我國各族人民的生命線 選擇（29-006）", "投影片黃字／黃筆標記（29-006）", "老師：第八章「這一章非常重要…選擇題考點也比較多」（26 srt 01:07）"]}, {"id": "C29-05", "l": 29, "ch": 8, "s": [7, 8, 9], "src": "", "tag": ["必背", "論述題考點"], "t": "鑄牢中華民族共同體意識的要求（黃字關鍵語）", "p": "講師：「背一下，大題考點。」共八條，黃字關鍵語：休戚與共、榮辱與共、生死與共、命運與共的共同體理念；正確把握共同性和差異性；加強民族團結宣傳教育；推廣普及國家通用語言文字；差別化區域支持政策；促進各民族交往交流交融等。", "o": "〖休戚与共、荣辱与共、生死与共、命运与共〗；〖共同性和差异性〗；〖民族团结宣传教育〗；〖推广普及国家通用语言文字〗；〖差别化区域支持政策〗；〖交往交流交融〗", "m": "「四個與共：休・榮・生・命」。", "pt": "A", "ps": 43, "pr": ["老師：…麼幾個 背一下 （大級考定：似「大題考點」，難辨）（29-007）", "老師：背一下，大題考點。（29-007）", "投影片手寫星號（29-008）"]}, {"id": "C29-06", "l": 29, "ch": 8, "s": [10, 11], "src": "", "tag": ["必背", "簡答題考點"], "t": "做好新時代宗教工作", "p": "講師：稍微背下，可作簡答題。①堅持我國宗教中國化方向；②宗教工作本質上是群眾工作；③堅決抵禦境外利用宗教進行滲透。", "o": "坚持我国〖宗教中国化方向〗；宗教工作本质上是〖群众工作〗；坚决抵御〖境外利用宗教进行渗透〗", "m": "「中國化・群眾工作・抵禦滲透」。", "items": ["坚持我国宗教中国化方向", "宗教工作本质上是群众工作", "坚决抵御境外利用宗教进行渗透"], "pt": "A", "ps": 20, "pr": ["老師：…集的考慮：似「簡答題的考點」） 就是如何做好新時代的…（29-010）", "投影片黃字／黃筆標記（29-010）", "老師：第八章「這一章非常重要…選擇題考點也比較多」（26 srt 01:07）"]}, {"id": "C29-07", "l": 29, "ch": 8, "s": [12, 13, 14], "src": "", "tag": ["選擇題考點"], "t": "海內外中華兒女大團結；四方面關係", "p": "促進中華兒女大團結是新時代愛國統一戰線的歷史責任。要高舉愛國主義、社會主義旗幟；抓好重點領域統戰工作；辯證把握四方面關係：固守圓心和擴大共識、潛績和顯績、原則性和靈活性、團結和鬥爭。", "o": "促进〖中华儿女大团结〗是新时代爱国统一战线的历史责任；高举〖爱国主义、社会主义〗旗帜；把握好〖固守圆心和扩大共识〗、〖潜绩和显绩〗、〖原则性和灵活性〗、〖团结和斗争〗的关系", "m": "四對「圓心共識・潛顯・原則靈活・團結鬥爭」。", "items": ["把握好固守圆心和扩大共识的关系", "把握好潜绩和显绩的关系", "把握好原则性和灵活性的关系", "把握好团结和斗争的关系"], "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（29-012）", "老師：第八章「這一章非常重要…選擇題考點也比較多」（26 srt 01:07）"]}, {"id": "C30-01", "l": 30, "ch": 9, "s": [5, 7], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面依法治國是國家治理的一場深刻革命；四個全面中的重要一環", "p": "全面依法治國是國家治理的一場深刻革命；法律是治國之重器，法治是國家治理體系和治理能力的重要依託；法治興則國興，法治強則國強。全面依法治國是「四個全面」戰略布局中的重要一環（屬於三大戰略舉措之一）。", "o": "全面依法治国是国家治理的一场〖深刻革命〗；法律是〖治国之重器〗；法治是国家治理体系和治理能力的〖重要依托〗；〖法治兴则国兴，法治强则国强〗；“四个全面”〖战略布局的重要一环〗", "m": "「革命・重器・依託・興強・一環」。", "pt": "A", "ps": 19, "pr": ["老師：…這點我們需要去當做一個選擇題去記憶一下（30-005）", "老師：…置 這個需要我們同學去注意一下（30-007）", "投影片黃字／黃筆標記（30-005）"]}, {"id": "C30-02", "l": 30, "ch": 9, "s": [5], "src": "逐字稿", "tag": ["必背", "選擇題考點", "易混"], "t": "十八屆四中全會＝全面依法治國", "p": "講師：「提到全面依法治國就對應的是十八屆四中全會。」十八屆四中全會《決定》規劃了全面依法治國的總藍圖、路線圖、施工圖。（對比：十八屆三中全會＝全面深化改革。）", "o": "提到全面依法治国就对应〖十八届四中全会〗；规划全面依法治国〖总蓝图、路线图、施工图〗", "m": "「三中改革、四中法治」。", "pt": "B", "ps": 6, "pr": ["同頁有考點提示：…這點我們需要去當做一個選擇題去記憶一下（30-005）", "投影片黃字／黃筆標記（30-005）"]}, {"id": "C30-03", "l": 30, "ch": 9, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面依法治國的地位：本質要求和重要保障", "p": "全面依法治國是堅持和發展中國特色社會主義的本質要求和重要保障（講師：作為選擇題記憶）。法律是治國理政最大最重要的規矩。", "o": "全面依法治国是坚持和发展中国特色社会主义的〖本质要求和重要保障〗；法律是治国理政〖最大最重要的规矩〗", "m": "「本質要求＋重要保障」。", "pt": "A", "ps": 13, "pr": ["老師：……本質要求和重要保障 選擇題不用多說了 法律是什麼…（30-006）", "投影片黃字／黃筆標記（30-006）"]}, {"id": "C30-04", "l": 30, "ch": 9, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "唯一正確道路：中國特色社會主義法治道路", "p": "全面依法治國的唯一正確道路是中國特色社會主義法治道路（講師：記住），本質上是中國特色社會主義道路在法治領域的具體體現。", "o": "〖中国特色社会主义法治道路〗是全面依法治国的〖唯一正确道路〗，本质上是中国特色社会主义道路在法治领域的具体体现", "m": "「唯一＝中特法治道路」。", "pt": "A", "ps": 15, "pr": ["老師：…保證 又來了一個單選題考點 那麼這個呢 我們就作為一…（30-008）", "投影片黃字／黃筆標記（30-008）"]}, {"id": "C30-05", "l": 30, "ch": 9, "s": [8, 9], "src": "", "tag": ["必背", "多選題考點", "選擇題考點"], "t": "中特法治道路的核心要義（三項）及各自地位", "p": "核心要義（多選）：堅持黨的領導、堅持中國特色社會主義制度、貫徹中國特色社會主義法治理論。單選：黨的領導是中特最本質的特徵、社會主義法治最根本的保證；中特制度是全面推進依法治國的根本制度保障；中特法治理論是理論指導和學理支撐、行動指南。", "o": "〖坚持党的领导〗——社会主义法治〖最根本的保证〗；〖坚持中国特色社会主义制度〗——全面推进依法治国的〖根本制度保障〗；〖贯彻中国特色社会主义法治理论〗——〖理论指导和学理支撑〗、行动指南", "m": "「黨＝最根本保證、制度＝根本制度保障、理論＝指導支撐」。", "items": ["坚持党的领导", "坚持中国特色社会主义制度", "贯彻中国特色社会主义法治理论"], "pt": "A", "ps": 40, "pr": ["老師：…保證 又來了一個單選題考點 那麼這個呢 我們就作為一…（30-008）", "老師：…它涉及到很多的選擇題考點 所以我們一定要回去多多複…（30-009）", "老師：…個給我記一下 作為一個單選題（30-009）"]}, {"id": "C30-06", "l": 30, "ch": 9, "s": [10, 11, 12, 13, 14], "src": "", "tag": ["必背", "簡答題考點"], "t": "堅持和拓展中特法治道路的五個原則（大標題要背）", "p": "講師：「背大標題」，問有哪些原則就把五個打出來。①堅持中國共產黨的領導；②堅持以人民為中心；③堅持法律面前人人平等；④堅持依法治國和以德治國相結合；⑤堅持從中國實際出發。", "o": "（1）坚持〖中国共产党的领导〗；（2）坚持〖以人民为中心〗；（3）坚持〖法律面前人人平等〗；（4）坚持〖依法治国和以德治国相结合〗；（5）坚持〖从中国实际出发〗", "m": "「黨・民・平・德・實」。", "items": ["坚持中国共产党的领导", "坚持以人民为中心", "坚持法律面前人人平等", "坚持依法治国和以德治国相结合", "坚持从中国实际出发"], "pt": "A", "ps": 41, "pr": ["老師：…:55「所以這個選擇題考點給我記住 堅持法律面前人人…（30-012）", "老師：…個我們就過完了 那我們需要去把這個大標題記住 背大標…（30-010）", "投影片黃字／黃筆標記（30-010）"]}, {"id": "C30-07", "l": 30, "ch": 9, "s": [10, 11, 12, 13], "src": "逐字稿", "tag": ["選擇題考點"], "t": "五原則中的重要表述", "p": "黨的領導是中特法治之魂，是我們法治同西方資本主義法治的最大區別；全面依法治國的根本目的是依法保障人民權益，最廣泛最深厚的基礎是人民；平等是社會主義法律的基本屬性（選擇）；法安天下，德潤人心；法律是成文的道德，道德是內心的法律。", "o": "党的领导是中国特色社会主义法治之〖魂〗；根本目的是依法保障〖人民权益〗；〖平等〗是社会主义法律的〖基本属性〗；法安天下，〖德润人心〗；法律是〖成文的道德〗，道德是〖内心的法律〗", "m": "「魂・權益・平等・德潤・成文vs內心」。", "pt": "A", "ps": 39, "pr": ["老師：…:55「所以這個選擇題考點給我記住 堅持法律面前人人…（30-012）", "老師：…個我們就過完了 那我們需要去把這個大標題記住 背大標…（30-010）", "老師：…本主義國家的法治最大的區別就可以了（30-010）"]}, {"id": "C30-08", "l": 30, "ch": 9, "s": [15, 16, 17, 18], "src": "", "tag": ["多選題考點"], "t": "統籌處理全面依法治國的四對重大關係", "p": "四對關係：政治和法治、改革和法治、依法治國和以德治國、依法治國和依規治黨。（易混：別與第08堂中國式現代化六組關係混。）", "o": "处理〖政治和法治〗的关系；处理〖改革和法治〗的关系；处理〖依法治国和以德治国〗的关系；处理〖依法治国和依规治党〗的关系", "m": "「政・改・德・規」配「法」。", "items": ["政治和法治", "改革和法治", "依法治国和以德治国", "依法治国和依规治党"], "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（30-016）"]}, {"id": "C31-01", "l": 31, "ch": 9, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面推進依法治國的總抓手", "p": "建設中國特色社會主義法治體系是全面推進依法治國的「總抓手」（總攬全局、牽引各方）。講師：單選題。", "o": "把建设〖中国特色社会主义法治体系〗作为全面推进依法治国的〖总抓手〗", "m": "「總抓手＝法治體系」（抓手＝把手）。", "pt": "A", "ps": 13, "pr": ["老師：…各方的總抓手 注意這裏選擇題 把建設中國特色社會主義…（31-003）", "投影片黃字／黃筆標記（31-003）"]}, {"id": "C31-02", "l": 31, "ch": 9, "s": [4], "src": "投影片＋逐字稿", "tag": ["必背", "選擇題考點", "多選題考點", "易混"], "t": "全面依法治國的總目標（十八屆四中全會）", "p": "十八屆四中全會把「建設中國特色社會主義法治體系、建設社會主義法治國家」確定為全面依法治國的總目標。這兩者（體系＋國家）也是堅持和發展中特的內在要求（多選）。注意：「總抓手」只是「體系」；「總目標」是「體系＋國家」兩句。", "o": "党的〖十八届四中全会〗将〖建设中国特色社会主义法治体系〗、〖建设社会主义法治国家〗确定为全面推进依法治国的〖总目标〗，将建设中国特色社会主义法治体系确定为全面推进依法治国的〖总抓手〗", "m": "「總抓手＝一個（體系）；總目標＝兩個（體系＋國家）」。", "items": ["总目标：建设中国特色社会主义法治体系、建设社会主义法治国家", "总抓手：建设中国特色社会主义法治体系"], "pt": "A", "ps": 37, "pr": ["老師：…這裏涉及到很多的選擇題考點 黨的十八屆四中全會……將…（31-004）", "老師：…梳理好我們的一些選擇題考點 一個是內在要求 體系和國…（31-004）", "老師：…義的內在要求 來選擇 多選 A 建設中國特色社會主義…（31-004）"]}, {"id": "C31-03", "l": 31, "ch": 9, "s": [5], "src": "", "tag": ["選擇題考點"], "t": "中特法治體系的本質", "p": "講師：「注意一個本質就可以了」——中國特色社會主義法治體系的本質是中國特色社會主義制度的法律表現形式。", "o": "中国特色社会主义法治体系的本质是〖中国特色社会主义制度的法律表现形式〗", "m": "「法治體系＝制度穿上法律的衣服」。", "pt": "B", "ps": 9, "pr": ["老師：這裏呢 我們需要去注意一個本質上就可以了 本質是什…（31-005）", "投影片黃字／黃筆標記（31-005）"]}, {"id": "C31-04", "l": 31, "ch": 9, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "憲法的地位", "p": "憲法是國家的根本法，是治國安邦的總章程，是各種制度和法律法規的總依據，具有最高的法律地位、法律權威、法律效力。講師：選擇題凡問「最重要的法律」，就找憲法。", "o": "宪法是国家的〖根本法〗，是治国安邦的〖总章程〗，是各种制度和法律法规的〖总依据〗", "m": "「根本法・總章程・總依據」。", "pt": "A", "ps": 19, "pr": ["老師：…麼……首先第一個選擇題考點 憲法是什麼 是國家的根本…（31-006）", "老師：但凡選擇題 它提到最重要的法律 你就去給我找憲法就…（31-006）", "投影片黃字／黃筆標記（31-006）"]}, {"id": "C31-05", "l": 31, "ch": 9, "s": [6, 7], "src": "", "tag": ["必背", "選擇題考點"], "t": "堅持依憲治國、依憲執政", "p": "依憲治國、依憲執政，必須堅持黨的領導地位和我國國體、政體不動搖；必須全面貫徹實施憲法。憲法的生命在於實施，憲法的權威也在於實施。", "o": "必须坚持〖党的领导地位和我国国体、政体〗不动摇；宪法的〖生命〗在于实施，宪法的〖权威〗也在于实施", "m": "「生命和權威，都在實施」。", "pt": "B", "ps": 10, "pr": ["同頁有考點提示：…麼……首先第一個選擇題考點 憲法是什麼 是國家的根本…（31-006）", "投影片黃字／黃筆標記（31-007）"]}, {"id": "C31-06", "l": 31, "ch": 9, "s": [8, 9, 10, 11], "src": "", "tag": ["必背", "簡答題考點"], "t": "中特法治體系的五大體系", "p": "五個體系：完備的法律規範體系（以憲法為核心）、高效的法治實施體系、嚴密的法治監督體系、有力的法治保障體系、完善的黨內法規體系（以黨章為根本）。把黨內法規體系納入法治體系，是我國法治區別於其他國家法治的鮮明特徵。", "o": "〖完备〗的法律规范体系；〖高效〗的法治实施体系；〖严密〗的法治监督体系；〖有力〗的法治保障体系；〖完善〗的党内法规体系", "m": "形容詞配對：「完備規範・高效實施・嚴密監督・有力保障・完善黨規」＝「備・效・密・力・善」。", "items": ["完备的法律规范体系", "高效的法治实施体系", "严密的法治监督体系", "有力的法治保障体系", "完善的党内法规体系"], "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（31-008）"]}, {"id": "C32-01", "l": 32, "ch": 9, "s": [2], "src": "", "tag": ["必背", "選擇題考點"], "t": "法治是現代化的基本保障也是重要內容", "p": "法治是國家文明進步的重要標誌；法治既是實現國家現代化的基本保障，也是國家現代化的重要內容（選擇題）；國家要走向現代化，必須實現法治化。", "o": "法治是国家文明进步的〖重要标志〗；法治既是实现国家现代化的〖基本保障〗，也是国家现代化的〖重要内容〗；国家要走向现代化，必须实现〖法治化〗", "m": "「保障＋內容」兩個身份。", "pt": "A", "ps": 16, "pr": ["老師：…國家現代化的重要內容 選擇題（32-002）", "同頁有考點提示：…建成 這塊內容需要大家去背誦一下 那麼它可以作為我們…（32-002）", "投影片黃字／黃筆標記（32-002）"]}, {"id": "C32-02", "l": 32, "ch": 9, "s": [2], "src": "", "tag": ["必背", "簡答題考點"], "t": "法治中國建設的總目標（六句）", "p": "講師：需要背誦，可考選擇、辨析或簡答。六句：法律規範科學完備統一；執法司法公正高效權威；權力運行受到有效制約監督；人民合法權益得到充分尊重保障；法治信仰普遍確立；法治國家、法治政府、法治社會全面建成。", "o": "实现法律规范〖科学完备统一〗，执法司法〖公正高效权威〗，权力运行受到有效〖制约监督〗，人民合法权益得到充分〖尊重保障〗，法治信仰〖普遍确立〗，法治国家、法治政府、法治社会〖全面建成〗", "m": "「法・執・權・民・信・三法治」六主語：法律規範→執法司法→權力→人民權益→信仰→國家政府社會。", "items": ["法律规范科学完备统一", "执法司法公正高效权威", "权力运行受到有效制约监督", "人民合法权益得到充分尊重保障", "法治信仰普遍确立", "法治国家、法治政府、法治社会全面建成"], "pt": "A", "ps": 17, "pr": ["老師：…建成 這塊內容需要大家去背誦一下 那麼它可以作為我們…（32-002）", "同頁有考點提示：…國家現代化的重要內容 選擇題（32-002）", "投影片黃字／黃筆標記（32-002）"]}, {"id": "C32-03", "l": 32, "ch": 9, "s": [3], "src": "", "tag": ["選擇題考點", "易混"], "t": "具體目標的時間節點：2025 vs 2035", "p": "講師：細項不需背，要記時間節點。2025年：黨領導全面依法治國體制機制「更加健全」、法律體系「更加完備」等；2035年：法治國家、法治政府、法治社會「基本建成」，中特法治體系「基本形成」。", "o": "〖2025年〗——更加健全、更加完备；〖2035年〗——法治国家、法治政府、法治社会〖基本建成〗，中国特色社会主义法治体系〖基本形成〗", "m": "「25年『更加』，35年『基本』」（又一個2035配「基本」）。", "pt": "A", "ps": 15, "pr": ["老師：這個時間節點我們需要去記一下 因為它……涉及到………（32-003）", "投影片手寫星號（32-003）", "投影片黃字／黃筆標記（32-003）"]}, {"id": "C32-04", "l": 32, "ch": 9, "s": [4, 5, 6], "src": "", "tag": ["必背", "簡答題考點"], "t": "法治中國建設的工作布局（三個標題）", "p": "講師：「背、背、背，三個標題要背過。」①堅持依法治國、依法執政、依法行政共同推進；②堅持法治國家、法治政府、法治社會一體建設；③堅持統籌推進國內法治和涉外法治。", "o": "坚持〖依法治国、依法执政、依法行政〗共同推进；坚持〖法治国家、法治政府、法治社会〗一体建设；坚持统筹推进〖国内法治和涉外法治〗", "m": "「三依・三法治・內外」：依法治國/執政/行政→法治國家/政府/社會→國內/涉外。", "items": ["坚持依法治国、依法执政、依法行政共同推进", "坚持法治国家、法治政府、法治社会一体建设", "坚持统筹推进国内法治和涉外法治"], "pt": "A", "ps": 45, "pr": ["老師：…依法行政 這三個重要的關鍵詞要記住（32-004）", "老師：…第二個知識點 這三個 背 背 背 這個就是我們的工作…（32-006）", "老師：背、背、背，三個標題要背過。（32-004）"]}, {"id": "C32-05", "l": 32, "ch": 9, "s": [7, 9], "src": "", "tag": ["必背", "選擇題考點"], "t": "新十六字方針；公正司法是最後一道防線", "p": "建設更高水平的法治中國：科學立法、嚴格執法、公正司法、全民守法（講師：「16字」）。公正司法是維護社會公平正義的最後一道防線（選擇題，二十大重要內容）。每一個立法環節都要把好憲法關；形成守法光榮、違法可恥的社會氛圍。", "o": "〖科学立法〗、〖严格执法〗、〖公正司法〗、〖全民守法〗；公正司法是维护社会公平正义的〖最后一道防线〗", "m": "「立・執・司・守」配「科學・嚴格・公正・全民」。", "pt": "A", "ps": 18, "pr": ["老師：…這是我們的一個選擇題考點 也是在我們的二十大中的一…（32-009）", "投影片黃字／黃筆標記（32-007）"]}, {"id": "C32-06", "l": 32, "ch": 9, "s": [7, 8, 9], "src": "", "tag": ["簡答題考點"], "t": "建設更高水平的法治中國（四方面）", "p": "完善以憲法為核心的中國特色社會主義法律體系；扎實推進依法行政；嚴格公正司法；加快建設法治社會。", "o": "完善〖以宪法为核心的中国特色社会主义法律体系〗；扎实推进〖依法行政〗；严格〖公正司法〗；加快〖建设法治社会〗", "m": "對應「立・行・司・守」四環節。", "items": ["完善以宪法为核心的中国特色社会主义法律体系", "扎实推进依法行政", "严格公正司法", "加快建设法治社会"], "pt": "A", "ps": 21, "pr": ["老師：…這是我們的一個選擇題考點 也是在我們的二十大中的一…（32-009）", "投影片黃字／黃筆標記（32-007）"]}, {"id": "C33-01", "l": 33, "ch": 10, "s": [6, 7, 8], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "文化繁榮興盛的四個定位（皆可考單選）", "p": "為什麼一定要讓文化繁榮？因為它是：①民族復興的精神支撐（像人的精神力量）；②建設現代化強國的應有之義（本來就該包含的部分）；③滿足人民美好生活需要的內在要求；④在世界文化激盪中站穩腳跟的前提基礎。講師：分別作為單選。", "o": "文化繁荣兴盛是实现中华民族伟大复兴的〖精神支撑〗；是建设社会主义现代化强国的〖应有之义〗；是满足人民日益增长的美好生活需要的〖内在要求〗；是在世界文化激荡中站稳脚跟的〖前提基础〗", "m": "「復興—支撐、強國—應有、生活—內在、世界—前提」：「撐・應・內・前」。", "pt": "A", "ps": 34, "pr": ["老師：…這個是我們的一個選擇題考點 你要知道我們實現中華民族…（33-006）", "老師：…要求 選擇 他分別作為單選 內在要求是什麼……是文化…（33-007）", "老師：…現代化強國的應有之義 選擇（33-006）"]}, {"id": "C33-02", "l": 33, "ch": 10, "s": [9, 10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "堅定文化自信的三個基礎（注意措辭）", "p": "文化自信是更加基礎、更廣泛、更深厚的自信（講師：「更加深沉、更加持久的自信」）。三個來源各有專屬詞：中華優秀傳統文化＝深厚基礎；革命文化和社會主義先進文化＝堅強基石；中特偉大實踐＝現實基礎。", "o": "〖中华优秀传统文化〗是坚定文化自信的〖深厚基础〗；〖革命文化和社会主义先进文化〗是坚定文化自信的〖坚强基石〗；〖中国特色社会主义伟大实践〗是坚定文化自信的〖现实基础〗", "m": "「老祖宗—深厚；革命先進—基石（石頭硬＝堅強）；現在實踐—現實」。", "pt": "B", "ps": 9, "pr": ["老師：…們文化自信的堅強基石 注意這些他的一些措辭 中華優秀…（33-010）", "投影片黃字／黃筆標記（33-009）"]}, {"id": "C33-03", "l": 33, "ch": 10, "s": [11], "src": "", "tag": ["選擇題考點"], "t": "文化發展的唯一正確道路", "p": "推動社會主義文化繁榮興盛，只有一條正確的路：中國特色社會主義文化發展道路。", "o": "〖中国特色社会主义文化发展道路〗是推动社会主义文化繁荣兴盛的〖唯一正确道路〗", "m": "對比：法治的唯一正確道路＝中特法治道路（第30堂）。", "pt": "A", "ps": 15, "pr": ["老師：……這是一個重要的選擇題考點（33-011）", "投影片黃字／黃筆標記（33-011）"]}, {"id": "C33-04", "l": 33, "ch": 10, "s": [12, 13], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "舉旗幟、聚民心、育新人、興文化、展形象", "p": "文化工作的五項使命任務。", "o": "坚持〖举旗帜〗、〖聚民心〗、〖育新人〗、〖兴文化〗、〖展形象〗", "m": "「旗・心・人・文・象」：舉起旗→聚人心→育新人→興文化→向世界展形象。", "items": ["举旗帜", "聚民心", "育新人", "兴文化", "展形象"], "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（33-012）"]}, {"id": "C33-05", "l": 33, "ch": 10, "s": [14, 15], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "「二為」方向與「雙百」方針", "p": "「二為」方向＝為人民服務、為社會主義服務（是決定社會主義文化事業前途命運的關鍵）；「雙百」方針＝百花齊放、百家爭鳴（講師：「要知道」）。別把方向和方針弄反。", "o": "“二为”方向：坚持〖为人民服务、为社会主义服务〗的根本方向；“双百”方针：坚持〖百花齐放、百家争鸣〗", "m": "「二為＝兩個『為』；雙百＝兩個『百』」。", "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（33-014）"]}, {"id": "C33-06", "l": 33, "ch": 10, "s": [16], "src": "", "tag": ["選擇題考點"], "t": "創新創造是文化的生命所在", "p": "文化要一直有新東西才有活力。", "o": "〖创新创造〗是文化的〖生命所在〗，是文化的〖本质特征〗", "m": "「創新＝生命＋本質」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（33-016）"]}, {"id": "C34-01", "l": 34, "ch": 10, "s": [3, 4, 5], "src": "", "tag": ["必背", "選擇題考點"], "t": "馬克思主義在意識形態領域指導地位的根本制度", "p": "意識形態＝「思想的總和」。這是中特制度體系中的一項根本制度。理由：馬克思主義是立黨立國、興黨興國的根本指導思想；這是歷史的結論；是堅持和鞏固我國社會主義制度、保證文化建設正確方向的必然要求；馬克思主義是社會主義意識形態的旗幟和靈魂。", "o": "马克思主义是立党立国、兴党兴国的〖根本指导思想〗；是〖历史的结论〗；是坚持和巩固我国社会主义制度、保证我国文化建设正确方向的〖必然要求〗；马克思主义是社会主义意识形态的〖旗帜和灵魂〗", "m": "「指導思想・歷史結論・必然要求・旗幟靈魂」。", "pt": "B", "ps": 9, "pr": ["投影片黃字／黃筆標記（34-003）"]}, {"id": "C34-02", "l": 34, "ch": 10, "s": [6], "src": "", "tag": ["必背", "簡答題考點"], "t": "武裝全黨、教育人民、指導實踐（簡答必背）", "p": "講師：「作為我們的簡答題你必須要背過。」用馬克思主義（特別是中國化時代化的馬克思主義）去武裝全黨、教育人民、指導實踐。", "o": "坚持用马克思主义特别是〖中国化时代化〗的马克思主义〖武装全党〗、〖教育人民〗、〖指导实践〗", "m": "「黨・民・實」：武裝黨→教育民→指導實踐。", "items": ["武装全党", "教育人民", "指导实践"], "pt": "A", "ps": 37, "pr": ["老師：…作爲我們的簡答題你必須要背過的……一個重要的簡答題考…（34-006）", "老師：…果……你要注意啊 一個選擇題考（提高）點 在我們中國…（34-006）", "投影片黃字／黃筆標記（34-006）"]}, {"id": "C34-03", "l": 34, "ch": 10, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "馬克思主義中國化三次飛躍", "p": "馬克思主義在中國實現了三次飛躍，最新的一次飛躍形成的是習近平新時代中國特色社會主義思想（中國化時代化的最新成果）。", "o": "马克思主义中国化实现〖三次飞跃〗；最新成果是〖习近平新时代中国特色社会主义思想〗", "m": "「三次飛躍，最新＝習思想」。", "pt": "A", "ps": 16, "pr": ["老師：…果……你要注意啊 一個選擇題考（提高）點 在我們中國…（34-006）", "同頁有考點提示：…作爲我們的簡答題你必須要背過的……一個重要的簡答題考…（34-006）", "投影片黃字／黃筆標記（34-006）"]}, {"id": "C34-04", "l": 34, "ch": 10, "s": [8], "src": "投影片＋逐字稿", "tag": ["選擇題考點"], "t": "中國特色哲學社會科學的根本標誌", "p": "堅持以馬克思主義為指導，是當代中國哲學社會科學區別於其他哲學社會科學的根本標誌。", "o": "坚持〖以马克思主义为指导〗，是当代中国哲学社会科学区别于其他哲学社会科学的〖根本标志〗", "m": "「根本標誌＝馬克思主義指導」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（34-008）"]}, {"id": "C34-05", "l": 34, "ch": 10, "s": [9], "src": "", "tag": ["必背", "簡答題考點"], "t": "黨的新聞輿論工作的職責和使命（小簡答）", "p": "講師：「作為一個小小的簡答題去背誦一下。」六組四字詞，兩兩一對。", "o": "〖高举旗帜〗、〖引领导向〗，〖围绕中心〗、〖服务大局〗，〖团结人民〗、〖鼓舞士气〗，〖成风化人〗、〖凝心聚力〗，〖澄清谬误〗、〖明辨是非〗，〖联接中外〗、〖沟通世界〗", "m": "六對口訣「旗導・中局・民氣・風力・謬非・中外世界」。", "items": ["高举旗帜、引领导向", "围绕中心、服务大局", "团结人民、鼓舞士气", "成风化人、凝心聚力", "澄清谬误、明辨是非", "联接中外、沟通世界"], "pt": "A", "ps": 27, "pr": ["老師：…作爲一個小小的簡答題 去背誦一下 背誦一下（34-009）", "投影片黃字／黃筆標記（34-009）"]}, {"id": "C34-06", "l": 34, "ch": 10, "s": [10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "第一位要求 vs 根本原則", "p": "新聞輿論工作有鮮明的意識形態屬性。堅持正確的政治方向是做好新聞輿論工作的「第一位要求」；黨性原則是新聞輿論工作的「根本原則」。", "o": "坚持〖正确的政治方向〗是做好新闻舆论工作的〖第一位要求〗；〖党性原则〗是新闻舆论工作的〖根本原则〗", "m": "「方向第一，黨性根本」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（34-010）"]}, {"id": "C34-07", "l": 34, "ch": 10, "s": [12], "src": "", "tag": ["必背", "選擇題考點"], "t": "發射器和放大器；互聯網主陣地", "p": "新聞媒體是社會輿論的發射器和放大器；互聯網是意識形態工作的主陣地、主戰場、最前沿。", "o": "新闻媒体是社会舆论的〖发射器和放大器〗；互联网是意识形态工作的〖主阵地、主战场、最前沿〗", "m": "媒體像喇叭（發射＋放大）；互聯網像戰場（陣地・戰場・前沿）。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（34-012）"]}, {"id": "C35-01", "l": 35, "ch": 10, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "多選題考點", "易混"], "t": "社會主義核心價值觀24字三個層面", "p": "國家層面（建設什麼樣的國家）：富強、民主、文明、和諧；社會層面（建設什麼樣的社會）：自由、平等、公正、法治；公民個人層面（培育什麼樣的公民）：愛國、敬業、誠信、友善。講師：選擇題要記住；多選注意哪個層面對應什麼。", "o": "国家层面：〖富强、民主、文明、和谐〗；社会层面：〖自由、平等、公正、法治〗；公民个人层面：〖爱国、敬业、诚信、友善〗", "m": "國家「富民文和」、社會「自平公法」、個人「愛敬誠友」。", "items": ["国家：富强、民主、文明、和谐", "社会：自由、平等、公正、法治", "公民：爱国、敬业、诚信、友善"], "pt": "A", "ps": 25, "pr": ["老師：…個層面 作爲選擇題 你要記住……回答的是……建設什麼…（35-004）", "老師：…的內容 國家層面的內容選擇題要注意哈 那麼選擇題它可…（35-004）", "投影片黃字／黃筆標記（35-004）"]}, {"id": "C35-02", "l": 35, "ch": 10, "s": [3, 4], "src": "", "tag": ["選擇題考點"], "t": "核心價值觀的意義", "p": "社會主義核心價值觀集中體現全體人民共同的價值追求；承載著民族、國家的精神追求，體現著評判是非曲直的價值標準。", "o": "集中体现〖全体人民共同的价值追求〗；承载着民族、国家的〖精神追求〗；体现着评判〖是非曲直的价值标准〗", "m": "「價值追求・精神追求・價值標準」。", "pt": "A", "ps": 20, "pr": ["老師：…個層面 作爲選擇題 你要記住……回答的是……建設什麼…（35-004）", "同頁有考點提示：…的內容 國家層面的內容選擇題要注意哈 那麼選擇題它可…（35-004）", "投影片黃字／黃筆標記（35-004）"]}, {"id": "C35-03", "l": 35, "ch": 10, "s": [5, 7], "src": "", "tag": ["簡答題考點"], "t": "核心價值觀建設的要求（只記標題）", "p": "講師：內文不需要背，只記兩個標題。重點人群：黨員幹部、公眾人物和先進模範、青年。", "o": "（1）让社会主义核心价值观成为〖广泛的社会共识〗；（2）注重〖区分层次、突出重点〗，抓好〖重点人群〗", "m": "「共識・分層抓重點」。", "items": ["让社会主义核心价值观成为广泛的社会共识", "注重区分层次、突出重点，抓好重点人群"], "pt": "B", "ps": 13, "pr": ["老師：…去對它進行背誦 你主要要把這個（標題）過去 要把它記…（35-005）", "老師：…心價值觀的建設 要注重區分層次突出重點 抓好重點的人…（35-007）", "投影片黃字／黃筆標記（35-005）"]}, {"id": "C35-04", "l": 35, "ch": 10, "s": [9], "src": "", "tag": ["必背", "簡答題考點"], "t": "偉大建黨精神（32字）", "p": "1921年建黨時形成的精神，四組八字：堅持真理、堅守理想；踐行初心、擔當使命；不怕犧牲、英勇鬥爭；對黨忠誠、不負人民。", "o": "〖坚持真理〗、〖坚守理想〗，〖践行初心〗、〖担当使命〗，〖不怕牺牲〗、〖英勇斗争〗，〖对党忠诚〗、〖不负人民〗", "m": "「真理想・初使命・犧鬥爭・忠人民」：先信（真理理想）→再做（初心使命）→不怕（犧牲鬥爭）→忠誠（黨和人民）。", "items": ["坚持真理、坚守理想", "践行初心、担当使命", "不怕牺牲、英勇斗争", "对党忠诚、不负人民"], "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（35-009）"]}, {"id": "C35-05", "l": 35, "ch": 10, "s": [10, 11], "src": "", "tag": ["必背", "簡答題考點", "多選題考點"], "t": "中國共產黨人的精神譜系（四個時期）", "p": "講師：不一定要一字不差，但至少要知道包含哪些時期、各時期的重要精神。①新民主主義革命時期：井岡山、蘇區、長征、遵義會議、延安、抗戰、紅巖、西柏坡精神；②社會主義革命和建設時期：抗美援朝、「兩彈一星」、雷鋒、焦裕祿、大慶精神（鐵人精神）、紅旗渠精神；③改革開放和社會主義現代化建設新時期：改革開放、特區、抗洪、抗擊非典、抗震救災、載人航天精神；④中國特色社會主義新時代：脫貧攻堅、抗疫、探月、新時代北斗精神。", "o": "〖新民主主义革命时期〗；〖社会主义革命和建设时期〗；〖改革开放和社会主义现代化建设新时期〗；〖中国特色社会主义新时代〗", "m": "四個時期＝革命→建設→改革→新時代；按事件時間排精神。", "items": ["新民主主义革命时期", "社会主义革命和建设时期", "改革开放和社会主义现代化建设新时期", "中国特色社会主义新时代"], "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（35-011）"]}, {"id": "C35-06", "l": 35, "ch": 10, "s": [12, 13], "src": "", "tag": ["簡答題考點"], "t": "提高全社會文明程度（只記標題）", "p": "講師：「只記標題。」三項：共產主義遠大理想和中特共同理想教育；實施公民道德建設工程；培育時代新風新貌（小標印「样貌」，內文印「新貌」）。", "o": "〖共产主义远大理想和中国特色社会主义共同理想教育〗；实施〖公民道德建设〗工程；培育〖时代新风新貌〗", "m": "「理想・道德・新風」。", "items": ["共产主义远大理想和中国特色社会主义共同理想教育", "实施公民道德建设工程", "培育时代新风新貌"], "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（35-013）"]}, {"id": "C36-01", "l": 36, "ch": 10, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "中華優秀傳統文化＝中華民族的根和魂", "p": "講師：一定要突出「優秀」兩字。中華優秀傳統文化是中華文明的智慧結晶和精華所在，是中華民族的根和魂。", "o": "中华〖优秀〗传统文化是中华文明的〖智慧结晶和精华所在〗，是中华民族的〖根和魂〗", "m": "「根和魂＝優秀傳統文化」；對比「旗幟和靈魂＝馬克思主義」（第34堂）。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-003）"]}, {"id": "C36-02", "l": 36, "ch": 10, "s": [3], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "中華文明的五個突出特性", "p": "連續性（一直沒斷）、創新性（不斷出新）、統一性（追求統一）、包容性（能吸收各種文化）、和平性（愛好和平）。", "o": "中华文明的〖连续性〗、〖创新性〗、〖统一性〗、〖包容性〗、〖和平性〗", "m": "「連・創・統・包・和」——「連創統包和」。", "items": ["连续性", "创新性", "统一性", "包容性", "和平性"], "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（36-003）"]}, {"id": "C36-03", "l": 36, "ch": 10, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "創造性轉化、創新性發展", "p": "對傳統文化不是原封不動，而是改造（轉化）並發展；堅持古為今用、推陳出新。中國共產黨既是中國先進文化的積極引領者和踐行者，又是中華優秀傳統文化的忠實傳承者和弘揚者。", "o": "推动中华优秀传统文化〖创造性转化〗、〖创新性发展〗；坚持〖古为今用〗、〖推陈出新〗", "m": "「創造轉化・創新發展」兩個「創」；「古今・陳新」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-004）"]}, {"id": "C36-04", "l": 36, "ch": 10, "s": [6], "src": "", "tag": ["必背", "簡答題考點", "易混"], "t": "文藝的崇高使命 vs 神聖職責", "p": "崇高使命＝舉精神旗幟、立精神支柱、建精神家園（三個「精神」）；神聖職責＝弘揚中國精神、傳播中國價值、凝聚中國力量（三個「中國」）。", "o": "举〖精神旗帜〗、立〖精神支柱〗、建〖精神家园〗是当代中国文艺的〖崇高使命〗；弘扬〖中国精神〗、传播〖中国价值〗、凝聚〖中国力量〗是文艺工作者的〖神圣职责〗", "m": "「使命＝三精神（旗柱園）；職責＝三中國（精神價值力量）」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"id": "C36-05", "l": 36, "ch": 10, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "社會效益放在首位", "p": "發展文化產業，要堅持把社會效益放在首位（先看對社會好不好，再看賺不賺錢），社會效益和經濟效益相統一。", "o": "坚持把〖社会效益〗放在〖首位〗，社会效益和经济效益相统一", "m": "「社會第一，經濟第二，兩者統一」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"id": "C36-06", "l": 36, "ch": 10, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "文化軟實力集中體現為凝聚力和生命力", "p": "講師：「把這兩個記住。」文化軟實力集中體現一個國家基於文化而具有的凝聚力和生命力，以及由此產生的吸引力和影響力。講好中國故事、傳播好中國聲音。", "o": "文化软实力集中体现一个国家基于文化而具有的〖凝聚力和生命力〗，以及由此产生的〖吸引力和影响力〗；〖讲好中国故事〗、传播好中国声音", "m": "「內在：凝聚＋生命；外在：吸引＋影響」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-007）"]}, {"id": "C37-01", "l": 37, "ch": 11, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "增進民生福祉＝立黨為公、執政為民的本質要求", "p": "講師：「這一句話就作為一個選擇題」「來把這個給老師記住了。」白話：黨為人民辦事，最根本就是讓老百姓生活更好；增進民生福祉是「立黨為公、執政為民」的本質要求。中國共產黨是人民的黨，任何時候都把群眾利益放在第一位。", "o": "增进民生福祉是坚持〖立党为公〗、〖执政为民〗的〖本质要求〗", "m": "「民生福祉＝本質要求（立黨為公・執政為民）」。", "pt": "A", "ps": 34, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"id": "C37-02", "l": 37, "ch": 11, "s": [5, 6, 7], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "民生是人民幸福之基：增進民生福祉的三個定位", "p": "知識點1 三句要分清：（1）本質要求——對黨來說（立黨為公、執政為民）；（2）根本目的——對社會主義生產來說（社會主義生產為了人民）；（3）應有之義——對全面建設社會主義現代化國家來說。例如問「社會主義生產的根本目的」就選增進民生福祉。", "o": "增进民生福祉是坚持立党为公、执政为民的〖本质要求〗；增进民生福祉是社会主义生产的〖根本目的〗；增进民生福祉是全面建设社会主义现代化国家的〖应有之义〗", "m": "「黨→本質要求；生產→根本目的；現代化→應有之義」。", "pt": "A", "ps": 28, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"id": "C37-03", "l": 37, "ch": 11, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "社會主義與資本主義的根本區別之一", "p": "講師：抽象概念「不會考」，只需知道一句。白話：資本主義社會裏，生產表面上是人的目的，但人並不是生產的目的；社會主義關注人本身的發展，這是兩者的根本區別之一。", "o": "关注〖人本身的发展〗，是社会主义和资本主义的〖根本区别之一〗", "m": "「看重人本身＝社資根本區別」。", "pt": "C", "ps": -11, "pr": ["老師：他比較抽象的一些概念不重要 他也不會考這些概念 我…（37-006）", "老師：不會考（37-006）"]}, {"id": "C37-04", "l": 37, "ch": 11, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "讓人民生活幸福是「國之大者」", "p": "講師：「注意一下」。全面建設社會主義現代化國家，出發點和落腳點是讓人民生活越過越好。以人民為中心是黨的根本執政理念；讓人民生活幸福是「國之大者」（國家最大的事）。", "o": "以人民为中心是我们党的〖根本执政理念〗，让人民生活幸福是〖“国之大者”〗", "m": "「以人民為中心＝根本執政理念；人民幸福＝國之大者」。", "pt": "B", "ps": 5, "pr": ["老師：注意一下（37-008）", "投影片黃字／黃筆標記（37-008）"]}, {"id": "C37-05", "l": 37, "ch": 11, "s": [10], "src": "", "tag": ["必背", "選擇題考點"], "t": "脫貧攻堅＝底線任務＋第一民生工程", "p": "講師：「消除絕對貧困，把這一個給老師記一下，叫做絕對」「這個給老師背過。」白話：消除的是「絕對」貧困（吃不飽穿不暖），不是相對貧困；它是全面建成小康社會的底線任務，也是第一民生工程。", "o": "打赢脱贫攻坚战，消除〖绝对贫困〗是全面建成小康社会的〖底线任务〗，是必须抓紧抓好的〖第一民生工程〗", "m": "「絕對貧困・底線任務・第一民生工程」——第一民生工程＝脫貧；最大民生工程＝就業（易混）。", "pt": "A", "ps": 37, "pr": ["老師：…一名聲工程 這個給老師背過啊 那麼（37-010）", "老師：900多個啊 你只需要記住 我們貧困線（37-010）", "老師：具體的數字 它可能考選擇題 那你就（37-010）"]}, {"id": "C37-06", "l": 37, "ch": 11, "s": [10], "src": "", "tag": ["選擇題考點"], "t": "脫貧攻堅成果數字", "p": "講師：具體縣數「不需要去記」，但「注意這個數字，是1億」。黨的十八大以來，全國832個貧困縣全部摘帽，12.8萬個貧困村全部出列，近1億農村貧困人口實現脫貧，歷史性地解決了絕對貧困問題。脫貧摘帽不是終點，而是新生活、新奮鬥的起點。", "o": "现行标准下近〖1亿〗农村贫困人口实现脱贫，历史性地解决了〖绝对贫困〗问题。脱贫摘帽不是〖终点〗，而是新生活、新奋斗的〖起点〗", "m": "「近1億・絕對貧困・不是終點是起點」。", "pt": "A", "ps": 26, "pr": ["老師：…一名聲工程 這個給老師背過啊 那麼（37-010）", "老師：900多個啊 你只需要記住 我們貧困線（37-010）", "老師：具體的數字 它可能考選擇題 那你就（37-010）"]}, {"id": "C37-07", "l": 37, "ch": 11, "s": [11], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "就業是最大的民生工程", "p": "講師：「這個是一個非常容易考到的選擇題考點，就業是最大的民生。」白話：有工作才有收入，所以把就業放在民生第一大事。注意：脫貧攻堅是「第一民生工程」，就業是「最大的民生工程」。", "o": "把〖就业〗作为〖最大的民生工程〗，推动实现更加充分更高质量就业", "m": "「最大＝就業；第一＝脫貧」。", "pt": "A", "ps": 26, "pr": ["老師：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）"]}, {"id": "C37-08", "l": 37, "ch": 11, "s": [11], "src": "", "tag": ["必背", "多選題考點"], "t": "民生重點領域（六個）", "p": "講師：「哪些是重點領域呢？收入分配、就業、教育、社會保障，以及醫療衛生、住房保障。」黨在這些方面推出一系列重大舉措，推動人民生活全方位改善。", "o": "聚焦民生重点领域，在〖收入分配〗、〖就业〗、〖教育〗、〖社会保障〗、〖医疗卫生〗、〖住房保障〗等方面推出一系列重大举措", "m": "「收・就・教・保・醫・住」——「收就教保醫住」。", "items": ["收入分配", "就业", "教育", "社会保障", "医疗卫生", "住房保障"], "pt": "A", "ps": 18, "pr": ["老師：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）", "老師：哪些是重點領域呢？收入分配、就業、教育、社會保障，以…（37-011）"]}, {"id": "C37-09", "l": 37, "ch": 11, "s": [11, 12], "src": "", "tag": ["選擇題考點"], "t": "收入分配、教育、住房的具體提法", "p": "收入分配：推動形成「橄欖型」分配格局（中間大、兩頭小）；教育：以教育之力厚植人民幸福之本，建成世界上規模最大的教育體系；住房：房子是用來住的、不是用來炒的，加快建立多主體供給、多渠道保障、租購並舉的住房制度。", "o": "推动形成〖橄榄型〗分配格局；以〖教育〗之力厚植人民幸福之本；坚持房子是〖用来住的〗、不是〖用来炒的〗定位，加快建立〖多主体供给〗、〖多渠道保障〗、〖租购并举〗的住房制度", "m": "「橄欖型分配；教育厚植幸福之本；住不是炒＋多主體・多渠道・租購並舉」。", "pt": "B", "ps": 6, "pr": ["同頁有考點提示：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）"]}, {"id": "C37-10", "l": 37, "ch": 11, "s": [13], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "發展是「總鑰匙」，民生是「指南針」", "p": "講師：「發展才是解決民生的總鑰匙，我們必須要把自己發展好。」白話：要改善民生先要發展（總鑰匙）；發展的方向要看民生（指南針）。不要對調。", "o": "发展是解决民生问题的〖“总钥匙”〗，民生是发展的〖“指南针”〗", "m": "「發展開鎖（鑰匙），民生指路（指南針）」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（37-013）"]}, {"id": "C37-11", "l": 37, "ch": 11, "s": [13, 14, 15, 16], "src": "", "tag": ["必背", "簡答題考點", "易混"], "t": "在發展中增進民生福祉：前提・思路・重中之重・方針・原則", "p": "知識點3 五句各有一個「定位詞」：正確把握民生和發展的關係＝重要前提；堅守底線、突出重點、完善制度、引導預期＝工作思路；解決人民群眾最關心最直接最現實的利益問題＝重中之重；堅持盡力而為、量力而行＝重要方針；堅持人人盡責、人人享有＝重要原則。", "o": "正确把握民生和发展的关系，是保障和改善民生的〖重要前提〗；坚守底线、突出重点、完善制度、引导预期，是保障和改善民生的〖工作思路〗；解决人民群众最关心最直接最现实的利益问题，是保障和改善民生的〖重中之重〗；坚持尽力而为、量力而行，是保障和改善民生的〖重要方针〗；坚持人人尽责、人人享有，……是保障和改善民生的〖重要原则〗", "m": "「前提（關係）→思路（四詞）→重中之重（利益問題）→方針（盡力量力）→原則（盡責享有）」。", "items": ["正确把握民生和发展的关系（重要前提）", "坚守底线、突出重点、完善制度、引导预期（工作思路）", "解决人民群众最关心最直接最现实的利益问题（重中之重）", "坚持尽力而为、量力而行（重要方针）", "坚持人人尽责、人人享有（重要原则）"], "pt": "A", "ps": 19, "pr": ["老師：是保障和改善 民生的重中之重 要及時的去了解（37-015）", "投影片黃字／黃筆標記（37-015）"]}, {"id": "C37-12", "l": 37, "ch": 11, "s": [14], "src": "", "tag": ["必背", "簡答題考點"], "t": "保障和改善民生的工作思路（四詞）", "p": "坚守底线＝織牢民生安全網的「網底」，對困難群眾應保盡保；突出重点＝向重點群體和重點地區傾斜（革命老區、民族地區、邊疆地區、相對貧困地區），講師舉例西藏學生到內地讀書基本不用學費；完善制度＝使制度更加公平、普惠和可持續；引导预期＝民生保障水平要與經濟社會發展水平相適應。", "o": "〖坚守底线〗、〖突出重点〗、〖完善制度〗、〖引导预期〗，是保障和改善民生的工作思路", "m": "「底・重・制・期」——守底線、抓重點、建制度、管預期。", "items": ["坚守底线", "突出重点", "完善制度", "引导预期"], "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（37-014）"]}, {"id": "C38-01", "l": 38, "ch": 11, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "收入分配是民生之源", "p": "講師：「最直接、最重要的方式，選擇題。」白話：老百姓靠收入過日子，所以收入分配是民生的源頭，是改善民生、實現發展成果由人民共享最重要最直接的方式。", "o": "收入分配是〖民生之源〗，是改善民生、实现发展成果由人民共享〖最重要最直接的方式〗", "m": "「收入＝民生之源＝最重要最直接」。", "pt": "A", "ps": 22, "pr": ["老師：…最直接的 最重要的方式選擇題 偶爾問你說（38-003）", "投影片黃字／黃筆標記（38-003）"]}, {"id": "C38-02", "l": 38, "ch": 11, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "分配制度是促進共同富裕的基礎性制度", "p": "講師兩次說「選擇」：分配製度是促進共同富裕的基礎性制度。白話：要人人一齊富起來，基礎在分配怎麼分。", "o": "分配制度是促进〖共同富裕〗的〖基础性制度〗", "m": "「分配→共同富裕→基礎性」。", "pt": "A", "ps": 15, "pr": ["老師：…最直接的 最重要的方式選擇題 偶爾問你說（38-003）", "老師：選擇（38-003）", "投影片黃字／黃筆標記（38-003）"]}, {"id": "C38-03", "l": 38, "ch": 11, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "三次分配協調配套", "p": "白話：第一次分配是市場上按勞動、資本等給報酬（初次分配）；第二次是政府透過稅收、社保調節（再分配）；第三次是慈善捐贈等（第三次分配）。要構建三者協調配套的制度體系，發揮初次分配的基礎性作用，提高勞動報酬在初次分配中的比重，不斷壯大中等收入群體。", "o": "构建〖初次分配〗、〖再分配〗、〖第三次分配〗协调配套的制度体系。发挥初次分配的〖基础性作用〗，努力提高〖劳动报酬〗在初次分配中的比重", "m": "「初・再・三」；初次分配＝基礎性作用。", "items": ["初次分配", "再分配", "第三次分配"], "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（38-004）"]}, {"id": "C38-04", "l": 38, "ch": 11, "s": [5], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "就業是最基本的民生", "p": "講師：「最大的民生，這是選擇題考點；就業是最基本的民生。」就業是勞動者賴以生存和發展的基礎、共享經濟發展成果的基本條件。習近平指出：「就業是最大的民生工程、民心工程、根基工程。」", "o": "就业是〖最基本的民生〗；“就业是〖最大的民生工程〗、〖民心工程〗、〖根基工程〗，必须抓紧抓实抓好。”", "m": "「就業＝最基本的民生＋三工程（最大民生・民心・根基）」。對比：收入分配＝民生之源。", "pt": "A", "ps": 27, "pr": ["老師：…最大的民生 這是選擇提考點 就業是最基本的民生（38-005）", "投影片黃字／黃筆標記（38-005）"]}, {"id": "C38-05", "l": 38, "ch": 11, "s": [5, 6], "src": "", "tag": ["選擇題考點"], "t": "實施就業優先戰略", "p": "把就業擺在經濟社會發展優先位置；把穩就業提高到戰略高度通盤考慮；強化就業優先政策，促進高質量充分就業。講師舉例：重點群體包括高校畢業生、農民工等，應屆生有很多政策幫扶。", "o": "实施〖就业优先战略〗，把就业摆在经济社会发展〖优先位置〗；把〖稳就业〗提高到战略高度通盘考虑", "m": "「就業優先：優先位置・穩就業上升為戰略」。", "pt": "B", "ps": 7, "pr": ["同頁有考點提示：…最大的民生 這是選擇提考點 就業是最基本的民生（38-005）", "投影片黃字／黃筆標記（38-005）"]}, {"id": "C38-06", "l": 38, "ch": 11, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "就業的重點群體與兜底", "p": "擴大高校畢業生就業渠道，穩定農民工等重點群體就業，加強困難群體就業兜底幫扶；消除影響平等就業的不合理限制和就業歧視，使人人都有通過勤奮勞動實現自身發展的機會。", "o": "扩大〖高校毕业生〗就业渠道，稳定〖农民工〗等重点群体就业，加强〖困难群体〗就业兜底帮扶", "m": "「畢業生（擴渠道）・農民工（穩）・困難群體（兜底）」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（38-006）"]}, {"id": "C38-07", "l": 38, "ch": 11, "s": [7], "src": "", "tag": ["選擇題考點"], "t": "職業技能培訓與新就業形態", "p": "健全終身職業技能培訓制度，推動解決結構性就業矛盾（講師：缺哪些證，就去考證）；完善促進創業帶動就業的保障制度，支持和規範發展新就業形態；加強靈活就業和新就業形態勞動者權益保障。", "o": "健全〖终身职业技能培训制度〗，推动解决〖结构性就业矛盾〗。完善促进〖创业带动就业〗的保障制度，支持和规范发展〖新就业形态〗", "m": "「培訓解結構性矛盾；創業帶就業；規範新就業形態」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（38-007）"]}, {"id": "C38-08", "l": 38, "ch": 11, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "社會保障是保障和改善民生的基本制度保障", "p": "社會保障主要涉及社會保險、社會救助、社會福利、社會優撫等方面（定義本身講師說「不需要你去記」）。", "o": "社会保障是保障和改善民生的〖基本制度保障〗，主要涉及〖社会保险〗、〖社会救助〗、〖社会福利〗、〖社会优抚〗等方面", "m": "「社保四項：保險・救助・福利・優撫」。", "pt": "C", "ps": -11, "pr": ["老師：措施的統成 這不需要你去記 你去記（38-008）"]}, {"id": "C38-09", "l": 38, "ch": 11, "s": [9], "src": "", "tag": ["必背", "選擇題考點"], "t": "社會保障體系是新時代加強社會建設的重要着力點", "p": "講師：「是新時代加強社會建設的重要着力點，選擇。」以增強公平性、適應流動性、保證可持續性為重點；要完善覆蓋全民、統籌城鄉、公平統一、安全規範、可持續的多層次社會保障體系。", "o": "健全和完善社会保障体系是新时代加强社会建设的〖重要着力点〗；坚持以增强〖公平性〗、适应〖流动性〗、保证〖可持续性〗为重点", "m": "「着力點＝社保；三性：公平・流動・可持續」。", "pt": "B", "ps": 5, "pr": ["老師：…社會建設的重要着力點，選擇。（38-009）", "投影片黃字／黃筆標記（38-009）"]}, {"id": "C38-10", "l": 38, "ch": 11, "s": [9], "src": "", "tag": ["選擇題考點", "多選題考點"], "t": "多層次社會保障體系的五個特點", "p": "要全面深化社會保障制度改革，完善覆蓋全民、統籌城鄉、公平統一、安全規範、可持續的多層次社會保障體系；完善基本養老保險全國統籌制度。", "o": "完善〖覆盖全民〗、〖统筹城乡〗、〖公平统一〗、〖安全规范〗、〖可持续〗的多层次社会保障体系", "m": "「全民・城鄉・公平・安全・可持續」。", "items": ["覆盖全民", "统筹城乡", "公平统一", "安全规范", "可持续"], "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（38-009）"]}, {"id": "C38-11", "l": 38, "ch": 11, "s": [11], "src": "", "tag": ["必背", "選擇題考點"], "t": "人民健康是社會主義現代化的重要標誌", "p": "講師：「這裏需要去記一個選擇題考點……這都是選擇題。」人民健康是社會文明進步的基礎，是民族昌盛和國家富強的重要標誌，是促進人的全面發展的必然要求。", "o": "人民健康是社会主义现代化的〖重要标志〗；人民健康是社会文明进步的〖基础〗，是民族昌盛和国家富强的〖重要标志〗，是促进人的全面发展的〖必然要求〗", "m": "「健康：現代化標誌；文明進步基礎；昌盛富強標誌；全面發展必然要求」。", "pt": "A", "ps": 36, "pr": ["老師：…這裏需要去記一個選擇題考點 人民健康是社會主義（38-011）", "老師：…和國家富強的重要標誌 選擇題 這都是選擇題（38-011）", "投影片黃字／黃筆標記（38-011）"]}, {"id": "C38-12", "l": 38, "ch": 11, "s": [12], "src": "", "tag": ["選擇題考點"], "t": "推進健康中國建設", "p": "要把保障人民健康放在優先發展的戰略位置，堅持大衛生大健康理念，努力全方位、全周期保障人民健康；實施積極應對人口老齡化國家戰略；堅持基本醫療衛生事業公益屬性（第(2)點內文講師說「想要了解的話可以去讀一讀」）。", "o": "把保障人民健康放在〖优先发展〗的战略位置，坚持〖大卫生大健康〗理念，努力〖全方位、全周期〗保障人民健康", "m": "「優先發展・大衛生大健康・全方位全周期」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C39-01", "l": 39, "ch": 11, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "加強和創新社會治理的含義", "p": "白話：社會治理由黨領導、政府帶頭、社會各方一起參與，核心是維護人民群眾根本利益，用合作、對話、協商、溝通等方式依法引導和規範社會事務。", "o": "在〖党的领导〗下，以〖政府〗为主导，以〖社会多元主体参与〗为基础，以〖维护人民群众根本利益〗为核心", "m": "「黨領導・政府主導・多元參與為基礎・人民利益為核心」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C39-02", "l": 39, "ch": 11, "s": [4, 5], "src": "", "tag": ["必背", "多選題考點"], "t": "新時代加強和創新社會治理的要求（四個治理）", "p": "白話：系統治理（放進全局和大局考慮）、依法治理（用法治精神、思維、方式）、綜合治理（黨委領導、政府主導、各方協同形成合力）、源頭治理（標本兼治、重在治本，從源頭解決問題）。目標是探索一條中國特色社會主義社會治理之路。", "o": "坚持〖系统治理〗、〖依法治理〗、〖综合治理〗、〖源头治理〗，探索一条符合中国社会发展实际、更可持续的中国特色社会主义社会治理之路", "m": "「系・法・綜・源」——「系法綜源」。", "items": ["系统治理", "依法治理", "综合治理", "源头治理"], "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（39-004）"]}, {"id": "C39-03", "l": 39, "ch": 11, "s": [6], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "社會治理體系（十九屆四中全會，七方面）", "p": "社會治理體系是進行社會治理的基礎，也是提高社會治理效能的保障。黨的十九屆四中全會提出要完善：黨委領導、政府負責、民主協商、社會協同、公眾參與、法治保障、科技支撐的社會治理體系。", "o": "完善〖党委领导〗、〖政府负责〗、〖民主协商〗、〖社会协同〗、〖公众参与〗、〖法治保障〗、〖科技支撑〗的社会治理体系", "m": "「黨委領導・政府負責・民主協商・社會協同・公眾參與・法治保障・科技支撐」——「領・責・商・協・參・法・科」。", "items": ["党委领导", "政府负责", "民主协商", "社会协同", "公众参与", "法治保障", "科技支撑"], "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（39-006）"]}, {"id": "C39-04", "l": 39, "ch": 11, "s": [6, 7, 9, 10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "完善社會治理體系：基礎・先導・保障・重要內容", "p": "四個小標題各有定位：社會治理體系是進行社會治理的基礎；理念是完善社會治理體系的先導（共建共治共享）；制度是完善社會治理體系的保障；方式方法是完善社會治理體系的重要內容。", "o": "社会治理体系是进行社会治理的〖基础〗；〖理念〗是完善社会治理体系的先导；〖制度〗是完善社会治理体系的保障；〖方式方法〗是完善社会治理体系的重要内容", "m": "「理念先導、制度保障、方法內容」。", "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（39-006）"]}, {"id": "C39-05", "l": 39, "ch": 11, "s": [7, 8], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "共建・共治・共享：基礎・關鍵・目標", "p": "必須堅持共建共治共享的社會治理理念。共建＝共同參與社會建設，是社會治理的基礎；共治＝共同參與社會治理（樹立大社會觀、大治理觀），是社會治理的關鍵；共享＝共同享有社會治理成果，是社會治理的目標。", "o": "共建是共同参与社会建设，是社会治理的〖基础〗；共治是共同参与社会治理，是社会治理的〖关键〗；共享是共同享有社会治理成果，是社会治理的〖目标〗", "m": "「建＝基礎，治＝關鍵，享＝目標」（建房先打地基，治理抓關鍵，成果是目標）。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（39-007）"]}, {"id": "C39-06", "l": 39, "ch": 11, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "社會治理共同體", "p": "建設人人有責、人人盡責、人人享有的社會治理共同體，確保社會治理過程人民參與、成效人民評判、成果人民共享。", "o": "建设〖人人有责〗、〖人人尽责〗、〖人人享有〗的社会治理共同体，确保社会治理过程〖人民参与〗、成效〖人民评判〗、成果〖人民共享〗", "m": "「有責・盡責・享有；參與・評判・共享」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（39-008）"]}, {"id": "C39-07", "l": 39, "ch": 11, "s": [10], "src": "", "tag": ["選擇題考點"], "t": "創新社會治理方式：兩對關係", "p": "要講究辯證法，正確處理好維穩與維權、活力與秩序的關係，確保社會既充滿生機活力又保持安定有序；強化互聯網思維。", "o": "正确处理好〖维稳与维权〗、〖活力与秩序〗的关系，确保社会既充满生机活力又保持安定有序", "m": "「維穩↔維權；活力↔秩序」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C39-08", "l": 39, "ch": 11, "s": [11], "src": "", "tag": ["必背", "選擇題考點"], "t": "基層治理是國家治理的基石", "p": "講師：「注意啊，基層治理是國家治理的基石」「最後一公里，選擇題」「這些都是選擇題考點」。基層強則國家強，基層安則天下安；城鄉社區是社會治理最基本的單元，是黨和政府聯繫、服務居民群眾的「最後一公里」；社會治理的重心必須向基層下移。", "o": "〖基层治理〗是国家治理的〖基石〗；城乡社区是社会治理〖最基本的单元〗，是党和政府联系、服务居民群众的〖“最后一公里”〗", "m": "「基層＝基石；社區＝最基本單元＝最後一公里」。", "pt": "A", "ps": 28, "pr": ["老師：…鄉社區 這些都是選擇題考點 社會治理的重心（39-011）", "老師：最後一公里 選擇題 那麼我們（39-011）", "投影片黃字／黃筆標記（39-011）"]}, {"id": "C39-09", "l": 39, "ch": 11, "s": [12], "src": "", "tag": ["選擇題考點"], "t": "政府治理和社會調節、居民自治良性互動", "p": "講師：「政府治理、社會調節和居民自治的良性互動，記一下。」健全黨組織領導的城鄉基層治理體系；充分發揮基層黨組織領導核心作用、基層政府主導作用、基層群眾性自治組織基礎作用。", "o": "健全党组织领导的城乡基层治理体系，实现〖政府治理〗和〖社会调节〗、〖居民自治〗良性互动", "m": "「政府治理＋社會調節＋居民自治」。", "pt": "B", "ps": 6, "pr": ["老師：…節和居民自治的良性互動記一下 那麼第三（39-012）"]}, {"id": "C39-10", "l": 39, "ch": 11, "s": [13], "src": "", "tag": ["選擇題考點"], "t": "「楓橋經驗」「浦江經驗」與市域社會治理", "p": "堅持和發展新時代「楓橋經驗」「浦江經驗」，完善正確處理新形勢下人民內部矛盾機制。市域是將風險隱患解決在基層、化解在萌芽狀態的最直接、最有效力的治理層級，處於推進基層治理現代化的前線位置。", "o": "坚持和发展新时代〖“枫桥经验”〗、〖“浦江经验”〗；〖市域〗是将风险隐患解决在基层、化解在萌芽状态的最直接、最有效力的治理层级", "m": "「楓橋・浦江＝人民內部矛盾；市域＝前線」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C40-01", "l": 40, "ch": 12, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "自然是生命之母，人與自然是生命共同體", "p": "白話：人來自自然、依賴自然；友好保護自然，自然回報慷慨；粗暴掠奪自然，自然懲罰無情。保護自然就是保護人類，建設生態文明就是造福人類。", "o": "自然是〖生命之母〗，人与自然是〖生命共同体〗；保护自然就是〖保护人类〗，建设生态文明就是〖造福人类〗", "m": "「母・共同體；保護自然＝保護人類」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-006）"]}, {"id": "C40-02", "l": 40, "ch": 12, "s": [7], "src": "", "tag": ["選擇題考點"], "t": "生態興則文明興：生態影響文明興衰", "p": "生態環境變化直接影響文明的興衰演替；生態文明是人類文明發展的歷史趨勢。人類經歷了原始文明、農業文明、工業文明。", "o": "生态环境变化直接影响文明的〖兴衰演替〗；〖生态文明〗是人类文明发展的〖历史趋势〗", "m": "「生態興則文明興；原始→農業→工業→生態」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-007）"]}, {"id": "C40-03", "l": 40, "ch": 12, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "中華文明孕育豐富的生態文化", "p": "中華民族向來尊重自然、熱愛自然，綿延5000多年的中華文明孕育着豐富的生態文化。", "o": "绵延〖5000多年〗的中华文明孕育着丰富的〖生态文化〗", "m": "「5000年・生態文化」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-008）"]}, {"id": "C40-04", "l": 40, "ch": 12, "s": [9], "src": "", "tag": ["必背", "選擇題考點"], "t": "尊重自然、順應自然、保護自然", "p": "講師：「請注意」。大自然是人類賴以生存發展的基本條件，尊重自然、順應自然、保護自然是全面建設社會主義現代化國家的內在要求。要堅定不移走生產發展、生活富裕、生態良好的文明發展道路。", "o": "大自然是人类赖以生存发展的〖基本条件〗，〖尊重自然〗、〖顺应自然〗、〖保护自然〗是全面建设社会主义现代化国家的〖内在要求〗；坚定不移走〖生产发展〗、〖生活富裕〗、〖生态良好〗的文明发展道路", "m": "「尊重・順應・保護＝內在要求」；「生產發展・生活富裕・生態良好」。", "pt": "B", "ps": 5, "pr": ["老師：請注意（40-009）", "投影片黃字／黃筆標記（40-009）"]}, {"id": "C40-05", "l": 40, "ch": 12, "s": [10], "src": "", "tag": ["必背", "選擇題考點"], "t": "綠水青山就是金山銀山", "p": "講師：「這裏需要注意一下，可能考一個選擇題：闡明揭示經濟發展與生態環境保護之間關係的是什麼？就是綠水青山就是金山銀山。」生態環境問題歸根到底是經濟發展方式和生活方式問題。保護生態環境就是保護生產力，改善生態環境就是發展生產力。", "o": "生态环境问题归根到底是〖经济发展方式和生活方式〗问题。绿水青山就是金山银山，阐明了〖经济发展与生态环境保护〗之间的关系，揭示了保护生态环境就是〖保护生产力〗、改善生态环境就是〖发展生产力〗的道理", "m": "「保護＝保護生產力；改善＝發展生產力」。", "pt": "A", "ps": 17, "pr": ["老師：…要注意一下 可能考一個選擇題 問你說什麼（40-010）", "投影片黃字／黃筆標記（40-010）"]}, {"id": "C40-06", "l": 40, "ch": 12, "s": [11], "src": "", "tag": ["必背", "選擇題考點"], "t": "生態保護和經濟發展是辯證統一、相輔相成的關係", "p": "發展經濟不能對資源和生態環境竭澤而漁，生態保護也不是捨棄經濟發展而緣木求魚，要堅持在發展中保護、在保護中發展；不能把兩者割裂開來，更不能對立起來。", "o": "二者是〖辩证统一〗、〖相辅相成〗的关系……坚持〖在发展中保护〗、〖在保护中发展〗", "m": "「不竭澤而漁，也不緣木求魚」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-011）"]}, {"id": "C40-07", "l": 40, "ch": 12, "s": [12, 13], "src": "", "tag": ["選擇題考點"], "t": "綠水青山既是自然財富、生態財富，又是社會財富、經濟財富", "p": "綠水青山可帶來金山銀山，但金山銀山卻買不到綠水青山。處理好綠水青山和金山銀山的關係，關鍵在人，關鍵在思路；要處理好高質量發展和高水平保護的關係。", "o": "绿水青山既是〖自然财富〗、〖生态财富〗，又是〖社会财富〗、〖经济财富〗；处理好绿水青山和金山银山的关系，关键在〖人〗，关键在〖思路〗", "m": "「四財富；兩關鍵（人・思路）」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C40-08", "l": 40, "ch": 12, "s": [14], "src": "", "tag": ["選擇題考點"], "t": "生態文明建設是重大經濟問題、政治問題、社會問題", "p": "生態文明建設是重大經濟問題，也是關係黨的使命宗旨的重大政治問題、關係民生福祉的重大社會問題。十八大以來，黨把生態文明建設擺在全局工作的突出位置，從思想、法律、體制、組織、作風上全面發力。", "o": "生态文明建设是重大〖经济问题〗，也是关系党的使命宗旨的重大〖政治问题〗、关系民生福祉的重大〖社会问题〗", "m": "「經・政・社」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-014）"]}, {"id": "C40-09", "l": 40, "ch": 12, "s": [14, 15], "src": "", "tag": ["選擇題考點", "易混"], "t": "生態文明建設的四個「重大轉變」", "p": "①由重點整治到系統治理；②由被動應對到主動作為；③由全球環境治理參與者到引領者；④由實踐探索到科學理論指導（形成習近平生態文明思想）。", "o": "实现由〖重点整治〗到〖系统治理〗的重大转变；由〖被动应对〗到〖主动作为〗的重大转变；由全球环境治理〖参与者〗到〖引领者〗的重大转变；由〖实践探索〗到〖科学理论指导〗的重大转变", "m": "「整治→系統；被動→主動；參與→引領；實踐→理論」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-014）"]}, {"id": "C40-10", "l": 40, "ch": 12, "s": [16], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "生態文明建設戰略地位更加凸顯：「納入」五件事", "p": "講師逐句講：把「生態文明建設」納入「五位一體」總體布局；把「堅持人與自然和諧共生」納入新時代堅持和發展中國特色社會主義的基本方略；把「促進人與自然和諧共生」納入中國式現代化的本質要求；把「美麗中國」納入社會主義現代化強國目標；把「綠色」納入新發展理念；把「污染防治」納入三大攻堅戰。十九大把「增強綠水青山就是金山銀山的意識」寫入黨章；2018年3月憲法修正案把生態文明寫入憲法。", "o": "把“〖坚持人与自然和谐共生〗”纳入新时代坚持和发展中国特色社会主义的基本方略，把“〖促进人与自然和谐共生〗”纳入中国式现代化的本质要求，把“〖美丽中国〗”纳入社会主义现代化强国目标，把“〖绿色〗”纳入新发展理念，把“〖污染防治〗”纳入决胜全面建成小康社会三大攻坚战", "m": "「坚持和谐共生→基本方略；促进和谐共生→本質要求；美麗中國→強國目標；綠色→新發展理念；污染防治→三大攻堅戰」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-016）"]}, {"id": "C40-11", "l": 40, "ch": 12, "s": [17], "src": "", "tag": ["選擇題考點"], "t": "生態文明「四梁八柱」制度體系", "p": "制定出台《中共中央國務院關於加快推進生態文明建設的意見》《生態文明體制改革總體方案》等綱領性文件，生態文明「四梁八柱」性質的制度體系基本形成。", "o": "生态文明〖“四梁八柱”〗性质的制度体系基本形成", "m": "「四梁八柱＝制度體系」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C40-12", "l": 40, "ch": 12, "s": [18], "src": "", "tag": ["必背", "選擇題考點"], "t": "三條紅線、三大保衛戰", "p": "講師：「這裏稍微記一下。」嚴守生態保護紅線、環境質量底線、資源利用上線三條紅線；打好藍天、碧水、淨土保衛戰；我國成為全球大氣環境質量改善速度最快的國家。", "o": "严守〖生态保护红线〗、〖环境质量底线〗、〖资源利用上线〗三条红线；打好〖蓝天〗、〖碧水〗、〖净土〗保卫战", "m": "「紅線（生態保護）・底線（環境質量）・上線（資源利用）」。", "pt": "B", "ps": 6, "pr": ["老師：…資源利用上線 這裏稍微記一下 第一個是環境保護紅線（40-018）"]}, {"id": "C40-13", "l": 40, "ch": 12, "s": [19], "src": "", "tag": ["選擇題考點"], "t": "綠色成為新時代中國的鮮明底色", "p": "我國天更藍、地更綠、水更清，綠色成為新時代中國的鮮明底色；新時代生態文明建設的成就成為黨和國家事業取得歷史性成就、發生歷史性變革的顯著標誌。（講師：這一節要背的東西不多。）", "o": "〖绿色〗成为新时代中国的〖鲜明底色〗", "m": "「綠色＝鮮明底色」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C41-01", "l": 41, "ch": 12, "s": [3, 4, 5, 6, 7], "src": "", "tag": ["必背", "簡答題考點"], "t": "加快形成綠色生產方式和生活方式（五個做法）", "p": "講師：「知識點一，我們只需要去記住標黃色的位置。」五個標題：推動經濟結構調整優化；推進各類資源節約集約利用；積極穩妥推進碳達峰碳中和；健全綠色發展的保障體系；堅持把建設美麗中國轉化為全體人民自覺行動。", "o": "〖推动经济结构调整优化〗；〖推进各类资源节约集约利用〗；〖积极稳妥推进碳达峰碳中和〗；〖健全绿色发展的保障体系〗；坚持把建设美丽中国转化为〖全体人民自觉行动〗", "m": "「結構・節約・雙碳・保障・全民」。", "items": ["推动经济结构调整优化", "推进各类资源节约集约利用", "积极稳妥推进碳达峰碳中和", "健全绿色发展的保障体系", "坚持把建设美丽中国转化为全体人民自觉行动"], "pt": "A", "ps": 25, "pr": ["老師：知識點一，我們只需要去記住標黃色的位置。（41-003）", "投影片黃字／黃筆標記（41-003）"]}, {"id": "C41-02", "l": 41, "ch": 12, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "產業結構調整是關鍵：變「輕」變「綠」", "p": "調整優化經濟結構是從源頭推動發展方式綠色轉型的重要任務，要抓住產業結構調整這個關鍵，促進產業結構變「輕」、發展模式變「綠」。生態環境問題歸根到底是資源過度開發、粗放利用、奢侈消費造成的。", "o": "要抓住〖产业结构调整〗这个关键，促进产业结构变〖“轻”〗、发展模式变〖“绿”〗", "m": "「產業結構變輕，發展模式變綠」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（41-003）"]}, {"id": "C41-03", "l": 41, "ch": 12, "s": [4, 5], "src": "", "tag": ["選擇題考點"], "t": "「雙碳」工作：系統性變革與四對關係", "p": "推進「雙碳」工作是破解資源環境約束突出問題、實現可持續發展的迫切需要，是一場廣泛而深刻的經濟社會系統性變革。要處理好發展和減排、整體和局部、長遠目標和短期目標、政府和市場的關係，既堅定不移，又不急於求成、偏激冒進。目標堅定不移，但路徑和方式、節奏和力度必須由我們自己作主，決不受他人左右。", "o": "推进“双碳”工作……是一场广泛而深刻的〖经济社会系统性变革〗；处理好〖发展和减排〗、〖整体和局部〗、〖长远目标和短期目标〗、〖政府和市场〗的关系", "m": "「雙碳＝系統性變革；四對關係：發展/減排、整體/局部、長遠/短期、政府/市場」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（41-004）"]}, {"id": "C41-04", "l": 41, "ch": 12, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "建設美麗中國＝重要目標＋必然要求", "p": "講師：「同學們請注意了。」建設美麗中國，是全面建設社會主義現代化國家的重要目標，也是滿足人民日益增長的優美生態環境需要的必然要求。", "o": "建设美丽中国，是全面建设社会主义现代化国家的〖重要目标〗，也是满足人民日益增长的优美生态环境需要的〖必然要求〗", "m": "「美麗中國：現代化的重要目標；優美生態需要的必然要求」。", "pt": "A", "ps": 17, "pr": ["老師：…知識點一同學們 我們只需要去記住標黃色的位置 第一（41-008）", "老師：同學們請注意了。（41-008）", "投影片黃字／黃筆標記（41-008）"]}, {"id": "C41-05", "l": 41, "ch": 12, "s": [8], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "綠色發展：發展觀的一場深刻革命", "p": "綠色發展是新發展理念的重要內容，是發展觀的一場深刻革命。習近平指出：「綠色發展，就其要義來講，是要解決好人與自然和諧共生問題。」要堅持把綠色低碳發展作為解決生態環境問題的治本之策。", "o": "绿色发展是新发展理念的重要内容，是〖发展观的一场深刻革命〗。“绿色发展，就其要义来讲，是要解决好〖人与自然和谐共生〗问题。”坚持把绿色低碳发展作为解决生态环境问题的〖治本之策〗", "m": "「綠色＝發展觀革命；要義＝人與自然和諧共生；治本之策」。", "pt": "A", "ps": 14, "pr": ["老師：…知識點一同學們 我們只需要去記住標黃色的位置 第一（41-008）", "投影片黃字／黃筆標記（41-008）"]}, {"id": "C41-06", "l": 41, "ch": 12, "s": [9, 10, 11, 12, 13], "src": "", "tag": ["必背", "簡答題考點"], "t": "山水林田湖草沙一體化保護和系統治理（六個標題）", "p": "講師：「總共就是這六個……六個標題大家記住就可以了。」山水林田湖草沙是一個生命共同體，是不可分割的生態系統；要堅持系統觀念，進行整體保護、系統修復、綜合治理。", "o": "〖山水林田湖草沙是一个生命共同体〗是不可分割的生态系统；加快实施重要〖生态系统保护和修复〗重大工程；推进〖自然保护地体系〗建设；科学推进〖荒漠化、石漠化、水土流失〗综合治理，持续开展大规模国土绿化行动；实施〖生物多样性〗保护重大工程；推行草原森林河流湖泊湿地〖休养生息〗", "m": "「共同體・修復工程・保護地・三化治理・生物多樣性・休養生息」。", "items": ["山水林田湖草沙是一个生命共同体是不可分割的生态系统", "加快实施重要生态系统保护和修复重大工程", "推进自然保护地体系建设", "科学推进荒漠化、石漠化、水土流失综合治理，持续开展大规模国土绿化行动", "实施生物多样性保护重大工程", "推行草原森林河流湖泊湿地休养生息"], "pt": "B", "ps": 10, "pr": ["投影片黃字／黃筆標記（41-009）"]}, {"id": "C41-07", "l": 41, "ch": 12, "s": [10], "src": "", "tag": ["選擇題考點", "易混"], "t": "三條控制線與自然保護地體系", "p": "劃定落實生態保護紅線、永久基本農田、城鎮開發邊界三條控制線（注意：第40堂的「三條紅線」是生態保護紅線、環境質量底線、資源利用上線）。構建以國家公園為主體、自然保護區為基礎、各類自然公園為補充的自然保護地體系。", "o": "划定落实〖生态保护红线〗、〖永久基本农田〗、〖城镇开发边界〗三条控制线；构建以〖国家公园〗为主体、〖自然保护区〗为基础、各类〖自然公园〗为补充的自然保护地体系", "m": "「控制線：紅線・農田・邊界」；「國家公園主體、保護區基礎、自然公園補充」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（41-010）"]}, {"id": "C41-08", "l": 41, "ch": 12, "s": [14], "src": "", "tag": ["必背", "選擇題考點"], "t": "用最嚴格制度最嚴密法治保護生態環境", "p": "保護生態環境必須依靠制度、依靠法治；必須把制度建設作為生態文明建設的重中之重；構建產權清晰、多元參與、激勵約束並重、系統完整的生態文明制度體系。四項：實行最嚴格的生態環境保護制度；全面建立資源高效利用制度；嚴明生態環境保護責任制度；制度的生命力在於執行，關鍵在真抓，靠的是嚴管。", "o": "必须把〖制度建设〗作为生态文明建设的〖重中之重〗；构建〖产权清晰〗、〖多元参与〗、〖激励约束并重〗、〖系统完整〗的生态文明制度体系", "m": "「制度建設＝重中之重；產權清晰・多元參與・激勵約束並重・系統完整」。", "pt": "A", "ps": 14, "pr": ["老師：…作爲生態文明建設中的重中之重 去構建起我們的產權清…（41-014）", "投影片黃字／黃筆標記（41-014）"]}, {"id": "C41-09", "l": 41, "ch": 12, "s": [14], "src": "", "tag": ["必背", "簡答題考點"], "t": "生態文明制度的四個方面", "p": "這四句也是知識點4–7 的標題，要背。", "o": "实行〖最严格的生态环境保护制度〗；全面建立〖资源高效利用制度〗；严明〖生态环境保护责任制度〗；制度的生命力在于〖执行〗，关键在〖真抓〗，靠的是〖严管〗", "m": "「保護制度・利用制度・責任制度・執行（真抓嚴管）」。", "items": ["实行最严格的生态环境保护制度", "全面建立资源高效利用制度", "严明生态环境保护责任制度", "制度的生命力在于执行，关键在真抓，靠的是严管"], "pt": "B", "ps": 5, "pr": ["同頁有考點提示：…作爲生態文明建設中的重中之重 去構建起我們的產權清…（41-014）", "投影片黃字／黃筆標記（41-014）"]}, {"id": "C41-10", "l": 41, "ch": 12, "s": [15, 16], "src": "", "tag": ["必背", "簡答題考點"], "t": "實行最嚴格的生態環境保護制度（七項）", "p": "講師：「要求大家去重點記憶一下這七個內容。」", "o": "健全〖源头预防、过程控制、损害赔偿、责任追究〗的生态环境保护体系；完善〖主体功能区制度〗；推动〖绿色循环低碳发展〗；构建以〖排污许可制〗为核心的固定污染源监管制度体系；健全〖生态保护和修复制度〗；完善生态环境保护〖法律体系和执法司法制度〗；健全党委领导、政府主导、企业主体、社会组织和公众共同参与的〖现代环境治理体系〗", "m": "「源頭過程賠償追究・主體功能區・綠色循環低碳・排污許可・保護修復・法律執法・現代環境治理體系」。", "items": ["健全源头预防、过程控制、损害赔偿、责任追究的生态环境保护体系", "加快建立健全国土空间规划和用途统筹协调管控制度，完善主体功能区制度", "完善绿色生产和消费的法律制度和政策导向，推动绿色循环低碳发展", "构建以排污许可制为核心的固定污染源监管制度体系", "健全生态保护和修复制度", "完善生态环境保护法律体系和执法司法制度", "完善生态文明领域统筹协调机制，健全现代环境治理体系"], "pt": "B", "ps": 8, "pr": ["投影片黃字／黃筆標記（41-015）", "老師：要求大家去重點記憶一下這七個內容。（41-015）"]}, {"id": "C41-11", "l": 41, "ch": 12, "s": [16], "src": "", "tag": ["選擇題考點"], "t": "現代環境治理體系與「四個一體」", "p": "健全黨委領導、政府主導、企業主體、社會組織和公眾共同參與的現代環境治理體系，構建一體謀劃、一體部署、一體推進、一體考核的制度機制。", "o": "健全〖党委领导〗、〖政府主导〗、〖企业主体〗、社会组织和公众共同参与的现代环境治理体系，构建〖一体谋划〗、〖一体部署〗、〖一体推进〗、〖一体考核〗的制度机制", "m": "「黨委領導・政府主導・企業主體・社會公眾參與」；四個「一體」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（41-016）"]}, {"id": "C41-12", "l": 41, "ch": 12, "s": [17], "src": "", "tag": ["選擇題考點"], "t": "全面建立資源高效利用制度", "p": "健全自然資源產權制度，落實資源有償使用制度，實行資源總量管理和全面節約制度；普遍實行垃圾分類和資源化利用制度；推進能源革命，構建清潔低碳、安全高效的能源體系。", "o": "实行资源〖总量管理〗和〖全面节约〗制度；普遍实行〖垃圾分类〗和资源化利用制度；构建〖清洁低碳〗、〖安全高效〗的能源体系", "m": "「總量管理＋全面節約；垃圾分類；清潔低碳安全高效」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（41-017）"]}, {"id": "C41-13", "l": 41, "ch": 12, "s": [18], "src": "", "tag": ["必背", "簡答題考點", "選擇題考點"], "t": "嚴明生態環境保護責任制度", "p": "講師：「實行生態環境損害責任終身追究制……把這個給我重點圈重點」「把這個責任制度給老師背過」，並逐點念：第一考核制度；第二領導幹部自然資源資產離任審計；第三綜合行政執法；第四監測和評價制度；第五河湖長制、林長制。", "o": "建立〖生态文明建设目标评价考核制度〗；开展领导干部自然资源资产〖离任审计〗；推进生态环境保护〖综合行政执法〗，落实中央生态环境保护督察制度；健全生态环境监测和评价制度，实行生态环境损害责任〖终身追究制〗；健全〖河湖长制〗、〖林长制〗等", "m": "「考核・離任審計・綜合執法（督察）・監測評價（終身追究）・河湖長林長」。", "items": ["建立生态文明建设目标评价考核制度", "开展领导干部自然资源资产离任审计", "推进生态环境保护综合行政执法，落实中央生态环境保护督察制度", "健全生态环境监测和评价制度（实行生态环境损害责任终身追究制）", "健全河湖长制、林长制等"], "pt": "A", "ps": 18, "pr": ["老師：…把這個責任制度給老師背過 第一考覈制度（41-018）", "投影片黃字／黃筆標記（41-018）", "老師：…身追究制……把這個給我重點圈重點（41-018）"]}, {"id": "C41-14", "l": 41, "ch": 12, "s": [19], "src": "", "tag": ["必背", "選擇題考點"], "t": "制度的生命力在於執行", "p": "要牢固樹立制度的剛性和權威，對已出台的生態環境保護制度必須認真執行，不得作選擇、搞變通、打折扣；強化生態環境行政執法與刑事司法銜接；抓住破壞生態環境的反面典型，釋放嚴加懲處的強烈信號。", "o": "制度的生命力在于〖执行〗，关键在〖真抓〗，靠的是〖严管〗；不得〖作选择〗、〖搞变通〗、〖打折扣〗", "m": "「執行・真抓・嚴管」；不得「選・變・折」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（41-019）"]}, {"id": "C42-01", "l": 42, "ch": 12, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "生態環境問題是全人類共同面臨的問題", "p": "保持良好生態環境是各國人民的共同心願和共同責任。國際社會應秉持地球生命共同體理念，開展全球行動、全球應對、全球合作；秉持共商共建共享的全球治理觀，實現聯合國2030年可持續發展目標。", "o": "生态环境问题是〖全人类共同面临〗的问题；保持良好生态环境是各国人民的〖共同心愿〗和〖共同责任〗；国际社会应当秉持〖地球生命共同体〗理念", "m": "「全人類共同問題；共同心願＋共同責任；地球生命共同體」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-003）"]}, {"id": "C42-02", "l": 42, "ch": 12, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "五個「追求」", "p": "國際社會要追求人與自然和諧、追求綠色發展繁榮、追求熱愛自然情懷、追求科學治理精神、追求攜手合作應對。", "o": "追求〖人与自然和谐〗、追求〖绿色发展繁荣〗、追求〖热爱自然情怀〗、追求〖科学治理精神〗、追求〖携手合作应对〗", "m": "「和諧・繁榮・情懷・科學・合作」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-003）"]}, {"id": "C42-03", "l": 42, "ch": 12, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "中國是全球生態文明建設的重要參與者、貢獻者、引領者", "p": "講師：「那注意了。」建設綠色家園是人類的共同夢想，也是各國人民的共同期盼。中國致力於推動共建地球生命共同體，積極參與全球環境治理，是全球生態文明建設的重要參與者、貢獻者、引領者。順應自然、保護自然、綠色發展，人類才有美好的未來。", "o": "中国致力于推动共建〖地球生命共同体〗，积极参与全球环境治理，是全球生态文明建设的重要〖参与者〗、〖贡献者〗、〖引领者〗", "m": "「參與・貢獻・引領」。", "pt": "B", "ps": 5, "pr": ["老師：那注意了。（42-004）", "投影片黃字／黃筆標記（42-004）"]}, {"id": "C42-04", "l": 42, "ch": 12, "s": [5, 6, 7], "src": "", "tag": ["必背", "簡答題考點"], "t": "共建清潔美麗世界（四個堅持）", "p": "建設人與自然和諧共生的地球家園，以綠色轉型為驅動，堅持多邊主義，推動全球環境治理體系更加公平合理。四個標題：堅持以人為本；堅持科學治理；堅持多邊主義（打造多元共治的全球生態治理體系，不「甩鍋推責」）；堅持共同但有區別的責任原則。", "o": "坚持〖以人为本〗；坚持〖科学治理〗；坚持〖多边主义〗；坚持〖共同但有区别的责任原则〗", "m": "「人本・科學・多邊・共同但有區別」。", "items": ["坚持以人为本", "坚持科学治理", "坚持多边主义", "坚持共同但有区别的责任原则"], "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（42-005）"]}, {"id": "C42-05", "l": 42, "ch": 12, "s": [7], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "共同但有區別的責任原則", "p": "講師：「雖然要共同擔責，但是又有區別……發展中國家只是生存型排放，發達國家早已是奢侈型或浪費型排放，所以責任是有區別的。」發達國家和發展中國家處於不同發展階段，在環境問題上的歷史責任和現實能力存在差異。", "o": "坚持〖共同但有区别〗的责任原则；发展中国家大多只是〖“生存型”〗排放，而发达国家早已是〖“奢侈型”〗或〖“浪费型”〗排放", "m": "「發展中＝生存型；發達＝奢侈型/浪費型」。", "pt": "B", "ps": 5, "pr": ["老師：…然要共同擔責，但是又有區別……發展中國家只是生存型排…（42-007）", "投影片黃字／黃筆標記（42-007）"]}, {"id": "C42-06", "l": 42, "ch": 12, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "積極推動全球可持續發展：中國的大國擔當", "p": "中國作為世界上最大的發展中國家，深度參與全球氣候治理，同世界各國共同推進全球生物多樣性治理，積極共建綠色「一帶一路」，承擔大國責任，展現大國擔當。", "o": "深度参与〖全球气候治理〗，同世界各国共同推进〖全球生物多样性治理〗，积极共建〖绿色“一带一路”〗", "m": "「氣候・生物多樣性・綠色一帶一路」三件事。", "items": ["积极参与全球气候治理", "积极推进全球生物多样性治理", "积极打造绿色“一带一路”"], "pt": "C", "ps": 0, "pr": []}, {"id": "C42-07", "l": 42, "ch": 12, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "氣候治理：中國的成績", "p": "氣候變化問題是全球生態環境治理領域的突出問題。中國提前完成2020年應對氣候變化和設立自然保護區相關目標，人工林面積居全球第一，是對全球臭氧層保護貢獻最大的國家；努力推動構建公平合理、合作共贏的全球氣候治理體系。", "o": "中国提前完成〖2020年〗应对气候变化和设立自然保护区相关目标，〖人工林面积〗居全球第一，是对全球〖臭氧层保护〗贡献最大的国家", "m": "「人工林第一；臭氧層貢獻最大」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-009）"]}, {"id": "C42-08", "l": 42, "ch": 12, "s": [10], "src": "", "tag": ["必背", "選擇題考點"], "t": "碳達峰、碳中和時間表與2030年目標", "p": "力爭2030年前實現碳達峰，努力爭取2060年前實現碳中和。到2030年，單位國內生產總值二氧化碳排放將比2005年下降65%以上，非化石能源占一次能源消費比重將達到25%左右。", "o": "力争〖2030年〗前实现碳达峰，努力争取〖2060年〗前实现碳中和；到2030年，单位国内生产总值二氧化碳排放将比2005年下降〖65%〗以上，非化石能源占一次能源消费比重将达到〖25%〗左右", "m": "「30達峰、60中和；降65%、非化石25%」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-010）"]}, {"id": "C42-09", "l": 42, "ch": 12, "s": [11], "src": "", "tag": ["選擇題考點"], "t": "生物多樣性治理：COP15 與「昆明－蒙特利爾框架」", "p": "中國成功承辦聯合國《生物多樣性公約》第十五次締約方大會，推動達成「昆明－蒙特利爾全球生物多樣性框架」等里程碑成果；積極落實聯合國生態系統恢復十年行動計劃。", "o": "中国成功承办联合国《生物多样性公约》〖第十五次〗缔约方大会，推动国际社会达成〖“昆明—蒙特利尔全球生物多样性框架”〗", "m": "「COP15→昆明－蒙特利爾」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-011）"]}, {"id": "C42-10", "l": 42, "ch": 12, "s": [12], "src": "", "tag": ["選擇題考點"], "t": "綠色「一帶一路」", "p": "「一帶一路」是一條綠色發展之路。完善「一帶一路」綠色發展國際聯盟；實施「一帶一路」應對氣候變化南南合作計劃；繼續實施綠色絲路使者計劃；讓綠色切實成為共建「一帶一路」的底色。", "o": "“一带一路”是一条〖绿色发展之路〗；实施“一带一路”应对气候变化〖南南合作〗计划；继续实施〖绿色丝路使者〗计划；让〖绿色〗切实成为共建“一带一路”的底色", "m": "「綠色之路・南南合作・絲路使者・綠色底色」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（42-012）"]}, {"id": "C43-01", "l": 43, "ch": 13, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "國家安全的含義", "p": "白話：國家安全指國家政權、主權、統一和領土完整、人民福祉、經濟社會可持續發展和國家其他重大利益「相對處於沒有危險和不受內外威脅的狀態」，以及「保障持續安全狀態的能力」——既是狀態，也是能力。「利莫大於治，害莫大於亂。」", "o": "国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于〖没有危险和不受内外威胁的状态〗，以及〖保障持续安全状态的能力〗", "m": "「狀態＋能力」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-005）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-02", "l": 43, "ch": 13, "s": [6], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "國家安全是民族復興的根基，社會穩定是國家強盛的前提", "p": "講師：「把這個選擇題記住。」國家安全＝民族復興的根基；社會穩定＝國家強盛的前提（投影片寫「國家強盛」）。改革開放以來，黨始終把維護國家安全和社會安定作為黨和國家的一項基礎性工作。", "o": "〖国家安全〗是民族复兴的〖根基〗，〖社会稳定〗是国家强盛的〖前提〗", "m": "「安全打根基，穩定做前提」。", "pt": "A", "ps": 25, "pr": ["老師：…國家安全的前提 把這個選擇題記住 國家安全是什麼（43-006）", "投影片黃字／黃筆標記（43-006）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-03", "l": 43, "ch": 13, "s": [7], "src": "", "tag": ["選擇題考點"], "t": "新時代國家安全形勢：「三個比歷史上任何時候」", "p": "習近平指出，當前我國國家安全內涵和外延比歷史上任何時候都要豐富，時空領域比歷史上任何時候都要寬廣，內外因素比歷史上任何時候都要複雜。外部：和平與發展的時代主題面臨嚴峻挑戰（講師：「時代主題這個一定要記住」）。", "o": "当前我国国家安全〖内涵和外延〗比历史上任何时候都要丰富，〖时空领域〗比历史上任何时候都要宽广，〖内外因素〗比历史上任何时候都要复杂；〖和平与发展〗的时代主题面临严峻挑战", "m": "「內涵外延更豐富・時空更寬廣・內外因素更複雜」。", "pt": "A", "ps": 28, "pr": ["老師：…之中 時代主題這個一定要記住 時代主題（43-007）", "投影片黃字／黃筆標記（43-007）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-04", "l": 43, "ch": 13, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "風險的特點：關聯度高、傳導快、共振強", "p": "各種風險關聯度高、傳導快、共振強，容易使小風險演變成大風險、局部風險演變成系統風險、經濟社會風險演變成政治風險、國際風險演變成國內風險。既有「黑天鵝」事件又有「灰犀牛」事件。", "o": "各种风险〖关联度高〗、〖传导快〗、〖共振强〗……使小风险演变成大风险、局部风险演变成〖系统风险〗、经济社会风险演变成〖政治风险〗、国际风险演变成〖国内风险〗", "m": "「高・快・強；小→大、局部→系統、經社→政治、國際→國內」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-008）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-05", "l": 43, "ch": 13, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "由大向強、將強未強之際是高風險期", "p": "當前我國正處於中華民族偉大復興的關鍵時期，也處於從發展中大國邁向社會主義現代化強國的關鍵階段；由大向強、將強未強之際往往是國家安全的高風險期。距離民族復興越近，越不能懈怠。", "o": "由大向强、将强未强之际往往是国家安全的〖高风险期〗", "m": "「將強未強＝高風險期」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-009）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-06", "l": 43, "ch": 13, "s": [10], "src": "", "tag": ["必背", "選擇題考點"], "t": "總體國家安全觀的提出（2014年4月15日）", "p": "講師：「首次提出，選擇題。」2014年4月15日，習近平在中央國家安全委員會第一次會議上首次提出總體國家安全觀，強調必須走出一條中國特色國家安全道路。", "o": "〖2014年4月15日〗，习近平在〖中央国家安全委员会第一次会议〗上首次提出〖总体国家安全观〗，强调必须坚持总体国家安全观，走出一条〖中国特色国家安全道路〗", "m": "「2014・4・15・國安委第一次會議」——4月15日也是全民國家安全教育日。", "pt": "A", "ps": 24, "pr": ["老師：首次提出 選擇題 嗯（43-010）", "投影片黃字／黃筆標記（43-010）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-07", "l": 43, "ch": 13, "s": [11, 12], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "總體國家安全觀的豐富內涵（宗旨・根本・基礎・保障・依托）", "p": "講師：「相對來說很重要，需要大家去背」「以人民安全為宗旨，選擇」「以政治安全為根本」「以經濟安全為基礎」。五句：以人民安全為宗旨；以政治安全為根本；以經濟安全為基礎；以軍事、科技、文化、社會安全為保障；以促進國際安全為依托。", "o": "以〖人民安全〗为宗旨；以〖政治安全〗为根本；以〖经济安全〗为基础；以〖军事、科技、文化、社会安全〗为保障；以〖促进国际安全〗为依托", "m": "「人民宗旨・政治根本・經濟基礎・軍科文社保障・國際依托」——「宗根基保依」。", "items": ["以人民安全为宗旨", "以政治安全为根本", "以经济安全为基础", "以军事、科技、文化、社会安全为保障", "以促进国际安全为依托"], "pt": "A", "ps": 53, "pr": ["老師：…對來說很重要 需要大家去背顧 好（43-011）", "老師：以人民安全爲宗旨 選擇題 堅實國家安全要怎麼樣（43-011）", "老師：這是政治安全 爲根本選擇題 第三（43-011）"]}, {"id": "C43-08", "l": 43, "ch": 13, "s": [11], "src": "", "tag": ["選擇題考點"], "t": "以人民安全為宗旨：一切為了人民、一切依靠人民", "p": "堅持國家安全一切為了人民、一切依靠人民，始終把保護人民安全放在最重要的位置；堅持把政治安全放在首要位置（講師：「放在首要位置，選擇」）。", "o": "坚持国家安全一切为了人民、一切依靠人民，始终把保护人民安全放在〖最重要的位置〗；坚持把政治安全放在〖首要位置〗", "m": "「人民安全＝最重要的位置；政治安全＝首要位置」。", "pt": "A", "ps": 35, "pr": ["老師：…對來說很重要 需要大家去背顧 好（43-011）", "老師：…哪個位置 放在首要位置選擇題 完善這些政治工作的體系…（43-011）", "同頁有考點提示：以人民安全爲宗旨 選擇題 堅實國家安全要怎麼樣（43-011）"]}, {"id": "C43-09", "l": 43, "ch": 13, "s": [12], "src": "", "tag": ["選擇題考點"], "t": "全球安全觀：共同、綜合、合作、可持續", "p": "推動樹立共同、綜合、合作、可持續的全球安全觀，加強國際安全合作，完善全球安全治理體系，共同構建普遍安全的人類命運共同體。", "o": "推动树立〖共同〗、〖综合〗、〖合作〗、〖可持续〗的全球安全观……共同构建〖普遍安全〗的人类命运共同体", "m": "「共・綜・合・可」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-012）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-10", "l": 43, "ch": 13, "s": [13, 14], "src": "", "tag": ["必背", "選擇題考點"], "t": "總體國家安全觀的關鍵是「總體」", "p": "講師：「關鍵是總體，選擇題。」四個強調：（1）強調「大安全」理念，涵蓋政治、軍事、國土、經濟、金融、文化、社會、科技、網絡、糧食、生態、資源、核、海外利益、太空、深海、極地、生物、人工智能、數據等諸多領域；（2）強調系統思維和方法（統籌外部安全和內部安全、國土安全和國民安全、傳統安全和非傳統安全、自身安全和共同安全）；（3）強調貫穿黨和國家工作各方面全過程；（4）強調打總體戰。", "o": "总体国家安全观的关键是〖“总体”〗；强调〖“大安全”〗理念；统筹〖外部安全和内部安全〗、〖国土安全和国民安全〗、〖传统安全和非传统安全〗、〖自身安全和共同安全〗；强调打〖总体战〗", "m": "「關鍵＝總體：大安全・系統思維・全過程・總體戰」。", "items": ["强调“大安全”理念", "强调做好国家安全工作的系统思维和方法", "强调维护国家安全要贯穿党和国家工作各方面全过程", "强调打总体战"], "pt": "A", "ps": 24, "pr": ["老師：…在於什麼呢 關鍵是總體選擇題 嗯（43-013）", "投影片黃字／黃筆標記（43-014）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-11", "l": 43, "ch": 13, "s": [14], "src": "", "tag": ["選擇題考點"], "t": "安全和發展置於同等重要地位", "p": "維護國家安全絕非某一領域、單一部門的職責，必須把安全和發展置於同等重要地位，同步決策部署，同樣積極落實；形成匯聚黨政軍民學各戰線各方面各層級的強大合力。", "o": "必须把〖安全和发展〗置于〖同等重要地位〗，同步决策部署，同样积极落实", "m": "「安全＝發展，同等重要」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-014）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-12", "l": 43, "ch": 13, "s": [15], "src": "", "tag": ["必背", "簡答題考點"], "t": "總體國家安全觀的指導意義", "p": "講師：「這個就是我們總體國家安全觀的指導意義，需要大家去背一下。回答了什麼問題。」既回答了如何解決好大國發展進程中面臨的共性安全問題，同時又回答了如何解決好中華民族偉大復興關鍵時期面臨的特殊安全問題，為推進新時代國家安全工作提供了基本遵循。", "o": "既回答了如何解决好〖大国发展进程〗中面临的〖共性安全问题〗，同时又回答了如何解决好〖中华民族伟大复兴关键时期〗面临的〖特殊安全问题〗；为……推进新时代国家安全工作提供了〖基本遵循〗", "m": "「大國發展→共性問題；復興關鍵期→特殊問題」。", "pt": "A", "ps": 28, "pr": ["老師：…觀的指導意義 需要大家去背一下 回答了什麼問題（43-015）", "投影片黃字／黃筆標記（43-015）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-13", "l": 43, "ch": 13, "s": [16, 17, 18, 19], "src": "", "tag": ["簡答題考點"], "t": "新時代國家安全得到全面加強（五方面）", "p": "（1）黨對國家安全工作的領導更加有力（成立中央國家安全委員會，發揮「神經中樞」作用）；（2）國家安全體系和能力建設取得突破性進展（以國家安全法為引領）；（3）國家主權、安全、發展利益得到全面維護；（4）平安中國建設邁向更高水平；（5）維護國家安全的民心基礎更加鞏固。", "o": "党对国家安全工作的领导〖更加有力〗；国家安全体系和能力建设取得〖突破性进展〗；国家主权、安全、发展利益得到〖全面维护〗；平安中国建设迈向〖更高水平〗；维护国家安全的〖民心基础〗更加巩固", "m": "「領導有力・突破進展・全面維護・更高水平・民心鞏固」。", "items": ["党对国家安全工作的领导更加有力", "国家安全体系和能力建设取得突破性进展", "国家主权、安全、发展利益得到全面维护", "平安中国建设迈向更高水平", "维护国家安全的民心基础更加巩固"], "pt": "B", "ps": 15, "pr": ["同頁有考點提示：…注意這個時間作爲一個選擇題 確立爲我們全民啊（43-019）", "投影片黃字／黃筆標記（43-016）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-14", "l": 43, "ch": 13, "s": [16], "src": "", "tag": ["選擇題考點"], "t": "中央國家安全委員會：「神經中樞」", "p": "黨中央成立中央國家安全委員會，建立集中統一、高效權威的國家安全領導體制，充分發揮對國家安全事務決策、協調的「神經中樞」作用；國家安全法律制度體系以國家安全法為引領。", "o": "党中央成立〖中央国家安全委员会〗，建立〖集中统一〗、〖高效权威〗的国家安全领导体制……充分发挥对国家安全事务决策、协调的〖“神经中枢”〗作用", "m": "「國安委＝神經中樞」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（43-016）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C43-15", "l": 43, "ch": 13, "s": [19], "src": "", "tag": ["必背", "選擇題考點"], "t": "全民國家安全教育日：每年4月15日", "p": "講師：「注意這個時間作為一個選擇題……4月15號。」堅持把強化人民群眾的國家安全意識作為國家安全的固本之策和長久之計，將每年4月15日確定為全民國家安全教育日。", "o": "坚持把强化人民群众的国家安全意识作为国家安全的〖固本之策〗和〖长久之计〗，将每年〖4月15日〗确定为〖全民国家安全教育日〗", "m": "「4・15＝總體國家安全觀提出日＝全民國家安全教育日」。", "pt": "A", "ps": 24, "pr": ["老師：…注意這個時間作爲一個選擇題 確立爲我們全民啊（43-019）", "投影片黃字／黃筆標記（43-019）", "老師：這一節「在歷年的考試之中…比較重要」（43 srt 39:53）"]}, {"id": "C44-01", "l": 44, "ch": 13, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "統籌發展和安全是黨治國理政的一個重大原則", "p": "統籌發展和安全，是黨和國家的一項基礎性工作，是我們黨治國理政的一個重大原則。黨的十九屆五中全會首次把統籌發展和安全納入「十四五」時期經濟社會發展的指導思想；黨的二十大強調「統籌發展和安全」，並將其寫入黨章；黨中央明確提出加快構建新安全格局。", "o": "统筹发展和安全，是党和国家的一项〖基础性工作〗，是我们党治国理政的一个〖重大原则〗。党的〖十九届五中全会〗首次把统筹发展和安全纳入〖“十四五”〗时期我国经济社会发展的指导思想，党的〖二十大〗强调“统筹发展和安全”，并将其写入〖党章〗", "m": "「基礎性工作・重大原則；十九屆五中→十四五；二十大→黨章」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（44-003）"]}, {"id": "C44-02", "l": 44, "ch": 13, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "發展和安全是兩件大事：動力 vs 保障", "p": "講師：「發展就是最大的安全，這是第一層含義要背過的。」發展解決的是動力問題，是推動國家和民族永續綿延的根本支撐；安全解決的是保障問題，是確保國家和民族行穩致遠的堅強柱石。發展是解決安全問題的總鑰匙。", "o": "发展解决的是〖动力〗问题，是推动国家和民族永续绵延的〖根本支撑〗；安全解决的是〖保障〗问题，是确保国家和民族行稳致远的〖坚强柱石〗。发展具有基础性、根本性，是解决安全问题的〖总钥匙〗，发展就是〖最大的安全〗", "m": "「發展＝動力＝根本支撐＝總鑰匙＝最大的安全；安全＝保障＝堅強柱石」。", "pt": "A", "ps": 26, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"id": "C44-03", "l": 44, "ch": 13, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "發展和安全是一體之兩翼、驅動之雙輪", "p": "講師：「第二層含義……是一體兩翼，就像一隻鳥它有翅膀。」必須同步推進：堅持發展和安全並重，以發展促安全、以安全保發展，努力建久安之勢、成長治之業。", "o": "发展和安全是〖一体之两翼〗、〖驱动之双轮〗，必须同步推进；以发展〖促〗安全、以安全〖保〗发展", "m": "「兩翼・雙輪；發展促安全，安全保發展」。", "pt": "A", "ps": 15, "pr": ["老師：…安全, 這是第一層含義要背過的。 第二層含義發展和安…（44-004）", "投影片黃字／黃筆標記（44-004）"]}, {"id": "C44-04", "l": 44, "ch": 13, "s": [5], "src": "", "tag": ["選擇題考點"], "t": "以新安全格局保障新發展格局", "p": "牢牢守住安全發展這條底線，是構建新發展格局的重要前提和保障。增強我國的生存力、競爭力、發展力、持續力，確保中華民族偉大復興進程不被遲滯甚至中斷。必須統籌維護國家安全各類要素、各個領域、各方資源、各種手段，實現高質量發展和高水平安全的良性互動。", "o": "牢牢守住〖安全发展〗这条底线是构建新发展格局的〖重要前提和保障〗；实现〖高质量发展〗和〖高水平安全〗的良性互动", "m": "「新安全格局保障新發展格局；高質量發展↔高水平安全」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C44-05", "l": 44, "ch": 13, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "構建新安全格局＝戰略選擇＋重大舉措", "p": "講師：「那麼注意了。」構建新安全格局是應對國家安全形勢新變化新趨勢的戰略選擇，是全面貫徹落實總體國家安全觀的重大舉措。要把維護政治安全放在首要位置（講師：「注意這裏，這是一個選擇題。」）。", "o": "构建新安全格局是应对国家安全形势新变化新趋势的〖战略选择〗，是全面贯彻落实总体国家安全观的〖重大举措〗；把维护〖政治安全〗放在〖首要位置〗", "m": "「戰略選擇・重大舉措；政治安全＝首要位置」。", "pt": "A", "ps": 25, "pr": ["老師：注意這裏, 這是一個選擇題, 我們的政治安全要放在…（44-006）", "老師：那麼注意了。（44-006）", "投影片黃字／黃筆標記（44-006）"]}, {"id": "C44-06", "l": 44, "ch": 13, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "政治安全是國家安全的根本（心臟）", "p": "講師：「政治安全是國家安全的根本，這個是我們需要去記憶的選擇題。」必須把維護政治安全作為應對各領域安全風險挑戰的首要任務。政治安全涉及國家主權、政權、制度和意識形態的穩固；形象地說，在國家安全這一肌體中，政治安全是心臟。", "o": "必须把维护政治安全作为应对各领域安全风险挑战的〖首要任务〗。〖政治安全〗是国家安全的〖根本〗；在国家安全这一肌体中，政治安全是〖心脏〗", "m": "「政治安全＝根本＝心臟＝首要任務」。", "pt": "A", "ps": 27, "pr": ["老師：…全的根本, 這個是我們需要去記憶的選擇題, 提到安全…（44-007）", "投影片黃字／黃筆標記（44-007）"]}, {"id": "C44-07", "l": 44, "ch": 13, "s": [8, 9, 10], "src": "", "tag": ["必背", "簡答題考點"], "t": "維護政治安全：政權・制度・意識形態", "p": "講師：「這五個標題要背過。」維護政權安全＝堅持和鞏固黨的領導和長期執政地位；維護制度安全＝堅持和完善中國特色社會主義制度；維護意識形態安全＝堅持和鞏固馬克思主義在意識形態領域的指導地位。", "o": "维护〖政权安全〗，就是要毫不动摇坚持和巩固党的领导和长期执政地位；维护〖制度安全〗，就是要毫不动摇坚持和完善中国特色社会主义制度；维护〖意识形态安全〗，就是要毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位", "m": "「政權→黨的領導；制度→中特制度；意識形態→馬克思主義指導地位」。", "pt": "A", "ps": 62, "pr": ["老師：…態安全, 來第四個標題要背, 來第五個,（44-010）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）"]}, {"id": "C44-08", "l": 44, "ch": 13, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "黨在國家政權結構中總攬全局、協調各方的核心地位", "p": "講師：「總攬全局協調各方的核心地位，這個作為選擇題你要知道。」我國憲法確認了中國共產黨的領導地位，確認了黨在國家政權結構中總攬全局、協調各方的核心地位。絕不能犯戰略性、顛覆性錯誤。", "o": "确认了党在国家政权结构中〖总揽全局〗、〖协调各方〗的核心地位", "m": "「總攬全局・協調各方」。", "pt": "A", "ps": 34, "pr": ["老師：…首要任務, 這是第一個要背的, 第二個是,（44-008）", "老師：…的核心地位, 這個作爲選擇題你要知道。 我們黨在國家…（44-008）", "投影片黃字／黃筆標記（44-008）"]}, {"id": "C44-09", "l": 44, "ch": 13, "s": [9], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "社會主義制度是根本制度 vs 人民代表大會制度是根本政治制度", "p": "講師：「這裏涉及到一個比較容易混淆的考點……社會主義制度是我國的根本制度，而人民代表大會制度是我國的根本政治制度……少了一個政治，就完全是不同的答案。」制度穩則國家穩。", "o": "制度稳则国家稳，〖社会主义制度〗是我国的〖根本制度〗", "m": "「根本制度＝社會主義制度；根本『政治』制度＝人大制度」。", "pt": "A", "ps": 40, "pr": ["老師：…及到一個比較容易混淆的考點哈。 社會主義制度是我國的…（44-009）", "老師：…知識點, 像第一個我們要記住, 構建統籌各領域安全的…（44-009）", "老師：所以這一答案一定要注意不要混淆。 在這個考試過程中…（44-009）"]}, {"id": "C44-10", "l": 44, "ch": 13, "s": [10], "src": "", "tag": ["選擇題考點"], "t": "意識形態事關舉什麼旗、走什麼路", "p": "搞亂一個社會、顛覆一個政權，往往先從意識形態領域打開缺口。要把維護意識形態安全擺在極端重要位置，把意識形態工作的領導權、管理權、話語權牢牢掌握在黨的手中。", "o": "意识形态事关〖举什么旗〗、〖走什么路〗的重大问题；把意识形态工作的〖领导权〗、〖管理权〗、〖话语权〗牢牢掌握在党的手中", "m": "「旗・路；領導權・管理權・話語權」。", "pt": "B", "ps": 5, "pr": ["同頁有考點提示：…態安全, 來第四個標題要背, 來第五個,（44-010）", "投影片黃字／黃筆標記（44-010）"]}, {"id": "C44-11", "l": 44, "ch": 13, "s": [11], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "政治安全、人民安全、國家利益至上有機統一", "p": "講師：「一定要記住他們之間的關係。」政治安全是維護人民安全和國家利益的根本保證；人民安全居於中心地位；國家利益至上是實現政治安全和人民安全的要求和原則。", "o": "〖政治安全〗是维护人民安全和国家利益的〖根本保证〗；〖人民安全〗居于〖中心地位〗；〖国家利益至上〗是实现政治安全和人民安全的〖要求和原则〗", "m": "「政治＝根本保證；人民＝中心地位；國家利益＝要求和原則」。", "pt": "A", "ps": 24, "pr": ["老師：…係再來梳理一遍, 一定要記住他們之間的關係, 政治安…（44-011）"]}, {"id": "C44-12", "l": 44, "ch": 13, "s": [12, 13, 14, 15, 16, 17], "src": "", "tag": ["必背", "簡答題考點"], "t": "維護重點領域國家安全（六個安全）", "p": "講師：「這六個安全一定要把它記住，作為一個簡答題我們要去回答。」國土安全、經濟安全、社會安全、網絡人工智能數據安全、生物安全和公共衛生安全、外部安全。", "o": "维护〖国土安全〗；维护〖经济安全〗；维护〖社会安全〗；维护〖网络、人工智能、数据安全〗；维护〖生物安全和公共卫生安全〗；维护〖外部安全〗", "m": "「土・經・社・網・生・外」——「土經社網生外」。", "items": ["维护国土安全", "维护经济安全", "维护社会安全", "维护网络、人工智能、数据安全", "维护生物安全和公共卫生安全", "维护外部安全"], "pt": "A", "ps": 59, "pr": ["老師：…機統一的, 這五個標題要背過, 我們繼續來第五個知識…（44-012）", "老師：…安全, 這六個安全一定要把它記住, 作爲一個簡答題,…（44-017）", "老師：…的耕地紅線, 所以一個選擇題吧, 18億的耕地紅線,…（44-013）"]}, {"id": "C44-13", "l": 44, "ch": 13, "s": [12, 13, 14], "src": "", "tag": ["選擇題考點", "易混"], "t": "國土安全＝立國之基；經濟安全＝基礎；社會安全＝晴雨表", "p": "國土安全是立國之基（老祖宗留下來的領土一寸也不能丟）；經濟安全是國家安全的基礎（牢牢守住18億畝耕地紅線，講師：「一個選擇題，18億的耕地紅線」）；社會安全是人民群眾安全感的晴雨表、社會安定的風向標。", "o": "〖国土安全〗是立国之基；〖经济安全〗是国家安全的基础；牢牢守住〖18亿亩〗耕地红线；社会安全……是人民群众安全感的〖晴雨表〗，是社会安定的〖风向标〗", "m": "「國土＝立國之基；經濟＝基礎（18億畝）；社會＝晴雨表・風向標」。", "pt": "A", "ps": 38, "pr": ["老師：…機統一的, 這五個標題要背過, 我們繼續來第五個知識…（44-012）", "老師：…的耕地紅線, 所以一個選擇題吧, 18億的耕地紅線,…（44-013）", "投影片黃字／黃筆標記（44-012）"]}, {"id": "C45-01", "l": 45, "ch": 13, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "推進國家安全體系和能力現代化的原因", "p": "國家安全體系和能力是國家安全制度及其執行能力的集中體現。推進國家安全體系和能力現代化，是新時代維護國家安全的迫切要求，也是推進國家治理體系和治理能力現代化的重要工程；要全面構建系統完備、科學規範、運行有效的國家安全制度體系。", "o": "国家安全体系和能力是国家安全制度及其执行能力的〖集中体现〗；推进国家安全体系和能力现代化，是新时代维护国家安全的〖迫切要求〗，也是推进国家治理体系和治理能力现代化的〖重要工程〗", "m": "「集中體現・迫切要求・重要工程」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（45-003）"]}, {"id": "C45-02", "l": 45, "ch": 13, "s": [4], "src": "", "tag": ["選擇題考點"], "t": "開創新時代國家安全工作新局面（二十大部署）", "p": "講師：「來注意了。」黨的二十大對推進國家安全體系和能力現代化、堅決維護國家安全和社會穩定作出戰略部署：推進國家安全體系和能力現代化，推動建設更高水平的平安中國，著力提高防範化解重大風險能力和水平。", "o": "推进〖国家安全体系和能力现代化〗，推动建设〖更高水平的平安中国〗，着力提高〖防范化解重大风险〗能力和水平，不断塑造总体有利的国家安全战略态势", "m": "「體系能力現代化・平安中國・防範化解重大風險」。", "pt": "B", "ps": 5, "pr": ["老師：來注意了。（45-004）", "投影片黃字／黃筆標記（45-004）"]}, {"id": "C45-03", "l": 45, "ch": 13, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "健全國家安全體系是保障國家安全的治本之策", "p": "講師：「就是我們治本之策，選擇題。」健全國家安全體系、加強國家安全制度建設，是保障國家安全的治本之策，是維護和塑造國家安全的重要支撐。首先要堅持黨中央對國家安全工作的集中統一領導。", "o": "健全国家安全体系、加强国家安全制度建设，是保障国家安全的〖治本之策〗，是维护和塑造国家安全的〖重要支撑〗；坚持〖党中央〗对国家安全工作的〖集中统一领导〗", "m": "「國家安全體系＝治本之策（對比：第41堂綠色低碳發展＝解決生態問題的治本之策）」。", "pt": "A", "ps": 12, "pr": ["老師：就是我們治本之策，選擇題。（45-005）", "投影片黃字／黃筆標記（45-005）"]}, {"id": "C45-04", "l": 45, "ch": 13, "s": [5, 6], "src": "", "tag": ["簡答題考點"], "t": "健全完善國家安全體系（四點）", "p": "（1）堅持黨中央對國家安全工作的集中統一領導，完善高效權威的國家安全領導體制；（2）強化國家安全工作協調機制，完善法治、戰略、政策、風險監測預警、國家應急管理等體系；（3）加快涉外法治工作戰略布局，健全反制裁、反干涉、反「長臂管轄」機制；（4）完善國家安全力量布局，構建全域聯動、立體高效的國家安全防護體系。", "o": "坚持党中央对国家安全工作的集中统一领导；强化〖国家安全工作协调机制〗；加快〖涉外法治〗工作战略布局，健全反制裁、反干涉、反〖“长臂管辖”〗；构建〖全域联动〗、〖立体高效〗的国家安全防护体系", "m": "「領導・協調・涉外法治（三反）・防護體系」。", "items": ["坚持党中央对国家安全工作的集中统一领导，完善高效权威的国家安全领导体制", "强化国家安全工作协调机制", "加快涉外法治工作战略布局，健全反制裁、反干涉、反“长臂管辖”", "完善国家安全力量布局，构建全域联动、立体高效的国家安全防护体系"], "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（45-005）"]}, {"id": "C45-05", "l": 45, "ch": 13, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "國家安全能力建設：基礎性、根本性、長期性", "p": "國家安全能力建設具有基礎性、根本性、長期性的意義。要從實現中華民族偉大復興的戰略高度分析需求；突出實戰實用鮮明導向；加強重點領域安全能力和海外安全保障能力建設；全面加強國家安全教育，築牢國家安全人民防線。", "o": "国家安全能力建设具有〖基础性〗、〖根本性〗、〖长期性〗的意义；全面加强〖国家安全教育〗……筑牢国家安全〖人民防线〗", "m": "「基礎・根本・長期」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-007）"]}, {"id": "C45-06", "l": 45, "ch": 13, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "建設更高水平的平安中國", "p": "建設平安中國，是全面建設社會主義現代化國家的重要內容和重要保障。要全面提升平安中國建設科學化、社會化、法治化、智能化水平，努力建設治理效能更強、安全穩定局面更鞏固、人民更滿意的平安中國。", "o": "建设平安中国，是全面建设社会主义现代化国家的〖重要内容〗和〖重要保障〗；全面提升平安中国建设〖科学化〗、〖社会化〗、〖法治化〗、〖智能化〗水平", "m": "「四化：科學・社會・法治・智能」；三個「更」：治理效能更強・安全穩定更鞏固・人民更滿意。", "items": ["努力建设治理效能更强的平安中国", "努力建设安全稳定局面更巩固的平安中国", "努力建设人民更满意的平安中国"], "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-008）"]}, {"id": "C45-07", "l": 45, "ch": 13, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "公共安全治理模式轉型：事後處置→事前預防", "p": "堅持安全第一、預防為主，建立大安全大應急框架，完善公共安全體系，推動公共安全治理模式由以事後處置為主向以事前預防為主轉型。", "o": "坚持〖安全第一〗、〖预防为主〗，建立〖大安全大应急〗框架……推动公共安全治理模式由以〖事后处置〗为主向以〖事前预防〗为主转型", "m": "「事後→事前」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-008）"]}, {"id": "C45-08", "l": 45, "ch": 13, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "安全穩定局面更鞏固：源頭防範、多元化解、信訪", "p": "社會更加安全穩定有序，是檢驗更高水平的平安中國建設成效的重要標誌。堅持源頭防範（抓早抓小抓苗頭）；堅持多元化解（注重運用非訴訟糾紛解決機制）；加強和改進信訪工作。", "o": "社会更加安全稳定有序，是检验更高水平的平安中国建设成效的〖重要标志〗；坚持〖源头防范〗……坚持〖多元化解〗", "m": "「重要標誌＝安全穩定有序」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-009）"]}, {"id": "C45-09", "l": 45, "ch": 13, "s": [11], "src": "", "tag": ["必背", "選擇題考點"], "t": "新形勢下國家安全和社會穩定面臨的威脅和挑戰增多", "p": "講師：「這一塊呢我們需要去背誦。」當前和今後一個時期是我國各類矛盾和風險易發期；風險有外部風險也有內部風險，有一般風險也有重大風險。", "o": "新形势下我国国家安全和社会稳定面临的〖威胁和挑战增多〗；当前和今后一个时期是我国各类矛盾和风险〖易发期〗", "m": "「易發期；外部/內部、一般/重大」。", "pt": "A", "ps": 26, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "投影片黃字／黃筆標記（45-011）"]}, {"id": "C45-10", "l": 45, "ch": 13, "s": [11, 12, 13], "src": "", "tag": ["必背", "簡答題考點"], "t": "多措並舉提高防範化解重大風險能力（三點）", "p": "①堅持底線思維和極限思維：從最壞處着眼，做最充分的準備，朝好的方向努力，爭取最好的結果；②下好先手棋、打好主動仗，力爭把風險化解在源頭：既要警惕「黑天鵝」也要防範「灰犀牛」；③運用制度威力應對風險挑戰的衝擊。", "o": "坚持〖底线思维〗和〖极限思维〗；下好〖先手棋〗、打好〖主动仗〗，力争把风险化解在〖源头〗；运用〖制度威力〗应对风险挑战的冲击", "m": "「底線極限・先手主動・制度威力」。", "items": ["坚持底线思维和极限思维", "下好先手棋、打好主动仗，力争把风险化解在源头", "运用制度威力应对风险挑战的冲击"], "pt": "A", "ps": 20, "pr": ["老師：…那麼這一塊呢 我們需要去背誦 新形式下我國的國家安全…（45-011）", "投影片黃字／黃筆標記（45-011）"]}, {"id": "C45-11", "l": 45, "ch": 13, "s": [12], "src": "", "tag": ["選擇題考點", "易混"], "t": "「黑天鵝」與「灰犀牛」", "p": "既要高度警惕「黑天鵝」事件，也要防範「灰犀牛」事件；既要有防範風險的先手，也要有應對和化解風險挑戰的高招；力爭不出現重大風險或在出現重大風險時扛得住、過得去。總想過太平日子、不想鬥爭是不切實際的。", "o": "既要高度警惕〖“黑天鹅”〗事件，也要防范〖“灰犀牛”〗事件；……打好化险为夷、转危为机的〖战略主动战〗", "m": "「黑天鵝（突發意外）・灰犀牛（明顯但被忽視）」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（45-012）"]}, {"id": "C46-01", "l": 46, "ch": 14, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "國防和軍隊建設是捍衛國家主權、安全、發展利益的堅強後盾", "p": "白話：沒有強大軍隊，就沒有強大祖國。國無防不立，民無兵不安。近代中國被動挨打，重要原因就是國防落後、軍隊虛弱。", "o": "国防和军队建设是捍卫国家〖主权〗、〖安全〗、〖发展利益〗的〖坚强后盾〗；国无防〖不立〗，民无兵〖不安〗", "m": "「主權・安全・發展利益＝堅強後盾」；「國無防不立，民無兵不安」。", "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（46-005）"]}, {"id": "C46-02", "l": 46, "ch": 14, "s": [5, 6], "src": "", "tag": ["必背", "選擇題考點"], "t": "堅強後盾的三個理由", "p": "講師：「這就是這三個點，如果作為選擇題的話，你把這三個點羅列上去，其實不難。」（1）國無防不立，民無兵不安；（2）中國越發展壯大，遇到的阻力和壓力就會越大，面臨的風險就會越多——只有以強大軍事實力為後盾，其他安全才能托底；（3）當今世界，和平與發展仍然是時代主題，但並不太平，家門口生亂生戰的可能性增大。", "o": "〖国无防不立，民无兵不安〗；〖中国越发展壮大〗，遇到的阻力和压力就会越大，面临的风险就会越多；当今世界，和平与发展仍然是〖时代主题〗，但并〖不太平〗", "m": "「無防不立・越大越險・和平但不太平」。", "items": ["国无防不立，民无兵不安", "中国越发展壮大，遇到的阻力和压力就会越大，面临的风险就会越多", "当今世界，和平与发展仍然是时代主题，但并不太平"], "pt": "A", "ps": 24, "pr": ["老師：…就是這三個點 如果作爲選擇題的話 你把這三個點（46-006）", "投影片黃字／黃筆標記（46-005）"]}, {"id": "C46-03", "l": 46, "ch": 14, "s": [6], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "鞏固國防和強大人民軍隊：戰略支撐＋必然要求", "p": "注意1：鞏固國防和強大人民軍隊是新時代堅持和發展中國特色社會主義、實現中華民族偉大復興的戰略支撐。注意2：建設同我國國際地位相稱、同國家安全和發展利益相適應的鞏固國防和強大人民軍隊，是新時代黨和國家事業發展的必然要求。", "o": "巩固国防和强大人民军队是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的〖战略支撑〗；建设同我国〖国际地位相称〗、同国家安全和发展利益〖相适应〗的巩固国防和强大人民军队，是新时代党和国家事业发展的〖必然要求〗", "m": "「戰略支撐（為復興）；必然要求（相稱・相適應）」。", "pt": "A", "ps": 12, "pr": ["老師：…就是這三個點 如果作爲選擇題的話 你把這三個點（46-006）", "投影片黃字／黃筆標記（46-006）"]}, {"id": "C46-04", "l": 46, "ch": 14, "s": [7, 8], "src": "", "tag": ["必背", "簡答題考點"], "t": "新時代人民軍隊使命任務：「四個戰略支撐」", "p": "講師：「簡答題，總共四個戰略支撐，要背過的」「標黃的一定要背」。（1）為鞏固中國共產黨領導和我國社會主義制度提供戰略支撐；（2）為捍衛國家主權、統一和領土完整提供戰略支撐；（3）為維護我國海外利益提供戰略支撐；（4）為促進世界和平與發展提供戰略支撐。", "o": "为巩固〖中国共产党领导〗和我国〖社会主义制度〗提供战略支撑；为捍卫〖国家主权、统一和领土完整〗提供战略支撑；为维护我国〖海外利益〗提供战略支撑；为促进〖世界和平与发展〗提供战略支撑", "m": "「黨和制度・主權統一領土・海外利益・世界和平」——由內到外。", "items": ["为巩固中国共产党领导和我国社会主义制度提供战略支撑", "为捍卫国家主权、统一和领土完整提供战略支撑", "为维护我国海外利益提供战略支撑", "为促进世界和平与发展提供战略支撑"], "pt": "A", "ps": 76, "pr": ["老師：…麼這一塊 那裏面是需要去背的 那麼我們需要去背什麼呢…（46-007）", "老師：…們的帽子 Title給背下來 這是一個完整的答案（46-007）", "老師：很多人可能會 問老師要背哪些 那麼肯定是（46-008）"]}, {"id": "C46-05", "l": 46, "ch": 14, "s": [7], "src": "", "tag": ["選擇題考點"], "t": "軍隊是政權建立和鞏固的首要條件", "p": "馬克思主義認為，軍隊是政權建立和鞏固的首要條件，執政必然要執軍。人民軍隊必須堅定站在黨的旗幟下，堅決聽黨指揮。人民軍隊始終是捍衛國家主權、統一和領土完整的堅強柱石。", "o": "军队是政权建立和巩固的〖首要条件〗，执政必然要〖执军〗；人民军队始终是捍卫国家主权、统一和领土完整的〖坚强柱石〗", "m": "「首要條件；執政必執軍；堅強柱石」。", "pt": "A", "ps": 38, "pr": ["老師：…麼這一塊 那裏面是需要去背的 那麼我們需要去背什麼呢…（46-007）", "老師：…們的帽子 Title給背下來 這是一個完整的答案（46-007）", "老師：…那麼肯定是 標黃的一定要背的啊 就是這一部分標黃的背…（46-007）"]}, {"id": "C46-06", "l": 46, "ch": 14, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "海外利益是國家利益的重要組成部分", "p": "海外利益是我國國家利益的重要組成部分；有效維護海外中國公民、組織和機構的安全和正當權益，是人民軍隊擔負的重要任務。一支強大的中國軍隊，是維護世界和平穩定、服務構建人類命運共同體的堅定力量。", "o": "〖海外利益〗是我国国家利益的〖重要组成部分〗；一支强大的中国军队，是维护世界和平稳定、服务构建〖人类命运共同体〗的坚定力量", "m": "「海外利益＝重要組成部分」。", "pt": "A", "ps": 26, "pr": ["老師：很多人可能會 問老師要背哪些 那麼肯定是（46-008）", "老師：…題總共四個戰略支撐啊 要背過的 來（46-008）", "投影片黃字／黃筆標記（46-008）"]}, {"id": "C46-07", "l": 46, "ch": 14, "s": [9], "src": "", "tag": ["必背", "選擇題考點"], "t": "人民軍隊是執行黨的政治任務的武裝集團", "p": "講師：「注意一下啊，人民軍隊是什麼。」人民軍隊是執行黨的政治任務的武裝集團，黨和人民所需就是軍隊使命任務所係。人民軍隊始終是黨和人民完全可以信賴的英雄軍隊（三個「有信心、有能力」）。", "o": "人民军队是执行党的〖政治任务〗的〖武装集团〗，党和人民所需就是军队〖使命任务〗所系", "m": "「武裝集團執行政治任務」。", "pt": "B", "ps": 5, "pr": ["老師：注意一下啊，人民軍隊是什麼。（46-009）", "投影片黃字／黃筆標記（46-009）"]}, {"id": "C47-01", "l": 47, "ch": 14, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "「兩個差距還很大」「兩個能力不夠」", "p": "進入新時代，國防和軍隊建設的現實問題：軍隊現代化水平與國家安全需求相比差距還很大，與世界先進軍事水平相比差距還很大；打現代化戰爭能力不夠，各級幹部指揮現代化戰爭能力不夠。建設強大的人民軍隊是我們黨的不懈追求。", "o": "军队现代化水平与〖国家安全需求〗相比差距还很大，与〖世界先进军事水平〗相比差距还很大；〖打现代化战争〗能力不够，各级干部〖指挥现代化战争〗能力不够", "m": "「兩差距（安全需求・先進水平）＋兩不夠（打・指揮）」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（47-003）", "老師：「把本節的內容…去進行一個背誦」（47 srt 39:05）"]}, {"id": "C47-02", "l": 47, "ch": 14, "s": [4], "src": "", "tag": ["必背", "多選題考點", "選擇題考點"], "t": "黨在新時代的強軍目標", "p": "講師：「先把這個十九大先圈重點……必須把這一句話背過，多選題考點，三個 ABC 剛好」「這三個一定要記住」。黨的十九大明確提出：建設一支聽黨指揮、能打勝仗、作風優良的人民軍隊，把人民軍隊建設成為世界一流軍隊。它回答了為什麼強軍、強軍強什麼、怎樣強軍的重大課題。", "o": "党的〖十九大〗明确提出，党在新时代的强军目标是建设一支〖听党指挥〗、〖能打胜仗〗、〖作风优良〗的人民军队，把人民军队建设成为〖世界一流军队〗", "m": "「聽・打・作＋世界一流」。", "items": ["听党指挥", "能打胜仗", "作风优良"], "pt": "A", "ps": 52, "pr": ["老師：…把這一句話背掛 多選提考點（47-004）", "老師：…優良的人民軍隊 多選提考點 三個ABC剛好ABC（47-004）", "老師：…是作風優良 這三個一定要記住啊 把人民軍隊建設成爲世…（47-004）"]}, {"id": "C47-03", "l": 47, "ch": 14, "s": [4], "src": "", "tag": ["選擇題考點"], "t": "強軍目標回答的三個重大課題", "p": "講師：「這三個重大的課題，大家記住。」強軍目標回答了為什麼強軍、強軍強什麼、怎樣強軍的重大課題，立起了人民軍隊作為大國軍隊、強國軍隊應有的樣子。", "o": "回答了〖为什么强军〗、〖强军强什么〗、〖怎样强军〗的重大课题", "m": "「為什麼・強什麼・怎樣強」。", "pt": "B", "ps": 13, "pr": ["同頁有考點提示：…把這一句話背掛 多選提考點（47-004）", "投影片黃字／黃筆標記（47-004）", "老師：「把本節的內容…去進行一個背誦」（47 srt 39:05）"]}, {"id": "C47-04", "l": 47, "ch": 14, "s": [5], "src": "", "tag": ["選擇題考點"], "t": "強軍目標明確了新時代建軍治軍的總方略", "p": "講師：「注意這裏，強軍目標它明確了什麼。」習近平創造性提出黨在新時代的強軍目標，明確了新時代我們黨建軍治軍的總方略，為建設鞏固國防和強大軍隊提供了戰略指引。", "o": "明确了新时代我们党建军治军的〖总方略〗，为建设巩固国防和强大军队提供了〖战略指引〗", "m": "「總方略＋戰略指引」。", "pt": "B", "ps": 7, "pr": ["老師：注意這裏，強軍目標它明確了什麼。（47-005）", "投影片黃字／黃筆標記（47-005）", "老師：「把本節的內容…去進行一個背誦」（47 srt 39:05）"]}, {"id": "C47-05", "l": 47, "ch": 14, "s": [6, 7], "src": "", "tag": ["必背", "簡答題考點", "易混"], "t": "強軍目標的科學內涵：靈魂・核心・保證", "p": "講師：「一定要記住」「後面的白字也要背，作為簡答題」。聽黨指揮是靈魂，決定軍隊建設的政治方向；能打勝仗是核心，反映軍隊的根本職能和軍隊建設的根本指向（軍隊首先是一個戰鬥隊）；作風優良是保證，關係軍隊的性質、宗旨、本色。", "o": "〖听党指挥〗是〖灵魂〗，决定军队建设的〖政治方向〗；〖能打胜仗〗是〖核心〗，反映军队的〖根本职能〗和军队建设的〖根本指向〗；〖作风优良〗是〖保证〗，关系军队的〖性质、宗旨、本色〗", "m": "「聽黨＝靈魂（方向）；打勝仗＝核心（職能）；作風＝保證（本色）」。", "pt": "A", "ps": 100, "pr": ["老師：…們強軍目標的內涵 一定要記住 兵黨指揮是什麼（47-006）", "老師：哎 這個你也要去背 背過他（47-007）", "老師：…作風優良是保障 那麼還要背什麼呢 後面的白字也要背（47-006）"]}, {"id": "C47-06", "l": 47, "ch": 14, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "黨對人民軍隊的絕對領導是永遠不變的軍魂", "p": "堅持黨對人民軍隊的絕對領導是人民軍隊永遠不變的軍魂（講師：黨指揮槍，不是槍指揮黨）。能打仗、打勝仗是軍隊的根本價值所在。", "o": "坚持党对人民军队的〖绝对领导〗是人民军队永远不变的〖军魂〗；能打仗、打胜仗是军队的〖根本价值〗所在", "m": "「絕對領導＝軍魂；打勝仗＝根本價值」。", "pt": "A", "ps": 46, "pr": ["老師：…們強軍目標的內涵 一定要記住 兵黨指揮是什麼（47-006）", "老師：…是軍隊的根本價值所在的這個背下 作風優良是保障（47-006）", "老師：…容呢 它也是作爲我們的選擇題 簡單（47-006）"]}, {"id": "C47-07", "l": 47, "ch": 14, "s": [7], "src": "", "tag": ["簡答題考點"], "t": "三者相互聯繫、密不可分", "p": "講師：「他也可能會單獨給你去出一個簡答題，這個你也要去背。」聽黨指揮、能打勝仗、作風優良，三者相互聯繫、密不可分，抓住了建設強大人民軍隊最根本、最緊要、最現實的問題，體現了堅持黨的建軍原則、人民軍隊根本職能、特有政治優勢的高度統一；抓住這三條就能起到綱舉目張的作用。", "o": "三者相互联系、密不可分，抓住了建设强大人民军队〖最根本、最紧要、最现实〗的问题，明确了加强军队建设的〖聚焦点和着力点〗……就能起到〖纲举目张〗的作用", "m": "「最根本・最緊要・最現實；綱舉目張」。", "pt": "A", "ps": 38, "pr": ["老師：哎 這個你也要去背 背過他（47-007）", "老師：…能會單獨給你去 跑一個簡答題 哎（47-007）", "投影片黃字／黃筆標記（47-007）"]}, {"id": "C47-08", "l": 47, "ch": 14, "s": [8], "src": "", "tag": ["必背", "多選題考點", "簡答題考點"], "t": "國防和軍隊現代化新「三步走」戰略安排", "p": "講師：「多選題、簡答題有可能會考」「本世紀中葉講的都是2050年」。黨的十九大提出：確保到2020年基本實現機械化、信息化建設取得重大進展、戰略能力有大的提升；力爭到2035年基本實現國防和軍隊現代化；到本世紀中葉把人民軍隊全面建成世界一流軍隊。十九屆五中全會進一步明確提出確保2027年實現建軍一百年奮鬥目標。", "o": "确保到〖2020年〗基本实现〖机械化〗，信息化建设取得重大进展，战略能力有大的提升；力争到〖2035年〗基本实现〖国防和军队现代化〗；到〖本世纪中叶〗把人民军队全面建成〖世界一流军队〗；确保〖2027年〗实现〖建军一百年奋斗目标〗", "m": "「2020機械化→2027建軍百年→2035基本現代化→2050世界一流」。", "pt": "A", "ps": 55, "pr": ["老師：來這一塊內容呢 多選題 簡答題（47-008）", "老師：簡答題 有可能會考的啊 我們的這一章的內容（47-008）", "老師：被過 多選 多選題考什麼呢（47-008）"]}, {"id": "C47-09", "l": 47, "ch": 14, "s": [9], "src": "", "tag": ["必背", "選擇題考點"], "t": "2027年實現建軍一百年奮鬥目標", "p": "2027年是人民軍隊建軍100周年。實現建軍一百年奮鬥目標，是把握強國強軍時代要求的重大決策，是關係國家安全和發展全局的重大任務，是國防和軍隊現代化新「三步走」十分緊要的一步。", "o": "〖2027年〗是人民军队建军〖100周年〗；实现建军一百年奋斗目标……是国防和军队现代化新“三步走”〖十分紧要的一步〗", "m": "「1927建軍＋100＝2027」。", "pt": "B", "ps": 2, "pr": ["老師：「把本節的內容…去進行一個背誦」（47 srt 39:05）"]}, {"id": "C47-10", "l": 47, "ch": 14, "s": [10, 11], "src": "", "tag": ["必背", "簡答題考點"], "t": "到2035年基本實現國防和軍隊現代化（四個現代化）", "p": "講師：「這個就是我們到2035年實現軍隊的現代化，四個一定要背過……一個是理論。」加快軍事理論現代化；加快軍隊組織形態現代化（講師：重點突出「組織」）；加快軍事人員現代化；加快武器裝備現代化。", "o": "加快〖军事理论〗现代化；加快〖军队组织形态〗现代化；加快〖军事人员〗现代化；加快〖武器装备〗现代化", "m": "「理論・組織・人員・裝備」——「理組人裝」。", "items": ["加快军事理论现代化", "加快军队组织形态现代化", "加快军事人员现代化", "加快武器装备现代化"], "pt": "A", "ps": 18, "pr": ["老師：…軍隊的現代化，四個一定要背過……一個是理論。（47-010）", "投影片黃字／黃筆標記（47-010）", "老師：「把本節的內容…去進行一個背誦」（47 srt 39:05）"]}, {"id": "C47-11", "l": 47, "ch": 14, "s": [12], "src": "", "tag": ["必背", "簡答題考點"], "t": "到本世紀中葉全面建成世界一流軍隊（三個標準）", "p": "（1）建成同我國強國地位相稱的世界一流軍隊（只有擁有世界一流軍隊，才能稱得上真正的世界強國）；（2）建成能夠全面有效維護國家安全的世界一流軍隊；（3）建成具備強大國際影響力的世界一流軍隊。", "o": "建成同我国〖强国地位相称〗的世界一流军队；建成能够〖全面有效维护国家安全〗的世界一流军队；建成具备〖强大国际影响力〗的世界一流军队", "m": "「相稱・全面有效・國際影響力」。", "items": ["建成同我国强国地位相称的世界一流军队", "建成能够全面有效维护国家安全的世界一流军队", "建成具备强大国际影响力的世界一流军队"], "pt": "A", "ps": 28, "pr": ["老師：…現軍隊的現代化四個一定要背過 第一個軍事理論突出的是…（47-012）", "老師：分別是什麼 一定要記住 一個是理論啊（47-012）", "投影片黃字／黃筆標記（47-012）"]}, {"id": "C48-01", "l": 48, "ch": 14, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "黨對人民軍隊的絕對領導是建軍之本、強軍之魂", "p": "講師：「是建軍之本、強軍之魂，選擇題」「背的時候你就只背黃色的就可以。」堅持黨對人民軍隊的絕對領導，是馬克思主義建黨建軍的一條基本原則；黨對人民軍隊的絕對領導，是建軍之本、強軍之魂。", "o": "坚持党对人民军队的绝对领导，是马克思主义建党建军的一条〖基本原则〗；党对人民军队的绝对领导，是〖建军之本〗、〖强军之魂〗", "m": "「基本原則；建軍之本・強軍之魂」。", "pt": "A", "ps": 34, "pr": ["老師：黃色內容呢 要重點背誦 好（48-003）", "老師：…麼 是建軍之本強軍之魂選擇題 怎麼考（48-003）", "投影片黃字／黃筆標記（48-003）"]}, {"id": "C48-02", "l": 48, "ch": 14, "s": [4], "src": "", "tag": ["選擇題考點"], "t": "黨對軍隊絕對領導的一整套制度", "p": "堅持黨對人民軍隊的絕對領導必須有一整套制度作保證：軍隊最高領導權和指揮權屬於黨中央、中央軍委，中央軍委實行主席負責制；實行黨委制、政治委員制、政治機關制；實行黨委（支部）統一的集體領導下的首長分工負責制；實行支部建在連上。這些制度是人民軍隊完全區別於一切舊軍隊的政治特質和根本優勢（具體制度講師說「不需要去背」）。", "o": "军队最高领导权和指挥权属于〖党中央〗、〖中央军委〗，中央军委实行〖主席负责制〗；实行〖支部建在连上〗", "m": "「最高權屬黨中央・中央軍委；支部建在連上」。", "pt": "A", "ps": -1, "pr": ["老師：你要注意 它會考一個選擇題 軍委主席負責制（48-004）", "投影片黃字／黃筆標記（48-004）"]}, {"id": "C48-03", "l": 48, "ch": 14, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "軍委主席負責制：根本制度和根本實現形式", "p": "講師：「它會考一個選擇題：軍委主席負責制是黨對人民軍隊領導的根本制度和根本實現形式……屬於統領的地位。」軍委主席負責制在黨領導軍隊的一整套制度體系中處於最高層次，居於統領地位；中央軍委主席負責中央軍委全面工作、領導指揮全國武裝力量、決定國防和軍隊建設一切重大問題。", "o": "〖军委主席负责制〗是坚持党对人民军队绝对领导的〖根本制度〗和〖根本实现形式〗，在党领导军队的一整套制度体系中处于〖最高层次〗，居于〖统领地位〗", "m": "「主席負責制＝根本制度＋根本實現形式＝最高層次・統領地位」。", "pt": "A", "ps": 18, "pr": ["老師：你要注意 它會考一個選擇題 軍委主席負責制（48-004）", "投影片黃字／黃筆標記（48-004）"]}, {"id": "C48-04", "l": 48, "ch": 14, "s": [5, 6, 7, 8, 9], "src": "", "tag": ["必背", "簡答題考點"], "t": "政治建軍、改革強軍、科技強軍、人才強軍、依法治軍", "p": "知識點2 五個「強軍」各有一句定位（都是選擇題考點）：政治建軍是人民軍隊的立軍之本；改革是決定人民軍隊發展壯大、制勝未來的關鍵一招；科技是核心戰鬥力，是軍事發展中最活躍、最具革命性的因素；強軍之道，要在得人；依法治軍是我們黨建軍治軍基本方式。", "o": "〖政治建军〗是人民军队的〖立军之本〗；〖改革〗是决定人民军队发展壮大、制胜未来的〖关键一招〗；〖科技〗是〖核心战斗力〗，是军事发展中最活跃、最具革命性的因素；强军之道，要在〖得人〗；〖依法治军〗是我们党建军治军〖基本方式〗", "m": "「政治＝立軍之本；改革＝關鍵一招；科技＝核心戰鬥力；人才＝要在得人；依法＝基本方式」。", "items": ["政治建军是人民军队的立军之本", "改革是决定人民军队发展壮大、制胜未来的关键一招", "科技是核心战斗力，是军事发展中最活跃、最具革命性的因素", "强军之道，要在得人", "依法治军是我们党建军治军基本方式"], "pt": "A", "ps": 21, "pr": ["老師：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"id": "C48-05", "l": 48, "ch": 14, "s": [5], "src": "", "tag": ["選擇題考點"], "t": "政治工作是人民軍隊的生命線", "p": "講師：「要充分發揮政治工作對強軍興軍的生命線作用，來注意這個選擇。」政治工作永遠是人民軍隊的生命線；培養有靈魂、有本事、有血性、有品德的新時代革命軍人；鍛造具有鐵一般信仰、鐵一般信念、鐵一般紀律、鐵一般擔當的過硬部隊。黨的領導和黨的建設是人民軍隊建設發展的關鍵。", "o": "政治工作永远是人民军队的〖生命线〗；培养〖有灵魂、有本事、有血性、有品德〗的新时代革命军人；锻造具有铁一般信仰、铁一般信念、铁一般纪律、铁一般担当的过硬部队", "m": "「四有軍人：靈魂・本事・血性・品德；四個鐵一般」。", "pt": "B", "ps": 3, "pr": ["老師：…軍興軍的生命線作用，來注意這個選擇。（48-005）"]}, {"id": "C48-06", "l": 48, "ch": 14, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "改革強軍：軍委管總、戰區主戰、軍種主建", "p": "按照軍委管總、戰區主戰、軍種主建的總原則改革領導指揮體制，實現軍隊組織架構的歷史性變革；人民軍隊實現整體性革命性重塑，體制一新、結構一新、格局一新、面貌一新（下面細節講師說「不須背，只需理解」）。", "o": "按照〖军委管总〗、〖战区主战〗、〖军种主建〗的总原则改革领导指挥体制", "m": "「軍委管總・戰區主戰・軍種主建」。", "pt": "B", "ps": 5, "pr": ["同頁有考點提示：至少未來的關鍵一招 選擇題又來了 什麼是我們人民軍…（48-006）", "投影片黃字／黃筆標記（48-006）"]}, {"id": "C48-07", "l": 48, "ch": 14, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "政治標準是人才第一位的標準", "p": "人才是推動人民軍隊高質量發展、贏得軍事競爭和未來戰爭主動的關鍵因素；堅持政治標準是人民軍隊人才第一位的標準；堅持把能打仗、打勝仗作為人才工作出發點和落腳點（講師：「選擇題」）。", "o": "坚持〖政治标准〗是人民军队人才〖第一位的标准〗；坚持把〖能打仗、打胜仗〗作为人才工作出发点和落脚点", "m": "「政治第一位；打勝仗＝出發點和落腳點」。", "pt": "A", "ps": 12, "pr": ["老師：選擇題（48-008）", "投影片黃字／黃筆標記（48-008）"]}, {"id": "C48-08", "l": 48, "ch": 14, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "一支現代化軍隊必然是法治軍隊", "p": "一支現代化軍隊必然是法治軍隊。厲行法治、嚴肅軍紀，是治軍帶兵的鐵律，也是建設強大軍隊的基本規律。全面加強軍事治理是治軍理念和方式的一場深刻變革。", "o": "一支现代化军队必然是〖法治军队〗；厉行法治、严肃军纪，是治军带兵的〖铁律〗，也是建设强大军队的〖基本规律〗", "m": "「現代化軍隊＝法治軍隊」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（48-009）"]}, {"id": "C48-09", "l": 48, "ch": 14, "s": [11], "src": "", "tag": ["必背", "選擇題考點", "簡答題考點"], "t": "戰鬥力是唯一的根本的標準", "p": "講師：「在於戰鬥力
