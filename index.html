<script>
const DATA={"chapters": [{"n": "導論", "a": 1, "b": 2}, {"n": "第一章 新時代堅持和發展中國特色社會主義", "a": 3, "b": 5}, {"n": "第二章 以中國式現代化全面推進中華民族偉大復興", "a": 6, "b": 8}, {"n": "第三章 堅持黨的全面領導", "a": 9, "b": 11}, {"n": "第四章 堅持以人民為中心", "a": 12, "b": 14}, {"n": "第五章 全面深化改革開放", "a": 15, "b": 17}, {"n": "第六章 推動高質量發展", "a": 18, "b": 21}, {"n": "第七章 社會主義現代化建設的教育科技人才戰略", "a": 22, "b": 25}, {"n": "第八章 發展全過程人民民主", "a": 26, "b": 29}, {"n": "第九章 全面依法治國", "a": 30, "b": 32}, {"n": "第十章 建設社會主義文化強國", "a": 33, "b": 36}], "lt": {"1": "導論（上）", "2": "導論（下）", "3": "方向決定道路，道路決定命運", "4": "中國特色社會主義進入新時代", "5": "新時代堅持和發展中國特色社會主義要一以貫之", "6": "中華民族近代以來最偉大的夢想", "7": "中國式現代化是強國建設、民族復興的唯一正確道路", "8": "推進中國式現代化行穩致遠", "9": "中國共產黨領導是中國特色社會主義最本質的特徵", "10": "堅持黨對一切工作的領導", "11": "健全和完善黨的領導制度體系", "12": "江山就是人民，人民就是江山", "13": "堅持人民至上", "14": "全面落實以人民為中心的發展思想", "15": "改革開放是決定當代中國命運的關鍵一招", "16": "統籌推進各領域各方面改革開放", "17": "將改革開放進行到底", "18": "完整、準確、全面貫徹新發展理念", "19": "堅持和完善社會主義基本經濟制度", "20": "加快構建新發展格局", "21": "建設現代化經濟體系", "22": "全面建設社會主義現代化國家的基礎性、戰略性支撐", "23": "加快建設教育強國", "24": "加快建設科技強國", "25": "加快建設人才強國", "26": "堅定中國特色社會主義政治制度自信", "27": "全過程人民民主是社會主義民主政治的本質屬性", "28": "健全人民當家作主的制度體系", "29": "鞏固和發展新時代愛國統一戰線", "30": "堅持中國特色社會主義法治道路", "31": "建設中國特色社會主義法治體系", "32": "加快建設法治中國", "33": "文化是民族生存和發展的重要力量", "34": "建設具有強大凝聚力和引領力的社會主義意識形態", "35": "以社會主義核心價值觀引領文化建設", "36": "鑄就社會主義文化新輝煌"}, "cards": [{"id": "C01-01", "l": 1, "ch": 0, "s": [7, 8, 9, 10, 11], "src": "", "tag": ["必背", "簡答題考點", "錯題"], "t": "思想創立的時代背景（五個標題）", "p": "習近平新時代中國特色社會主義思想是在什麼「大環境」下產生的？共有五個背景：世界在大變、民族復興到了關鍵時候、中國式現代化在推進、科學社會主義在中國很有生命力、共產黨自我革命有新進展。考簡答題時，只要寫出這五個標題就可以。", "o": "（一）世界百年未有之大变局加速演进；（二）中华民族伟大复兴进入关键时期；（三）中国式现代化全面推进拓展；（四）科学社会主义在21世纪的中国焕发蓬勃生机；（五）中国共产党自我革命开辟新的境界", "m": "口訣「世・復・現・科・革」＝世界→復興→現代化→科社→自我革命（由外到內、由大到小）。易錯字：中华、伟大、中国式、拓展、蓬勃、开辟；「关键时期」不是「時刻」。", "items": ["世界百年未有之大变局加速演进", "中华民族伟大复兴进入关键时期", "中国式现代化全面推进拓展", "科学社会主义在21世纪的中国焕发蓬勃生机", "中国共产党自我革命开辟新的境界"]}, {"id": "C01-02", "l": 1, "ch": 0, "s": [7], "src": "", "tag": ["選擇題考點"], "t": "世界百年未有之大變局（曾考過）", "p": "「百年未有之大變局」是講師說「曾經考過的考點」。意思是：世界局勢正出現一百年來都沒有過的大變化。投影片黃字還寫了時代潮流是「和平、發展、合作、共贏」，而世界也進入「新的動盪變革期」。補充：毛澤東思想的時代主題是「戰爭與革命」，鄧小平理論以後是「和平與發展」。", "o": "世界百年未有之大变局加速演进：1. 〖和平、发展、合作、共赢〗；2. 世界进入新的〖动荡变革期〗", "m": "「和・發・合・贏」四個字；「動盪變革『期』」——是「期」不是「區」。"}, {"id": "C01-03", "l": 1, "ch": 0, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "中華民族偉大復興＝共同夢想＋奮鬥目標", "p": "民族復興對中國人民來說是「大家一直的共同夢想」；對共產黨來說是「一直不放棄的奮鬥目標」。講師說標黃的這句要記住。", "o": "实现中华民族伟大复兴是近代以来中国人民的〖共同梦想〗，是中国共产党〖矢志不渝〗的奋斗目标", "m": "「人民→夢想；黨→目標」。矢志不渝＝發誓不改變。"}, {"id": "C01-04", "l": 1, "ch": 0, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "三個「獨特」決定中國走自己的現代化道路", "p": "中國有自己獨特的文化、歷史和國情，所以不能照抄別人，一定要走適合自己的現代化道路。", "o": "〖独特的文化传统〗、〖独特的历史命运〗、〖独特的基本国情〗，决定了中国必然走适合自己特点的现代化道路", "m": "「文・史・情」三個獨特：文化傳統、歷史命運、基本國情。"}, {"id": "C01-05", "l": 1, "ch": 0, "s": [10], "src": "", "tag": ["必背", "選擇題考點"], "t": "中國特色社會主義＝旗幟＋中流砥柱", "p": "中國特色社會主義已成為21世紀科學社會主義的「代表旗幟」，也是讓世界社會主義重新振作的「最重要支柱」（中流砥柱＝激流中穩穩站着的大石頭）。", "o": "中国特色社会主义正式成为21世纪科学社会主义发展的〖旗帜〗，成为振兴世界社会主义的〖中流砥柱〗", "m": "「一面旗、一根柱」：發展的旗幟、振興的中流砥柱。"}, {"id": "C01-06", "l": 1, "ch": 0, "s": [11], "src": "", "tag": ["必背", "選擇題考點", "錯題", "易混"], "t": "跳出歷史周期律的兩個答案", "p": "「歷史周期律」＝古代王朝總是興起後又衰敗的循環。怎樣跳出？第一個答案（毛澤東回答黃炎培）：讓人民來監督政府；第二個答案（新時代找到的）：黨自己改正自己的錯誤，就是自我革命。選擇題常考「第二個答案＝自我革命」，千萬不要對調。", "o": "第一个答案：〖人民监督〗（毛泽东回答黄炎培）；第二个答案：自我革命——「〖自我革命〗这个跳出治乱兴衰历史周期律的第二个答案」", "m": "次序口訣「先靠人民，後靠自己」：一＝人民監督（外人看着你），二＝自我革命（自己管自己）。"}, {"id": "C01-07", "l": 1, "ch": 0, "s": [12], "src": "", "tag": ["必背", "選擇題考點"], "t": "「兩個結合」", "p": "把馬克思主義和兩樣東西結合：一是中國的實際情況，二是中華「優秀」傳統文化（是優秀的，不是腐朽的）。講師說這是「我們取得成功的最大法寶」。", "o": "马克思主义基本原理同〖中国具体实际〗相结合、同〖中华优秀传统文化〗相结合", "m": "「一個馬，兩條繩」：一條繫「中國實際」，一條繫「優秀傳統文化」。注意「優秀」兩字。"}, {"id": "C01-08", "l": 1, "ch": 0, "s": [14], "src": "", "tag": ["必背", "多選題考點"], "t": "思想回答的重大時代課題（三問）", "p": "這個思想主要回答三組問題：（1）中國特色社會主義要怎樣堅持、怎樣發展；（2）要建成怎樣的現代化強國、怎樣建；（3）要把黨建成怎樣的長期執政的黨、怎樣建。講師說第一個最主要，可考多選題。", "o": "新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国，怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党，怎样建设长期执政的马克思主义政党", "m": "三個「什麼樣＋怎樣」：中特（主義）→強國（國家）→政黨（黨）。「主義・國・黨」。", "items": ["新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义", "建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国", "建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党"]}, {"id": "C01-09", "l": 1, "ch": 0, "s": [15], "src": "", "tag": ["選擇題考點"], "t": "思想的豐富內涵（四大部分）", "p": "這個思想的內容主要由四組組成：十個明確、十四個堅持、十三個方面成就、六個必須堅持。講師說十個明確、十四個堅持、六個必須堅持都「必須背熟」。", "o": "“〖十个明确〗”“〖十四个坚持〗”“〖十三个方面成就〗”“〖六个必须坚持〗”", "m": "數字口訣「10-14-13-6」。"}, {"id": "C01-10", "l": 1, "ch": 0, "s": [16], "src": "", "tag": ["必背", "選擇題考點"], "t": "十個明確（1）最本質的特徵", "p": "中國特色社會主義「最」重要、最根本的特點是什麼？就是由中國共產黨領導。題目只要出現「最本質的特徵」，答案就是黨的領導。", "o": "明确中国特色社会主义最本质的特征是〖中国共产党领导〗", "m": "看到「最本質」→ 黨的領導。"}, {"id": "C01-11", "l": 1, "ch": 0, "s": [16], "src": "", "tag": ["必背", "選擇題考點", "錯題"], "t": "十個明確（2）總任務", "p": "「總任務」就是最大的總目標：實現社會主義現代化和中華民族偉大復興。分兩步走，到本世紀中葉（2050年）建成現代化強國。", "o": "明确坚持和发展中国特色社会主义，总任务是实现〖社会主义现代化〗和〖中华民族伟大复兴〗，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴", "m": "總任務＝「現代化＋復興」兩件事；強國五個形容詞「富強・民主・文明・和諧・美麗」（富民文和美）。手寫：2021、2050。"}, {"id": "C01-12", "l": 1, "ch": 0, "s": [17], "src": "", "tag": ["必背"], "t": "十個明確（3）社會主要矛盾", "p": "現在中國社會最主要的「問題」：人民想要更好的生活，但發展還不夠平衡、不夠充分。所以要以人民為中心。", "o": "明确新时代我国社会主要矛盾是人民日益增长的〖美好生活需要〗和〖不平衡不充分〗的发展之间的矛盾；〖坚持以人民为中心〗", "m": "「想要的（美好生活）」VS「做到的（不平衡不充分）」。"}, {"id": "C01-13", "l": 1, "ch": 0, "s": [18], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "十個明確（4）總體布局與戰略布局", "p": "總體布局「五位一體」＝五個方面一起建設（經濟、政治、文化、社會、生態文明）；戰略布局「四個全面」＝四件大事全面推進。注意：五位一體是「總體」布局，四個全面是「戰略」布局，不要調轉。", "o": "明确中国特色社会主义事业〖总体布局〗是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，〖战略布局〗是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面", "m": "「五總四戰」：五位一體→總體；四個全面→戰略。五位：經・政・文・社・生（「經政文社生」）。"}, {"id": "C01-14", "l": 1, "ch": 0, "s": [18], "src": "", "tag": ["選擇題考點"], "t": "十個明確（5）全面深化改革總目標", "p": "全面深化改革要做到兩件事：把中國特色社會主義制度弄得更好，並讓國家管理的體系和能力現代化。", "o": "完善和发展〖中国特色社会主义制度〗，推进〖国家治理体系和治理能力现代化〗", "m": "「一制度、一治理」兩句話。"}, {"id": "C01-15", "l": 1, "ch": 0, "s": [19], "src": "", "tag": ["選擇題考點"], "t": "十個明確（6）（7）法治總目標、經濟要點", "p": "（6）講全面推進依法治國的總目標；（7）講經濟：市場在資源配置中起決定性作用；貫徹新發展理念（創新、協調、綠色、開放、共享）；以國內大循環為主體、國內國際雙循環相互促進。", "o": "（6）全面推进依法治国总目标；（7）市场在资源配置中起〖决定性作用〗；贯彻〖创新、协调、绿色、开放、共享〗；以〖国内大循环〗为主体、国内国际双循环相互促进", "m": "經濟三寶：「市場決定・五大理念・雙循環」。"}, {"id": "C01-16", "l": 1, "ch": 0, "s": [20], "src": "", "tag": ["必背", "選擇題考點"], "t": "十個明確（8）強軍目標", "p": "人民軍隊要做到三點：聽黨的指揮、能打勝仗、作風優良。講師說「能打勝仗是核心，是最重要的」。", "o": "〖听党指挥〗、〖能打胜仗〗、〖作风优良〗", "m": "「聽・打・風」：聽話、打贏、作風好；核心＝能打勝仗。"}, {"id": "C01-17", "l": 1, "ch": 0, "s": [20], "src": "", "tag": ["選擇題考點"], "t": "十個明確（9）（10）外交與從嚴治黨", "p": "（9）中國特色大國外交；（10）全面從嚴治黨的戰略方針。講師特別提醒：「把制度建設貫穿其中」很喜歡考選擇題。", "o": "（9）〖中国特色大国外交〗；（10）全面从严治党的战略方针……把〖制度建设〗贯穿其中", "m": "從嚴治黨關鍵詞＝「制度建設貫穿其中」。"}, {"id": "C02-01", "l": 2, "ch": 0, "s": [2, 3], "src": "", "tag": ["必背"], "t": "十四個堅持（基本方略）", "p": "「十四個堅持」是新時代的基本方略，像一份「做事清單」。第一條永遠是黨的領導，最後一條是全面從嚴治黨「兜底」。講師要求必須背熟。", "o": "（1）坚持党对一切工作的领导；（2）坚持以人民为中心；（3）坚持全面深化改革；（4）坚持新发展理念；（5）坚持人民当家作主；（6）坚持全面依法治国；（7）坚持社会主义核心价值体系；（8）坚持在发展中保障和改善民生；（9）坚持人与自然和谐共生；（10）坚持总体国家安全观；（11）坚持党对人民军队的绝对领导；（12）坚持“一国两制”和推进祖国统一；（13）坚持推动构建人类命运共同体；（14）坚持全面从严治党", "m": "頭尾記牢：「黨領導開頭、從嚴治黨收尾」。中間口訣：「人・改・新・主・法・價・民・生・安・軍・統・命」（人民中心→改革→新理念→當家作主→法治→核心價值體系→民生→生態→安全→軍隊→統一→命運共同體）。", "items": ["坚持党对一切工作的领导", "坚持以人民为中心", "坚持全面深化改革", "坚持新发展理念", "坚持人民当家作主", "坚持全面依法治国", "坚持社会主义核心价值体系", "坚持在发展中保障和改善民生", "坚持人与自然和谐共生", "坚持总体国家安全观", "坚持党对人民军队的绝对领导", "坚持“一国两制”和推进祖国统一", "坚持推动构建人类命运共同体", "坚持全面从严治党"]}, {"id": "C02-02", "l": 2, "ch": 0, "s": [4, 5, 6, 7, 8, 9, 10], "src": "", "tag": ["了解", "選擇題考點"], "t": "十三個方面的成就（13個小標題）", "p": "新時代在十三個方面取得了成就。講師說考得不多，但黃色小標題「至少要記住」，有個印象即可。", "o": "（1）在坚持党的全面领导上；（2）在全面从严治党上；（3）在经济建设上；（4）在全面深化改革开放上；（5）在政治建设上；（6）在全面依法治国上；（7）在文化建设上；（8）在社会建设上；（9）在生态文明建设上；（10）在国防和军队建设上；（11）在维护国家安全上；（12）在坚持“一国两制”和推进祖国统一上；（13）在外交工作上", "m": "「黨・嚴・經・改・政・法・文・社・生・軍・安・統・外」——先黨（2條），再五位一體夾着改革和法治，最後軍、安、統一、外交。", "items": ["在坚持党的全面领导上", "在全面从严治党上", "在经济建设上", "在全面深化改革开放上", "在政治建设上", "在全面依法治国上", "在文化建设上", "在社会建设上", "在生态文明建设上", "在国防和军队建设上", "在维护国家安全上", "在坚持“一国两制”和推进祖国统一上", "在外交工作上"]}, {"id": "C02-03", "l": 2, "ch": 0, "s": [11, 12, 13, 14], "src": "", "tag": ["必背", "選擇題考點"], "t": "六個必須堅持——各自的定位", "p": "六個「必須堅持」是這個思想的「立場、觀點、方法」。每一個都有自己的「身份」：人民至上是立場，自信自立是精神特質，守正創新是理論品格，問題導向是實踐要求，系統觀念是思想和工作方法，胸懷天下是境界格局。", "o": "必须坚持〖人民至上〗，是根本价值立场；必须坚持〖自信自立〗，是内在精神特质；必须坚持〖守正创新〗，是鲜明理论品格；必须坚持〖问题导向〗，是重要实践要求；必须坚持〖系统观念〗，是基本思想和工作方法；必须坚持〖胸怀天下〗，中国共产党人的境界格局", "m": "六個名稱口訣「人・自・守・問・系・胸」（人自守問系胸＝「人自守，問系胸」）；定位口訣「立場・特質・品格・要求・方法・格局」。", "items": ["必须坚持人民至上——根本价值立场", "必须坚持自信自立——内在精神特质", "必须坚持守正创新——鲜明理论品格", "必须坚持问题导向——重要实践要求", "必须坚持系统观念——基本思想和工作方法", "必须坚持胸怀天下——中国共产党人的境界格局"]}, {"id": "C02-04", "l": 2, "ch": 0, "s": [11, 12, 13, 14], "src": "", "tag": ["必背", "易混"], "t": "六個必須堅持——各自「體現了」什麼原理", "p": "除了定位，後半句講它「體現了」哪個哲學道理。例如自信自立＝客觀規律＋主觀能動（既按規律辦事，又發揮人的積極性）；系統觀念＝普遍聯繫（看事情要看整體、看關係）。", "o": "自信自立，体现了〖客观规律性和主观能动性的有机结合〗；守正创新，体现了〖变与不变，继承与发展的内在联系〗；问题导向，体现了〖矛盾的普遍性和客观性〗；系统观念，体现了〖辩证唯物主义普遍联系的原理〗；胸怀天下，体现了〖马克思主义追求人类进步和解放的崇高理想〗", "m": "對號入座：自信自立↔「規律＋能動」；守正創新↔「變與不變」（守＝不變，創＝變）；問題導向↔「矛盾」（問題就是矛盾）；系統觀念↔「普遍聯繫」（系統＝連在一起）；胸懷天下↔「人類進步和解放」（天下＝全人類）。"}, {"id": "C02-05", "l": 2, "ch": 0, "s": [11], "src": "", "tag": ["選擇題考點"], "t": "人民性是馬克思主義的本質屬性", "p": "馬克思主義最根本的特點是「為人民」。講師說這句「當選擇題來準備」。（同頁白字：人民至上體現了歷史唯物主義群眾史觀。）", "o": "〖人民性〗是马克思主义的本质属性", "m": "「人民至上」→「人民性」→馬克思主義的「本質屬性」。"}, {"id": "C02-06", "l": 2, "ch": 0, "s": [13], "src": "逐字稿", "tag": ["選擇題考點"], "t": "問題是時代的聲音", "p": "每個時代都有自己要解決的問題；理論最根本的任務，就是回答並指導解決這些問題。（講師講「問題導向」時說的話）", "o": "问题是〖时代的声音〗，回答并指导解决问题是理论的〖根本任务〗", "m": "「問題＝時代在說話；理論＝要回答它」。"}, {"id": "C02-07", "l": 2, "ch": 0, "s": [15], "src": "", "tag": ["必背", "選擇題考點", "錯題"], "t": "思想的歷史地位：寫入黨章、寫入憲法", "p": "這個思想先寫進黨的「規章」（黨章），再寫進國家的「根本法」（憲法）。時間節點是選擇題考點：2017年10月黨的十九大寫入黨章；2018年3月十三屆全國人大一次會議寫入憲法。", "o": "2017年10月，〖党的十九大〗……把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并庄严地写入党章；2018年3月，〖十三届全国人大一次会议〗通过的宪法修正案，郑重地把习近平新时代中国特色社会主义思想载入宪法", "m": "「先黨後國」：先黨章（十九大，2017.10）→後憲法（人大，2018.3）。黨的事看「黨代會」，國家的事看「人大」。"}, {"id": "C02-08", "l": 2, "ch": 0, "s": [15], "src": "", "tag": ["選擇題考點"], "t": "歷代指導思想寫入黨章的會議（串聯記憶）", "p": "講師把歷代指導思想寫入黨章的大會串起來記：毛澤東思想—七大；鄧小平理論—十五大；「三個代表」—十六大；習近平新時代中國特色社會主義思想—十九大。（科學發展觀講師說「十七和十八」，投影片該處被擋。）", "o": "毛泽东思想——党的〖七大〗；邓小平理论——〖十五大〗；“三个代表”重要思想——〖十六大〗；习近平新时代中国特色社会主义思想——〖十九大〗", "m": "「七・十五・十六・十九」；習思想最新＝十九大。"}, {"id": "C02-09", "l": 2, "ch": 0, "s": [16], "src": "", "tag": ["必背", "錯題"], "t": "「兩個確立」的內涵", "p": "「兩個確立」＝兩件被確定下來的事：一是確立習近平同志的核心地位（人），二是確立習近平新時代中國特色社會主義思想的指導地位（思想）。是十九屆六中全會提出的。兩條都要寫齊。", "o": "党的〖十九届六中全会〗指出，党确立〖习近平同志党中央的核心、全党的核心地位〗，确立〖习近平新时代中国特色社会主义思想的指导地位〗", "m": "「一人一思想」：確立「人」的核心地位＋確立「思想」的指導地位。", "items": ["确立习近平同志党中央的核心、全党的核心地位", "确立习近平新时代中国特色社会主义思想的指导地位"]}, {"id": "C02-10", "l": 2, "ch": 0, "s": [17], "src": "", "tag": ["必背", "錯題"], "t": "「兩個確立」的決定性意義（三個「最大」）", "p": "「兩個確立」為什麼重要？因為世界上有很多不確定的事，而它是黨和人民面對一切不確定時「最可靠的確定、最大的信心、最大的保障」。講師：記住標黃的這句就行。", "o": "是党和人民应对一切不确定性的〖最大确定性〗、〖最大底气〗、〖最大保证〗", "m": "三個「最大」：「確定性・底氣・保證」（定・氣・保）。"}, {"id": "C02-11", "l": 2, "ch": 0, "s": [19], "src": "", "tag": ["了解"], "t": "學好用好思想的方法（不用重點背）", "p": "講師說這部分「不需要去重點背」。方法只有三點：堅定理想信念、提高理論水平、增強實踐能力。", "o": "1. 坚定理想信念 2. 提高理论水平 3. 增强实践能力", "m": "「信念・理論・實踐」。"}, {"id": "C03-01", "l": 3, "ch": 1, "s": [5], "src": "", "tag": ["必背", "錯題"], "t": "道路問題是第一位的問題（屬知識點1）", "p": "走哪一條路，決定黨的事業成功還是失敗，所以「道路問題」排第一位。講師：「這一句話你必須要記住。」注意它屬於知識點1「中國特色社會主義是歷史和人民的選擇」，不是知識點2。", "o": "道路问题是关系党的事业〖兴衰成败〗〖第一位〗的问题", "m": "「路對了，事業才興」。歸屬口訣：「道路→選擇」（選路＝歷史和人民的選擇＝知識點1）。"}, {"id": "C03-02", "l": 3, "ch": 1, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "一個國家實行什麼主義的標準", "p": "判斷一個「主義」好不好，就看它能不能解決這個國家當時面對的大問題。", "o": "一个国家实行什么样的主义，关键要看这个主义能否解决这个国家面临的〖历史性课题〗", "m": "「主義好不好，看能否解題」——解「歷史性課題」。"}, {"id": "C03-03", "l": 3, "ch": 1, "s": [7, 8, 9, 10], "src": "", "tag": ["選擇題考點"], "t": "歷代領導人串聯記憶（中特道路的探索）", "p": "講師要求把歷代領導人「串聯着記憶」：毛澤東領導新民主主義革命、確立社會主義基本制度；鄧小平是中特的開創人；江澤民深化了對「建設什麼樣的黨、怎樣建設黨」的認識；胡錦濤回答「新形勢下實現什麼樣的發展、怎樣發展」；十八大以來是「更好堅持和發展中國特色社會主義」。", "o": "毛泽东同志——〖新民主主义革命〗、确立〖社会主义基本制度〗；邓小平同志——中特开创人；江泽民同志——对什么是社会主义、怎样建设社会主义、〖建设什么样的党、怎样建设党〗的认识；胡锦涛同志——〖新形势下实现什么样的发展、怎样发展〗等重大问题；十八大以来——〖更好坚持和发展中国特色社会主义〗", "m": "「毛定制度、鄧開中特、江建黨、胡講發展、十八大以來更好發展中特」。"}, {"id": "C03-04", "l": 3, "ch": 1, "s": [8], "src": "", "tag": ["選擇題考點", "易混"], "t": "鄧小平是中特的開創人", "p": "中國特色社會主義是鄧小平開創的（十二大提出把它作為全黨實踐的主題）。講師提醒：如果選項說在毛澤東時期就出現「中特」，那是錯的。同頁黃字：「什麼是社會主義、怎樣建設社會主義，是中國共產黨人思考的基本問題」。", "o": "中国特色社会主义道路是中国走向发展繁荣的正确道路；〖什么是社会主义、怎样建设社会主义〗，是中国共产党人思考的〖基本问题〗", "m": "「中特＝鄧開創」；毛時期 ✗ 中特。"}, {"id": "C03-05", "l": 3, "ch": 1, "s": [11], "src": "", "tag": ["選擇題考點"], "t": "中特高度契合中國文化和價值觀念", "p": "中國特色社會主義受到中國人民擁護，因為它回答了近代以來中華民族遇到的大問題，也指出了民族復興的正確道路。", "o": "中国特色社会主义高度契合中国文化和价值观念……是因为它回答了近代以来中华民族面临的〖历史性课题〗、指明了实现伟大复兴的〖正确道路〗", "m": "「答了課題、指了道路」。"}, {"id": "C03-06", "l": 3, "ch": 1, "s": [12], "src": "", "tag": ["論述題考點"], "t": "中特是社會主義而不是其他什麼主義（三要點）", "p": "中國特色社會主義「歸根到底是社會主義」。理由：它是「理論邏輯（科學社會主義）＋歷史邏輯（中國發展）」的統一；它堅持了科學社會主義的基本原則，又加上中國特色。講師：「可能考大題的概率比較大。」", "o": "中国特色社会主义是科学社会主义〖理论逻辑〗和中国社会发展〖历史逻辑〗的辩证统一……既坚持了〖科学社会主义基本原则〗，又根据时代条件赋予其〖鲜明的中国特色〗", "m": "「一統一、一堅持、一新版」：①理論邏輯＋歷史邏輯辯證統一；②堅持科學社會主義基本原則；③寫出科學社會主義「新版本」（四個不是）。", "items": ["中国特色社会主义是科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一", "中国特色社会主义坚持了科学社会主义基本原则，并根据新的时代条件赋予其鲜明的中国特色", "中国特色社会主义写出了科学社会主义的“新版本”（四个不是）"]}, {"id": "C03-07", "l": 3, "ch": 1, "s": [13], "src": "", "tag": ["必背", "錯題", "易混"], "t": "寫出科學社會主義的「新版本」——四個不是", "p": "當代中國的偉大社會變革是「全新的版本」：不是照抄中國古代、不是照搬馬克思的設想、不是複製別的社會主義國家、更不是模仿外國的現代化。四個詞：母版、模板、再版、翻版（以投影片為準，第一個是「母版」）。", "o": "当代中国的伟大社会变革，不是简单延续我国历史文化的〖母版〗，不是简单套用马克思主义经典作家设想的〖模板〗，不是其他国家社会主义实践的〖再版〗，也不是国外现代化发展的〖翻版〗", "m": "「母・模・再・翻」＝「古・馬・社・外」：古代歷史文化→母版（媽媽生的原版）；馬克思設想→模板（照着刻）；其他社會主義國家→再版（再印一次）；國外現代化→翻版（翻印外國的）。"}, {"id": "C03-08", "l": 3, "ch": 1, "s": [14], "src": "", "tag": ["必背", "選擇題考點", "錯題"], "t": "四個自信的角色（途徑・指南・保障・力量）", "p": "四個「自信」各自扮演一個角色：道路＝實現的途徑（走哪條路）；理論體系＝行動指南（怎麼想）；制度＝根本保障（靠什麼保證）；文化＝精神力量（心裏的力量）。四者統一於中國特色社會主義偉大實踐。", "o": "道路是〖实现途径〗，理论体系是〖行动指南〗，制度是〖根本保障〗，文化是〖精神力量〗，四者统一于中国特色社会主义伟大实践", "m": "「路・指・保・力」：走「路」靠途徑，「理論」當指南針，「制度」做保險，「文化」給力量。"}, {"id": "C03-09", "l": 3, "ch": 1, "s": [14], "src": "", "tag": ["選擇題考點"], "t": "四個自信的來源與文化自信", "p": "四個自信從哪裏來？來自實踐、來自人民、來自真理。中國共產黨和中國人民有深厚的根基和底氣。講師補充：文化自信是更加深沉、更加持久的自信。", "o": "“四个自信”来源于〖实践〗、来源于〖人民〗、来源于〖真理〗；坚定“四个自信”，中国共产党和中国人民有着深厚的〖根基和底气〗", "m": "來源三個：「實・人・真」（實踐、人民、真理）。"}, {"id": "C04-01", "l": 4, "ch": 1, "s": [3], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "新時代是我國發展新的「歷史方位」", "p": "「歷史方位」＝我們現在站在歷史上的哪個位置。中國特色社會主義進入新時代，就是我國發展的新位置、新的發展階段。講師：不是「歷史方向」，也不是「歷史定位」，「一個字都不能錯」。", "o": "中国特色社会主义新时代是我国发展新的〖历史方位〗", "m": "「方位」＝地圖上的「位置」；看到方向、定位都是陷阱。"}, {"id": "C04-02", "l": 4, "ch": 1, "s": [4], "src": "", "tag": ["必背", "論述題考點", "簡答題考點"], "t": "新時代的內涵（五個「的時代」）", "p": "新時代是怎樣的時代？五句話：承前啟後的時代、決勝小康到建設現代化強國的時代、共同富裕的時代、實現中國夢的時代、走近世界舞台中央的時代。講師：大題考點（論述／簡答／材料分析第二小問），要背。", "o": "（一）承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代；（二）决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代；（三）全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代；（四）全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代；（五）我国日益走近世界舞台中央、不断为人类作出更大贡献的时代", "m": "五個關鍵詞「承・決・富・夢・世」：承前啟後→決勝小康→共同富裕→中國夢→世界舞台。由過去→現在→人民→民族→世界。", "items": ["承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代", "决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代", "全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代", "全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代", "我国日益走近世界舞台中央、不断为人类作出更大贡献的时代"]}, {"id": "C04-03", "l": 4, "ch": 1, "s": [5], "src": "", "tag": ["必背"], "t": "新時代的意義（三個「意味着」）", "p": "進入新時代意味着什麼？（一）對民族：從站起來、富起來到強起來；（二）對科學社會主義：在21世紀的中國煥發生機活力；（三）對世界：給發展中國家走向現代化提供了全新選擇和中國方案。講師：三個意義也要背。", "o": "（一）意味着近代以来久经磨难的中华民族迎来了从〖站起来、富起来到强起来〗的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景；（二）意味着科学社会主义在21世纪的中国焕发出强大〖生机活力〗，在世界上高高举起了中国特色社会主义伟大旗帜；（三）意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了〖全新选择〗，为解决人类问题贡献了〖中国智慧和中国方案〗", "m": "「民族・科社・世界」三層：站富強→生機活力→全新選擇＋中國方案。", "items": ["中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景", "科学社会主义在21世纪的中国焕发出强大生机活力，高高举起了中国特色社会主义伟大旗帜", "拓展了发展中国家走向现代化的途径，提供了全新选择，为解决人类问题贡献了中国智慧和中国方案"]}, {"id": "C04-04", "l": 4, "ch": 1, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "社會主要矛盾的轉化", "p": "以前的主要矛盾：人民想要更多物質文化，但生產落後；現在：人民想要更美好的生活，但發展不平衡、不充分。例子：以前是「吃不飽」，現在是「想吃得好、住得好、環境好」，但城鄉、地區發展還不平均。講師：主要矛盾變化是黨作出「進入新時代」重大判斷的根本依據。", "o": "人民日益增长的〖物质文化需要〗同〖落后的社会生产〗之间的矛盾，转化为人民日益增长的〖美好生活需要〗和〖不平衡不充分的发展〗之间的矛盾", "m": "「舊：物質文化 vs 落後生產；新：美好生活 vs 不平衡不充分」。舊用「同」，新用「和」。"}, {"id": "C04-05", "l": 4, "ch": 1, "s": [7], "src": "", "tag": ["必背", "簡答題考點"], "t": "進入新時代黨的主要任務", "p": "講師：問「進入新時代的主要任務有哪些」，就把這一整段答進去。白話：顧好國內國際兩個大局、留意國際形勢、抓住黨的主要任務、全面推進事業、發展科學社會主義、為人類作貢獻。", "o": "坚持和发展新时代中国特色社会主义，要牢牢把握〖国内国际两个大局〗，密切关注国际形势发展变化，始终扭住新时代党的〖主要任务〗，全面推进党和国家事业发展，以更加昂扬的姿态发展〖科学社会主义〗，为人类进步事业作出新的更大贡献", "m": "六步「兩局→形勢→任務→事業→科社→人類」。"}, {"id": "C04-06", "l": 4, "ch": 1, "s": [9], "src": "", "tag": ["選擇題考點", "多選題考點"], "t": "美好生活需要的新內容", "p": "人民的需要不只是吃穿，還要求民主、法治、公平、正義、安全、環境等方面更好；而問題主要是發展不平衡不充分。", "o": "人民……在〖民主、法治、公平、正义、安全、环境〗等方面的要求日益增长……〖发展不平衡不充分〗", "m": "六樣：「民・法・公・正・安・環」。", "items": ["民主", "法治", "公平", "正义", "安全", "环境"]}, {"id": "C04-07", "l": 4, "ch": 1, "s": [11], "src": "逐字稿", "tag": ["必背", "選擇題考點"], "t": "「一個變，兩個沒有變」", "p": "主要矛盾「變了」，但兩件事「沒變」：我國仍處於並將長期處於社會主義初級階段的基本國情沒變；我國是世界最大發展中國家的國際地位沒變。", "o": "我国仍将长期处于〖社会主义初级阶段〗的基本国情没有变；我国仍然是世界上〖最大的发展中国家〗的国际地位没有变", "m": "「一變（矛盾）兩不變（初級階段、最大發展中國家）」。", "items": ["主要矛盾发生了变化", "社会主义初级阶段的基本国情没有变", "世界上最大的发展中国家的国际地位没有变"]}, {"id": "C04-08", "l": 4, "ch": 1, "s": [12, 13, 14, 15], "src": "", "tag": ["了解", "選擇題考點"], "t": "新時代的偉大變革（13方面黃字關鍵詞）", "p": "新時代在13個方面發生偉大變革（與第02堂「十三個方面成就」對應）。黃字關鍵詞包括：黨的領導全面加強、全面從嚴治黨不斷深化、新發展階段／新發展理念／新發展格局、全過程人民民主、依法治國、核心價值觀、優秀傳統文化、人民生活、美麗中國、人民軍隊、國家安全、兩岸關係主導權和主動權、外交。講師：反腐敗鬥爭「取得了壓倒性勝利」。", "o": "党的领导全面加强；全面从严治党不断深化；〖把握新发展阶段、贯彻新发展理念、构建新发展格局〗；全过程人民民主得到全面发展；……牢牢把握两岸关系〖主导权和主动权〗", "m": "對照第02堂十三個成就的次序記。"}, {"id": "C04-09", "l": 4, "ch": 1, "s": [16], "src": "", "tag": ["選擇題考點"], "t": "偉大變革的里程碑意義（1）", "p": "新時代的偉大變革使黨和人民群眾一直保持「血肉」般的緊密聯繫。", "o": "党同人民群众始终保持〖血肉联系〗", "m": "「血肉」＝像身體的血和肉，分不開。"}, {"id": "C05-01", "l": 5, "ch": 1, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "黨的基本理論＝行動指南；馬克思主義行", "p": "黨的基本理論是中國特色社會主義的「行動指南」。共產黨為什麼「能」、中特為什麼「好」？說到底是因為馬克思主義行，而且是中國化時代化的馬克思主義行。", "o": "中国共产党为什么能，中国特色社会主义为什么好，归根到底是〖马克思主义行〗，是〖中国化时代化的马克思主义行〗", "m": "「能・好・行」：黨能、中特好、因為馬克思主義行。"}, {"id": "C05-02", "l": 5, "ch": 1, "s": [0], "src": "逐字稿", "tag": ["選擇題考點"], "t": "習近平新時代中國特色社會主義思想的地位", "p": "這個思想是新時代共產黨的「思想旗幟」，也是新時代黨和國家事業發展的「根本遵循」（最根本要跟着做的規則）。", "o": "习近平新时代中国特色社会主义思想是新时代中国共产党的〖思想旗帜〗，是新时代党和国家事业发展的〖根本遵循〗", "m": "「一面旗、一條規」：思想旗幟＋根本遵循。"}, {"id": "C05-03", "l": 5, "ch": 1, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "黨的基本路線（全文）", "p": "基本路線是社會主義初級階段的「總路線圖」：一個中心（經濟建設）、兩個基本點（四項基本原則、改革開放），作風是自力更生、艱苦創業，目標是建成社會主義現代化強國。講師：要把基本路線全部背過。", "o": "领导和团结全国各族人民，以〖经济建设〗为中心，坚持〖四项基本原则〗，坚持〖改革开放〗，〖自力更生，艰苦创业〗，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗", "m": "「一中心、兩基本點、一作風、一目標」＝經濟建設｜四項基本原則＋改革開放｜自力更生艱苦創業｜富民文和美強國。", "items": ["领导和团结全国各族人民", "以经济建设为中心（一个中心）", "坚持四项基本原则、坚持改革开放（两个基本点）", "自力更生，艰苦创业（作风）", "为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗（目标）"]}, {"id": "C05-04", "l": 5, "ch": 1, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "易混辨析：基本路線 vs 群眾路線", "p": "兩條「生命線」別搞混！黨的「基本路線」是「國家的」生命線、人民的幸福線；「群眾路線」是「黨的」生命線（第14堂再講：群眾路線是黨的根本工作方法）。講師：「一定注意他們之間是有區別的。」", "o": "党的基本路线是〖国家的生命线、人民的幸福线〗；群众路线是〖党的生命线〗", "m": "「基本→國家；群眾→黨」。記：「基本國策顧國家，群眾路線顧自家（黨）」。"}, {"id": "C05-05", "l": 5, "ch": 1, "s": [5], "src": "", "tag": ["選擇題考點"], "t": "黨的基本方略＝十四個堅持", "p": "「基本方略」就是十九大概括的「十四個堅持」（第02堂已背）。三個「基本」：基本理論＝行動指南；基本路線＝國家生命線、人民幸福線；基本方略＝十四個堅持。", "o": "党的基本方略：党的十九大概括的〖“十四个坚持”〗", "m": "「理論＝指南；路線＝生命線；方略＝十四條」。"}, {"id": "C05-06", "l": 5, "ch": 1, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "「五位一體」的形成過程", "p": "總體布局是一步步擴大的：先是鄧小平講的「兩個文明」（物質文明、精神文明），再到三位一體、四位一體，最後到經濟、政治、文化、社會、生態文明「五位一體」。", "o": "两个文明（邓小平）→〖三位一体〗→〖四位一体〗→〖五位一体〗", "m": "「2→3→4→5」，一次加一個。"}, {"id": "C05-07", "l": 5, "ch": 1, "s": [7], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "易混辨析：五位一體＝總體布局 vs 四個全面＝戰略布局", "p": "兩個都是「布局」，但不同：五位一體是「總體」布局（五個方面一起建設），四個全面是「戰略」布局（四件大事）。四個全面要作為「有內在邏輯關係的統一體」去推進，做到相輔相成、相互促進、相得益彰。", "o": "五位一体是〖总体布局〗，四个全面是〖战略布局〗；具有内在理论和实践逻辑关系的统一体来把握和推进，努力做到〖相辅相成、相互促进、相得益彰〗", "m": "「五總四戰」；統一體三個「相」：相輔相成、相互促進、相得益彰。"}, {"id": "C05-08", "l": 5, "ch": 1, "s": [8], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "四個全面：一個戰略目標＋三個戰略舉措", "p": "四個全面裏，「全面建設社會主義現代化國家」是要到達的「目標」；其餘三個（全面深化改革、全面依法治國、全面從嚴治黨）是達到目標的「手段（舉措）」。以前叫「全面建成小康社會」，現已改為「全面建設社會主義現代化國家」。", "o": "〖全面建设社会主义现代化国家〗——战略目标；〖全面深化改革、全面依法治国、全面从严治党〗——三大战略举措", "m": "「一目標三舉措」：目標是「現代化國家」，舉措是「改・法・黨」。"}, {"id": "C05-09", "l": 5, "ch": 1, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "推動中國特色社會主義不斷開拓前進", "p": "社會主義不是一次就完成的，要不斷發展和完善；而且發展的路上會有困難和曲折。", "o": "（1）社会主义是一个〖不断发展和完善〗的实践过程；（2）社会主义发展道路充满着〖险阻曲折〗", "m": "「一直改進、路上有坑」。"}, {"id": "C06-01", "l": 6, "ch": 2, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "中國夢的提出與「最偉大的夢想」", "p": "2012年11月，習近平參觀《復興之路》展覽時首次提出「中國夢」。中華民族近代以來最偉大的夢想，就是實現中華民族偉大復興。講師：這句就是選擇題考點。", "o": "〖2012年11月〗，参观〖《复兴之路》〗展览，首次提出“中国梦”；实现中华民族伟大复兴，就是中华民族近代以来〖最伟大的梦想〗", "m": "「12年11月、復興之路、首提中國夢」。"}, {"id": "C06-02", "l": 6, "ch": 2, "s": [6], "src": "", "tag": ["必背", "多選題考點"], "t": "中國夢的本質", "p": "中國夢的本質是三件事：國家富強、民族振興、人民幸福。講師：「多選題，多選題」，要記。", "o": "中国梦的本质是〖国家富强〗、〖民族振兴〗、〖人民幸福〗", "m": "「國・族・民」由大到小：國家富強→民族振興→人民幸福。", "items": ["国家富强", "民族振兴", "人民幸福"]}, {"id": "C06-03", "l": 6, "ch": 2, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面建成小康社會的內涵：「小康」與「全面」", "p": "「小康」講的是發展到什麼「水平」；「全面」講的是發展是否平衡、協調、可持續——即不能落下任何地區、任何人。講師：更重要、更難做到的是「全面」，「這個才是考點」。", "o": "‘小康’讲的是〖发展水平〗，‘全面’讲的是发展的〖平衡性、协调性、可持续性〗", "m": "「小康看高度（水平），全面看寬度（平衡、協調、可持續）」。"}, {"id": "C06-04", "l": 6, "ch": 2, "s": [8], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "小康目標實現：歷史性解決「絕對貧困」", "p": "2021年7月1日宣告全面建成小康社會，歷史性地解決了「絕對貧困」問題。講師：注意迷惑選項「相對貧困」——解決的是絕對貧困，不是相對貧困（相對貧困仍然存在）。", "o": "〖2021年7月1日〗……历史性地解决了〖绝对贫困〗问题", "m": "「7・1建黨日宣告小康」；「絕對」解決了，「相對」還在。"}, {"id": "C06-05", "l": 6, "ch": 2, "s": [9, 10], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面建成小康社會的意義（歷史・實踐・世界）", "p": "三個意義：歷史意義＝實現中國夢的關鍵一步；實踐意義＝高質量完成「三步走」的第二步；世界意義＝探索了人類解決貧困問題的新路徑（世界意義只記這句即可）。", "o": "（1）全面建成小康社会是实现中华民族伟大复兴中国梦的〖关键一步〗；（2）高质量完成了社会主义现代化建设“三步走”战略的〖第二步〗；（3）全面建成小康社会，探索了人类解决贫困问题的〖新路径〗，为推动人类文明进步作出了重大贡献", "m": "「關鍵一步・第二步・新路徑」＝歷史・實踐・世界。"}, {"id": "C06-06", "l": 6, "ch": 2, "s": [11], "src": "", "tag": ["必背", "錯題", "易混"], "t": "二十大「兩步走」總的戰略安排", "p": "黨的二十大明確：分兩步走。第一步 2020—2035 年「基本」實現社會主義現代化；第二步 2035 年到本世紀中葉（2050年）建成富強民主文明和諧美麗的社會主義現代化強國。講師：必須背誦，注意「基本」二字。", "o": "（1）从2020年到2035年〖基本实现社会主义现代化〗；（2）从2035年到本世纪中叶把我国建成〖富强民主文明和谐美丽的社会主义现代化强国〗", "m": "「15＋15」：2020→2035（15年，基本實現）→2050（15年，建成強國）。2035 一律配「基本」。", "items": ["从2020年到2035年基本实现社会主义现代化", "从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国"]}, {"id": "C06-07", "l": 6, "ch": 2, "s": [11], "src": "", "tag": ["必背", "易混"], "t": "易混辨析：十九大的戰略安排 vs 二十大兩步走", "p": "投影片【注意】：十九大作出的是「從全面建成小康社會到基本實現社會主義現代化，再到全面建成社會主義現代化強國」的戰略安排（三段：小康→基本現代化→強國）；二十大「進一步明確」全面建成現代化強國分兩步走（2020—2035、2035—本世紀中葉）。", "o": "党的〖十九大〗作出了从〖全面建成小康社会〗到〖基本实现社会主义现代化〗，再到〖全面建成社会主义现代化强国〗的战略安排；党的〖二十大〗进一步明确，全面建成社会主义现代化强国总的战略安排是〖分两步走〗", "m": "十九大＝「小康→基本→強國」三個台階；二十大＝「兩步走」(2035/2050)。"}, {"id": "C06-08", "l": 6, "ch": 2, "s": [12, 13], "src": "", "tag": ["選擇題考點"], "t": "到2035年我國發展的總體目標（黃字關鍵詞）", "p": "到2035年的目標涉及六方面：經濟實力（及科技、綜合國力）大躍升；基本實現國家治理體系和治理能力現代化；建成教育強國等；人民生活更加幸福美好；廣泛形成綠色生產生活方式（碳排放）；國家安全與軍隊現代化。講師圈出兩處「基本」。", "o": "〖经济实力〗……；〖治理体系和治理能力现代化〗……；〖教育强国〗……；〖人民生活更加幸福美好〗……；〖绿色生产生活方式〗……；〖军队现代化〗……", "m": "「經・治・教・民・綠・軍」六字。"}, {"id": "C07-01", "l": 7, "ch": 2, "s": [3, 4, 5], "src": "", "tag": ["了解"], "t": "中國式現代化是長期探索的成果（四個時期）", "p": "中國式現代化是黨帶領人民在四個時期一步步探索出來的。講師：不需要背下來，只要清楚邏輯框架（四個時期的順序）。", "o": "（1）〖新民主主义革命时期〗；（2）〖社会主义革命和建设时期〗；（3）〖改革开放和社会主义现代化建设新时期〗；（4）〖进入新时代〗", "m": "「革命→建設→改革→新時代」。"}, {"id": "C07-02", "l": 7, "ch": 2, "s": [6, 7, 8, 9], "src": "", "tag": ["必背", "選擇題考點", "簡答題考點"], "t": "中國式現代化的中國特色（五個）", "p": "中國式現代化跟別國的不同之處有五個：人很多（人口規模巨大）、大家一起富（共同富裕）、物質和精神都要好、人和自然和諧、走和平發展的路。講師：「非常重要，五個全部都需要背」，標題必背。", "o": "中国式现代化是〖人口规模巨大〗的现代化；是〖全体人民共同富裕〗的现代化；是〖物质文明和精神文明相协调〗的现代化；是〖人与自然和谐共生〗的现代化；是〖走和平发展道路〗的现代化", "m": "口訣「人・富・物精・自然・和平」——「人多、要富、身心好、愛自然、不打仗」。", "items": ["人口规模巨大的现代化", "全体人民共同富裕的现代化", "物质文明和精神文明相协调的现代化", "人与自然和谐共生的现代化", "走和平发展道路的现代化"]}, {"id": "C07-03", "l": 7, "ch": 2, "s": [7], "src": "", "tag": ["選擇題考點", "易混"], "t": "共同富裕：顯著標誌；不是同步富裕", "p": "全體人民共同富裕是中國式現代化區別於西方現代化的一個顯著標誌。但共同富裕「不是同步富裕」，可以先富帶後富。講師也說：「物質貧困不是社會主義，精神貧困也不是社會主義。」", "o": "全体人民共同富裕是中国式现代化区别于西方现代化的一个〖显著标志〗；共同富裕〖不是同步富裕〗，是可以〖先富带后富〗的", "m": "「顯著標誌＝共同富裕」；「不同步，可先帶後」。"}, {"id": "C07-04", "l": 7, "ch": 2, "s": [10], "src": "", "tag": ["必背", "簡答題考點"], "t": "中國式現代化的本質要求（九項）", "p": "中國式現代化「本質上要做到」九件事。講師記法：「2個基本＋5位一體＋外交」——2個堅持（黨領導、中特）＋經濟（高質量發展）、政治（全過程人民民主）、文化（精神世界）、社會（共同富裕）、生態（人與自然）＋對外（命運共同體、文明新形態）。", "o": "坚持中国共产党领导，坚持中国特色社会主义，实现〖高质量发展〗，发展〖全过程人民民主〗，丰富〖人民精神世界〗，实现〖全体人民共同富裕〗，促进〖人与自然和谐共生〗，推动构建〖人类命运共同体〗，创造〖人类文明新形态〗", "m": "「2＋5＋2」：兩堅持｜經・政・文・社・生｜共同體・新形態。", "items": ["坚持中国共产党领导", "坚持中国特色社会主义", "实现高质量发展", "发展全过程人民民主", "丰富人民精神世界", "实现全体人民共同富裕", "促进人与自然和谐共生", "推动构建人类命运共同体", "创造人类文明新形态"]}, {"id": "C07-05", "l": 7, "ch": 2, "s": [11, 12], "src": "", "tag": ["選擇題考點"], "t": "中國式現代化是黨領導的社會主義現代化", "p": "這是對中國式現代化的「定性」：它是社會主義現代化，不是別的什麼現代化。黨的領導決定它的根本性質、確保它朝着目標穩步前進、給它強大動力、凝聚力量；並堅持和發展中特道路、理論、制度、文化。", "o": "中国式现代化是〖社会主义现代化〗而不是别的什么现代化；党的领导确保中国式现代化锚定奋斗目标〖行稳致远〗；党的领导激发建设中国式现代化的〖强劲动力〗；党的领导凝聚建设中国式现代化的磅礴力量；坚持和发展中国特色社会主义道路、理论、制度、文化", "m": "「定性・方向（行穩致遠）・動力・力量・旗幟」。"}, {"id": "C07-06", "l": 7, "ch": 2, "s": [13, 14, 16], "src": "", "tag": ["必背", "選擇題考點"], "t": "中國式現代化創造了人類文明新形態（三個標題）", "p": "中國式現代化對世界的意義：提供了一種全新的現代化模式；超越了西方的現代化理論和實踐；為發展中國家提供了全新選擇。講師：只記標題。", "o": "（1）中国式现代化提供了一种〖全新的现代化模式〗；（2）中国式现代化是对西方式现代化理论和实践的〖重大超越〗；（3）中国式现代化为广大发展中国家提供了〖全新选择〗", "m": "「新模式・大超越・新選擇」。", "items": ["中国式现代化提供了一种全新的现代化模式", "中国式现代化是对西方式现代化理论和实践的重大超越", "中国式现代化为广大发展中国家提供了全新选择"]}, {"id": "C08-01", "l": 8, "ch": 2, "s": [3, 4, 5], "src": "", "tag": ["必背", "簡答題考點"], "t": "推進中國式現代化的五個重大原則", "p": "推進中國式現代化要牢牢把握五條原則：黨的全面領導、中特道路、以人民為中心、深化改革開放、發揚鬥爭精神。", "o": "（一）坚持和加强〖党的全面领导〗；（二）坚持〖中国特色社会主义道路〗；（三）坚持〖以人民为中心的发展思想〗；（四）坚持〖深化改革开放〗；（五）坚持〖发扬斗争精神〗", "m": "「領・路・民・改・鬥」：誰領導→走什麼路→為了誰→靠什麼動力→用什麼精神。", "items": ["坚持和加强党的全面领导", "坚持中国特色社会主义道路", "坚持以人民为中心的发展思想", "坚持深化改革开放", "坚持发扬斗争精神"]}, {"id": "C08-02", "l": 8, "ch": 2, "s": [3], "src": "逐字稿", "tag": ["選擇題考點"], "t": "黨是主心骨和領航者；舉旗與走路", "p": "中國共產黨是全面建設社會主義現代化國家的「主心骨」和「領航者」。中國式現代化舉的是中國特色社會主義的旗幟，走的是中國特色社會主義的道路——講師說要搞清楚。", "o": "中国共产党是全面建设社会主义现代化国家的〖主心骨〗和〖领航者〗；举的是〖中国特色社会主义〗的旗帜，走的是中国特色社会主义的道路", "m": "「黨＝主心骨＋領航員」。"}, {"id": "C08-03", "l": 8, "ch": 2, "s": [6, 7, 8, 9, 10, 11], "src": "", "tag": ["必背", "多選題考點"], "t": "需要正確處理的六組重大關係", "p": "推進中國式現代化要處理好六對關係：頂層設計與實踐探索、戰略與策略、守正與創新、效率與公平、活力與秩序、自立自強與對外開放。", "o": "顶层设计与实践探索；战略与策略；守正与创新；效率与公平；活力与秩序；自立自强与对外开放", "m": "六對「上下・長短・新舊・快公・活序・內外」：頂層vs實踐（上下）、戰略vs策略（長短）、守正vs創新（舊新）、效率vs公平、活力vs秩序、自立vs開放（內外）。", "items": ["顶层设计与实践探索", "战略与策略", "守正与创新", "效率与公平", "活力与秩序", "自立自强与对外开放"]}, {"id": "C08-04", "l": 8, "ch": 2, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "戰略與策略的關係", "p": "戰略＝從全局、長遠、大勢來判斷和決策（大方向）；策略＝在戰略指導下、為戰略服務（具體做法）。兩者是辯證統一的。講師：「一定要注意。」", "o": "战略是从〖全局、长远、大势〗上作出判断和决策，策略是在战略指导下〖为战略服务〗的，战略和策略是〖辩证统一〗的", "m": "「戰略看遠（全局、長遠、大勢），策略服務戰略」。"}, {"id": "C08-05", "l": 8, "ch": 2, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "守正與創新：創新擺在突出位置", "p": "要把創新放在國家發展全局的突出位置。講師補充：「創新是第一動力。」", "o": "〖创新〗摆在国家发展全局的〖突出位置〗", "m": "「創新＝突出位置＝第一動力」。"}, {"id": "C08-06", "l": 8, "ch": 2, "s": [9, 10], "src": "", "tag": ["選擇題考點"], "t": "效率與公平；活力與秩序", "p": "既要有效率又要社會公平；既要充滿活力又要有良好秩序（活而不亂）。講師以手寫圖說明：中國式現代化是「並聯」式、同步發展的。", "o": "〖效率〗……〖社会公平〗；应该既充满〖活力〗又拥有良好〖秩序〗", "m": "「快又公、活不亂」。"}, {"id": "C08-07", "l": 8, "ch": 2, "s": [11], "src": "", "tag": ["必背", "選擇題考點"], "t": "自立自強與對外開放", "p": "獨立自主是中華民族的精神之魂、立黨立國的重要原則；對外開放是中國的基本國策，任何時候都不能動搖。", "o": "〖独立自主〗是中华民族精神之魂，是我们立党立国的〖重要原则〗。〖对外开放〗是中国的〖基本国策〗，任何时候都不能动摇", "m": "「獨立自主＝魂＋原則；對外開放＝國策」。"}, {"id": "C08-08", "l": 8, "ch": 2, "s": [12, 13], "src": "", "tag": ["必背", "選擇題考點"], "t": "必須堅持團結奮鬥", "p": "團結奮鬥是中國人民創造歷史偉業的「必由之路」（講師：把這一句記住）。只有持續團結奮鬥，才能完成中國式現代化；要大力弘揚團結奮鬥精神。", "o": "（1）团结奋斗是中国人民创造历史伟业的〖必由之路〗；（2）只有持续团结奋斗，才能完成〖中国式现代化〗；（3）大力弘扬〖团结奋斗精神〗", "m": "「必由之路・才能完成・大力弘揚」。"}, {"id": "C09-01", "l": 9, "ch": 3, "s": [4, 5, 6], "src": "", "tag": ["必背", "簡答題考點"], "t": "中國最大的國情就是中國共產黨的領導（四點）", "p": "中國最大的「實際情況」就是由共產黨領導。原因四點：領導地位是歷史奮鬥中形成的；黨的領導是人民當家作主的可靠保障；關係中特的性質、方向和命運；是實現民族復興的根本保證。講師：「沒有共產黨就沒有新中國，就沒有中國特色社會主義。」", "o": "（1）中国共产党的领导地位是在〖历史奋斗〗中形成的；（2）中国共产党领导是人民当家作主的〖可靠保障〗；（3）中国共产党领导关系中国特色社会主义的〖性质、方向和命运〗；（4）中国共产党领导是实现中华民族伟大复兴的〖根本保证〗", "m": "「歷史・人民・中特・復興」四對象；配「形成・可靠保障・性質方向命運・根本保證」。", "items": ["中国共产党的领导地位是在历史奋斗中形成的", "中国共产党领导是人民当家作主的可靠保障", "中国共产党领导关系中国特色社会主义的性质、方向和命运", "中国共产党领导是实现中华民族伟大复兴的根本保证"]}, {"id": "C09-02", "l": 9, "ch": 3, "s": [4], "src": "", "tag": ["選擇題考點"], "t": "「最」本質的特徵＝黨的領導；最大國情", "p": "講師：「一定要注意有一個『最』字，涉及到最本質的特徵，那就一定是黨的領導。」中國最大的國情也是中國共產黨的領導。", "o": "中国特色社会主义〖最本质的特征〗是中国共产党领导；中国〖最大的国情〗就是中国共产党的领导", "m": "看到「最本質」「最大國情」→黨的領導。"}, {"id": "C09-03", "l": 9, "ch": 3, "s": [7, 8], "src": "", "tag": ["必背", "選擇題考點"], "t": "黨的領導是中特制度的最大優勢（三點）", "p": "黨的領導為什麼是制度的「最大優勢」？①黨為制度提供強大理論優勢；②黨自身的優勢是制度優勢的主要來源；③黨確保制度的顯著優勢充分彰顯（發揮出來）。講師：第一、第二個標黃字體要記住。", "o": "（1）中国共产党为坚持和完善中国特色社会主义制度提供强大〖理论优势〗；（2）中国共产党的〖自身优势〗是中国特色社会主义制度优势的〖主要来源〗；（3）中国共产党确保中国特色社会主义制度的显著优势〖充分彰显〗", "m": "「理論優勢・主要來源・充分彰顯」。", "items": ["中国共产党为坚持和完善中国特色社会主义制度提供强大理论优势", "中国共产党的自身优势是中国特色社会主义制度优势的主要来源", "中国共产党确保中国特色社会主义制度的显著优势充分彰显"]}, {"id": "C09-04", "l": 9, "ch": 3, "s": [9, 10, 11], "src": "", "tag": ["必背", "選擇題考點"], "t": "加強黨的全面領導提供堅強保證（三點）", "p": "堅持和加強黨的全面領導帶來三個結果：領導核心作用充分彰顯；黨的「四力」顯著增強；為事業提供政治保證。講師：只記標黃部分。", "o": "（1）使党的〖领导核心作用〗充分彰显；（2）使党的〖政治领导力、思想引领力、群众组织力、社会号召力〗显著增强；（3）为推进新时代中国特色社会主义事业提供了〖政治保证〗", "m": "「核心・四力・保證」；四力＝「政・思・群・社」。", "items": ["使党的领导核心作用充分彰显", "使党的政治领导力、思想引领力、群众组织力、社会号召力显著增强", "为推进新时代中国特色社会主义事业提供了政治保证"]}, {"id": "C09-05", "l": 9, "ch": 3, "s": [10], "src": "", "tag": ["必背", "多選題考點", "選擇題考點"], "t": "黨的「四力」；政治領導力是第一位", "p": "黨的四種能力：政治領導力、思想引領力、群眾組織力、社會號召力。其中「政治領導力」是馬克思主義政黨第一位的能力。", "o": "〖政治领导力〗、〖思想引领力〗、〖群众组织力〗、〖社会号召力〗；政治领导力是马克思主义政党〖第一位〗的能力", "m": "「政思群社」四力，「政治」排第一。", "items": ["政治领导力", "思想引领力", "群众组织力", "社会号召力"]}, {"id": "C10-01", "l": 10, "ch": 3, "s": [3, 4], "src": "", "tag": ["必背", "簡答題考點"], "t": "中國共產黨是最高政治領導力量（三個「由……決定」）", "p": "為什麼黨是「最高政治領導力量」？由三樣東西決定：由最廣大人民群眾決定；由國家性質和政治制度體系決定；由民族復興事業決定。", "o": "（1）由〖最广大人民群众〗决定；（2）由我国〖国家性质和政治制度体系〗决定；（3）由〖中华民族伟大复兴事业〗决定", "m": "「人民・國家・復興」三決定。", "items": ["由最广大人民群众决定", "由我国国家性质和政治制度体系决定", "由中华民族伟大复兴事业决定"]}, {"id": "C10-02", "l": 10, "ch": 3, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "黨的領導制度居於「統領地位」；國體與政體", "p": "黨的領導制度在國家政治制度體系中居於「統領地位」（講師：選擇題考點）。同頁講：國體＝工人階級領導的、以工農聯盟為基礎的人民民主專政的社會主義國家；政體＝人民代表大會制度。", "o": "党的领导制度在我国国家政治制度体系中居于〖统领地位〗；国体：〖工人阶级〗领导的、以〖工农联盟〗为基础的人民民主专政的社会主义国家；政体：〖人民代表大会制度〗", "m": "「黨＝統領」；「國體看階級（工人領導、工農聯盟），政體看組織（人大）」。"}, {"id": "C10-03", "l": 10, "ch": 3, "s": [5], "src": "", "tag": ["必背", "多選題考點"], "t": "黨的領導是全面的、系統的、整體的", "p": "黨的領導不是只管一部分，而是「全面、系統、整體」地領導各方面工作。", "o": "党的领导是〖全面〗的、〖系统〗的、〖整体〗的", "m": "「全・系・整」三字。"}, {"id": "C10-04", "l": 10, "ch": 3, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "維護黨中央權威和集中統一領導（四點）", "p": "①是成熟的馬克思主義執政黨的重大建黨原則；②必須堅決貫徹黨的理論、路線方針政策和黨中央決策部署；③最關鍵的是堅決維護習近平同志黨中央的核心、全黨的核心地位；④同堅持黨的民主集中制是完全一致的。", "o": "①是一个成熟的马克思主义执政党的〖重大建党原则〗；②必须坚决贯彻党的理论、路线方针政策和党中央决策部署；③〖最关键〗的是坚决维护习近平同志党中央的核心、全党的核心地位；④同坚持党的〖民主集中制〗是完全一致的", "m": "「原則・貫徹・關鍵・一致」。", "items": ["是一个成熟的马克思主义执政党的重大建党原则", "必须坚决贯彻党的理论、路线方针政策和党中央决策部署", "最关键的是坚决维护习近平同志党中央的核心、全党的核心地位", "同坚持党的民主集中制是完全一致的"]}, {"id": "C11-01", "l": 11, "ch": 3, "s": [3], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "黨的領導制度是我國的「根本領導制度」", "p": "講師：本節非常重要的重點，突出的是「領導」兩個字。黨的領導制度＝根本「領導」制度。", "o": "党的领导制度是我国的〖根本领导制度〗", "m": "「黨→領導」：黨的領導制度，名字裏有「領導」，就配「根本領導制度」。"}, {"id": "C11-02", "l": 11, "ch": 3, "s": [3], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "易混辨析：根本領導制度／根本政治制度／基本政治制度", "p": "三類制度別混：①黨的領導制度＝根本領導制度；②人民代表大會制度＝根本政治制度；③中國共產黨領導的多黨合作和政治協商制度、民族區域自治制度、基層群眾自治制度＝基本政治制度。講師：「放在一起很容易混淆」。", "o": "党的领导制度——〖根本领导制度〗；人民代表大会制度——〖根本政治制度〗；多党合作和政治协商制度、民族区域自治制度、基层群众自治制度——〖基本政治制度〗", "m": "「1＋1＋3」：一個根本領導（黨）、一個根本政治（人大）、三個基本政治（多黨、民族、基層）。"}, {"id": "C11-03", "l": 11, "ch": 3, "s": [3, 4], "src": "", "tag": ["必背", "簡答題考點"], "t": "黨的領導制度體系（六項制度）", "p": "黨的領導制度體系包括六項：不忘初心牢記使命的制度；維護黨中央權威和集中統一領導的各項制度；黨的全面領導制度；為人民執政、靠人民執政的制度；提高執政能力和領導水平的制度；全面從嚴治黨制度。", "o": "（一）建立〖不忘初心、牢记使命〗的制度；（二）完善坚定维护〖党中央权威和集中统一领导〗的各项制度；（三）健全〖党的全面领导制度〗，确保党在各种组织中发挥领导作用；（四）健全〖为人民执政、靠人民执政〗各项制度；（五）健全提高党的〖执政能力和领导水平〗制度；（六）完善〖全面从严治党〗制度", "m": "「初心・權威・全面・為民・能力・從嚴」——先初心，後從嚴兜底。", "items": ["建立不忘初心、牢记使命的制度", "完善坚定维护党中央权威和集中统一领导的各项制度", "健全党的全面领导制度，确保党在各种组织中发挥领导作用", "健全为人民执政、靠人民执政各项制度", "健全提高党的执政能力和领导水平制度", "完善全面从严治党制度"]}, {"id": "C11-04", "l": 11, "ch": 3, "s": [3, 4], "src": "逐字稿", "tag": ["選擇題考點"], "t": "制度體系中各項制度的「角色」", "p": "講師點出：維護黨中央權威和集中統一領導的制度＝這一制度體系必須堅持的「最高原則」；為人民執政、靠人民執政的制度＝反映「價值追求」；提高執政能力和領導水平的制度＝體現「實踐要求」；全面從嚴治黨制度＝「堅強保障」；不忘初心牢記使命制度＝長效機制、奠定基礎。", "o": "坚定维护党中央权威和集中统一领导的各项制度——〖最高原则〗；为人民执政、靠人民执政各项制度——〖价值追求〗；提高党的执政能力和领导水平制度——〖实践要求〗", "m": "「權威＝最高、為民＝價值、能力＝實踐」。"}, {"id": "C11-05", "l": 11, "ch": 3, "s": [5, 6], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "健全黨中央對重大工作的領導體制", "p": "加強黨中央對重大工作的領導是黨的優良傳統和寶貴經驗；必須完善黨中央重大決策部署落實機制。黨的領導決策核心有三個：黨的中央委員會、中央政治局、中央政治局常務委員會（講師：「不要去忘了這個」）。", "o": "我们党的〖优良传统和宝贵经验〗；必须完善党中央〖重大决策部署落实机制〗；党的领导决策核心：〖党的中央委员会〗、〖中央政治局〗、〖中央政治局常务委员会〗", "m": "決策核心「委・局・常」三個。", "items": ["党的中央委员会", "中央政治局", "中央政治局常务委员会"]}, {"id": "C11-06", "l": 11, "ch": 3, "s": [7, 8], "src": "", "tag": ["必背", "簡答題考點"], "t": "健全黨的全面領導制度（三個「必須完善」）", "p": "三點：完善黨在各種組織中發揮領導作用的制度；完善黨協調各方的機制；完善黨領導各項事業的具體制度。講師：小標題一定要捋清楚，否則容易混。", "o": "（1）必须完善党在〖各种组织〗中发挥领导作用的制度；（2）必须完善党〖协调各方〗的机制；（3）必须完善党领导〖各项事业〗的具体制度", "m": "「組織・各方・事業」。", "items": ["必须完善党在各种组织中发挥领导作用的制度", "必须完善党协调各方的机制", "必须完善党领导各项事业的具体制度"]}, {"id": "C12-01", "l": 12, "ch": 4, "s": [4, 5], "src": "", "tag": ["必背", "選擇題考點"], "t": "人民是歷史的創造者，是真正的英雄", "p": "歷史是誰創造的？是人民。人民創造物質財富和精神財富，也是推動社會變革的決定力量。所以要尊重人民的歷史地位，充分發揮人民的主體作用。講師：「標黃色的部分是你重點要去背的部分。」", "o": "（1）人民是〖历史的创造者〗，是〖真正的英雄〗；（2）尊重人民〖历史地位〗，充分发挥人民〖主体作用〗", "m": "「創造者＋英雄」；「尊重地位、發揮作用」。"}, {"id": "C12-02", "l": 12, "ch": 4, "s": [6], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "民心是最大的政治 vs 就業是最大的民生", "p": "「民心」是最大的政治，決定事業興衰成敗；講師順帶提醒另一個選擇題考點：「就業」是最大的民生。兩個「最大」不要混。", "o": "〖民心〗是最大的政治，决定事业兴衰成败；〖就业〗是最大的民生", "m": "「民心→政治；就業→民生」——「心裏想的是政治，飯碗是民生」。"}, {"id": "C12-03", "l": 12, "ch": 4, "s": [7], "src": "", "tag": ["必背"], "t": "我國國體（要背過）", "p": "「國體」＝國家的性質：由誰領導、靠誰作基礎。講師：「這一段呢我就要求你們把這個國體給我背過了。」補充：人民代表大會是我國最高的權力機關。", "o": "我国是〖工人阶级〗领导的、以〖工农联盟〗为基础的〖人民民主专政〗的社会主义国家", "m": "「工人領、工農基、人民專政」。"}, {"id": "C12-04", "l": 12, "ch": 4, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "江山就是人民，人民就是江山", "p": "國家（江山）就是人民，人民就是國家。這是由黨的性質和宗旨決定的。打江山、守江山，守的是人民的心。", "o": "〖江山就是人民，人民就是江山〗；打江山、守江山，守的是〖人民的心〗", "m": "「江山＝人民」左右對調一次。"}, {"id": "C12-05", "l": 12, "ch": 4, "s": [9], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "人民立場是黨的根本政治立場；顯著標誌", "p": "人民立場是中國共產黨的「根本政治立場」，也是我們黨區別於其他政黨的「顯著標誌」。講師：兩個都是選擇題考點。", "o": "人民立场是中国共产党的〖根本政治立场〗；是我们党区别于其他政党的〖显著标志〗", "m": "「立場＝人民」；「顯著標誌＝區別別的黨」。"}, {"id": "C12-06", "l": 12, "ch": 4, "s": [9], "src": "逐字稿（第11、12堂）", "tag": ["必背", "選擇題考點", "易混"], "t": "易混辨析：「三個根本」", "p": "講師要求把「三個根本」串起來同步記憶：黨的領導制度＝根本領導制度；人民代表大會制度＝根本政治制度；人民立場＝根本政治立場。", "o": "党的领导制度——〖根本领导制度〗；人民代表大会制度——〖根本政治制度〗；人民立场——〖根本政治立场〗", "m": "「黨→領導制度；人大→政治制度；人民→政治立場」。"}, {"id": "C12-07", "l": 12, "ch": 4, "s": [10], "src": "", "tag": ["必背", "論述題考點", "簡答題考點"], "t": "如何堅持人民立場（三個標題）", "p": "堅持人民立場就要：始終牢記黨的初心和使命；始終保持黨同人民群眾的血肉聯繫；熱愛人民、尊重人民、敬畏人民。講師：大題考點，背標題就夠了；注意是「血肉聯繫」，不是普通聯繫。", "o": "坚持人民立场，就要始终牢记党的〖初心和使命〗；就要始终保持党同人民群众的〖血肉联系〗；就要〖热爱人民、尊重人民、敬畏人民〗", "m": "「初心・血肉・愛敬畏」。", "items": ["始终牢记党的初心和使命", "始终保持党同人民群众的血肉联系", "热爱人民、尊重人民、敬畏人民"]}, {"id": "C12-08", "l": 12, "ch": 4, "s": [10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "初心使命；最大政治優勢 vs 最大危險", "p": "黨的初心和使命：為中國人民謀幸福，為中華民族謀復興。黨最大的政治優勢是「密切聯繫群眾」；黨執政後最大的危險是「脫離群眾」。", "o": "为中国人民〖谋幸福〗，为中华民族〖谋复兴〗；最大政治优势是〖密切联系群众〗；最大危险是〖脱离群众〗", "m": "「靠近群眾＝優勢，離開群眾＝危險」。"}, {"id": "C13-01", "l": 13, "ch": 4, "s": [3, 4, 5], "src": "", "tag": ["必背", "選擇題考點"], "t": "人民對美好生活的嚮往就是黨的奮鬥目標", "p": "讓人民過上好日子是黨一直以來的追求（為人民謀幸福是黨始終堅守的初心）。新時代人民對美好生活的嚮往：講師說這裏答題不只背標題，要結合「全面建成小康社會」和「社會主要矛盾轉化」稍微擴充。", "o": "人民对美好生活的向往就是党的〖奋斗目标〗；（1）让人民过上好日子是党〖一贯的追求〗；（2）新时代人民对美好生活的向往", "m": "「好日子＝一貫追求」。"}, {"id": "C13-02", "l": 13, "ch": 4, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "人民是黨的生命之根、執政之基、力量之源", "p": "人民對黨來說就像「根、地基、電源」。依靠人民創造歷史偉業，必須尊重人民主體地位；堅持人民主體地位、調動人民積極性，是黨立於不敗之地的強大根基。", "o": "人民是我们党的〖生命之根〗、〖执政之基〗、〖力量之源〗；依靠人民创造历史伟业，必须尊重人民〖主体地位〗", "m": "「根・基・源」：樹根、地基、水源。", "items": ["生命之根", "执政之基", "力量之源"]}, {"id": "C13-03", "l": 13, "ch": 4, "s": [7], "src": "", "tag": ["必背", "簡答題考點"], "t": "必須尊重人民首創精神（四點）", "p": "「首創精神」＝人民自己想出新辦法的精神。四點：①把人民當作智慧和力量的源泉；②尊重實踐、尊重創造，頂層設計和基層探索相統一，鼓勵創新、寬容失敗；③激發人民的創新創造活力；④及時總結人民實踐中的新鮮經驗，上升為理論和政策。講師：可以作為簡答題。", "o": "①始终把人民群众作为〖智慧和力量的源泉〗；②就要〖尊重实践、尊重创造〗，坚持顶层设计和基层探索相统一，大胆探索、勇于开拓，鼓励创新、〖宽容失败〗；③就要激发人民群众的〖创新创造活力〗；④就要及时发现、总结、概括人民群众实践中形成的〖新鲜经验〗，使之上升为理论和政策", "m": "「源泉・尊重・激發・總結」：先當源泉，再尊重，再激發，最後總結經驗。", "items": ["始终把人民群众作为智慧和力量的源泉", "尊重实践、尊重创造，坚持顶层设计和基层探索相统一，鼓励创新、宽容失败", "激发人民群众的创新创造活力", "及时发现、总结、概括人民群众实践中形成的新鲜经验，使之上升为理论和政策"]}, {"id": "C13-04", "l": 13, "ch": 4, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "人民是最高裁決者和最終評判者（出卷人・答卷人・閱卷人）", "p": "黨的工作做得好不好，由人民打分。「時代是出卷人，我們是答卷人，人民是閱卷人。」要以人民滿意不滿意作為檢驗工作的最終評判標準；讓群眾滿意是黨做好一切工作的價值取向和根本標準；要樹立和踐行正確的政績觀。", "o": "人民是党的工作的〖最高裁决者〗和〖最终评判者〗；时代是〖出卷人〗，我们是〖答卷人〗，人民是〖阅卷人〗；让〖群众满意〗是我们党做好一切工作的价值取向和根本标准；牢固树立和践行正确的〖政绩观〗", "m": "考試比喻：「時代出題、黨答題、人民改卷」。"}, {"id": "C14-01", "l": 14, "ch": 4, "s": [3], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "群眾路線是黨始終堅持的根本工作方法", "p": "群眾路線＝一切為了群眾、一切依靠群眾，從群眾中來、到群眾中去，把黨的正確主張變為群眾的自覺行動。它是黨始終堅持的「根本工作方法」（也是黨的生命線，見第05堂辨析）。", "o": "群众路线是我们党始终坚持的〖根本工作方法〗；一切为了群众，一切依靠群众，〖从群众中来，到群众中去〗，把党的正确主张变为群众的自觉行动", "m": "「為・靠・來・去」四字。"}, {"id": "C14-02", "l": 14, "ch": 4, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "毛澤東思想「三個活的靈魂」", "p": "投影片手寫串聯：毛澤東思想活的靈魂有三個——實事求是、群眾路線、獨立自主。", "o": "①〖实事求是〗 ②〖群众路线〗 ③〖独立自主〗", "m": "「實・群・獨」。", "items": ["实事求是", "群众路线", "独立自主"]}, {"id": "C14-03", "l": 14, "ch": 4, "s": [4], "src": "", "tag": ["選擇題考點"], "t": "貫徹群眾路線：知行合一；調查研究", "p": "貫徹群眾路線要知行合一：「知」是基礎、是前提；「行」是重點、是關鍵。調查研究是貫徹群眾路線的有效途徑。", "o": "知是〖基础〗是〖前提〗，行是〖重点〗是〖关键〗；〖调查研究〗是贯彻群众路线的有效途径", "m": "「知＝地基，行＝重點」。"}, {"id": "C14-04", "l": 14, "ch": 4, "s": [5, 7], "src": "", "tag": ["必背", "簡答題考點"], "t": "把為人民造福的事情真正辦好辦實（三點）", "p": "①造福人民要落實到各項事業、全部工作之中；②要着力解決人民最關心最直接最現實的利益問題；③要一件事情接着一件事情辦，一年接着一年幹。講師補充：要讓人民群眾在每一個司法案件中感受到公平正義；人民群眾是共產黨的安身立命之本。", "o": "（1）为人民造福，要落实到新时代中国特色社会主义的〖各项事业、全部工作〗之中；（2）要着力解决好人民群众〖最关心最直接最现实〗的利益问题；（3）要〖一件事情接着一件事情办，一年接着一年干〗", "m": "「全部落實・三個最・一件接一件」。", "items": ["为人民造福，要落实到新时代中国特色社会主义的各项事业、全部工作之中", "要着力解决好人民群众最关心最直接最现实的利益问题", "要一件事情接着一件事情办，一年接着一年干"]}, {"id": "C14-05", "l": 14, "ch": 4, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "共同富裕是關係黨的執政基礎的重大政治問題", "p": "講師：「首先要背過這個小標題」——實現共同富裕不僅是經濟問題，而且是關係黨的執政基礎的重大政治問題。", "o": "实现共同富裕不仅是〖经济问题〗，而且是关系党的〖执政基础〗的〖重大政治问题〗", "m": "「不只經濟，更是政治」。"}, {"id": "C14-06", "l": 14, "ch": 4, "s": [9], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "從全局角度把握共同富裕（四個「不是」）", "p": "共同富裕是全體人民、物質生活和精神生活都富裕；不是少數人富裕，不是整齊劃一的平均主義，不是所有人同時富裕，也不是所有地區同時達到一個富裕水準。允許一部分人先富起來，同時積極推動先富帶後富。是一個長期的歷史過程。", "o": "共同富裕是〖全体人民〗共同富裕，是人民群众〖物质生活和精神生活〗都富裕，不是〖少数人〗的富裕，也不是整齐划一的〖平均主义〗，不是所有人都〖同时富裕〗，也不是所有地区同时达到一个富裕水准", "m": "「是：全體＋物質精神」；「不是：少數、平均、同時（人）、同時（地區）」。", "items": ["是全体人民共同富裕", "是物质生活和精神生活都富裕", "不是少数人的富裕", "不是整齐划一的平均主义", "不是所有人都同时富裕，也不是所有地区同时达到一个富裕水准"]}, {"id": "C14-07", "l": 14, "ch": 4, "s": [10, 11], "src": "", "tag": ["選擇題考點"], "t": "推進共同富裕的原則與思路；橄欖型分配結構", "p": "扎實推進共同富裕，必須堅持正確的原則和科學的思路。講師講到要構建初次分配、再分配、三次分配協調配套的基礎性制度安排，形成「中間大、兩頭小」的橄欖型分配結構（中等收入的人最多）。", "o": "〖推进共同富裕的原则〗；〖推进共同富裕的思路〗；初次分配、再分配、〖三次分配〗协调配套；形成〖中间大两头小〗的〖橄榄型〗分配结构", "m": "「橄欖：中間胖、兩頭尖」＝中等收入群體最大。"}, {"id": "C15-01", "l": 15, "ch": 5, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "改革開放是決定當代中國命運的關鍵一招", "p": "節標題本身就是選擇題考點：改革開放是決定當代中國命運的「關鍵一招」（像下棋最關鍵的一步）。", "o": "改革开放是决定当代中国命运的〖关键一招〗", "m": "「命運靠一招」。"}, {"id": "C15-02", "l": 15, "ch": 5, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "改革開放是重要法寶、必由之路；「四個只有」", "p": "改革開放是黨和人民前進的重要法寶，是堅持和發展中國特色社會主義的必由之路。講師：只有社會主義才能救中國，只有改革開放才能發展中國、發展社會主義、發展馬克思主義。", "o": "改革开放是我们前进的〖重要法宝〗；改革开放是坚持和发展中国特色社会主义的〖必由之路〗；只有社会主义才能〖救中国〗，只有改革开放才能〖发展中国、发展社会主义、发展马克思主义〗", "m": "「社會主義救中國；改革開放三個發展（中國・社會主義・馬克思主義）」。"}, {"id": "C15-03", "l": 15, "ch": 5, "s": [5, 6], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "易混辨析：十一屆三中全會 vs 十八屆三中全會", "p": "兩個「三中全會」別混：1978年十一屆三中全會＝開啟（正式提出）改革開放；十八屆三中全會＝開啟「全面深化」改革。講師：「兩個選擇題考點，注意。」", "o": "〖十一届三中全会〗——提出改革开放（1978）；〖十八届三中全会〗——全面深化改革", "m": "「11開始、18全面」：數字小的是開頭。"}, {"id": "C15-04", "l": 15, "ch": 5, "s": [6], "src": "", "tag": ["必背", "簡答題考點"], "t": "改革開放是重要法寶（三點）", "p": "知識點1三點：①改革開放是堅持和發展中特的必由之路；②全面深化改革開放是完成新時代目標任務的必然要求（講師：標題必須記住）；③中國要前進，就要全面深化改革開放。", "o": "（1）改革开放是坚持和发展中国特色社会主义的〖必由之路〗；（2）全面深化改革开放是完成新时代目标任务的〖必然要求〗；（3）中国要前进，就要〖全面深化改革开放〗", "m": "「必由之路・必然要求・要前進」。", "items": ["改革开放是坚持和发展中国特色社会主义的必由之路", "全面深化改革开放是完成新时代目标任务的必然要求", "中国要前进，就要全面深化改革开放"]}, {"id": "C15-05", "l": 15, "ch": 5, "s": [7, 8, 9, 10], "src": "", "tag": ["必背", "選擇題考點"], "t": "新時代全面深化改革開放是一場深刻革命", "p": "就其艱鉅性、複雜性和系統性來說，新時代全面深化改革開放是一場深刻的革命。三點：①是涉險灘、闖難關的變革；②着力解決新矛盾、應對新挑戰，引向深入；③是在多年改革開放基礎上的深化，是一場全面、系統、整體的制度創新。", "o": "（1）全面深化改革开放是〖涉险滩、闯难关〗的变革；（2）着力解决〖新矛盾〗、应对〖新挑战〗，把全面深化改革开放引向深入；（3）是在多年改革开放基础上的深化，是一场〖全面、系统、整体〗的〖制度创新〗", "m": "「險灘難關・新矛盾新挑戰・全面系統整體的制度創新」。", "items": ["全面深化改革开放是涉险滩、闯难关的变革", "着力解决新矛盾、应对新挑战，把全面深化改革开放引向深入", "是在多年改革开放基础上的深化，是一场全面、系统、整体的制度创新"]}, {"id": "C15-06", "l": 15, "ch": 5, "s": [11], "src": "", "tag": ["必背", "論述題考點"], "t": "堅持全面深化改革開放的正確方向（只答標黃）", "p": "方向有三：①堅持和改善黨的全面領導、堅持和完善中特制度；②堅持以人民為中心，促進公平正義、增進人民福祉；③有利於「三個進一步解放」。講師：大題考點，只答標黃部分。", "o": "（1）必须坚持和改善〖党的全面领导〗、坚持和完善〖中国特色社会主义制度〗；（2）必须坚持〖以人民为中心〗，促进社会公平正义、增进人民福祉；（3）必须有利于进一步〖解放思想〗、进一步〖解放和发展社会生产力〗、进一步〖解放和增强社会活力〗", "m": "「黨和制度・人民・三個解放（思想・生產力・活力）」。", "items": ["必须坚持和改善党的全面领导、坚持和完善中国特色社会主义制度", "必须坚持以人民为中心，促进社会公平正义、增进人民福祉", "必须有利于进一步解放思想、进一步解放和发展社会生产力、进一步解放和增强社会活力"]}, {"id": "C15-07", "l": 15, "ch": 5, "s": [11], "src": "逐字稿", "tag": ["必背", "選擇題考點", "易混"], "t": "改革是社會主義制度的自我完善和發展", "p": "講師：問「改革是什麼」的選擇題，就找這句——改革是社會主義制度的自我完善和發展，而不是改弦易張（不是換掉社會主義制度）。", "o": "改革是社会主义制度的〖自我完善和发展〗，而不是〖改弦易张〗", "m": "「改革＝自己修好自己，不是換掉自己」。"}, {"id": "C16-01", "l": 16, "ch": 5, "s": [3], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "全面深化改革的總目標（兩句都要講）", "p": "全面深化改革要達到什麼？兩句話：完善和發展中國特色社會主義制度；推進國家治理體系和治理能力現代化。講師：「兩句話必須要說才是完整的」，選擇、多選都考。", "o": "〖完善和发展中国特色社会主义制度〗、〖推进国家治理体系和治理能力现代化〗", "m": "「前句管方向，後句管指向」：制度（根本方向）＋治理（鮮明指向和時代要求）。"}, {"id": "C16-02", "l": 16, "ch": 5, "s": [3, 4], "src": "逐字稿", "tag": ["必背", "簡答題考點"], "t": "總目標兩句話的含義", "p": "第一句「完善和發展中國特色社會主義制度」規定了改革的根本方向；第二句「推進國家治理體系和治理能力現代化」明確了改革的鮮明指向和時代要求。講師：簡述總目標，一、二、三、四都必須答。", "o": "完善和发展中国特色社会主义制度，规定了改革的〖根本方向〗；推进国家治理体系和治理能力现代化，明确了改革的〖鲜明指向和时代要求〗", "m": "「制度→方向；治理→指向」。"}, {"id": "C16-03", "l": 16, "ch": 5, "s": [5, 6], "src": "", "tag": ["必背", "選擇題考點"], "t": "「六個緊緊圍繞」路線圖", "p": "六個緊緊圍繞：前五個對應「五位一體」（經濟、政治、文化、社會、生態），第六個是黨的建設（「永遠都用來兜底」）。經濟：使市場在資源配置中起決定性作用、更好發揮政府作用；政治：黨的領導、人民當家作主、依法治國有機統一；文化：社會主義核心價值體系；社會：民生；生態：美麗中國；最後：黨的建設。", "o": "经济——市场在资源配置中起〖决定性作用〗、更好发挥政府作用；政治——〖党的领导、人民当家作主、依法治国〗有机统一；文化——〖社会主义核心价值体系〗；社会——民生；生态——美丽中国；党的建设", "m": "「五位一體＋黨建兜底」＝經・政・文・社・生・黨。"}, {"id": "C16-04", "l": 16, "ch": 5, "s": [7], "src": "", "tag": ["必背"], "t": "國家治理體系與治理能力的關係（官方表述要背）", "p": "治理體系＝管國家的一整套制度；治理能力＝運用制度管理各方面事務的能力。兩者是一個有機整體、相輔相成：有好的體系才能提高能力，提高能力才能發揮體系的效能。例子：好的防疫制度（體系）要靠執行得好（能力）才有效。", "o": "国家治理体系和治理能力是一个〖有机整体〗，〖相辅相成〗，有了好的国家治理体系才能提高国家治理能力，提高国家治理能力才能充分发挥国家治理体系的〖效能〗", "m": "「體系是硬件，能力是軟件」；「有機整體・相輔相成・互相成就」。"}, {"id": "C16-05", "l": 16, "ch": 5, "s": [8, 10, 11], "src": "", "tag": ["必背", "簡答題考點"], "t": "推進國家治理體系和治理能力現代化（三個小標題）", "p": "三點：堅定中特制度自信；發揮中特制度優勢；把中特制度優勢轉化為國家治理效能。講師：「一定要把這個小標題背過。」", "o": "（1）坚定〖中国特色社会主义制度自信〗；（2）发挥〖中国特色社会主义制度优势〗；（3）把中国特色社会主义制度优势转化为〖国家治理效能〗", "m": "「信→用→變」：先相信制度，再發揮優勢，最後變成效能。", "items": ["坚定中国特色社会主义制度自信", "发挥中国特色社会主义制度优势", "把中国特色社会主义制度优势转化为国家治理效能"]}, {"id": "C16-06", "l": 16, "ch": 5, "s": [12, 13, 14], "src": "", "tag": ["必背", "論述題考點"], "t": "國家制度和國家治理體系的十三個顯著優勢（黃字關鍵詞）", "p": "講師：「儘可能的背過」，考論述題就把十三個打出來。關鍵詞：集中統一領導、人民當家作主、全面依法治國、全國一盤棋、各民族一律平等、公有制為主體多種所有制經濟共同發展、共同的理想信念價值理念道德觀念、以人民為中心的發展思想、改革創新與時俱進、德才兼備選賢任能、黨指揮槍、「一國兩制」、獨立自主和對外開放相統一。", "o": "集中统一领导；人民当家作主；全面依法治国；全国一盘棋；各民族一律平等；公有制为主体、多种所有制经济共同发展；共同的理想信念、价值理念、道德观念；以人民为中心的发展思想；改革创新、与时俱进；德才兼备、选贤任能；党指挥枪；“一国两制”；独立自主和对外开放相统一", "m": "「黨・民・法・棋・族｜經・念・心・新｜才・槍・兩制・開放」（5＋4＋4）。", "items": ["集中统一领导", "人民当家作主", "全面依法治国", "全国一盘棋", "各民族一律平等", "公有制为主体、多种所有制经济共同发展", "共同的理想信念、价值理念、道德观念", "以人民为中心的发展思想", "改革创新、与时俱进", "德才兼备、选贤任能", "党指挥枪", "“一国两制”", "独立自主和对外开放相统一"]}, {"id": "C16-07", "l": 16, "ch": 5, "s": [15, 16, 18, 19], "src": "", "tag": ["必背", "簡答題考點"], "t": "全面深化改革開放的正確方法論（五個標題）", "p": "講師：只背標題。①增強系統性、整體性、協同性；②加強頂層設計和摸着石頭過河相結合；③統籌改革發展穩定；④膽子要大、步子要穩；⑤堅持重大改革於法有據。", "o": "（1）增强全面深化改革的〖系统性、整体性、协同性〗；（2）加强〖顶层设计〗和〖摸着石头过河〗相结合；（3）统筹〖改革发展稳定〗；（4）〖胆子要大，步子要稳〗；（5）坚持重大改革〖于法有据〗", "m": "「系統・頂層＋石頭・改發穩・膽大步穩・於法有據」。", "items": ["增强全面深化改革的系统性、整体性、协同性", "加强顶层设计和摸着石头过河相结合", "统筹改革发展稳定", "胆子要大，步子要稳", "坚持重大改革于法有据"]}, {"id": "C16-08", "l": 16, "ch": 5, "s": [16, 18, 19], "src": "逐字稿", "tag": ["選擇題考點"], "t": "方法論的重要表述（摸着石頭過河、改革發展穩定、改革與法治）", "p": "摸着石頭過河是富有中國特色、符合中國國情的改革方法。改革是經濟社會發展的強大動力，發展是解決一切經濟社會問題的關鍵，穩定是改革發展的前提。重大改革要於法有據，「先立後破」；改革和法治如鳥之兩翼、車之兩輪。", "o": "摸着石头过河是富有〖中国特色〗、符合〖中国国情〗的改革方法；改革是〖强大动力〗，发展是〖关键〗，稳定是〖前提〗；先立后破；改革和法治如〖鸟之两翼、车之两轮〗", "m": "「改革＝動力、發展＝關鍵、穩定＝前提」（動・關・前）。"}, {"id": "C17-01", "l": 17, "ch": 5, "s": [3], "src": "", "tag": ["必背", "論述題考點"], "t": "改革開放永無止境（三個原因）", "p": "為什麼改革開放永遠不會停？①它是社會基本矛盾運動規律的深刻反映（社會總在變，矛盾總在出現）；②是總結世界社會主義實踐經驗得出的重要結論；③是推進黨和人民事業發展的必然要求。講師：大題考點。", "o": "改革开放永无止境是〖社会基本矛盾运动规律〗的深刻反映；是总结〖世界社会主义实践经验〗得出的重要结论；是推进〖党和人民事业发展〗的必然要求", "m": "「規律・經驗・要求」：理論上（規律）、歷史上（經驗）、現實上（要求）。", "items": ["社会基本矛盾运动规律的深刻反映", "总结世界社会主义实践经验得出的重要结论", "推进党和人民事业发展的必然要求"]}, {"id": "C17-02", "l": 17, "ch": 5, "s": [4, 5], "src": "", "tag": ["必背", "簡答題考點"], "t": "堅定不移把全面深化改革引向深入（七點）", "p": "講師的背誦技巧：「問題導向＋五位一體＋黨建」。①聚焦全面建設社會主義現代化國家中的重大問題；②經濟：深化社會主義市場經濟體制改革；③政治：深化人民當家作主制度體系改革；④文化體制改革；⑤社會體制改革；⑥生態文明體制改革；⑦健全加強黨的全面領導、全面從嚴治黨制度體系。", "o": "聚焦〖全面建设社会主义现代化国家中的重大问题〗；深化〖社会主义市场经济体制〗改革；深化〖人民当家作主制度体系〗改革；深化〖文化体制〗改革；深化〖社会体制〗改革；深化〖生态文明体制〗改革；健全加强党的全面领导、全面从严治党制度体系", "m": "「1問題＋5位一體（經政文社生）＋1黨建」＝7。", "items": ["聚焦全面建设社会主义现代化国家中的重大问题", "深化社会主义市场经济体制改革", "深化人民当家作主制度体系改革", "深化文化体制改革", "深化社会体制改革", "深化生态文明体制改革", "健全加强党的全面领导、全面从严治党制度体系"]}, {"id": "C17-03", "l": 17, "ch": 5, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "開放也是改革", "p": "講師：「注意，開放也是一種改革。」改革不停頓，開放不止步；中國開放的大門只會越開越大，永遠不會關上。開放帶來進步，封閉必然落後。", "o": "〖开放也是改革〗；改革不停顿，开放不止步；中国开放的大门只会〖越开越大〗", "m": "「開放＝改革的一種」。"}, {"id": "C17-04", "l": 17, "ch": 5, "s": [7, 9, 11], "src": "", "tag": ["選擇題考點"], "t": "堅定不移擴大高水平對外開放", "p": "要堅定不移擴大對外開放；繼續擴大對外開放，構建更高水平開放型經濟新體制。講師講到經濟全球化遭遇逆流（單邊主義、保護主義、孤立主義），要推動貿易和投資自由化便利化、共建「一帶一路」。最後一句「中國的發展離不開世界，世界的繁榮也需要中國」——講師說這裏不需要背。", "o": "（2）坚定不移扩大对外开放；（3）继续扩大对外开放，构建更高水平〖开放型经济新体制〗；（4）中国的发展离不开世界，世界的繁荣也需要中国", "m": "「擴大・新體制・互需」。"}, {"id": "C18-01", "l": 18, "ch": 6, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "正確認識歷史方位和發展階段是根本依據", "p": "先弄清楚「我們在哪個歷史位置、哪個發展階段」，黨才能定好每個階段的中心任務和正確政策。", "o": "正确认识〖历史方位和发展阶段〗，是我们党明确各个阶段中心任务、制定正确路线方针政策的〖根本依据〗", "m": "「知道在哪，才知道去哪」。"}, {"id": "C18-02", "l": 18, "ch": 6, "s": [6], "src": "逐字稿", "tag": ["必背", "選擇題考點"], "t": "經濟發展新常態的「三期疊加」", "p": "「三期疊加」＝三個時期同時出現：增長速度換擋期（增速變慢）、結構調整陣痛期（調整很痛苦）、前期刺激政策消化期（要消化以前的政策副作用）。講師：「把這三期記住了。」", "o": "〖增长速度换挡期〗、〖结构调整阵痛期〗、〖前期刺激政策消化期〗", "m": "「速・構・刺」：速度換擋、結構陣痛、刺激消化（像開車：換擋→顛簸→消化）。", "items": ["增长速度换挡期", "结构调整阵痛期", "前期刺激政策消化期"]}, {"id": "C18-03", "l": 18, "ch": 6, "s": [7], "src": "逐字稿", "tag": ["選擇題考點"], "t": "新發展階段的定位；1956年進入社會主義初級階段", "p": "新發展階段是社會主義初級階段中的一個重要階段。講師：1956年三大改造完成，我國正式進入社會主義初級階段。", "o": "新发展阶段是社会主义初级阶段中的一个〖重要阶段〗；从〖1956年〗（三大改造完成）我国正式进入社会主义初级阶段", "m": "「56年三大改造完→初級階段開始」。"}, {"id": "C18-04", "l": 18, "ch": 6, "s": [8], "src": "逐字稿", "tag": ["選擇題考點"], "t": "發展理念的重要性：管全局、管根本、管方向、管長遠", "p": "發展理念是發展行動的「先導」（先有想法才有行動），是管全局、管根本、管方向、管長遠的東西。講師也說：新發展理念是「指揮棒」、是「紅綠燈」。", "o": "发展理念是发展行动的〖先导〗，是管〖全局〗、管〖根本〗、管〖方向〗、管〖长远〗的东西；新发展理念是〖指挥棒〗、是〖红绿灯〗", "m": "四個「管」：全・根・方・長；比喻：指揮棒＋紅綠燈。"}, {"id": "C18-05", "l": 18, "ch": 6, "s": [9, 10], "src": "", "tag": ["必背", "選擇題考點", "論述題考點"], "t": "新發展理念五句（定位）", "p": "五大理念各自是什麼：創新＝第一動力；協調＝內在要求；綠色＝必要條件和重要體現；開放＝必由之路；共享＝本質要求。講師：「這個是我們學習的重點、考點，背。」", "o": "①〖创新〗是引领发展的第一动力；②〖协调〗是持续健康发展的内在要求；③〖绿色〗是永续发展的必要条件和人民对美好生活追求的重要体现；④〖开放〗是国家繁荣发展的必由之路；⑤〖共享〗是中国特色社会主义的本质要求", "m": "口訣「創・協・綠・開・共」；定位「動力・要求・條件・之路・本質」。", "items": ["创新是引领发展的第一动力", "协调是持续健康发展的内在要求", "绿色是永续发展的必要条件和人民对美好生活追求的重要体现", "开放是国家繁荣发展的必由之路", "共享是中国特色社会主义的本质要求"]}, {"id": "C18-06", "l": 18, "ch": 6, "s": [9, 10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "新發展理念五句（各自解決的問題）", "p": "每個理念「注重解決」一個問題：創新→發展動力問題；協調→發展不平衡問題；綠色→人與自然和諧共生問題；開放→發展內外聯動問題；共享→社會公平正義問題。講師：每條背到「解決……問題」為止。", "o": "创新发展注重的是解决〖发展动力〗问题；协调发展注重的是解决发展〖不平衡〗问题；绿色发展注重的是解决〖人与自然和谐共生〗问题；开放发展注重的是解决发展〖内外联动〗问题；共享发展注重的是解决〖社会公平正义〗问题", "m": "「動力・不平衡・人與自然・內外・公平」。例子：沒有創新→沒動力；城鄉差太遠→不協調；污染→不綠色；只顧國內→不開放；分配不公→不共享。"}, {"id": "C18-07", "l": 18, "ch": 6, "s": [10], "src": "", "tag": ["必背", "多選題考點"], "t": "共享的四個方面", "p": "共享發展必須堅持四個共享：全民共享（人人有份）、全面共享（各方面都享）、共建共享（一起建才能一起享）、漸進共享（一步步來）。講師：多選題。", "o": "必须坚持〖全民共享〗、〖全面共享〗、〖共建共享〗、〖渐进共享〗，不断推进全体人民共同富裕", "m": "「全民・全面・共建・漸進」＝「人・面・建・漸」。", "items": ["全民共享", "全面共享", "共建共享", "渐进共享"]}, {"id": "C18-08", "l": 18, "ch": 6, "s": [11, 12], "src": "逐字稿", "tag": ["必背", "簡答題考點"], "t": "完整、準確、全面理解和把握新發展理念（三個「從……上」）", "p": "講師：「一、二、三這個也是要背的」：①從根本宗旨上把握；②從問題導向上把握；③從憂患意識上把握。", "o": "从〖根本宗旨〗上把握新发展理念；从〖问题导向〗上把握新发展理念；从〖忧患意识〗上把握新发展理念", "m": "「宗旨・問題・憂患」。", "items": ["从根本宗旨上把握新发展理念", "从问题导向上把握新发展理念", "从忧患意识上把握新发展理念"]}, {"id": "C18-09", "l": 18, "ch": 6, "s": [13], "src": "", "tag": ["必背", "選擇題考點"], "t": "高質量發展的定義（五個「成為」）", "p": "高質量發展＝能很好滿足人民美好生活需要、體現新發展理念的發展：創新成為第一動力、協調成為內生特點、綠色成為普遍形態、開放成為必由之路、共享成為根本目的。講師：要重點記一下。", "o": "〖创新成为第一动力〗、协调成为〖内生特点〗、绿色成为〖普遍形态〗、开放成为〖必由之路〗、共享成为〖根本目的〗的发展", "m": "再用一次「創協綠開共」：動力・內生・普遍・必由・目的。"}, {"id": "C18-10", "l": 18, "ch": 6, "s": [14, 15], "src": "", "tag": ["必背", "簡答題考點"], "t": "高質量發展的要求（五方面）", "p": "講師：從供給、需求、投入產出、分配、宏觀經濟循環這幾方面把它背過。", "o": "从〖供给〗看；从〖需求〗看；从〖投入产出〗看；从〖分配〗看；从〖宏观经济循环〗看", "m": "「供・需・投・分・環」——按經濟流程：生產（供給）→消費（需求）→效率（投入產出）→分錢（分配）→整體循環。", "items": ["供给", "需求", "投入产出", "分配", "宏观经济循环"]}, {"id": "C18-11", "l": 18, "ch": 6, "s": [16, 17], "src": "", "tag": ["必背", "簡答題考點"], "t": "高質量發展的戰略意義（只背黃色）", "p": "①為全面建設社會主義現代化國家提供更為堅實的物質基礎；②是不斷滿足人民對美好生活需要的重要保證；③是維護國家長治久安的必然要求。", "o": "（1）为全面建设社会主义现代化国家提供更为坚实的〖物质基础〗；（2）是不断满足人民对美好生活需要的〖重要保证〗；（3）是维护国家长治久安的〖必然要求〗", "m": "「基礎・保證・要求」。", "items": ["为全面建设社会主义现代化国家提供更为坚实的物质基础", "是不断满足人民对美好生活需要的重要保证", "是维护国家长治久安的必然要求"]}, {"id": "C19-01", "l": 19, "ch": 6, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "社會主義基本經濟制度的地位", "p": "基本經濟制度是我國「生產關係」（誰擁有、怎樣分、怎樣配置資源）在制度上的體現，在經濟制度體系中起基礎性、決定性作用，是中特制度的重要支柱。", "o": "社会主义基本经济制度是我国〖生产关系〗在制度上的体现，在经济制度体系中具有〖基础性决定性〗地位，是中国特色社会主义制度的〖重要支柱〗", "m": "「生產關係・基礎決定・重要支柱」。"}, {"id": "C19-02", "l": 19, "ch": 6, "s": [4, 5], "src": "", "tag": ["必背", "多選題考點"], "t": "十八大以來對基本經濟制度的新概括（三項）", "p": "基本經濟制度包括三項：①公有制為主體、多種所有制經濟共同發展（所有制）；②按勞分配為主體、多種分配方式並存（分配）；③社會主義市場經濟體制（資源配置）。", "o": "〖公有制为主体、多种所有制经济共同发展〗，〖按劳分配为主体、多种分配方式并存〗，〖社会主义市场经济体制〗", "m": "「誰擁有・怎麼分・怎麼配」＝所有制・分配・市場。", "items": ["公有制为主体、多种所有制经济共同发展", "按劳分配为主体、多种分配方式并存", "社会主义市场经济体制"]}, {"id": "C19-03", "l": 19, "ch": 6, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "所有制結構是基本經濟制度的基礎", "p": "「誰擁有生產資料」決定了怎麼分配、怎麼配置資源，所以所有制結構是基礎。講師：後段（系統性影響）不用背，理解意思即可。", "o": "〖所有制结构〗是基本经济制度的基础，决定〖分配方式〗和〖资源配置方式〗", "m": "「所有制是地基」。"}, {"id": "C19-04", "l": 19, "ch": 6, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "公有制和非公有制都是重要組成部分；兩個毫不動搖", "p": "公有制經濟和非公有制經濟都是「社會主義市場經濟」的重要組成部分，都是經濟社會發展的重要基礎。所以要「兩個毫不動搖」：毫不動搖鞏固和發展公有制經濟，毫不動搖鼓勵、支持、引導非公有制經濟發展。講師：必須背過。", "o": "公有制经济和非公有制经济都是〖社会主义市场经济〗的重要组成部分，都是我国经济社会发展的〖重要基础〗；毫不动摇地〖巩固和发展〗公有制经济，毫不动摇地〖鼓励、支持、引导〗非公有制经济发展", "m": "「都是・都是・兩個毫不動搖」：公＝鞏固發展；非公＝鼓勵支持引導。"}, {"id": "C19-05", "l": 19, "ch": 6, "s": [8], "src": "逐字稿", "tag": ["必背", "選擇題考點", "易混"], "t": "公有制主體地位、國有經濟主導作用、戰略支撐作用", "p": "公有制＝「主體地位」；國有經濟＝「主導作用」；還要發揮國有經濟的「戰略支撐作用」。國有企業是中特的重要物質基礎和政治基礎，是黨執政興國的重要支柱和依靠力量。", "o": "公有制——〖主体地位〗；国有经济——〖主导作用〗；发挥国有经济的〖战略支撑作用〗；国有企业是中国特色社会主义的重要〖物质基础和政治基础〗", "m": "「公＝主體、國有＝主導」（體大、導帶路）。"}, {"id": "C19-06", "l": 19, "ch": 6, "s": [9, 10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "非公有制經濟與民營經濟", "p": "講師提醒「很喜歡考選擇題」：非公有制經濟是「社會主義市場經濟」的重要組成部分。民營經濟是非公有制經濟的主要（經濟）組織形式；是推進中國式現代化的生力軍、高質量發展的重要基礎。", "o": "非公有制经济是〖社会主义市场经济〗的重要组成部分；〖民营经济〗是非公有制经济的〖主要经济组织形式〗；是推进中国式现代化的〖生力军〗", "m": "「非公→市場經濟的組成」；「民營→非公的主要形式」。"}, {"id": "C19-07", "l": 19, "ch": 6, "s": [11], "src": "", "tag": ["選擇題考點"], "t": "公有制經濟與非公有制經濟的關係", "p": "兩者不是對立的，而是相輔相成、相得益彰（互相幫助、互相成就）。", "o": "公有制经济与非公有制经济〖相辅相成〗、〖相得益彰〗", "m": "「相輔・相得」。"}, {"id": "C19-08", "l": 19, "ch": 6, "s": [12], "src": "", "tag": ["選擇題考點"], "t": "基本分配制度", "p": "按勞分配為主體、多種分配方式並存的基本分配制度，是由社會主義性質和初級階段基本國情決定的。", "o": "〖按劳分配为主体、多种分配方式并存〗的〖基本分配制度〗，由社会主义性质和基本国情决定", "m": "「勞為主、多並存」。"}, {"id": "C19-09", "l": 19, "ch": 6, "s": [15], "src": "", "tag": ["必背", "選擇題考點"], "t": "構建高水平社會主義市場經濟體制", "p": "關鍵是處理好政府和市場的關係：使市場在資源配置中起決定性作用，更好發揮政府作用；並加快建設高標準市場體系。", "o": "（1）处理好〖政府和市场〗的关系——使市场在资源配置中起〖决定性作用〗，更好发挥政府作用；（2）加快建设〖高标准市场体系〗", "m": "「市場決定、政府更好」。"}, {"id": "C20-01", "l": 20, "ch": 6, "s": [3, 4], "src": "", "tag": ["必背", "簡答題考點"], "t": "構建新發展格局：把握未來發展主動權的戰略部署（四個標題）", "p": "講師：只記標題。①是對客觀經濟規律和發展趨勢的自覺把握；②是把握未來發展主動權的先手棋（不是被迫，也不是權宜之計）；③是開放的國內國際雙循環；④是以全國統一大市場基礎上的國內大循環為主體。", "o": "（1）构建新发展格局是对我国客观经济规律和发展趋势的〖自觉把握〗；（2）是把握未来发展主动权的〖先手棋〗；（3）是〖开放的国内国际双循环〗；（4）是以全国统一大市场基础上的〖国内大循环为主体〗", "m": "講師回顧口訣：「第一自覺把握、第二先手棋、第三雙循環、第四國內大循環為主體」。", "items": ["对我国客观经济规律和发展趋势的自觉把握", "把握未来发展主动权的先手棋", "开放的国内国际双循环", "以全国统一大市场基础上的国内大循环为主体"]}, {"id": "C20-02", "l": 20, "ch": 6, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "以國內大循環為主體：國內大循環起主導作用", "p": "國內和國際兩個循環都存在，但起「主導作用」的是國內大循環。講師：選擇題考點。", "o": "加强〖国内大循环〗在双循环中的〖主导作用〗", "m": "「國內＝主角，國際＝配角」。"}, {"id": "C20-03", "l": 20, "ch": 6, "s": [5, 6], "src": "", "tag": ["選擇題考點"], "t": "以國內大循環為主體、國內國際雙循環相互促進（三點）", "p": "①加強國內大循環在雙循環中的主導作用；②發揮比較優勢；③構建新發展格局必須保證經濟循環的暢通無阻。", "o": "（1）加强国内大循环在双循环中的主导作用；（2）发挥〖比较优势〗；（3）构建新发展格局必须保证经济循环的〖畅通无阻〗", "m": "「主導・比較優勢・暢通」。", "items": ["加强国内大循环在双循环中的主导作用", "发挥比较优势", "构建新发展格局必须保证经济循环的畅通无阻"]}, {"id": "C20-04", "l": 20, "ch": 6, "s": [7, 8], "src": "逐字稿", "tag": ["必背", "選擇題考點"], "t": "大力推動構建新發展格局（實體經濟、科技自立自強）", "p": "怎樣推動：擴大內需戰略同深化供給側結構性改革有機結合；着力發展實體經濟（講師選擇題：實體經濟是一國經濟的立身之本、財富源泉）；加快科技自立自強（構建新發展格局最本質的特徵是實現高水平的自立自強）；推動產業鏈供應鏈優化升級。", "o": "扩大内需战略同深化〖供给侧结构性改革〗有机结合；实体经济是一国经济的〖立身之本〗、财富源泉；构建新发展格局最本质的特征是实现〖高水平的自立自强〗", "m": "「內需＋供給側・實體經濟・自立自強・產業鏈」。"}, {"id": "C21-01", "l": 21, "ch": 6, "s": [3, 4], "src": "", "tag": ["必背", "簡答題考點"], "t": "建設現代化產業體系（六個黃色標題）", "p": "講師：需要背過，六個黃色標題是簡答題考點。①鞏固優勢產業領先地位；②大力發展戰略性新興產業（具有先導性）；③構建優質高效的服務業新體系（現代服務業是重要支撐）；④發展現代流通產業（連通生產和消費）；⑤加快發展數字經濟；⑥構建現代化基礎設施體系。", "o": "（1）巩固〖优势产业〗领先地位；（2）大力发展〖战略性新兴产业〗；（3）构建优质高效的〖服务业新体系〗；（4）发展〖现代流通产业〗；（5）加快发展〖数字经济〗；（6）构建现代化〖基础设施体系〗", "m": "「優・新・服・流・數・基」：老強項→新產業→服務業→流通→數字→基建。", "items": ["巩固优势产业领先地位", "大力发展战略性新兴产业", "构建优质高效的服务业新体系", "发展现代流通产业", "加快发展数字经济", "构建现代化基础设施体系"]}, {"id": "C21-02", "l": 21, "ch": 6, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "鄉村振興戰略的「總目標・總方針・總要求・制度保障」", "p": "講師：四個選擇題考點，背。總目標＝農業農村現代化；總方針＝堅持農業農村優先發展；總要求＝產業興旺、生態宜居、鄉風文明、治理有效、生活富裕（20字）；制度保障＝建立健全城鄉融合發展體制機制和政策體系。另：農業強國是社會主義現代化強國的根基。", "o": "〖农业农村现代化〗是总目标；坚持〖农业农村优先发展〗是总方针；〖产业兴旺、生态宜居、乡风文明、治理有效、生活富裕〗是总要求；建立健全〖城乡融合发展体制机制和政策体系〗是制度保障", "m": "「目標＝現代化、方針＝優先、要求＝20字、保障＝城鄉融合」。20字口訣「產・生・鄉・治・富」。"}, {"id": "C21-03", "l": 21, "ch": 6, "s": [6, 7], "src": "", "tag": ["選擇題考點"], "t": "鄉村振興要處理好的四組關係", "p": "全面實施鄉村振興戰略是一項艱巨複雜的事業，必須統籌謀劃、科學推進。要處理好四組關係：①長期目標和短期目標；②頂層設計和基層探索（落實黨中央的頂層設計，同時發揮億萬農民的主體作用和首創精神）；③充分發揮市場決定性作用和更好發揮政府作用；④增強群眾獲得感和適應發展階段。講師也說：耕地紅線是不能夠忍讓的。", "o": "①处理好〖长期目标和短期目标〗的关系；②处理好〖顶层设计和基层探索〗的关系；③处理好〖充分发挥市场决定性作用和更好发挥政府作用〗的关系；④处理好〖增强群众获得感和适应发展阶段〗的关系", "m": "「長短・上下・市場政府・獲得感與階段」。", "items": ["长期目标和短期目标", "顶层设计和基层探索", "充分发挥市场决定性作用和更好发挥政府作用", "增强群众获得感和适应发展阶段"]}, {"id": "C21-04", "l": 21, "ch": 6, "s": [8], "src": "", "tag": ["必背", "簡答題考點"], "t": "促進區域協調發展", "p": "講師：「如何促進區域協調？把這幾個給我背過。」深入實施區域協調發展戰略、區域重大戰略、主體功能區戰略；推進以人為核心的新型城鎮化，加快農業轉移人口市民化；合理分工、優化發展。", "o": "深入实施〖区域协调发展战略〗、〖区域重大战略〗、〖主体功能区战略〗；推进〖以人为核心〗的新型城镇化，加快农业转移人口市民化；〖合理分工、优化发展〗", "m": "「三戰略＋城鎮化（以人為核心）＋分工」。", "items": ["深入实施区域协调发展战略、区域重大战略、主体功能区战略", "推进以人为核心的新型城镇化，加快农业转移人口市民化", "合理分工、优化发展"]}, {"id": "C22-01", "l": 22, "ch": 7, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "教育、科技、人才一體推進的深層次原因", "p": "為什麼要把教育、科技、人才一起推進？因為建設教育強國、科技強國、人才強國有「內在一致性和相互支撐性」——三者目標一致、互相幫忙。（發展現狀、支撐與貢獻兩段講師說了解即可，不用背。）", "o": "建设教育强国、科技强国、人才强国具有〖内在一致性〗和〖相互支撑性〗", "m": "「教科人三兄弟：一致＋互撐」。"}, {"id": "C22-02", "l": 22, "ch": 7, "s": [10], "src": "", "tag": ["必背", "選擇題考點"], "t": "科教興國戰略：科學技術是第一生產力", "p": "科教興國戰略就是要全面落實「科學技術是第一生產力」的思想，堅持教育優先發展；同頁黃字：創新在國家發展全局中居於核心位置。", "o": "〖科教兴国战略〗——全面落实〖科学技术是第一生产力〗的思想；〖创新〗在国家发展全局中居于〖核心位置〗", "m": "「科教興國→第一生產力」。"}, {"id": "C22-03", "l": 22, "ch": 7, "s": [11], "src": "", "tag": ["必背", "選擇題考點"], "t": "人才強國戰略：人才資源是第一資源；黨管人才", "p": "人才強國戰略要鞏固樹立「人才資源是第一資源」的理念；實施人才強國戰略要堅持「黨管人才」原則。講師：選擇題。", "o": "〖人才强国战略〗——树立〖人才资源是第一资源〗的理念；坚持〖党管人才〗的原则", "m": "「人才強國→第一資源」。"}, {"id": "C22-04", "l": 22, "ch": 7, "s": [12], "src": "", "tag": ["必背", "選擇題考點"], "t": "創新驅動發展戰略：創新是第一動力", "p": "創新驅動發展戰略就是要堅持「創新是第一動力」（新發展理念的內容）。講師：只需要把黃色部分記住。", "o": "〖创新驱动发展战略〗——坚持〖创新是第一动力〗", "m": "「創新驅動→第一動力」。"}, {"id": "C22-05", "l": 22, "ch": 7, "s": [10, 11, 12], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "易混辨析：三個「第一」——生產力・資源・動力", "p": "講師特別強調：「創新是第一動力，科學技術才是第一生產力，一定要把這個給區分開」；另外人才資源是第一資源。對應三大戰略：科教興國↔第一生產力；人才強國↔第一資源；創新驅動↔第一動力。", "o": "〖科学技术〗是第一生产力；〖人才资源〗是第一资源；〖创新〗是第一动力", "m": "「科技生產、人才資源、創新動力」——「科・人・創」配「產・源・動」。"}, {"id": "C22-06", "l": 22, "ch": 7, "s": [10, 11, 12], "src": "", "tag": ["選擇題考點", "易混"], "t": "三大戰略對應", "p": "三大戰略：科教興國戰略、人才強國戰略、創新驅動發展戰略，各自對應一個「第一」。", "o": "科教兴国战略——〖第一生产力〗；人才强国战略——〖第一资源〗；创新驱动发展战略——〖第一动力〗", "m": "同上口訣。"}, {"id": "C22-07", "l": 22, "ch": 7, "s": [13], "src": "", "tag": ["必背", "選擇題考點"], "t": "教育優先發展・科技自立自強・人才引領驅動", "p": "教育優先發展是推動黨和國家各項事業發展的重要先手棋；科技自立自強是決定我國生存和發展的基礎能力；人才引領驅動是經濟社會發展和國家現代化的一個基本規律，具有基礎性的戰略意義。", "o": "〖教育优先发展〗是推动党和国家各项事业发展的重要〖先手棋〗；〖科技自立自强〗是决定我国生存和发展的〖基础能力〗；〖人才引领驱动〗是经济社会发展和国家现代化的〖基本规律〗", "m": "「教育＝先手棋、科技＝基礎能力、人才＝基本規律」。"}, {"id": "C23-01", "l": 23, "ch": 7, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "教育是民族振興、社會進步的基石；國之大計、黨之大計", "p": "教育像房子的「基石」：國家要振興、社會要進步，都要靠教育打底。教育是國之大計、黨之大計。", "o": "教育是〖民族振兴、社会进步〗的〖基石〗；教育是〖国之大计、党之大计〗", "m": "「基石＝打地基」；「國之大計、黨之大計」。"}, {"id": "C23-02", "l": 23, "ch": 7, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "辦好中國特色社會主義教育：黨的全面領導是根本保證", "p": "必須堅持黨對教育工作的全面領導，堅持黨的教育方針……是辦好教育的根本保證。講師：把這一段背到這裏就可以了。", "o": "必须坚持〖党对教育工作的全面领导〗，坚持党的教育方针……是办好教育的〖根本保证〗", "m": "「黨領導教育＝根本保證」。"}, {"id": "C23-03", "l": 23, "ch": 7, "s": [7, 8], "src": "", "tag": ["必背", "選擇題考點"], "t": "落實立德樹人根本任務：教育的根本問題", "p": "培養什麼人、怎樣培養人、為誰培養人，是教育的根本問題，也是建設教育強國的核心課題。", "o": "〖培养什么人、怎样培养人、为谁培养人〗是教育的〖根本问题〗，也是建设教育强国的〖核心课题〗", "m": "「什麼人・怎樣培養・為誰」三問。", "items": ["培养什么人", "怎样培养人", "为谁培养人"]}, {"id": "C23-04", "l": 23, "ch": 7, "s": [8], "src": "逐字稿", "tag": ["必背", "多選題考點"], "t": "全員育人・全過程育人・全方位育人", "p": "講師：多選題——全員育人、全過程育人、全方位育人（家庭、學校、社會協同）。", "o": "〖全员育人〗、〖全过程育人〗、〖全方位育人〗", "m": "「人・時・地」：全員（所有人）、全過程（所有時間）、全方位（所有地方）。", "items": ["全员育人", "全过程育人", "全方位育人"]}, {"id": "C23-05", "l": 23, "ch": 7, "s": [9, 10, 11], "src": "", "tag": ["必背", "簡答題考點"], "t": "辦好人民滿意的教育（五個黃色標題）", "p": "講師：背黃色標題。①大力促進教育公平；②加快建設高質量教育體系；③提升教育服務經濟社會發展能力；④堅持深化教育改革創新；⑤堅持把教師隊伍建設作為基礎工作。人民滿意才是教育的根本尺度。", "o": "（1）大力促进〖教育公平〗；（2）加快建设〖高质量教育体系〗；（3）提升教育服务〖经济社会发展〗能力；（4）坚持深化〖教育改革创新〗；（5）坚持把〖教师队伍建设〗作为基础工作", "m": "「公平・質量・服務・改革・教師」＝「公・質・服・改・師」。", "items": ["大力促进教育公平", "加快建设高质量教育体系", "提升教育服务经济社会发展能力", "坚持深化教育改革创新", "坚持把教师队伍建设作为基础工作"]}, {"id": "C23-06", "l": 23, "ch": 7, "s": [9, 10, 11], "src": "逐字稿", "tag": ["選擇題考點"], "t": "教育的幾個「定位句」", "p": "教育公平是社會公平的重要基礎（講師：選擇）；高質量發展是各級各類教育的生命線；服務高質量發展是建設教育強國的重要任務；教育大計，教師為本，強教必先強師。", "o": "〖教育公平〗是社会公平的〖重要基础〗；〖高质量发展〗是各级各类教育的〖生命线〗；教育大计，〖教师为本〗", "m": "「公平＝基礎、質量＝生命線、教師＝根本」。"}, {"id": "C24-01", "l": 24, "ch": 7, "s": [3, 4, 5], "src": "", "tag": ["必背", "選擇題考點", "簡答題考點"], "t": "科技強則國家強（三點）", "p": "實現高水平科技自立自強：①是國家強盛和民族復興的戰略基石（選擇題）；②是應對風險挑戰和維護國家利益的必然選擇（背這一句）；③是構建新發展格局、推動高質量發展、滿足人民美好生活需要的內在要求。講師：內文理解即可，背黃色標題。", "o": "实现高水平科技自立自强是国家强盛和民族复兴的〖战略基石〗；是应对风险挑战和维护国家利益的〖必然选择〗；是构建新发展格局、推动高质量发展、满足人民美好生活需要的〖内在要求〗", "m": "「基石・選擇・要求」。", "items": ["实现高水平科技自立自强是国家强盛和民族复兴的战略基石", "实现高水平科技自立自强是应对风险挑战和维护国家利益的必然选择", "实现高水平科技自立自强是构建新发展格局、推动高质量发展、满足人民美好生活需要的内在要求"]}, {"id": "C24-02", "l": 24, "ch": 7, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "關鍵核心技術必須掌握在自己手中", "p": "講師：「這一句背下來就可以了。」關鍵核心技術是要不來、買不來、討不來的。要深入推進科技體制改革，發揮新型舉國體制優勢開展科技攻關。", "o": "关键核心技术必须掌握在〖自己手中〗；关键核心技术是〖要不来、买不来、讨不来〗的；发挥〖新型举国体制〗优势", "m": "「三不來」：要、買、討都不來。"}, {"id": "C24-03", "l": 24, "ch": 7, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "增強自主創新能力；基礎研究是源頭", "p": "要緊緊抓住自主創新；基礎研究是科技創新的「源頭」（像河流的源頭）。", "o": "紧紧抓住〖自主创新〗；〖基础研究〗是科技创新的〖源头〗", "m": "「基礎研究＝源頭活水」。"}, {"id": "C24-04", "l": 24, "ch": 7, "s": [8], "src": "", "tag": ["必背", "多選題考點", "選擇題考點"], "t": "國家戰略科技力量（四項）", "p": "國家戰略科技力量是世界科技強國競爭的「着力點」。講師：主要包括哪些最好記一記，可能考選擇題（ABCD四個）：國家實驗室、國家科研機構、高水平研究型大學、科技領軍企業。", "o": "国家战略科技力量是世界科技强国竞争的〖着力点〗：〖国家实验室〗、〖国家科研机构〗、〖高水平研究型大学〗、〖科技领军企业〗", "m": "「室・所・校・企」：實驗室、科研機構、大學、企業。", "items": ["国家实验室", "国家科研机构", "高水平研究型大学", "科技领军企业"]}, {"id": "C25-01", "l": 25, "ch": 7, "s": [3, 4], "src": "", "tag": ["必背", "簡答題考點"], "t": "培養人才是國家和民族長遠發展大計（兩點）", "p": "為什麼要培養人才？①人才是人力資源中能力和素質較高的勞動者，在國家發展中具有重要戰略地位；②加快人才隊伍建設是推動國家發展、實現民族復興的必然要求。講師：「背啊背啊。」", "o": "培养人才是国家和民族长远发展〖大计〗；（1）人才是人力资源中〖能力和素质较高〗的劳动者，在国家发展中具有〖重要战略地位〗；（2）加快人才队伍建设是推动国家发展、实现民族复兴的〖必然要求〗", "m": "「人才是誰（高素質勞動者）＋為什麼（必然要求）」。", "items": ["人才是人力资源中能力和素质较高的劳动者，在国家发展中具有重要战略地位", "加快人才队伍建设是推动国家发展、实现民族复兴的必然要求"]}, {"id": "C25-02", "l": 25, "ch": 7, "s": [5, 6, 7], "src": "", "tag": ["必背", "簡答題考點"], "t": "培養造就大批德才兼備的高素質人才（三點）", "p": "①不斷壯大國家戰略人才力量；②走好人才自主培養之路；③加快建設世界重要人才中心和創新高地。（2025、2030、2035年細項講師說了解就行，不需要背。）", "o": "（1）不断壮大〖国家战略人才力量〗；（2）走好〖人才自主培养〗之路；（3）加快建设世界重要〖人才中心和创新高地〗", "m": "「壯大・自主・高地」。", "items": ["不断壮大国家战略人才力量", "走好人才自主培养之路", "加快建设世界重要人才中心和创新高地"]}, {"id": "C25-03", "l": 25, "ch": 7, "s": [9, 10], "src": "", "tag": ["必背", "選擇題考點", "簡答題考點"], "t": "把各方面優秀人才集聚到黨和國家事業中來（三個「保」）", "p": "①堅持黨對人才工作的全面領導，是做好人才工作的根本保證；②堅持深化人才發展體制機制改革，是重要保障（如破除「四唯」）；③堅持營造識才愛才敬才用才的環境，是社會條件。", "o": "（1）坚持〖党对人才工作的全面领导〗是做好人才工作的〖根本保证〗；（2）坚持深化〖人才发展体制机制改革〗是做好人才工作的〖重要保障〗；（3）坚持营造〖识才爱才敬才用才〗的环境是做好人才工作的〖社会条件〗", "m": "「黨＝根本保證、改革＝重要保障、環境＝社會條件」；「識愛敬用」四字。", "items": ["坚持党对人才工作的全面领导是做好人才工作的根本保证", "坚持深化人才发展体制机制改革是做好人才工作的重要保障", "坚持营造识才爱才敬才用才的环境是做好人才工作的社会条件"]}, {"id": "C26-01", "l": 26, "ch": 8, "s": [6, 7], "src": "", "tag": ["必背", "選擇題考點"], "t": "人民民主是社會主義的生命；民主的重要性", "p": "人民民主是社會主義的「生命」（講師：就是一個選擇題）。民主的重要性只記黃字兩句：民主是全人類共同價值，是人類政治文明發展的成果；民主是中國共產黨和中國人民始終不渝堅持的重要理念。", "o": "〖人民民主〗是社会主义的〖生命〗；（1）民主是〖全人类共同价值〗，是人类政治文明发展的成果；（2）民主是中国共产党和中国人民〖始终不渝坚持的重要理念〗", "m": "「民主＝社會主義的命」。"}, {"id": "C26-02", "l": 26, "ch": 8, "s": [8, 9], "src": "", "tag": ["選擇題考點"], "t": "人民民主的重要性：新型民主；應有之義", "p": "人民民主是新型的社會主義民主；人民民主是全面建設社會主義現代化國家的「應有之義」（本來就應該有的內容）。", "o": "（1）〖新型的社会主义民主〗；（2）人民民主是全面建设社会主义现代化国家的〖应有之义〗", "m": "「新型＋應有之義」。"}, {"id": "C26-03", "l": 26, "ch": 8, "s": [11], "src": "", "tag": ["必背", "選擇題考點"], "t": "中特政治制度由三類制度組成", "p": "中國特色社會主義政治制度是由根本政治制度、基本政治制度、重要政治制度等組成的制度體系；它行得通、有生命力、有效率。", "o": "中国特色社会主义政治制度是由〖根本政治制度〗、〖基本政治制度〗、〖重要政治制度〗等组成的制度体系；行得通、有生命力、有效率", "m": "「根本・基本・重要」三層。"}, {"id": "C26-04", "l": 26, "ch": 8, "s": [15], "src": "", "tag": ["必背", "多選題考點"], "t": "黨的領導、人民當家作主、依法治國有機統一", "p": "走中國特色社會主義政治發展道路，必須堅持黨的領導、人民當家作主、依法治國有機統一。講師：多選題考點，必須背過。", "o": "坚持〖党的领导〗、〖人民当家作主〗、〖依法治国〗有机统一", "m": "「黨・民・法」三合一。", "items": ["党的领导", "人民当家作主", "依法治国"]}, {"id": "C26-05", "l": 26, "ch": 8, "s": [15], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "三者各自的地位（根本保證・本質特徵・基本方式）", "p": "黨的領導是人民當家作主和依法治國的「根本保證」；人民當家作主是社會主義民主政治的「本質特徵」；依法治國是黨領導人民治理國家的「基本方式」（講師：說「基本方略」也可以，不要換了一個字就不會）。最根本的是堅持黨的領導。", "o": "党的领导是人民当家作主和依法治国的〖根本保证〗；人民当家作主是社会主义民主政治的〖本质特征〗；依法治国是党领导人民治理国家的〖基本方式〗", "m": "「黨＝保證、民＝本質、法＝方式」。"}, {"id": "C26-06", "l": 26, "ch": 8, "s": [16], "src": "", "tag": ["必背", "選擇題考點"], "t": "積極穩妥推進政治體制改革；保持政治定力", "p": "走中特政治發展道路，必須積極穩妥推進政治體制改革（講師：這一句記下來）；還要保持政治定力。", "o": "必须积极稳妥推进〖政治体制改革〗；保持〖政治定力〗", "m": "「積極＋穩妥」，不急也不停。"}, {"id": "C27-01", "l": 27, "ch": 8, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "全過程人民民主是社會主義民主政治的偉大創造", "p": "全過程人民民主植根於我國社會主義民主的長期實踐，是新時代我國民主政治領域具有重大創新意義的「標誌性成果」。", "o": "全过程人民民主是新时代我国民主政治领域具有重大创新意义的〖标志性成果〗", "m": "「重大創新＋標誌性成果」。"}, {"id": "C27-02", "l": 27, "ch": 8, "s": [4, 5], "src": "", "tag": ["必背", "多選題考點"], "t": "全過程人民民主的特點（四個統一）", "p": "四個「統一」：過程民主和成果民主的統一、程序民主和實質民主的統一、直接民主和間接民主的統一、人民民主和國家意志的統一。講師：「記住。」例子：不只看投票過程（過程），也看結果有沒有幫到人民（成果）。", "o": "〖过程民主和成果民主〗的统一、〖程序民主和实质民主〗的统一、〖直接民主和间接民主〗的统一、〖人民民主和国家意志〗的统一", "m": "「過成・程實・直間・民國」四對。", "items": ["过程民主和成果民主的统一", "程序民主和实质民主的统一", "直接民主和间接民主的统一", "人民民主和国家意志的统一"]}, {"id": "C27-03", "l": 27, "ch": 8, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "全鏈條・全方位・全覆蓋的民主", "p": "全過程人民民主是全鏈條、全方位、全覆蓋的民主（貫穿五位一體、四個全面各方面）。", "o": "全过程人民民主是〖全链条〗、〖全方位〗、〖全覆盖〗的民主", "m": "「鏈・方・蓋」。"}, {"id": "C27-04", "l": 27, "ch": 8, "s": [7, 8], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "最廣泛・最真實・最管用的民主", "p": "講師：選擇題——全過程人民民主是最廣泛、最真實、最管用的民主。下面內文不需要背，理解意思即可。注意別和「全鏈條、全方位、全覆蓋」混。", "o": "全过程人民民主是〖最广泛〗、〖最真实〗、〖最管用〗的民主", "m": "「三個最：廣・真・管」VS「三個全：鏈・方・蓋」。"}, {"id": "C27-05", "l": 27, "ch": 8, "s": [0], "src": "逐字稿", "tag": ["選擇題考點"], "t": "人民行使國家權力的機關", "p": "講師：人民行使國家權力的機關是全國人民代表大會和地方各級人民代表大會。", "o": "人民行使国家权力的机关是〖全国人民代表大会〗和〖地方各级人民代表大会〗", "m": "「全國人大＋地方各級人大」。"}, {"id": "C28-01", "l": 28, "ch": 8, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "人民代表大會制度是我國的根本政治制度", "p": "講師：「選擇題重要考點，非常重要。」問「最能夠體現人民當家作主的制度是什麼」，答人民代表大會制度。", "o": "〖人民代表大会制度〗是我国的〖根本政治制度〗", "m": "「人大＝根本政治＝最能體現當家作主」。"}, {"id": "C28-02", "l": 28, "ch": 8, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "三項基本政治制度（記關鍵詞：多黨・民族・基層）", "p": "基本政治制度有三項：中國共產黨領導的多黨合作和政治協商制度、民族區域自治制度、基層群眾自治制度。講師：只考選擇題，記關鍵詞「多黨、民族、基層」。", "o": "〖中国共产党领导的多党合作和政治协商制度〗、〖民族区域自治制度〗、〖基层群众自治制度〗", "m": "「多・民・基」。", "items": ["中国共产党领导的多党合作和政治协商制度", "民族区域自治制度", "基层群众自治制度"]}, {"id": "C28-03", "l": 28, "ch": 8, "s": [5], "src": "", "tag": ["必背"], "t": "社會主義協商民主的定義", "p": "講師：「這個背」——協商民主就是在黨的領導下，人民內部各方面就重大問題和群眾切身利益問題，在決策之前和決策實施之中廣泛商量，努力形成共識的重要民主形式。（「源自……」一段不用背。）", "o": "在中国共产党领导下，人民内部各方面围绕改革发展稳定重大问题和涉及群众切身利益的实际问题，在〖决策之前和决策实施之中〗开展〖广泛协商〗，努力〖形成共识〗的重要民主形式", "m": "「黨領導・人民內部・決策前和中・廣泛協商・形成共識」。"}, {"id": "C28-04", "l": 28, "ch": 8, "s": [6, 7], "src": "", "tag": ["必背", "選擇題考點"], "t": "協商民主是獨特的、獨有的、獨到的民主形式", "p": "講師：選擇題考點——協商民主是中國社會主義民主政治中獨特的、獨有的、獨到的民主形式。原因如：把發揚民主和增進團結相互貫通；暢通各種利益訴求進入決策程序的渠道；有發現和改正失誤和錯誤的機制；人民參與各層次管理和治理的機制；凝聚推進改革發展的智慧和力量。", "o": "协商民主是中国社会主义民主政治中〖独特的、独有的、独到的〗民主形式", "m": "「三個獨：特・有・到」。"}, {"id": "C28-05", "l": 28, "ch": 8, "s": [8], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "基層民主的地位和形式", "p": "地位（選擇題）：基層民主是全過程人民民主的重要體現。形式（多選題）：村民委員會（農村村民自治）、居民委員會（城市居民自治）、職工代表大會（企事業單位職工自治）。講師：「這三個你把我記住。」", "o": "〖基层民主〗是全过程人民民主的〖重要体现〗；形式：〖村民委员会〗、〖居民委员会〗、〖职工代表大会〗", "m": "「村・居・職」：農村、城市、單位。", "items": ["村民委员会", "居民委员会", "职工代表大会"]}, {"id": "C28-06", "l": 28, "ch": 8, "s": [9], "src": "", "tag": ["了解"], "t": "堅持和完善基層群眾自治制度的要求", "p": "四項要求：黨的領導貫穿基層群眾自治全過程；健全基層黨組織領導的基層群眾自治機制；完善辦事公開制度；全心全意依靠工人階級。", "o": "党的领导贯穿〖基层群众自治全过程〗；健全基层党组织领导的〖基层群众自治机制〗；完善办事〖公开制度〗；全心全意依靠〖工人阶级〗", "m": "「全過程・機制・公開・工人階級」。"}, {"id": "C29-01", "l": 29, "ch": 8, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "統一戰線是凝聚人心、匯聚力量的強大法寶", "p": "講師：統一戰線的核心兩個字就是「團結」。統一戰線是中國共產黨奪取革命、建設、改革事業勝利的重要法寶，也是實現中華民族偉大復興的重要法寶。", "o": "统一战线是〖凝聚人心、汇聚力量〗的强大法宝；统一战线是中国共产党夺取革命、建设、改革事业胜利的〖重要法宝〗，也是实现中华民族伟大复兴的重要法宝", "m": "「統戰＝團結＝法寶」。"}, {"id": "C29-02", "l": 29, "ch": 8, "s": [3, 4], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "統戰工作的本質要求與關鍵", "p": "統戰工作的「本質要求」是大團結大聯合（解決人心和力量問題）；「關鍵」是堅持求同存異——找到最大公約數，畫出最大同心圓。工作對象是黨外人士，重點是其中的代表人士。", "o": "统战工作的本质要求是〖大团结大联合〗；统战工作的关键是坚持〖求同存异〗", "m": "「本質＝大團結大聯合；關鍵＝求同存異」。"}, {"id": "C29-03", "l": 29, "ch": 8, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "黨的領導是統一戰線最鮮明的特徵", "p": "講師：「黨是領導着我們統一戰線的，這是最鮮明的特徵。」坚持黨的領導是統一戰線最根本的問題；主要體現為黨委領導，而不是部門領導。", "o": "〖党的领导〗是统一战线〖最鲜明的特征〗，坚持党的领导是统一战线最根本的问题", "m": "「統戰最鮮明＝黨領導」。"}, {"id": "C29-04", "l": 29, "ch": 8, "s": [6], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "民族團結是生命線；共同體意識是民族團結之本", "p": "民族團結是我國各族人民的「生命線」（講師：選擇）；中華民族共同體意識是民族團結之「本」。注意：這是第三條「生命線」（基本路線＝國家生命線；群眾路線＝黨的生命線；民族團結＝各族人民的生命線）。", "o": "〖民族团结〗是我国各族人民的〖生命线〗，〖中华民族共同体意识〗是民族团结之〖本〗", "m": "生命線大集合：「基本路線→國家、群眾路線→黨、民族團結→各族人民」。"}, {"id": "C29-05", "l": 29, "ch": 8, "s": [7, 8, 9], "src": "", "tag": ["必背", "論述題考點"], "t": "鑄牢中華民族共同體意識的要求（黃字關鍵語）", "p": "講師：「背一下，大題考點。」共八條，黃字關鍵語：休戚與共、榮辱與共、生死與共、命運與共的共同體理念；正確把握共同性和差異性；加強民族團結宣傳教育；推廣普及國家通用語言文字；差別化區域支持政策；促進各民族交往交流交融等。", "o": "〖休戚与共、荣辱与共、生死与共、命运与共〗；〖共同性和差异性〗；〖民族团结宣传教育〗；〖推广普及国家通用语言文字〗；〖差别化区域支持政策〗；〖交往交流交融〗", "m": "「四個與共：休・榮・生・命」。"}, {"id": "C29-06", "l": 29, "ch": 8, "s": [10, 11], "src": "", "tag": ["必背", "簡答題考點"], "t": "做好新時代宗教工作", "p": "講師：稍微背下，可作簡答題。①堅持我國宗教中國化方向；②宗教工作本質上是群眾工作；③堅決抵禦境外利用宗教進行滲透。", "o": "坚持我国〖宗教中国化方向〗；宗教工作本质上是〖群众工作〗；坚决抵御〖境外利用宗教进行渗透〗", "m": "「中國化・群眾工作・抵禦滲透」。", "items": ["坚持我国宗教中国化方向", "宗教工作本质上是群众工作", "坚决抵御境外利用宗教进行渗透"]}, {"id": "C29-07", "l": 29, "ch": 8, "s": [12, 13, 14], "src": "", "tag": ["選擇題考點"], "t": "海內外中華兒女大團結；四方面關係", "p": "促進中華兒女大團結是新時代愛國統一戰線的歷史責任。要高舉愛國主義、社會主義旗幟；抓好重點領域統戰工作；辯證把握四方面關係：固守圓心和擴大共識、潛績和顯績、原則性和靈活性、團結和鬥爭。", "o": "促进〖中华儿女大团结〗是新时代爱国统一战线的历史责任；高举〖爱国主义、社会主义〗旗帜；把握好〖固守圆心和扩大共识〗、〖潜绩和显绩〗、〖原则性和灵活性〗、〖团结和斗争〗的关系", "m": "四對「圓心共識・潛顯・原則靈活・團結鬥爭」。", "items": ["把握好固守圆心和扩大共识的关系", "把握好潜绩和显绩的关系", "把握好原则性和灵活性的关系", "把握好团结和斗争的关系"]}, {"id": "C30-01", "l": 30, "ch": 9, "s": [5, 7], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面依法治國是國家治理的一場深刻革命；四個全面中的重要一環", "p": "全面依法治國是國家治理的一場深刻革命；法律是治國之重器，法治是國家治理體系和治理能力的重要依託；法治興則國興，法治強則國強。全面依法治國是「四個全面」戰略布局中的重要一環（屬於三大戰略舉措之一）。", "o": "全面依法治国是国家治理的一场〖深刻革命〗；法律是〖治国之重器〗；法治是国家治理体系和治理能力的〖重要依托〗；〖法治兴则国兴，法治强则国强〗；“四个全面”〖战略布局的重要一环〗", "m": "「革命・重器・依託・興強・一環」。"}, {"id": "C30-02", "l": 30, "ch": 9, "s": [5], "src": "逐字稿", "tag": ["必背", "選擇題考點", "易混"], "t": "十八屆四中全會＝全面依法治國", "p": "講師：「提到全面依法治國就對應的是十八屆四中全會。」十八屆四中全會《決定》規劃了全面依法治國的總藍圖、路線圖、施工圖。（對比：十八屆三中全會＝全面深化改革。）", "o": "提到全面依法治国就对应〖十八届四中全会〗；规划全面依法治国〖总蓝图、路线图、施工图〗", "m": "「三中改革、四中法治」。"}, {"id": "C30-03", "l": 30, "ch": 9, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面依法治國的地位：本質要求和重要保障", "p": "全面依法治國是堅持和發展中國特色社會主義的本質要求和重要保障（講師：作為選擇題記憶）。法律是治國理政最大最重要的規矩。", "o": "全面依法治国是坚持和发展中国特色社会主义的〖本质要求和重要保障〗；法律是治国理政〖最大最重要的规矩〗", "m": "「本質要求＋重要保障」。"}, {"id": "C30-04", "l": 30, "ch": 9, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "唯一正確道路：中國特色社會主義法治道路", "p": "全面依法治國的唯一正確道路是中國特色社會主義法治道路（講師：記住），本質上是中國特色社會主義道路在法治領域的具體體現。", "o": "〖中国特色社会主义法治道路〗是全面依法治国的〖唯一正确道路〗，本质上是中国特色社会主义道路在法治领域的具体体现", "m": "「唯一＝中特法治道路」。"}, {"id": "C30-05", "l": 30, "ch": 9, "s": [8, 9], "src": "", "tag": ["必背", "多選題考點", "選擇題考點"], "t": "中特法治道路的核心要義（三項）及各自地位", "p": "核心要義（多選）：堅持黨的領導、堅持中國特色社會主義制度、貫徹中國特色社會主義法治理論。單選：黨的領導是中特最本質的特徵、社會主義法治最根本的保證；中特制度是全面推進依法治國的根本制度保障；中特法治理論是理論指導和學理支撐、行動指南。", "o": "〖坚持党的领导〗——社会主义法治〖最根本的保证〗；〖坚持中国特色社会主义制度〗——全面推进依法治国的〖根本制度保障〗；〖贯彻中国特色社会主义法治理论〗——〖理论指导和学理支撑〗、行动指南", "m": "「黨＝最根本保證、制度＝根本制度保障、理論＝指導支撐」。", "items": ["坚持党的领导", "坚持中国特色社会主义制度", "贯彻中国特色社会主义法治理论"]}, {"id": "C30-06", "l": 30, "ch": 9, "s": [10, 11, 12, 13, 14], "src": "", "tag": ["必背", "簡答題考點"], "t": "堅持和拓展中特法治道路的五個原則（大標題要背）", "p": "講師：「背大標題」，問有哪些原則就把五個打出來。①堅持中國共產黨的領導；②堅持以人民為中心；③堅持法律面前人人平等；④堅持依法治國和以德治國相結合；⑤堅持從中國實際出發。", "o": "（1）坚持〖中国共产党的领导〗；（2）坚持〖以人民为中心〗；（3）坚持〖法律面前人人平等〗；（4）坚持〖依法治国和以德治国相结合〗；（5）坚持〖从中国实际出发〗", "m": "「黨・民・平・德・實」。", "items": ["坚持中国共产党的领导", "坚持以人民为中心", "坚持法律面前人人平等", "坚持依法治国和以德治国相结合", "坚持从中国实际出发"]}, {"id": "C30-07", "l": 30, "ch": 9, "s": [10, 11, 12, 13], "src": "逐字稿", "tag": ["選擇題考點"], "t": "五原則中的重要表述", "p": "黨的領導是中特法治之魂，是我們法治同西方資本主義法治的最大區別；全面依法治國的根本目的是依法保障人民權益，最廣泛最深厚的基礎是人民；平等是社會主義法律的基本屬性（選擇）；法安天下，德潤人心；法律是成文的道德，道德是內心的法律。", "o": "党的领导是中国特色社会主义法治之〖魂〗；根本目的是依法保障〖人民权益〗；〖平等〗是社会主义法律的〖基本属性〗；法安天下，〖德润人心〗；法律是〖成文的道德〗，道德是〖内心的法律〗", "m": "「魂・權益・平等・德潤・成文vs內心」。"}, {"id": "C30-08", "l": 30, "ch": 9, "s": [15, 16, 17, 18], "src": "", "tag": ["多選題考點"], "t": "統籌處理全面依法治國的四對重大關係", "p": "四對關係：政治和法治、改革和法治、依法治國和以德治國、依法治國和依規治黨。（易混：別與第08堂中國式現代化六組關係混。）", "o": "处理〖政治和法治〗的关系；处理〖改革和法治〗的关系；处理〖依法治国和以德治国〗的关系；处理〖依法治国和依规治党〗的关系", "m": "「政・改・德・規」配「法」。", "items": ["政治和法治", "改革和法治", "依法治国和以德治国", "依法治国和依规治党"]}, {"id": "C31-01", "l": 31, "ch": 9, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面推進依法治國的總抓手", "p": "建設中國特色社會主義法治體系是全面推進依法治國的「總抓手」（總攬全局、牽引各方）。講師：單選題。", "o": "把建设〖中国特色社会主义法治体系〗作为全面推进依法治国的〖总抓手〗", "m": "「總抓手＝法治體系」（抓手＝把手）。"}, {"id": "C31-02", "l": 31, "ch": 9, "s": [4], "src": "投影片＋逐字稿", "tag": ["必背", "選擇題考點", "多選題考點", "易混"], "t": "全面依法治國的總目標（十八屆四中全會）", "p": "十八屆四中全會把「建設中國特色社會主義法治體系、建設社會主義法治國家」確定為全面依法治國的總目標。這兩者（體系＋國家）也是堅持和發展中特的內在要求（多選）。注意：「總抓手」只是「體系」；「總目標」是「體系＋國家」兩句。", "o": "党的〖十八届四中全会〗将〖建设中国特色社会主义法治体系〗、〖建设社会主义法治国家〗确定为全面推进依法治国的〖总目标〗，将建设中国特色社会主义法治体系确定为全面推进依法治国的〖总抓手〗", "m": "「總抓手＝一個（體系）；總目標＝兩個（體系＋國家）」。", "items": ["总目标：建设中国特色社会主义法治体系、建设社会主义法治国家", "总抓手：建设中国特色社会主义法治体系"]}, {"id": "C31-03", "l": 31, "ch": 9, "s": [5], "src": "", "tag": ["選擇題考點"], "t": "中特法治體系的本質", "p": "講師：「注意一個本質就可以了」——中國特色社會主義法治體系的本質是中國特色社會主義制度的法律表現形式。", "o": "中国特色社会主义法治体系的本质是〖中国特色社会主义制度的法律表现形式〗", "m": "「法治體系＝制度穿上法律的衣服」。"}, {"id": "C31-04", "l": 31, "ch": 9, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "憲法的地位", "p": "憲法是國家的根本法，是治國安邦的總章程，是各種制度和法律法規的總依據，具有最高的法律地位、法律權威、法律效力。講師：選擇題凡問「最重要的法律」，就找憲法。", "o": "宪法是国家的〖根本法〗，是治国安邦的〖总章程〗，是各种制度和法律法规的〖总依据〗", "m": "「根本法・總章程・總依據」。"}, {"id": "C31-05", "l": 31, "ch": 9, "s": [6, 7], "src": "", "tag": ["必背", "選擇題考點"], "t": "堅持依憲治國、依憲執政", "p": "依憲治國、依憲執政，必須堅持黨的領導地位和我國國體、政體不動搖；必須全面貫徹實施憲法。憲法的生命在於實施，憲法的權威也在於實施。", "o": "必须坚持〖党的领导地位和我国国体、政体〗不动摇；宪法的〖生命〗在于实施，宪法的〖权威〗也在于实施", "m": "「生命和權威，都在實施」。"}, {"id": "C31-06", "l": 31, "ch": 9, "s": [8, 9, 10, 11], "src": "", "tag": ["必背", "簡答題考點"], "t": "中特法治體系的五大體系", "p": "五個體系：完備的法律規範體系（以憲法為核心）、高效的法治實施體系、嚴密的法治監督體系、有力的法治保障體系、完善的黨內法規體系（以黨章為根本）。把黨內法規體系納入法治體系，是我國法治區別於其他國家法治的鮮明特徵。", "o": "〖完备〗的法律规范体系；〖高效〗的法治实施体系；〖严密〗的法治监督体系；〖有力〗的法治保障体系；〖完善〗的党内法规体系", "m": "形容詞配對：「完備規範・高效實施・嚴密監督・有力保障・完善黨規」＝「備・效・密・力・善」。", "items": ["完备的法律规范体系", "高效的法治实施体系", "严密的法治监督体系", "有力的法治保障体系", "完善的党内法规体系"]}, {"id": "C32-01", "l": 32, "ch": 9, "s": [2], "src": "", "tag": ["必背", "選擇題考點"], "t": "法治是現代化的基本保障也是重要內容", "p": "法治是國家文明進步的重要標誌；法治既是實現國家現代化的基本保障，也是國家現代化的重要內容（選擇題）；國家要走向現代化，必須實現法治化。", "o": "法治是国家文明进步的〖重要标志〗；法治既是实现国家现代化的〖基本保障〗，也是国家现代化的〖重要内容〗；国家要走向现代化，必须实现〖法治化〗", "m": "「保障＋內容」兩個身份。"}, {"id": "C32-02", "l": 32, "ch": 9, "s": [2], "src": "", "tag": ["必背", "簡答題考點"], "t": "法治中國建設的總目標（六句）", "p": "講師：需要背誦，可考選擇、辨析或簡答。六句：法律規範科學完備統一；執法司法公正高效權威；權力運行受到有效制約監督；人民合法權益得到充分尊重保障；法治信仰普遍確立；法治國家、法治政府、法治社會全面建成。", "o": "实现法律规范〖科学完备统一〗，执法司法〖公正高效权威〗，权力运行受到有效〖制约监督〗，人民合法权益得到充分〖尊重保障〗，法治信仰〖普遍确立〗，法治国家、法治政府、法治社会〖全面建成〗", "m": "「法・執・權・民・信・三法治」六主語：法律規範→執法司法→權力→人民權益→信仰→國家政府社會。", "items": ["法律规范科学完备统一", "执法司法公正高效权威", "权力运行受到有效制约监督", "人民合法权益得到充分尊重保障", "法治信仰普遍确立", "法治国家、法治政府、法治社会全面建成"]}, {"id": "C32-03", "l": 32, "ch": 9, "s": [3], "src": "", "tag": ["選擇題考點", "易混"], "t": "具體目標的時間節點：2025 vs 2035", "p": "講師：細項不需背，要記時間節點。2025年：黨領導全面依法治國體制機制「更加健全」、法律體系「更加完備」等；2035年：法治國家、法治政府、法治社會「基本建成」，中特法治體系「基本形成」。", "o": "〖2025年〗——更加健全、更加完备；〖2035年〗——法治国家、法治政府、法治社会〖基本建成〗，中国特色社会主义法治体系〖基本形成〗", "m": "「25年『更加』，35年『基本』」（又一個2035配「基本」）。"}, {"id": "C32-04", "l": 32, "ch": 9, "s": [4, 5, 6], "src": "", "tag": ["必背", "簡答題考點"], "t": "法治中國建設的工作布局（三個標題）", "p": "講師：「背、背、背，三個標題要背過。」①堅持依法治國、依法執政、依法行政共同推進；②堅持法治國家、法治政府、法治社會一體建設；③堅持統籌推進國內法治和涉外法治。", "o": "坚持〖依法治国、依法执政、依法行政〗共同推进；坚持〖法治国家、法治政府、法治社会〗一体建设；坚持统筹推进〖国内法治和涉外法治〗", "m": "「三依・三法治・內外」：依法治國/執政/行政→法治國家/政府/社會→國內/涉外。", "items": ["坚持依法治国、依法执政、依法行政共同推进", "坚持法治国家、法治政府、法治社会一体建设", "坚持统筹推进国内法治和涉外法治"]}, {"id": "C32-05", "l": 32, "ch": 9, "s": [7, 9], "src": "", "tag": ["必背", "選擇題考點"], "t": "新十六字方針；公正司法是最後一道防線", "p": "建設更高水平的法治中國：科學立法、嚴格執法、公正司法、全民守法（講師：「16字」）。公正司法是維護社會公平正義的最後一道防線（選擇題，二十大重要內容）。每一個立法環節都要把好憲法關；形成守法光榮、違法可恥的社會氛圍。", "o": "〖科学立法〗、〖严格执法〗、〖公正司法〗、〖全民守法〗；公正司法是维护社会公平正义的〖最后一道防线〗", "m": "「立・執・司・守」配「科學・嚴格・公正・全民」。"}, {"id": "C32-06", "l": 32, "ch": 9, "s": [7, 8, 9], "src": "", "tag": ["簡答題考點"], "t": "建設更高水平的法治中國（四方面）", "p": "完善以憲法為核心的中國特色社會主義法律體系；扎實推進依法行政；嚴格公正司法；加快建設法治社會。", "o": "完善〖以宪法为核心的中国特色社会主义法律体系〗；扎实推进〖依法行政〗；严格〖公正司法〗；加快〖建设法治社会〗", "m": "對應「立・行・司・守」四環節。", "items": ["完善以宪法为核心的中国特色社会主义法律体系", "扎实推进依法行政", "严格公正司法", "加快建设法治社会"]}, {"id": "C33-01", "l": 33, "ch": 10, "s": [6, 7, 8], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "文化繁榮興盛的四個定位（皆可考單選）", "p": "為什麼一定要讓文化繁榮？因為它是：①民族復興的精神支撐（像人的精神力量）；②建設現代化強國的應有之義（本來就該包含的部分）；③滿足人民美好生活需要的內在要求；④在世界文化激盪中站穩腳跟的前提基礎。講師：分別作為單選。", "o": "文化繁荣兴盛是实现中华民族伟大复兴的〖精神支撑〗；是建设社会主义现代化强国的〖应有之义〗；是满足人民日益增长的美好生活需要的〖内在要求〗；是在世界文化激荡中站稳脚跟的〖前提基础〗", "m": "「復興—支撐、強國—應有、生活—內在、世界—前提」：「撐・應・內・前」。"}, {"id": "C33-02", "l": 33, "ch": 10, "s": [9, 10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "堅定文化自信的三個基礎（注意措辭）", "p": "文化自信是更加基礎、更廣泛、更深厚的自信（講師：「更加深沉、更加持久的自信」）。三個來源各有專屬詞：中華優秀傳統文化＝深厚基礎；革命文化和社會主義先進文化＝堅強基石；中特偉大實踐＝現實基礎。", "o": "〖中华优秀传统文化〗是坚定文化自信的〖深厚基础〗；〖革命文化和社会主义先进文化〗是坚定文化自信的〖坚强基石〗；〖中国特色社会主义伟大实践〗是坚定文化自信的〖现实基础〗", "m": "「老祖宗—深厚；革命先進—基石（石頭硬＝堅強）；現在實踐—現實」。"}, {"id": "C33-03", "l": 33, "ch": 10, "s": [11], "src": "", "tag": ["選擇題考點"], "t": "文化發展的唯一正確道路", "p": "推動社會主義文化繁榮興盛，只有一條正確的路：中國特色社會主義文化發展道路。", "o": "〖中国特色社会主义文化发展道路〗是推动社会主义文化繁荣兴盛的〖唯一正确道路〗", "m": "對比：法治的唯一正確道路＝中特法治道路（第30堂）。"}, {"id": "C33-04", "l": 33, "ch": 10, "s": [12, 13], "src": "", "tag": ["必背", "選擇題考點", "多選題考點"], "t": "舉旗幟、聚民心、育新人、興文化、展形象", "p": "文化工作的五項使命任務。", "o": "坚持〖举旗帜〗、〖聚民心〗、〖育新人〗、〖兴文化〗、〖展形象〗", "m": "「旗・心・人・文・象」：舉起旗→聚人心→育新人→興文化→向世界展形象。", "items": ["举旗帜", "聚民心", "育新人", "兴文化", "展形象"]}, {"id": "C33-05", "l": 33, "ch": 10, "s": [14, 15], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "「二為」方向與「雙百」方針", "p": "「二為」方向＝為人民服務、為社會主義服務（是決定社會主義文化事業前途命運的關鍵）；「雙百」方針＝百花齊放、百家爭鳴（講師：「要知道」）。別把方向和方針弄反。", "o": "“二为”方向：坚持〖为人民服务、为社会主义服务〗的根本方向；“双百”方针：坚持〖百花齐放、百家争鸣〗", "m": "「二為＝兩個『為』；雙百＝兩個『百』」。"}, {"id": "C33-06", "l": 33, "ch": 10, "s": [16], "src": "", "tag": ["選擇題考點"], "t": "創新創造是文化的生命所在", "p": "文化要一直有新東西才有活力。", "o": "〖创新创造〗是文化的〖生命所在〗，是文化的〖本质特征〗", "m": "「創新＝生命＋本質」。"}, {"id": "C34-01", "l": 34, "ch": 10, "s": [3, 4, 5], "src": "", "tag": ["必背", "選擇題考點"], "t": "馬克思主義在意識形態領域指導地位的根本制度", "p": "意識形態＝「思想的總和」。這是中特制度體系中的一項根本制度。理由：馬克思主義是立黨立國、興黨興國的根本指導思想；這是歷史的結論；是堅持和鞏固我國社會主義制度、保證文化建設正確方向的必然要求；馬克思主義是社會主義意識形態的旗幟和靈魂。", "o": "马克思主义是立党立国、兴党兴国的〖根本指导思想〗；是〖历史的结论〗；是坚持和巩固我国社会主义制度、保证我国文化建设正确方向的〖必然要求〗；马克思主义是社会主义意识形态的〖旗帜和灵魂〗", "m": "「指導思想・歷史結論・必然要求・旗幟靈魂」。"}, {"id": "C34-02", "l": 34, "ch": 10, "s": [6], "src": "", "tag": ["必背", "簡答題考點"], "t": "武裝全黨、教育人民、指導實踐（簡答必背）", "p": "講師：「作為我們的簡答題你必須要背過。」用馬克思主義（特別是中國化時代化的馬克思主義）去武裝全黨、教育人民、指導實踐。", "o": "坚持用马克思主义特别是〖中国化时代化〗的马克思主义〖武装全党〗、〖教育人民〗、〖指导实践〗", "m": "「黨・民・實」：武裝黨→教育民→指導實踐。", "items": ["武装全党", "教育人民", "指导实践"]}, {"id": "C34-03", "l": 34, "ch": 10, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "馬克思主義中國化三次飛躍", "p": "馬克思主義在中國實現了三次飛躍，最新的一次飛躍形成的是習近平新時代中國特色社會主義思想（中國化時代化的最新成果）。", "o": "马克思主义中国化实现〖三次飞跃〗；最新成果是〖习近平新时代中国特色社会主义思想〗", "m": "「三次飛躍，最新＝習思想」。"}, {"id": "C34-04", "l": 34, "ch": 10, "s": [8], "src": "投影片＋逐字稿", "tag": ["選擇題考點"], "t": "中國特色哲學社會科學的根本標誌", "p": "堅持以馬克思主義為指導，是當代中國哲學社會科學區別於其他哲學社會科學的根本標誌。", "o": "坚持〖以马克思主义为指导〗，是当代中国哲学社会科学区别于其他哲学社会科学的〖根本标志〗", "m": "「根本標誌＝馬克思主義指導」。"}, {"id": "C34-05", "l": 34, "ch": 10, "s": [9], "src": "", "tag": ["必背", "簡答題考點"], "t": "黨的新聞輿論工作的職責和使命（小簡答）", "p": "講師：「作為一個小小的簡答題去背誦一下。」六組四字詞，兩兩一對。", "o": "〖高举旗帜〗、〖引领导向〗，〖围绕中心〗、〖服务大局〗，〖团结人民〗、〖鼓舞士气〗，〖成风化人〗、〖凝心聚力〗，〖澄清谬误〗、〖明辨是非〗，〖联接中外〗、〖沟通世界〗", "m": "六對口訣「旗導・中局・民氣・風力・謬非・中外世界」。", "items": ["高举旗帜、引领导向", "围绕中心、服务大局", "团结人民、鼓舞士气", "成风化人、凝心聚力", "澄清谬误、明辨是非", "联接中外、沟通世界"]}, {"id": "C34-06", "l": 34, "ch": 10, "s": [10], "src": "", "tag": ["必背", "選擇題考點", "易混"]
