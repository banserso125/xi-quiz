"填空｜群眾路線是黨始終堅持的根本工作方法：\n群众路线是我们党始终坚持的（＿①＿）；一切为了群众，一切依靠群众，（＿②＿），把党的正确主张变为群众的自觉行动", "a": ["根本工作方法", "从群众中来，到群众中去"], "e": "群眾路線＝一切為了群眾、一切依靠群眾，從群眾中來、到群眾中去，把黨的正確主張變為群眾的自覺行動。它是黨始終堅持的「根本工作方法」（也是黨的生命線，見第05堂辨析）。", "id": "Q14-001", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-003）"]}, {"s": [3], "src": "", "card": "C14-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "默", "q": "默寫｜群眾路線是黨始終堅持的根本工作方法", "model": "群众路线是我们党始终坚持的根本工作方法；一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动", "pts": ["根本工作方法", "从群众中来，到群众中去"], "e": "記法：「為・靠・來・去」四字。", "id": "Q14-002", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-003）"]}, {"s": [3], "src": "", "card": "C14-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜毛澤東思想「三個活的靈魂」：\n①（＿①＿） ②（＿②＿） ③（＿③＿）", "a": ["实事求是", "群众路线", "独立自主"], "e": "投影片手寫串聯：毛澤東思想活的靈魂有三個——實事求是、群眾路線、獨立自主。", "id": "Q14-003", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-003）"]}, {"s": [3], "src": "", "card": "C14-02", "tag": ["選擇題考點"], "auto": 1, "k": "多", "q": "毛澤東思想「活的靈魂」包括：", "o": ["实事求是", "群众路线", "独立自主", "统一战线", "自我革命"], "a": [0, 1, 2], "e": "正確：实事求是；群众路线；独立自主。干擾項：统一战线；自我革命。", "id": "Q14-004", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-003）"]}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜貫徹群眾路線：知行合一；調查研究：\n知是（＿①＿）是（＿②＿），行是（＿③＿）是（＿④＿）；（＿⑤＿）是贯彻群众路线的有效途径", "a": ["基础", "前提", "重点", "关键", "调查研究"], "e": "貫徹群眾路線要知行合一：「知」是基礎、是前提；「行」是重點、是關鍵。調查研究是貫徹群眾路線的有效途徑。", "id": "Q14-005", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-004）"]}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "貫徹群眾路線要知行合一，其中「知」是：", "o": ["基础、前提", "重点、关键", "根本、目的"], "a": 0, "e": "「知」→「基础、前提」。記法：「知＝地基，行＝重點」。", "id": "Q14-006", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-004）"]}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "貫徹群眾路線，「知」是基础、前提。", "a": true, "e": "對。「知」→「基础、前提」。", "id": "Q14-007", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-004）"]}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "貫徹群眾路線要知行合一，其中「行」是：", "o": ["重点、关键", "基础、前提", "根本、目的"], "a": 0, "e": "「行」→「重点、关键」。記法：「知＝地基，行＝重點」。", "id": "Q14-008", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-004）"]}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "貫徹群眾路線，「行」是基础、前提。", "a": false, "e": "錯。「行」應對應「重点、关键」，「基础、前提」對應的是「知」。", "id": "Q14-009", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-004）"]}, {"s": [5, 7], "src": "", "card": "C14-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜把為人民造福的事情真正辦好辦實（三點）：\n（1）为人民造福，要落实到新时代中国特色社会主义的（＿①＿）之中；（2）要着力解决好人民群众（＿②＿）的利益问题；（3）要（＿③＿）", "a": ["各项事业、全部工作", "最关心最直接最现实", "一件事情接着一件事情办，一年接着一年干"], "e": "①造福人民要落實到各項事業、全部工作之中；②要着力解決人民最關心最直接最現實的利益問題；③要一件事情接着一件事情辦，一年接着一年幹。講師補充：要讓人民群眾在每一個司法案件中感受到公平正義；人民群眾是共產黨的安身立命之本。", "id": "Q14-010", "l": 14, "ch": 4, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（14-007）"]}, {"s": [5, 7], "src": "", "card": "C14-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜把為人民造福的事情真正辦好辦實（三點）", "model": "（1）为人民造福，要落实到新时代中国特色社会主义的各项事业、全部工作之中；（2）要着力解决好人民群众最关心最直接最现实的利益问题；（3）要一件事情接着一件事情办，一年接着一年干", "pts": ["为人民造福，要落实到新时代中国特色社会主义的各项事业、全部工作之中", "要着力解决好人民群众最关心最直接最现实的利益问题", "要一件事情接着一件事情办，一年接着一年干"], "e": "記法：「全部落實・三個最・一件接一件」。", "id": "Q14-011", "l": 14, "ch": 4, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（14-007）"]}, {"s": [8], "src": "", "card": "C14-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜共同富裕是關係黨的執政基礎的重大政治問題：\n实现共同富裕不仅是（＿①＿），而且是关系党的（＿②＿）的（＿③＿）", "a": ["经济问题", "执政基础", "重大政治问题"], "e": "講師：「首先要背過這個小標題」——實現共同富裕不僅是經濟問題，而且是關係黨的執政基礎的重大政治問題。", "id": "Q14-012", "l": 14, "ch": 4, "pt": "A", "ps": 35, "pr": ["老師：…的實質性進展 我們首先要背過這個小題（小標題） 實現…（14-008）", "投影片手寫星號（14-008）", "投影片黃字／黃筆標記（14-008）"]}, {"s": [8], "src": "", "card": "C14-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜共同富裕是關係黨的執政基礎的重大政治問題", "model": "实现共同富裕不仅是经济问题，而且是关系党的执政基础的重大政治问题", "pts": ["经济问题", "执政基础", "重大政治问题"], "e": "記法：「不只經濟，更是政治」。", "id": "Q14-013", "l": 14, "ch": 4, "pt": "A", "ps": 35, "pr": ["老師：…的實質性進展 我們首先要背過這個小題（小標題） 實現…（14-008）", "投影片手寫星號（14-008）", "投影片黃字／黃筆標記（14-008）"]}, {"s": [9], "src": "", "card": "C14-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜從全局角度把握共同富裕（四個「不是」）：\n共同富裕是（＿①＿）共同富裕，是人民群众（＿②＿）都富裕，不是（＿③＿）的富裕，也不是整齐划一的（＿④＿），不是所有人都（＿⑤＿），也不是所有地区同时达到一个富裕水准", "a": ["全体人民", "物质生活和精神生活", "少数人", "平均主义", "同时富裕"], "e": "共同富裕是全體人民、物質生活和精神生活都富裕；不是少數人富裕，不是整齊劃一的平均主義，不是所有人同時富裕，也不是所有地區同時達到一個富裕水準。允許一部分人先富起來，同時積極推動先富帶後富。是一個長期的歷史過程。", "id": "Q14-014", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-009）"]}, {"s": [9], "src": "", "card": "C14-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "默", "q": "默寫｜從全局角度把握共同富裕（四個「不是」）", "model": "共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义，不是所有人都同时富裕，也不是所有地区同时达到一个富裕水准", "pts": ["是全体人民共同富裕", "是物质生活和精神生活都富裕", "不是少数人的富裕", "不是整齐划一的平均主义", "不是所有人都同时富裕，也不是所有地区同时达到一个富裕水准"], "e": "記法：「是：全體＋物質精神」；「不是：少數、平均、同時（人）、同時（地區）」。", "id": "Q14-015", "l": 14, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（14-009）"]}, {"s": [10, 11], "src": "", "card": "C14-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜推進共同富裕的原則與思路；橄欖型分配結構：\n（＿①＿）；（＿②＿）；初次分配、再分配、（＿③＿）协调配套；形成（＿④＿）的（＿⑤＿）分配结构", "a": ["推进共同富裕的原则", "推进共同富裕的思路", "三次分配", "中间大两头小", "橄榄型"], "e": "扎實推進共同富裕，必須堅持正確的原則和科學的思路。講師講到要構建初次分配、再分配、三次分配協調配套的基礎性制度安排，形成「中間大、兩頭小」的橄欖型分配結構（中等收入的人最多）。", "id": "Q14-016", "l": 14, "ch": 4, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（14-010）"]}, {"k": "單", "s": [3], "q": "黨始終堅持的根本工作方法是：", "o": ["群眾路線", "實事求是", "調查研究", "民主集中制"], "a": 0, "e": "群眾路線是我們黨始終堅持的根本工作方法。", "id": "Q14-017", "l": 14, "ch": 4, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（14-003）"]}, {"k": "單", "s": [4], "q": "貫徹群眾路線的有效途徑是：", "o": ["調查研究", "批評與自我批評", "民主集中制", "依法治國"], "a": 0, "e": "講師：「調查研究是貫徹群眾路線的有效途徑。」", "id": "Q14-018", "l": 14, "ch": 4, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（14-004）"]}, {"k": "判", "s": [9], "q": "共同富裕就是所有人同時富裕、所有地區同時達到一個富裕水準。", "a": false, "e": "錯。原文明確：不是所有人都同時富裕，也不是所有地區同時達到一個富裕水準。", "id": "Q14-019", "l": 14, "ch": 4, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（14-009）"]}, {"k": "判", "s": [9], "q": "共同富裕是人民群眾物質生活和精神生活都富裕。", "a": true, "e": "對。原文。", "id": "Q14-020", "l": 14, "ch": 4, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（14-009）"]}, {"k": "單", "s": [11], "q": "講師說推進共同富裕要形成「中間大、兩頭小」的：", "o": ["橄欖型分配結構", "金字塔型分配結構", "啞鈴型分配結構", "平均型分配結構"], "a": 0, "e": "中間大兩頭小＝橄欖型。", "id": "Q14-021", "l": 14, "ch": 4, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（14-011）"]}, {"k": "單", "s": [8], "q": "實現共同富裕不僅是經濟問題，而且是關係黨的＿＿的重大政治問題。", "o": ["執政基礎", "生命線", "根本宗旨", "長期執政"], "a": 0, "e": "講師：首先要背過這個小標題。", "id": "Q14-022", "l": 14, "ch": 4, "pt": "A", "ps": 41, "pr": ["老師：…的實質性進展 我們首先要背過這個小題（小標題） 實現…（14-008）", "投影片手寫星號（14-008）", "投影片黃字／黃筆標記（14-008）"]}, {"k": "多", "s": [9], "q": "根據投影片，以下哪些「不是」共同富裕？", "o": ["少數人的富裕", "整齊劃一的平均主義", "所有人都同時富裕", "全體人民共同富裕"], "a": [0, 1, 2], "e": "共同富裕「是」全體人民共同富裕；不是少數人富裕、不是平均主義、不是同時富裕。", "id": "Q14-023", "l": 14, "ch": 4, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（14-009）"]}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，人民群眾是共產黨的：", "o": ["安身立命之本", "精神之魂", "最大法寶", "行動指南"], "a": 0, "e": "原話：「人民群眾是什麼？是共產黨的安身立命之本。」", "id": "Q14-024", "l": 14, "ch": 4, "pt": "C", "ps": 0, "pr": []}, {"s": [4], "src": "", "card": "C15-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜改革開放是決定當代中國命運的關鍵一招：\n改革开放是决定当代中国命运的（＿①＿）", "a": ["关键一招"], "e": "節標題本身就是選擇題考點：改革開放是決定當代中國命運的「關鍵一招」（像下棋最關鍵的一步）。", "id": "Q15-001", "l": 15, "ch": 5, "pt": "A", "ps": 15, "pr": ["老師：…節的標題就是一個選擇題考點（15-004）", "投影片黃字／黃筆標記（15-004）"]}, {"s": [5], "src": "", "card": "C15-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜改革開放是重要法寶、必由之路；「四個只有」：\n改革开放是我们前进的（＿①＿）；改革开放是坚持和发展中国特色社会主义的（＿②＿）；只有社会主义才能（＿③＿），只有改革开放才能（＿④＿）", "a": ["重要法宝", "必由之路", "救中国", "发展中国、发展社会主义、发展马克思主义"], "e": "改革開放是黨和人民前進的重要法寶，是堅持和發展中國特色社會主義的必由之路。講師：只有社會主義才能救中國，只有改革開放才能發展中國、發展社會主義、發展馬克思主義。", "id": "Q15-002", "l": 15, "ch": 5, "pt": "B", "ps": 6, "pr": ["同頁有考點提示：我們需要記住的一個選擇題考點就是 問你改革開放是在…（15-005）", "投影片黃字／黃筆標記（15-005）"]}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：十一屆三中全會 vs 十八屆三中全會：\n（＿①＿）——提出改革开放（1978）；（＿②＿）——全面深化改革", "a": ["十一届三中全会", "十八届三中全会"], "e": "兩個「三中全會」別混：1978年十一屆三中全會＝開啟（正式提出）改革開放；十八屆三中全會＝開啟「全面深化」改革。講師：「兩個選擇題考點，注意。」", "id": "Q15-003", "l": 15, "ch": 5, "pt": "A", "ps": 54, "pr": ["老師：我們需要記住的一個選擇題考點就是 問你改革開放是在…（15-005）", "老師：所以把這個標題給我必須記住了 全面深化改革開放是完…（15-006）", "投影片黃字／黃筆標記（15-005）"]}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「改革开放的正式提出（1978）」對應的會議是：", "o": ["十一届三中全会", "十八届三中全会", "十八届四中全会", "十九届六中全会"], "a": 0, "e": "「改革开放的正式提出（1978）」→「十一届三中全会」。記法：「11開始、18全面」：數字小的是開頭。", "id": "Q15-004", "l": 15, "ch": 5, "pt": "A", "ps": 54, "pr": ["老師：我們需要記住的一個選擇題考點就是 問你改革開放是在…（15-005）", "老師：所以把這個標題給我必須記住了 全面深化改革開放是完…（15-006）", "投影片黃字／黃筆標記（15-005）"]}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「改革开放的正式提出（1978）」對應十一届三中全会。", "a": true, "e": "對。「改革开放的正式提出（1978）」→「十一届三中全会」。", "id": "Q15-005", "l": 15, "ch": 5, "pt": "A", "ps": 54, "pr": ["老師：我們需要記住的一個選擇題考點就是 問你改革開放是在…（15-005）", "老師：所以把這個標題給我必須記住了 全面深化改革開放是完…（15-006）", "投影片黃字／黃筆標記（15-005）"]}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「全面深化改革的开启」對應的會議是：", "o": ["十八届三中全会", "十一届三中全会", "十八届四中全会", "十九届六中全会"], "a": 0, "e": "「全面深化改革的开启」→「十八届三中全会」。記法：「11開始、18全面」：數字小的是開頭。", "id": "Q15-006", "l": 15, "ch": 5, "pt": "A", "ps": 54, "pr": ["老師：我們需要記住的一個選擇題考點就是 問你改革開放是在…（15-005）", "老師：所以把這個標題給我必須記住了 全面深化改革開放是完…（15-006）", "投影片黃字／黃筆標記（15-005）"]}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「全面深化改革的开启」對應十一届三中全会。", "a": false, "e": "錯。「全面深化改革的开启」應對應「十八届三中全会」，「十一届三中全会」對應的是「改革开放的正式提出（1978）」。", "id": "Q15-007", "l": 15, "ch": 5, "pt": "A", "ps": 54, "pr": ["老師：我們需要記住的一個選擇題考點就是 問你改革開放是在…（15-005）", "老師：所以把這個標題給我必須記住了 全面深化改革開放是完…（15-006）", "投影片黃字／黃筆標記（15-005）"]}, {"s": [6], "src": "", "card": "C15-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜改革開放是重要法寶（三點）：\n（1）改革开放是坚持和发展中国特色社会主义的（＿①＿）；（2）全面深化改革开放是完成新时代目标任务的（＿②＿）；（3）中国要前进，就要（＿③＿）", "a": ["必由之路", "必然要求", "全面深化改革开放"], "e": "知識點1三點：①改革開放是堅持和發展中特的必由之路；②全面深化改革開放是完成新時代目標任務的必然要求（講師：標題必須記住）；③中國要前進，就要全面深化改革開放。", "id": "Q15-008", "l": 15, "ch": 5, "pt": "A", "ps": 27, "pr": ["老師：所以把這個標題給我必須記住了 全面深化改革開放是完…（15-006）", "老師：…開放 這是第一個選擇題考點……第二個選擇題考點是什麼…（15-006）", "投影片黃字／黃筆標記（15-006）"]}, {"s": [6], "src": "", "card": "C15-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜改革開放是重要法寶（三點）", "model": "（1）改革开放是坚持和发展中国特色社会主义的必由之路；（2）全面深化改革开放是完成新时代目标任务的必然要求；（3）中国要前进，就要全面深化改革开放", "pts": ["改革开放是坚持和发展中国特色社会主义的必由之路", "全面深化改革开放是完成新时代目标任务的必然要求", "中国要前进，就要全面深化改革开放"], "e": "記法：「必由之路・必然要求・要前進」。", "id": "Q15-009", "l": 15, "ch": 5, "pt": "A", "ps": 27, "pr": ["老師：所以把這個標題給我必須記住了 全面深化改革開放是完…（15-006）", "老師：…開放 這是第一個選擇題考點……第二個選擇題考點是什麼…（15-006）", "投影片黃字／黃筆標記（15-006）"]}, {"s": [7, 8, 9, 10], "src": "", "card": "C15-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新時代全面深化改革開放是一場深刻革命：\n（1）全面深化改革开放是（＿①＿）的变革；（2）着力解决（＿②＿）、应对（＿③＿），把全面深化改革开放引向深入；（3）是在多年改革开放基础上的深化，是一场（＿④＿）的（＿⑤＿）", "a": ["涉险滩、闯难关", "新矛盾", "新挑战", "全面、系统、整体", "制度创新"], "e": "就其艱鉅性、複雜性和系統性來說，新時代全面深化改革開放是一場深刻的革命。三點：①是涉險灘、闖難關的變革；②着力解決新矛盾、應對新挑戰，引向深入；③是在多年改革開放基礎上的深化，是一場全面、系統、整體的制度創新。", "id": "Q15-010", "l": 15, "ch": 5, "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（15-008）"]}, {"s": [7, 8, 9, 10], "src": "", "card": "C15-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜新時代全面深化改革開放是一場深刻革命", "model": "（1）全面深化改革开放是涉险滩、闯难关的变革；（2）着力解决新矛盾、应对新挑战，把全面深化改革开放引向深入；（3）是在多年改革开放基础上的深化，是一场全面、系统、整体的制度创新", "pts": ["全面深化改革开放是涉险滩、闯难关的变革", "着力解决新矛盾、应对新挑战，把全面深化改革开放引向深入", "是在多年改革开放基础上的深化，是一场全面、系统、整体的制度创新"], "e": "記法：「險灘難關・新矛盾新挑戰・全面系統整體的制度創新」。", "id": "Q15-011", "l": 15, "ch": 5, "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（15-008）"]}, {"s": [11], "src": "", "card": "C15-06", "tag": ["必背", "論述題考點"], "auto": 1, "k": "填", "q": " , "是改革的根本动力"], "a": 0, "e": "「推进国家治理体系和治理能力现代化」→「明确了改革的鲜明指向和时代要求」。記法：「制度→方向；治理→指向」。", "id": "Q16-006", "l": 16, "ch": 5, "pt": "A", "ps": 27, "pr": ["老師：…到這樣一個知識點 考到大題 讓你去簡述全面深化改革的…（16-004）", "老師：…下來）了 選擇（題）、多選……他們兩句話必須要說纔是…（16-003）", "投影片黃字／黃筆標記（16-003）"]}, {"s": [3, 4], "src": "逐字稿", "card": "C16-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "「推进国家治理体系和治理能力现代化」规定了改革的根本方向。", "a": false, "e": "錯。「推进国家治理体系和治理能力现代化」應對應「明确了改革的鲜明指向和时代要求」，「规定了改革的根本方向」對應的是「完善和发展中国特色社会主义制度」。", "id": "Q16-007", "l": 16, "ch": 5, "pt": "A", "ps": 27, "pr": ["老師：…到這樣一個知識點 考到大題 讓你去簡述全面深化改革的…（16-004）", "老師：…下來）了 選擇（題）、多選……他們兩句話必須要說纔是…（16-003）", "投影片黃字／黃筆標記（16-003）"]}, {"s": [5, 6], "src": "", "card": "C16-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「六個緊緊圍繞」路線圖：\n经济——市场在资源配置中起（＿①＿）、更好发挥政府作用；政治——（＿②＿）有机统一；文化——（＿③＿）；社会——民生；生态——美丽中国；党的建设", "a": ["决定性作用", "党的领导、人民当家作主、依法治国", "社会主义核心价值体系"], "e": "六個緊緊圍繞：前五個對應「五位一體」（經濟、政治、文化、社會、生態），第六個是黨的建設（「永遠都用來兜底」）。經濟：使市場在資源配置中起決定性作用、更好發揮政府作用；政治：黨的領導、人民當家作主、依法治國有機統一；文化：社會主義核心價值體系；社會：民生；生態：美麗中國；最後：黨的建設。", "id": "Q16-008", "l": 16, "ch": 5, "pt": "A", "ps": 23, "pr": ["老師：選擇題 市場在資源配置中是什麼作用 決定性作用（16-005）", "投影片手寫星號（16-005）", "投影片黃字／黃筆標記（16-005）"]}, {"s": [7], "src": "", "card": "C16-04", "tag": ["必背"], "auto": 1, "k": "填", "q": "填空｜國家治理體系與治理能力的關係（官方表述要背）：\n国家治理体系和治理能力是一个（＿①＿），（＿②＿），有了好的国家治理体系才能提高国家治理能力，提高国家治理能力才能充分发挥国家治理体系的（＿③＿）", "a": ["有机整体", "相辅相成", "效能"], "e": "治理體系＝管國家的一整套制度；治理能力＝運用制度管理各方面事務的能力。兩者是一個有機整體、相輔相成：有好的體系才能提高能力，提高能力才能發揮體系的效能。例子：好的防疫制度（體系）要靠執行得好（能力）才有效。", "id": "Q16-009", "l": 16, "ch": 5, "pt": "A", "ps": 15, "pr": ["老師：官方的表述 這是要背的 背 國家治理體系和治理能力…（16-007）", "投影片黃字／黃筆標記（16-007）"]}, {"s": [7], "src": "", "card": "C16-04", "tag": ["必背"], "auto": 1, "k": "默", "q": "默寫｜國家治理體系與治理能力的關係（官方表述要背）", "model": "国家治理体系和治理能力是一个有机整体，相辅相成，有了好的国家治理体系才能提高国家治理能力，提高国家治理能力才能充分发挥国家治理体系的效能", "pts": ["有机整体", "相辅相成", "效能"], "e": "記法：「體系是硬件，能力是軟件」；「有機整體・相輔相成・互相成就」。", "id": "Q16-010", "l": 16, "ch": 5, "pt": "A", "ps": 15, "pr": ["老師：官方的表述 這是要背的 背 國家治理體系和治理能力…（16-007）", "投影片黃字／黃筆標記（16-007）"]}, {"s": [8, 10, 11], "src": "", "card": "C16-05", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜推進國家治理體系和治理能力現代化（三個小標題）：\n（1）坚定（＿①＿）；（2）发挥（＿②＿）；（3）把中国特色社会主义制度优势转化为（＿③＿）", "a": ["中国特色社会主义制度自信", "中国特色社会主义制度优势", "国家治理效能"], "e": "三點：堅定中特制度自信；發揮中特制度優勢；把中特制度優勢轉化為國家治理效能。講師：「一定要把這個小標題背過。」", "id": "Q16-011", "l": 16, "ch": 5, "pt": "A", "ps": 21, "pr": ["老師：一定要把這個小標題背過。（16-008）", "投影片黃字／黃筆標記（16-008）"]}, {"s": [8, 10, 11], "src": "", "card": "C16-05", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜推進國家治理體系和治理能力現代化（三個小標題）", "model": "（1）坚定中国特色社会主义制度自信；（2）发挥中国特色社会主义制度优势；（3）把中国特色社会主义制度优势转化为国家治理效能", "pts": ["坚定中国特色社会主义制度自信", "发挥中国特色社会主义制度优势", "把中国特色社会主义制度优势转化为国家治理效能"], "e": "記法：「信→用→變」：先相信制度，再發揮優勢，最後變成效能。", "id": "Q16-012", "l": 16, "ch": 5, "pt": "A", "ps": 21, "pr": ["老師：一定要把這個小標題背過。（16-008）", "投影片黃字／黃筆標記（16-008）"]}, {"s": [12, 13, 14], "src": "", "card": "C16-06", "tag": ["必背", "論述題考點"], "auto": 1, "k": "默", "q": "默寫｜國家制度和國家治理體系的十三個顯著優勢（黃字關鍵詞）", "model": "集中统一领导；人民当家作主；全面依法治国；全国一盘棋；各民族一律平等；公有制为主体、多种所有制经济共同发展；共同的理想信念、价值理念、道德观念；以人民为中心的发展思想；改革创新、与时俱进；德才兼备、选贤任能；党指挥枪；“一国两制”；独立自主和对外开放相统一", "pts": ["集中统一领导", "人民当家作主", "全面依法治国", "全国一盘棋", "各民族一律平等", "公有制为主体、多种所有制经济共同发展", "共同的理想信念、价值理念、道德观念", "以人民为中心的发展思想", "改革创新、与时俱进", "德才兼备、选贤任能", "党指挥枪", "“一国两制”", "独立自主和对外开放相统一"], "e": "記法：「黨・民・法・棋・族｜經・念・心・新｜才・槍・兩制・開放」（5＋4＋4）。", "id": "Q16-013", "l": 16, "ch": 5, "pt": "A", "ps": 33, "pr": ["老師：…求大家呢 就是儘可能的背過……如果說他考到一個論述題…（16-014）", "投影片黃字／黃筆標記（16-012）"]}, {"s": [12, 13, 14], "src": "", "card": "C16-06", "tag": ["必背", "論述題考點"], "auto": 1, "k": "多", "q": "以下哪些屬於我國國家制度和國家治理體系的顯著優勢（關鍵詞）？", "o": ["集中统一领导", "人民当家作主", "全面依法治国", "全国一盘棋", "联邦制"], "a": [0, 1, 2, 3], "e": "正確：集中统一领导；人民当家作主；全面依法治国；全国一盘棋。干擾項：联邦制。", "id": "Q16-014", "l": 16, "ch": 5, "pt": "A", "ps": 33, "pr": ["老師：…求大家呢 就是儘可能的背過……如果說他考到一個論述題…（16-014）", "投影片黃字／黃筆標記（16-012）"]}, {"s": [12, 13, 14], "src": "", "card": "C16-06", "tag": ["必背", "論述題考點"], "auto": 1, "k": "多", "q": "以下哪些屬於我國國家制度和國家治理體系的顯著 顶层设计和摸着石头过河相结合。干擾項：只靠顶层设计。", "id": "Q16-019", "l": 16, "ch": 5, "pt": "A", "ps": 24, "pr": ["老師：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-015）"]}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜方法論的重要表述（摸着石頭過河、改革發展穩定、改革與法治）：\n摸着石头过河是富有（＿①＿）、符合（＿②＿）的改革方法；改革是（＿③＿），发展是（＿④＿），稳定是（＿⑤＿）；先立后破；改革和法治如（＿⑥＿）", "a": ["中国特色", "中国国情", "强大动力", "关键", "前提", "鸟之两翼、车之两轮"], "e": "摸着石頭過河是富有中國特色、符合中國國情的改革方法。改革是經濟社會發展的強大動力，發展是解決一切經濟社會問題的關鍵，穩定是改革發展的前提。重大改革要於法有據，「先立後破」；改革和法治如鳥之兩翼、車之兩輪。", "id": "Q16-020", "l": 16, "ch": 5, "pt": "B", "ps": 11, "pr": ["同頁有考點提示：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-016）"]}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "統籌改革發展穩定：「改革」是：", "o": ["经济社会发展的强大动力", "改革发展的前提", "解决一切经济社会问题的关键"], "a": 0, "e": "「改革」→「经济社会发展的强大动力」。記法：「改革＝動力、發展＝關鍵、穩定＝前提」（動・關・前）。", "id": "Q16-021", "l": 16, "ch": 5, "pt": "B", "ps": 11, "pr": ["同頁有考點提示：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-016）"]}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "統籌改革發展穩定：「改革」是经济社会发展的强大动力。", "a": true, "e": "對。「改革」→「经济社会发展的强大动力」。", "id": "Q16-022", "l": 16, "ch": 5, "pt": "B", "ps": 11, "pr": ["同頁有考點提示：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-016）"]}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "統籌改革發展穩定：「发展」是：", "o": ["解决一切经济社会问题的关键", "经济社会发展的强大动力", "改革发展的前提"], "a": 0, "e": "「发展」→「解决一切经济社会问题的关键」。記法：「改革＝動力、發展＝關鍵、穩定＝前提」（動・關・前）。", "id": "Q16-023", "l": 16, "ch": 5, "pt": "B", "ps": 11, "pr": ["同頁有考點提示：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-016）"]}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "統籌改革發展穩定：「发展」是改革发展的前提。", "a": false, "e": "錯。「发展」應對應「解决一切经济社会问题的关键」，「改革发展的前提」對應的是「稳定」。", "id": "Q16-024", "l": 16, "ch": 5, "pt": "B", "ps": 11, "pr": ["同頁有考點提示：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-016）"]}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "統籌改革發展穩定：「稳定」是：", "o": ["改革发展的前提", "解决一切经济社会问题的关键", "经济社会发展的强大动力"], "a": 0, "e": "「稳定」→「改革发展的前提」。記法：「改革＝動力、發展＝關鍵、穩定＝前提」（動・關・前）。", "id": "Q16-025", "l": 16, "ch": 5, "pt": "B", "ps": 11, "pr": ["同頁有考點提示：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-016）"]}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "統籌改革發展穩定：「稳定」是改革发展的前提。", "a": true, "e": "對。「稳定」→「改革发展的前提」。", "id": "Q16-026", "l": 16, "ch": 5, "pt": "B", "ps": 11, "pr": ["同頁有考點提示：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-016）"]}, {"k": "單", "s": [3], "q": "全面深化改革的總目標是：", "o": ["完善和發展中國特色社會主義制度、推進國家治理體系和治理能力現代化", "全面建成社會主義現代化強國", "建設中國特色社會主義法治體系、建設社會主義法治國家", "解放和發展社會生產力"], "a": 0, "e": "兩句話都要有才完整。C 是全面依法治國總目標。", "id": "Q16-027", "l": 16, "ch": 5, "pt": "A", "ps": 31, "pr": ["老師：…下來）了 選擇（題）、多選……他們兩句話必須要說纔是…（16-003）", "老師：…到這樣一個知識點 考到大題 讓你去簡述全面深化改革的…（16-004）", "投影片黃字／黃筆標記（16-003）"]}, {"k": "單", "s": [5], "q": "「六個緊緊圍繞」中，經濟體制改革要使市場在資源配置中起：", "o": ["決定性作用", "基礎性作用", "主導作用", "輔助作用"], "a": 0, "e": "講師：「選擇題，市場在資源配置中是什麼作用？決定性作用。」", "id": "Q16-028", "l": 16, "ch": 5, "pt": "A", "ps": 49, "pr": ["老師：選擇題 市場在資源配置中是什麼作用 決定性作用（16-005）", "投影片手寫星號（16-005）", "投影片黃字／黃筆標記（16-005）"]}, {"k": "判", "s": [7], "q": "有了好的國家治理體系才能提高國家治理能力，提高國家治理能力才能充分發揮國家治理體系的效能。", "a": true, "e": "對。兩者是有機整體、相輔相成。", "id": "Q16-029", "l": 16, "ch": 5, "pt": "A", "ps": 33, "pr": ["老師：官方的表述 這是要背的 背 國家治理體系和治理能力…（16-007）", "投影片黃字／黃筆標記（16-007）"]}, {"k": "判", "s": [19], "q": "重大改革要「先破後立」。", "a": false, "e": "錯。講師：重大改革要於法有據，「先立後破」，有序進行。", "id": "Q16-030", "l": 16, "ch": 5, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（16-019）"]}, {"k": "單", "s": [16], "q": "「富有中國特色、符合中國國情的改革方法」是：", "o": ["摸着石頭過河", "頂層設計", "一刀切", "休克療法"], "a": 0, "e": "講師原話。", "id": "Q16-031", "l": 16, "ch": 5, "pt": "A", "ps": 21, "pr": ["老師：…第三個方法論 我們只需要背 還是同樣背標題……就背我…（16-018）", "投影片黃字／黃筆標記（16-015）"]}, {"k": "多", "s": [3], "q": "全面深化改革的總目標包括：", "o": ["完善和發展中國特色社會主義制度", "推進國家治理體系和治理能力現代化", "全面建成小康社會", "實現共同富裕"], "a": [0, 1], "e": "兩句話必須都說。", "id": "Q16-032", "l": 16, "ch": 5, "pt": "A", "ps": 31, "pr": ["老師：…下來）了 選擇（題）、多選……他們兩句話必須要說纔是…（16-003）", "老師：…到這樣一個知識點 考到大題 讓你去簡述全面深化改革的…（16-004）", "投影片黃字／黃筆標記（16-003）"]}, {"k": "單", "s": [5, 6], "q": "「六個緊緊圍繞」中最後一個（兜底的）是：", "o": ["黨的建設制度改革", "生態文明體制改革", "社會體制改革", "文化體制改革"], "a": 0, "e": "講師：前五個是五位一體，第六個黨的建設「永遠都用來兜底」。", "id": "Q16-033", "l": 16, "ch": 5, "pt": "A", "ps": 17, "pr": ["投影片手寫星號（16-005）", "同頁有考點提示：選擇題 市場在資源配置中是什麼作用 決定性作用（16-005）", "投影片黃字／黃筆標記（16-005）"]}, {"k": "填", "s": [7], "q": "國家治理體系和治理能力是一個（＿①＿），（＿②＿），有了好的國家治理體系才能提高國家治理能力，提高國家治理能力才能充分發揮國家治理體系的（＿③＿）。", "a": ["有机整体", "相辅相成", "效能"], "e": "講師：官方表述「要背過」。", "id": "Q16-034", "l": 16, "ch": 5, "pt": "A", "ps": 45, "pr": ["老師：官方的表述 這是要背的 背 國家治理體系和治理能力…（16-007）", "老師：要背過（16-007）", "投影片黃字／黃筆標記（16-007）"]}, {"k": "簡", "s": [3, 4], "q": "簡述全面深化改革的總目標。", "sum": "一句白話：改革要把中國特色社會主義制度弄得更好，並讓國家的管理體系和能力現代化。", "pts": ["完善和发展中国特色社会主义制度", "推进国家治理体系和治理能力现代化（两句话合起来才完整）", "前一句规定了改革的根本方向", "后一句明确了改革的鲜明指向和时代要求"], "e": "講師：簡述總目標「一二三四都是必須打的……這是一套完整的答題思路」。投影片（3）意義段請按課本補充。", "id": "Q16-035", "l": 16, "ch": 5, "pt": "A", "ps": 45, "pr": ["老師：…到這樣一個知識點 考到大題 讓你去簡述全面深化改革的…（16-004）", "老師：…下來）了 選擇（題）、多選……他們兩句話必須要說纔是…（16-003）", "投影片黃字／黃筆標記（16-003）"]}, {"k": "論", "s": [12, 13, 14], "q": "論述：我國國家制度和國家治理體系具有哪些顯著優勢？", "sum": "一句白話：我國制度的長處，從黨的領導、人民、法治、全國一盤棋，到經濟、文化、軍隊、一國兩制、對外開放等十三方面。", "pts": ["集中统一领导", "人民当家作主", "全面依法治国", "全国一盘棋", "各民族一律平等", "公有制为主体、多种所有制经济共同发展", "共同的理想信念、价值理念、道德观念", "以人民为中心的发展思想", "改革创新、与时俱进", "德才兼备、选贤任能", "党指挥枪", "“一国两制”", "独立自主和对外开放相统一"], "e": "講師：「如果說他考到一個論述題……那就是要把這十三個打出來。」", "id": "Q16-036", "l": 16, "ch": 5, "pt": "A", "ps": 49, "pr": ["老師：…求大家呢 就是儘可能的背過……如果說他考到一個論述題…（16-014）", "投影片黃字／黃筆標記（16-012）"]}, {"s": [3], "src": "", "card": "C17-01", "tag": ["必背", "論述題考點"], "auto": 1, "k": "填", "q": "填空｜改革開放永無止境（三個原因）：\n改革开放永无止境是（＿①＿）的深刻反映；是总结（＿②＿）得出的重要结论；是推进（＿③＿）的必然要求", "a": ["社会基本矛盾运动规律", "世界社会主义实践经验", "党和人民事业发展"], "e": "為什麼改革開放永遠不會停？①它是社會基本矛盾運動規律的深刻反映（社會總在變，矛盾總在出現）；②是總結世界社會主義實踐經驗得出的重要結論；③是推進黨和人民事業發展的必然要求。講師：大題考點。", "id": "Q17-001", "l": 17, "ch": 5, "pt": "A", "ps": 14, "pr": ["老師：…那麼原因如下 這是一個大題啊 大題考點 每次有什麼考…（17-003）", "投影片黃字／黃筆標記（17-003）"]}, {"s": [3], "src": "", "card": "C17-01", "tag": ["必背", "論述題考點"], "auto": 1, "k": "默", "q": "默寫｜改革開放永無止境（三個原因）", "model": "改革开放永无止境是社会基本矛盾运动规律的深刻反映；是总结世界社会主义实践经验得出的重要结论；是推进党和人民事业发展的必然要求", "pts": ["社会基本矛盾运动规律的深刻反映", "总结世界社会主义实践经验得出的重要结论", "推进党和人民事业发展的必然要求"], "e": "記法：「規律・經驗・要求」：理論上（規律）、歷史上（經驗）、現實上（要求）。", "id": "Q17-002", "l": 17, "ch": 5, "pt": "A", "ps": 14, "pr": ["老師：…那麼原因如下 這是一個大題啊 大題考點 每次有什麼考…（17-003）", "投影片黃字／黃筆標記（17-003）"]}, {"s": [4, 5], "src": "", "card": "C17-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜堅定不移把全面深化改革引向深入（七點）：\n聚焦（＿①＿）；深化（＿②＿）改革；深化（＿③＿）改革；深化（＿④＿）改革；深化（＿⑤＿）改革；深化（＿⑥＿）改革；健全加强党的全面领导、全面从严治党制度体系", "a": ["全面建设社会主义现代化国家中的重大问题", "社会主义市场经济体制", "人民当家作主制度体系", "文化体制", "社会体制", "生态文明体制"], "e": "講師的背誦技巧：「問題導向＋五位一體＋黨建」。①聚焦全面建設社會主義現代化國家中的重大問題；②經濟：深化社會主義市場經濟體制改革；③政治：深化人民當家作主制度體系改革；④文化體制改革；⑤社會體制改革；⑥生態文明體制改革；⑦健全加強黨的全面領導、全面從嚴治黨制度體系。", "id": "Q17-003", "l": 17, "ch": 5, "pt": "A", "ps": 17, "pr": ["老師：背誦技巧：七點「第一個點是問題導向 接下來五個點都是…（17-004）", "投影片黃字／黃筆標記（17-005）"]}, {"s": [4, 5], "src": "", "card": "C17-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜堅定不移把全面深化改革引向深入（七點）", "model": "聚焦全面建设社会主义现代化国家中的重大问题；深化社会主义市场经济体制改革；深化人民当家作主制度体系改革；深化文化体制改革；深化社会体制改革；深化生态文明体制改革；健全加强党的全面领导、全面从严治党制度体系", "pts": ["聚焦全面建设社会主义现代化国家中的重大问题", "深化社会主义市场经济体制改革", "深化人民当家作主制度体系改革", "深化文化体制改革", "深化社会体制改革", "深化生态文明体制改革", "健全加强党的全面领导、全面从严治党制度体系"], "e": "記法：「1問題＋5位一體（經政文社生）＋1黨建」＝7。", "id": "Q17-004", "l": 17, "ch": 5, "pt": "A", "ps": 17, "pr": ["老師：背誦技巧：七點「第一個點是問題導向 接下來五個點都是…（17-004）", "投影片黃字／黃筆標記（17-005）"]}, {"s": [6], "src": "", "card": "C17-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜開放也是改革：\n（＿①＿）；改革不停顿，开放不止步；中国开放的大门只会（＿②＿）", "a": ["开放也是改革", "越开越大"], "e": "講師：「注意，開放也是一種改革。」改革不停頓，開放不止步；中國開放的大門只會越開越大，永遠不會關上。開放帶來進步，封閉必然落後。", "id": "Q17-005", "l": 17, "ch": 5, "pt": "B", "ps": 8, "pr": ["投影片黃字／黃筆標記（17-006）", "老師：注意，開放也是一種改革。（17-006）"]}, {"s": [7, 9, 11], "src": "", "card": "C17-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜堅定不移擴大高水平對外開放：\n（2）坚定不移扩大对外开放；（3）继续扩大对外开放，构建更高水平（＿①＿）；（4）中国的发展离不开世界，世界的繁荣也需要中国", "a": ["开放型经济新体制"], "e": "要堅定不移擴大對外開放；繼續擴大對外開放，構建更高水平開放型經濟新體制。講師講到經濟全球化遭遇逆流（單邊主義、保護主義、孤立主義），要推動貿易和投資自由化便利化、共建「一帶一路」。最後一句「中國的發展離不開世界，世界的繁榮也需要中國」——講師說這裏不需要背。", "id": "Q17-006", "l": 17, "ch": 5, "pt": "B", "ps": 9, "pr": ["投影片黃字／黃筆標記（17-007）"]}, {"k": "單", "s": [3], "q": "改革開放永無止境，是＿＿的深刻反映。", "o": ["社會基本矛盾運動規律", "社會主要矛盾變化", "經濟全球化趨勢", "科技革命規律"], "a": 0, "e": "第一個原因：社會基本矛盾運動規律的深刻反映。", "id": "Q17-007", "l": 17, "ch": 5, "pt": "A", "ps": 32, "pr": ["老師：…那麼原因如下 這是一個大題啊 大題考點 每次有什麼考…（17-003）", "投影片黃字／黃筆標記（17-003）"]}, {"k": "判", "s": [6], "q": "對外開放與改革是兩回事，開放不屬於改革。", "a": false, "e": "錯。講師：「開放也是一種改革。」", "id": "Q17-008", "l": 17, "ch": 5, "pt": "B", "ps": 4, "pr": ["老師：所以你要注意 開放也是一種改革（17-006）", "投影片黃字／黃筆標記（17-006）"]}, {"k": "多", "s": [3], "q": "改革開放永無止境的原因有：", "o": ["是社會基本矛盾運動規律的深刻反映", "是總結世界社會主義實踐經驗得出的重要結論", "是推進黨和人民事業發展的必然要求", "是應對外部壓力的權宜之計"], "a": [0, 1, 2], "e": "三個原因；D 是錯誤說法。", "id": "Q17-009", "l": 17, "ch": 5, "pt": "A", "ps": 32, "pr": ["老師：…那麼原因如下 這是一個大題啊 大題考點 每次有什麼考…（17-003）", "投影片黃字／黃筆標記（17-003）"]}, {"k": "單", "s": [4, 5], "q": "講師把「堅定不移把全面深化改革引向深入」的七點總結為一種背誦技巧，即：", "o": ["問題導向＋五位一體＋黨建兜底", "四個全面＋兩個結合", "三個代表＋科學發展觀", "十四個堅持依次背"], "a": 0, "e": "第一點聚焦重大問題，中間五點是經濟、政治、文化、社會、生態，最後是黨的建設。", "id": "Q17-010", "l": 17, "ch": 5, "pt": "A", "ps": 16, "pr": ["老師：背誦技巧：七點「第一個點是問題導向 接下來五個點都是…（17-004）", "投影片黃字／黃筆標記（17-004）"]}, {"k": "判", "s": [0], "src": "逐字稿", "q": "講師說：「開放給我們帶來進步，封閉必然會給我們帶來落後。」", "a": true, "e": "對。講師原話。", "id": "Q17-011", "l": 17, "ch": 5, "pt": "C", "ps": 0, "pr": []}, {"k": "填", "s": [9], "q": "繼續擴大對外開放，構建更高水平（＿①＿）。", "a": ["开放型经济新体制"], "e": "黃字小標。", "id": "Q17-012", "l": 17, "ch": 5, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（17-009）"]}, {"k": "論", "s": [3], "q": "論述：為什麼說改革開放 ": "逐字稿", "card": "C18-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "多", "q": "「三期疊加」是指：", "o": ["增长速度换挡期", "结构调整阵痛期", "前期刺激政策消化期", "战略机遇期", "经济高速增长期"], "a": [0, 1, 2], "e": "正確：增长速度换挡期；结构调整阵痛期；前期刺激政策消化期。干擾項：战略机遇期；经济高速增长期。", "id": "Q18-003", "l": 18, "ch": 6, "pt": "A", "ps": 27, "pr": ["老師：把這三期記住了啊 這是三期疊加」（增长速度换挡期、…（18-006）", "投影片黃字／黃筆標記（18-006）"]}, {"s": [7], "src": "逐字稿", "card": "C18-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新發展階段的定位；1956年進入社會主義初級階段：\n新发展阶段是社会主义初级阶段中的一个（＿①＿）；从（＿②＿）（三大改造完成）我国正式进入社会主义初级阶段", "a": ["重要阶段", "1956年"], "e": "新發展階段是社會主義初級階段中的一個重要階段。講師：1956年三大改造完成，我國正式進入社會主義初級階段。", "id": "Q18-004", "l": 18, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（18-007）"]}, {"s": [8], "src": "逐字稿", "card": "C18-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜發展理念的重要性：管全局、管根本、管方向、管長遠：\n发展理念是发展行动的（＿①＿），是管（＿②＿）、管（＿③＿）、管（＿④＿）、管（＿⑤＿）的东西；新发展理念是（＿⑥＿）、是（＿⑦＿）", "a": ["先导", "全局", "根本", "方向", "长远", "指挥棒", "红绿灯"], "e": "發展理念是發展行動的「先導」（先有想法才有行動），是管全局、管根本、管方向、管長遠的東西。講師也說：新發展理念是「指揮棒」、是「紅綠燈」。", "id": "Q18-005", "l": 18, "ch": 6, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（18-008）"]}, {"s": [9, 10], "src": "", "card": "C18-05", "tag": ["必背", "選擇題考點", "論述題考點"], "auto": 1, "k": "填", "q": "填空｜新發展理念五句（定位）：\n①（＿①＿）是引领发展的第一动力；②（＿②＿）是持续健康发展的内在要求；③（＿③＿）是永续发展的必要条件和人民对美好生活追求的重要体现；④（＿④＿）是国家繁荣发展的必由之路；⑤（＿⑤＿）是中国特色社会主义的本质要求", "a": ["创新", "协调", "绿色", "开放", "共享"], "e": "五大理念各自是什麼：創新＝第一動力；協調＝內在要求；綠色＝必要條件和重要體現；開放＝必由之路；共享＝本質要求。講師：「這個是我們學習的重點、考點，背。」", "id": "Q18-006", "l": 18, "ch": 6, "pt": "A", "ps": 42, "pr": ["老師：…這個是我們學習的重點 考點 背……第一個 創新是引領…（18-009）", "老師：…發展解決的是什麼問題 背過 協調……是不平衡的問題…（18-010）", "投影片黃字／黃筆標記（18-009）"]}, {"s": [9, 10], "src": "", "card": "C18-05", "tag": ["必背", "選擇題考點", "論述題考點"], "auto": 1, "k": "默", "q": "默寫｜新發展理念五句（定位）", "model": "①创新是引领发展的第一动力；②协调是持续健康发展的内在要求；③绿色是永续发展的必要条件和人民对美好生活追求的重要体现；④开放是国家繁荣发展的必由之路；⑤共享是中国特色社会主义的本质要求", "pts": ["创新是引领发展的第一动力", "协调是持续健康发展的内在要求", "绿色是永续发展的必要条件和人民对美好生活追求的重要体现", "开放是国家繁荣发展的必由之路", "共享是中国特色社会主义的本质要求"], "e": "記法：口訣「創・協・綠・開・共」；定位「動力・要求・條件・之路 : [9], "q": "協調是持續健康發展的內在要求，協調發展注重的是解決發展不平衡問題。", "a": true, "e": "對。投影片原文。", "id": "Q18-050", "l": 18, "ch": 6, "pt": "A", "ps": 24, "pr": ["老師：…這個是我們學習的重點 考點 背……第一個 創新是引領…（18-009）", "老師：…發展解決的是什麼問題 背過 協調……是不平衡的問題…（18-010）", "投影片黃字／黃筆標記（18-009）"]}, {"k": "判", "s": [10], "q": "開放是中國特色社會主義的本質要求。", "a": false, "e": "錯。開放＝國家繁榮發展的必由之路；共享才是中國特色社會主義的本質要求。", "id": "Q18-051", "l": 18, "ch": 6, "pt": "A", "ps": 23, "pr": ["老師：…這個是我們學習的重點 考點 背……第一個 創新是引領…（18-009）", "老師：…發展解決的是什麼問題 背過 協調……是不平衡的問題…（18-010）", "投影片黃字／黃筆標記（18-010）"]}, {"k": "多", "s": [10], "q": "講師出的多選題：共享發展必須堅持（　　）", "o": ["全民共享", "全面共享", "共建共享", "漸進共享"], "a": [0, 1, 2, 3], "e": "講師原題：「A 全民共享 B 全面共享 C 共建共享 D 漸進共享」，四項全選。", "id": "Q18-052", "l": 18, "ch": 6, "pt": "A", "ps": 24, "pr": ["老師：…這個是我們學習的重點 考點 背……第一個 創新是引領…（18-009）", "老師：…發展解決的是什麼問題 背過 協調……是不平衡的問題…（18-010）", "投影片黃字／黃筆標記（18-010）"]}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師把新發展理念比喻為：", "o": ["指揮棒、紅綠燈", "生命線、幸福線", "主心骨、領航者", "發射器、放大器"], "a": 0, "e": "講師：「新發展理念是什麼？是指揮棒，是紅綠燈。」", "id": "Q18-053", "l": 18, "ch": 6, "pt": "C", "ps": 0, "pr": []}, {"k": "填", "s": [6], "q": "「三期疊加」：增長速度（＿①＿）期、結構調整（＿②＿）期、前期刺激政策（＿③＿）期。", "a": ["换挡", "阵痛", "消化"], "e": "講師：「把這三期記住了。」", "id": "Q18-054", "l": 18, "ch": 6, "pt": "A", "ps": 45, "pr": ["老師：把這三期記住了啊 這是三期疊加」（增长速度换挡期、…（18-006）", "投影片黃字／黃筆標記（18-006）"]}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，我國從哪一年正式進入社會主義初級階段？", "o": ["1956年", "1949年", "1978年", "1953年"], "a": 0, "e": "講師：從1956年三大改造完成，正式進入社會主義初級階段。", "id": "Q18-055", "l": 18, "ch": 6, "pt": "C", "ps": 0, "pr": []}, {"k": "論", "s": [9, 10], "q": "論述：如何理解新發展理念的科學內涵？", "sum": "一句白話：五個理念分別給發展「動力、平衡、環保、對外、公平」，各自解決一個發展問題。", "pts": ["创新是引领发展的第一动力，创新发展注重的是解决发展动力问题", "协调是持续健康发展的内在要求，协调发展注重的是解决发展不平衡问题", "绿色是永续发展的必要条件和人民对美好生活追求的重要体现，绿色发展注重的是解决人与自然和谐共生问题", "开放是国家繁荣发展的必由之路，开放发展注重的是解决发展内外联动问题", "共享是中国特色社会主义的本质要求，共享发展注重的是解决社会公平正义问题"], "e": "講師：「總共有五個必須要背過」，每條背到「解決……問題」。", "id": "Q18-056", "l": 18, "ch": 6, "pt": "A", "ps": 60, "pr": ["老師：…這個是我們學習的重點 考點 背……第一個 創新是引領…（18-009）", "老師：…發展解決的是什麼問題 背過 協調……是不平衡的問題…（18-010）", "老師：總共有五個必須要背過（18-009）"]}, {"s": [3], "src": "", "card": "C19-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會主義基本經濟制度的地位：\n社会主义基本经济制度是我国（＿①＿）在制度上的体现，在经济制度体系中具有（＿②＿）地位，是中国特色社会主义制度的（＿③＿）", "a": ["生产关系", "基础性决定性", "重要支柱"], "e": "基本經濟制度是我國「生產關係」（誰擁有、怎樣分、怎樣配置資源）在制度上的體現，在經濟制度體系中起基礎性、決定性作用，是中特制度的重要支柱。", "id": "Q19-001", "l": 19, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（19-003）"]}, {"s": [4, 5], "src": "", "card": "C19-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜十八大以來對基本經濟制度的新概括（三項）：\n（＿①＿），（＿②＿），（＿③＿）", "a": ["公有制为主体、多种所有制经济共同发展", "按劳分配为主体、多种分配方式并存", "社会主义市场经济体制"], "e": "基本經濟制度包括三項：①公有制為主體、多種所有制經濟共同發展（所有制）；②按勞分配為主體、多種分配方式並存（分配）；③社會主義市場經濟體制（資源配置）。", "id": "Q19-002", "l": 19, "ch": 6, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（19-004）"]}, {"s": [4, 5], "src": "", "card": "C19-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "多", "q": "十八大以來概括的社會主義基本經濟制度包括：", "o": ["公有制为主体、多种所有制经济共同发展", "按劳分配为主体、多种分配方式并存", "社会主义市场经济体制", "计划经济体制", "平均分配制度"], "a": [0, 1, 2], "e": "正確：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。干擾項：计划经济体制；平均分配制度。", "id": "Q19-003", "l": 19, "ch": 6, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（19-004）"]}, {"s": [6], "src": "", "card": "C19-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜所有制結構是基本經濟制度的基礎：\n（＿①＿）是基本经济制度的基础，决定（＿②＿）和（＿③＿）", "a": ["所有制结构", "分配方式", "资源配置方式"], "e": "「誰擁有生產資料」決定了怎麼分配、怎麼配置資源，所以所有制結構是基礎。講師：後段（系統性影響）不用背，理解意思即可。", "id": "Q19-004", "l": 19, "ch": 6, "pt": "C", "ps": -2, "pr": ["老師：…常系統性的影響……這裡不用背 你大致理解一下意思就可…（19-006）"]}, {"s": [7], "src": "", "card": "C19-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜公有制和非公有制都是重要組成部分；兩個毫不動搖：\n公有制经济和非公有制经济都是（＿①＿）的重要组成部分，都是我国经济社会发展的（＿②＿）；毫不动摇地（＿③＿）公有制经济，毫不动摇地（＿④＿）非公有制经济发展", "a": ["社会主义市场经济", "重要基础", "巩固和发展", "鼓励、支持、引导"], "e": "公有制經濟和非公有制經濟都是「社會主義市場經濟」的重要組成部分，都是經濟社會發展的重要基礎。所以要「兩個毫不動搖」：毫不動搖鞏固和發展公有制經濟，毫不動搖鼓勵、支持、引導非公有制經濟發展。講師：必須背過。", "id": "Q19-005", "l": 19, "ch": 6, "pt": "A", "ps": 27, "pr": ["老師：注意這裡 選擇題考點 第一個 公有制經濟和非公有制…（19-007）", "老師：…很多 一個是這個 必須背過 公有制和非公有（制）都是…（19-007）", "投影片黃字／黃筆標記（19-007）"]}, {"s": [7], "src": "", "card": "C19-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜公有制和非公有制都是重要組成部分；兩個毫不動搖", "model": "公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础；毫不动摇地巩固和发展公有制经济，毫不动摇地鼓励、支持、引导非公有制经济发展", "pts": ["社会主义市场经济", "重要基础", "巩固和发展", "鼓励、支持、引导"], "e": "記法：「都是・都是・兩個毫不動搖」：公＝鞏固發展；非公＝鼓勵支持引導。", "id": "Q19-006", "l": 19, "ch": 6, "pt": "A", "ps": 27, "pr": ["老師：注意這裡 選擇題考點 第一個 公有制經濟和非公有制…（19-007）", "老師：…很多 一個是這個 必須背過 公有制和非公有（制）都是…（19-007）", "投影片黃字／黃筆標記（19-007）"]}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜公有制主體地位、國有經濟主導作用、戰略支撐作用：\n公有制——（＿①＿）；国有经济——（＿②＿）；发挥国有经济的（＿③＿）；国有企业是中国特色社会主义的重要（＿④＿）", "a": ["主体地位", "主导作用", "战略支撑作用", "物质基础和政治基础"], "e": "公有制＝「主體地位」；國有經濟＝「主導作用」；還要發揮國有經濟的「戰略支撐作用」。國有企業是中特的重要物質基礎和政治基礎，是黨執政興國的重要支柱和依靠力量。", "id": "Q19-007", "l": 19, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（19-008）"]}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師：「公有制」在我國經濟中居於（發揮）：", "o": ["主体地位", "主导作用", "补充作用", "决定性作用"], "a": 0, "e": "「公有制」→「主体地位」。記法：「公＝主體、國有＝主導」（體大、導帶路）。", "id": "Q19-008", "l": 19, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（19-008）"]}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「公有制」的地位／作用是主体地位。", "a": true, "e": "對。「公有制」→「主体地位」。", "id": "Q19-009", "l": 19, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（19-008）"]}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師：「国有经济」在我國經濟中居於（發揮）：", "o": ["主导作用", "主体地位", "补充作用", "决定性作用"], "a": 0, "e": "「国有经济」→「主导作用」。記法：「公＝主體、國有＝主導」（體大、導帶路）。", "id": "Q19-010", "l": 19, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（19-008）"]}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「国有经济」的地位／作用是主体地位。", "a": false, "e": "錯。「国有经济」應對應「主导作用」，「主体地位」對應的是「公有制」。", "id": "Q19-011", "l": 19, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（19-008）"]}, {"s": [9, 10], "src": "", "card": "C19-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜非公有制經濟與民營經濟：\n非公有制经济是（＿①＿）的重要组成部分；（＿②＿）是非公有制经济的（＿③＿）；是推进中国式现代化的（＿④＿）", "a": ["社会主义市场经济", "民营经济", "主要经济组织形式", "生力军"], "e": "講師提醒「很喜歡考選擇題」：非公有制經濟是「社會主義市場經濟」的重要組成部分。民營經濟是非公有制經濟的主要（經濟）組織形式；是推進中國式現代化的生力軍、高質量發展的重要基礎。", "id": "Q19-012", "l": 19, "ch": 6, "pt": "A", "ps": 38, "pr": ["老師：考點 選擇 民營經濟是什麼 是非公有制經濟（的）主…（19-010）", "老師：很喜歡考選擇題（19-009）", "投影片黃字／黃筆標記（19-009）"]}, {"s": [11], "src": "", "card": "C19-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜公有制經濟與非公有制經濟的關係：\n公有制经济与非公有制经济（＿①＿）、（＿②＿）", "a": ["相辅相成", "相得益彰"], "e": "兩者不是對立的，而是相輔相成、相得益彰（互相幫助、互相成就）。", "id": "Q19-013", "l": 19, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（19-011）"]}, {"s": [12], "src": "", "card": "C19-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜基本分配制度：\n（＿①＿）的（＿②＿），由社会主义性质和基本国情决定", "a": ["按劳分配为主体、多种分配方式并存", "基本分配制度"], "e": "按勞分配為主體、多種分配方式並存的基本分配制度，是由社會主義性質和初級階段基本國情決定的。", "id": "Q19-014", "l": 19, "ch": 6, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（19-012）"]}, {"s": [15], "src": "", "card": "C19-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜構建高水平社會主義市場經濟體制：\n（1）处理好（＿①＿）的关系——使市场在资源配置中起（＿②＿），更好发挥政府作用；（2）加快建设（＿③＿）", "a": ["政府和市场", "决定性作用", "高标准市场体系"], "e": "關鍵是處理好政府和市場的關係：使市場在資源配置中起決定性作用，更好發揮政府作用；並加快建設高標準市場體系。", "id": "Q19-015", "l": 19, "ch": 6, "pt": "A", "ps": 15, "pr": ["老師：……起決定性作用 選擇題考點 然後還要更好的發揮好政府…（19-015）", "投影片黃字／黃筆標記（19-015）"]}, {"k": "單", "s": [9, 10], "q": "非公有制經濟的主要經濟組織形式是：", "o": ["民營經濟", "個體經濟", "外資經濟", "混合所有制經濟"], "a": 0, "e": "講師：「考點，選擇，民營經濟是非公有制經濟主要組織形式。」", "id": "Q19-016", "l": 19, "ch": 6, "pt": "A", "ps": 58, "pr": ["老師：考點 選擇 民營經濟是什麼 是非公有制經濟（的）主…（19-010）", "老師：很喜歡考選擇題（19-009）", "投影片黃字／黃筆標記（19-009）"]}, {"k": "單", "s": [7], "q": "公有制經濟和非公有制經濟都是＿＿的重要組成部分。", "o": ["社會主義市場經濟", "公有制經濟", "國有經濟", "計劃經濟"], "a": 0, "e": "原文：都是社會主義市場經濟的重要組成部分。", "id": "Q19-017", "l": 19, "ch": 6, "pt": "A", "ps": 44, "p "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（20-003）"]}, {"s": [3, 4], "src": "", "card": "C20-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜構建新發展格局：把握未來發展主動權的戰略部署（四個標題）", "model": "（1）构建新发展格局是对我国客观经济规律和发展趋势的自觉把握；（2）是把握未来发展主动权的先手棋；（3）是开放的国内国际双循环；（4）是以全国统一大市场基础上的国内大循环为主体", "pts": ["对我国客观经济规律和发展趋势的自觉把握", "把握未来发展主动权的先手棋", "开放的国内国际双循环", "以全国统一大市场基础上的国内大循环为主体"], "e": "記法：講師回顧口訣：「第一自覺把握、第二先手棋、第三雙循環、第四國內大循環為主體」。", "id": "Q20-002", "l": 20, "ch": 6, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（20-003）"]}, {"s": [5], "src": "", "card": "C20-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜以國內大循環為主體：國內大循環起主導作用：\n加强（＿①＿）在双循环中的（＿②＿）", "a": ["国内大循环", "主导作用"], "e": "國內和國際兩個循環都存在，但起「主導作用」的是國內大循環。講師：選擇題考點。", "id": "Q20-003", "l": 20, "ch": 6, "pt": "A", "ps": 15, "pr": ["老師：…循環中的主導作用 那你要記住這是選擇題（的）考點 雖…（20-005）", "投影片黃字／黃筆標記（20-005）"]}, {"s": [5, 6], "src": "", "card": "C20-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜以國內大循環為主體、國內國際雙循環相互促進（三點）：\n（1）加强国内大循环在双循环中的主导作用；（2）发挥（＿①＿）；（3）构建新发展格局必须保证经济循环的（＿②＿）", "a": ["比较优势", "畅通无阻"], "e": "①加強國內大循環在雙循環中的主導作用；②發揮比較優勢；③構建新發展格局必須保證經濟循環的暢通無阻。", "id": "Q20-004", "l": 20, "ch": 6, "pt": "A", "ps": 17, "pr": ["老師：…循環中的主導作用 那你要記住這是選擇題（的）考點 雖…（20-005）", "投影片黃字／黃筆標記（20-006）"]}, {"s": [7, 8], "src": "逐字稿", "card": "C20-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜大力推動構建新發展格局（實體經濟、科技自立自強）：\n扩大内需战略同深化（＿①＿）有机结合；实体经济是一国经济的（＿②＿）、财富源泉；构建新发展格局最本质的特征是实现（＿③＿）", "a": ["供给侧结构性改革", "立身之本", "高水平的自立自强"], "e": "怎樣推動：擴大內需戰略同深化供給側結構性改革有機結合；着力發展實體經濟（講師選擇題：實體經濟是一國經濟的立身之本、財富源泉）；加快科技自立自強（構建新發展格局最本質的特徵是實現高水平的自立自強）；推動產業鏈供應鏈優化升級。", "id": "Q20-005", "l": 20, "ch": 6, "pt": "A", "ps": 15, "pr": ["老師：第二個 為什麼 選擇題來了 實體經濟是什麼 是一國…（20-007）", "投影片黃字／黃筆標記（20-007）"]}, {"k": "單", "s": [5], "q": "在國內國際雙循環中起主導作用的是：", "o": ["國內大循環", "國際循環", "兩者同等", "對外貿易"], "a": 0, "e": "講師：「雖然這兩個循環都存在，但是有一個是起主導作用的，哪一個？國內大循環。」", "id": "Q20-006", "l": 20, "ch": 6, "pt": "A", "ps": 32, "pr": ["老師：…循環中的主導作用 那你要記住這是選擇題（的）考點 雖…（20-005）", "投影片黃字／黃筆標記（20-005）"]}, {"k": "單", "s": [ 内在一致性", "相互支撑性"], "e": "為什麼要把教育、科技、人才一起推進？因為建設教育強國、科技強國、人才強國有「內在一致性和相互支撐性」——三者目標一致、互相幫忙。（發展現狀、支撐與貢獻兩段講師說了解即可，不用背。）", "id": "Q22-001", "l": 22, "ch": 7, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（22-006）"]}, {"s": [10], "src": "", "card": "C22-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜科教興國戰略：科學技術是第一生產力：\n（＿①＿）——全面落实（＿②＿）的思想；（＿③＿）在国家发展全局中居于（＿④＿）", "a": ["科教兴国战略", "科学技术是第一生产力", "创新", "核心位置"], "e": "科教興國戰略就是要全面落實「科學技術是第一生產力」的思想，堅持教育優先發展；同頁黃字：創新在國家發展全局中居於核心位置。", "id": "Q22-002", "l": 22, "ch": 7, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（22-010）"]}, {"s": [11], "src": "", "card": "C22-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人才強國戰略：人才資源是第一資源；黨管人才：\n（＿①＿）——树立（＿②＿）的理念；坚持（＿③＿）的原则", "a": ["人才强国战略", "人才资源是第一资源", "党管人才"], "e": "人才強國戰略要鞏固樹立「人才資源是第一資源」的理念；實施人才強國戰略要堅持「黨管人才」原則。講師：選擇題。", "id": "Q22-003", "l": 22, "ch": 7, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（22-011）"]}, {"s": [12], "src": "", "card": "C22-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜創新驅動發展戰略：創新是第一動力：\n（＿①＿）——坚持（＿②＿）", "a": ["创新驱动发展战略", "创新是第一动力"], "e": "創新驅動發展戰略就是要堅持「創新是第一動力」（新發展理念的內容）。講師：只需要把黃色部分記住。", "id": "Q22-004", "l": 22, "ch": 7, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（22-012）"]}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：三個「第一」——生產力・資源・動力：\n（＿①＿）是第一生产力；（＿②＿）是第一资源；（＿③＿）是第一动力", "a": ["科学技术", "人才资源", "创新"], "e": "講師特別強調：「創新是第一動力，科學技術才是第一生產力，一定要把這個給區分開」；另外人才資源是第一資源。對應三大戰略：科教興國↔第一生產力；人才強國↔第一資源；創新驅動↔第一動力。", "id": "Q22-005", "l": 22, "ch": 7, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（22-010）", "老師：…生產力，一定要把這個給區分開（22-010）"]}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師辨析三個「第一」：「科学技术」是：", "o": ["第一生产力", "第一资源", "第一动力", "第一要务"], "a": 0, "e": "「科学技术」→「第一生产力」。記法：「科技生產、人才資源、創新動力」——「科・人・創」配「產・源・動」。", "id": "Q22-006", "l": 22, "ch": 7, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（22-010）", "老師：…生產力，一定要把這個給區分開（22-010）"]}, {"s": [10, 11, 12], "src": "", 心）、高效的法治實施體系、嚴密的法治監督體系、有力的法治保障體系、完善的黨內法規體系（以黨章為根本）。把黨內法規體系納入法治體系，是我國法治區別於其他國家法治的鮮明特徵。", "id": "Q31-007", "l": 31, "ch": 9, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（31-008）"]}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜中特法治體系的五大體系", "model": "完备的法律规范体系；高效的法治实施体系；严密的法治监督体系；有力的法治保障体系；完善的党内法规体系", "pts": ["完备的法律规范体系", "高效的法治实施体系", "严密的法治监督体系", "有力的法治保障体系", "完善的党内法规体系"], "e": "記法：形容詞配對：「完備規範・高效實施・嚴密監督・有力保障・完善黨規」＝「備・效・密・力・善」。", "id": "Q31-008", "l": 31, "ch": 9, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（31-008）"]}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "中特法治體系中，「＿＿法律规范体系」應配哪個形容詞？", "o": ["完备的", "严密的", "有力的", "高效的"], "a": 0, "e": "「法律规范体系」→「完备的」。記法：形容詞配對：「完備規範・高效實施・嚴密監督・有力保障・完善黨規」＝「備・效・密・力・善」。", "id": "Q31-009", "l": 31, "ch": 9, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（31-008）"]}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "中特法治體系包括「完备的法律规范体系」。", "a": true, "e": "對。「法律规范体系」→「完备的」。", "id": "Q31-010", "l": 31, "ch": 9, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（31-008）"]}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "中特法治體系中，「＿＿法治实施体系」應配哪個形容詞？", "o": ["高效的", "完善的", "完备的", "有力的"], "a": 0, "e": "「法治实施体系」→「高效的」。記法：形容詞配對：「完備規範・高效實施・嚴密監督・有力保障・完善黨規」＝「備・效・密・力・善」。", "id": "Q31-011", "l": 31, "ch": 9, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（31-008）"]}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "中特法治體系包括「严密的法治实施体系」。", "a": false, "e": "錯。「法治实施体系」應對應「高效的」，「严密的」對應的是「法治监督体系」。", "id": "Q31-012", "l": 31, "ch": 9, "pt": "B", "ps": 12, "pr": ["投影片黃字／黃筆標記（31-008）"]}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "中特法治體系中，「＿＿法治监督体系」應配哪個形容詞？", "o": ["严密的", "完备的", "有力的", "高效的"], "a": 0, "e": "「法治监督体系」→「严密的」。記法：形容詞配對：「完備規範・高效實施・嚴密監督・有力保障・完善黨規」＝「備・效・密・力・善 背 這個就是我們的工作…（32-006）", "老師：背、背、背，三個標題要背過。（32-004）"]}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新十六字方針；公正司法是最後一道防線：\n（＿①＿）、（＿②＿）、（＿③＿）、（＿④＿）；公正司法是维护社会公平正义的（＿⑤＿）", "a": ["科学立法", "严格执法", "公正司法", "全民守法", "最后一道防线"], "e": "建設更高水平的法治中國：科學立法、嚴格執法、公正司法、全民守法（講師：「16字」）。公正司法是維護社會公平正義的最後一道防線（選擇題，二十大重要內容）。每一個立法環節都要把好憲法關；形成守法光榮、違法可恥的社會氛圍。", "id": "Q32-011", "l": 32, "ch": 9, "pt": "A", "ps": 18, "pr": ["老師：…這是我們的一個選擇題考點 也是在我們的二十大中的一…（32-009）", "投影片黃字／黃筆標記（32-007）"]}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "十六字方針中，「＿＿立法」前面的修飾詞是：", "o": ["科学", "全民", "严格", "公正"], "a": 0, "e": "「立法」→「科学」。記法：「立・執・司・守」配「科學・嚴格・公正・全民」。", "id": "Q32-012", "l": 32, "ch": 9, "pt": "A", "ps": 18, "pr": ["老師：…這是我們的一個選擇題考點 也是在我們的二十大中的一…（32-009）", "投影片黃字／黃筆標記（32-007）"]}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "十六字方針包括「科学立法」。", "a": true, "e": "對。「立法」→「科学」。", "id": "Q32-013", "l": 32, "ch": 9, "pt": "A", "ps": 18, "pr": ["老師：…這是我們的一個選擇題考點 也是在我們的二十大中的一…（32-009）", "投影片黃字／黃筆標記（32-007）"]}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "十六字方針中，「＿＿执法」前面的修飾詞是：", "o": ["严格", "科学", "全民", "公正"], "a": 0, "e": "「执法」→「严格」。記法：「立・執・司・守」配「科學・嚴格・公正・全民」。", "id": "Q32-014", "l": 32, "ch": 9, "pt": "A", "ps": 18, "pr": ["老師：…這是我們的一個選擇題考點 也是在我們的二十大中的一…（32-009）", "投影片黃字／黃筆標記（32-007）"]}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "十六字方針包括「公正执法」。", "a": false, "e": "錯。「执法」應對應「严格」，「公正」對應的是「司法」。", "id": "Q32-015", "l": 32, "ch": 9, "pt": "A", "ps": 18, "pr": ["老師：…這是我們的一個選擇題考點 也是在我們的二十大中的一…（32-009）", "投影片黃字／黃筆標記（32-007）"]}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "十六字方針中，「＿＿司法」前面的修飾詞是：", "o": ["公正", "严格", "全民", "科学"], "a": 0, "e": "「司法」→「公正」。記法：「立・執・司・守」配「科學・嚴格・公正・全民」。", "id": "Q32-016", "l": 32, "ch": 9, "pt": "A", "ps": 18, "pr" 精神、抗洪精神、载人航天精神）", "中国特色社会主义新时代（如脱贫攻坚精神、抗疫精神、探月精神）"], "e": "講師：至少要知道包含哪些時期、各時期的重要事件（精神）。", "id": "Q35-061", "l": 35, "ch": 10, "pt": "B", "ps": 9, "pr": ["投影片黃字／黃筆標記（35-010）"]}, {"s": [3], "src": "", "card": "C36-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中華優秀傳統文化＝中華民族的根和魂：\n中华（＿①＿）传统文化是中华文明的（＿②＿），是中华民族的（＿③＿）", "a": ["优秀", "智慧结晶和精华所在", "根和魂"], "e": "講師：一定要突出「優秀」兩字。中華優秀傳統文化是中華文明的智慧結晶和精華所在，是中華民族的根和魂。", "id": "Q36-001", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-003）"]}, {"s": [3], "src": "", "card": "C36-02", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜中華文明的五個突出特性：\n中华文明的（＿①＿）、（＿②＿）、（＿③＿）、（＿④＿）、（＿⑤＿）", "a": ["连续性", "创新性", "统一性", "包容性", "和平性"], "e": "連續性（一直沒斷）、創新性（不斷出新）、統一性（追求統一）、包容性（能吸收各種文化）、和平性（愛好和平）。", "id": "Q36-002", "l": 36, "ch": 10, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（36-003）"]}, {"s": [3], "src": "", "card": "C36-02", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "默", "q": "默寫｜中華文明的五個突出特性", "model": "中华文明的连续性、创新性、统一性、包容性、和平性", "pts": ["连续性", "创新性", "统一性", "包容性", "和平性"], "e": "記法：「連・創・統・包・和」——「連創統包和」。", "id": "Q36-003", "l": 36, "ch": 10, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（36-003）"]}, {"s": [3], "src": "", "card": "C36-02", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "多", "q": "中華文明的突出特性包括：", "o": ["连续性", "创新性", "统一性", "包容性", "封闭性"], "a": [0, 1, 2, 3], "e": "正確：连续性；创新性；统一性；包容性。干擾項：封闭性。", "id": "Q36-004", "l": 36, "ch": 10, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（36-003）"]}, {"s": [3], "src": "", "card": "C36-02", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "多", "q": "中華文明的突出特性包括：", "o": ["连续性", "包容性", "统一性", "和平性", "扩张性"], "a": [0, 1, 2, 3], "e": "正確：连续性；包容性；统一性；和平性。干擾項：扩张性。", "id": "Q36-005", "l": 36, "ch": 10, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（36-003）"]}, {"s": [4], "src": "", "card": "C36-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜創造性轉化、創新性發展：\n推动中华优秀传统文化（＿①＿）、（＿②＿）；坚持（＿③＿）、（＿④＿）", "a": ["创造性转化", "创新性发展", "古为今用", "推陈出新"], "e": "對傳統文化不是原封不動，而是改造（轉化）並發展；堅持古為今用、推陳出新。中國共產黨既是中國先進文化的積極引領者和踐行者，又是中華優秀傳統文化的忠實傳承者和弘揚者。", "id": "Q36-006", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-004）"]}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜文藝的崇高使命 vs 神聖職責：\n举（＿①＿）、立（＿②＿）、建（＿③＿）是当代中国文艺的（＿④＿）；弘扬（＿⑤＿）、传播（＿⑥＿）、凝聚（＿⑦＿）是文艺工作者的（＿⑧＿）", "a": ["精神旗帜", "精神支柱", "精神家园", "崇高使命", "中国精神", "中国价值", "中国力量", "神圣职责"], "e": "崇高使命＝舉精神旗幟、立精神支柱、建精神家園（三個「精神」）；神聖職責＝弘揚中國精神、傳播中國價值、凝聚中國力量（三個「中國」）。", "id": "Q36-007", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "單", "q": "「当代中国文艺的崇高使命」是：", "o": ["举精神旗帜、立精神支柱、建精神家园", "弘扬中国精神、传播中国价值、凝聚中国力量"], "a": 0, "e": "「当代中国文艺的崇高使命」→「举精神旗帜、立精神支柱、建精神家园」。記法：「使命＝三精神（旗柱園）；職責＝三中國（精神價值力量）」。", "id": "Q36-008", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "判", "q": "当代中国文艺的崇高使命是「举精神旗帜、立精神支柱、建精神家园」。", "a": true, "e": "對。「当代中国文艺的崇高使命」→「举精神旗帜、立精神支柱、建精神家园」。", "id": "Q36-009", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "單", "q": "「文艺工作者的神圣职责」是：", "o": ["弘扬中国精神、传播中国价值、凝聚中国力量", "举精神旗帜、立精神支柱、建精神家园"], "a": 0, "e": "「文艺工作者的神圣职责」→「弘扬中国精神、传播中国价值、凝聚中国力量」。記法：「使命＝三精神（旗柱園）；職責＝三中國（精神價值力量）」。", "id": "Q36-010", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "判", "q": "文艺工作者的神圣职责是「举精神旗帜、立精神支柱、建精神家园」。", "a": false, "e": "錯。「文艺工作者的神圣职责」應對應「弘扬中国精神、传播中国价值、凝聚中国力量」，「举精神旗帜、立精神支柱、建精神家园」對應的是「当代中国文艺的崇高使命」。", "id": "Q36-011", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"s": [6], "src": "", "card": "C36-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會效益放在首位：\n坚持把（＿①＿）放在（＿②＿），社会效益和经济效益相统一", "a": ["社会效益", "首位"], "e": "發展文化產業，要堅持把社會效益放在首位（先看對社會好不好，再看賺不賺錢），社會效益和經濟效益相統一。", "id": "Q36-012", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"s": [7], "src": "", "card": "C36-06", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜文化軟實力集中體現為凝聚力和生命力：\n文化软实力集中体现一个国家基于文化而具有的（＿①＿），以及由此产生的（＿②＿）；（＿③＿）、传播好中国声音", "a": ["凝聚力和生命力", "吸引力和影响力", "讲好中国故事"], "e": "講師：「把這兩個記住。」文化軟實力集中體現一個國家基於文化而具有的凝聚力和生命力，以及由此產生的吸引力和影響力。講好中國故事、傳播好中國聲音。", "id": "Q36-013", "l": 36, "ch": 10, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（36-007）"]}, {"k": "單", "s": [7], "q": "文化軟實力集中體現一個國家基於文化而具有的：", "o": ["凝聚力和生命力", "吸引力和影響力", "創造力和競爭力", "傳播力和引導力"], "a": 0, "e": "講師：「凝聚力和生命力，把這兩個記住。」吸引力和影響力是「由此產生」的。", "id": "Q36-014", "l": 36, "ch": 10, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（36-007）"]}, {"k": "單", "s": [3], "q": "中華民族的根和魂是：", "o": ["中華優秀傳統文化", "馬克思主義", "革命文化", "社會主義先進文化"], "a": 0, "e": "根和魂＝中華優秀傳統文化（馬克思主義是意識形態的旗幟和靈魂）。", "id": "Q36-015", "l": 36, "ch": 10, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（36-003）"]}, {"k": "判", "s": [6], "q": "發展文化產業要堅持把經濟效益放在首位。", "a": false, "e": "錯。社會效益放在首位，社會效益和經濟效益相統一。", "id": "Q36-016", "l": 36, "ch": 10, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（36-006）"]}, {"k": "單", "s": [4], "q": "對待中華優秀傳統文化，要堅持：", "o": ["古為今用、推陳出新", "百花齊放、百家爭鳴", "全盤保留、原樣照搬", "全盤否定、徹底拋棄"], "a": 0, "e": "古為今用、推陳出新；雙百是文化方針（第33堂）。", "id": "Q36-017", "l": 36, "ch": 10, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（36-004）"]}, {"k": "單", "s": [7], "q": "講好中國故事、傳播好中國聲音，屬於哪一知識點？", "o": ["不斷提升國家文化軟實力和中華文化影響力", "傳承發展中華優秀傳統文化", "繁榮發展文化事業和文化產業", "積極塑造主流輿論新格局"], "a": 0, "e": "知識點3 文化軟實力與中華文化影響力。", "id": "Q36-018", "l": 36, "ch": 10, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（36-007）"]}, {"s": [5], "src": "", "card": "C37-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜增進民生福祉＝立黨為公、執政為民的本質要求：\n增进民生福祉是坚持（＿①＿）、（＿②＿）的（＿③＿）", "a": ["立党为公", "执政为民", "本质要求"], "e": "講師：「這一句話就作為一個選擇題」「來把這個給老師記住了。」白話：黨為人民辦事，最根本就是讓老百姓生活更好；增進民生福祉是「立黨為公、執政為民」的本質要求。中國共產黨是人民的黨，任何時候都把群眾利益放在第一位。", "id": "Q37-001", "l": 37, "ch": 11, "pt": "A", "ps": 34, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C37-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜民生是人民幸福之基：增進民生福祉的三個定位：\n增进民生福祉是坚持立党为公、执政为民的（＿①＿）；增进民生福祉是社会主义生产的（＿②＿）；增进民生福祉是全面建设社会主义现代化国家的（＿③＿）", "a": ["本质要求", "根本目的", "应有之义"], "e": "知識點1 三句要分清：（1）本質要求——對黨來說（立黨為公、執政為民）；（2）根本目的——對社會主義生產來說（社會主義生產為了人民）；（3）應有之義——對全面建設社會主義現代化國家來說。例如問「社會主義生產的根本目的」就選增進民生福祉。", "id": "Q37-002", "l": 37, "ch": 11, "pt": "A", "ps": 28, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C37-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "增進民生福祉是「坚持立党为公、执政为民的」什麼？", "o": ["本质要求", "根本目的", "应有之义"], "a": 0, "e": "「坚持立党为公、执政为民的」→「本质要求」。記法：「黨→本質要求；生產→根本目的；現代化→應有之義」。", "id": "Q37-003", "l": 37, "ch": 11, "pt": "A", "ps": 28, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C37-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "增進民生福祉是坚持立党为公、执政为民的「本质要求」。", "a": true, "e": "對。「坚持立党为公、执政为民的」→「本质要求」。", "id": "Q37-004", "l": 37, "ch": 11, "pt": "A", "ps": 28, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C37-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "增進民生福祉是「社会主义生产的」什麼？", "o": ["根本目的", "本质要求", "应有之义"], "a": 0, "e": "「社会主义生产的」→「根本目的」。記法：「黨→本質要求；生產→根本目的；現代化→應有之義」。", "id": "Q37-005", "l": 37, "ch": 11, "pt": "A", "ps": 28, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C37-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "增進民生福祉是社会主义生产的「应有之义」。", "a": false, "e": "錯。「社会主义生产的」應對應「根本目的」，「应有之义」對應的是「全面建设社会主义现代化国家的」。", "id": "Q37-006", "l": 37, "ch": 11, "pt": "A", "ps": 28, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C37-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "增進民生福祉是「全面建设社会主义现代化国家的」什麼？", "o": ["应有之义", "本质要求", "根本目的"], "a": 0, "e": "「全面建设社会主义现代化国家的」→「应有之义」。記法：「黨→本質要求；生產→根本目的；現代化→應有之義」。", "id": "Q37-007", "l": 37, "ch": 11, "pt": "A", "ps": 28, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"s": [5, 6, 7], "src": "", "card": "C37-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "增進民生福祉是全面建设社会主义现代化国家的「应有之义」。", "a": true, "e": "對。「全面建设社会主义现代化国家的」→「应有之义」。", "id": "Q37-008", "l": 37, "ch": 11, "pt": "A", "ps": 28, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"s": [6], "src": "", "card": "C37-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會主義與資本主義的根本區別之一：\n关注（＿①＿），是社会主义和资本主义的（＿②＿）", "a": ["人本身的发展", "根本区别之一"], "e": "講師：抽象概念「不會考」，只需知道一句。白話：資本主義社會裏，生產表面上是人的目的，但人並不是生產的目的；社會主義關注人本身的發展，這是兩者的根本區別之一。", "id": "Q37-009", "l": 37, "ch": 11, "pt": "C", "ps": -11, "pr": ["老師：他比較抽象的一些概念不重要 他也不會考這些概念 我…（37-006）", "老師：不會考（37-006）"]}, {"s": [8], "src": "", "card": "C37-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜讓人民生活幸福是「國之大者」：\n以人民为中心是我们党的（＿①＿），让人民生活幸福是（＿②＿）", "a": ["根本执政理念", "“国之大者”"], "e": "講師：「注意一下」。全面建設社會主義現代化國家，出發點和落腳點是讓人民生活越過越好。以人民為中心是黨的根本執政理念；讓人民生活幸福是「國之大者」（國家最大的事）。", "id": "Q37-010", "l": 37, "ch": 11, "pt": "B", "ps": 5, "pr": ["老師：注意一下（37-008）", "投影片黃字／黃筆標記（37-008）"]}, {"s": [10], "src": "", "card": "C37-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜脫貧攻堅＝底線任務＋第一民生工程：\n打赢脱贫攻坚战，消除（＿①＿）是全面建成小康社会的（＿②＿），是必须抓紧抓好的（＿③＿）", "a": ["绝对贫困", "底线任务", "第一民生工程"], "e": "講師：「消除絕對貧困，把這一個給老師記一下，叫做絕對」「這個給老師背過。」白話：消除的是「絕對」貧困（吃不飽穿不暖），不是相對貧困；它是全面建成小康社會的底線任務，也是第一民生工程。", "id": "Q37-011", "l": 37, "ch": 11, "pt": "A", "ps": 37, "pr": ["老師：…一名聲工程 這個給老師背過啊 那麼（37-010）", "老師：900多個啊 你只需要記住 我們貧困線（37-010）", "老師：具體的數字 它可能考選擇題 那你就（37-010）"]}, {"s": [10], "src": "", "card": "C37-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜脫貧攻堅成果數字：\n现行标准下近（＿①＿）农村贫困人口实现脱贫，历史性地解决了（＿②＿）问题。脱贫摘帽不是（＿③＿），而是新生活、新奋斗的（＿④＿）", "a": ["1亿", "绝对贫困", "终点", "起点"], "e": "講師：具體縣數「不需要去記」，但「注意這個數字，是1億」。黨的十八大以來，全國832個貧困縣全部摘帽，12.8萬個貧困村全部出列，近1億農村貧困人口實現脫貧，歷史性地解決了絕對貧困問題。脫貧摘帽不是終點，而是新生活、新奮鬥的起點。", "id": "Q37-012", "l": 37, "ch": 11, "pt": "A", "ps": 26, "pr": ["老師：…一名聲工程 這個給老師背過啊 那麼（37-010）", "老師：900多個啊 你只需要記住 我們貧困線（37-010）", "老師：具體的數字 它可能考選擇題 那你就（37-010）"]}, {"s": [11], "src": "", "card": "C37-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜就業是最大的民生工程：\n把（＿①＿）作为（＿②＿），推动实现更加充分更高质量就业", "a": ["就业", "最大的民生工程"], "e": "講師：「這個是一個非常容易考到的選擇題考點，就業是最大的民生。」白話：有工作才有收入，所以把就業放在民生第一大事。注意：脫貧攻堅是「第一民生工程」，就業是「最大的民生工程」。", "id": "Q37-013", "l": 37, "ch": 11, "pt": "A", "ps": 26, "pr": ["老師：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）"]}, {"s": [11], "src": "", "card": "C37-08", "tag": ["必背", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜民生重點領域（六個）：\n聚焦民生重点领域，在（＿①＿）、（＿②＿）、（＿③＿）、（＿④＿）、（＿⑤＿）、（＿⑥＿）等方面推出一系列重大举措", "a": ["收入分配", "就业", "教育", "社会保障", "医疗卫生", "住房保障"], "e": "講師：「哪些是重點領域呢？收入分配、就業、教育、社會保障，以及醫療衛生、住房保障。」黨在這些方面推出一系列重大舉措，推動人民生活全方位改善。", "id": "Q37-014", "l": 37, "ch": 11, "pt": "A", "ps": 18, "pr": ["老師：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）", "老師：哪些是重點領域呢？收入分配、就業、教育、社會保障，以…（37-011）"]}, {"s": [11], "src": "", "card": "C37-08", "tag": ["必背", "多選題考點"], "auto": 1, "k": "默", "q": "默寫｜民生重點領域（六個）", "model": "聚焦民生重点领域，在收入分配、就业、教育、社会保障、医疗卫生、住房保障等方面推出一系列重大举措", "pts": ["收入分配", "就业", "教育", "社会保障", "医疗卫生", "住房保障"], "e": "記法：「收・就・教・保・醫・住」——「收就教保醫住」。", "id": "Q37-015", "l": 37, "ch": 11, "pt": "A", "ps": 18, "pr": ["老師：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）", "老師：哪些是重點領域呢？收入分配、就業、教育、社會保障，以…（37-011）"]}, {"s": [11], "src": "", "card": "C37-08", "tag": ["必背", "多選題考點"], "auto": 1, "k": "多", "q": "投影片列出的民生重點領域包括：", "o": ["收入分配", "就业", "教育", "社会保障", "对外贸易"], "a": [0, 1, 2, 3], "e": "正確：收入分配；就业；教育；社会保障。干擾項：对外贸易。", "id": "Q37-016", "l": 37, "ch" id": "Q37-037", "l": 37, "ch": 11, "pt": "A", "ps": 51, "pr": ["老師：…一名聲工程 這個給老師背過啊 那麼（37-010）", "老師：900多個啊 你只需要記住 我們貧困線（37-010）", "老師：具體的數字 它可能考選擇題 那你就（37-010）"]}, {"k": "單", "s": [11], "q": "「最大的民生工程」指的是：", "o": ["就業", "脫貧攻堅", "教育", "醫療衛生"], "a": 0, "e": "講師：「非常容易考到的選擇題考點，就業是最大的民生。」", "id": "Q37-038", "l": 37, "ch": 11, "pt": "A", "ps": 44, "pr": ["老師：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）"]}, {"k": "判", "s": [10], "q": "黨的十八大以來，我國歷史性地解決了相對貧困問題。", "a": false, "e": "錯。解決的是「絕對貧困」（講師：「叫做絕對」）。", "id": "Q37-039", "l": 37, "ch": 11, "pt": "A", "ps": 51, "pr": ["老師：…一名聲工程 這個給老師背過啊 那麼（37-010）", "老師：900多個啊 你只需要記住 我們貧困線（37-010）", "老師：具體的數字 它可能考選擇題 那你就（37-010）"]}, {"k": "判", "s": [10], "q": "脫貧摘帽是終點，標誌民生工作已經完成。", "a": false, "e": "錯。「脱贫摘帽不是终点，而是新生活、新奋斗的起点」。", "id": "Q37-040", "l": 37, "ch": 11, "pt": "A", "ps": 51, "pr": ["老師：…一名聲工程 這個給老師背過啊 那麼（37-010）", "老師：900多個啊 你只需要記住 我們貧困線（37-010）", "老師：具體的數字 它可能考選擇題 那你就（37-010）"]}, {"k": "單", "s": [10], "q": "十八大以來，現行標準下實現脫貧的農村貧困人口約為：", "o": ["近1億", "近5000萬", "近3億", "近8億"], "a": 0, "e": "講師：「注意這個數字，是1億。」", "id": "Q37-041", "l": 37, "ch": 11, "pt": "A", "ps": 54, "pr": ["老師：…一名聲工程 這個給老師背過啊 那麼（37-010）", "老師：900多個啊 你只需要記住 我們貧困線（37-010）", "老師：具體的數字 它可能考選擇題 那你就（37-010）"]}, {"k": "判", "s": [13], "q": "民生是解決發展問題的「總鑰匙」，發展是民生的「指南針」。", "a": false, "e": "錯，對調了。發展是解決民生問題的「總鑰匙」，民生是發展的「指南針」。", "id": "Q37-042", "l": 37, "ch": 11, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（37-013）"]}, {"k": "單", "s": [15], "q": "保障和改善民生的「重中之重」是：", "o": ["解決人民群眾最關心最直接最現實的利益問題", "堅持盡力而為、量力而行", "堅持人人盡責、人人享有", "正確把握民生和發展的關係"], "a": 0, "e": "講師：「是保障和改善民生的重中之重。」", "id": "Q37-043", "l": 37, "ch": 11, "pt": "A", "ps": 45, "pr": ["老師：是保障和改善 民生的重中之重 要及時的去了解（37-015）", "投影片黃字／黃筆標記（37-015）"]}, {"k": "單", "s": [14], "q": "「對重點群體和重點地區進行傾斜，特別是加大對革命老區、民族地區、邊疆地區、相對貧困地區基本公共服務的支持力度」屬於工作思路中的：", "o": ["突出重點", "堅守底線", "完善制度", "引導預期"], "a": 0, "e": "突出重點＝向重點群體、重點地區傾斜（講師舉西藏學生到內地讀書的例子）。", "id": "Q37-044", "l": 37, "ch": 11, "pt": "A", "ps": 20, "pr": ["老師：是保障和改善 民生的重中之重 要及時的去了解（37-015）", "投影片黃字／黃筆標記（37-015）"]}, {"k": "單", "s": [14], "q": "「織牢民生安全網的『網底』，對困難群眾實行應保盡保」屬於：", "o": ["堅守底線", "突出重點", "完善制度", "引導預期"], "a": 0, "e": "坚守底线＝以保障基本生活為主的社會公平保障體系。", "id": "Q37-045", "l": 37, "ch": 11, "pt": "A", "ps": 21, "pr": ["老師：是保障和改善 民生的重中之重 要及時的去了解（37-015）", "投影片黃字／黃筆標記（37-015）"]}, {"k": "填", "s": [11], "q": "促進收入分配更合理、更有序，推動形成（＿①＿）型分配格局。", "a": ["橄榄"], "e": "橄欖型＝中間大、兩頭小。", "id": "Q37-046", "l": 37, "ch": 11, "pt": "A", "ps": 23, "pr": ["老師：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）"]}, {"k": "多", "s": [12], "q": "關於住房，投影片的表述包括：", "o": ["坚持房子是用来住的、不是用来炒的定位", "加快建立多主体供给、多渠道保障、租购并举的住房制度", "推进城镇棚户区和城乡危房改造", "把住房作为最大的民生工程"], "a": [0, 1, 2], "e": "最大的民生工程是就業，不是住房。", "id": "Q37-047", "l": 37, "ch": 11, "pt": "B", "ps": 6, "pr": ["同頁有考點提示：…個非常容易考到的選擇題考點 就業是最大的名聲（37-011）", "投影片黃字／黃筆標記（37-011）"]}, {"k": "判", "s": [6], "q": "關注人本身的發展，是社會主義和資本主義的根本區別之一。", "a": true, "e": "對（slide 006）。", "id": "Q37-048", "l": 37, "ch": 11, "pt": "C", "ps": -13, "pr": ["老師：他比較抽象的一些概念不重要 他也不會考這些概念 我…（37-006）", "老師：不會考（37-006）"]}, {"k": "簡", "s": [5, 6, 7], "q": "簡答：為什麼說民生是人民幸福之基？（增進民生福祉的三個定位）", "sum": "一句白話：對黨、對社會主義生產、對現代化建設來說，增進民生福祉分別是本質要求、根本目的、應有之義。", "pts": ["增进民生福祉是坚持立党为公、执政为民的本质要求", "增进民生福祉是社会主义生产的根本目的", "增进民生福祉是全面建设社会主义现代化国家的应有之义"], "e": "第37堂知識點1 三個小標題（slide 005–007）。", "id": "Q37-049", "l": 37, "ch": 11, "pt": "A", "ps": 47, "pr": ["老師：…質要求 來把這個給老師記住了啊 增進民生福祉（37-005）", "老師：…這一句話呢 就作爲一個選擇題 好的（37-005）", "投影片黃字／黃筆標記（37-005）"]}, {"k": "論", "s": [13, 14, 15, 16], "q": "論述：如何堅持在發展中增進民生福祉？", "sum": "一句白話：先發展才有錢改善民生；做事要守底線、抓重點、建制度、管預期；先解決群眾最關心的利益問題；量力而行、人人參與人人分享。", "pts": ["正确把握民生和发展的关系，是保障和改善民生的重要前提（发展是解决民生问题的“总钥匙”，民生是发展的“指南针”）", "坚守底线、突出重点、完善制度、引导预期，是保障和改善民生的工作思路", "解决人民群众最关心最直接最现实的利益问题，是保障和改善民生的重中之重", "坚持尽力而为、量力而行，是保障和改善民生的重要方针", "坚持人人尽责、人人享有，是保障和改善民生的重要原则"], "e": "第37堂知識點3（slide 013–016）五個小標題。", "id": "Q37-050", "l": 37, "ch": 11, "pt": "A", "ps": 38, "pr": ["老師：是保障和改善 民生的重中之重 要及時的去了解（37-015）", "投影片黃字／黃筆標記（37-015）"]}, {"s": [3], "src": "", "card": "C38-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜收入分配是民生之源：\n收入分配是（＿①＿），是改善民生、实现发展成果由人民共享（＿②＿）", "a": ["民生之源", "最重要最直接的方式"], "e": "講師：「最直接、最重要的方式，選擇題。」白話：老百姓靠收入過日子，所以收入分配是民生的源頭，是改善民生、實現發展成果由人民共享最重要最直接的方式。", "id": "Q38-001", "l": 38, "ch": 11, "pt": "A", "ps": 22, "pr": ["老師：…最直接的 最重要的方式選擇題 偶爾問你說（38-003）", "投影片黃字／黃筆標記（38-003）"]}, {"s": [3], "src": "", "card": "C38-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜分配制度是促進共同富裕的基礎性制度：\n分配制度是促进（＿①＿）的（＿②＿）", "a": ["共同富裕", "基础性制度"], "e": "講師兩次說「選擇」：分配製度是促進共同富裕的基礎性制度。白話：要人人一齊富起來，基礎在分配怎麼分。", "id": "Q38-002", "l": 38, "ch": 11, "pt": "A", "ps": 15, "pr": ["老師：…最直接的 最重要的方式選擇題 偶爾問你說（38-003）", "老師：選擇（38-003）", "投影片黃字／黃筆標記（38-003）"]}, {"s": [4], "src": "", "card": "C38-03", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜三次分配協調配套：\n构建（＿①＿）、（＿②＿）、（＿③＿）协调配套的制度体系。发挥初次分配的（＿④＿），努力提高（＿⑤＿）在初次分配中的比重", "a": ["初次分配", "再分配", "第三次分配", "基础性作用", "劳动报酬"], "e": "白話：第一次分配是市場上按勞動、資本等給報酬（初次分配）；第二次是政府透過稅收、社保調節（再分配）；第三次是慈善捐贈等（第三次分配）。要構建三者協調配套的制度體系，發揮初次分配的基礎性作用，提高勞動報酬在初次分配中的比重，不斷壯大中等收入群體。", "id": "Q38-003", "l": 38, "ch": 11, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（38-004）"]}, {"s": [4], "src": "", "card": "C38-03", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "多", "q": "要構建協調配套的制度體系的「三次分配」是指：", "o": ["初次分配", "再分配", "第三次分配", "计划分配", "市场分配"], "a": [0, 1, 2], "e": "正確：初次分配；再分配；第三次分配。干擾項：计划分配；市场分配。", "id": "Q38-004", "l": 38, "ch": 11, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（38-004）"]}, {"s": [5], "src": "", "card": "C38-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜就業是最基本的民生：\n就业是（＿①＿）；“就业是（＿②＿）、（＿③＿）、（＿④＿），必须抓紧抓实抓好。”", "a": ["最基本的民生", "最大的民生工程", "民心工程", "根基工程"], "e": "講師：「最大的民生，這是選擇題考點；就業是最基本的民生。」就業是勞動者賴以生存和發展的基礎、共享經濟發展成果的基本條件。習近平指出：「就業是最大的民生工程、民心工程、根基工程。」", "id": "Q38-005", "l": 38, "ch": 11, "pt": "A", "ps": 27, "pr": ["老師：…最大的民生 這是選擇提考點 就業是最基本的民生（38-005）", "投影片黃字／黃筆標記（38-005）"]}, {"s": [5, 6], "src": "", "card": "C38-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜實施就業優先戰略：\n实施（＿①＿），把就业摆在经济社会发展（＿②＿）；把（＿③＿）提高到战略高度通盘考虑", "a": ["就业优先战略", "优先位置", "稳就业"], "e": "把就業擺在經濟社會發展優先位置；把穩就業提高到戰略高度通盤考慮；強化就業優先政策，促進高質量充分就業。講師舉例：重點群體包括高校畢業生、農民工等，應屆生有很多政策幫扶。", "id": "Q38-006", "l": 38, "ch": 11, "pt": "B", "ps": 7, "pr": ["同頁有考點提示：…最大的民生 這是選擇提考點 就業是最基本的民生（38-005）", "投影片黃字／黃筆標記（38-005）"]}, {"s": [6], "src": "", "card": "C38-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜就業的重點群體與兜底：\n扩大（＿①＿）就业渠道，稳定（＿②＿）等重点群体就业，加强（＿③＿）就业兜底帮扶", "a": ["高校毕业生", "农民工", "困难群体"], "e": "擴大高校畢業生就業渠道，穩定農民工等重點群體就業，加強困難群體就業兜底幫扶；消除影響平等就業的不合理限制和就業歧視，使人人都有通過勤奮勞動實現自身發展的機會。", "id": "Q38-007", "l": 38, "ch": 11, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（38-006）"]}, {"s": [7], "src": "", "card": "C38-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜職業技能培訓與新就業形態：\n健全（＿①＿），推动解决（＿②＿）。完善促进（＿③＿）的保障制度，支持和规范发展（＿④＿）", "a": ["终身职业技能培训制度", "结构性就业矛盾", "创业带动就业", "新就业形态"], "e": "健全終身職業技能培訓制度，推動解決結構性就業矛盾（講師：缺哪些證，就去考證）；完善促進創業帶動就業的保障制度，支持和規範發展新就業形態；加強靈活就業和新就業形態勞動者權益保障。", "id": "Q38-008", "l": 38, "ch": 11, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（38-007）"]}, {"s": [8], "src": "", "card": "C38-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會保障是保障和改善民生的基本制度保障：\n社会保障是保障和改善民生的（＿①＿），主要涉及（＿②＿）、（＿③＿）、（＿④＿）、（＿⑤＿）等方面", "a": ["基本制度保障", "社会保险", "社会救助", "社会福利", "社会优抚"], "e": "社會保障主要涉及社會保險、社會救助、社會福利、社會優撫等方面（定義本身講師說「不需要你去記」）。", "id": "Q38-009", "l": 38, "ch": 11, "pt": "C", "ps": -11, "pr": ["老師：措施的統成 這不需要你去記 你去記（38-008）"]}, {"s": [9], "src": "", "card": "C38-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會保障體系是新時代加強社會建設的重要着力點：\n健全和完善社会保障体系是新时代加强社会建设的（＿①＿）；坚持以增强（＿②＿）、适应（＿③＿）、保证（＿④＿）为重点", "a": ["重要着力点", "公平性", "流动性", "可持续性"], "e": "講師：「是新時代加強社會建設的重要着力點，選擇。」以增強公平性、適應流動性、保證可持續性為重點；要完善覆蓋全民、統籌城鄉、公平統一、安全規範、可持續的多層次社會保障體系。", "id": "Q38-010", "l": 38, "ch": 11, "pt": "B", "ps": 5, "pr": ["老師：…社會建設的重要着力點，選擇。（38-009）", "投影片黃字／黃筆標記（38-009）"]}, {"s": [9], "src": "", "card": "C38-10", "tag": ["選擇題考點", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜多層次社會保障體系的五個特點：\n完善（＿①＿）、（＿②＿）、（＿③＿）、（＿④＿）、（＿⑤＿）的多层次社会保障体系", "a": ["覆盖全民", "统筹城乡", "公平统一", "安全规范", "可持续 動解決（＿①＿）矛盾。", "a": ["结构性就业"], "e": "slide 007。", "id": "Q38-031", "l": 38, "ch": 11, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（38-007）"]}, {"k": "單", "s": [12], "q": "推進健康中國建設，要把保障人民健康放在：", "o": ["優先發展的戰略位置", "經濟建設的中心位置", "次要位置", "與經濟效益同等位置"], "a": 0, "e": "slide 012。", "id": "Q38-032", "l": 38, "ch": 11, "pt": "C", "ps": 0, "pr": []}, {"k": "填", "s": [8], "q": "社會保障主要涉及社會保險、社會（＿①＿）、社會福利、社會（＿②＿）等方面。", "a": ["救助", "优抚"], "e": "slide 008。", "id": "Q38-033", "l": 38, "ch": 11, "pt": "C", "ps": -8, "pr": ["老師：措施的統成 這不需要你去記 你去記（38-008）"]}, {"k": "簡", "s": [5, 6, 7], "q": "簡答：如何實施就業優先戰略？", "sum": "一句白話：把就業放在最優先，穩就業上升為戰略，照顧重點群體，搞技能培訓，鼓勵創業和新就業形態，保障勞動者權益。", "pts": ["把就业摆在经济社会发展优先位置，把稳就业提高到战略高度通盘考虑", "强化就业优先政策，健全就业促进机制，促进高质量充分就业", "扩大高校毕业生就业渠道，稳定农民工等重点群体就业，加强困难群体就业兜底帮扶", "健全终身职业技能培训制度，推动解决结构性就业矛盾", "完善促进创业带动就业的保障制度，支持和规范发展新就业形态", "完善劳动者权益保障制度"], "e": "第38堂知識點2（slide 005–007）。", "id": "Q38-034", "l": 38, "ch": 11, "pt": "B", "ps": 15, "pr": ["同頁有考點提示：…最大的民生 這是選擇提考點 就業是最基本的民生（38-005）", "投影片黃字／黃筆標記（38-005）"]}, {"k": "簡", "s": [3, 4], "q": "簡答：如何完善分配制度？", "sum": "一句白話：收入分配是民生之源，分配制度是共同富裕的基礎性制度；要深化改革，讓初次分配、再分配、第三次分配協調配套。", "pts": ["收入分配是民生之源，是改善民生、实现发展成果由人民共享最重要最直接的方式", "分配制度是促进共同富裕的基础性制度", "构建初次分配、再分配、第三次分配协调配套的制度体系", "发挥初次分配的基础性作用，努力提高劳动报酬在初次分配中的比重", "不断壮大中等收入群体"], "e": "第38堂知識點1（slide 003–004）。", "id": "Q38-035", "l": 38, "ch": 11, "pt": "A", "ps": 32, "pr": ["老師：…最直接的 最重要的方式選擇題 偶爾問你說（38-003）", "投影片黃字／黃筆標記（38-003）"]}, {"s": [3], "src": "", "card": "C39-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜加強和創新社會治理的含義：\n在（＿①＿）下，以（＿②＿）为主导，以（＿③＿）为基础，以（＿④＿）为核心", "a": ["党的领导", "政府", "社会多元主体参与", "维护人民群众根本利益"], "e": "白話：社會治理由黨領導、政府帶頭、社會各方一起參與，核心是維護人民群眾根本利益，用合作、對話、協商、溝通等方式依法引導和規範社會事務。", "id": "Q39-001", "l": 39, "ch": 11, "pt": "C", "ps": 0, "pr": []}, {"s": [4, 5], "src": "", "card": "C39-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜新時代加強和創新社會治理的要求（四個治理）：\n坚持（＿①＿）、（＿②＿）、（＿③＿）、（＿④＿），探索一条符合中国社会发展实际、更可持续的中国特色社会主义社会治理之路", "a": ["系统治理", "依法治理", "综合治理", "源头治理"], "e": "白話：系統治理（放進全  "ch": 11, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（39-007）"]}, {"s": [7, 8], "src": "", "card": "C39-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「共治」是社會治理的目标。", "a": false, "e": "錯。「共治」應對應「关键」，「目标」對應的是「共享」。", "id": "Q39-028", "l": 39, "ch": 11, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（39-007）"]}, {"s": [7, 8], "src": "", "card": "C39-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在社會治理中，「共享」是：", "o": ["目标", "基础", "关键"], "a": 0, "e": "「共享」→「目标」。記法：「建＝基礎，治＝關鍵，享＝目標」（建房先打地基，治理抓關鍵，成果是目標）。", "id": "Q39-029", "l": 39, "ch": 11, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（39-007）"]}, {"s": [7, 8], "src": "", "card": "C39-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「共享」是社會治理的目标。", "a": true, "e": "對。「共享」→「目标」。", "id": "Q39-030", "l": 39, "ch": 11, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（39-007）"]}, {"s": [8], "src": "", "card": "C39-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會治理共同體：\n建设（＿①＿）、（＿②＿）、（＿③＿）的社会治理共同体，确保社会治理过程（＿④＿）、成效（＿⑤＿）、成果（＿⑥＿）", "a": ["人人有责", "人人尽责", "人人享有", "人民参与", "人民评判", "人民共享"], "e": "建設人人有責、人人盡責、人人享有的社會治理共同體，確保社會治理過程人民參與、成效人民評判、成果人民共享。", "id": "Q39-031", "l": 39, "ch": 11, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（39-008）"]}, {"s": [10], "src": "", "card": "C39-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜創新社會治理方式：兩對關係：\n正确处理好（＿①＿）、（＿②＿）的关系，确保社会既充满生机活力又保持安定有序", "a": ["维稳与维权", "活力与秩序"], "e": "要講究辯證法，正確處理好維穩與維權、活力與秩序的關係，確保社會既充滿生機活力又保持安定有序；強化互聯網思維。", "id": "Q39-032", "l": 39, "ch": 11, "pt": "C", "ps": 0, "pr": []}, {"s": [11], "src": "", "card": "C39-08", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜基層治理是國家治理的基石：\n（＿①＿）是国家治理的（＿②＿）；城乡社区是社会治理（＿③＿），是党和政府联系、服务居民群众的（＿④＿）", "a": ["基层治理", "基石", "最基本的单元", "“最后一公里”"], "e": "講師：「注意啊，基層治理是國家治理的基石」「最後一公里，選擇題」「這些都是選擇題考點」。基層強則國家強，基層安則天下安；城鄉社區是社會治理最基本的單元，是黨和政府聯繫、服務居民群眾的「最後一公里」；社會治理的重心必須向基層下移。", "id": "Q39-033", "l": 39, "ch": 11, "pt": "A", "ps": 28, "pr": ["老師：…鄉社區 這些都是選擇題考點 社會治理的重心（39-011）", "老師：最後一公里 選擇題 那麼我們（39-011）", "投影片黃字／黃筆標記（39-011）"]}, {"s": [12], "src": "", "card": "C39-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜政府治理和社會調節、居民自治良性互動：\n健全党组织领导的城乡基层治理体系，实现（＿①＿）和（＿②＿）、（＿③＿）良性互动", "a": ["政府治理", "社会调节", "居民自治"], "e": "講師：「政府治理、社會調節和居民自治的良性互動，記一下。」健全黨組織領導的城鄉基層治理體系；充分發揮基層黨組織領導核心作用、基層政府主導作用、基層群眾性自治組織基礎作用。", "id": "Q39-034", "l": 39, "ch": 11, "pt": "B", "ps": 6, "pr": ["老師：…節和居民自治的良性互動記一下 那麼第三（39-012）"]}, {"s": [13], "src": "", "card": "C39-10", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「楓橋經驗」「浦江經驗」與市域社會治理：\n坚持和发展新时代（＿①＿）、（＿②＿）；（＿③＿）是将风险隐患解决在基层、化解在萌芽状态的最直接、最有效力的治理层级", "a": ["“枫桥经验”", "“浦江经验”", "市域"], "e": "堅持和發展新時代「楓橋經驗」「浦江經驗」，完善正確處理新形勢下人民內部矛盾機制。市域是將風險隱患解決在基層、化解在萌芽狀態的最直接、最有效力的治理層級，處於推進基層治理現代化的前線位置。", "id": "Q39-035", "l": 39, "ch": 11, "pt": "C", "ps": 0, "pr": []}, {"k": "單", "s": [11], "q": "國家治理的基石是：", "o": ["基層治理", "市域治理", "依法治理", "系統治理"], "a": 0, "e": "講師：「注意啊，基層治理是國家治理的基石。」", "id": "Q39-036", "l": 39, "ch": 11, "pt": "A", "ps": 36, "pr": ["老師：最後一公里 選擇題 那麼我們（39-011）", "老師：…鄉社區 這些都是選擇題考點 社會治理的重心（39-011）", "老師：注意啊，基層治理是國家治理的基石。（39-011）"]}, {"k": "單", "s": [11], "q": "黨和政府聯繫、服務居民群眾的「最後一公里」是：", "o": ["城鄉社區", "市域", "基層政府", "網格"], "a": 0, "e": "講師：「最後一公里，選擇題。」", "id": "Q39-037", "l": 39, "ch": 11, "pt": "A", "ps": 52, "pr": ["老師：…鄉社區 這些都是選擇題考點 社會治理的重心（39-011）", "老師：最後一公里 選擇題 那麼我們（39-011）", "投影片黃字／黃筆標記（39-011）"]}, {"k": "單", "s": [8], "q": "在共建共治共享中，社會治理的「目標」是：", "o": ["共享", "共建", "共治", "共商"], "a": 0, "e": "共建＝基礎；共治＝關鍵；共享＝目標。", "id": "Q39-038", "l": 39, "ch": 11, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（39-008）"]}, {"k": "判", "s": [7], "q": "共建是社會治理的關鍵，共治是社會治理的基礎。", "a": false, "e": "錯，對調了。共建＝基礎，共治＝關鍵。", "id": "Q39-039", "l": 39, "ch": 11, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（39-006）"]}, {"k": "單", "s": [7], "q": "完善社會治理體系的「先導」是：", "o": ["理念", "制度", "方式方法", "科技"], "a": 0, "e": "理念是先導（共建共治共享）；制度是保障；方式方法是重要內容。", "id": "Q39-040", "l": 39, "ch": 11, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（39-006）"]}, {"k": "單", "s": [5], "q": "「標本兼治、重在治本，推動社會治理向前端基層延伸」體現的是：", "o": ["源頭治理", "系統治理", "依法治理", "綜合治理"], "a": 0, "e": "slide 005 源頭治理。", "id": "Q39-041", "l": 39, "ch": 11, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（39-004）"]}, {"k": "單", "s": [4], "q": "「以法治精神引領社會治理，用法治思維謀劃社會治理，用法治方式破解社會治理難題」體現的是：", "o": ["依法治理", "系統治理", "綜合治理", "源頭治理"], "a": 0, "e": "slide 004 依法治理。", "id": "Q39-042", "l": 39, "ch": 11, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（39-004）"]}, {"k": "判", "s": [6], "q": "社會治理體系是進行社會治理的基礎，也是提高社會治理效能的保障。", "a": true, "e": "對（slide 006）。", "id": "Q39-043", "l": 39, "ch": 11, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（39-006）"]}, {"k": "填", "s": [10], "q": "要正確處理好（＿①＿）與維權、活力與（＿②＿）的關係。", "a": ["维稳", "秩序"], "e": "slide 010。", "id": "Q39-044", "l": 39, "ch": 11, "pt": "C", "ps": 0, "pr": []}, {"k": "單", "s": [13], "q": "將風險隱患解決在基層、化解在萌芽狀態的最直接、最有效力的治理層級是：", "o": ["市域", "城鄉社區", "省域", "鄉鎮"], "a": 0, "e": "slide 013（4）。", "id": "Q39-045", "l": 39, "ch": 11, "pt": "C", "ps": 0, "pr": []}, {"k": "填", "s": [12], "q": "健全黨組織領導的城鄉基層治理體系，實現政府治理和（＿①＿）、（＿②＿）良性互動。", "a": ["社会调节", "居民自治"], "e": "講師：「記一下。」", "id": "Q39-046", "l": 39, "ch": 11, "pt": "B", "ps": 9, "pr": ["老師：…節和居民自治的良性互動記一下 那麼第三（39-012）", "老師：記一下。（39-012）"]}, {"k": "簡", "s": [4, 5], "q": "簡答：新時代加強和創新社會治理有哪些要求？", "sum": "一句白話：從全局看（系統）、按法律辦（依法）、各方合力（綜合）、從根子解決（源頭）。", "pts": ["坚持系统治理——把社会治理置于经济社会发展全局中来思考", "坚持依法治理——以法治精神引领社会治理，把社会治理纳入法治轨道", "坚持综合治理——形成社会治理整体合力", "坚持源头治理——标本兼治、重在治本"], "e": "第39堂知識點2（slide 004–005）。", "id": "Q39-047", "l": 39, "ch": 11, "pt": "B", "ps": 8, "pr": ["投影片黃字／黃筆標記（39-004）"]}, {"k": "論", "s": [6, 7, 8, 9, 10], "q": "論述：如何完善社會治理體系？", "sum": "一句白話：先建好治理體系（基礎），以共建共治共享理念帶路（先導），用制度保障，再創新方法。", "pts": ["社会治理体系是进行社会治理的基础，也是提高社会治理效能的保障（党委领导、政府负责、民主协商、社会协同、公众参与、法治保障、科技支撑）", "理念是完善社会治理体系的先导，必须坚持共建共治共享的社会治理理念（共建是基础、共治是关键、共享是目标）", "制度是完善社会治理体系的保障，必须健全社会治理制度，提升社会治理效能", "方式方法是完善社会治理体系的重要内容，必须不断创新社会治理方式、途径和手段"], "e": "第39堂知識點3 四個小標題（slide 006–010）。", "id": "Q39-048", "l": 39, "ch": 11, "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（39-006）"]}, {"s": [6], "src": "", "card": "C40-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜自然是生命之母，人與自然是生命共同體：\n自然是（＿①＿），人与自然是（＿②＿）；保护自然就是（＿③＿），建设生态文明就是（＿④＿）", "a": ["生命之母", "生命共同体", "保护人类", "造福人类"], "e": "白話：人來自自然、依賴自然；友好保護自然，自然回報慷慨；粗暴掠奪自然，自然懲罰無情。保護自然就是保護人類，建設生態文明就是造福人類。", "id": "Q40-001", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-006）"]}, {"s": [7], "src": "", "card": "C40-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜生態興則文明興：生態影響文明興衰：\n生态环境变化直接影响文明的（＿①＿）；（＿②＿）是人类文明发展的（＿③＿）", "a": ["兴衰演替", "生态文明", "历史趋势"], "e": "生態環境變化直接影響文明的興衰演替；生態文明是人類文明發展的歷史趨勢。人類經歷了原始文明、農業文明、工業文明。", "id": "Q40-002", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-007）"]}, {"s": [8], "src": "", "card": "C40-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中華文明孕育豐富的生態文化：\n绵延（＿①＿）的中华文明孕育着丰富的（＿②＿）", "a": ["5000多年", "生态文化"], "e": "中華民族向來尊重自然、熱愛自然，綿延5000多年的中華文明孕育着豐富的生態文化。", "id": "Q40-003", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-008）"]}, {"s": [9], "src": "", "card": "C40-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜尊重自然、順應自然、保護自然：\n大自然是人类赖以生存发展的（＿①＿），（＿②＿）、（＿③＿）、（＿④＿）是全面建设社会主义现代化国家的（＿⑤＿）；坚定不移走（＿⑥＿）、（＿⑦＿）、（＿⑧＿）的文明发展道路", "a": ["基本条件", "尊重自然", "顺应自然", "保护自然", "内在要求", "生产发展", "生活富裕", "生态良好"], "e": "講師：「請注意」。大自然是人類賴以生存發展的基本條件，尊重自然、順應自然、保護自然是全面建設社會主義現代化國家的內在要求。要堅定不移走生產發展、生活富裕、生態良好的文明發展道路。", "id": "Q40-004", "l": 40, "ch": 12, "pt": "B", "ps": 5, "pr": ["老師：請注意（40-009）", "投影片黃字／黃筆標記（40-009）"]}, {"s": [10], "src": "", "card": "C40-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜綠水青山就是金山銀山：\n生态环境问题归根到底是（＿①＿）问题。绿水青山就是金山银山，阐明了（＿②＿）之间的关系，揭示了保护生态环境就是（＿③＿）、改善生态环境就是（＿④＿）的道理", "a": ["经济发展方式和生活方式", "经济发展与生态环境保护", "保护生产力", "发展生产力"], "e": "講師：「這裏需要注意一下，可能考一個選擇題：闡明揭示經濟發展與生態環境保護之間關係的是什麼？就是綠水青山就是金山銀山。」生態環境問題歸根到底是經濟發展方式和生活方式問題。保護生態環境就是保護生產力，改善生態環境就是發展生產力。", "id": "Q40-005", "l": 40, "ch": 12, "pt": "A", "ps": 17, "pr": ["老師：…要注意一下 可能考一個選擇題 問你說什麼（40-010）", "投影片黃字／黃筆標記（40-010）"]}, {"s": [11], "src": "", "card": "C40-06", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜生態保護和經濟發展是辯證統一、相輔相成的關係：\n二者是（＿①＿）、（＿②＿）的关系……坚持（＿③＿）、（＿④＿）", "a": ["辩证统一", "相辅相成", "在发展中保护", "在保护中发展"], "e": "發展經濟不能對資源和生態環境竭澤而漁，生態保護也不是捨棄經濟發展而緣木求魚，要堅持在發展中保護、在保護中發展；不能把兩者割裂開來，更不能對立起來。", "id": "Q40-006", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-011）"]}, {"s": [12, 13], "src": "", "card": "C40-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜綠水青山既是自然財富、生態財富，又是社會財富、經濟財富：\n绿水青山既是（＿①＿）、（＿②＿），又是（＿③＿）、（＿④＿）；处理好绿水青山和金山银山的关系，关键在（＿⑤＿），关键在（＿⑥＿）", "a": ["自然财富", "生态财富", "社会财富", "经济财富", "人", "思路"], "e": "綠水青山可帶來金山銀山，但金山銀山卻買不到綠水青山。處理好綠水青山和金山銀山的關係，關鍵在人，關鍵在思路；要處理好高質量發展和高水平保護的關係。", "id": "Q40-007", "l": 40, "ch": 12, "pt": "C", "ps": 0, "pr": []}, {"s": [14], "src": "", "card": "C40-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜生態文明建設是重大經濟問題、政治問題、社會問題：\n生态文明建设是重大（＿①＿），也是关系党的使命宗旨的重大（＿②＿）、关系民生福祉的重大（＿③＿）", "a": ["经济问题", "政治问题", "社会问题"], "e": "生態文明建設是重大經濟問題，也是關係黨的使命宗旨的重大政治問題、關係民生福祉的重大社會問題。十八大以來，黨把生態文明建設擺在全局工作的突出位置，從思想、法律、體制、組織、作風上全面發力。", "id": "Q40-008", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-014）"]}, {"s": [14, 15], "src": "", "card": "C40-09", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜生態文明建設的四個「重大轉變」：\n实现由（＿①＿）到（＿②＿）的重大转变；由（＿③＿）到（＿④＿）的重大转变；由全球环境治理（＿⑤＿）到（＿⑥＿）的重大转变；由（＿⑦＿）到（＿⑧＿）的重大转变", "a": ["重点整治", "系统治理", "被动应对", "主动作为", "参与者", "引领者", "实践探索", "科学理论指导"], "e": "①由重點整治到系統治理；②由被動應對到主動作為；③由全球環境治理參與者到引領者；④由實踐探索到科學理論指導（形成習近平生態文明思想）。", "id": "Q40-009", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-014）"]}, {"s": [14, 15], "src": "", "card": "C40-09", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "單", "q": "新時代生態文明建設實現了由「重点整治」到什麼的重大轉變？", "o": ["系统治理", "主动作为", "科学理论指导", "引领者"], "a": 0, "e": "「重点整治」→「系统治理」。記法：「整治→系統；被動→主動；參與→引領；實踐→理論」。", "id": "Q40-010", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-014）"]}, {"s": [14, 15], "src": "", "card": "C40-09", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "判", "q": "新時代生態文明建設實現了由「重点整治」到「系统治理」的重大轉變。", "a": true, "e": "對。「重点整治」→「系统治理」。", "id": "Q40-011", "l": 40, "ch": 12, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（40-014）"]}, {"s":
