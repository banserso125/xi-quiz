, "a": 0, "e": "slide 008（1）。", "id": "Q51-035", "l": 51, "ch": 15, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（51-009）"]}, {"k": "填", "s": [3], "q": "國家統一永遠是中國（＿①＿）。", "a": ["核心利益的核心"], "e": "slide 003（1）。", "id": "Q51-036", "l": 51, "ch": 15, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（51-003）"]}, {"k": "判", "s": [3], "q": "台灣問題因民族弱亂而產生，必將隨着民族復興而解決。", "a": true, "e": "slide 003（1）。", "id": "Q51-037", "l": 51, "ch": 15, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（51-003）"]}, {"k": "多", "s": [8], "q": "把握兩岸關係主導權和主動權，必須：", "o": ["堅持一個中國原則和「九二共識」", "堅決反對「台獨」分裂行徑", "堅決反對外部勢力干涉", "承諾放棄使用武力"], "a": [0, 1, 2], "e": "slide 008；決不承諾放棄使用武力。", "id": "Q51-038", "l": 51, "ch": 15, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（51-009）"]}, {"k": "填", "s": [4], "q": "習近平指出：「實現祖國完全統一是全體中華兒女的共同願望，是民族復興的（＿①＿）。」", "a": ["题中之义"], "e": "slide 004 注意。", "id": "Q51-039", "l": 51, "ch": 15, "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-004）"]}, {"k": "簡", "s": [6], "q": "簡答：全面貫徹新時代黨解決台灣問題的總體方略，必須堅持哪些方面？（至少答出各項「這是統一的……」）", "sum": "一句白話：十個「堅持」，各對應統一的保證、方位、思路、方針、基礎、途徑、動力、要求、條件、支撐。", "pts": ["坚持党中央对对台工作的集中统一领导，这是统一的根本保证", "坚持在中华民族伟大复兴进程中推进祖国统一，这是统一的历史方位", "坚持在祖国大陆发展进步基础上解决台湾问题，这是统一的战略思路", "坚持“和平统一、一国两制”基本方针，这是统一的大政方针", "坚持一个中国原则和“九二共识”，这是统一的政治基础", "坚持推动两岸关系和平发展、融合发展，这是统一的实践途径", "坚持团结台湾同胞、争取台湾民心，这是统一的根本动力", "坚持粉碎“台独”分裂图谋，这是统一的必然要求", "坚持反对外部势力干涉，这是统一的外部条件", "坚持决不承诺放弃使用武力，这是统一的战略支撑"], "e": "第51堂 slide 006；講師：「很有可能是今年的一個重點的考點」。", "id": "Q51-040", "l": 51, "ch": 15, "pt": "A", "ps": 67, "pr": ["老師：…我們這十個內容呢 必須要去把它給記住了啊 很有可能是…（51-006）", "老師：…可能是今年的一個重點的考點（51-006）", "老師：這是統一的根本保證 選擇題 第二（51-006）"]}, {"k": "論", "s": [3, 4, 6, 8, 9], "q": "論述：結合所學，論述為什麼實現祖國完全統一是中華民族偉大復興的必然要求，以及如何推進祖國完全統一。", "sum": "先講「為什麼」（大勢所趨、核心利益的核心、台灣前途在統一、統一是正道），再講「怎麼做」（總體方略＋把握主導權主動權）。", "pts": ["民族复兴、国家统一是大势所趋、大义所在、民心所向；国家统一永远是中国核心利益的核心", "台湾前途在于国家统一，台湾同胞福祉系于民族复兴", "统一是历史大势，是正道；“台独”是历史逆流，是绝路", "全面贯彻新时代党解决台湾问题的总体方略", "“和平统一、一国两制”方针是实现两岸统一的最佳方式", "促进两岸经济文化交流合作，深化两岸各领域融合发展", "坚持以最大诚意、尽最大努力争取和平统一的前景，但决不承诺放弃使用武力"], "e": "第51堂整堂。", "id": "Q51-041", "l": 51, "ch": 15, "pt": "A", "ps": 57, "pr": ["老師：…我們這十個內容呢 必須要去把它給記住了啊 很有可能是…（51-006）", "老師：…落的背過 但是你至少做選擇題（51-006）", "老師：…撐分別都是什麼 我們都需要去記住啊 記憶住（51-006）"]}, {"s": [2], "src": "", "card": "C52-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜第十六章是過往考試重點：\n第十六章 （＿①＿）和推动构建（＿②＿）", "a": ["中国特色大国外交", "人类命运共同体"], "e": "講師：「這一章的內容在過往的考試中處於比較高的重點，所以要求大家必須要重點學習第16章。」本章重難點包括：百年未有之大變局、中國特色大國外交、國際影響力感召力塑造力顯著提升、和平發展道路、新型國際關係、維護國家主權安全發展利益、外交為民、人類命運共同體、全球治理、「一帶一路」。", "id": "Q52-001", "l": 52, "ch": 16, "pt": "A", "ps": 17, "pr": ["老師：…試中呢 它處於我們大體考評比較高的重點（52-002）"]}, {"s": [7], "src": "", "card": "C52-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜百年未有之大變局的兩方面：\n世界（＿①＿）、经济（＿②＿）、社会（＿③＿）、文化（＿④＿）深入发展，（＿⑤＿）的历史潮流不可阻挡", "a": ["多极化", "全球化", "信息化", "多样化", "和平、发展、合作、共赢"], "e": "一方面，世界多極化、經濟全球化、社會信息化、文化多樣化深入發展，和平、發展、合作、共贏的歷史潮流不可阻擋；另一方面，世界面臨的不穩定性不確定性突出，全球性問題加劇。世界又一次站在歷史的十字路口。", "id": "Q52-002", "l": 52, "ch": 16, "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [8, 9, 10], "src": "", "card": "C52-03", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜百年未有之大變局的表現（標題要背）：\n（＿①＿）深刻变化；新一轮（＿②＿）深入发展；（＿③＿）深度调整", "a": ["国际力量对比", "科技革命和产业变革", "国际体系和国际秩序"], "e": "講師：「這個首先你標題你得背過」「這是要求大家背過的」。（1）國際力量對比深刻變化——新興市場國家和發展中國家群體性崛起，「東升西降」「中治西亂」更加鮮明，這是近代以來國際力量對比中最具革命性的變化；（2）新一輪科技革命和產業變革深入發展；（3）國際體系和國際秩序深度調整——國際關係民主化不可阻擋。", "id": "Q52-003", "l": 52, "ch": 16, "pt": "A", "ps": 62, "pr": ["老師：…家 這是一道實證題之前考過 大家記一下順便記一下哈（52-009）", "老師：…個體現 這是要要求大家背過的 等一下我會帶着大家再梳…（52-010）", "老師：…因爲這一章 我們的一個要背的內容還挺多的 所以我會帶…（52-010）"]}, {"s": [8, 9, 10], "src": "", "card": "C52-03", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜百年未有之大變局的表現（標題要背）", "model": "国际力量对比深刻变化；新一轮科技革命和产业变革深入发展；国际体系和国际秩序深度调整", "pts": ["国际力量对比深刻变化", "新一轮科技革命和产业变革深入发展", "国际体系和国际秩序深度调整"], "e": "記法：「力量對比・科技產業・體系秩序」。", "id": "Q52-004", "l": 52, "ch": 16, "pt": "A", "ps": 62, "pr": ["老師：…家 這是一道實證題之前考過 大家記一下順便記一下哈（52-009）", "老師：…個體現 這是要要求大家背過的 等一下我會帶着大家再梳…（52-010）", "老師：…因爲這一章 我們的一個要背的內容還挺多的 所以我會帶…（52-010）"]}, {"s": [8, 9, 10], "src 師：…家 這是一道實證題之前考過 大家記一下順便記一下哈（52-009）", "老師：…個體現 這是要要求大家背過的 等一下我會帶着大家再梳…（52-010）", "老師：…因爲這一章 我們的一個要背的內容還挺多的 所以我會帶…（52-010）"]}, {"k": "簡", "s": [14, 15, 16, 17], "q": "簡答：為什麼說中國必須有自己特色的大國外交？請從其基礎、主線、原則要求作答。", "sum": "一句白話：建立在三觀上，主線是復興＋進步，原則是黨領導＋以基礎/原則/理念/底線來做外交。", "pts": ["中国特色大国外交建立在正确的历史观、大局观、角色观基础之上", "牢牢把握服务民族复兴、促进人类进步这条主线，以推动构建人类命运共同体为总目标", "坚持外交大权在党中央", "坚持以相互尊重、合作共赢为基础走和平发展道路", "以共商共建共享为原则推动“一带一路”建设", "坚持以公平正义为理念引领全球治理体系改革", "坚持以国家核心利益为底线维护国家主权、安全、发展利益"], "e": "第52堂知識點2。", "id": "Q52-046", "l": 52, "ch": 16, "pt": "A", "ps": 47, "pr": ["老師：從最開始 這裏背到這裏 就是第五個點（52-017）", "老師：…以國家核心利益爲底線 選擇題啊 堅持以國家核心利益爲…（52-017）", "老師：要背到這裏（52-017）"]}, {"s": [4], "src": "", "card": "C53-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜和平發展道路是新時代中國外交的基本原則：\n坚持走和平发展道路，是我们党根据（＿①＿）和我国（＿②＿）作出的（＿③＿），是新时代中国外交的（＿④＿）", "a": ["时代发展潮流", "根本利益", "战略抉择", "基本原则"], "e": "講師：「來先把這個選擇題的考點給我拿下」「這一句記住」。堅持走和平發展道路，是我們黨根據時代發展潮流和我國根本利益作出的戰略抉擇，是新時代中國外交的基本原則。習近平指出：中國走和平發展道路，不是權宜之計，更不是外交辭令，而是思想自信和實踐自覺的有機統一。", "id": "Q53-001", "l": 53, "ch": 16, "pt": "A", "ps": 29, "pr": ["老師：…來先把這個選擇提高的考點給我拿下 堅持走和平發展道…（53-004）", "投影片黃字／黃筆標記（53-004）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [4], "src": "", "card": "C53-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜不是權宜之計，更不是外交辭令：\n中国走和平发展道路，不是（＿①＿），更不是（＿②＿），而是从历史、现实、未来的客观判断中得出的结论，是（＿③＿）和（＿④＿）的有机统一", "a": ["权宜之计", "外交辞令", "思想自信", "实践自觉"], "e": "習近平指出：「中國走和平發展道路，不是權宜之計，更不是外交辭令，而是從歷史、現實、未來的客觀判斷中得出的結論，是思想自信和實踐自覺的有機統一。」", "id": "Q53-002", "l": 53, "ch": 16, "pt": "B", "ps": 7, "pr": ["同頁有考點提示：…來先把這個選擇提高的考點給我拿下 堅持走和平發展道…（53-004）", "投影片黃字／黃筆標記（53-004）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [5, 6, 7], "src": "", "card": "C53-03", "tag": ["簡答題考點"], "auto": 1, "k": "填", "q": "填空｜為什麼要走和平發展道路：\n走和平发展道路是由中国共产党（＿①＿）和我国（＿②＿）决定的；走和平发展道路是基于中国（＿③＿）作出的必然选择；走和平发展道路符合（＿④＿）、顺应（＿⑤＿）", "a": ["性质宗旨", "社会主义制度", "历史文化传统", "历史潮流", "世界大势"], "e": "（1）走和平發展道路是由中國共產黨性質宗旨和我國社會主義制度決定的——我們決不以損害別國利益來實現自己的發展；（2）走和平發展道路是基於中國歷史文化傳統作出的必然選擇——中華文明具有突出的和平性，「國雖大，好戰必亡」；（3）走和平發展道路符合歷史潮流、順應世界大勢。", "id": "Q53-003", "l": 53, "ch": 16, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（53-006）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [6], "src": "", "card": "C53-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中華文明具有突出的和平性：\n中华文明具有突出的（＿①＿）；“国虽大，（＿②＿）”", "a": ["和平性", "好战必亡"], "e": "中華民族是愛好和平的民族，中華文明具有突出的和平性。中國自古就有「國雖大，好戰必亡」的箴言，「以和為貴」「和而不同」「睦鄰友邦」「天下大同」等理念世代相傳。", "id": "Q53-004", "l": 53, "ch": 16, "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（53-006）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [8], "src": "", "card": "C53-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜堅定奉行獨立自主的和平外交政策：\n中国始终根据事情本身的（＿①＿）决定自己的立场和政策；坚持国家不分大小、强弱、贫富（＿②＿）；中国永远不（＿③＿）、永远不搞（＿④＿）", "a": ["是非曲直", "一律平等", "称霸", "扩张"], "e": "中國始終根據事情本身的是非曲直決定自己的立場和政策；堅持國家不分大小、強弱、貧富一律平等；反對一切形式的霸權主義和強權政治；中國奉行防禦性的國防政策，無論發展到什麼程度，中國永遠不稱霸、永遠不搞擴張。", "id": "Q53-005", "l": 53, "ch": 16, "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [9], "src": "", "card": "C53-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜以相互尊重、合作共贏為基礎同世界各國交往：\n中国坚持以（＿①＿）为基础同世界各国交往；既要通过维护世界和平（＿②＿），又要通过自身发展（＿③＿）", "a": ["相互尊重、合作共赢", "发展自己", "维护世界和平"], "e": "講師：「相互尊重合作共贏為基礎同世界各國交往，選擇題考點」。走和平發展道路，既要通過維護世界和平發展自己，又要通過自身發展維護世界和平。", "id": "Q53-006", "l": 53, "ch": 16, "pt": "A", "ps": 28, "pr": ["老師：…同世界各國交往選擇提考點 相互尊重合作共贏爲基礎（53-009）", "投影片黃字／黃筆標記（53-009）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [10], "src": "", "card": "C53-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜新型國際關係：對話而不對抗，結伴而不結盟：\n推动构建新型国际关系，就是要秉持（＿①＿）原则，走出一条（＿②＿）、（＿③＿）的国与国交往新路", "a": ["相互尊重、公平正义、合作共赢", "对话而不对抗", "结伴而不结盟"], "e": "講師：「我們中國是不結盟的，所以你在任何的考試中你看到選擇題講到外交（結盟），全部都錯」「記住是對話而不對抗，結伴而不結盟」。推動構建新型國際關係，就是要秉持相互尊重、公平正義、合作共贏原則。", "id": "Q53-007", "l": 53, "ch": 16, "pt": "A", "ps": 37, "pr": ["老師：我們的外交部局 一定要把這個記住 一個多選題考點（53-010）", "老師：…在任何的考試中 你看到選擇題（53-010）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [10], "src": "", "card": "C53-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜全方位、多層次、立體化的外交佈局：\n不断完善我国（＿①＿）、（＿②＿）、（＿③＿）的外交布局", "a": ["全方位", "多层次", "立体化"], "e": "講師：「我們的外交佈局一定要把這個記住，一個多選題考點：全方位多層次立體化」。要推進大國協調合作，打造周邊命運共同體，加強同發展中國家團結合作，不斷完善我國全方位、多層次、立體化的外交佈局，構建新型政黨關係。", "id": "Q53-008", "l": 53, "ch": 16, "pt": "A", "ps": 48, "pr": ["老師：我們的外交部局 一定要把這個記住 一個多選題考點（53-010）", "老師：…在任何的考試中 你看到選擇題（53-010）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [11], "src": "", "card": "C53-09", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜中俄新時代全面戰略協作夥伴關係：\n中俄新时代（＿①＿）成熟、稳定、自主、坚韧；中美关系是当今世界（＿②＿）之一", "a": ["全面战略协作伙伴关系", "最重要的双边关系"], "e": "講師：「你們一定要記住，中俄之間的合作叫做全面戰略協作夥伴關係，選擇題」「他會把這個偷偷改成中美……你要注意，不對」。構建和平共處、總體穩定、均衡發展的大國關係格局；中美關係是當今世界最重要的雙邊關係之一。", "id": "Q53-009", "l": 53, "ch": 16, "pt": "A", "ps": 36, "pr": ["老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…全面戰略協作夥伴關係 選擇題 全面戰略協作夥伴關係（53-011）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [11], "src": "", "card": "C53-09", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "教材對「中俄关系」的表述是：", "o": ["新时代全面战略协作伙伴关系", "当今世界最重要的双边关系之一"], "a": 0, "e": "「中俄关系」→「新时代全面战略协作伙伴关系」。記法：「中俄＝全面戰略協作夥伴；中美＝最重要的雙邊關係之一」。", "id": "Q53-010", "l": 53, "ch": 16, "pt": "A", "ps": 36, "pr": ["老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…全面戰略協作夥伴關係 選擇題 全面戰略協作夥伴關係（53-011）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [11], "src": "", "card": "C53-09", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "中俄关系：新时代全面战略协作伙伴关系。", "a": true, "e": "對。「中俄关系」→「新时代全面战略协作伙伴关系」。", "id": "Q53-011", "l": 53, "ch": 16, "pt": "A", "ps": 36, "pr": ["老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…全面戰略協作夥伴關係 選擇題 全面戰略協作夥伴關係（53-011）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [11], "src": "", "card": "C53-09", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "教材對「中美关系」的表述是：", "o": ["当今世界最重要的双边关系之一", "新时代全面战略协作伙伴关系"], "a": 0, "e": "「中美关系」→「当今世界最重要的双边关系之一」。記法：「中俄＝全面戰略協作夥伴；中美＝最重要的雙邊關係之一」。", "id": "Q53-012", "l": 53, "ch": 16, "pt": "A", "ps": 36, "pr": ["老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…全面戰略協作夥伴關係 選擇題 全面戰略協作夥伴關係（53-011）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [11], "src": "", "card": "C53-09", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "中美关系：新时代全面战略协作伙伴关系。", "a": false, "e": "錯。「中美关系」應對應「当今世界最重要的双边关系之一」，「新时代全面战略协作伙伴关系」對應的是「中俄关系」。", "id": "Q53-013", "l": 53, "ch": 16, "pt": "A", "ps": 36, "pr": ["老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…全面戰略協作夥伴關係 選擇題 全面戰略協作夥伴關係（53-011）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [13], "src": "", "card": "C53-10", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜周邊外交：首要位置與親誠惠容：\n要始终将周边置于外交全局的（＿①＿），秉持（＿②＿）的周边外交理念；坚持（＿③＿）的亚洲安全观", "a": ["首要位置", "亲诚惠容", "共同、综合、合作、可持续"], "e": "講師：「要始終將周邊置於外交全局的首要位置，選擇」。周邊是我國安身立命之所、發展繁榮之基。堅持親誠惠容和與鄰為善、以鄰為伴周邊外交方針；堅持共同、綜合、合作、可持續的亞洲安全觀。", "id": "Q53-014", "l": 53, "ch": 16, "pt": "A", "ps": 17, "pr": ["老師：…要始終將周邊看來選擇提考點 要始終將周邊置於外交全局…（53-013）", "老師：…於外交全局的首要位置，選擇（53-013）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [14, 15], "src": "", "card": "C53-11", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜發展中國家：真實親誠＋正確義利觀：\n秉持（＿①＿）理念和（＿②＿），加强同发展中国家团结合作；广大发展中国家是我国在国际事务中的（＿③＿）", "a": ["真实亲诚", "正确义利观", "天然同盟军"], "e": "秉持真實親誠理念和正確義利觀，加強同發展中國家團結合作。廣大發展中國家是我國在國際事務中的天然同盟軍。正確義利觀是我國對發展中國家政策理念的重大創新；要做到義利兼顧、義利平衡。", "id": "Q53-015", "l": 53, "ch": 16, "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [16, 17], "src": "", "card": "C53-12", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新型政黨關係：求同存異、相互尊重、互學互鑒：\n秉持（＿①＿）、（＿②＿）、（＿③＿）理念，构建新型政党关系", "a": ["求同存异", "相互尊重", "互学互鉴"], "e": "講師：「這是我們的新型政黨關係，作為一個多選題來準備」「你需要去記住的是這個互學互鑒的理念」。政黨外交是外交工作的重要方面；以建立新型政黨關係助力構建新型國際關係。", "id": "Q53-016", "l": 53, "ch": 16, "pt": "A", "ps": 44, "pr": ["老師：…黨關係 政黨關係這裏你需要去記住的是 這個互學互建的…（53-017）", "老師：…新型政黨關係 作爲一個多選題來準備 就可以了（53-016）", "老師：…就可以了 這裏就是一個多選題 要深入的去推進各國政黨…（53-016）"]}, {"s": [18], "src": "", "card": "C53-13", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜對外工作的出發點和落腳點：\n维护国家主权、安全、发展利益是我国对外工作的（＿①＿），是中国外交的（＿②＿）", "a": ["出发点和落脚点", "神圣使命"], "e": "講師：「是我們對外工作的出發點和落腳點，選擇題」。維護國家主權、安全、發展利益是我國對外工作的出發點和落腳點，是中國外交的神聖使命。", "id": "Q53-017", "l": 53, "ch": 16, "pt": "A", "ps": 22, "pr": ["老師：…工作的出發點和落腳點 選擇題 我們對必須要維護好我們…（53-018）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"s": [21, 22, 23], "src": "", "card": "C53-14", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜堅持外交為民：\n人民外交是中国共产党的一个（＿①＿），也是中国外交的（＿②＿）；“国之交在于（＿③＿）”", "a": ["创举", "力量源泉", "民相亲"], "e": "中國外交是人民的外交；人民外交是中國共產黨的一個創舉，也是中國外交的力量源泉。要堅定維護我國海外公民和法人正當權益；積極開展民間外交，是中國外交的優良傳統和鮮明特色。「國之交在於民相親。」", "id": "Q53-018", "l": 53, "ch": 16, "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"k": "單", "s": [4], "q": "新時代中國外交的基本原則是：", "o": ["堅持走和平發展道路", "堅持結盟對抗", "堅持外交為民", "堅持全球治理"], "a": 0, "e": "講師：「選擇題的考點」。", "id": "Q53-019", "l": 53, "ch": 16, "pt": "A", "ps": 47, "pr": ["老師：…來先把這個選擇提高的考點給我拿下 堅持走和平發展道…（53-004）", "老師：選擇題的考點（53-004）", "投影片黃字／黃筆標記（53-004）"]}, {"k": "判", "s": [10], "q": "推動構建新型國際關係，要走出一條對話而不對抗、結盟而不結伴的國與國交往新路。", "a": false, "e": "錯。是「結伴而不結盟」（講師：見到結盟全部都錯）。", "id": "Q53-020", "l": 53, "ch": 16, "pt": "A", "ps": 45, "pr": ["老師：我們的外交部局 一定要把這個記住 一個多選題考點（53-010）", "老師：…在任何的考試中 你看到選擇題（53-010）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"k": "多", "s": [10], "q": "我國不斷完善的外交佈局是：", "o": ["全方位", "多層次", "立體化", "單邊化"], "a": [0, 1, 2], "e": "講師：「多選題考點」。", "id": "Q53-021", "l": 53, "ch": 16, "pt": "A", "ps": 66, "pr": ["老師：我們的外交部局 一定要把這個記住 一個多選題考點（53-010）", "老師：多選題考點（53-010）", "老師：…在任何的考試中 你看到選擇題（53-010）"]}, {"k": "單", "s": [11], "q": "中俄之間的關係被表述為：", "o": ["新時代全面戰略協作夥伴關係", "全面戰略合作同盟關係", "戰略競爭關係", "最重要的雙邊關係之一"], "a": 0, "e": "講師：「他會把這個偷偷改成中美……不對」。", "id": "Q53-022", "l": 53, "ch": 16, "pt": "A", "ps": 42, "pr": ["老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…全面戰略協作夥伴關係 選擇題 全面戰略協作夥伴關係（53-011）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"k": "判", "s": [11], "q": "中美新時代全面戰略協作夥伴關係成熟、穩定、自主、堅韌。", "a": false, "e": "錯。那是中俄；中美關係是當今世界最重要的雙邊關係之一。", "id": "Q53-023", "l": 53, "ch": 16, "pt": "A", "ps": 42, "pr": ["老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…全面戰略協作夥伴關係 選擇題 全面戰略協作夥伴關係（53-011）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13 t 00:13）"]}, {"k": "判", "s": [8], "q": "中國奉行防禦性的國防政策，無論發展到什麼程度，中國永遠不稱霸、永遠不搞擴張。", "a": true, "e": "slide 008。", "id": "Q53-031", "l": 53, "ch": 16, "pt": "B", "ps": 5, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"k": "判", "s": [9], "q": "中國堅持以相互尊重、合作共贏為基礎同世界各國交往。", "a": true, "e": "講師：「選擇題考點」。", "id": "Q53-032", "l": 53, "ch": 16, "pt": "A", "ps": 46, "pr": ["老師：…同世界各國交往選擇提考點 相互尊重合作共贏爲基礎（53-009）", "老師：選擇題考點（53-009）", "投影片黃字／黃筆標記（53-009）"]}, {"k": "填", "s": [14], "q": "廣大發展中國家是我國在國際事務中的（＿①＿）。", "a": ["天然同盟军"], "e": "slide 014。", "id": "Q53-033", "l": 53, "ch": 16, "pt": "B", "ps": 5, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"k": "簡", "s": [5, 6, 7], "q": "簡答：中國為什麼要堅持走和平發展道路？", "sum": "一句白話：黨的性質和社會主義制度決定、歷史文化傳統決定、符合時代潮流。", "pts": ["走和平发展道路是由中国共产党性质宗旨和我国社会主义制度决定的", "走和平发展道路是基于中国历史文化传统作出的必然选择", "走和平发展道路符合历史潮流、顺应世界大势"], "e": "第53堂知識點1。", "id": "Q53-034", "l": 53, "ch": 16, "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（53-006）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"k": "簡", "s": [10, 11, 13, 14, 16], "q": "簡答：如何推動構建新型國際關係？", "sum": "一句白話：相互尊重、公平正義、合作共贏，對話不對抗、結伴不結盟；大國協調、周邊、發展中國家、政黨關係四條線一起推。", "pts": ["秉持相互尊重、公平正义、合作共赢原则，走出一条对话而不对抗、结伴而不结盟的国与国交往新路", "推进大国协调合作，构建和平共处、总体稳定、均衡发展的大国关系格局", "坚持亲诚惠容和与邻为善、以邻为伴周边外交方针", "秉持真实亲诚理念和正确义利观，加强同发展中国家团结合作", "秉持求同存异、相互尊重、互学互鉴理念，构建新型政党关系"], "e": "第53堂知識點2。", "id": "Q53-035", "l": 53, "ch": 16, "pt": "A", "ps": 83, "pr": ["老師：我們的外交部局 一定要把這個記住 一個多選題考點（53-010）", "老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…在任何的考試中 你看到選擇題（53-010）"]}, {"k": "論", "s": [4, 10, 18, 21], "q": "論述：結合所學，論述如何全面推進中國特色大國外交。", "sum": "和平發展道路（基本原則）＋新型國際關係＋維護國家主權安全發展利益＋外交為民。", "pts": ["坚持走和平发展道路，这是新时代中国外交的基本原则", "推动构建新型国际关系，对话而不对抗、结伴而不结盟", "坚决维护国家主权、安全、发展利益，这是我国对外工作的出发点和落脚点", "坚持外交为民，坚定维护我国海外公民和法人正当权益，积极开展民间外交"], "e": "第53堂整堂。", "id": "Q53-036", "l": 53, "ch": 16, "pt": "A", "ps": 70, "pr": ["老師：…來先把這個選擇提高的考點給我拿下 堅持走和平發展道…（53-004）", "老師：我們的外交部局 一定要把這個記住 一個多選題考點（53-010）", "老師：…在任何的考試中 你看到選擇題（53-010）"]}, {"s": [3], "src": "", "card": "C54-01", "tag": ["選擇題考點"] 要", "执政考验、改革开放考验、市场经济考验、外部环境考验将长期存在", "精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险将长期存在"], "e": "第55堂知識點1。", "id": "Q55-043", "l": 55, "ch": 17, "pt": "A", "ps": 55, "pr": ["老師：…環境的考驗B 四個考驗多選題 這是我們面臨的四個考驗…（55-010）", "老師：…個是四大危險 都是我們多選題需要去記的 多選題（55-010）", "同頁有考點提示：同時存在 四個多選題 那麼這個脫離羣衆的危險（55-010）"]}, {"k": "論", "s": [6, 14, 21, 24], "q": "論述：結合所學，論述為什麼說全面從嚴治黨是新時代黨的建設的鮮明主題。", "sum": "定位（必由之路、鮮明主題）＋為什麼（打鐵必須自身硬、四大考驗危險）＋怎麼做（核心基礎關鍵要害、體系）＋經驗＋長期性。", "pts": ["全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路，是新时代党的建设的鲜明主题", "打铁必须自身硬：党面临四大考验、四大危险长期存在", "全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治", "坚持思想建党和制度治党相统一等重要经验", "全面从严治党是党的长期战略、永恒课题"], "e": "第55堂整堂。", "id": "Q55-044", "l": 55, "ch": 17, "pt": "A", "ps": 52, "pr": ["老師：選擇 要把它記住 好（55-014）", "老師：…先它這個標題就作爲一個選擇題 它是鮮明主題（55-006）", "老師：…設的一貫要求和根本方針選擇題 習近平總書記指出（55-006）"]}, {"s": [3], "src": "", "card": "C56-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的建設是一項偉大工程：\n把党的建设作为一项（＿①＿）来推进，是我们党的一大（＿②＿），是我们党领导人民进行伟大社会革命的（＿③＿）；以（＿④＿）为统领持续抓好党的各方面建设", "a": ["伟大工程", "创举", "重要法宝", "政治建设"], "e": "把黨的建設作為一項偉大工程來推進，是我們黨的一大創舉，是黨領導人民進行偉大社會革命的重要法寶。深入推進新時代黨的建設新的偉大工程，必須注重系統性整體性協同性，以政治建設為統領持續抓好黨的各方面建設。", "id": "Q56-001", "l": 56, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C56-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜黨的政治建設是黨的根本性建設，擺在首位：\n党的政治建设是党的（＿①＿）；把政治建设纳入党的建设总体布局并摆在（＿②＿），是新时代我们党对马克思主义党建理论的（＿③＿）", "a": ["根本性建设", "首位", "重大创新"], "e": "講師：「我們要把黨的政治建設擺在首位，選擇」。黨的政治建設是黨的根本性建設。把政治建設納入黨的建設總體佈局並擺在首位，是新時代我們黨對馬克思主義黨建理論的重大創新。（對比：第55堂章節重難點列「思想建設是黨的基礎性建設」。）", "id": "Q56-002", "l": 56, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：…黨的政治建設擺在首位，選擇（56-004）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C56-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「党的政治建设」是黨的：", "o": ["根本性建设", "基础性建设"], "a": 0, "e": "「党的政治建设」→「根本性建设」。記法：「政治＝根本性・首位；思想＝基礎性」。", "id": "Q56-003", "l": 56, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：…黨的政治建設擺在首位，選擇（56-004）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C56-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "党的政治建设是党的根本性建设。", "a": true, "e": "對。「党的政治建设」→「根本性建设」。", "id": "Q56-004", "l": 56, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：…黨的政治建設擺在首位，選擇（56-004）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C56-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「思想建设」是黨的：", "o": ["基础性建设", "根本性建设"], "a": 0, "e": "「思想建设」→「基础性建设」。記法：「政治＝根本性・首位；思想＝基礎性」。", "id": "Q56-005", "l": 56, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：…黨的政治建設擺在首位，選擇（56-004）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C56-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "思想建设是党的根本性建设。", "a": false, "e": "錯。「思想建设」應對應「基础性建设」，「根本性建设」對應的是「党的政治建设」。", "id": "Q56-006", "l": 56, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：…黨的政治建設擺在首位，選擇（56-004）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [5], "src": "", "card": "C56-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜旗幟鮮明講政治是根本要求；政治建設決定方向和效果：\n旗帜鲜明讲政治是我们党作为马克思主义政党的（＿①＿）；党的政治建设决定党的建设（＿②＿）", "a": ["根本要求", "方向和效果"], "e": "講師：「黨的政治建設決定了黨的建設的方向和效果，決定了什麼，選擇題」。旗幟鮮明講政治是我們黨作為馬克思主義政黨的根本要求；任何政黨都有政治屬性。", "id": "Q56-007", "l": 56, "ch": 17, "pt": "A", "ps": 22, "pr": ["老師：決定了什麼選擇聽 不抓黨的政治建設或背離了黨的政治…（56-005）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [6], "src": "", "card": "C56-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的政治建設的首要任務：\n保证全党（＿①＿），维护（＿②＿），是党的政治建设的（＿③＿）；（＿④＿）是党的生命", "a": ["服从中央", "党中央权威和集中统一领导", "首要任务", "团结统一"], "e": "講師：「是黨的政治建設的首要任務，選擇」。保證全黨服從中央，維護黨中央權威和集中統一領導，是黨的政治建設的首要任務。團結統一是黨的生命。要堅決防止和反對個人主義、分散主義、自由主義，宗派主義、圈子文化、碼頭文化，堅決反對搞兩面派、做兩面人。", "id": "Q56-008", "l": 56, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：…的政治建設的首要任務，選擇（56-006）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "單", "s": [4], "q": "黨的根本性建設是：", "o": ["政治建設", "思想建設", "組織建設", "制度建設"], "a": 0, "e": "slide 004；思想建設是基礎性建設（第55堂重難點）。", "id": "Q56-009", "l": 56, "ch": 17, "pt": "B", "ps": 8, "pr": ["老師：…黨的政治建設擺在首位，選擇（56-004）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "單", "s": [6], "q": "黨的政治建設的首要任務是：", "o": ["保證全黨服從中央，維護黨中央權威和集中統一領導", "堅定理想信念", "加強作風建設", "推進反腐敗鬥爭"], "a": 0, "e": "講師：「選擇」。", "id": "Q56-010", "l": 56, "ch": 17, "pt": "B", "ps": 11, "pr": ["老師：選擇（56-006）", "老師：…的政治建設的首要任務，選擇（56-006）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "判", "s": [5], "q": "黨的政治建設決定黨的建設方向和效果。", "a": true, "e": "slide 005（講師：選擇題）。", "id": "Q56-011", "l": 56, "ch": 17, "pt": "A", "ps": 30, "pr": ["老師：決定了什麼選擇聽 不抓黨的政治建設或背離了黨的政治…（56-005）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "填", "s": [6], "q": "（＿①＿）是黨的生命，是黨的力量所在。", "a": ["团结统一"], "e": "slide 006。", "id": "Q56-012", "l": 56, "ch": 17, "pt": "B", "ps": 8, "pr": ["老師：…的政治建設的首要任務，選擇（56-006）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "判", "s": [4], "q": "把政治建設納入黨的建設總體佈局並擺在首位，是新時代我們黨對馬克思主義黨建理論的重大創新。", "a": true, "e": "slide 004。", "id": "Q56-013", "l": 56, "ch": 17, "pt": "B", "ps": 8, "pr": ["老師：…黨的政治建設擺在首位，選擇（56-004）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "單", "s": [5], "q": "旗幟鮮明講政治是我們黨作為馬克思主義政黨的：", "o": ["根本要求", "首要任務", "基礎工程", "長期戰略"], "a": 0, "e": "slide 005。", "id": "Q56-014", "l": 56, "ch": 17, "pt": "A", "ps": 23, "pr": ["老師：決定了什麼選擇聽 不抓黨的政治建設或背離了黨的政治…（56-005）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "簡", "s": [4, 5, 6], "q": "簡答：為什麼要把黨的政治建設擺在首位？其首要任務是什麼？", "sum": "一句白話：政治建設是根本性建設、決定黨建方向和效果；首要任務是全黨服從中央。", "pts": ["党的政治建设是党的根本性建设", "旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求", "党的政治建设决定党的建设方向和效果", "保证全党服从中央，维护党中央权威和集中统一领导，是党的政治建设的首要任务"], "e": "第56堂（影片檔不完整，只涵蓋知識點1前半）。", "id": "Q56-015", "l": 56, "ch": 17, "pt": "A", "ps": 30, "pr": ["老師：決定了什麼選擇聽 不抓黨的政治建設或背離了黨的政治…（56-005）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [3], "src": "", "card": "C57-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜腐敗是最大毒瘤、最大威脅；反腐敗是最徹底的自我革命：\n腐败是危害党的生命力和战斗力的（＿①＿），是党长期执政面临的（＿②＿）；反腐败是（＿③＿），是全面从严治党的“（＿④＿）”", "a": ["最大毒瘤", "最大威胁", "最彻底的自我革命", "必答题"], "e": "講師：「腐敗是危害黨的生命力和戰鬥力的最大毒瘤，這是選擇題」「反腐敗是最徹底的自我革命，選擇題」。腐敗是黨長期執政面臨的最大威脅；反腐敗是全面從嚴治黨的「必答題」。黨中央以猛藥去疴、重典治亂的決心，以刮骨療毒、壯士斷腕的勇氣，堅定不移「打虎」「拍蠅」「獵狐」。", "id": "Q57-001", "l": 57, "ch": 17, "pt": "A", "ps": 32, "pr": ["老師：…腐敗是最徹底的自我革命選擇題 什麼是我們最徹底的自我…（57-003）", "老師：持久戰 這裏的一些選擇題 大家注意一下（57-003）", "老師：…戰鬥力的最大毒瘤，這是選擇題（57-003）"]}, {"s": [4], "src": "", "card": "C57-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜反腐敗是一場輸不起也決不能輸的重大鬥爭：\n“我们党作为执政党，面临的最大威胁就是（＿①＿）。”反腐败是一场（＿②＿）的重大斗争", "a": ["腐败", "输不起也决不能输"], "e": "腐敗嚴重侵蝕黨的肌體，對黨的執政基礎破壞力最大、殺傷力也最大。習近平指出：「我們黨作為執政黨，面臨的最大威脅就是腐敗。」", "id": "Q57-002", "l": 57, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [5], "src": "", "card": "C57-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜前途命運最終取決於人心向背：\n一个政党、一个政权，其前途命运最终取决于（＿①＿）", "a": ["人心向背"], "e": "一個政黨、一個政權，其前途命運最終取決於人心向背。人民群眾最痛恨各種腐敗現象、特權現象。必須從關係黨和國家生死存亡的戰略高度，堅定不移開展反腐敗鬥爭。", "id": "Q57-003", "l": 57, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [7], "src": "", "card": "C57-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜標本兼治是新時代反腐敗鬥爭的鮮明特徵：\n（＿①＿）是新时代推进反腐败斗争的（＿②＿）；坚持反腐败（＿③＿）", "a": ["标本兼治", "鲜明特征", "无禁区、全覆盖、零容忍"], "e": "講師：「標本兼治是新時代推進反腐敗鬥爭的鮮明特徵，選擇題」。既以治標遏制腐敗勢頭，更注重治本夯實防腐的基礎；堅持反腐敗無禁區、全覆蓋、零容忍；成功走出一條依靠制度優勢、法治優勢反腐敗之路。", "id": "Q57-004", "l": 57, "ch": 17, "pt": "A", "ps": 22, "pr": ["老師：…反腐敗鬥爭的 鮮明特徵選擇題 所以我們既要以治標遏制…（57-007）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [8], "src": "", "card": "C57-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜監察委員會與紀委合署辦公：\n组建（＿①＿）作为党统一领导的专门的反腐败工作机构，与党的（＿②＿）合署办公", "a": ["监察委员会", "纪律检查机关"], "e": "深化國家監察體制改革，組建監察委員會作為黨統一領導的專門的反腐敗工作機構，與黨的紀律檢查機關合署辦公，實現了黨內監督和國家監察、依規治黨和依法治國有機統一。", "id": "Q57-005", "l": 57, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [9], "src": "", "card": "C57-06", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜巡視：黨章規定的重要監督方式、黨內監督的戰略性制度安排：\n巡视是党章规定的（＿①＿），是党内监督的（＿②＿）", "a": ["重要监督方式", "战略性制度安排"], "e": "巡視是黨章規定的重要監督方式，是黨內監督的戰略性制度安排，成為發現問題、形成震懾的一把利劍。派駐監督是黨和國家監督體系的重要組成部分。", "id": "Q57-006", "l": 57, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [10, 11], "src": "", "card": "C57-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「打虎」「拍蠅」「獵狐」多管齊下：\n坚持受贿行贿（＿①＿）；连续组织开展“（＿②＿）”，决不让外国成为腐败分子的“（＿③＿）”", "a": ["一起查", "天网行动", "避罪天堂"], "e": "堅持受賄行賄一起查，有案必查、有腐必懲；深化金融、國有企業、政法、糧食購銷等重點領域反腐敗工作；將國際追逃追贓作為遏制腐敗蔓延的重要一環，連續組織開展「天網行動」，決不讓外國成為腐敗分子的「避罪天堂」。", "id": "Q57-007", "l": 57, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [12], "src": "", "card": "C57-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜把權力關進制度的籠子裏：\n反腐倡廉的核心是（＿①＿）；腐败的本质是权力（＿②＿）", "a": ["制度制约和监督权力", "出轨、越轨"], "e": "反腐倡廉的核心是制度制約和監督權力。腐敗的本質是權力出軌、越軌。修訂頒布《中國共產黨黨內監督條例》《中國共產黨紀律處分條例》《中國共產黨問責條例》等，增強制度剛性，防止「破窗效應」。", "id": "Q57-008", "l": 57, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [13], "src": "", "card": "C57-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜永遠吹衝鋒號：\n“要保持清醒头脑，永远吹（＿①＿），牢记反腐败（＿②＿）。”", "a": ["冲锋号", "永远在路上"], "e": "習近平告誡全黨：「要保持清醒頭腦，永遠吹衝鋒號，牢記反腐敗永遠在路上。」只要存在腐敗問題產生的土壤和條件，黨與腐敗現象的鬥爭就不會停止。", "id": "Q57-009", "l": 57, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [14, 15], "src": "", "card": "C57-10", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜不敢腐、不能腐、不想腐一體推進：\n“不敢”是（＿①＿），“不能”是（＿②＿），“不想”是（＿③＿）；必须三者（＿④＿）", "a": ["前提", "关键", "根本", "同时发力、同向发力、综合发力"], "e": "講師：「不敢是前提，不想是根本，選擇題」「這裏需要去重點記一下」。不敢腐、不能腐、不想腐是相互依存、相互促進的有機整體：「不敢」是前提，「不能」是關鍵，「不想」是根本；必須三者同時發力、同向發力、綜合發力。", "id": "Q57-010", "l": 57, "ch": 17, "pt": "A", "ps": 24, "pr": ["老師：…不敢是前提 不想是根本選擇題 要靠加強（57-014）", "老師：…輔和不想輔 這裏需要去重點記一下 好（57-014）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [14, 15], "src": "", "card": "C57-10", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "一體推進「三不腐」中，“不敢”是：", "o": ["前提", "根本", "关键"], "a": 0, "e": "「“不敢”」→「前提」。記法：「敢前提・能關鍵・想根本」。", "id": "Q57-011", "l": 57, "ch": 17, "pt": "A", "ps": 24, "pr": ["老師：…不敢是前提 不想是根本選擇題 要靠加強（57-014）", "老師：…輔和不想輔 這裏需要去重點記一下 好（57-014）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [14, 15], "src": "", "  "ps": 5, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "填", "s": [5], "q": "一個政黨、一個政權，其前途命運最終取決於（＿①＿）。", "a": ["人心向背"], "e": "slide 005。", "id": "Q57-026", "l": 57, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "判", "s": [8], "q": "監察委員會與黨的紀律檢查機關合署辦公。", "a": true, "e": "slide 008。", "id": "Q57-027", "l": 57, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "單", "s": [11], "q": "國際追逃追贓中連續組織開展的行動是：", "o": ["天網行動", "獵狐行動", "打虎行動", "清風行動"], "a": 0, "e": "slide 011。", "id": "Q57-028", "l": 57, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "填", "s": [17], "q": "推動實現幹部清正、政府（＿①＿）、政治清明。", "a": ["清廉"], "e": "slide 017。", "id": "Q57-029", "l": 57, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "判", "s": [4], "q": "反腐敗是一場輸不起也決不能輸的重大鬥爭。", "a": true, "e": "slide 004。", "id": "Q57-030", "l": 57, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "簡", "s": [14, 15], "q": "簡答：如何理解一體推進不敢腐、不能腐、不想腐？", "sum": "一句白話：三者是有機整體——不敢是前提、不能是關鍵、不想是根本，要同時、同向、綜合發力。", "pts": ["不敢腐、不能腐、不想腐是相互依存、相互促进的有机整体", "“不敢”是前提，要以严格的执纪执法增强制度刚性", "“不能”是关键，要科学配置权力，加强重点领域监督机制改革和制度建设", "“不想”是根本，要靠加强理想信念教育、提高党性觉悟、涵养廉洁文化", "必须三者同时发力、同向发力、综合发力"], "e": "第57堂知識點3。", "id": "Q57-031", "l": 57, "ch": 17, "pt": "A", "ps": 25, "pr": ["老師：…不敢是前提 不想是根本選擇題 要靠加強（57-014）", "老師：…輔和不想輔 這裏需要去重點記一下 好（57-014）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"k": "論", "s": [3, 4, 7, 12, 14], "q": "論述：結合所學，論述為什麼要堅定不移推進反腐敗鬥爭，以及如何推進。", "sum": "為什麼：最大毒瘤、最大威脅、人心向背；怎麼做：標本兼治、把權力關進制度籠子、三不腐一體推進、永遠吹衝鋒號。", "pts": ["腐败是危害党的生命力和战斗力的最大毒瘤，是党长期执政面临的最大威胁", "反腐败是最彻底的自我革命", "一个政党、一个政权，其前途命运最终取决于人心向背", "坚持标本兼治，坚持反腐败无禁区、全覆盖、零容忍", "把权力关进制度的笼子里", "坚持不敢腐、不能腐、不想腐一体推进", "永远吹冲锋号，牢记反腐败永远在路上"], "e": "第57堂整堂。", "id": "Q57-032", "l": 57, "ch": 17, "pt": "A", "ps": 55, "pr": ["老師：…腐敗是最徹底的自我革命選擇題 什麼是我們最徹底的自我…（57-003）", "老師：持久戰 這裏的一些選擇題 大家注意一下（57-003）", "老師：…反腐敗鬥爭的 鮮明特徵選擇題 所以我們既要以治標遏制…（57-007）"]}, {"s": [4], "src": "", "card": "C58-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜跳出歷史周期率的兩個答案：\n毛泽东在延安的窑洞里给出了第一个答案，这就是“（＿①＿）”；党又给出了第二个答案，这就是（＿②＿）；全面从严治党是新时代党的自我革命的（＿③＿）", "a": ["让人民来监督政府", "自我革命", "伟大实践"], "e": "講師：「這就是第二個答案，選擇題的考點」。毛澤東在延安的窯洞裏給出了第一個答案，這就是「讓人民來監督政府」。經過百年奮鬥特別是黨的十八大以來新的實踐，黨又給出了第二個答案，這就是自我革命。全面從嚴治黨是新時代黨的自我革命的偉大實踐。", "id": "Q58-001", "l": 58, "ch": 17, "pt": "A", "ps": 34, "pr": ["老師：…答案 選擇題 選擇題的考點（58-004）", "你的錯題：歷史周期率兩個答案（第一個答案曾連錯兩次）（progress.md）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C58-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "跳出歷史周期率的「第一个答案」是：", "o": ["让人民来监督政府", "自我革命"], "a": 0, "e": "「第一个答案」→「让人民来监督政府」。記法：「第一答案＝人民監督政府（毛澤東・延安窯洞）；第二答案＝自我革命」。", "id": "Q58-002", "l": 58, "ch": 17, "pt": "A", "ps": 34, "pr": ["老師：…答案 選擇題 選擇題的考點（58-004）", "你的錯題：歷史周期率兩個答案（第一個答案曾連錯兩次）（progress.md）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C58-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "跳出历史周期率的第一个答案是“让人民来监督政府”。", "a": true, "e": "對。「第一个答案」→「让人民来监督政府」。", "id": "Q58-003", "l": 58, "ch": 17, "pt": "A", "ps": 34, "pr": ["老師：…答案 選擇題 選擇題的考點（58-004）", "你的錯題：歷史周期率兩個答案（第一個答案曾連錯兩次）（progress.md）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C58-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "跳出歷史周期率的「第二个答案」是：", "o": ["自我革命", "让人民来监督政府"], "a": 0, "e": "「第二个答案」→「自我革命」。記法：「第一答案＝人民監督政府（毛澤東・延安窯洞）；第二答案＝自我革命」。", "id": "Q58-004", "l": 58, "ch": 17, "pt": "A", "ps": 34, "pr": ["老師：…答案 選擇題 選擇題的考點（58-004）", "你的錯題：歷史周期率兩個答案（第一個答案曾連錯兩次）（progress.md）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [4], "src": "", "card": "C58-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "跳出历史周期率的第二个答案是“让人民来监督政府”。", "a": false, "e": "錯。「第二个答案」應對應「自我革命」，「让人民来监督政府」對應的是「第一个答案」。", "id": "Q58-005", "l": 58, "ch": 17, "pt": "A", "ps": 34, "pr": ["老師：…答案 選擇題 選擇題的考點（58-004）", "你的錯題：歷史周期率兩個答案（第一個答案曾連錯兩次）（progress.md）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [5], "src": "", "card": "C58-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜勇於自我革命：顯著標誌、最大優勢、最鮮明品格：\n勇于自我革命，是中国共产党区别于其他政党的（＿①＿），也是我们党（＿②＿）、（＿③＿）；我们党除了国家、民族、人民的利益，没有任何自己的（＿④＿），这是我们党自我革命的（＿⑤＿）", "a": ["显著标志", "最大的优势", "最鲜明的品格", "特殊利益", "勇气之源、底气所在"], "e": "講師：「是我黨區別於其他政黨的顯著標誌，選擇」「也是我們黨最大的優勢、最鮮明的品格，選擇」。黨之所以勇於自我革命，是因為黨除了國家、民族、人民的利益，沒有任何自己的特殊利益，這是黨自我革命的勇氣之源、底氣所在。", "id": "Q58-006", "l": 58, "ch": 17, "pt": "B", "ps": 5, "pr": ["老師：是我黨區別於其他政黨的顯著標誌，選擇（58-005）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [7, 8], "src": "", "card": "C58-03", "tag": ["必背", "簡答題考點", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「四個自我」：\n实现（＿①＿）、（＿②＿）、（＿③＿）、（＿④＿）；“四个自我”是实现伟大自我革命的（＿⑤＿）", "a": ["自我净化", "自我完善", "自我革新", "自我提高", "重要途径"], "e": "講師：「這個就是我們四個自我，四個自我重點，簡答加選擇」。自我淨化——堅定理想信念宗旨，提高政治免疫力；自我完善——補短板、強弱項、固根本；自我革新——破除不合時宜的思想觀念和體制機制弊端；自我提高——永不僵化、永不停滯，全面增強執政本領。「四個自我」是實現偉大自我革命的重要途徑。", "id": "Q58-007", "l": 58, "ch": 17, "pt": "A", "ps": 24, "pr": ["老師：就四個自我重點 簡答 加（58-008）", "老師：自我革命重點 記住 由於自我革命就要同一切影響黨的…（58-007）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [7, 8], "src": "", "card": "C58-03", "tag": ["必背", "簡答題考點", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜「四個自我」", "model": "实现自我净化、自我完善、自我革新、自我提高；“四个自我”是实现伟大自我革命的重要途径", "pts": ["自我净化", "自我完善", "自我革新", "自我提高"], "e": "記法：「淨化・完善・革新・提高」。", "id": "Q58-008", "l": 58, "ch": 17, "pt": "A", "ps": 24, "pr": ["老師：就四個自我重點 簡答 加（58-008）", "老師：自我革命重點 記住 由於自我革命就要同一切影響黨的…（58-007）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [7, 8], "src": "", "card": "C58-03", "tag": ["必背", "簡答題考點", "選擇題考點"], "auto": 1, "k": "多", "q": "勇於自我革命要實現的「四個自我」是：", "o": ["自我净化", "自我完善", "自我革新", "自我提高", "自我监督"], "a": [0, 1, 2, 3], "e": "正確：自我净化；自我完善；自我革新；自我提高。干擾項：自我监督。", "id": "Q58-009", "l": 58, "ch": 17, "pt": "A", "ps": 24, "pr": ["老師：就四個自我重點 簡答 加（58-008）", "老師：自我革命重點 記住 由於自我革命就要同一切影響黨的…（58-007）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [9], "src": "", "card": "C58-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜外靠人民民主，內靠全面從嚴治黨：\n外靠发展（＿①＿）、接受人民监督，内靠（＿②＿）、推进自我革命", "a": ["人民民主", "全面从严治党"], "e": "黨成立以來，外靠發展人民民主、接受人民監督，內靠全面從嚴治黨、推進自我革命，保證了黨長盛不衰。新時代打了一套自我革命的「組合拳」；這是黨的顯著優勢，也是引領時代的制勝之道。", "id": "Q58-010", "l": 58, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [10, 11], "src": "", "card": "C58-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜大黨獨有難題：\n必须时刻保持解决（＿①＿）的（＿②＿）", "a": ["大党独有难题", "清醒和坚定"], "e": "習近平指出，必須時刻保持解決大黨獨有難題的清醒和堅定。解決大黨獨有難題，是必須邁過的一道坎，是全面從嚴治黨必須啃下的硬骨頭。如何始終不忘初心牢記使命、統一思想意志行動、具備強大執政能力和領導水平、保持幹事創業精神狀態、及時發現和解決自身問題、保持風清氣正的政治生態，都是大黨必須解決的獨有難題。", "id": "Q58-011", "l": 58, "ch": 17, "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [12, 13, 14], "src": "", "card": "C58-06", "tag": ["簡答題考點"], "auto": 1, "k": "填", "q": "填空｜怎樣解決大黨獨有難題：\n必须坚守奠基创业时的（＿①＿）；必须与时俱进提高（＿②＿）水平；必须常怀（＿③＿）、（＿④＿），始终保持（＿⑤＿）的坚定自觉", "a": ["初心", "科学执政、民主执政、依法执政", "忧患意识", "底线思维", "刀刃向内"], "e": "講師：「怎麼去解決這樣的難題，簡答」。（1）必須堅守奠基創業時的初心；（2）必須在重大問題、嚴峻形勢面前始終心往一處想、勁往一處使；（3）必須與時俱進提高科學執政、民主執政、依法執政水平；（4）必須始終保持艱苦奮鬥、奮發有為的精氣神；（5）必須堅持真理、修正錯誤；（6）必須常懷憂患意識、底線思維，始終保持刀刃向內的堅定自覺。", "id": "Q58-012", "l": 58, "ch": 17, "pt": "A", "ps": 22, "pr": ["老師：…怎麼去解決這樣的難題 簡答 好（58-012）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [15], "src": "", "card": "C58-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「三個務必」：\n务必（＿①＿），务必（＿②＿），务必（＿③＿）", "a": ["不忘初心、牢记使命", "谦虚谨慎、艰苦奋斗", "敢于斗争、善于斗争"], "e": "講師：「務必，選擇題，重點」。習近平指出，「全黨同志務必不忘初心、牢記使命，務必謙虛謹慎、艱苦奮鬥，務必敢於鬥爭、善於鬥爭」。要始終牢記「三個務必」，解決好大黨獨有難題，走好新的趕考之路。", "id": "Q58-013", "l": 58, "ch": 17, "pt": "A", "ps": 12, "pr": ["老師：務必，選擇題，重點（58-015）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [15], "src": "", "card": "C58-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜「三個務必」", "model": "务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争", "pts": ["务必不忘初心、牢记使命", "务必谦虚谨慎、艰苦奋斗", "务必敢于斗争、善于斗争"], "e": "記法：「初心使命・謙虛艱苦・敢鬥善鬥」。", "id": "Q58-014", "l": 58, "ch": 17, "pt": "A", "ps": 12, "pr": ["老師：務必，選擇題，重點（58-015）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"s": [15], "src": "", "card": "C58-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "多", function pickInf(){

  let tot=0;const ws=Q.pool.map(id=>{const w=weight(id);tot+=w;return w});
  if(!tot)return Q.pool[Math.floor(Math.random()*Q.pool.length)];
  let r=Math.random()*tot;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<=0)return Q.pool[i]}return Q.pool[Q.pool.length-1];
}
function nextQ(){
  let id;
  if(Q.inf)id=pickInf();else{if(Q.i>=Q.queue.length){endQuiz();return}id=Q.queue[Q.i++]}
  Q.recent.push(id);if(Q.recent.length>Math.min(15,Math.floor(Q.pool.length/2)))Q.recent.shift();
  const q=QMAP[id];Q.cur={q,ord:q.o?shuffle(q.o.map((_,i)=>i)):null,sel:new Set()};Q.ans=false;drawQ();
}
function drawQ(){
  const {q,ord}=Q.cur;const total=Q.inf?'∞':Q.queue.length;
  let body='';
  if(q.k==='單'||q.k==='多'){body=ord.map((oi,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABCDEFGH'[j]}</span>${esc(q.o[oi])}</button>`).join('')+(q.k==='多'?`<div class="row"><button class="btn pri" id="qsubmit">提交答案</button><span class="mute">（多選：選完所有正確項再提交）</span></div>`:'')}
  else if(q.k==='判'){body=`<button class="opt" data-tf="1"><span class="k">1</span>✔ 正確</button><button class="opt" data-tf="0"><span class="k">2</span>✘ 錯誤</button>`}
  else if(q.k==='填'){body=`<div>${q.a.map((_,i)=>`<label>${'①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮'[i]||i+1} <input type="text" class="blank" data-b="${i}" autocomplete="off"></label>`).join(' ')}</div><div class="mute">繁體、簡體都可以；標點、空格不影響判分。</div><div class="row" style="margin-top:.5rem"><button class="btn pri" id="qsubmit">提交答案</button></div>`}
  else{body=`<textarea id="qta" placeholder="先自己寫（或在心裡默背）一遍，再按「看答案自評」"></textarea><div class="row"><button class="btn pri" id="qsubmit">看答案自評</button></div>`}
  $('#main').innerHTML=`<div class="box"><div class="row" style="justify-content:space-between"><b>${esc(Q.title)}</b><span class="mute">第 ${Q.done+1} 題 / ${total}　·　答對 ${Q.ok}</span></div>
  ${Q.inf?'':`<div class="progress"><i style="width:${Q.done/Q.queue.length*100}%"></i></div>`}
  <div><span class="tag">${KN[q.k]}</span>${tierTag(q)}${tagsHTML(q.tag)}${S.wrong[q.id]?`<span class="tag t錯題">錯題本 ${S.wrong[q.id].st}/3</span>`:''}</div>
  <div class="qtext">${esc(q.q)}</div><div id="qbody">${body}</div><div id="qfb"></div>
  <div class="row" style="margin-top:.8rem;justify-content:flex-end"><button class="btn sm" id="qquit">結束本輪</button></div></div>`;
  $('#qquit').onclick=()=>endQuiz();
  const qb=$('#qbody');
  if(q.k==='單')qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.ans)return;Q.cur.sel=new Set([+b.dataset.j]);answer()});
  if(q.k==='多'){qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.ans)return;const j=+b.dataset.j;Q.cur.sel.has(j)?Q.cur.sel.delete(j):Q.cur.sel.add(j);b.classList.toggle('sel')});}
  if(q.k==='判')qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.ans)return;Q.cur.tf=b.dataset.tf==='1';answer()});
  const sb=$('#qsubmit');if(sb)sb.onclick=answer;
  const f=qb.querySelector('input.blank');if(f)f.focus();
  qb.querySelectorAll('input.blank').forEach((inp,i,arr)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(i<arr.length-1)arr[i+1].focus();else answer()}}));
}
function explainHTML(q){return `${q.e?`<div class="sec"><span class="lab p">解析</span>${esc(q.e)}</div>`:''}${whyHTML(q)}<div class="src">出處：${esc(srcText(q))}${q.card?` · <a href="#" data-card="${q.card}">看相關知識卡</a>`:''}</div>`}
function bindCardLinks(root){root.querySelectorAll('[data-card]').forEach(a=>a.onclick=e=>{e.preventDefault();showCard(a.dataset.card)})}
function answer(){
  if(Q.ans)return;const {q,ord}=Q.cur;const fb=$('#qfb');
  if(SELF(q.k)){Q.ans=true;$('#qsubmit').remove();
    fb.innerHTML=`<div class="fb self">${q.sum?`<div class="sec"><span class="lab p">先記一句白話</span>${esc(q.sum)}</div>`:''}
     ${q.model?`<div class="sec"><span class="lab o">參考原文</span><div class="model">${esc(q.model)}</div></div>`:''}
     <div class="sec"><span class="lab m">得分要點</span>（逐點對照：寫出／背出了就打勾）<div class="pts">${q.pts.map((p,i)=>`<label><input type="checkbox" data-p="${i}"><span>${i+1}. ${esc(p)}</span></label>`).join('')}</div></div>
     <div class="row"><button class="btn pri" id="selfdone">完成自評</button><span class="mute">打勾 ≥ 80% 算答對</span></div>${explainHTML(q)}</div>`;
    bindCardLinks(fb);
    $('#selfdone').onclick=()=>{const n=fb.querySelectorAll('.pts input:checked').length;const ok=n/q.pts.length>=0.8;$('#selfdone').parentNode.innerHTML=`<span class="big" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✔ 自評：答對':'✘ 自評：未達標'}（${n}/${q.pts.length}）</span>`;finish(ok)};
    return;}
  let ok=false,ansText='';
  if(q.k==='單'||q.k==='多'){
    const corr=new Set((Array.isArray(q.a)?q.a:[q.a]));const sel=Q.cur.sel;
    if(!sel.size){toast('請先選擇答案');return}
    ok=[...Array(ord.length).keys()].every(j=>corr.has(ord[j])===sel.has(j));
    document.querySelectorAll('#qbody .opt').forEach(b=>{const j=+b.dataset.j;b.classList.remove('sel');if(corr.has(ord[j]))b.classList.add('right');else if(sel.has(j))b.classList.add('wrong')});
    ansText=ord.map((oi,j)=>corr.has(oi)?'ABCDEFGH'[j]:'').join('');
  }else if(q.k==='判'){ok=Q.cur.tf===q.a;ansText=q.a?'正確':'錯誤';
    document.querySelectorAll('#qbody .opt').forEach(b=>{const v=b.dataset.tf==='1';if(v===q.a)b.classList.add('right');else if(v===Q.cur.tf)b.classList.add('wrong')})}
  else if(q.k==='填'){const ins=[...document.querySelectorAll('#qbody input.blank')];
    const res=ins.map((inp,i)=>fillOK(inp.value,q.a[i]));ok=res.every(Boolean);
    ins.forEach((inp,i)=>{inp.disabled=true;inp.style.borderColor=res[i]?'var(--ok)':'var(--bad)';inp.style.background=res[i]?'#e6f5ea':'#fdecea'});
    ansText=q.a.map((a,i)=>('①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮'[i]||i+1)+' '+String(a).split('|').join(' 或 ')).join('　');}
  Q.ans=true;const sb=$('#qsubmit');if(sb)sb.remove();
  fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="big">${ok?'✔ 答對了！':'✘ 答錯了'}</div>${ok&&q.k!=='填'?'':`<div class="sec"><b>正確答案：</b>${esc(ansText)}</div>`}${explainHTML(q)}</div>`;
  bindCardLinks(fb);finish(ok);
}
function finish(ok){
  const q=Q.cur.q;record(q,ok);Q.done++;if(ok)Q.ok++;else{Q.wrongs.push(q.id);const r=Q.reins[q.id]||0;if(r<(Q.inf?2:1)){Q.reins[q.id]=r+1;if(Q.inf)Q.pend.push({id:q.id,at:Q.done+4});else Q.queue.splice(Math.min(Q.queue.length,Q.i+4),0,q.id)}}
  const fb=$('#qfb');const d=document.createElement('div');d.className='row';d.style.marginTop='.7rem';
  d.innerHTML=`<button class="btn pri" id="qnext">下一題 →</button>${!ok?'<span class="mute">已加入錯題本，稍後會再出現</span>':''}`;fb.appendChild(d);

function buildExam(ec){
  const ls=new Set(ec.ls);const items=[];let short=[];
  for(const k of ['單','多','判','填','簡','論']){
    let pool=DATA.qs.filter(q=>ls.has(q.l)&&q.k===k);
    if(k==='簡'&&pool.length<ec.n[k])pool=pool.concat(DATA.qs.filter(q=>ls.has(q.l)&&q.k==='默'));
    const pick=shuffle(pool.slice()).slice(0,ec.n[k]);if(pick.length<ec.n[k])short.push(`${KN[k]}只有 ${pick.length} 題`);
    pick.forEach(q=>items.push({id:q.id,k,ord:q.o?shuffle(q.o.map((_,i)=>i)):null}));
  }
  if(!items.length){toast('範圍內沒有題目');return}
  const scope=ec.ls.length===LESSONS.length?'全部':ec.ls.length<=6?ec.ls.map(pad).join('、')+' 堂':ec.ls.length+' 堂';
  EX={items,sub:false,saved:false,start:Date.now(),scope};if(short.length)toast('範圍內'+short.join('，'));drawExam();
}

R.stats=function(){
  const agg=(f)=>{let n=0,c=0,seen=0,tot=0;DATA.qs.forEach(q=>{if(!f(q))return;tot++;const r=S.qs[q.id];if(r){seen++;n+=r.n;c+=r.c}});return{n,c,seen,tot,acc:n?c/n:null}};
  const all=agg(()=>true);
  const pct=x=>x==null?'—':Math.round(x*100)+'%';
  const bar=x=>`<div class="bar"><i style="width:${x==null?0:Math.round(x*100)}%"></i></div>`;
  const chs=DATA.chapters.map((c,i)=>({c,a:agg(q=>q.ch===i),k:DATA.cards.filter(x=>x.ch===i),kk:DATA.cards.filter(x=>x.ch===i&&S.cards[x.id]==='k').length}));
  const les=LESSONS.map(l=>({l,a:agg(q=>q.l===l)})).filter(x=>x.a.n>=3).sort((x,y)=>x.a.acc-y.a.acc).slice(0,8);
  const ks=KORDER.map(k=>({k,a:agg(q=>q.k===k)}));
  const days=Object.keys(S.days).sort().slice(-7);
  $('#main').innerHTML=`<div class="box"><h2>統計</h2><p>已做過 <b>${all.seen}</b> / ${all.tot} 題　·　累計作答 ${all.n} 次　·　總正確率 <b>${pct(all.acc)}</b>　·　錯題本 ${Object.keys(S.wrong).length} 題　·　知識卡已熟 ${DATA.cards.filter(c=>S.cards[c.id]==='k').length} / ${DATA.cards.length}</p>
  ${days.length?`<p class="mute">最近作答：${days.map(d=>d.slice(5)+' '+S.days[d]+'題').join('　')}</p>`:''}</div>
  <div class="box"><h3>各章正確率</h3><table><tr><th>章</th><th>已做／題數</th><th>正確率</th><th style="width:28%"></th><th>卡已熟</th></tr>${chs.map(x=>`<tr><td>${esc(x.c.n)}</td><td>${x.a.seen}/${x.a.tot}</td><td>${pct(x.a.acc)}</td><td>${bar(x.a.acc)}</td><td>${x.kk}/${x.k.length}</td></tr>`).join('')}</table></div>
  <div class="box"><h3>最弱的課堂（至少作答 3 次）</h3>${les.length?`<table>${les.map(x=>`<tr><td>第${pad(x.l)}堂 ${esc(DATA.lt[x.l])}</td><td>${pct(x.a.acc)}（${x.a.c}/${x.a.n}）</td><td><button class="btn sm" data-dl="${x.l}">練這堂</button></td></tr>`).join('')}</table>`:'<p class="mute">做多一點題目後才會顯示。</p>'}</div>
  <div class="box"><h3>各題型正確率</h3><table>${ks.map(x=>`<tr><td>${KN[x.k]}</td><td>${x.a.seen}/${x.a.tot}</td><td>${pct(x.a.acc)}</td><td style="width:35%">${bar(x.a.acc)}</td></tr>`).join('')}</table></div>`;
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const l=+b.dataset.dl;const p=DATA.qs.filter(q=>q.l===l).map(q=>q.id);go('quiz');startQuiz(shuffle(p).slice(0,20),{pool:p,title:`第${pad(l)}堂練習`})});
};
// ---------- 備份 ----------
R.backup=function(){
  $('#main').innerHTML=`<div class="box"><h2>備份進度</h2><p class="mute">進度存在這台電腦這個瀏覽器裡（localStorage）。換電腦、換瀏覽器或清除瀏覽資料前，請先匯出備份。</p>
  <div class="row"><button class="btn pri" id="bexp">匯出進度（下載 JSON 檔）</button><label class="btn">匯入進度…<input type="file" id="bimp" accept=".json,application/json" style="display:none"></label></div>
  <details style="margin-top:.6rem"><summary class="mute">下載不了？改用複製文字</summary><textarea id="btxt" readonly></textarea><div class="row"><button class="btn sm" id="bshow">顯示備份文字</button><button class="btn sm" id="bpaste">把貼上的文字匯入</button></div></details></div>
  <div class="box"><h2>設定</h2><div class="row">字體大小：<button class="btn sm" id="fsm">A－</button><b id="fsv">${S.fs}</b><button class="btn sm" id="fsp">A＋</button></div></div>
  <div class="box"><h2>關於題庫</h2><p class="mute">知識卡 ${DATA.cards.length} 張、題目 ${DATA.qs.length} 題，涵蓋第01–${pad(LESSONS[LESSONS.length-1])}堂（導論至第十七章）。「必考優先」分級只根據老師在課上說的「要背／考點／選擇題」、投影片星號與黃筆標記，以及你 progress.md 的錯題，並非官方考試範圍。內容只取自課程投影片黃色重點、講師口述標記與逐字稿；原文保留投影片簡體字。資料建立：${esc(DATA.built)}。</p>
  <div class="row"><button class="btn bad" id="breset">清除全部進度</button></div></div>`;
  const dump=()=>JSON.stringify({app:'xt-study',v:1,exported:new Date().toISOString(),state:S});
  $('#bexp').onclick=()=>{const b=new Blob([dump()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='思想概論進度_'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('已匯出')};
  const load=t=>{try{const o=JSON.parse(t);const st=o.state||o;if(!st||typeof st!=='object'||!('qs' in st))throw 0;if(!confirm('匯入會覆蓋目前進度，確定嗎？'))return;S=Object.assign(blank(),st);save();document.documentElement.style.setProperty('--fs',S.fs+'px');toast('匯入成功');R.backup()}catch(e){alert('檔案格式不正確')}};
  $('#bimp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f)};
  $('#bshow').onclick=()=>{const t=$('#btxt');t.readOnly=false;t.value=dump();t.select()};
  $('#bpaste').onclick=()=>load($('#btxt').value);
  const fs=d=>{S.fs=Math.min(26,Math.max(14,S.fs+d));document.documentElement.style.setProperty('--fs',S.fs+'px');$('#fsv').textContent=S.fs;save()};
  $('#fsm').onclick=()=>fs(-1);$('#fsp').onclick=()=>fs(1);
  $('#breset').onclick=()=>{if(confirm('真的要清除全部進度（錯題本、已熟、成績）嗎？建議先匯出備份。')){S=blank();save();toast('已清除');R.backup()}};
};
window.__app={S:()=>S,go,startQuiz,QMAP};
go('cards');
})();
</script>
