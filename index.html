，選擇題」「這個唯一的根本標準，簡答題」。人民軍隊永遠是戰鬥隊，人民軍隊的生命力在於戰鬥力，主責主業是備戰打仗。軍事訓練是提高實戰能力的重要途徑和抓手，是最直接的軍事鬥爭準備；堅持實戰實訓、聯戰聯訓、科技強訓、依法治訓。", "o": "牢固树立〖战斗力〗这个〖唯一的根本的标准〗；人民军队的生命力在于〖战斗力〗，主责主业是〖备战打仗〗；军事训练……是〖最直接的军事斗争准备〗", "m": "「唯一根本標準＝戰鬥力」。", "pt": "A", "ps": 32, "pr": ["老師：作爲選擇提名是嗎 我們就永遠都記住 只要是打仗（48-011）", "老師：這個唯一的根本標準 簡答題 好（48-011）", "老師：在於戰鬥力，選擇題（48-011）"]}, {"id": "C48-10", "l": 48, "ch": 14, "s": [11, 12, 13], "src": "", "tag": ["必背", "簡答題考點"], "t": "全面加強練兵備戰（四點）", "p": "（1）牢固樹立戰鬥力這個唯一的根本的標準；（2）深入推進實戰化軍事訓練；（3）創新軍事戰略指導（軍事戰略科學準確，就是最大的勝算）；（4）大力培育「一不怕苦、二不怕死」的戰鬥精神。", "o": "牢固树立〖战斗力〗这个唯一的根本的标准；深入推进〖实战化军事训练〗；创新〖军事战略指导〗；大力培育〖“一不怕苦、二不怕死”〗的战斗精神", "m": "「戰鬥力標準・實戰化訓練・戰略指導・戰鬥精神」。", "items": ["牢固树立战斗力这个唯一的根本的标准", "深入推进实战化军事训练", "创新军事战略指导", "大力培育“一不怕苦、二不怕死”的战斗精神"], "pt": "A", "ps": 26, "pr": ["老師：作爲選擇提名是嗎 我們就永遠都記住 只要是打仗（48-011）", "老師：這個唯一的根本標準 簡答題 好（48-011）", "投影片黃字／黃筆標記（48-011）"]}, {"id": "C48-11", "l": 48, "ch": 14, "s": [14, 15, 16], "src": "", "tag": ["選擇題考點"], "t": "鞏固提高一體化國家戰略體系和能力", "p": "是黨中央著眼更好統籌發展和安全、更好統籌經濟建設和國防建設作出的戰略部署；在國家總體戰略中統一富國和強軍兩大目標、統籌發展和安全兩件大事、統合經濟和國防兩種實力。關鍵是要在一體化上下功夫（講師：「選擇題考點」）。軍政軍民團結是實現富國和強軍相統一的重要政治保障。", "o": "统一〖富国和强军〗两大目标、统筹〖发展和安全〗两件大事、统合〖经济和国防〗两种实力；巩固提高一体化国家战略体系和能力，关键是要在〖一体化〗上下功夫；〖军政军民团结〗是实现富国和强军相统一的〖重要政治保障〗", "m": "「兩大目標・兩件大事・兩種實力；關鍵＝一體化；軍政軍民團結＝政治保障」。", "pt": "A", "ps": 19, "pr": ["老師：選擇題考點（48-014）", "投影片黃字／黃筆標記（48-016）"]}, {"id": "C49-01", "l": 49, "ch": 15, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "「一國兩制」的含義（基本國策）", "p": "講師：「注意啊，以憲法和基本法為基礎」「享有，注意，叫做高度的自治權」。作為一項基本國策，「一國兩制」是指在統一的國家之內，主體實行社會主義制度，個別地區依法實行資本主義制度；保持港澳原有的資本主義制度和生活方式不變、法律基本不變；特別行政區享有高度自治權，包括行政管理權、立法權、獨立的司法權和終審權。", "o": "在统一的国家之内，主体实行〖社会主义制度〗，个别地区依法实行〖资本主义制度〗。这一制度以〖宪法和基本法〗为基础……享有〖高度自治权〗，包括行政管理权、立法权、独立的司法权和终审权", "m": "「主體社會主義＋個別資本主義；憲法＋基本法；高度自治（行政・立法・司法・終審）」。", "pt": "A", "ps": 17, "pr": ["老師：…我們一國兩制 你們需要去背的是哪些呢 一國兩制（49-005）", "老師：注意啊，以憲法和基本法為基礎（49-005）", "投影片黃字／黃筆標記（49-005）"]}, {"id": "C49-02", "l": 49, "ch": 15, "s": [5, 6], "src": "", "tag": ["必背", "簡答題考點"], "t": "「一國兩制」是中國特色社會主義的偉大創舉（三點）", "p": "講師：「你們需要去背的是……黃色的標題背過。」（1）「一國兩制」是中國特色社會主義制度創新的重要成果；（2）「一國兩制」是中國共產黨領導人民實現祖國和平統一的偉大構想；（3）「一國兩制」為國際社會解決類似問題提供了新思路新方案。", "o": "“一国两制”是中国特色社会主义〖制度创新的重要成果〗；“一国两制”是中国共产党领导人民实现祖国和平统一的〖伟大构想〗；“一国两制”为国际社会解决类似问题提供了〖新思路新方案〗", "m": "「制度創新成果・和平統一構想・國際新方案」。", "items": ["“一国两制”是中国特色社会主义制度创新的重要成果", "“一国两制”是中国共产党领导人民实现祖国和平统一的伟大构想", "“一国两制”为国际社会解决类似问题提供了新思路新方案"], "pt": "A", "ps": 33, "pr": ["老師：…我們一國兩制 你們需要去背的是哪些呢 一國兩制（49-005）", "同頁有考點提示：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-005）"]}, {"id": "C49-03", "l": 49, "ch": 15, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "「一國兩制」最早是針對台灣問題提出的", "p": "講師：「它會問你一國兩制最早是針對什麼提出來的，你記住要解決台灣問題。」「一國兩制」偉大構想，最早是針對台灣問題提出來的，首先運用於解決香港和澳門問題。", "o": "“一国两制”伟大构想，最早是针对〖台湾问题〗提出来的，首先运用于解决〖香港和澳门问题〗", "m": "「為台灣而提出，先在港澳用」。", "pt": "B", "ps": 5, "pr": ["同頁有考點提示：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-006）"]}, {"id": "C49-04", "l": 49, "ch": 15, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "「一國兩制」是一項重要制度、一項基本國策", "p": "講師：「是我國的一項基本國策，選擇題應該會做。」「一國兩制」是黨領導人民實現祖國和平統一的一項重要制度，是國家的一項基本國策；包含了中華文化中的和合理念，體現了尊重差異、求同存異的思維方式。", "o": "“一国两制”是党领导人民实现祖国和平统一的一项〖重要制度〗，是国家的一项〖基本国策〗；包含了中华文化中的〖和合理念〗", "m": "「重要制度＋基本國策＋和合理念」。", "pt": "A", "ps": 22, "pr": ["老師：…是我國的一項基本國策 選擇題應該會做 它是一項基本的…（49-006）", "投影片黃字／黃筆標記（49-006）"]}, {"id": "C49-05", "l": 49, "ch": 15, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "「一國兩制」的根本宗旨", "p": "講師：「根本宗旨，把它記住。」「一國兩制」的根本宗旨是維護國家主權、安全、發展利益，保持香港、澳門長期繁榮穩定。", "o": "“一国两制”的根本宗旨是维护国家〖主权、安全、发展利益〗，保持香港、澳门〖长期繁荣稳定〗", "m": "「主權安全發展利益＋港澳長期繁榮穩定」。", "pt": "A", "ps": 14, "pr": ["老師：…需要去把那個黃色的標題背過 就回答的是什麼（49-007）", "投影片黃字／黃筆標記（49-007）"]}, {"id": "C49-06", "l": 49, "ch": 15, "s": [8], "src": "", "tag": ["必背", "選擇題考點", "簡答題考點", "易混"], "t": "「一國」和「兩制」的關係", "p": "講師：「選擇題考點，同樣這也是簡答題考點，它要讓你去論述一國和兩制的關係。」維護國家主權、安全、發展利益是「一國兩制」方針的最高原則。「一國」是實行「兩制」的前提和基礎，「兩制」從屬和派生於「一國」，並統一於「一國」之內。「一國是根，根深才能葉茂；一國是本，本固才能枝榮。」", "o": "维护国家主权、安全、发展利益是“一国两制”方针的〖最高原则〗；“一国”是实行“两制”的〖前提和基础〗，“两制”〖从属和派生〗于“一国”，并统一于“一国”之内；“一国是〖根〗，根深才能叶茂；“一国”是〖本〗，本固才能枝荣", "m": "「一國＝前提基礎＝根本；兩制＝從屬派生」；「一國底線越牢，兩制空間越大」。", "pt": "A", "ps": 58, "pr": ["老師：來了 選擇提考點 同樣（49-008）", "老師：同樣 這也是簡單提考點 它要讓你去論述一國和兩制的…（49-008）", "老師：…這就是一國兩制的關係 選擇題 選擇題（49-008）"]}, {"id": "C49-07", "l": 49, "ch": 15, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "「兩制」並非等量齊觀", "p": "「一國」之內的「兩制」並非等量齊觀、比肩並列，國家的主體必須實行社會主義制度。社會主義制度是中華人民共和國的根本制度，中國共產黨領導是中國特色社會主義最本質的特徵（講師：「也是選擇題」），特別行政區所有居民應該自覺尊重和維護國家的根本制度。", "o": "“一国”之内的“两制”并非〖等量齐观〗、比肩并列，国家的主体必须实行〖社会主义制度〗；中国共产党领导是中国特色社会主义〖最本质的特征〗", "m": "「主體社會主義；黨的領導＝最本質特徵」。", "pt": "A", "ps": 22, "pr": ["老師：最本質的特徵 也是選擇題 特別行政區（49-009）", "老師：也是選擇題（49-009）", "投影片黃字／黃筆標記（49-009）"]}, {"id": "C49-08", "l": 49, "ch": 15, "s": [10], "src": "", "tag": ["必背", "簡答題考點"], "t": "準確把握「一國兩制」的科學內涵（五點）", "p": "（1）牢牢把握「一國兩制」的根本宗旨；（2）準確把握「一國」和「兩制」的關係；（3）堅持中央全面管治權和保障特別行政區高度自治權相統一（我國是單一制國家）；（4）堅定落實「愛國者治港」「愛國者治澳」原則；（5）堅持依法治港治澳。", "o": "牢牢把握“一国两制”的〖根本宗旨〗；准确把握“一国”和“两制”的〖关系〗；坚持〖中央全面管治权〗和保障特别行政区〖高度自治权〗相统一；坚定落实〖“爱国者治港”〗“爱国者治澳”原则；坚持〖依法治港治澳〗", "m": "「宗旨・關係・管治權+自治權・愛國者・依法」。", "items": ["牢牢把握“一国两制”的根本宗旨", "准确把握“一国”和“两制”的关系", "坚持中央全面管治权和保障特别行政区高度自治权相统一", "坚定落实“爱国者治港”“爱国者治澳”原则", "坚持依法治港治澳"], "pt": "C", "ps": 0, "pr": []}, {"id": "C49-09", "l": 49, "ch": 15, "s": [10], "src": "", "tag": ["選擇題考點"], "t": "單一制國家、愛國者治港、依法治港", "p": "我國是單一制國家，中央對包括港澳在內的所有地方行政區域擁有全面管治權。政權必須掌握在愛國者手中，這是世界通行的政治法則。依法治理是最可靠、最穩定的治理；憲法和基本法共同構成特別行政區的憲制基礎；憲法是特別行政區制度的法律淵源。", "o": "我国是〖单一制〗国家；政权必须掌握在〖爱国者〗手中，这是世界通行的政治法则；〖宪法和基本法〗共同构成特别行政区的〖宪制基础〗", "m": "「單一制；愛國者；憲法＋基本法＝憲制基礎」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C49-10", "l": 49, "ch": 15, "s": [11], "src": "", "tag": ["簡答題考點"], "t": "堅持和完善「一國兩制」制度體系（三點）", "p": "（1）加強依法治理相關制度和機制建設；（2）健全中央行使全面管治權的制度；（3）為落實愛國者治理提供制度保障——確保特別行政區行政、立法、司法機構的組成人員等都由真正的愛國者擔任。", "o": "加强〖依法治理〗相关制度和机制建设；健全中央行使〖全面管治权〗的制度；为落实〖爱国者治理〗提供制度保障", "m": "「依法・管治權・愛國者」。", "items": ["加强依法治理相关制度和机制建设", "健全中央行使全面管治权的制度", "为落实爱国者治理提供制度保障"], "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（49-011）"]}, {"id": "C50-01", "l": 50, "ch": 15, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "青少年是港澳長期繁榮穩定的希望和未來", "p": "港澳特區政府大力加強對青少年的憲法和基本法教育、國情教育、中國歷史和中華文化教育，增強國家意識和愛國精神，使「一國兩制」事業後繼有人。", "o": "〖青少年〗是港澳长期繁荣稳定的〖希望和未来〗；加强对香港、澳门社会特别是青少年的〖宪法和基本法〗教育、〖国情〗教育、〖中国历史和中华文化〗教育", "m": "「青少年＝希望和未來」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-003）"]}, {"id": "C50-02", "l": 50, "ch": 15, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "「一國兩制」是保持港澳長期繁榮穩定的好制度", "p": "講師：「那麼注意了。」香港、澳門回歸祖國後，走上了同祖國內地優勢互補、共同發展的寬廣道路，「一國兩制」實踐取得舉世公認的成功。「一國兩制」是保持港澳長期繁榮穩定的好制度，是保障港澳居民根本利益和福祉的好制度。", "o": "走上了同祖国内地〖优势互补〗、〖共同发展〗的宽广道路，“一国两制”实践取得〖举世公认〗的成功；“一国两制”是保持港澳〖长期繁荣稳定〗的好制度，是保障港澳居民〖根本利益和福祉〗的好制度", "m": "「兩個好制度：繁榮穩定・根本利益和福祉」。", "pt": "B", "ps": 5, "pr": ["老師：那麼注意了。（50-004）", "投影片黃字／黃筆標記（50-004）"]}, {"id": "C50-03", "l": 50, "ch": 15, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "由亂到治走向由治及興", "p": "講師：「走向由治及興的新階段，這是一個選擇題。」「一國兩制」的提出首先是為了實現和維護國家統一；面對香港局勢動盪，黨中央採取一系列標本兼治的舉措，推動香港局勢實現由亂到治的重大轉折。", "o": "推动香港进入由〖乱〗到〖治〗走向由〖治〗及〖兴〗的新阶段；“一国两制”的提出首先是为了实现和维护〖国家统一〗", "m": "「亂→治→興」。", "pt": "A", "ps": 15, "pr": ["老師：…及興的新階段，這是一個選擇題。（50-005）", "投影片黃字／黃筆標記（50-005）"]}, {"id": "C50-04", "l": 50, "ch": 15, "s": [6], "src": "", "tag": ["選擇題考點", "易混"], "t": "香港維護國家安全：中央根本責任＋特區憲制責任", "p": "建立健全香港特別行政區維護國家安全的法律制度和執行機制：中央政府對香港特區有關的國家安全事務負有根本責任，香港特區負有維護國家安全的憲制責任。完善香港特區選舉制度，全面落實「愛國者治港」原則。", "o": "中央政府对香港特别行政区有关的国家安全事务负有〖根本责任〗，香港特别行政区负有维护国家安全的〖宪制责任〗", "m": "「中央＝根本責任；特區＝憲制責任」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-006）"]}, {"id": "C50-05", "l": 50, "ch": 15, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "以行政長官為核心的行政主導體制", "p": "堅持以行政長官為核心的行政主導體制，支持行政長官和特區政府依法施政、積極作為。行政長官和特別行政區政府是香港的當家人，也是治理香港的第一責任人。", "o": "坚持以〖行政长官〗为核心的〖行政主导〗体制；行政长官和特别行政区政府是香港的〖当家人〗，也是治理香港的〖第一责任人〗", "m": "「行政長官＝核心＝當家人＝第一責任人」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-006）"]}, {"id": "C50-06", "l": 50, "ch": 15, "s": [5, 6, 7], "src": "", "tag": ["簡答題考點"], "t": "推動香港由亂到治走向由治及興（五個要點）", "p": "講師：「我們五個要點，我已經跟大家說要去背哪些了」「把這第五個要點這一句背過就可以了」。（1）「一國兩制」的提出首先是為了實現和維護國家統一；（2）建立健全香港特區維護國家安全的法律制度和執行機制；（3）完善香港特區選舉制度；（4）堅持以行政長官為核心的行政主導體制；（5）香港已實現由亂到治的重大轉折，正處在由治及興的關鍵時期。", "o": "香港已实现〖由乱到治〗的重大转折，正处在〖由治及兴〗的关键时期", "m": "「統一・國安法制・選舉制度・行政主導・由治及興」。", "items": ["“一国两制”的提出首先是为了实现和维护国家统一", "建立健全香港特别行政区维护国家安全的法律制度和执行机制", "完善香港特别行政区选举制度", "坚持以行政长官为核心的行政主导体制", "香港已实现由乱到治的重大转折，正处在由治及兴的关键时期"], "pt": "A", "ps": 62, "pr": ["老師：…一個關鍵時期 這個你就需要去記住就可以了 把這第五個…（50-007）", "老師：這一句 背過就可以了 那麼知識點二（50-007）", "老師：…要點 我已經跟大家說要去背哪些了 所以大家要清晰（50-007）"]}, {"id": "C50-07", "l": 50, "ch": 15, "s": [8, 9, 10], "src": "", "tag": ["必背", "簡答題考點"], "t": "支持香港、澳門融入國家發展大局（四個「積極主動」）", "p": "（1）積極主動助力國家全面開放（以「港澳所長」對接「國家所需」，講師重複兩次）；（2）積極主動參與粵港澳大灣區建設；（3）積極主動參與國家治理實踐；（4）積極主動促進國際人文交流。", "o": "积极主动助力〖国家全面开放〗；积极主动参与〖粤港澳大湾区〗建设；积极主动参与〖国家治理实践〗；积极主动促进〖国际人文交流〗", "m": "「開放・大灣區・治理・人文」。", "items": ["积极主动助力国家全面开放", "积极主动参与粤港澳大湾区建设", "积极主动参与国家治理实践", "积极主动促进国际人文交流"], "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（50-008）"]}, {"id": "C50-08", "l": 50, "ch": 15, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "以「港澳所長」對接「國家所需」", "p": "在國家擴大對外開放過程中，港澳的地位和作用只會加強，不會減弱。要以「港澳所長」對接「國家所需」。建設粵港澳大灣區是黨中央立足全局和長遠作出的重大決策，也是保持港澳長期繁榮穩定的重大舉措。", "o": "香港、澳门的地位和作用只会〖加强〗，不会〖减弱〗；以〖“港澳所长”〗对接〖“国家所需”〗", "m": "「只會加強，不會減弱；港澳所長↔國家所需」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（50-008）"]}, {"id": "C50-09", "l": 50, "ch": 15, "s": [10], "src": "", "tag": ["必背", "選擇題考點"], "t": "香港「三個最大」與澳門「重要平台」", "p": "講師：「它就是我們中國連接世界的兩個重要的窗口，所以我們要注意。」香港是我國內地最大的外資來源地、對外投資最大目的地、對外貿易最大轉口地；澳門是我國雙向開放特別是與葡語國家經貿往來的重要平台。港澳是中西文化交流的重要紐帶。", "o": "香港是我国内地最大的〖外资来源地〗、对外投资最大〖目的地〗、对外贸易最大〖转口地〗，澳门是我国双向开放特别是与〖葡语国家〗经贸往来的重要平台", "m": "「香港三最大（外資來源・投資目的・貿易轉口）；澳門＝葡語國家平台」。", "pt": "B", "ps": 5, "pr": ["老師：…重要的窗口，所以我們要注意。（50-010）", "投影片黃字／黃筆標記（50-010）"]}, {"id": "C51-01", "l": 51, "ch": 15, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "國家統一永遠是中國核心利益的核心", "p": "民族復興、國家統一是大勢所趨、大義所在、民心所向。中華文明具有突出的統一性，國家統一永遠是中國核心利益的核心。台灣問題因民族弱亂而產生，必將隨着民族復興而解決。", "o": "国家统一永远是中国〖核心利益的核心〗；台湾问题因民族〖弱乱〗而产生，必将随着民族〖复兴〗而解决", "m": "「弱亂而生，復興而解」；「核心利益的核心」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-003）"]}, {"id": "C51-02", "l": 51, "ch": 15, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "台灣前途在於國家統一，台灣同胞福祉繫於民族復興", "p": "兩岸關係和平發展是維護兩岸和平、促進兩岸共同發展、造福兩岸同胞的正確道路；要兩岸同胞共同推動、共同維護、共同分享。中國夢是兩岸同胞共同的夢。", "o": "台湾前途在于〖国家统一〗，台湾同胞福祉系于〖民族复兴〗", "m": "「前途→統一；福祉→復興」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-003）"]}, {"id": "C51-03", "l": 51, "ch": 15, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "統一是正道，「台獨」是絕路；最大現實威脅", "p": "統一是歷史大勢，是正道；「台獨」是歷史逆流，是絕路。對兩岸關係和平發展的最大現實威脅是「台獨」勢力及其分裂活動。習近平指出：「實現祖國完全統一是全體中華兒女的共同願望，是民族復興的題中之義。」", "o": "统一是历史大势，是〖正道〗；“台独”是历史逆流，是〖绝路〗；对两岸关系和平发展的〖最大现实威胁〗是“台独”势力及其分裂活动", "m": "「正道 vs 絕路」；「最大現實威脅＝台獨」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-004）"]}, {"id": "C51-04", "l": 51, "ch": 15, "s": [6], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "新時代黨解決台灣問題的總體方略（十個「這是統一的……」）", "p": "講師：「我們這十個內容呢，必須要去把它給記住了」「很有可能是今年的我們的一個重點的考點」「我不要求大家全部一字不落的背過，但是你至少做選擇題你必須要會去做」。", "o": "坚持党中央对对台工作的集中统一领导，这是统一的〖根本保证〗；坚持“和平统一、一国两制”基本方针，这是统一的〖大政方针〗；坚持一个中国原则和“九二共识”，这是统一的〖政治基础〗；坚持团结台湾同胞、争取台湾民心，这是统一的〖根本动力〗", "m": "「黨中央＝根本保證；復興進程＝歷史方位；大陸發展＝戰略思路；和統一兩＝大政方針；一中九二＝政治基礎；和平融合發展＝實踐途徑；台灣民心＝根本動力；粉碎台獨＝必然要求；反干涉＝外部條件；不放棄武力＝戰略支撐」。", "pt": "A", "ps": 58, "pr": ["老師：…我們這十個內容呢 必須要去把它給記住了啊 很有可能是…（51-006）", "老師：…撐分別都是什麼 我們都需要去記住啊 記憶住（51-006）", "老師：這是統一的根本保證 選擇題 第二（51-006）"]}, {"id": "C51-05", "l": 51, "ch": 15, "s": [7], "src": "", "tag": ["選擇題考點"], "t": "總體方略的地位", "p": "新時代黨解決台灣問題的總體方略是我們黨對台大政方針的繼承發展和集大成；標誌着黨的國家統一理論更加成熟，是黨解決台灣問題、實現祖國統一的最新理論成果，是新時代新征程推進祖國統一大業的科學指南和行動綱領。", "o": "是我们党对台大政方针的〖继承发展和集大成〗；是我们党解决台湾问题、实现祖国统一的〖最新理论成果〗，是新时代新征程推进祖国统一大业的〖科学指南和行动纲领〗", "m": "「集大成・最新理論成果・科學指南和行動綱領」。", "pt": "C", "ps": 0, "pr": []}, {"id": "C51-06", "l": 51, "ch": 15, "s": [8], "src": "", "tag": ["必背", "選擇題考點"], "t": "「和平統一、一國兩制」是實現兩岸統一的最佳方式", "p": "把握兩岸關係主導權和主動權，必須堅持一個中國原則和「九二共識」，堅決反對「台獨」分裂行徑，堅決反對外部勢力干涉。「和平統一、一國兩制」既充分考慮台灣現實情況，又有利於統一後台灣長治久安，對兩岸同胞和全民族最有利。", "o": "“和平统一、一国两制”方针是实现两岸统一的〖最佳方式〗", "m": "「最佳方式＝和統一兩」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-008）"]}, {"id": "C51-07", "l": 51, "ch": 15, "s": [8, 9], "src": "", "tag": ["簡答題考點"], "t": "牢牢把握兩岸關係主導權和主動權（三點）", "p": "（1）「和平統一、一國兩制」方針是實現兩岸統一的最佳方式；（2）促進兩岸經濟文化交流合作，深化兩岸各領域融合發展（推進兩岸經濟合作制度化，打造兩岸共同市場）；（3）堅持以最大誠意、盡最大努力爭取和平統一的前景，但決不承諾放棄使用武力。", "o": "坚持以最大诚意、尽最大努力争取〖和平统一〗的前景，但决不承诺〖放弃使用武力〗", "m": "「最佳方式・融合發展・不放棄武力」。", "items": ["“和平统一、一国两制”方针是实现两岸统一的最佳方式", "促进两岸经济文化交流合作，深化两岸各领域融合发展", "坚持以最大诚意、尽最大努力争取和平统一的前景，但决不承诺放弃使用武力"], "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（51-009）"]}, {"id": "C51-08", "l": 51, "ch": 15, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "國家主權和領土完整是不可逾越的紅線", "p": "確保國家主權和領土完整是國家核心利益，是一條不可逾越的紅線。", "o": "确保国家主权和领土完整是国家〖核心利益〗，是一条不可逾越的〖红线〗", "m": "「主權領土＝紅線」。", "pt": "B", "ps": 2, "pr": ["投影片黃字／黃筆標記（51-009）"]}, {"id": "C52-01", "l": 52, "ch": 16, "s": [2], "src": "", "tag": ["選擇題考點"], "t": "第十六章是過往考試重點", "p": "講師：「這一章的內容在過往的考試中處於比較高的重點，所以要求大家必須要重點學習第16章。」本章重難點包括：百年未有之大變局、中國特色大國外交、國際影響力感召力塑造力顯著提升、和平發展道路、新型國際關係、維護國家主權安全發展利益、外交為民、人類命運共同體、全球治理、「一帶一路」。", "o": "第十六章 〖中国特色大国外交〗和推动构建〖人类命运共同体〗", "m": "「大國外交＋命運共同體」。", "pt": "A", "ps": 17, "pr": ["老師：…試中呢 它處於我們大體考評比較高的重點（52-002）"]}, {"id": "C52-02", "l": 52, "ch": 16, "s": [7], "src": "", "tag": ["選擇題考點"], "t": "百年未有之大變局的兩方面", "p": "一方面，世界多極化、經濟全球化、社會信息化、文化多樣化深入發展，和平、發展、合作、共贏的歷史潮流不可阻擋；另一方面，世界面臨的不穩定性不確定性突出，全球性問題加劇。世界又一次站在歷史的十字路口。", "o": "世界〖多极化〗、经济〖全球化〗、社会〖信息化〗、文化〖多样化〗深入发展，〖和平、发展、合作、共赢〗的历史潮流不可阻挡", "m": "「多極・全球・信息・多樣」；「和發合贏」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C52-03", "l": 52, "ch": 16, "s": [8, 9, 10], "src": "", "tag": ["必背", "簡答題考點"], "t": "百年未有之大變局的表現（標題要背）", "p": "講師：「這個首先你標題你得背過」「這是要求大家背過的」。（1）國際力量對比深刻變化——新興市場國家和發展中國家群體性崛起，「東升西降」「中治西亂」更加鮮明，這是近代以來國際力量對比中最具革命性的變化；（2）新一輪科技革命和產業變革深入發展；（3）國際體系和國際秩序深度調整——國際關係民主化不可阻擋。", "o": "〖国际力量对比〗深刻变化；新一轮〖科技革命和产业变革〗深入发展；〖国际体系和国际秩序〗深度调整", "m": "「力量對比・科技產業・體系秩序」。", "items": ["国际力量对比深刻变化", "新一轮科技革命和产业变革深入发展", "国际体系和国际秩序深度调整"], "pt": "A", "ps": 62, "pr": ["老師：…家 這是一道實證題之前考過 大家記一下順便記一下哈（52-009）", "老師：…個體現 這是要要求大家背過的 等一下我會帶着大家再梳…（52-010）", "老師：…因爲這一章 我們的一個要背的內容還挺多的 所以我會帶…（52-010）"]}, {"id": "C52-04", "l": 52, "ch": 16, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "近代以來國際力量對比中最具革命性的變化", "p": "新興市場國家和發展中國家群體性崛起，發達國家實力相對下降，「東升西降」「中治西亂」更加鮮明。這是近代以來國際力量對比中最具革命性的變化。", "o": "新兴市场国家和发展中国家〖群体性崛起〗；“〖东升西降〗”“〖中治西乱〗”更加鲜明；这是近代以来国际力量对比中〖最具革命性〗的变化", "m": "「群體性崛起＝最具革命性」。", "pt": "A", "ps": 14, "pr": ["老師：這個首先你標題 你得背過 那麼它表現在（52-008）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C52-05", "l": 52, "ch": 16, "s": [11], "src": "", "tag": ["選擇題考點"], "t": "四大赤字", "p": "世界進入新的動盪變革期；和平赤字、發展赤字、安全赤字、治理赤字有增無減；公共衛生、恐怖主義、氣候變化、網絡安全等非傳統安全威脅持續蔓延。", "o": "〖和平〗赤字、〖发展〗赤字、〖安全〗赤字、〖治理〗赤字有增无减", "m": "「和・發・安・治」四赤字。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C52-06", "l": 52, "ch": 16, "s": [14], "src": "", "tag": ["必背", "選擇題考點"], "t": "正確的歷史觀、大局觀、角色觀", "p": "中國特色大國外交建立在正確的歷史觀、大局觀、角色觀基礎之上。歷史觀＝端起歷史望遠鏡回顧過去、展望未來；大局觀＝把握本質和全局，抓住主要矛盾；角色觀＝把自己擺進去，弄清中國在世界格局演變中的地位和作用。", "o": "把握国际形势要树立正确的〖历史观〗、〖大局观〗、〖角色观〗", "m": "「歷史・大局・角色」三觀；望遠鏡＝歷史觀；擺進去＝角色觀。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C52-07", "l": 52, "ch": 16, "s": [15], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "大國外交的主線與總目標", "p": "中國特色大國外交牢牢把握服務民族復興、促進人類進步這條主線；以推動構建人類命運共同體為總目標；始終堅持維護世界和平、促進共同發展的宗旨。", "o": "牢牢把握服务〖民族复兴〗、促进〖人类进步〗这条主线；以推动构建〖人类命运共同体〗为总目标；坚持〖维护世界和平、促进共同发展〗的宗旨", "m": "「主線＝復興＋進步；總目標＝命運共同體；宗旨＝和平＋發展」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C52-08", "l": 52, "ch": 16, "s": [16], "src": "", "tag": ["選擇題考點"], "t": "外交大權在黨中央", "p": "中國特色大國外交堅持正確的原則要求：堅持和加強黨對對外工作的集中統一領導，堅持外交大權在黨中央；堅持以中國特色社會主義為根本增強戰略自信。", "o": "坚持和加强党对对外工作的〖集中统一领导〗，坚持外交大权在〖党中央〗", "m": "「外交大權在黨中央」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C52-09", "l": 52, "ch": 16, "s": [17], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "「以……為基礎／原則／理念／底線」", "p": "講師多處標「選擇」：堅持以相互尊重、合作共贏為基礎走和平發展道路；以共商共建共享為原則推動「一帶一路」建設；始終做世界和平的建設者、全球發展的貢獻者、國際秩序的維護者（講師：「要背到這裏」）；以公平正義為理念引領全球治理體系改革；以國家核心利益為底線維護國家主權、安全、發展利益。", "o": "以〖相互尊重、合作共赢〗为基础走和平发展道路；以〖共商共建共享〗为原则推动“一带一路”建设；以〖公平正义〗为理念引领全球治理体系改革；以〖国家核心利益〗为底线维护国家主权、安全、发展利益", "m": "「基礎＝尊重共贏；原則＝共商共建共享；理念＝公平正義；底線＝核心利益」。", "pt": "A", "ps": 44, "pr": ["老師：從最開始 這裏背到這裏 就是第五個點（52-017）", "老師：要背到這裏（52-017）", "老師：…以國家核心利益爲底線 選擇題啊 堅持以國家核心利益爲…（52-017）"]}, {"id": "C52-10", "l": 52, "ch": 16, "s": [17], "src": "", "tag": ["選擇題考點"], "t": "三個「者」與「參與者、推動者、引領者」", "p": "始終做世界和平的建設者、全球發展的貢獻者、國際秩序的維護者；積極做全球治理變革進程的參與者、推動者、引領者。", "o": "始终做世界和平的〖建设者〗、全球发展的〖贡献者〗、国际秩序的〖维护者〗", "m": "「和平建設・發展貢獻・秩序維護」。", "pt": "A", "ps": 31, "pr": ["老師：…的維護者 這裏毋庸置疑要背到這裏 從最開始（52-017）", "老師：從最開始 這裏背到這裏 就是第五個點（52-017）", "同頁有考點提示：…以國家核心利益爲底線 選擇題啊 堅持以國家核心利益爲…（52-017）"]}, {"id": "C52-11", "l": 52, "ch": 16, "s": [19], "src": "", "tag": ["選擇題考點"], "t": "大國外交展現獨特風範：愛國主義同國際主義相結合", "p": "講師：「我們需要背的呢，就是前面一句而已。」堅持愛國主義同國際主義相結合，堅持中國人民利益同各國人民共同利益相結合。風範包括守正創新的大國氣派、立己達人的世界情懷、開放包容的寬廣胸襟、重情尚義的崇高品格。", "o": "坚持〖爱国主义〗同〖国际主义〗相结合，坚持〖中国人民利益〗同〖各国人民共同利益〗相结合", "m": "「愛國＋國際；中國人民＋各國人民」。", "pt": "A", "ps": 26, "pr": ["老師：…上億的崇高品格 我們需要背的呢 就是前面一句而已（52-019）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C52-12", "l": 52, "ch": 16, "s": [21, 22], "src": "", "tag": ["選擇題考點"], "t": "國際影響力的體現：全球夥伴關係與全球治理觀", "p": "在和平共處五項基本原則基礎上積極發展全球夥伴關係（講師：選擇）；以元首外交為外交全局提供戰略引領；提出全球發展倡議、全球安全倡議、全球文明倡議；倡導共商共建共享的全球治理觀（講師：「這個就是我們的全球治理觀，選擇」）。", "o": "倡导〖共商共建共享〗的全球治理观；以精彩纷呈的〖元首外交〗为外交全局提供战略引领；提出全球〖发展〗倡议、全球〖安全〗倡议、全球〖文明〗倡议", "m": "「三大全球倡議：發展・安全・文明」。", "pt": "A", "ps": 17, "pr": ["老師：…族的尊嚴 這個需要我們去背倒 就是到這裏（52-022）", "老師：…就是我們的全球治理觀，選擇（52-021）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C52-13", "l": 52, "ch": 16, "s": [23], "src": "", "tag": ["選擇題考點"], "t": "構建人類命運共同體成為鮮明旗幟", "p": "講師：「我們需要記住構建人類命運共同體。」構建人類命運共同體成為引領時代潮流和人類前進方向的鮮明旗幟，我國國際影響力、感召力、塑造力顯著提升；構建人類命運共同體倡議已被多次寫入聯合國文件。", "o": "构建人类命运共同体成为引领〖时代潮流〗和〖人类前进方向〗的鲜明旗帜，我国国际〖影响力、感召力、塑造力〗显著提升", "m": "「影響力・感召力・塑造力」。", "pt": "A", "ps": 26, "pr": ["老師：所以這裏呢 我們需要記住構建人類命運共同體 第三（52-023）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-01", "l": 53, "ch": 16, "s": [4], "src": "", "tag": ["必背", "選擇題考點"], "t": "和平發展道路是新時代中國外交的基本原則", "p": "講師：「來先把這個選擇題的考點給我拿下」「這一句記住」。堅持走和平發展道路，是我們黨根據時代發展潮流和我國根本利益作出的戰略抉擇，是新時代中國外交的基本原則。習近平指出：中國走和平發展道路，不是權宜之計，更不是外交辭令，而是思想自信和實踐自覺的有機統一。", "o": "坚持走和平发展道路，是我们党根据〖时代发展潮流〗和我国〖根本利益〗作出的〖战略抉择〗，是新时代中国外交的〖基本原则〗", "m": "「和平發展道路＝戰略抉擇＝基本原則」。", "pt": "A", "ps": 29, "pr": ["老師：…來先把這個選擇提高的考點給我拿下 堅持走和平發展道…（53-004）", "投影片黃字／黃筆標記（53-004）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-02", "l": 53, "ch": 16, "s": [4], "src": "", "tag": ["選擇題考點"], "t": "不是權宜之計，更不是外交辭令", "p": "習近平指出：「中國走和平發展道路，不是權宜之計，更不是外交辭令，而是從歷史、現實、未來的客觀判斷中得出的結論，是思想自信和實踐自覺的有機統一。」", "o": "中国走和平发展道路，不是〖权宜之计〗，更不是〖外交辞令〗，而是从历史、现实、未来的客观判断中得出的结论，是〖思想自信〗和〖实践自觉〗的有机统一", "m": "「不是權宜、不是辭令；自信＋自覺」。", "pt": "B", "ps": 7, "pr": ["同頁有考點提示：…來先把這個選擇提高的考點給我拿下 堅持走和平發展道…（53-004）", "投影片黃字／黃筆標記（53-004）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-03", "l": 53, "ch": 16, "s": [5, 6, 7], "src": "", "tag": ["簡答題考點"], "t": "為什麼要走和平發展道路", "p": "（1）走和平發展道路是由中國共產黨性質宗旨和我國社會主義制度決定的——我們決不以損害別國利益來實現自己的發展；（2）走和平發展道路是基於中國歷史文化傳統作出的必然選擇——中華文明具有突出的和平性，「國雖大，好戰必亡」；（3）走和平發展道路符合歷史潮流、順應世界大勢。", "o": "走和平发展道路是由中国共产党〖性质宗旨〗和我国〖社会主义制度〗决定的；走和平发展道路是基于中国〖历史文化传统〗作出的必然选择；走和平发展道路符合〖历史潮流〗、顺应〖世界大势〗", "m": "「黨性制度・歷史文化・時代潮流」。", "items": ["走和平发展道路是由中国共产党性质宗旨和我国社会主义制度决定的", "走和平发展道路是基于中国历史文化传统作出的必然选择", "走和平发展道路符合历史潮流、顺应世界大势"], "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（53-006）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-04", "l": 53, "ch": 16, "s": [6], "src": "", "tag": ["選擇題考點"], "t": "中華文明具有突出的和平性", "p": "中華民族是愛好和平的民族，中華文明具有突出的和平性。中國自古就有「國雖大，好戰必亡」的箴言，「以和為貴」「和而不同」「睦鄰友邦」「天下大同」等理念世代相傳。", "o": "中华文明具有突出的〖和平性〗；“国虽大，〖好战必亡〗”", "m": "「好戰必亡」。", "pt": "B", "ps": 4, "pr": ["投影片黃字／黃筆標記（53-006）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-05", "l": 53, "ch": 16, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "堅定奉行獨立自主的和平外交政策", "p": "中國始終根據事情本身的是非曲直決定自己的立場和政策；堅持國家不分大小、強弱、貧富一律平等；反對一切形式的霸權主義和強權政治；中國奉行防禦性的國防政策，無論發展到什麼程度，中國永遠不稱霸、永遠不搞擴張。", "o": "中国始终根据事情本身的〖是非曲直〗决定自己的立场和政策；坚持国家不分大小、强弱、贫富〖一律平等〗；中国永远不〖称霸〗、永远不搞〖扩张〗", "m": "「是非曲直定立場；永不稱霸、永不擴張」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-06", "l": 53, "ch": 16, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "以相互尊重、合作共贏為基礎同世界各國交往", "p": "講師：「相互尊重合作共贏為基礎同世界各國交往，選擇題考點」。走和平發展道路，既要通過維護世界和平發展自己，又要通過自身發展維護世界和平。", "o": "中国坚持以〖相互尊重、合作共赢〗为基础同世界各国交往；既要通过维护世界和平〖发展自己〗，又要通过自身发展〖维护世界和平〗", "m": "「和平↔發展互相成就」。", "pt": "A", "ps": 28, "pr": ["老師：…同世界各國交往選擇提考點 相互尊重合作共贏爲基礎（53-009）", "投影片黃字／黃筆標記（53-009）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-07", "l": 53, "ch": 16, "s": [10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "新型國際關係：對話而不對抗，結伴而不結盟", "p": "講師：「我們中國是不結盟的，所以你在任何的考試中你看到選擇題講到外交（結盟），全部都錯」「記住是對話而不對抗，結伴而不結盟」。推動構建新型國際關係，就是要秉持相互尊重、公平正義、合作共贏原則。", "o": "推动构建新型国际关系，就是要秉持〖相互尊重、公平正义、合作共赢〗原则，走出一条〖对话而不对抗〗、〖结伴而不结盟〗的国与国交往新路", "m": "「結伴不結盟」——見到「結盟」即錯。", "pt": "A", "ps": 37, "pr": ["老師：我們的外交部局 一定要把這個記住 一個多選題考點（53-010）", "老師：…在任何的考試中 你看到選擇題（53-010）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-08", "l": 53, "ch": 16, "s": [10], "src": "", "tag": ["選擇題考點"], "t": "全方位、多層次、立體化的外交佈局", "p": "講師：「我們的外交佈局一定要把這個記住，一個多選題考點：全方位多層次立體化」。要推進大國協調合作，打造周邊命運共同體，加強同發展中國家團結合作，不斷完善我國全方位、多層次、立體化的外交佈局，構建新型政黨關係。", "o": "不断完善我国〖全方位〗、〖多层次〗、〖立体化〗的外交布局", "m": "「全・多・立」。", "pt": "A", "ps": 48, "pr": ["老師：我們的外交部局 一定要把這個記住 一個多選題考點（53-010）", "老師：…在任何的考試中 你看到選擇題（53-010）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-09", "l": 53, "ch": 16, "s": [11], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "中俄新時代全面戰略協作夥伴關係", "p": "講師：「你們一定要記住，中俄之間的合作叫做全面戰略協作夥伴關係，選擇題」「他會把這個偷偷改成中美……你要注意，不對」。構建和平共處、總體穩定、均衡發展的大國關係格局；中美關係是當今世界最重要的雙邊關係之一。", "o": "中俄新时代〖全面战略协作伙伴关系〗成熟、稳定、自主、坚韧；中美关系是当今世界〖最重要的双边关系〗之一", "m": "「中俄＝全面戰略協作夥伴；中美＝最重要的雙邊關係之一」。", "pt": "A", "ps": 36, "pr": ["老師：同學 你們一定要記住 中俄之間的合作叫做（53-011）", "老師：…全面戰略協作夥伴關係 選擇題 全面戰略協作夥伴關係（53-011）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-10", "l": 53, "ch": 16, "s": [13], "src": "", "tag": ["必背", "選擇題考點"], "t": "周邊外交：首要位置與親誠惠容", "p": "講師：「要始終將周邊置於外交全局的首要位置，選擇」。周邊是我國安身立命之所、發展繁榮之基。堅持親誠惠容和與鄰為善、以鄰為伴周邊外交方針；堅持共同、綜合、合作、可持續的亞洲安全觀。", "o": "要始终将周边置于外交全局的〖首要位置〗，秉持〖亲诚惠容〗的周边外交理念；坚持〖共同、综合、合作、可持续〗的亚洲安全观", "m": "「周邊＝首要；親誠惠容；與鄰為善、以鄰為伴」。", "pt": "A", "ps": 17, "pr": ["老師：…要始終將周邊看來選擇提考點 要始終將周邊置於外交全局…（53-013）", "老師：…於外交全局的首要位置，選擇（53-013）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-11", "l": 53, "ch": 16, "s": [14, 15], "src": "", "tag": ["選擇題考點", "易混"], "t": "發展中國家：真實親誠＋正確義利觀", "p": "秉持真實親誠理念和正確義利觀，加強同發展中國家團結合作。廣大發展中國家是我國在國際事務中的天然同盟軍。正確義利觀是我國對發展中國家政策理念的重大創新；要做到義利兼顧、義利平衡。", "o": "秉持〖真实亲诚〗理念和〖正确义利观〗，加强同发展中国家团结合作；广大发展中国家是我国在国际事务中的〖天然同盟军〗", "m": "「周邊＝親誠惠容；發展中國家＝真實親誠」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-12", "l": 53, "ch": 16, "s": [16, 17], "src": "", "tag": ["選擇題考點"], "t": "新型政黨關係：求同存異、相互尊重、互學互鑒", "p": "講師：「這是我們的新型政黨關係，作為一個多選題來準備」「你需要去記住的是這個互學互鑒的理念」。政黨外交是外交工作的重要方面；以建立新型政黨關係助力構建新型國際關係。", "o": "秉持〖求同存异〗、〖相互尊重〗、〖互学互鉴〗理念，构建新型政党关系", "m": "「求同・尊重・互鑒」。", "pt": "A", "ps": 44, "pr": ["老師：…黨關係 政黨關係這裏你需要去記住的是 這個互學互建的…（53-017）", "老師：…新型政黨關係 作爲一個多選題來準備 就可以了（53-016）", "老師：…就可以了 這裏就是一個多選題 要深入的去推進各國政黨…（53-016）"]}, {"id": "C53-13", "l": 53, "ch": 16, "s": [18], "src": "", "tag": ["選擇題考點"], "t": "對外工作的出發點和落腳點", "p": "講師：「是我們對外工作的出發點和落腳點，選擇題」。維護國家主權、安全、發展利益是我國對外工作的出發點和落腳點，是中國外交的神聖使命。", "o": "维护国家主权、安全、发展利益是我国对外工作的〖出发点和落脚点〗，是中国外交的〖神圣使命〗", "m": "「主權安全發展＝出發點＋落腳點」。", "pt": "A", "ps": 22, "pr": ["老師：…工作的出發點和落腳點 選擇題 我們對必須要維護好我們…（53-018）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C53-14", "l": 53, "ch": 16, "s": [21, 22, 23], "src": "", "tag": ["選擇題考點"], "t": "堅持外交為民", "p": "中國外交是人民的外交；人民外交是中國共產黨的一個創舉，也是中國外交的力量源泉。要堅定維護我國海外公民和法人正當權益；積極開展民間外交，是中國外交的優良傳統和鮮明特色。「國之交在於民相親。」", "o": "人民外交是中国共产党的一个〖创举〗，也是中国外交的〖力量源泉〗；“国之交在于〖民相亲〗”", "m": "「民相親」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-01", "l": 54, "ch": 16, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "推動構建人類命運共同體的定位", "p": "講師：「人類命運共同體這個知識點在過往的考試過程中已經出現過了。」推動構建人類命運共同體，是回答和解決關乎人類前途命運的時代之問的中國方案，是建設更加繁榮美好世界的人間正道，也是新時代對外工作的總目標。", "o": "推动构建人类命运共同体，是回答和解决关乎人类前途命运的时代之问的〖中国方案〗，是应对人类共同挑战、建设更加繁荣美好世界的〖人间正道〗，也是新时代对外工作的〖总目标〗", "m": "「中國方案・人間正道・總目標」。", "pt": "A", "ps": 14, "pr": ["老師：…在過往的考試過程中已經出現過了。（54-003）"]}, {"id": "C54-02", "l": 54, "ch": 16, "s": [7], "src": "", "tag": ["必背", "論述題考點", "易混"], "t": "構建人類命運共同體的五個「世界」", "p": "講師：「這個就是內涵的一個剖開的非常細的……可以作為一個論述題的考點」「我們這個人類命運共同體確實考的比較多，而且是大題比較多，所以大家儘量要去背過」。構建人類命運共同體，就是要攜手世界各國人民共同建設持久和平、普遍安全、共同繁榮、開放包容、清潔美麗的世界。", "o": "共同建设〖持久和平〗、〖普遍安全〗、〖共同繁荣〗、〖开放包容〗、〖清洁美丽〗的世界", "m": "「和平・安全・繁榮・包容・美麗」。", "items": ["建设持久和平的世界", "建设普遍安全的世界", "建设共同繁荣的世界", "建设开放包容的世界", "建设清洁美丽的世界"], "pt": "A", "ps": 24, "pr": ["老師：……可以作為一個論述題的考點（54-007）", "老師：…關係出現了好幾次 這個多選題一定要會去做 叫做相互尊…（54-007）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-03", "l": 54, "ch": 16, "s": [7, 8], "src": "", "tag": ["論述題考點", "易混"], "t": "五個「世界」各怎麼建", "p": "持久和平——堅持對話協商，構建對話不對抗、結伴不結盟的夥伴關係（講師：新型國際關係「相互尊重、公平正義、合作共贏」多選題一定要會）；普遍安全——樹立共同、綜合、合作、可持續的安全觀；共同繁榮——推進開放、包容、普惠、平衡、共贏的經濟全球化；開放包容——堅持交流互鑒；清潔美麗——倡導綠色、低碳、循環、可持續的生產生活方式。", "o": "建设持久和平的世界，就要坚持国家之间的〖对话协商〗；建设普遍安全的世界，就要树立〖共同、综合、合作、可持续〗的安全观；建设共同繁荣的世界，就要推进〖开放、包容、普惠、平衡、共赢〗的经济全球化；建设开放包容的世界，就要坚持〖交流互鉴〗；建设清洁美丽的世界，就要倡导〖绿色、低碳、循环、可持续〗的生产生活方式", "m": "「和平→對話；安全→新安全觀；繁榮→全球化；包容→互鑒；美麗→綠色」。", "pt": "A", "ps": 48, "pr": ["老師：…可以作爲一個論述題的考點 也就是說到底普遍安全是什…（54-008）", "老師：…這個人類面共同體 確實考的比較多 而且是大體比較多（54-008）", "老師：…比較多 所以大家儘量要去背過 那麼要背的內容（54-008）"]}, {"id": "C54-04", "l": 54, "ch": 16, "s": [12], "src": "", "tag": ["必背", "選擇題考點"], "t": "全人類共同價值", "p": "講師：「我圈出來的這些呢，你就作為選擇題去準備。」2015年9月，習近平在第七十屆聯合國大會一般性辯論時指出：「和平、發展、公平、正義、民主、自由，是全人類的共同價值，也是聯合國的崇高目標。」和平與發展是人類的共同事業，公平正義是共同理想，民主自由是共同追求。", "o": "“和平、发展、公平、正义、民主、自由，是〖全人类的共同价值〗，也是联合国的〖崇高目标〗。”和平与发展是人类的共同〖事业〗，公平正义是人类的共同〖理想〗，民主自由是人类的共同〖追求〗", "m": "「和發公正民自」；事業・理想・追求。", "pt": "A", "ps": 22, "pr": ["老師：…出來的這些呢 你就作爲選擇題去準備 在你的書上去畫出…（54-012）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-05", "l": 54, "ch": 16, "s": [12, 13], "src": "", "tag": ["易混", "選擇題考點"], "t": "全人類共同價值 ≠ 西方「普世價值」", "p": "全人類共同價值與西方所謂的「普世價值」存在根本區別：前者反映全人類的共同利益，體現不同文明的價值共識；後者僅代表部分西方國家的利益，依靠霸權強行輸出。全人類共同價值以聯合國憲章為基礎，理論基礎是共識性的、不是獨斷性的，實踐基礎是包容性的、不是排他性的。", "o": "全人类共同价值与西方所谓的“普世价值”是两个不同的概念，两者存在〖根本区别〗；其理论基础是〖共识性〗的、不是独断性的，实践基础是〖包容性〗的、不是排他性的", "m": "「共識・包容 vs 獨斷・排他」。", "pt": "A", "ps": 12, "pr": ["老師：…出來的這些呢 你就作爲選擇題去準備 在你的書上去畫出…（54-012）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-06", "l": 54, "ch": 16, "s": [14, 15, 16], "src": "", "tag": ["選擇題考點", "易混"], "t": "三大全球倡議的提出時間與場合", "p": "全球發展倡議：2021年9月，第七十六屆聯合國大會；全球安全倡議：2022年4月，博鰲亞洲論壇年會；全球文明倡議：2023年3月，中國共產黨與世界政黨高層對話會。", "o": "2021年9月提出〖全球发展倡议〗；2022年4月在博鳌亚洲论坛年会上提出〖全球安全倡议〗；2023年3月在中国共产党与世界政党高层对话会上提出〖全球文明倡议〗", "m": "「21發展（聯大）・22安全（博鰲）・23文明（政黨對話會）」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-07", "l": 54, "ch": 16, "s": [18], "src": "", "tag": ["必背", "選擇題考點"], "t": "全球治理體系改革：客觀要求與內在要求", "p": "講師：「注意這裏選擇題：增進世界各國人民福祉的客觀要求」「共商共建共享的全球治理觀，選擇」。推進全球治理體系改革和建設，是完善全球治理、增進世界各國人民福祉的客觀要求，也是構建人類命運共同體的內在要求。", "o": "推进全球治理体系改革和建设，是完善全球治理、增进世界各国人民福祉的〖客观要求〗，也是构建人类命运共同体的〖内在要求〗；秉持〖共商共建共享〗的全球治理观，坚持真正的〖多边主义〗", "m": "「福祉＝客觀要求；命運共同體＝內在要求」。", "pt": "A", "ps": 22, "pr": ["老師：…麼樣的全球治理觀 來做選擇題了 共商共建共享的全球治…（54-018）", "老師：注意這裏選擇題：增進世界各國人民福祉的客觀要求（54-018）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-08", "l": 54, "ch": 16, "s": [20], "src": "", "tag": ["選擇題考點"], "t": "多邊主義是維護和平、促進發展的有效路徑", "p": "講師：「是維護和平促進發展的有效路徑，選擇題」。多邊主義最基本的道理：國際上的事情要由各國商量着辦。要踐行真正的多邊主義，不能以多邊主義之名、行單邊主義之實，不能搞有選擇的多邊主義。", "o": "多边主义符合各国人民利益，是维护和平、促进发展的〖有效路径〗；不能以多边主义之名、行〖单边主义〗之实", "m": "「多邊＝有效路徑」。", "pt": "A", "ps": 22, "pr": ["老師：…和平促進發展的有效路徑選擇題 多邊主義最基本的道理（54-020）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-09", "l": 54, "ch": 16, "s": [21], "src": "", "tag": ["選擇題考點"], "t": "以聯合國為核心的國際體系、以國際法為基礎的國際秩序", "p": "要堅定維護以聯合國為核心的國際體系、以國際法為基礎的國際秩序；促進權利平等、機會平等、規則平等（講師：選擇準備）。推進全球治理體系改革和建設，並不是推倒重來，也不是另起爐灶，而是與時俱進、創新完善。", "o": "以〖联合国〗为核心的国际体系、以〖国际法〗为基础的国际秩序；促进〖权利平等、机会平等、规则平等〗；并不是〖推倒重来〗，也不是〖另起炉灶〗", "m": "「不推倒、不另起；三平等」。", "pt": "A", "ps": 14, "pr": ["老師：…呢 它就可能成爲選擇題考點 所以你們要在書上去記錄下…（54-021）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-10", "l": 54, "ch": 16, "s": [23], "src": "", "tag": ["選擇題考點"], "t": "共建「一帶一路」是推動構建人類命運共同體的實踐平台", "p": "共建「一帶一路」是對中國與世界實現開放共贏路徑的頂層設計，是推動構建人類命運共同體的實踐平台。", "o": "共建“一带一路”是对中国与世界实现开放共赢路径的〖顶层设计〗，是推动构建人类命运共同体的〖实践平台〗", "m": "「一帶一路＝實踐平台」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-11", "l": 54, "ch": 16, "s": [24], "src": "", "tag": ["必背", "選擇題考點"], "t": "「一帶一路」原則、理念、目標與「五通」", "p": "講師：「這個是我們的一個選擇題考點」。2013年，習近平提出共同建設「絲綢之路經濟帶」和「21世紀海上絲綢之路」的倡議。共建「一帶一路」秉持共商共建共享原則，堅持開放、綠色、廉潔理念，以高標準、可持續、惠民生為目標，全面推進政策溝通、設施聯通、貿易暢通、資金融通、民心相通。", "o": "秉持〖共商共建共享〗原则，坚持〖开放、绿色、廉洁〗理念，以〖高标准、可持续、惠民生〗为目标，全面推进〖政策沟通〗、〖设施联通〗、〖贸易畅通〗、〖资金融通〗、〖民心相通〗", "m": "「五通：政策溝通・設施聯通・貿易暢通・資金融通・民心相通」。", "items": ["政策沟通", "设施联通", "贸易畅通", "资金融通", "民心相通"], "pt": "A", "ps": 31, "pr": ["老師：…這個是我們的一個選擇提考點 選擇提考點A（54-024）", "老師：…是民心相通 那作爲一個選擇題 他會怎麼去考（54-024）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-12", "l": 54, "ch": 16, "s": [25], "src": "", "tag": ["選擇題考點"], "t": "「一帶一路」倡議的核心內涵與最高目標", "p": "講師：「這裏需要記住一個核心內涵」。這一倡議的核心內涵，是促進基礎設施建設和互聯互通，加強經濟政策協調和發展戰略對接，促進協同聯動發展，實現共同繁榮。最高目標是不斷朝着人類命運共同體方向邁進。", "o": "这一倡议的〖核心内涵〗，是促进〖基础设施建设和互联互通〗，加强经济政策协调和发展战略对接，促进协同联动发展，实现共同繁荣", "m": "「核心內涵＝基建＋互聯互通」。", "pt": "A", "ps": 28, "pr": ["老師：…的方向去邁進 那麼這裏需要記住一個核心內涵 這一倡議…（54-025）", "投影片黃字／黃筆標記（54-025）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-13", "l": 54, "ch": 16, "s": [26], "src": "", "tag": ["選擇題考點"], "t": "「一帶一路」是經濟合作倡議，不是地緣政治聯盟", "p": "共建「一帶一路」，是經濟合作倡議，不是搞地緣政治聯盟或軍事同盟；是開放包容進程，不是要關起門來搞小圈子或者「中國俱樂部」；是共享機遇、共謀發展的陽光大道，不是所謂「陷阱」。", "o": "共建“一带一路”，是〖经济合作倡议〗，不是搞地缘政治联盟或军事同盟；是〖开放包容进程〗，不是要关起门来搞小圈子或者“中国俱乐部”", "m": "「經濟合作，不是同盟」。", "pt": "B", "ps": 2, "pr": ["老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C54-14", "l": 54, "ch": 16, "s": [27], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "「硬聯通」「軟聯通」「心聯通」", "p": "講師三處標「選擇」：把基礎設施「硬聯通」作為重要方向，把規則標準「軟聯通」作為重要支撐，把同共建國家人民「心聯通」作為重要基礎。", "o": "把基础设施“硬联通”作为〖重要方向〗，把规则标准“软联通”作为〖重要支撑〗，把同共建国家人民“心联通”作为〖重要基础〗", "m": "「硬＝方向；軟＝支撐；心＝基礎」。", "pt": "B", "ps": 5, "pr": ["老師：選擇（54-027）", "老師：第十六章「在過往的考試中…考評比較高的重點」（52 srt 00:13）"]}, {"id": "C55-01", "l": 55, "ch": 17, "s": [5], "src": "", "tag": ["選擇題考點", "易混"], "t": "「四個全面」戰略佈局 vs「五位一體」總體佈局", "p": "講師複習：「四個全面」是國家發展的戰略佈局（選擇題）——第一個全面是戰略目標，第二、三、四個是戰略舉措；「五位一體」叫做總體佈局。「它跟我們的四個全面是不一樣的，一個是總體佈局，一個是戰略的佈局，所以選擇題一定要區分開。」", "o": "四个全面是〖战略布局〗；五位一体是〖总体布局〗", "m": "「四全＝戰略；五位＝總體」。", "pt": "A", "ps": 22, "pr": ["老師：局 選擇題 選擇（55-005）", "老師：…一個是戰略的佈局 所以選擇題一定要區分開 那麼五位議…（55-005）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-02", "l": 55, "ch": 17, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "全面從嚴治黨是新時代黨的建設的鮮明主題", "p": "講師：「首先它這個標題就作為一個選擇題，它是鮮明主題」「黨要管黨、從嚴治黨，是黨的建設的一貫要求和根本方針，選擇題」。全面從嚴治黨是黨永葆生機活力、走好新的趕考之路的必由之路，是新時代黨的建設的鮮明主題。", "o": "党要管党、从严治党，是党的建设的〖一贯要求和根本方针〗；全面从严治党是党永葆生机活力、走好新的赶考之路的〖必由之路〗，是新时代党的建设的〖鲜明主题〗", "m": "「管黨治黨＝一貫要求和根本方針；全面從嚴＝必由之路＋鮮明主題」。", "pt": "A", "ps": 32, "pr": ["老師：…先它這個標題就作爲一個選擇題 它是鮮明主題（55-006）", "老師：…設的一貫要求和根本方針選擇題 習近平總書記指出（55-006）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-03", "l": 55, "ch": 17, "s": [7], "src": "", "tag": ["選擇題考點"], "t": "打鐵必須自身硬", "p": "2012年11月，習近平在十八屆中共中央政治局常委同中外記者見面時指出「打鐵還需自身硬」；2017年10月黨的十九大報告進一步強調「打鐵必須自身硬」，充分表明我們黨堅持刀刃向內的非凡勇氣和高度清醒。", "o": "2012年11月“打铁还需自身硬”；2017年10月党的十九大报告进一步强调“〖打铁必须自身硬〗”，充分表明我们党坚持〖刀刃向内〗的非凡勇气和高度清醒", "m": "「還需（2012）→必須（2017十九大）」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-04", "l": 55, "ch": 17, "s": [10], "src": "", "tag": ["選擇題考點"], "t": "能夠打倒我們的只有我們自己", "p": "習近平指出：「我們黨作為世界第一大黨，沒有什麼外力能夠打倒我們，能夠打倒我們的只有我們自己。」自黨成立以來，我們面臨的最大風險是內部變質、變色、變味。", "o": "“我们党作为世界第一大党，没有什么外力能够打倒我们，能够打倒我们的〖只有我们自己〗。”我们面临的最大风险是内部〖变质、变色、变味〗", "m": "「三變：變質・變色・變味」。", "pt": "A", "ps": 18, "pr": ["老師：…個是四大危險 都是我們多選題需要去記的 多選題（55-010）", "同頁有考點提示：…環境的考驗B 四個考驗多選題 這是我們面臨的四個考驗…（55-010）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-05", "l": 55, "ch": 17, "s": [10], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "四大考驗與四大危險", "p": "講師：「四個考驗多選題」「同時也面臨着四大危險……都是我們多選題需要去記的」；講師口述：脫離群眾的危險「是四個危險中最大的危險」。黨面臨的執政考驗、改革開放考驗、市場經濟考驗、外部環境考驗將長期存在，精神懈怠危險、能力不足危險、脫離群眾危險、消極腐敗危險將長期存在。", "o": "〖执政〗考验、〖改革开放〗考验、〖市场经济〗考验、〖外部环境〗考验将长期存在，〖精神懈怠〗危险、〖能力不足〗危险、〖脱离群众〗危险、〖消极腐败〗危险将长期存在", "m": "考驗「執・改・市・外」；危險「懈・能・脫・腐」；最大危險＝脫離群眾（講師）。", "items": ["精神懈怠危险", "能力不足危险", "脱离群众危险", "消极腐败危险"], "pt": "A", "ps": 42, "pr": ["老師：…環境的考驗B 四個考驗多選題 這是我們面臨的四個考驗…（55-010）", "老師：…個是四大危險 都是我們多選題需要去記的 多選題（55-010）", "老師：同時存在 四個多選題 那麼這個脫離羣衆的危險（55-010）"]}, {"id": "C55-06", "l": 55, "ch": 17, "s": [14], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "全面從嚴治黨：核心、基礎、關鍵、要害", "p": "講師：「要害是什麼，選擇，要把它記住」「這裏注意，核心是什麼」。全面從嚴治黨，核心是加強黨的領導，基礎在全面，關鍵在嚴，要害在治。「關鍵在嚴」＝真管真嚴、敢管敢嚴、長管長嚴；「要害在治」＝真正解決問題、切實擔起責任，從寬鬆軟走向嚴緊硬。", "o": "全面从严治党，核心是〖加强党的领导〗，基础在〖全面〗，关键在〖严〗，要害在〖治〗", "m": "「核心領導・基礎全・關鍵嚴・要害治」。", "pt": "A", "ps": 26, "pr": ["老師：選擇 要把它記住 好（55-014）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-07", "l": 55, "ch": 17, "s": [16], "src": "", "tag": ["選擇題考點"], "t": "全面從嚴治黨體系：內容全涵蓋、對象全覆蓋、制度全貫通", "p": "全面從嚴治黨是一項管黨治黨的系統工程，需要一個佈局合理、內容科學、要素齊備、統一高效的全面從嚴治黨體系；堅持內容上全涵蓋、對象上全覆蓋、制度上全貫通。", "o": "坚持内容上〖全涵盖〗，坚持对象上〖全覆盖〗，坚持制度上〖全贯通〗", "m": "「內容涵蓋・對象覆蓋・制度貫通」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-08", "l": 55, "ch": 17, "s": [18], "src": "", "tag": ["選擇題考點"], "t": "從中央八項規定開局破題；政治建設放在首位", "p": "黨中央從制定和落實中央八項規定開局破題，牢牢抓住「關鍵少數」；堅持把政治建設放在首位（講師：選擇題）。", "o": "党中央从制定和落实〖中央八项规定〗开局破题，牢牢抓住“〖关键少数〗”；坚持把〖政治建设〗放在首位", "m": "「八項規定破題；政治建設首位」。", "pt": "A", "ps": 12, "pr": ["老師：堅持把什麼放在首位 選擇題 政治建設放在首位（55-018）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-09", "l": 55, "ch": 17, "s": [19, 20], "src": "", "tag": ["選擇題考點"], "t": "巡視是戰略性制度安排；反腐敗鬥爭壓倒性勝利", "p": "把巡視作為全面從嚴治黨的戰略性制度安排；堅持把紀律挺在前面；把制度建設貫穿黨的建設各方面（講師：選擇題考點）。黨中央以「得罪千百人、不負十四億」的堅定決心開展反腐敗鬥爭，反腐敗鬥爭取得壓倒性勝利並全面鞏固。", "o": "把〖巡视〗作为全面从严治党的〖战略性制度安排〗；以“〖得罪千百人、不负十四亿〗”的坚定决心；反腐败斗争取得〖压倒性胜利〗并全面巩固", "m": "「巡視＝戰略性制度安排」。", "pt": "A", "ps": 14, "pr": ["老師：…方面 這是一個選擇體力考點 把什麼建設放到（55-020）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-10", "l": 55, "ch": 17, "s": [21, 22, 23], "src": "", "tag": ["簡答題考點"], "t": "全面從嚴治黨的重要經驗（六個「相統一」）", "p": "一是思想建黨和制度治黨相統一（把制度建設貫穿到黨的各項建設之中，講師：選擇題考點）；二是使命引領和問題導向相統一；三是抓「關鍵少數」和管「絕大多數」相統一；四是行使權力和擔當責任相統一；五是嚴格管理和關心信任相統一（懲前毖後、治病救人的一貫方針，講師：選擇）；六是黨內監督和群眾監督相統一。", "o": "坚持〖思想建党〗和〖制度治党〗相统一；坚持〖使命引领〗和〖问题导向〗相统一；坚持抓“〖关键少数〗”和管“〖绝大多数〗”相统一", "m": "「思想制度・使命問題・少數多數・權力責任・管理信任・黨內群眾」。", "items": ["坚持思想建党和制度治党相统一", "坚持使命引领和问题导向相统一", "坚持抓“关键少数”和管“绝大多数”相统一", "坚持行使权力和担当责任相统一", "坚持严格管理和关心信任相统一", "坚持党内监督和群众监督相统一"], "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C55-11", "l": 55, "ch": 17, "s": [24], "src": "", "tag": ["選擇題考點"], "t": "全面從嚴治黨是黨的長期戰略、永恆課題", "p": "全面從嚴治黨取得的成就來之不易，但還遠未到大功告成的時候。「黨和人民事業發展到什麼階段，全面從嚴治黨就要跟進到什麼階段」；全面從嚴治黨是黨的長期戰略、永恆課題。", "o": "全面从严治党是党的〖长期战略〗、〖永恒课题〗", "m": "「長期戰略・永恆課題」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C56-01", "l": 56, "ch": 17, "s": [3], "src": "", "tag": ["選擇題考點"], "t": "黨的建設是一項偉大工程", "p": "把黨的建設作為一項偉大工程來推進，是我們黨的一大創舉，是黨領導人民進行偉大社會革命的重要法寶。深入推進新時代黨的建設新的偉大工程，必須注重系統性整體性協同性，以政治建設為統領持續抓好黨的各方面建設。", "o": "把党的建设作为一项〖伟大工程〗来推进，是我们党的一大〖创举〗，是我们党领导人民进行伟大社会革命的〖重要法宝〗；以〖政治建设〗为统领持续抓好党的各方面建设", "m": "「偉大工程＝一大創舉＝重要法寶」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C56-02", "l": 56, "ch": 17, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "黨的政治建設是黨的根本性建設，擺在首位", "p": "講師：「我們要把黨的政治建設擺在首位，選擇」。黨的政治建設是黨的根本性建設。把政治建設納入黨的建設總體佈局並擺在首位，是新時代我們黨對馬克思主義黨建理論的重大創新。（對比：第55堂章節重難點列「思想建設是黨的基礎性建設」。）", "o": "党的政治建设是党的〖根本性建设〗；把政治建设纳入党的建设总体布局并摆在〖首位〗，是新时代我们党对马克思主义党建理论的〖重大创新〗", "m": "「政治＝根本性・首位；思想＝基礎性」。", "pt": "B", "ps": 5, "pr": ["老師：…黨的政治建設擺在首位，選擇（56-004）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C56-03", "l": 56, "ch": 17, "s": [5], "src": "", "tag": ["選擇題考點"], "t": "旗幟鮮明講政治是根本要求；政治建設決定方向和效果", "p": "講師：「黨的政治建設決定了黨的建設的方向和效果，決定了什麼，選擇題」。旗幟鮮明講政治是我們黨作為馬克思主義政黨的根本要求；任何政黨都有政治屬性。", "o": "旗帜鲜明讲政治是我们党作为马克思主义政党的〖根本要求〗；党的政治建设决定党的建设〖方向和效果〗", "m": "「講政治＝根本要求；政治建設定方向＋效果」。", "pt": "A", "ps": 22, "pr": ["老師：決定了什麼選擇聽 不抓黨的政治建設或背離了黨的政治…（56-005）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C56-04", "l": 56, "ch": 17, "s": [6], "src": "", "tag": ["必背", "選擇題考點"], "t": "黨的政治建設的首要任務", "p": "講師：「是黨的政治建設的首要任務，選擇」。保證全黨服從中央，維護黨中央權威和集中統一領導，是黨的政治建設的首要任務。團結統一是黨的生命。要堅決防止和反對個人主義、分散主義、自由主義，宗派主義、圈子文化、碼頭文化，堅決反對搞兩面派、做兩面人。", "o": "保证全党〖服从中央〗，维护〖党中央权威和集中统一领导〗，是党的政治建设的〖首要任务〗；〖团结统一〗是党的生命", "m": "「首要任務＝服從中央＋維護權威」。", "pt": "B", "ps": 5, "pr": ["老師：…的政治建設的首要任務，選擇（56-006）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-01", "l": 57, "ch": 17, "s": [3], "src": "", "tag": ["必背", "選擇題考點"], "t": "腐敗是最大毒瘤、最大威脅；反腐敗是最徹底的自我革命", "p": "講師：「腐敗是危害黨的生命力和戰鬥力的最大毒瘤，這是選擇題」「反腐敗是最徹底的自我革命，選擇題」。腐敗是黨長期執政面臨的最大威脅；反腐敗是全面從嚴治黨的「必答題」。黨中央以猛藥去疴、重典治亂的決心，以刮骨療毒、壯士斷腕的勇氣，堅定不移「打虎」「拍蠅」「獵狐」。", "o": "腐败是危害党的生命力和战斗力的〖最大毒瘤〗，是党长期执政面临的〖最大威胁〗；反腐败是〖最彻底的自我革命〗，是全面从严治党的“〖必答题〗”", "m": "「最大毒瘤・最大威脅・最徹底的自我革命・必答題」。", "pt": "A", "ps": 32, "pr": ["老師：…腐敗是最徹底的自我革命選擇題 什麼是我們最徹底的自我…（57-003）", "老師：持久戰 這裏的一些選擇題 大家注意一下（57-003）", "老師：…戰鬥力的最大毒瘤，這是選擇題（57-003）"]}, {"id": "C57-02", "l": 57, "ch": 17, "s": [4], "src": "", "tag": ["選擇題考點"], "t": "反腐敗是一場輸不起也決不能輸的重大鬥爭", "p": "腐敗嚴重侵蝕黨的肌體，對黨的執政基礎破壞力最大、殺傷力也最大。習近平指出：「我們黨作為執政黨，面臨的最大威脅就是腐敗。」", "o": "“我们党作为执政党，面临的最大威胁就是〖腐败〗。”反腐败是一场〖输不起也决不能输〗的重大斗争", "m": "「輸不起、決不能輸」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-03", "l": 57, "ch": 17, "s": [5], "src": "", "tag": ["選擇題考點"], "t": "前途命運最終取決於人心向背", "p": "一個政黨、一個政權，其前途命運最終取決於人心向背。人民群眾最痛恨各種腐敗現象、特權現象。必須從關係黨和國家生死存亡的戰略高度，堅定不移開展反腐敗鬥爭。", "o": "一个政党、一个政权，其前途命运最终取决于〖人心向背〗", "m": "「人心向背」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-04", "l": 57, "ch": 17, "s": [7], "src": "", "tag": ["必背", "選擇題考點"], "t": "標本兼治是新時代反腐敗鬥爭的鮮明特徵", "p": "講師：「標本兼治是新時代推進反腐敗鬥爭的鮮明特徵，選擇題」。既以治標遏制腐敗勢頭，更注重治本夯實防腐的基礎；堅持反腐敗無禁區、全覆蓋、零容忍；成功走出一條依靠制度優勢、法治優勢反腐敗之路。", "o": "〖标本兼治〗是新时代推进反腐败斗争的〖鲜明特征〗；坚持反腐败〖无禁区、全覆盖、零容忍〗", "m": "「標本兼治＝鮮明特徵；無禁區・全覆蓋・零容忍」。", "pt": "A", "ps": 22, "pr": ["老師：…反腐敗鬥爭的 鮮明特徵選擇題 所以我們既要以治標遏制…（57-007）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-05", "l": 57, "ch": 17, "s": [8], "src": "", "tag": ["選擇題考點"], "t": "監察委員會與紀委合署辦公", "p": "深化國家監察體制改革，組建監察委員會作為黨統一領導的專門的反腐敗工作機構，與黨的紀律檢查機關合署辦公，實現了黨內監督和國家監察、依規治黨和依法治國有機統一。", "o": "组建〖监察委员会〗作为党统一领导的专门的反腐败工作机构，与党的〖纪律检查机关〗合署办公", "m": "「監委＋紀委＝合署辦公」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-06", "l": 57, "ch": 17, "s": [9], "src": "", "tag": ["選擇題考點", "易混"], "t": "巡視：黨章規定的重要監督方式、黨內監督的戰略性制度安排", "p": "巡視是黨章規定的重要監督方式，是黨內監督的戰略性制度安排，成為發現問題、形成震懾的一把利劍。派駐監督是黨和國家監督體系的重要組成部分。", "o": "巡视是党章规定的〖重要监督方式〗，是党内监督的〖战略性制度安排〗", "m": "「巡視＝戰略性制度安排（第55堂也出現）」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-07", "l": 57, "ch": 17, "s": [10, 11], "src": "", "tag": ["選擇題考點"], "t": "「打虎」「拍蠅」「獵狐」多管齊下", "p": "堅持受賄行賄一起查，有案必查、有腐必懲；深化金融、國有企業、政法、糧食購銷等重點領域反腐敗工作；將國際追逃追贓作為遏制腐敗蔓延的重要一環，連續組織開展「天網行動」，決不讓外國成為腐敗分子的「避罪天堂」。", "o": "坚持受贿行贿〖一起查〗；连续组织开展“〖天网行动〗”，决不让外国成为腐败分子的“〖避罪天堂〗”", "m": "「打虎（大案）・拍蠅（微腐敗）・獵狐（追逃）」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-08", "l": 57, "ch": 17, "s": [12], "src": "", "tag": ["選擇題考點"], "t": "把權力關進制度的籠子裏", "p": "反腐倡廉的核心是制度制約和監督權力。腐敗的本質是權力出軌、越軌。修訂頒布《中國共產黨黨內監督條例》《中國共產黨紀律處分條例》《中國共產黨問責條例》等，增強制度剛性，防止「破窗效應」。", "o": "反腐倡廉的核心是〖制度制约和监督权力〗；腐败的本质是权力〖出轨、越轨〗", "m": "「核心＝制度管權；本質＝權力出軌」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-09", "l": 57, "ch": 17, "s": [13], "src": "", "tag": ["選擇題考點"], "t": "永遠吹衝鋒號", "p": "習近平告誡全黨：「要保持清醒頭腦，永遠吹衝鋒號，牢記反腐敗永遠在路上。」只要存在腐敗問題產生的土壤和條件，黨與腐敗現象的鬥爭就不會停止。", "o": "“要保持清醒头脑，永远吹〖冲锋号〗，牢记反腐败〖永远在路上〗。”", "m": "「衝鋒號・永遠在路上」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-10", "l": 57, "ch": 17, "s": [14, 15], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "不敢腐、不能腐、不想腐一體推進", "p": "講師：「不敢是前提，不想是根本，選擇題」「這裏需要去重點記一下」。不敢腐、不能腐、不想腐是相互依存、相互促進的有機整體：「不敢」是前提，「不能」是關鍵，「不想」是根本；必須三者同時發力、同向發力、綜合發力。", "o": "“不敢”是〖前提〗，“不能”是〖关键〗，“不想”是〖根本〗；必须三者〖同时发力、同向发力、综合发力〗", "m": "「敢前提・能關鍵・想根本」。", "pt": "A", "ps": 24, "pr": ["老師：…不敢是前提 不想是根本選擇題 要靠加強（57-014）", "老師：…輔和不想輔 這裏需要去重點記一下 好（57-014）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C57-11", "l": 57, "ch": 17, "s": [17], "src": "", "tag": ["選擇題考點"], "t": "幹部清正、政府清廉、政治清明", "p": "教育引導廣大黨員幹部清清白白做人、乾乾淨淨做事，推動實現幹部清正、政府清廉、政治清明。只要管黨治黨不放鬆、正風肅紀不停步、反腐懲惡不手軟，就一定能贏得這場重大政治鬥爭的勝利。", "o": "推动实现干部〖清正〗、政府〖清廉〗、政治〖清明〗", "m": "「三清：清正・清廉・清明」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-01", "l": 58, "ch": 17, "s": [4], "src": "", "tag": ["必背", "選擇題考點", "易混"], "t": "跳出歷史周期率的兩個答案", "p": "講師：「這就是第二個答案，選擇題的考點」。毛澤東在延安的窯洞裏給出了第一個答案，這就是「讓人民來監督政府」。經過百年奮鬥特別是黨的十八大以來新的實踐，黨又給出了第二個答案，這就是自我革命。全面從嚴治黨是新時代黨的自我革命的偉大實踐。", "o": "毛泽东在延安的窑洞里给出了第一个答案，这就是“〖让人民来监督政府〗”；党又给出了第二个答案，这就是〖自我革命〗；全面从严治党是新时代党的自我革命的〖伟大实践〗", "m": "「第一答案＝人民監督政府（毛澤東・延安窯洞）；第二答案＝自我革命」。", "pt": "A", "ps": 34, "pr": ["老師：…答案 選擇題 選擇題的考點（58-004）", "你的錯題：歷史周期率兩個答案（第一個答案曾連錯兩次）（progress.md）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-02", "l": 58, "ch": 17, "s": [5], "src": "", "tag": ["必背", "選擇題考點"], "t": "勇於自我革命：顯著標誌、最大優勢、最鮮明品格", "p": "講師：「是我黨區別於其他政黨的顯著標誌，選擇」「也是我們黨最大的優勢、最鮮明的品格，選擇」。黨之所以勇於自我革命，是因為黨除了國家、民族、人民的利益，沒有任何自己的特殊利益，這是黨自我革命的勇氣之源、底氣所在。", "o": "勇于自我革命，是中国共产党区别于其他政党的〖显著标志〗，也是我们党〖最大的优势〗、〖最鲜明的品格〗；我们党除了国家、民族、人民的利益，没有任何自己的〖特殊利益〗，这是我们党自我革命的〖勇气之源、底气所在〗", "m": "「標誌・優勢・品格」；「無特殊利益＝勇氣之源」。", "pt": "B", "ps": 5, "pr": ["老師：是我黨區別於其他政黨的顯著標誌，選擇（58-005）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-03", "l": 58, "ch": 17, "s": [7, 8], "src": "", "tag": ["必背", "簡答題考點", "選擇題考點"], "t": "「四個自我」", "p": "講師：「這個就是我們四個自我，四個自我重點，簡答加選擇」。自我淨化——堅定理想信念宗旨，提高政治免疫力；自我完善——補短板、強弱項、固根本；自我革新——破除不合時宜的思想觀念和體制機制弊端；自我提高——永不僵化、永不停滯，全面增強執政本領。「四個自我」是實現偉大自我革命的重要途徑。", "o": "实现〖自我净化〗、〖自我完善〗、〖自我革新〗、〖自我提高〗；“四个自我”是实现伟大自我革命的〖重要途径〗", "m": "「淨化・完善・革新・提高」。", "items": ["自我净化", "自我完善", "自我革新", "自我提高"], "pt": "A", "ps": 24, "pr": ["老師：就四個自我重點 簡答 加（58-008）", "老師：自我革命重點 記住 由於自我革命就要同一切影響黨的…（58-007）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-04", "l": 58, "ch": 17, "s": [9], "src": "", "tag": ["選擇題考點"], "t": "外靠人民民主，內靠全面從嚴治黨", "p": "黨成立以來，外靠發展人民民主、接受人民監督，內靠全面從嚴治黨、推進自我革命，保證了黨長盛不衰。新時代打了一套自我革命的「組合拳」；這是黨的顯著優勢，也是引領時代的制勝之道。", "o": "外靠发展〖人民民主〗、接受人民监督，内靠〖全面从严治党〗、推进自我革命", "m": "「外民主、內治黨」（呼應兩個答案）。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-05", "l": 58, "ch": 17, "s": [10, 11], "src": "", "tag": ["選擇題考點"], "t": "大黨獨有難題", "p": "習近平指出，必須時刻保持解決大黨獨有難題的清醒和堅定。解決大黨獨有難題，是必須邁過的一道坎，是全面從嚴治黨必須啃下的硬骨頭。如何始終不忘初心牢記使命、統一思想意志行動、具備強大執政能力和領導水平、保持幹事創業精神狀態、及時發現和解決自身問題、保持風清氣正的政治生態，都是大黨必須解決的獨有難題。", "o": "必须时刻保持解决〖大党独有难题〗的〖清醒和坚定〗", "m": "「六個如何始終」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-06", "l": 58, "ch": 17, "s": [12, 13, 14], "src": "", "tag": ["簡答題考點"], "t": "怎樣解決大黨獨有難題", "p": "講師：「怎麼去解決這樣的難題，簡答」。（1）必須堅守奠基創業時的初心；（2）必須在重大問題、嚴峻形勢面前始終心往一處想、勁往一處使；（3）必須與時俱進提高科學執政、民主執政、依法執政水平；（4）必須始終保持艱苦奮鬥、奮發有為的精氣神；（5）必須堅持真理、修正錯誤；（6）必須常懷憂患意識、底線思維，始終保持刀刃向內的堅定自覺。", "o": "必须坚守奠基创业时的〖初心〗；必须与时俱进提高〖科学执政、民主执政、依法执政〗水平；必须常怀〖忧患意识〗、〖底线思维〗，始终保持〖刀刃向内〗的坚定自觉", "m": "「初心・團結・執政水平・精氣神・修正錯誤・刀刃向內」。", "items": ["必须坚守奠基创业时的初心", "必须在重大问题、严峻形势面前始终心往一处想、劲往一处使", "必须与时俱进提高科学执政、民主执政、依法执政水平", "必须始终保持艰苦奋斗、奋发有为的精气神", "必须坚持真理、修正错误", "必须常怀忧患意识、底线思维，始终保持刀刃向内的坚定自觉"], "pt": "A", "ps": 22, "pr": ["老師：…怎麼去解決這樣的難題 簡答 好（58-012）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-07", "l": 58, "ch": 17, "s": [15], "src": "", "tag": ["必背", "選擇題考點"], "t": "「三個務必」", "p": "講師：「務必，選擇題，重點」。習近平指出，「全黨同志務必不忘初心、牢記使命，務必謙虛謹慎、艱苦奮鬥，務必敢於鬥爭、善於鬥爭」。要始終牢記「三個務必」，解決好大黨獨有難題，走好新的趕考之路。", "o": "务必〖不忘初心、牢记使命〗，务必〖谦虚谨慎、艰苦奋斗〗，务必〖敢于斗争、善于斗争〗", "m": "「初心使命・謙虛艱苦・敢鬥善鬥」。", "items": ["务必不忘初心、牢记使命", "务必谦虚谨慎、艰苦奋斗", "务必敢于斗争、善于斗争"], "pt": "A", "ps": 12, "pr": ["老師：務必，選擇題，重點（58-015）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-08", "l": 58, "ch": 17, "s": [16], "src": "", "tag": ["必背", "選擇題考點"], "t": "以偉大自我革命引領偉大社會革命", "p": "習近平鮮明提出：「要以偉大自我革命引領偉大社會革命，以偉大社會革命促進偉大自我革命。」這一重大論斷深刻揭示了偉大工程和偉大事業的辯證關係，體現了以改造主觀世界推動改造客觀世界的歷史主動。", "o": "以伟大自我革命〖引领〗伟大社会革命，以伟大社会革命〖促进〗伟大自我革命；深刻揭示了〖伟大工程〗和〖伟大事业〗的辩证关系", "m": "「自我→引領社會；社會→促進自我」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-09", "l": 58, "ch": 17, "s": [18], "src": "", "tag": ["選擇題考點"], "t": "社會革命成就黨，自我革命推動事業", "p": "偉大社會革命鍛造和成就偉大的黨，偉大自我革命保障和推動偉大的事業，這是黨100多年來不斷從勝利走向新的勝利的寶貴經驗。", "o": "伟大社会革命〖锻造和成就〗伟大的党，伟大自我革命〖保障和推动〗伟大的事业", "m": "「社會→黨；自我→事業」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-10", "l": 58, "ch": 17, "s": [19], "src": "", "tag": ["必背", "選擇題考點"], "t": "新時代中國特色社會主義發展的顯著特點", "p": "講師：「是新時代中國特色社會主義發展的顯著特點，選擇題來了」「偉大事業、偉大夢想，選擇，四個」。以偉大自我革命引領偉大社會革命是新時代中國特色社會主義發展的顯著特點；黨中央統攬偉大鬥爭、偉大工程、偉大事業、偉大夢想。", "o": "以伟大自我革命引领伟大社会革命是新时代中国特色社会主义发展的〖显著特点〗；统揽〖伟大斗争〗、〖伟大工程〗、〖伟大事业〗、〖伟大梦想〗", "m": "「四個偉大：鬥爭・工程・事業・夢想」。", "pt": "A", "ps": 22, "pr": ["老師：…會主義發展的顯著特點來選擇題來了 選擇（58-019）", "老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}, {"id": "C58-11", "l": 58, "ch": 17, "s": [21], "src": "", "tag": ["選擇題考點"], "t": "從50多名黨員到9800多萬名黨員", "p": "中國共產黨成立時只有50多名黨員，今天已成為擁有9800多萬名黨員、領導着14億多人口大國、具有重大全球影響力的馬克思主義執政黨。", "o": "中国共产党成立时只有〖50多名〗党员，今天已成为拥有〖9800多万名〗党员的马克思主义执政党", "m": "「50多→9800多萬」。", "pt": "B", "ps": 2, "pr": ["老師：全面從嚴治黨「考評是越來越高」（55 srt 00:44）"]}], "qs": [{"s": [7, 8, 9, 10, 11], "src": "", "card": "C01-01", "tag": ["必背", "簡答題考點", "錯題"], "auto": 1, "k": "默", "q": "默寫｜思想創立的時代背景（五個標題）", "model": "（一）世界百年未有之大变局加速演进；（二）中华民族伟大复兴进入关键时期；（三）中国式现代化全面推进拓展；（四）科学社会主义在21世纪的中国焕发蓬勃生机；（五）中国共产党自我革命开辟新的境界", "pts": ["世界百年未有之大变局加速演进", "中华民族伟大复兴进入关键时期", "中国式现代化全面推进拓展", "科学社会主义在21世纪的中国焕发蓬勃生机", "中国共产党自我革命开辟新的境界"], "e": "記法：口訣「世・復・現・科・革」＝世界→復興→現代化→科社→自我革命（由外到內、由大到小）。易錯字：中华、伟大、中国式、拓展、蓬勃、开辟；「关键时期」不是「時刻」。", "id": "Q01-001", "l": 1, "ch": 0, "pt": "A", "ps": 37, "pr": ["老師：…变局 这是一个我们曾经考过的一个考点（01-007）", "你的錯題：時代背景五項標題要逐字（progress.md）", "投影片黃字／黃筆標記（01-007）"]}, {"s": [7, 8, 9, 10, 11], "src": "", "card": "C01-01", "tag": ["必背", "簡答題考點", "錯題"], "auto": 1, "k": "多", "q": "以下哪些是習近平新時代中國特色社會主義思想創立的時代背景（標題）？", "o": ["世界百年未有之大变局加速演进", "中华民族伟大复兴进入关键时期", "中国式现代化全面推进拓展", "科学社会主义在21世纪的中国焕发蓬勃生机", "中国特色社会主义进入全面小康时期"], "a": [0, 1, 2, 3], "e": "正確：世界百年未有之大变局加速演进；中华民族伟大复兴进入关键时期；中国式现代化全面推进拓展；科学社会主义在21世纪的中国焕发蓬勃生机。干擾項：中国特色社会主义进入全面小康时期。", "id": "Q01-002", "l": 1, "ch": 0, "pt": "A", "ps": 37, "pr": ["老師：…变局 这是一个我们曾经考过的一个考点（01-007）", "你的錯題：時代背景五項標題要逐字（progress.md）", "投影片黃字／黃筆標記（01-007）"]}, {"s": [7, 8, 9, 10, 11], "src": "", "card": "C01-01", "tag": ["必背", "簡答題考點", "錯題"], "auto": 1, "k": "多", "q": "以下哪些是習近平新時代中國特色社會主義思想創立的時代背景（標題）？", "o": ["中华民族伟大复兴进入关键时期", "世界百年未有之大变局加速演进", "中国共产党自我革命开辟新的境界", "科学社会主义在21世纪的中国焕发蓬勃生机", "中华民族伟大复兴进入关键时刻"], "a": [0, 1, 2, 3], "e": "正確：中华民族伟大复兴进入关键时期；世界百年未有之大变局加速演进；中国共产党自我革命开辟新的境界；科学社会主义在21世纪的中国焕发蓬勃生机。干擾項：中华民族伟大复兴进入关键时刻。", "id": "Q01-003", "l": 1, "ch": 0, "pt": "A", "ps": 37, "pr": ["老師：…变局 这是一个我们曾经考过的一个考点（01-007）", "你的錯題：時代背景五項標題要逐字（progress.md）", "投影片黃字／黃筆標記（01-007）"]}, {"s": [7], "src": "", "card": "C01-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜世界百年未有之大變局（曾考過）：\n世界百年未有之大变局加速演进：1. （＿①＿）；2. 世界进入新的（＿②＿）", "a": ["和平、发展、合作、共赢", "动荡变革期"], "e": "「百年未有之大變局」是講師說「曾經考過的考點」。意思是：世界局勢正出現一百年來都沒有過的大變化。投影片黃字還寫了時代潮流是「和平、發展、合作、共贏」，而世界也進入「新的動盪變革期」。補充：毛澤東思想的時代主題是「戰爭與革命」，鄧小平理論以後是「和平與發展」。", "id": "Q01-004", "l": 1, "ch": 0, "pt": "A", "ps": 27, "pr": ["老師：…变局 这是一个我们曾经考过的一个考点（01-007）", "老師：曾經考過的考點（01-007）", "投影片黃字／黃筆標記（01-007）"]}, {"s": [8], "src": "", "card": "C01-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中華民族偉大復興＝共同夢想＋奮鬥目標：\n实现中华民族伟大复兴是近代以来中国人民的（＿①＿），是中国共产党（＿②＿）的奋斗目标", "a": ["共同梦想", "矢志不渝"], "e": "民族復興對中國人民來說是「大家一直的共同夢想」；對共產黨來說是「一直不放棄的奮鬥目標」。講師說標黃的這句要記住。", "id": "Q01-005", "l": 1, "ch": 0, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（01-008）"]}, {"s": [8], "src": "", "card": "C01-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜中華民族偉大復興＝共同夢想＋奮鬥目標", "model": "实现中华民族伟大复兴是近代以来中国人民的共同梦想，是中国共产党矢志不渝的奋斗目标", "pts": ["共同梦想", "矢志不渝"], "e": "記法：「人民→夢想；黨→目標」。矢志不渝＝發誓不改變。", "id": "Q01-006", "l": 1, "ch": 0, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（01-008）"]}, {"s": [9], "src": "", "card": "C01-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜三個「獨特」決定中國走自己的現代化道路：\n（＿①＿）、（＿②＿）、（＿③＿），决定了中国必然走适合自己特点的现代化道路", "a": ["独特的文化传统", "独特的历史命运", "独特的基本国情"], "e": "中國有自己獨特的文化、歷史和國情，所以不能照抄別人，一定要走適合自己的現代化道路。", "id": "Q01-007", "l": 1, "ch": 0, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（01-009）"]}, {"s": [10], "src": "", "card": "C01-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜中國特色社會主義＝旗幟＋中流砥柱：\n中国特色社会主 的特點是什麼？就是由中國共產黨領導。題目只要出現「最本質的特徵」，答案就是黨的領導。", "id": "Q01-018", "l": 1, "ch": 0, "pt": "A", "ps": 15, "pr": ["老師：…别说这还是一个选择题的考点」；「总任务是实现社会主义…（01-016）", "投影片黃字／黃筆標記（01-016）"]}, {"s": [16], "src": "", "card": "C01-11", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "填", "q": "填空｜十個明確（2）總任務：\n明确坚持和发展中国特色社会主义，总任务是实现（＿①＿）和（＿②＿），在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴", "a": ["社会主义现代化", "中华民族伟大复兴"], "e": "「總任務」就是最大的總目標：實現社會主義現代化和中華民族偉大復興。分兩步走，到本世紀中葉（2050年）建成現代化強國。", "id": "Q01-019", "l": 1, "ch": 0, "pt": "A", "ps": 15, "pr": ["老師：…别说这还是一个选择题的考点」；「总任务是实现社会主义…（01-016）", "投影片黃字／黃筆標記（01-016）"]}, {"s": [16], "src": "", "card": "C01-11", "tag": ["必背", "選擇題考點", "錯題"], "auto": 1, "k": "默", "q": "默寫｜十個明確（2）總任務", "model": "明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴", "pts": ["社会主义现代化", "中华民族伟大复兴"], "e": "記法：總任務＝「現代化＋復興」兩件事；強國五個形容詞「富強・民主・文明・和諧・美麗」（富民文和美）。手寫：2021、2050。", "id": "Q01-020", "l": 1, "ch": 0, "pt": "A", "ps": 15, "pr": ["老師：…别说这还是一个选择题的考点」；「总任务是实现社会主义…（01-016）", "投影片黃字／黃筆標記（01-016）"]}, {"s": [17], "src": "", "card": "C01-12", "tag": ["必背"], "auto": 1, "k": "填", "q": "填空｜十個明確（3）社會主要矛盾：\n明确新时代我国社会主要矛盾是人民日益增长的（＿①＿）和（＿②＿）的发展之间的矛盾；（＿③＿）", "a": ["美好生活需要", "不平衡不充分", "坚持以人民为中心"], "e": "現在中國社會最主要的「問題」：人民想要更好的生活，但發展還不夠平衡、不夠充分。所以要以人民為中心。", "id": "Q01-021", "l": 1, "ch": 0, "pt": "A", "ps": 11, "pr": ["投影片手寫星號（01-017）", "投影片黃字／黃筆標記（01-017）"]}, {"s": [18], "src": "", "card": "C01-13", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜十個明確（4）總體布局與戰略布局：\n明确中国特色社会主义事业（＿①＿）是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，（＿②＿）是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面", "a": ["总体布局", "战略布局"], "e": "總體布局「五位一體」＝五個方面一起建設（經濟、政治、文化、社會、生態文明）；戰略布局「四個全面」＝四件大事全面推進。注意：五位一體是「總體」布局，四個全面是「戰略」布局，不要調轉。", "id": "Q01-022", "l": 1, "ch": 0, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（01-018）"]}, {"s": [18], "src": "", "card": "C01-13", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "默", "q": "默寫｜十個明確（4）總體布局與戰略布局", "model": "明确中国特色社会主义事业总体布 前三項是投影片原意；「翻版」是四個「不是」之一，所以 D 錯。", "id": "Q03-047", "l": 3, "ch": 1, "pt": "A", "ps": 41, "pr": ["老師：…义 这个部分呢 可能考大题的一个概率是比较大的（03-012）", "投影片黃字／黃筆標記（03-012）", "你的錯題：中特是社會主義「四個不是」（progress.md）"]}, {"k": "填", "s": [13], "q": "當代中國的偉大社會變革，不是簡單延續我國歷史文化的（＿①＿），不是簡單套用馬克思主義經典作家設想的（＿②＿），不是其他國家社會主義實踐的（＿③＿），也不是國外現代化發展的（＿④＿）。", "a": ["母版", "模板", "再版", "翻版"], "e": "口訣「母・模・再・翻」對應「古・馬・社・外」。", "id": "Q03-048", "l": 3, "ch": 1, "pt": "A", "ps": 28, "pr": ["你的錯題：中特是社會主義「四個不是」（progress.md）", "投影片黃字／黃筆標記（03-013）"]}, {"k": "論", "s": [12, 13], "q": "論述：為什麼說中國特色社會主義是社會主義而不是其他什麼主義？", "sum": "一句白話總結：中特既守住了科學社會主義的「根」（基本原則），又長出了中國的「枝葉」（中國特色），是全新的版本，所以它歸根到底是社會主義。", "pts": ["中国特色社会主义是科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一", "科学社会主义基本原则是马克思主义的核心内容；中国特色社会主义坚持了科学社会主义基本原则", "并根据新的时代条件赋予其鲜明的中国特色", "中国特色社会主义写出了科学社会主义的“新版本”", "当代中国的伟大社会变革不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版", "结论：它是社会主义，不是任何其他的什么主义"], "e": "講師：此部分「可能考大題的一個概率是比較大的」。論述時每點要展開一兩句，不要只寫關鍵詞。", "id": "Q03-049", "l": 3, "ch": 1, "pt": "A", "ps": 56, "pr": ["老師：…义 这个部分呢 可能考大题的一个概率是比较大的（03-012）", "投影片黃字／黃筆標記（03-012）", "你的錯題：中特是社會主義「四個不是」（progress.md）"]}, {"s": [3], "src": "", "card": "C04-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜新時代是我國發展新的「歷史方位」：\n中国特色社会主义新时代是我国发展新的（＿①＿）", "a": ["历史方位"], "e": "「歷史方位」＝我們現在站在歷史上的哪個位置。中國特色社會主義進入新時代，就是我國發展的新位置、新的發展階段。講師：不是「歷史方向」，也不是「歷史定位」，「一個字都不能錯」。", "id": "Q04-001", "l": 4, "ch": 1, "pt": "A", "ps": 19, "pr": ["老師：…是一个选择提（選擇題）考点 大家一定要记住了 选择提…（04-003）", "投影片黃字／黃筆標記（04-003）"]}, {"s": [4], "src": "", "card": "C04-02", "tag": ["必背", "論述題考點", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜新時代的內涵（五個「的時代」）", "model": "（一）承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代；（二）决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代；（三）全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代；（四）全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代；（五）我国日益走近世界舞台中央、不断为人类作出更大贡献的时代", "pts": ["承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代", "决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代", "全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代", "全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代", "我国日益走近世界舞台中央、不断为人类作出更大贡献的时代"], "e": "記法：五個關 ", "card": "C04-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「一個變，兩個沒有變」：\n我国仍将长期处于（＿①＿）的基本国情没有变；我国仍然是世界上（＿②＿）的国际地位没有变", "a": ["社会主义初级阶段", "最大的发展中国家"], "e": "主要矛盾「變了」，但兩件事「沒變」：我國仍處於並將長期處於社會主義初級階段的基本國情沒變；我國是世界最大發展中國家的國際地位沒變。", "id": "Q04-012", "l": 4, "ch": 1, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（04-011）"]}, {"s": [12, 13, 14, 15], "src": "", "card": "C04-08", "tag": ["了解", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新時代的偉大變革（13方面黃字關鍵詞）：\n党的领导全面加强；全面从严治党不断深化；（＿①＿）；全过程人民民主得到全面发展；……牢牢把握两岸关系（＿②＿）", "a": ["把握新发展阶段、贯彻新发展理念、构建新发展格局", "主导权和主动权"], "e": "新時代在13個方面發生偉大變革（與第02堂「十三個方面成就」對應）。黃字關鍵詞包括：黨的領導全面加強、全面從嚴治黨不斷深化、新發展階段／新發展理念／新發展格局、全過程人民民主、依法治國、核心價值觀、優秀傳統文化、人民生活、美麗中國、人民軍隊、國家安全、兩岸關係主導權和主動權、外交。講師：反腐敗鬥爭「取得了壓倒性勝利」。", "id": "Q04-013", "l": 4, "ch": 1, "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（04-012）"]}, {"s": [16], "src": "", "card": "C04-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜偉大變革的里程碑意義（1）：\n党同人民群众始终保持（＿①＿）", "a": ["血肉联系"], "e": "新時代的偉大變革使黨和人民群眾一直保持「血肉」般的緊密聯繫。", "id": "Q04-014", "l": 4, "ch": 1, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（04-016）"]}, {"k": "單", "s": [3], "q": "中國特色社會主義新時代是我國發展新的：", "o": ["歷史方位", "歷史方向", "歷史定位", "歷史階段"], "a": 0, "e": "講師：「它不是歷史方向也不是歷史定位，它就叫做歷史方位，一個字都不能錯。」", "id": "Q04-015", "l": 4, "ch": 1, "pt": "A", "ps": 37, "pr": ["老師：…是一个选择提（選擇題）考点 大家一定要记住了 选择提…（04-003）", "投影片黃字／黃筆標記（04-003）"]}, {"k": "單", "s": [6], "q": "新時代我國社會主要矛盾是：", "o": ["人民日益增長的美好生活需要和不平衡不充分的發展之間的矛盾", "人民日益增長的物質文化需要同落後的社會生產之間的矛盾", "無產階級和資產階級之間的矛盾", "人民日益增長的美好生活需要同落後的社會生產之間的矛盾"], "a": 0, "e": "新矛盾：美好生活需要 vs 不平衡不充分的發展。B 是舊的主要矛盾；D 把新舊混在一起。", "id": "Q04-016", "l": 4, "ch": 1, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（04-006）"]}, {"k": "判", "s": [11], "q": "社會主要矛盾轉化以後，我國已不再處於社會主義初級階段。", "a": false, "e": "錯。「一個變，兩個沒有變」：仍將長期處於社會主義初級階段，仍是世界最大的發展中國家。", "id": "Q04-017", "l": 4, "ch": 1, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（04-011）"]}, {"k": "多", "s": [11], "q": "「一個變，兩個沒有變」中，「兩個沒有變」是指：", "o": ["我國仍將長期處於社會主義初級階段的基本國情沒有變", "我國是世界上最大的發展中國家的國際地位沒有變", "社會主要矛盾沒有變", "黨的基本路線的內容沒有變"], "a": [0, 1], "e": "變的是主要矛盾；不變的是初級階段國情、最大發展中國家地位。", "id": "Q04-018", "l": 4, "ch": 1, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（04-011）"]}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師指出，社會主要矛盾的變化是黨作出「中國特色社會主義進入新時代」這一重大判斷的：", "o": ["根本依據", "重要條件", "歷史起點", "最終目標"], "a": 0, "e": "原話：主要矛盾變化「是我們黨做出中國特色社會主義進入到新時代重大判斷的根本依據」。", "id": "Q04-019", "l": 4, "ch": 1, "pt": "C", "ps": 0, "pr": []}, {"k": "單", "s": [5], "q": "新時代意味着近代以來久經磨難的中華民族迎來了：", "o": ["從站起來、富起來到強起來的偉大飛躍", "從富起來到強起來的歷史轉變", "從站起來到富起來的根本轉折", "從落後到領先的全面超越"], "a": 0, "e": "原文：從站起來、富起來到強起來的偉大飛躍。", "id": "Q04-020", "l": 4, "ch": 1, "pt": "A", "ps": 24, "pr": ["老師：…三个意义也一样需要大家去背过（04-004）", "投影片黃字／黃筆標記（04-005）"]}, {"k": "判", "s": [16], "q": "新時代偉大變革的里程碑意義之一是：黨同人民群眾始終保持血肉聯繫。", "a": true, "e": "對。講師提醒是「血肉聯繫」，不是普通聯繫。", "id": "Q04-021", "l": 4, "ch": 1, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（04-016）"]}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，新時代反腐敗鬥爭最重要的一點是：", "o": ["取得了壓倒性勝利", "取得了階段性成果", "取得了決定性進展", "取得了全面勝利"], "a": 0, "e": "原話：「反腐敗的鬥爭，最重要的一點是取得了壓倒性的勝利。」", "id": "Q04-022", "l": 4, "ch": 1, "pt": "C", "ps": 0, "pr": []}, {"k": "論", "s": [4], "q": "論述：如何理解中國特色社會主義新時代的內涵？", "sum": "一句白話：新時代是接過前人的接力棒、建成現代化強國、讓大家一起富起來、實現中國夢、並為世界作更大貢獻的時代。", "pts": ["承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代", "决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代", "全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代", "全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代", "我国日益走近世界舞台中央、不断为人类作出更大贡献的时代"], "e": "講師：新時代內涵是大題考點（論述／簡答／材料分析第二小問），五點要背。", "id": "Q04-023", "l": 4, "ch": 1, "pt": "A", "ps": 36, "pr": ["老師：…重要的内容 也是我们的大题考点……可以考论述题 可以…（04-004）", "老師：…三个意义也一样需要大家去背过（04-004）", "投影片黃字／黃筆標記（04-004）"]}, {"k": "簡", "s": [5], "q": "簡答：中國特色社會主義進入新時代的意義是什麼？", "sum": "一句白話：對中華民族、對科學社會主義、對世界都有重大意義。", "pts": ["中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景", "科学社会主义在21世纪的中国焕发出强大生机活力，高高举起了中国特色社会主义伟大旗帜", "拓展了发展中国家走向现代化的途径，提供了全新选择，为解决人类问题贡献了中国智慧和中国方案"], "e": "講師：「三個意義也一樣需要大家去背過。」", "id": "Q04-024", "l": 4, "ch": 1, "pt": "A", "ps": 45, "pr": ["老師：…三个意义也一样需要大家去背过（04-004）", "投影片黃字／黃筆標記（04-005）"]}, {"s": [3], "src": "", "card": "C05-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的基本理論＝行動指南；馬克思主義行：\n中国共产党为什么能，中国特色社会主义为什么好，归根到底是（＿①＿），是（＿②＿）", "a": ["马克思主义行", "中国化时代化的马克思主义行"], "e": "黨的基本理論是中國特色社會主義的「行動指南」。共產黨為什麼「能」、中特為什麼「好」？說到底是因為馬克思主義行，而且是中國化時代化的馬克思主義行。", "id": "Q05-001", "l": 5, "ch": 1, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（05-003）"]}, {"s": [0], "src": "逐字稿", "card": "C05-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜習近平新時代中國特色社會主義思想的地位：\n习近平新时代中国特色社会主义思想是新时代中国共产党的（＿①＿），是新时代党和国家事业发展的（＿②＿）", "a": ["思想旗帜", "根本遵循"], "e": "這個思想是新時代共產黨的「思想旗幟」，也是新時代黨和國家事業發展的「根本遵循」（最根本要跟着做的規則）。", "id": "Q05-002", "l": 5, "ch": 1, "pt": "C", "ps": 0, "pr": []}, {"s": [4], "src": "", "card": "C05-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的基本路線（全文）：\n领导和团结全国各族人民，以（＿①＿）为中心，坚持（＿②＿），坚持（＿③＿），（＿④＿），为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗", "a": ["经济建设", "四项基本原则", "改革开放", "自力更生，艰苦创业"], "e": "基本路線是社會主義初級階段的「總路線圖」：一個中心（經濟建設）、兩個基本點（四項基本原則、改革開放），作風是自力更生、艱苦創業，目標是建成社會主義現代化強國。講師：要把基本路線全部背過。", "id": "Q05-003", "l": 5, "ch": 1, "pt": "A", "ps": 17, "pr": ["老師：…时期把他的那个基本路线背过 你就要在这个地方呢 你要…（05-004）", "投影片黃字／黃筆標記（05-004）", "老師：…是我党的生命线……一定注意他们之间是有区别的（05-004）"]}, {"s": [4], "src": "", "card": "C05-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜黨的基本路線（全文）", "model": "领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗", "pts": ["领导和团结全国各族人民", "以经济建设为中心（一个中心）", "坚持四项基本原则、坚持改革开放（两个基本点）", "自力更生，艰苦创业（作风）", "为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗（目标）"], "e": "記法：「一中心、兩基本點、一作風、一目標」＝經濟建設｜四項基本原則＋改革開放｜自力更生艱苦創業｜富民文和美強國。", "id": "Q05-004", "l": 5, "ch": 1, "pt": "A", "ps": 17, "pr": ["老師：…时期把他的那个基本路线背过 你就要在这个地方呢 你要…（05-004）", "投影片黃字／黃筆標記（05-004）", "老師：…是我党的生命线……一定注意他们之间是有区别的（05-004）"]}, {"s": [4], "src": "", "card": "C05-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：基本路線 vs 群眾路線：\n党的基本路线是（＿①＿）；群众路线是（＿②＿）", "a": ["国家的生命线、人民的幸福线", "党的生命线"], "e": "兩條「生命線」別搞混！黨的「基本路線」是「國家的」生命線、人民的幸福線；「群眾路線」是「黨的」生命線（第14堂再講：群眾路線是黨的根本工作方法）。講師：「一定注意他們之間是有區別的。」", "id": "Q05-005", "l" 化国家", "全面深化改革、全面依法治国、全面从严治党"], "e": "四個全面裏，「全面建設社會主義現代化國家」是要到達的「目標」；其餘三個（全面深化改革、全面依法治國、全面從嚴治黨）是達到目標的「手段（舉措）」。以前叫「全面建成小康社會」，現已改為「全面建設社會主義現代化國家」。", "id": "Q05-023", "l": 5, "ch": 1, "pt": "B", "ps": 5, "pr": ["老師：注意 我们四个全面中 有一个是战略目标……全面建设…（05-008）", "投影片黃字／黃筆標記（05-008）"]}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在「四個全面」中，「全面建设社会主义现代化国家」屬於：", "o": ["战略目标", "战略举措", "总体布局", "战略方针"], "a": 0, "e": "「全面建设社会主义现代化国家」→「战略目标」。記法：「一目標三舉措」：目標是「現代化國家」，舉措是「改・法・黨」。", "id": "Q05-024", "l": 5, "ch": 1, "pt": "B", "ps": 5, "pr": ["老師：注意 我们四个全面中 有一个是战略目标……全面建设…（05-008）", "投影片黃字／黃筆標記（05-008）"]}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "在「四個全面」中，「全面建设社会主义现代化国家」屬於战略目标。", "a": true, "e": "對。「全面建设社会主义现代化国家」→「战略目标」。", "id": "Q05-025", "l": 5, "ch": 1, "pt": "B", "ps": 5, "pr": ["老師：注意 我们四个全面中 有一个是战略目标……全面建设…（05-008）", "投影片黃字／黃筆標記（05-008）"]}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "在「四個全面」中，「全面深化改革」屬於：", "o": ["战略举措", "战略目标", "总体布局", "战略方针"], "a": 0, "e": "「全面深化改革」→「战略举措」。記法：「一目標三舉措」：目標是「現代化國家」，舉措是「改・法・黨」。", "id": "Q05-026", "l": 5, "ch": 1, "pt": "B", "ps": 5, "pr": ["老師：注意 我们四个全面中 有一个是战略目标……全面建设…（05-008）", "投影片黃字／黃筆標記（05-008）"]}, {"s": [8], "src": "", "card": "C05-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "在「四個全面」中，「全面深化改革」屬於战略目标。", "a": false, "e": "錯。「全面深化改革」應對應「战略举措」，「战略目标」對應的是「全面建设社会主义现代化国家」。", "id": "Q05-027", "l": 5, "ch": 1, "pt": "B", "ps": 5, "pr": ["老師：注意 我们四个全面中 有一个是战略目标……全面建设…（05-008）", "投影片黃字／黃筆標記（05-008）"]}, {"s": [9], "src": "", "card": "C05-09", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜推動中國特色社會主義不斷開拓前進：\n（1）社会主义是一个（＿①＿）的实践过程；（2）社会主义发展道路充满着（＿②＿）", "a": ["不断发展和完善", "险阻曲折"], "e": "社會主義不是一次就完成的，要不斷發展和完善；而且發展的路上會有困難和曲折。", "id": "Q05-028", "l": 5, "ch": 1, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（05-009）"]}, {"k": "單", "s": [4], "q": "黨的基本路線是：", "o": ["國家的生命線、人民的幸福線", "黨的生命線", "黨的根本工作方法", "黨 q": "默寫｜推進中國式現代化的五個重大原則", "model": "（一）坚持和加强党的全面领导；（二）坚持中国特色社会主义道路；（三）坚持以人民为中心的发展思想；（四）坚持深化改革开放；（五）坚持发扬斗争精神", "pts": ["坚持和加强党的全面领导", "坚持中国特色社会主义道路", "坚持以人民为中心的发展思想", "坚持深化改革开放", "坚持发扬斗争精神"], "e": "記法：「領・路・民・改・鬥」：誰領導→走什麼路→為了誰→靠什麼動力→用什麼精神。", "id": "Q08-002", "l": 8, "ch": 2, "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（08-003）", "老師：第二章「重點一定是中國式現代化」（06 srt 00:11）"]}, {"s": [3, 4, 5], "src": "", "card": "C08-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "推進中國式現代化需要牢牢把握的重大原則有：", "o": ["坚持和加强党的全面领导", "坚持中国特色社会主义道路", "坚持以人民为中心的发展思想", "坚持深化改革开放", "坚持效率优先"], "a": [0, 1, 2, 3], "e": "正確：坚持和加强党的全面领导；坚持中国特色社会主义道路；坚持以人民为中心的发展思想；坚持深化改革开放。干擾項：坚持效率优先。", "id": "Q08-003", "l": 8, "ch": 2, "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（08-003）", "老師：第二章「重點一定是中國式現代化」（06 srt 00:11）"]}, {"s": [3, 4, 5], "src": "", "card": "C08-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "推進中國式現代化需要牢牢把握的重大原則有：", "o": ["坚持以人民为中心的发展思想", "坚持发扬斗争精神", "坚持和加强党的全面领导", "坚持深化改革开放", "坚持效率优先"], "a": [0, 1, 2, 3], "e": "正確：坚持以人民为中心的发展思想；坚持发扬斗争精神；坚持和加强党的全面领导；坚持深化改革开放。干擾項：坚持效率优先。", "id": "Q08-004", "l": 8, "ch": 2, "pt": "B", "ps": 11, "pr": ["投影片黃字／黃筆標記（08-003）", "老師：第二章「重點一定是中國式現代化」（06 srt 00:11）"]}, {"s": [3], "src": "逐字稿", "card": "C08-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨是主心骨和領航者；舉旗與走路：\n中国共产党是全面建设社会主义现代化国家的（＿①＿）和（＿②＿）；举的是（＿③＿）的旗帜，走的是中国特色社会主义的道路", "a": ["主心骨", "领航者", "中国特色社会主义"], "e": "中國共產黨是全面建設社會主義現代化國家的「主心骨」和「領航者」。中國式現代化舉的是中國特色社會主義的旗幟，走的是中國特色社會主義的道路——講師說要搞清楚。", "id": "Q08-005", "l": 8, "ch": 2, "pt": "B", "ps": 5, "pr": ["投影片黃字／黃筆標記（08-003）", "老師：第二章「重點一定是中國式現代化」（06 srt 00:11）"]}, {"s": [6, 7, 8, 9, 10, 11], "src": "", "card": "C08-03", "tag": ["必背", "多選題考點"], "auto": 1, "k": "默", "q": "默寫｜需要正確處理的六組重大關係", "model": "顶层设计与实践探索；战略与策略；守正与创新；效率与公平；活力与秩序；自立自强与对外开放", "pts": ["顶层设计与实践探索", "战略与策略", "守正与创新", "效率与公平", "活力与秩序", "自立自强与对外开放"], "e": "記法：六對「上下・長短・新舊・快公・活序・內外」：頂層vs實踐（上下）、戰略vs策略（長短）、守正vs創新（舊新）、效率vs公平、活力vs秩序、自立vs開放（內外）。", "id": "Q08-006", "l": 8, "ch": 2, "pt": "B", "ps": 21, "pr": ["老師： 008）"]}, {"s": [9, 10], "src": "", "card": "C08-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜效率與公平；活力與秩序：\n（＿①＿）……（＿②＿）；应该既充满（＿③＿）又拥有良好（＿④＿）", "a": ["效率", "社会公平", "活力", "秩序"], "e": "既要有效率又要社會公平；既要充滿活力又要有良好秩序（活而不亂）。講師以手寫圖說明：中國式現代化是「並聯」式、同步發展的。", "id": "Q08-012", "l": 8, "ch": 2, "pt": "B", "ps": 11, "pr": ["老師：效率與公平：西方「以串聯的形式去進行發展」，中國式現…（08-009）", "投影片黃字／黃筆標記（08-009）", "老師：第二章「重點一定是中國式現代化」（06 srt 00:11）"]}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜自立自強與對外開放：\n（＿①＿）是中华民族精神之魂，是我们立党立国的（＿②＿）。（＿③＿）是中国的（＿④＿），任何时候都不能动摇", "a": ["独立自主", "重要原则", "对外开放", "基本国策"], "e": "獨立自主是中華民族的精神之魂、立黨立國的重要原則；對外開放是中國的基本國策，任何時候都不能動搖。", "id": "Q08-013", "l": 8, "ch": 2, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（08-011）"]}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「独立自主」是：", "o": ["中华民族精神之魂，是我们立党立国的重要原则", "中国的基本国策，任何时候都不能动摇", "中国特色社会主义最本质的特征", "党的根本工作方法"], "a": 0, "e": "「独立自主」→「中华民族精神之魂，是我们立党立国的重要原则」。記法：「獨立自主＝魂＋原則；對外開放＝國策」。", "id": "Q08-014", "l": 8, "ch": 2, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（08-011）"]}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「独立自主」是中华民族精神之魂，是我们立党立国的重要原则。", "a": true, "e": "對。「独立自主」→「中华民族精神之魂，是我们立党立国的重要原则」。", "id": "Q08-015", "l": 8, "ch": 2, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（08-011）"]}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「对外开放」是：", "o": ["中国的基本国策，任何时候都不能动摇", "中华民族精神之魂，是我们立党立国的重要原则", "中国特色社会主义最本质的特征", "党的根本工作方法"], "a": 0, "e": "「对外开放」→「中国的基本国策，任何时候都不能动摇」。記法：「獨立自主＝魂＋原則；對外開放＝國策」。", "id": "Q08-016", "l": 8, "ch": 2, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（08-011）"]}, {"s": [11], "src": "", "card": "C08-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「对外开放」是中华民族精神之魂，是我们立党立国的重要原则。", "a": false, "e": "錯。「对外开放」應對應「中国的基本国策，任何时候都不能动摇」，「中华民族精神之魂，是我们立党立国的重要原则」對應的是「独立自主」。", "id": "Q08-017", "l": 8, "ch": 2, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（08-011）"]}, {"s": [12, 13], "src": "", "card": "C08-08", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜必須堅持團結奮鬥：\n（1）团结奋斗是中国人民创造历史伟业的（＿①＿）；（2）只有持续团结奋斗，才能完成（＿②＿）；（3）大力弘扬（＿③＿）", "a": ["必由之路", "中国式现代化", "团结奋斗精神"], "e": "團結奮鬥是中國人民創造歷史偉業的「必由之路」（講師：把這一句記住）。只有持續團結奮鬥，才能完成中國式現代化；要大力弘揚團結奮鬥精神。", "id": "Q08-018", "l": 8, "ch": 2, "pt": "B", "ps": 8, "pr": ["投影片黃字／黃筆標記（08-012）", "老師：第二章「重點一定是中國式現代化」（06 srt 00:11）"]}, {"k": "單", "s": [12], "q": "團結奮鬥是中國人民創造歷史偉業的：", "o": ["必由之路", "根本保證", "重要法寶", "精神支撐"], "a": 0, "e": "原文：團結奮鬥是中國人民創造歷史偉業的必由之路。", "id": "Q08-019", "l": 8, "ch": 2, "pt": "B", "ps": 9, "pr": ["投影片黃字／黃筆標記（08-012）", "老師：第二章「重點一定是中國式現代化」（06 srt 00:11）"]}, {"k": "單", "s": [11], "q": "獨立自主是中華民族＿＿，是我們立黨立國的重要原則。", "o": ["精神之魂", "根和魂", "生命線", "最大法寶"], "a": 0, "e": "原文：獨立自主是中華民族精神之魂。", "id": "Q08-020", "l": 8, "ch": 2, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（08-011）"]}, {"k": "判", "s": [11], "q": "對外開放是中國的基本國策，任何時候都不能動搖。", "a": true, "e": "對。投影片黃字原文。", "id": "Q08-021", "l": 8, "ch": 2, "pt": "B", "ps": 6, "pr": ["投影片黃字／黃筆標記（08-011）"]}, {"k": "單", "s": [7], "q": "「從全局、長遠、大勢上作出判斷和決策」的是：", "o": ["戰略", "策略", "頂層設計", "實踐探索"], "a": 0, "e": "戰略看全局、長遠、大勢；策略在戰略指導下為戰略服務。", "id": "Q08-022", "l": 8, "ch": 2, "pt": "B", "ps": 12, "pr": ["老師：我們一定要注意 要把握好戰略和策略的關係（08-007）", "投影片黃字／黃筆標記（08-007）", "老師：一定要注意。（08-007）"]}, {"k": "判", "s": [7], "q": "戰略是在策略指導下為策略服務的。", "a": false, "e": "錯（對調了）。是「策略在戰略指導下為戰略服務」。", "id": "Q08-023", "l": 8, "ch": 2, "pt": "B", "ps": 4, "pr": ["老師：我們一定要注意 要把握好戰略和策略的關係（08-007）", "投影片黃字／黃筆標記（08-007）"]}, {"k": "判", "s": [3, 4, 5], "q": "「堅持發揚鬥爭精神」是推進中國式現代化需要牢牢把握的重大原則之一。", "a": true, "e": "對。五大原則第五條。", "id": "Q08-024", "l": 8, "ch": 2, "pt": "B", "ps": 15, "pr": ["投影片黃字／黃筆標記（08-005）", "老師：第二章「重點一定是中國式現代化」（06 srt 00:11）"]}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師指出，中國共產黨是全面建設社會主義現代化國家的：", "o": ["主心骨和領航者", "根本保證和精神支撐", "行動指南和根本遵循", "中流砥柱和旗幟"], "a": 0, "e": "原話：「中國共產黨是全面建設社會主義現代化國家的主心骨和領航者。」", "id": "Q08-025", "l": 8, "ch": 2, "pt": "C", "ps": 0, "pr": []}, {"k": "填", "s": [7], 點呢去看一下 我們黨中央的一些決策的…（11-006）", "投影片黃字／黃筆標記（11-006）"]}, {"k": "判", "s": [0], "src": "逐字稿", "q": "四個全面中，第一個「全面建設社會主義現代化國家」是戰略目標，其餘三個是戰略舉措。", "a": true, "e": "對。講師在本堂複習：「五位一體和四個全面」是非常重要的知識點。", "id": "Q11-030", "l": 11, "ch": 3, "pt": "C", "ps": 0, "pr": []}, {"s": [4, 5], "src": "", "card": "C12-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民是歷史的創造者，是真正的英雄：\n（1）人民是（＿①＿），是（＿②＿）；（2）尊重人民（＿③＿），充分发挥人民（＿④＿）", "a": ["历史的创造者", "真正的英雄", "历史地位", "主体作用"], "e": "歷史是誰創造的？是人民。人民創造物質財富和精神財富，也是推動社會變革的決定力量。所以要尊重人民的歷史地位，充分發揮人民的主體作用。講師：「標黃色的部分是你重點要去背的部分。」", "id": "Q12-001", "l": 12, "ch": 4, "pt": "A", "ps": 29, "pr": ["老師：…黃色的部分 是你重點要去背的部分 那麼有同學可能會問…（12-005）", "投影片黃字／黃筆標記（12-005）"]}, {"s": [4, 5], "src": "", "card": "C12-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜人民是歷史的創造者，是真正的英雄", "model": "（1）人民是历史的创造者，是真正的英雄；（2）尊重人民历史地位，充分发挥人民主体作用", "pts": ["历史的创造者", "真正的英雄", "历史地位", "主体作用"], "e": "記法：「創造者＋英雄」；「尊重地位、發揮作用」。", "id": "Q12-002", "l": 12, "ch": 4, "pt": "A", "ps": 29, "pr": ["老師：…黃色的部分 是你重點要去背的部分 那麼有同學可能會問…（12-005）", "投影片黃字／黃筆標記（12-005）"]}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜民心是最大的政治 vs 就業是最大的民生：\n（＿①＿）是最大的政治，决定事业兴衰成败；（＿②＿）是最大的民生", "a": ["民心", "就业"], "e": "「民心」是最大的政治，決定事業興衰成敗；講師順帶提醒另一個選擇題考點：「就業」是最大的民生。兩個「最大」不要混。", "id": "Q12-003", "l": 12, "ch": 4, "pt": "A", "ps": 15, "pr": ["老師：…我們說有一個非常熟悉的考點吧 就業是什麼 最大的民生…（12-006）", "投影片黃字／黃筆標記（12-006）"]}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師強調的選擇題考點：「民心」是：", "o": ["最大的政治", "最大的民生", "最大的国情", "最大的优势"], "a": 0, "e": "「民心」→「最大的政治」。記法：「民心→政治；就業→民生」——「心裏想的是政治，飯碗是民生」。", "id": "Q12-004", "l": 12, "ch": 4, "pt": "A", "ps": 15, "pr": ["老師：…我們說有一個非常熟悉的考點吧 就業是什麼 最大的民生…（12-006）", "投影片黃字／黃筆標記（12-006）"]}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「民心」是最大的政治。", "a": true, "e": "對。「民心」→「最大的政治」。", "id": "Q12-005", "l": 12, "ch": 4, "pt": "A", "ps": 15, "pr": ["老師：…我們說有一個非常熟悉的考點吧 就業是什麼 最大的民生…（12-006）", "投影片黃字／黃筆標記（12-006）"]}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師強調的選擇題考點：「就业」是：", "o": ["最大的民生", "最大的政治", "最大的国情", "最大的优势"], "a": 0, "e": "「就业」→「最大的民生」。記法：「民心→政治；就業→民生」——「心裏想的是政治，飯碗是民生」。", "id": "Q12-006", "l": 12, "ch": 4, "pt": "A", "ps": 15, "pr": ["老師：…我們說有一個非常熟悉的考點吧 就業是什麼 最大的民生…（12-006）", "投影片黃字／黃筆標記（12-006）"]}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「就业」是最大的政治。", "a": false, "e": "錯。「就业」應對應「最大的民生」，「最大的政治」對應的是「民心」。", "id": "Q12-007", "l": 12, "ch": 4, "pt": "A", "ps": 15, "pr": ["老師：…我們說有一個非常熟悉的考點吧 就業是什麼 最大的民生…（12-006）", "投影片黃字／黃筆標記（12-006）"]}, {"s": [7], "src": "", "card": "C12-03", "tag": ["必背"], "auto": 1, "k": "填", "q": "填空｜我國國體（要背過）：\n我国是（＿①＿）领导的、以（＿②＿）为基础的（＿③＿）的社会主义国家", "a": ["工人阶级", "工农联盟", "人民民主专政"], "e": "「國體」＝國家的性質：由誰領導、靠誰作基礎。講師：「這一段呢我就要求你們把這個國體給我背過了。」補充：人民代表大會是我國最高的權力機關。", "id": "Q12-008", "l": 12, "ch": 4, "pt": "A", "ps": 27, "pr": ["老師：…要求你們把這個國體給我背過了 我們國家的國體給我背過…（12-007）", "投影片黃字／黃筆標記（12-007）"]}, {"s": [7], "src": "", "card": "C12-03", "tag": ["必背"], "auto": 1, "k": "默", "q": "默寫｜我國國體（要背過）", "model": "我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家", "pts": ["工人阶级", "工农联盟", "人民民主专政"], "e": "記法：「工人領、工農基、人民專政」。", "id": "Q12-009", "l": 12, "ch": 4, "pt": "A", "ps": 27, "pr": ["老師：…要求你們把這個國體給我背過了 我們國家的國體給我背過…（12-007）", "投影片黃字／黃筆標記（12-007）"]}, {"s": [8], "src": "", "card": "C12-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜江山就是人民，人民就是江山：\n（＿①＿）；打江山、守江山，守的是（＿②＿）", "a": ["江山就是人民，人民就是江山", "人民的心"], "e": "國家（江山）就是人民，人民就是國家。這是由黨的性質和宗旨決定的。打江山、守江山，守的是人民的心。", "id": "Q12-010", "l": 12, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（12-008）"]}, {"s": [9], "src": "", "card": "C12-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜人民立場是黨的根本政治立場；顯著標誌：\n人民立场是中国共产党的（＿①＿）；是我们党区别于其他政党的（＿②＿）", "a": ["根本政治立场", "显著标志"], "e": "人民立場是中國共產黨的「根本政治立場」，也是我們黨區別於其他政黨的「顯著標誌」。講師：兩個都是選擇題考點。", "id": "Q12-011", "l": uto": 1, "k": "填", "q": "填空｜人民對美好生活的嚮往就是黨的奮鬥目標：\n人民对美好生活的向往就是党的（＿①＿）；（1）让人民过上好日子是党（＿②＿）；（2）新时代人民对美好生活的向往", "a": ["奋斗目标", "一贯的追求"], "e": "讓人民過上好日子是黨一直以來的追求（為人民謀幸福是黨始終堅守的初心）。新時代人民對美好生活的嚮往：講師說這裏答題不只背標題，要結合「全面建成小康社會」和「社會主要矛盾轉化」稍微擴充。", "id": "Q13-001", "l": 13, "ch": 4, "pt": "A", "ps": 21, "pr": ["老師：…內容呢 可能不只要我們去背這個標題 這個標題呢其實它…（13-004）", "投影片黃字／黃筆標記（13-003）"]}, {"s": [6], "src": "", "card": "C13-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民是黨的生命之根、執政之基、力量之源：\n人民是我们党的（＿①＿）、（＿②＿）、（＿③＿）；依靠人民创造历史伟业，必须尊重人民（＿④＿）", "a": ["生命之根", "执政之基", "力量之源", "主体地位"], "e": "人民對黨來說就像「根、地基、電源」。依靠人民創造歷史偉業，必須尊重人民主體地位；堅持人民主體地位、調動人民積極性，是黨立於不敗之地的強大根基。", "id": "Q13-002", "l": 13, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（13-006）"]}, {"s": [6], "src": "", "card": "C13-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "多", "q": "人民是我們黨的：", "o": ["生命之根", "执政之基", "力量之源", "最高裁决者之本", "精神之魂"], "a": [0, 1, 2], "e": "正確：生命之根；执政之基；力量之源。干擾項：最高裁决者之本；精神之魂。", "id": "Q13-003", "l": 13, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（13-006）"]}, {"s": [7], "src": "", "card": "C13-03", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜必須尊重人民首創精神（四點）：\n①始终把人民群众作为（＿①＿）；②就要（＿②＿），坚持顶层设计和基层探索相统一，大胆探索、勇于开拓，鼓励创新、（＿③＿）；③就要激发人民群众的（＿④＿）；④就要及时发现、总结、概括人民群众实践中形成的（＿⑤＿），使之上升为理论和政策", "a": ["智慧和力量的源泉", "尊重实践、尊重创造", "宽容失败", "创新创造活力", "新鲜经验"], "e": "「首創精神」＝人民自己想出新辦法的精神。四點：①把人民當作智慧和力量的源泉；②尊重實踐、尊重創造，頂層設計和基層探索相統一，鼓勵創新、寬容失敗；③激發人民的創新創造活力；④及時總結人民實踐中的新鮮經驗，上升為理論和政策。講師：可以作為簡答題。", "id": "Q13-004", "l": 13, "ch": 4, "pt": "A", "ps": 13, "pr": ["老師：…是可以 作爲一個簡單（簡答）提出來（13-007）", "投影片黃字／黃筆標記（13-007）"]}, {"s": [7], "src": "", "card": "C13-03", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜必須尊重人民首創精神（四點）", "model": "①始终把人民群众作为智慧和力量的源泉；②就要尊重实践、尊重创造，坚持顶层设计和基层探索相统一，大胆探索、勇于开拓，鼓励创新、宽容失败；③就要激发人民群众的创新创造活力；④就要及时发现、总结、概括人民群众实践中形成的新鲜经验，使之上升为理论和政策", "pts": ["始终把人民群众作为智慧和力量的源泉", "尊重实践、尊重创造，坚持顶层设计和基层探索相统一，鼓励创新、宽容失败", "激发人民群众的创新创造活力", "及时发现、总结、概括人民群众实践中形成的新鲜经验，使之上升为理论和政策"], "e": "記法：「源泉・尊重・激發・總結」：先當源泉，再尊重，再激發，最後總結經驗。", "id": "Q13-005", "l": 13, "ch": 4, "pt": "A", "ps": 13, "pr": ["老師：…是可以 作爲一個簡單（簡答）提出來（13-007）", "投影片黃字／黃筆標記（13-007）"]}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民是最高裁決者和最終評判者（出卷人・答卷人・閱卷人）：\n人民是党的工作的（＿①＿）和（＿②＿）；时代是（＿③＿），我们是（＿④＿），人民是（＿⑤＿）；让（＿⑥＿）是我们党做好一切工作的价值取向和根本标准；牢固树立和践行正确的（＿⑦＿）", "a": ["最高裁决者", "最终评判者", "出卷人", "答卷人", "阅卷人", "群众满意", "政绩观"], "e": "黨的工作做得好不好，由人民打分。「時代是出卷人，我們是答卷人，人民是閱卷人。」要以人民滿意不滿意作為檢驗工作的最終評判標準；讓群眾滿意是黨做好一切工作的價值取向和根本標準；要樹立和踐行正確的政績觀。", "id": "Q13-006", "l": 13, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（13-008）"]}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「時代是出卷人，我們是答卷人，人民是閱卷人」中，「时代」是：", "o": ["出卷人", "阅卷人", "答卷人", "监考人"], "a": 0, "e": "「时代」→「出卷人」。記法：考試比喻：「時代出題、黨答題、人民改卷」。", "id": "Q13-007", "l": 13, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（13-008）"]}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「时代」是出卷人。", "a": true, "e": "對。「时代」→「出卷人」。", "id": "Q13-008", "l": 13, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（13-008）"]}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「時代是出卷人，我們是答卷人，人民是閱卷人」中，「我们（党）」是：", "o": ["答卷人", "阅卷人", "出卷人", "监考人"], "a": 0, "e": "「我们（党）」→「答卷人」。記法：考試比喻：「時代出題、黨答題、人民改卷」。", "id": "Q13-009", "l": 13, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（13-008）"]}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「我们（党）」是阅卷人。", "a": false, "e": "錯。「我们（党）」應對應「答卷人」，「阅卷人」對應的是「人民」。", "id": "Q13-010", "l": 13, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（13-008）"]}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「時代是出卷人，我們是答卷人，人民是閱卷人」中，「人民」是：", "o": ["阅卷人", "出卷人", "答卷人", "监考人"], "a": 0, "e": "「人民」→「阅卷人」。記法：考試比喻：「時代出題、黨答題、人民改卷」。", "id": "Q13-011", "l": 13, "ch": 4, "pt": "B", "ps": 3, "pr": ["投影片黃字／黃筆標記（13-008）"]}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"
