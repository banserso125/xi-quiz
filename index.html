主植根於我國社會主義民主的長期實踐，是新時代我國民主政治領域具有重大創新意義的「標誌性成果」。", "id": "Q27-001", "l": 27, "ch": 8}, {"s": [4, 5], "src": "", "card": "C27-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜全過程人民民主的特點（四個統一）：\n（＿①＿）的统一、（＿②＿）的统一、（＿③＿）的统一、（＿④＿）的统一", "a": ["过程民主和成果民主", "程序民主和实质民主", "直接民主和间接民主", "人民民主和国家意志"], "e": "四個「統一」：過程民主和成果民主的統一、程序民主和實質民主的統一、直接民主和間接民主的統一、人民民主和國家意志的統一。講師：「記住。」例子：不只看投票過程（過程），也看結果有沒有幫到人民（成果）。", "id": "Q27-002", "l": 27, "ch": 8}, {"s": [4, 5], "src": "", "card": "C27-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "默", "q": "默寫｜全過程人民民主的特點（四個統一）", "model": "过程民主和成果民主的统一、程序民主和实质民主的统一、直接民主和间接民主的统一、人民民主和国家意志的统一", "pts": ["过程民主和成果民主的统一", "程序民主和实质民主的统一", "直接民主和间接民主的统一", "人民民主和国家意志的统一"], "e": "記法：「過成・程實・直間・民國」四對。", "id": "Q27-003", "l": 27, "ch": 8}, {"s": [4, 5], "src": "", "card": "C27-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "多", "q": "全過程人民民主的特點包括：", "o": ["过程民主和成果民主的统一", "程序民主和实质民主的统一", "直接民主和间接民主的统一", "人民民主和国家意志的统一", "选举民主和精英民主的统一"], "a": [0, 1, 2, 3], "e": "正確：过程民主和成果民主的统一；程序民主和实质民主的统一；直接民主和间接民主的统一；人民民主和国家意志的统一。干擾項：选举民主和精英民主的统一。", "id": "Q27-004", "l": 27, "ch": 8}, {"s": [6], "src": "", "card": "C27-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜全鏈條・全方位・全覆蓋的民主：\n全过程人民民主是（＿①＿）、（＿②＿）、（＿③＿）的民主", "a": ["全链条", "全方位", "全覆盖"], "e": "全過程人民民主是全鏈條、全方位、全覆蓋的民主（貫穿五位一體、四個全面各方面）。", "id": "Q27-005", "l": 27, "ch": 8}, {"s": [7, 8], "src": "", "card": "C27-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜最廣泛・最真實・最管用的民主：\n全过程人民民主是（＿①＿）、（＿②＿）、（＿③＿）的民主", "a": ["最广泛", "最真实", "最管用"], "e": "講師：選擇題——全過程人民民主是最廣泛、最真實、最管用的民主。下面內文不需要背，理解意思即可。注意別和「全鏈條、全方位、全覆蓋」混。", "id": "Q27-006", "l": 27, "ch": 8}, {"s": [0], "src": "逐字稿", "card": "C27-05", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民行使國家權力的機關：\n人民行使国家权力的机关是（＿①＿）和（＿②＿）", "a": ["全国人民代表大会", "地方各级人民代表大会"], "e": "講師：人民行使國家權力的機關是全國人民代表大會和地方各級人民代表大會。", "id": "Q27-007", "l": 27, "ch": 8}, {"k": "多", "s": [7, 8], "q": "講師出的選擇題：全過程人民民主是（　　）的民主。", "o": ["最廣泛", "最真實", "最管用", "最先進"], "a": [0, 1, 2], "e": "最廣泛（A）、最真實（B）、最管用（C）。", "id": "Q27-008", "l": 27, "ch": 8}, {"k": "判", "s": [6], "q": "全過程人民民主是全鏈條、全方位、全覆蓋的民主。", "a": true, "e": "對。知識點3標題。", "id": "Q27-009", "l": 27, "ch": 8}, {"k": "單", "s": [3], "q": "新時代我國民主政治領域具有重大創新意義的標誌性成果是：", "o": ["全過程人民民主", "協商民主", "基層民主", "選舉民主"], "a": 0, "e": "講師原話。", "id": "Q27-010", "l": 27, "ch": 8}, {"k": "判", "s": [4, 5], "q": "全過程人民民主是過程民主和成果民主、程序民主和實質民主、直接民主和間接民主、人民民主和國家意志相統一的民主。", "a": true, "e": "對。四個統一。", "id": "Q27-011", "l": 27, "ch": 8}, {"k": "填", "s": [4, 5], "q": "全過程人民民主實現了過程民主和（＿①＿）的統一、程序民主和（＿②＿）的統一、直接民主和（＿③＿）的統一、人民民主和（＿④＿）的統一。", "a": ["成果民主", "实质民主", "间接民主", "国家意志"], "e": "四個統一。", "id": "Q27-012", "l": 27, "ch": 8}, {"k": "簡", "s": [4, 5], "q": "簡答：全過程人民民主有哪些特點？", "sum": "一句白話：它把過程和結果、程序和實質、直接和間接、人民意願和國家意志都結合在一起。", "pts": ["过程民主和成果民主的统一", "程序民主和实质民主的统一", "直接民主和间接民主的统一", "人民民主和国家意志的统一"], "e": "講師：「記住，一個是過程民主，一個是成果民主，一個是程序民主，一個是實質民主。」", "id": "Q27-013", "l": 27, "ch": 8}, {"k": "判", "s": [6], "q": "全過程人民民主是全鏈條、全方位、全覆蓋的民主。", "a": true, "e": "對。", "id": "Q27-014", "l": 27, "ch": 8}, {"k": "單", "s": [7, 8], "q": "全過程人民民主是＿＿的民主。", "o": ["最廣泛、最真實、最管用", "最先進、最科學、最徹底", "最直接、最平等、最公正", "最全面、最系統、最完整"], "a": 0, "e": "最廣泛、最真實、最管用。", "id": "Q27-015", "l": 27, "ch": 8}, {"k": "判", "s": [4, 5], "q": "全過程人民民主實現了過程民主和成果民主、程序民主和實質民主的統一。", "a": true, "e": "對，是四個統一中的兩個。", "id": "Q27-016", "l": 27, "ch": 8}, {"s": [4], "src": "", "card": "C28-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民代表大會制度是我國的根本政治制度：\n（＿①＿）是我国的（＿②＿）", "a": ["人民代表大会制度", "根本政治制度"], "e": "講師：「選擇題重要考點，非常重要。」問「最能夠體現人民當家作主的制度是什麼」，答人民代表大會制度。", "id": "Q28-001", "l": 28, "ch": 8}, {"s": [4], "src": "", "card": "C28-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜三項基本政治制度（記關鍵詞：多黨・民族・基層）：\n（＿①＿）、（＿②＿）、（＿③＿）", "a": ["中国共产党领导的多党合作和政治协商制度", "民族区域自治制度", "基层群众自治制度"], "e": "基本政治制度有三項：中國共產黨領導的多黨合作和政治協商制度、民族區域自治制度、基層群眾自治制度。講師：只考選擇題，記關鍵詞「多黨、民族、基層」。", "id": "Q28-002", "l": 28, "ch": 8}, {"s": [4], "src": "", "card": "C28-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "多", "q": "我國的基本政治制度包括：", "o": ["中国共产党领导的多党合作和政治协商制度", "民族区域自治制度", "基层群众自治制度", "人民代表大会制度", "党的领导制度"], "a": [0, 1, 2], "e": "正確：中国共产党领导的多党合作和政治协商制度；民族区域自治制度；基层群众自治制度。干擾項：人民代表大会制度；党的领导制度。", "id": "Q28-003", "l": 28, "ch": 8}, {"s": [5], "src": "", "card": "C28-03", "tag": ["必背"], "auto": 1, "k": "填", "q": "填空｜社會主義協商民主的定義：\n在中国共产党领导下，人民内部各方面围绕改革发展稳定重大问题和涉及群众切身利益的实际问题，在（＿①＿）开展（＿②＿），努力（＿③＿）的重要民主形式", "a": ["决策之前和决策实施之中", "广泛协商", "形成共识"], "e": "講師：「這個背」——協商民主就是在黨的領導下，人民內部各方面就重大問題和群眾切身利益問題，在決策之前和決策實施之中廣泛商量，努力形成共識的重要民主形式。（「源自……」一段不用背。）", "id": "Q28-004", "l": 28, "ch": 8}, {"s": [5], "src": "", "card": "C28-03", "tag": ["必背"], "auto": 1, "k": "默", "q": "默寫｜社會主義協商民主的定義", "model": "在中国共产党领导下，人民内部各方面围绕改革发展稳定重大问题和涉及群众切身利益的实际问题，在决策之前和决策实施之中开展广泛协商，努力形成共识的重要民主形式", "pts": ["决策之前和决策实施之中", "广泛协商", "形成共识"], "e": "記法：「黨領導・人民內部・決策前和中・廣泛協商・形成共識」。", "id": "Q28-005", "l": 28, "ch": 8}, {"s": [6, 7], "src": "", "card": "C28-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜協商民主是獨特的、獨有的、獨到的民主形式：\n协商民主是中国社会主义民主政治中（＿①＿）民主形式", "a": ["独特的、独有的、独到的"], "e": "講師：選擇題考點——協商民主是中國社會主義民主政治中獨特的、獨有的、獨到的民主形式。原因如：把發揚民主和增進團結相互貫通；暢通各種利益訴求進入決策程序的渠道；有發現和改正失誤和錯誤的機制；人民參與各層次管理和治理的機制；凝聚推進改革發展的智慧和力量。", "id": "Q28-006", "l": 28, "ch": 8}, {"s": [8], "src": "", "card": "C28-05", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜基層民主的地位和形式：\n（＿①＿）是全过程人民民主的（＿②＿）；形式：（＿③＿）、（＿④＿）、（＿⑤＿）", "a": ["基层民主", "重要体现", "村民委员会", "居民委员会", "职工代表大会"], "e": "地位（選擇題）：基層民主是全過程人民民主的重要體現。形式（多選題）：村民委員會（農村村民自治）、居民委員會（城市居民自治）、職工代表大會（企事業單位職工自治）。講師：「這三個你把我記住。」", "id": "Q28-007", "l": 28, "ch": 8}, {"s": [8], "src": "", "card": "C28-05", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "多", "q": "講師說的基層民主形式（多選題）有：", "o": ["村民委员会", "居民委员会", "职工代表大会", "人民代表大会", "政治协商会议"], "a": [0, 1, 2], "e": "正確：村民委员会；居民委员会；职工代表大会。干擾項：人民代表大会；政治协商会议。", "id": "Q28-008", "l": 28, "ch": 8}, {"s": [9], "src": "", "card": "C28-06", "tag": ["了解"], "auto": 1, "k": "填", "q": "填空｜堅持和完善基層群眾自治制度的要求：\n党的领导贯穿（＿①＿）；健全基层党组织领导的（＿②＿）；完善办事（＿③＿）；全心全意依靠（＿④＿）", "a": ["基层群众自治全过程", "基层群众自治机制", "公开制度", "工人阶级"], "e": "四項要求：黨的領導貫穿基層群眾自治全過程；健全基層黨組織領導的基層群眾自治機制；完善辦事公開制度；全心全意依靠工人階級。", "id": "Q28-009", "l": 28, "ch": 8}, {"k": "單", "s": [4], "q": "最能體現人民當家作主的制度是：", "o": ["人民代表大會制度", "民族區域自治制度", "基層群眾自治制度", "多黨合作制度"], "a": 0, "e": "講師：「問到你最能夠體現人民當家作主的制度是什麼？是人民代表大會制度。」", "id": "Q28-010", "l": 28, "ch": 8}, {"k": "單", "s": [6, 7], "q": "中國社會主義民主政治中獨特的、獨有的、獨到的民主形式是：", "o": ["協商民主", "選舉民主", "基層民主", "直接民主"], "a": 0, "e": "講師：選擇題考點。", "id": "Q28-011", "l": 28, "ch": 8}, {"k": "單", "s": [8], "q": "基層民主是＿＿的重要體現。", "o": ["全過程人民民主", "協商民主", "人民代表大會制度", "黨的領導"], "a": 0, "e": "地位＝選擇題。", "id": "Q28-012", "l": 28, "ch": 8}, {"k": "判", "s": [4], "q": "民族區域自治制度是我國的根本政治制度。", "a": false, "e": "錯。民族區域自治制度是基本政治制度；根本政治制度是人民代表大會制度。", "id": "Q28-013", "l": 28, "ch": 8}, {"k": "多", "s": [8], "q": "我國基層民主的形式包括：", "o": ["村民委員會", "居民委員會", "職工代表大會", "全國人民代表大會"], "a": [0, 1, 2], "e": "村、居、職三種；全國人大不是基層民主形式。", "id": "Q28-014", "l": 28, "ch": 8}, {"k": "單", "s": [4], "q": "我國的根本政治制度是：", "o": ["人民代表大會制度", "中國共產黨領導的多黨合作和政治協商制度", "民族區域自治制度", "基層群眾自治制度"], "a": 0, "e": "人大制度＝根本政治制度；另外三項＝基本政治制度。易混。", "id": "Q28-015", "l": 28, "ch": 8}, {"k": "判", "s": [4], "q": "民族區域自治制度是我國的根本政治制度。", "a": false, "e": "錯。它是基本政治制度之一；根本政治制度是人民代表大會制度。", "id": "Q28-016", "l": 28, "ch": 8}, {"k": "單", "s": [6, 7], "q": "協商民主是中國社會主義民主政治中＿＿的民主形式。", "o": ["獨特的、獨有的、獨到的", "最廣泛、最真實、最管用", "全鏈條、全方位、全覆蓋", "全面的、系統的、整體的"], "a": 0, "e": "獨特、獨有、獨到。後三項分別是全過程人民民主和黨的領導的表述。", "id": "Q28-017", "l": 28, "ch": 8}, {"k": "單", "s": [8], "q": "基層民主是＿＿的重要體現。", "o": ["全過程人民民主", "協商民主", "黨的全面領導", "依法治國"], "a": 0, "e": "「基層民主是全過程人民民主的重要體現」。", "id": "Q28-018", "l": 28, "ch": 8}, {"s": [3], "src": "", "card": "C29-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜統一戰線是凝聚人心、匯聚力量的強大法寶：\n统一战线是（＿①＿）的强大法宝；统一战线是中国共产党夺取革命、建设、改革事业胜利的（＿②＿），也是实现中华民族伟大复兴的重要法宝", "a": ["凝聚人心、汇聚力量", "重要法宝"], "e": "講師：統一戰線的核心兩個字就是「團結」。統一戰線是中國共產黨奪取革命、建設、改革事業勝利的重要法寶，也是實現中華民族偉大復興的重要法寶。", "id": "Q29-001", "l": 29, "ch": 8}, {"s": [3, 4], "src": "", "card": "C29-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜統戰工作的本質要求與關鍵：\n统战工作的本质要求是（＿①＿）；统战工作的关键是坚持（＿②＿）", "a": ["大团结大联合", "求同存异"], "e": "統戰工作的「本質要求」是大團結大聯合（解決人心和力量問題）；「關鍵」是堅持求同存異——找到最大公約數，畫出最大同心圓。工作對象是黨外人士，重點是其中的代表人士。", "id": "Q29-002", "l": 29, "ch": 8}, {"s": [3, 4], "src": "", "card": "C29-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「统战工作的本质要求」是：", "o": ["大团结大联合", "坚持求同存异", "党委领导", "民族团结"], "a": 0, "e": "「统战工作的本质要求」→「大团结大联合」。記法：「本質＝大團結大聯合；關鍵＝求同存異」。", "id": "Q29-003", "l": 29, "ch": 8}, {"s": [3, 4], "src": "", "card": "C29-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「统战工作的本质要求」是大团结大联合。", "a": true, "e": "對。「统战工作的本质要求」→「大团结大联合」。", "id": "Q29-004", "l": 29, "ch": 8}, {"s": [3, 4], "src": "", "card": "C29-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「统战工作的关键」是：", "o": ["坚持求同存异", "大团结大联合", "党委领导", "民族团结"], "a": 0, "e": "「统战工作的关键」→「坚持求同存异」。記法：「本質＝大團結大聯合；關鍵＝求同存異」。", "id": "Q29-005", "l": 29, "ch": 8}, {"s": [3, 4], "src": "", "card": "C29-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「统战工作的关键」是大团结大联合。", "a": false, "e": "錯。「统战工作的关键」應對應「坚持求同存异」，「大团结大联合」對應的是「统战工作的本质要求」。", "id": "Q29-006", "l": 29, "ch": 8}, {"s": [5], "src": "", "card": "C29-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜黨的領導是統一戰線最鮮明的特徵：\n（＿①＿）是统一战线（＿②＿），坚持党的领导是统一战线最根本的问题", "a": ["党的领导", "最鲜明的特征"], "e": "講師：「黨是領導着我們統一戰線的，這是最鮮明的特徵。」坚持黨的領導是統一戰線最根本的問題；主要體現為黨委領導，而不是部門領導。", "id": "Q29-007", "l": 29, "ch": 8}, {"s": [6], "src": "", "card": "C29-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜民族團結是生命線；共同體意識是民族團結之本：\n（＿①＿）是我国各族人民的（＿②＿），（＿③＿）是民族团结之（＿④＿）", "a": ["民族团结", "生命线", "中华民族共同体意识", "本"], "e": "民族團結是我國各族人民的「生命線」（講師：選擇）；中華民族共同體意識是民族團結之「本」。注意：這是第三條「生命線」（基本路線＝國家生命線；群眾路線＝黨的生命線；民族團結＝各族人民的生命線）。", "id": "Q29-008", "l": 29, "ch": 8}, {"s": [6], "src": "", "card": "C29-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「生命線」大辨析：「党的基本路线」是：", "o": ["国家的生命线、人民的幸福线", "我国各族人民的生命线", "党的生命线"], "a": 0, "e": "「党的基本路线」→「国家的生命线、人民的幸福线」。記法：生命線大集合：「基本路線→國家、群眾路線→黨、民族團結→各族人民」。", "id": "Q29-009", "l": 29, "ch": 8}, {"s": [6], "src": "", "card": "C29-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「党的基本路线」是国家的生命线、人民的幸福线。", "a": true, "e": "對。「党的基本路线」→「国家的生命线、人民的幸福线」。", "id": "Q29-010", "l": 29, "ch": 8}, {"s": [6], "src": "", "card": "C29-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「生命線」大辨析：「群众路线」是：", "o": ["党的生命线", "国家的生命线、人民的幸福线", "我国各族人民的生命线"], "a": 0, "e": "「群众路线」→「党的生命线」。記法：生命線大集合：「基本路線→國家、群眾路線→黨、民族團結→各族人民」。", "id": "Q29-011", "l": 29, "ch": 8}, {"s": [6], "src": "", "card": "C29-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「群众路线」是我国各族人民的生命线。", "a": false, "e": "錯。「群众路线」應對應「党的生命线」，「我国各族人民的生命线」對應的是「民族团结」。", "id": "Q29-012", "l": 29, "ch": 8}, {"s": [6], "src": "", "card": "C29-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「生命線」大辨析：「民族团结」是：", "o": ["我国各族人民的生命线", "党的生命线", "国家的生命线、人民的幸福线"], "a": 0, "e": "「民族团结」→「我国各族人民的生命线」。記法：生命線大集合：「基本路線→國家、群眾路線→黨、民族團結→各族人民」。", "id": "Q29-013", "l": 29, "ch": 8}, {"s": [6], "src": "", "card": "C29-04", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「民族团结」是我国各族人民的生命线。", "a": true, "e": "對。「民族团结」→「我国各族人民的生命线」。", "id": "Q29-014", "l": 29, "ch": 8}, {"s": [7, 8, 9], "src": "", "card": "C29-05", "tag": ["必背", "論述題考點"], "auto": 1, "k": "填", "q": "填空｜鑄牢中華民族共同體意識的要求（黃字關鍵語）：\n（＿①＿）；（＿②＿）；（＿③＿）；（＿④＿）；（＿⑤＿）；（＿⑥＿）", "a": ["休戚与共、荣辱与共、生死与共、命运与共", "共同性和差异性", "民族团结宣传教育", "推广普及国家通用语言文字", "差别化区域支持政策", "交往交流交融"], "e": "講師：「背一下，大題考點。」共八條，黃字關鍵語：休戚與共、榮辱與共、生死與共、命運與共的共同體理念；正確把握共同性和差異性；加強民族團結宣傳教育；推廣普及國家通用語言文字；差別化區域支持政策；促進各民族交往交流交融等。", "id": "Q29-015", "l": 29, "ch": 8}, {"s": [10, 11], "src": "", "card": "C29-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜做好新時代宗教工作：\n坚持我国（＿①＿）；宗教工作本质上是（＿②＿）；坚决抵御（＿③＿）", "a": ["宗教中国化方向", "群众工作", "境外利用宗教进行渗透"], "e": "講師：稍微背下，可作簡答題。①堅持我國宗教中國化方向；②宗教工作本質上是群眾工作；③堅決抵禦境外利用宗教進行滲透。", "id": "Q29-016", "l": 29, "ch": 8}, {"s": [10, 11], "src": ", "依法治国和以德治国", "依法治国和依规治党"], "e": "四對關係：政治和法治、改革和法治、依法治國和以德治國、依法治國和依規治黨。（易混：別與第08堂中國式現代化六組關係混。）", "id": "Q30-018", "l": 30, "ch": 9}, {"s": [15, 16, 17, 18], "src": "", "card": "C30-08", "tag": ["多選題考點"], "auto": 1, "k": "多", "q": "統籌處理全面依法治國的重大關係包括：", "o": ["政治和法治", "改革和法治", "依法治国和以德治国", "依法治国和依规治党", "活力和秩序"], "a": [0, 1, 2, 3], "e": "正確：政治和法治；改革和法治；依法治国和以德治国；依法治国和依规治党。干擾項：活力和秩序。", "id": "Q30-019", "l": 30, "ch": 9}, {"k": "單", "s": [6], "q": "全面依法治國是堅持和發展中國特色社會主義的：", "o": ["本質要求和重要保障", "根本保證", "必由之路", "戰略目標"], "a": 0, "e": "講師：「這一塊呢，我們需要作為一個選擇的記憶。」", "id": "Q30-020", "l": 30, "ch": 9}, {"k": "單", "s": [0], "src": "逐字稿", "q": "提到全面依法治國，對應的會議是：", "o": ["十八屆四中全會", "十八屆三中全會", "十一屆三中全會", "十九屆六中全會"], "a": 0, "e": "三中改革，四中法治。", "id": "Q30-021", "l": 30, "ch": 9}, {"k": "單", "s": [12], "q": "社會主義法律的基本屬性是：", "o": ["平等", "公正", "強制", "權威"], "a": 0, "e": "講師：「平等是什麼？是社會主義法律的基本屬性，把這個記住，選擇。」", "id": "Q30-022", "l": 30, "ch": 9}, {"k": "判", "s": [8], "q": "黨的領導是社會主義法治最根本的保證。", "a": true, "e": "對。單選考點。", "id": "Q30-023", "l": 30, "ch": 9}, {"k": "單", "s": [9], "q": "全面推進依法治國的根本制度保障是：", "o": ["中國特色社會主義制度", "中國特色社會主義法治理論", "憲法", "黨內法規體系"], "a": 0, "e": "講師：作為單選題記一下。", "id": "Q30-024", "l": 30, "ch": 9}, {"k": "判", "s": [10], "q": "黨的領導是中國特色社會主義法治之魂，是我們的法治同西方資本主義法治的最大區別。", "a": true, "e": "對。講師原話。", "id": "Q30-025", "l": 30, "ch": 9}, {"k": "單", "s": [7], "q": "全面依法治國在「四個全面」中屬於：", "o": ["戰略舉措", "戰略目標", "總體布局", "根本任務"], "a": 0, "e": "第一個全面是戰略目標；全面依法治國是三大戰略舉措之一、「戰略布局的重要一環」。", "id": "Q30-026", "l": 30, "ch": 9}, {"k": "簡", "s": [10, 11, 12, 13, 14], "q": "簡答：堅持和拓展中國特色社會主義法治道路要堅持哪些原則？", "sum": "一句白話：跟黨走、為人民、人人平等、法治和德治一起、從中國實際出發。", "pts": ["坚持中国共产党的领导", "坚持以人民为中心", "坚持法律面前人人平等", "坚持依法治国和以德治国相结合", "坚持从中国实际出发"], "e": "講師：「背大標題，大標題要背的。」", "id": "Q30-027", "l": 30, "ch": 9}, {"s": [3], "src": "", "card": "C31-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜全面推進依法治國的總抓手：\n把建设（＿①＿）作为全面推进依法治国的（＿②＿）", "a": ["中国特色社会主义法治体系", "总抓手"], "e": "建設中國特色社會主義法治體系是全面推進依法治國的「總抓手」（總攬全局、牽引各方）。講師：單選題。 有力的", "完备的", "高效的", "严密的"], "a": 0, "e": "「法治保障体系」→「有力的」。記法：形容詞配對：「完備規範・高效實施・嚴密監督・有力保障・完善黨規」＝「備・效・密・力・善」。", "id": "Q31-015", "l": 31, "ch": 9}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "中特法治體系包括「完善的法治保障体系」。", "a": false, "e": "錯。「法治保障体系」應對應「有力的」，「完善的」對應的是「党内法规体系」。", "id": "Q31-016", "l": 31, "ch": 9}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "中特法治體系中，「＿＿党内法规体系」應配哪個形容詞？", "o": ["完善的", "完备的", "严密的", "有力的"], "a": 0, "e": "「党内法规体系」→「完善的」。記法：形容詞配對：「完備規範・高效實施・嚴密監督・有力保障・完善黨規」＝「備・效・密・力・善」。", "id": "Q31-017", "l": 31, "ch": 9}, {"s": [8, 9, 10, 11], "src": "", "card": "C31-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "中特法治體系包括「完善的党内法规体系」。", "a": true, "e": "對。「党内法规体系」→「完善的」。", "id": "Q31-018", "l": 31, "ch": 9}, {"k": "單", "s": [3], "q": "全面推進依法治國的總抓手是：", "o": ["建設中國特色社會主義法治體系", "建設社會主義法治國家", "依憲治國", "嚴格執法"], "a": 0, "e": "總抓手＝建設中特法治體系。", "id": "Q31-019", "l": 31, "ch": 9}, {"k": "多", "s": [4], "q": "黨的十八屆四中全會確定的全面依法治國總目標是：", "o": ["建設中國特色社會主義法治體系", "建設社會主義法治國家", "建設法治政府", "建設黨內法規體系"], "a": [0, 1], "e": "總目標兩句：體系＋國家。", "id": "Q31-020", "l": 31, "ch": 9}, {"k": "單", "s": [6], "q": "國家的根本法、治國安邦的總章程是：", "o": ["憲法", "黨章", "民法典", "刑法"], "a": 0, "e": "講師：「但凡選擇題提到最重要的法律，你就去給我找憲法。」", "id": "Q31-021", "l": 31, "ch": 9}, {"k": "判", "s": [7], "q": "憲法的生命在於實施，憲法的權威也在於實施。", "a": true, "e": "對。", "id": "Q31-022", "l": 31, "ch": 9}, {"k": "單", "s": [11], "q": "我國法治區別於其他國家法治的一個鮮明特徵是：", "o": ["把黨內法規體系納入中國特色社會主義法治體系", "實行三權分立", "法律高於一切政黨", "以判例法為主"], "a": 0, "e": "講師原話。", "id": "Q31-023", "l": 31, "ch": 9}, {"k": "單", "s": [5], "q": "中國特色社會主義法治體系的本質是：", "o": ["中國特色社會主義制度的法律表現形式", "全面依法治國的總抓手", "國家的根本法", "社會主義法治的根本保證"], "a": 0, "e": "「注意本質」。", "id": "Q31-024", "l": 31, "ch": 9}, {"k": "判", "s": [3, 4], "q": "全面依法治國的「總抓手」是建設中國特色社會主義法治體系和建設社會主義法治國家兩項。", "a": false, "e": "錯。總抓手只是「建設中國特色社會主義法治體系」；「體系＋國家」兩項是總目標。", "id": "Q31-025", "l": 31, "ch": 9}, {"s": [2], "src": "", "card": "C32-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜法治是現代化的基本保障也是重要內容：\n法治是国家文明进步的（＿①＿）；法治既是实现国家现代化的（＿②＿），也是国家现代化的（＿③＿）；国家要走向现代化，必须实现（＿④＿）", "a": ["重要标志", "基本保障", "重要内容", "法治化"], "e": "法治是國家文明進步的重要標誌；法治既是實現國家現代化的基本保障，也是國家現代化的重要內容（選擇題）；國家要走向現代化，必須實現法治化。", "id": "Q32-001", "l": 32, "ch": 9}, {"s": [2], "src": "", "card": "C32-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜法治中國建設的總目標（六句）：\n实现法律规范（＿①＿），执法司法（＿②＿），权力运行受到有效（＿③＿），人民合法权益得到充分（＿④＿），法治信仰（＿⑤＿），法治国家、法治政府、法治社会（＿⑥＿）", "a": ["科学完备统一", "公正高效权威", "制约监督", "尊重保障", "普遍确立", "全面建成"], "e": "講師：需要背誦，可考選擇、辨析或簡答。六句：法律規範科學完備統一；執法司法公正高效權威；權力運行受到有效制約監督；人民合法權益得到充分尊重保障；法治信仰普遍確立；法治國家、法治政府、法治社會全面建成。", "id": "Q32-002", "l": 32, "ch": 9}, {"s": [2], "src": "", "card": "C32-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜法治中國建設的總目標（六句）", "model": "实现法律规范科学完备统一，执法司法公正高效权威，权力运行受到有效制约监督，人民合法权益得到充分尊重保障，法治信仰普遍确立，法治国家、法治政府、法治社会全面建成", "pts": ["法律规范科学完备统一", "执法司法公正高效权威", "权力运行受到有效制约监督", "人民合法权益得到充分尊重保障", "法治信仰普遍确立", "法治国家、法治政府、法治社会全面建成"], "e": "記法：「法・執・權・民・信・三法治」六主語：法律規範→執法司法→權力→人民權益→信仰→國家政府社會。", "id": "Q32-003", "l": 32, "ch": 9}, {"s": [3], "src": "", "card": "C32-03", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜具體目標的時間節點：2025 vs 2035：\n（＿①＿）——更加健全、更加完备；（＿②＿）——法治国家、法治政府、法治社会（＿③＿），中国特色社会主义法治体系（＿④＿）", "a": ["2025年", "2035年", "基本建成", "基本形成"], "e": "講師：細項不需背，要記時間節點。2025年：黨領導全面依法治國體制機制「更加健全」、法律體系「更加完備」等；2035年：法治國家、法治政府、法治社會「基本建成」，中特法治體系「基本形成」。", "id": "Q32-004", "l": 32, "ch": 9}, {"s": [3], "src": "", "card": "C32-03", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "單", "q": "法治中國建設具體目標中，「2025年」的目標是：", "o": ["党领导全面依法治国体制机制更加健全、法律体系更加完备", "法治国家、法治政府、法治社会基本建成，中国特色社会主义法治体系基本形成", "法治国家、法治政府、法治社会全面建成"], "a": 0, "e": "「2025年」→「党领导全面依法治国体制机制更加健全、法律体系更加完备」。記法：「25年『更加』，35年『基本』」（又一個2035配「基本」）。", "id": "Q32-005", "l": 32, "ch": 9}, {"s": [3], "src": "", "card": "C32-03", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "判", "q": "法治中國建設：2025年要做到「党领导全面依法治国体制机制更加健全、法律体系更加完备」。", "a": true, "e": "對。「2025年」→「党领导全面依法治国体制机制更加健全、法律体系更加完备」。", "id": "Q32-006", "l": 32, "ch": 9}, {"s": [3], "src": "", "card": "C32-03", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "單", "q": "法治中國建設具體目標中，「2035年」的目標是：", "o": ["法治国家、法治政府、法治社会基本建成，中国特色社会主义法治体系基本形成", "党领导全面依法治国体制机制更加健全、法律体系更加完备", "法治国家、法治政府、法治社会全面建成"], "a": 0, "e": "「2035年」→「法治国家、法治政府、法治社会基本建成，中国特色社会主义法治体系基本形成」。記法：「25年『更加』，35年『基本』」（又一個2035配「基本」）。", "id": "Q32-007", "l": 32, "ch": 9}, {"s": [3], "src": "", "card": "C32-03", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "判", "q": "法治中國建設：2035年要做到「党领导全面依法治国体制机制更加健全、法律体系更加完备」。", "a": false, "e": "錯。「2035年」應對應「法治国家、法治政府、法治社会基本建成，中国特色社会主义法治体系基本形成」，「党领导全面依法治国体制机制更加健全、法律体系更加完备」對應的是「2025年」。", "id": "Q32-008", "l": 32, "ch": 9}, {"s": [4, 5, 6], "src": "", "card": "C32-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜法治中國建設的工作布局（三個標題）：\n坚持（＿①＿）共同推进；坚持（＿②＿）一体建设；坚持统筹推进（＿③＿）", "a": ["依法治国、依法执政、依法行政", "法治国家、法治政府、法治社会", "国内法治和涉外法治"], "e": "講師：「背、背、背，三個標題要背過。」①堅持依法治國、依法執政、依法行政共同推進；②堅持法治國家、法治政府、法治社會一體建設；③堅持統籌推進國內法治和涉外法治。", "id": "Q32-009", "l": 32, "ch": 9}, {"s": [4, 5, 6], "src": "", "card": "C32-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜法治中國建設的工作布局（三個標題）", "model": "坚持依法治国、依法执政、依法行政共同推进；坚持法治国家、法治政府、法治社会一体建设；坚持统筹推进国内法治和涉外法治", "pts": ["坚持依法治国、依法执政、依法行政共同推进", "坚持法治国家、法治政府、法治社会一体建设", "坚持统筹推进国内法治和涉外法治"], "e": "記法：「三依・三法治・內外」：依法治國/執政/行政→法治國家/政府/社會→國內/涉外。", "id": "Q32-010", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新十六字方針；公正司法是最後一道防線：\n（＿①＿）、（＿②＿）、（＿③＿）、（＿④＿）；公正司法是维护社会公平正义的（＿⑤＿）", "a": ["科学立法", "严格执法", "公正司法", "全民守法", "最后一道防线"], "e": "建設更高水平的法治中國：科學立法、嚴格執法、公正司法、全民守法（講師：「16字」）。公正司法是維護社會公平正義的最後一道防線（選擇題，二十大重要內容）。每一個立法環節都要把好憲法關；形成守法光榮、違法可恥的社會氛圍。", "id": "Q32-011", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "十六字方針中，「＿＿立法」前面的修飾詞是：", "o": ["科学", "全民", "严格", "公正"], "a": 0, "e": "「立法」→「科学」。記法：「立・執・司・守」配「科學・嚴格・公正・全民」。", "id": "Q32-012", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "十六字方針包括「科学立法」。", "a": true, "e": "對。「立法」→「科学」。", "id": "Q32-013", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "十六字方針中，「＿＿执法」前面的修飾詞是：", "o": ["严格", "科学", "全民", "公正"], "a": 0, "e": "「执法」→「严格」。記法：「立・執・司・守」配「科學・嚴格・公正・全民」。", "id": "Q32-014", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "十六字方針包括「公正执法」。", "a": false, "e": "錯。「执法」應對應「严格」，「公正」對應的是「司法」。", "id": "Q32-015", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "十六字方針中，「＿＿司法」前面的修飾詞是：", "o": ["公正", "严格", "全民", "科学"], "a": 0, "e": "「司法」→「公正」。記法：「立・執・司・守」配「科學・嚴格・公正・全民」。", "id": "Q32-016", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "十六字方針包括「公正司法」。", "a": true, "e": "對。「司法」→「公正」。", "id": "Q32-017", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "十六字方針中，「＿＿守法」前面的修飾詞是：", "o": ["全民", "公正", "严格", "科学"], "a": 0, "e": "「守法」→「全民」。記法：「立・執・司・守」配「科學・嚴格・公正・全民」。", "id": "Q32-018", "l": 32, "ch": 9}, {"s": [7, 9], "src": "", "card": "C32-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "十六字方針包括「科学守法」。", "a": false, "e": "錯。「守法」應對應「全民」，「科学」對應的是「立法」。", "id": "Q32-019", "l": 32, "ch": 9}, {"s": [7, 8, 9], "src": "", "card": "C32-06", "tag": ["簡答題考點"], "auto": 1, "k": "填", "q": "填空｜建設更高水平的法治中國（四方面）：\n完善（＿①＿）；扎实推进（＿②＿）；严格（＿③＿）；加快（＿④＿）", "a": ["以宪法为核心的中国特色社会主义法律体系", "依法行政", "公正司法", "建设法治社会"], "e": "完善以憲法為核心的中國特色社會主義法律體系；扎實推進依法行政；嚴格公正司法；加快建設法治社會。", "id": "Q32-020", "l": 32, "ch": 9}, {"k": "單", "s": [9], "q": "維護社會公平正義的最後一道防線是：", "o": ["公正司法", "嚴格執法", "科學立法", "全民守法"], "a": 0, "e": "講師：選擇題考點，也是二十大中的重要內容。", "id": "Q32-021", "l": 32, "ch": 9}, {"k": "判", "s": [2], "q": "法治既是實現國家現代化的基本保障，也是國家現代化的重要內容。", "a": true, "e": "對。選擇題考點。", "id": "Q32-022", "l": 32, "ch": 9}, {"k": "判", "s": [3], "q": "到2035年，法治國家、法治政府、法治社會要全面建成。", "a": false, "e": "錯。2035年是「基本建成」，中特法治體系「基本形成」；「全面建成」是總目標的表述。", "id": "Q32-023", "l": 32, "ch": 9}, {"k": "多", "s": [4, 5, 6], "q": "法治中國建設的工作布局包括：", "o": ["堅持依法治國、依法執政、依法行政共同推進", "堅持法治國家、法治政府、法治社會一體建設", "堅持統筹推進國內法治和涉外法治", "堅持司法獨立於黨的領導"], "a": [0, 1, 2], "e": "三個標題；D 錯。", "id": "Q32-024", "l": 32, "ch": 9}, {"k": "填", "s": [7], "q": "十六字：（＿①＿）立法、（＿②＿）執法、（＿③＿）司法、（＿④＿）守法。", "a": ["科学", "严格", "公正", "全民"], "e": "講師：「16字啊16字。」", "id": "Q32-025", "l": 32, "ch": 9}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，每一個立法環節都要把好：", "o": ["憲法關", "程序關", "質量關", "民意關"], "a": 0, "e": "原話：「每一個立法環節都要把好憲法關。」", "id": "Q32-026", "l": 32, "ch": 9}, {"s": [6, 7, 8], "src": "", "card": "C33-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜文化繁榮興盛的四個定位（皆可考單選）：\n文化繁荣兴盛是实现中华民族伟大复兴的（＿①＿）；是建设社会主义现代化强国的（＿②＿）；是满足人民日益增长的美好生活需要的（＿③＿）；是在世界文化激荡中站稳脚跟的（＿④＿）", "a": ["精神支撑", "应有之义", "内在要求", "前提基础"], "e": "為什麼一定要讓文化繁榮？因為它是：①民族復興的精神支撐（像人的精神力量）；②建設現代化強國的應有之義（本來就該包含的部分）；③滿足人民美好生活需要的內在要求；④在世界文化激盪中站穩腳跟的前提基礎。講師：分別作為單選。", "id": "Q33-001", "l": 33, "ch": 10}, {"s": [6, 7, 8], "src": "", "card": "C33-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "文化繁榮興盛是「实现中华民族伟大复兴」的：", "o": ["精神支撑", "内在要求", "前提基础", "应有之义"], "a": 0, "e": "「实现中华民族伟大复兴」→「精神支撑」。記法：「復興—支撐、強國—應有、生活—內在、世界—前提」：「撐・應・內・前」。", "id": "Q33-002", "l": 33, "ch": 10}, {"s": [6, 7, 8], "src": "", "card": "C33-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "文化繁榮興盛是实现中华民族伟大复兴的「精神支撑」。", "a": true, "e": "對。「实现中华民族伟大复兴」→「精神支撑」。", "id": "Q33-003", "l": 33, "ch": 10}, {"s": [6, 7, 8], "src": "", "card": "C33-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "文化繁榮興盛是「建设社会主义现代化强国」的：", "o": ["应有之义", "前提基础", "内在要求", "精神支撑"], "a": 0, "e": "「建设社会主义现代化强国」→「应有之义」。記法：「復興—支撐、強國—應有、生活—內在、世界—前提」：「撐・應・內・前」。", "id": "Q33-004", "l": 33, "ch": 10}, {"s": [6, 7, 8], "src": "", "card": "C33-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "文 ": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜創造性轉化、創新性發展：\n推动中华优秀传统文化（＿①＿）、（＿②＿）；坚持（＿③＿）、（＿④＿）", "a": ["创造性转化", "创新性发展", "古为今用", "推陈出新"], "e": "對傳統文化不是原封不動，而是改造（轉化）並發展；堅持古為今用、推陳出新。中國共產黨既是中國先進文化的積極引領者和踐行者，又是中華優秀傳統文化的忠實傳承者和弘揚者。", "id": "Q36-006", "l": 36, "ch": 10}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜文藝的崇高使命 vs 神聖職責：\n举（＿①＿）、立（＿②＿）、建（＿③＿）是当代中国文艺的（＿④＿）；弘扬（＿⑤＿）、传播（＿⑥＿）、凝聚（＿⑦＿）是文艺工作者的（＿⑧＿）", "a": ["精神旗帜", "精神支柱", "精神家园", "崇高使命", "中国精神", "中国价值", "中国力量", "神圣职责"], "e": "崇高使命＝舉精神旗幟、立精神支柱、建精神家園（三個「精神」）；神聖職責＝弘揚中國精神、傳播中國價值、凝聚中國力量（三個「中國」）。", "id": "Q36-007", "l": 36, "ch": 10}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "單", "q": "「当代中国文艺的崇高使命」是：", "o": ["举精神旗帜、立精神支柱、建精神家园", "弘扬中国精神、传播中国价值、凝聚中国力量"], "a": 0, "e": "「当代中国文艺的崇高使命」→「举精神旗帜、立精神支柱、建精神家园」。記法：「使命＝三精神（旗柱園）；職責＝三中國（精神價值力量）」。", "id": "Q36-008", "l": 36, "ch": 10}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "判", "q": "当代中国文艺的崇高使命是「举精神旗帜、立精神支柱、建精神家园」。", "a": true, "e": "對。「当代中国文艺的崇高使命」→「举精神旗帜、立精神支柱、建精神家园」。", "id": "Q36-009", "l": 36, "ch": 10}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "單", "q": "「文艺工作者的神圣职责」是：", "o": ["弘扬中国精神、传播中国价值、凝聚中国力量", "举精神旗帜、立精神支柱、建精神家园"], "a": 0, "e": "「文艺工作者的神圣职责」→「弘扬中国精神、传播中国价值、凝聚中国力量」。記法：「使命＝三精神（旗柱園）；職責＝三中國（精神價值力量）」。", "id": "Q36-010", "l": 36, "ch": 10}, {"s": [6], "src": "", "card": "C36-04", "tag": ["必背", "簡答題考點", "易混"], "auto": 1, "k": "判", "q": "文艺工作者的神圣职责是「举精神旗帜、立精神支柱、建精神家园」。", "a": false, "e": "錯。「文艺工作者的神圣职责」應對應「弘扬中国精神、传播中国价值、凝聚中国力量」，「举精神旗帜、立精神支柱、建精神家园」對應的是「当代中国文艺的崇高使命」。", "id": "Q36-011", "l": 36, "ch": 10}, {"s": [6], "src": "", "card": "C36-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會效益放在首位：\n坚持把（＿①＿）放在（＿②＿），社会效益和经济效益相统一", "a": ["社会效益", "首位"], "e": "發展文化產業，要堅持把社會效益放在首位（先看對社會好不好，再看賺不賺錢），社會效益和經濟效益相統一。", "id": "Q36-012", "l": 36, "ch": 10}, {"s": [7], "src": "", "card": "C36-06",   <div class="sec"><span class="lab p">白話解釋</span>${esc(c.p)}</div>
  <div class="sec"><span class="lab o">原文（要背）</span><div class="orig">${origHTML(c.o)}</div></div>
  ${c.items&&c.items.length?`<div class="sec"><span class="lab">分點</span><ol class="items">${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ol></div>`:''}
  <div class="sec"><span class="lab m">記法</span>${esc(c.m)}</div>
  <div class="src">出處：${esc(srcText(c))}</div>`;
}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box">${html}<div class="row" style="margin-top:.8rem"><button class="btn pri" data-close>關閉</button></div></div>`;m.addEventListener('click',e=>{if(e.target===m||e.target.hasAttribute('data-close'))m.remove()});document.body.appendChild(m);return m}
function showCard(id){const c=CMAP[id];if(c)modal(cardHTML(c,true))}

$('#nav').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}">${n}</button>`).join('');

const R={};
// ---------- lesson picker ----------
function picker(sel,id){
  return `<div class="chgrid" id="${id}">${DATA.chapters.map((c,ci)=>{const ls=LESSONS.filter(l=>l>=c.a&&l<=c.b);const all=ls.every(l=>sel.has(l));
  return `<div class="chrow"><label class="ck"><input type="checkbox" data-ch="${ci}" ${all?'checked':''}> <b>${esc(c.n)}</b></label><div>${ls.map(l=>`<button type="button" class="lchip ${sel.has(l)?'on':''}" data-l="${l}" title="${esc(DATA.lt[l])}">${pad(l)} ${esc(DATA.lt[l]).slice(0,10)}</button>`).join('')}</div></div>`}).join('')}
  <div class="row"><button class="btn sm" data-all="1">全選</button><button class="btn sm" data-all="0">全不選</button></div></div>`;
}
function bindPicker(root,sel,onchg){
  root.addEventListener('click',e=>{const b=e.target.closest('[data-l]');const a=e.target.closest('[data-all]');
    if(b){const l=+b.dataset.l;sel.has(l)?sel.delete(l):sel.add(l);onchg()}
    else if(a){sel.clear();if(a.dataset.all==='1')LESSONS.forEach(l=>sel.add(l));onchg()}});
  root.addEventListener('change',e=>{const c=e.target.closest('[data-ch]');if(!c)return;const ch=DATA.chapters[+c.dataset.ch];LESSONS.filter(l=>l>=ch.a&&l<=ch.b).forEach(l=>c.checked?sel.add(l):sel.delete(l));onchg()});
}
// ---------- 知識卡 ----------
const CV={ch:'all',l:'all',tag:'all',unk:false,list:null,i:0,flip:false,shuf:false};
R.cards=function(){
  const tags=[...new Set(DATA.cards.flatMap(c=>c.tag||[]))];
  const known=DATA.cards.filter(c=>S.cards[c.id]==='k').length;
  const lsOpts=LESSONS.filter(l=>CV.ch==='all'||chOf(l)===+CV.ch);
  $('#main').innerHTML=`<div class="box"><h2>知識卡</h2>
  <div class="row"><select id="cvch"><option value="all">全部章節</option>${DATA.chapters.map((c,i)=>`<option value="${i}" ${CV.ch==i?'selected':''}>${esc(c.n)}</option>`).join('')}</select>
  <select id="cvl"><option value="all">全部課堂</option>${lsOpts.map(l=>`<option value="${l}" ${CV.l==l?'selected':''}>第${pad(l)}堂 ${esc(DATA.lt[l])}</option>`).join('')}</select>
  <select id="cvtag"><option value="all">全部標籤</option>${tags.map(t=>`<option ${CV.tag===t?'selected':''} value="${esc(t)}">${esc(t==='錯題'?'曾錯（你的錯題）':t)}</option>`).join('')}</select>
  <label class="ck"><input type="checkbox" id="cvunk" ${CV.unk?'checked':''}>只看未熟</label>
  <button class="btn sm" id="cvshuf">${CV.shuf?'✔ 已洗牌（按此還原順序）':'🔀 洗牌'}</button></div>
  <div class="mute" style="margin-top:.4rem">已熟 ${known} / 共 ${DATA.cards.length} 張　·　點卡片翻面；鍵盤 ← → 換卡、空白鍵翻面</div></div>
  <div id="cvbody"></div>`;
  const re=()=>{CV.list=null;CV.i=0;R.cards()};
  $('#cvch').onchange=e=>{CV.ch=e.target.value;CV.l='all';re()};
  $('#cvl').onchange=e=>{CV.l=e.target.value;re()};
  $('#cvtag').onchange=e=>{CV.tag=e.target.value;re()};
  $('#cvunk').onchange=e=>{CV.unk=e.target.checked;re()};
  $('#cvshuf').onclick=()=>{CV.shuf=!CV.shuf;re()};
  if(!CV.list){let L=DATA.cards.filter(c=>(CV.ch==='all'||c.ch==+CV.ch)&&(CV.l==='all'||c.l==+CV.l)&&(CV.tag==='all'||(c.tag||[]).includes(CV.tag))&&(!CV.unk||S.cards[c.id]!=='k')).map(c=>c.id);if(CV.shuf)shuffle(L);CV.list=L;CV.i=Math.min(CV.i,Math.max(0,L.length-1));CV.flip=false}
  drawCard();
};
function drawCard(){
  const body=$('#cvbody');if(!body)return;const L=CV.list;
  if(!L.length){body.innerHTML='<div class="box">沒有符合條件的卡片。'+(CV.unk?'（全部都已熟了！🎉）':'')+'</div>';return}
  const c=CMAP[L[CV.i]];const st=S.cards[c.id];
  body.innerHTML=`<div class="box fcard" id="fc">
   <div class="row" style="justify-content:space-between"><span class="mute">${CV.i+1} / ${L.length}　${st==='k'?'✅ 已熟':st==='u'?'🔸 未熟':''}</span><span class="src">${esc(srcText(c))}</span></div>
   ${CV.flip?cardHTML(c,true):`<div class="front">${esc(c.t)}</div><div style="text-align:center">${tagsHTML(c.tag)}</div><div class="mute" style="text-align:center;margin-top:1rem">（先想一想原文是什麼，再點一下翻面）</div>`}
  </div>
  <div class="row" style="justify-content:center">
   <button class="btn" id="cprev">← 上一張</button><button class="btn" id="cflip">翻面</button><button class="btn" id="cnext">下一張 →</button></div>
  <div class="row" style="justify-content:center;margin-top:.6rem">
   <button class="btn ok" id="cknow">✔ 已熟</button><button class="btn bad" id="cunk">✘ 未熟</button><button class="btn" id="cdrill">練這張卡的題</button></div>`;
  $('#fc').onclick=()=>{CV.flip=!CV.flip;drawCard()};
  $('#cflip').onclick=()=>{CV.flip=!CV.flip;drawCard()};
  $('#cprev').onclick=()=>moveCard(-1);$('#cnext').onclick=()=>moveCard(1);
  $('#cknow').onclick=()=>{S.cards[c.id]='k';save();if(CV.unk){CV.list.splice(CV.i,1);if(CV.i>=CV.list.length)CV.i=0;CV.flip=false;drawCard()}else moveCard(1)};
  $('#cunk').onclick=()=>{S.cards[c.id]='u';save();moveCard(1)};
  const qq=DATA.qs.filter(q=>q.card===c.id).map(q=>q.id);
  $('#cdrill').disabled=!qq.length;
  $('#cdrill').onclick=()=>{go('quiz');startQuiz(shuffle(qq.slice()),{inf:false,title:'練習：'+c.t})};
}
function moveCard(d){const n=CV.list.length;if(!n)return;CV.i=(CV.i+d+n)%n;CV.flip=false;drawCard()}
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))||document.querySelector('.modal'))return;
  if(cur==='cards'&&CV.list&&CV.list.length){if(e.key==='ArrowRight')moveCard(1);else if(e.key==='ArrowLeft')moveCard(-1);else if(e.key===' '){e.preventDefault();CV.flip=!CV.flip;drawCard()}}
  else if(cur==='quiz'&&Q.active){
    if(e.key==='Enter'){const n=$('#qnext')||$('#qsubmit');if(n){e.preventDefault();n.click()}}
    else if(/^[1-9]$/.test(e.key)){const o=document.querySelectorAll('#qbody .opt')[+e.key-1];if(o)o.click()}
  }
});
// ---------- 刷題 ----------
const Q={active:false};
function defCfg(){return{ls:LESSONS.slice(),ks:['單','多','判','填','默','簡','論'],n:20,inf:false,only:'all',tag:'all'}}
function poolOf(cfg){const ls=new Set(cfg.ls),ks=new Set(cfg.ks);return DATA.qs.filter(q=>ls.has(q.l)&&ks.has(q.k)&&(cfg.tag==='all'||(q.tag||[]).includes(cfg.tag))&&(cfg.only!=='wrong'||S.wrong[q.id])&&(cfg.only!=='new'||!S.qs[q.id]))}
R.quiz=function(){
  if(Q.active){drawQ();return}
  const cfg=S.cfg||defCfg();const sel=new Set(cfg.ls);
  const tags=[...new Set(DATA.qs.flatMap(q=>q.tag||[]))];
  $('#main').innerHTML=`<div class="box"><h2>刷題設定</h2>
  <h3>1. 範圍（點章名全選該章；點小方塊選單堂）</h3>${picker(sel,'qp')}
  <h3>2. 題型</h3><div class="row" id="qks">${KORDER.map(k=>`<label class="ck"><input type="checkbox" value="${k}" ${cfg.ks.includes(k)?'checked':''}>${KN[k]}</label>`).join('')}</div>
  <h3>3. 題數與篩選</h3><div class="row">
   <select id="qn">${[10,20,30,50,100,0].map(n=>`<option value="${n}" ${(!cfg.inf&&cfg.n==n)?'selected':''}>${n?n+' 題':'全部'}</option>`).join('')}<option value="inf" ${cfg.inf?'selected':''}>♾ 無限模式</option></select>
   <select id="qonly"><option value="all">全部題目</option><option value="new" ${cfg.only==='new'?'selected':''}>只出沒做過的</option><option value="wrong" ${cfg.only==='wrong'?'selected':''}>只出錯題本</option></select>
   <select id="qtag"><option value="all">不限標籤</option>${tags.map(t=>`<option value="${esc(t)}" ${cfg.tag===t?'selected':''}>只出「${esc(t==='錯題'?'曾錯':t)}」</option>`).join('')}</select></div>
  <p class="mute" id="qcnt"></p>
  <div class="row"><button class="btn pri" id="qgo">開始刷題</button></div>
  <p class="mute">無限模式：題目隨機抽，錯題本裡的題、正確率低的題、沒做過的題會更常出現；答錯的題約 4 題後會再出一次。</p></div>`;
  const get=()=>{const v=$('#qn').value;return{ls:[...sel].sort((a,b)=>a-b),ks:[...document.querySelectorAll('#qks input:checked')].map(i=>i.value),n:v==='inf'?20:+v,inf:v==='inf',only:$('#qonly').value,tag:$('#qtag').value}};
  const upd=()=>{const p=poolOf(get());$('#qcnt').textContent=`符合條件的題目：${p.length} 題`;$('#qgo').disabled=!p.length};
  const rb=()=>{$('#qp').outerHTML=picker(sel,'qp');bindPicker($('#qp'),sel,rb);upd()};bindPicker($('#qp'),sel,rb);
  document.querySelectorAll('#qks input,#qn,#qonly,#qtag').forEach(i=>i.onchange=upd);
  upd();
  $('#qgo').onclick=()=>{const c=get();S.cfg=c;save();const p=poolOf(c).map(q=>q.id);startQuiz(c.inf?p:shuffle(p).slice(0,c.n||p.length),{inf:c.inf,pool:p,title:c.inf?'無限模式':'刷題'})};
};
function startQuiz(ids,opt){
  Object.assign(Q,{active:true,queue:ids.slice(),pool:opt.pool||ids.slice(),inf:!!opt.inf,wb:!!opt.wb,title:opt.title||'刷題',i:0,done:0,ok:0,wrongs:[],recent:[],pend:[],reins:{},cur:null,ans:false});
  nextQ();
}
function weight(id){const r=S.qs[id];let w=1;if(S.wrong[id])w*=6;if(!r)w*=2;else if(r.n&&r.c/r.n<.6)w*=2;if(Q.recent.includes(id))w=0;return w}
function pickInf(){
  const due=Q.pend.findIndex(p=>p.at<=Q.done);if(due>=0)return Q.pend.splice(due,1)[0].id;
  let tot=0;const ws=Q.pool.map(id=>{const w=weight(id);tot+=w;return w});
  if(!tot)return Q.pool[Math.floor(Math.random()*Q.pool.length)];
  let r=Math.random()*tot;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<=0)return Q.pool[i]}return Q.pool[Q.pool.length-1];
}
function nextQ(){
  let id;
  if(Q.inf)id=pickInf();else{if(Q.i>=Q.queue.length){endQuiz();return}id=Q.queue[Q.i++]}
  Q.recent.push(id);if(Q.recent.length>Math.min(15,Math.floor(Q.pool.length/2)))Q.recent.shift();
  const q=QMAP[id];Q.cur={q,ord:q.o?shuffle(q.o.map((_,i)=>i)):null,sel:new Set()};Q.ans=false;drawQ();
}
function drawQ(){
  const {q,ord}=Q.cur;const total=Q.inf?'∞':Q.queue.length;
  let body='';
  if(q.k==='單'||q.k==='多'){body=ord.map((oi,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABCDEFGH'[j]}</span>${esc(q.o[oi])}</button>`).join('')+(q.k==='多'?`<div class="row"><button class="btn pri" id="qsubmit">提交答案</button><span class="mute">（多選：選完所有正確項再提交）</span></div>`:'')}
  else if(q.k==='判'){body=`<button class="opt" data-tf="1"><span class="k">1</span>✔ 正確</button><button class="opt" data-tf="0"><span class="k">2</span>✘ 錯誤</button>`}
  else if(q.k==='填'){body=`<div>${q.a.map((_,i)=>`<label>${'①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮'[i]||i+1} <input type="text" class="blank" data-b="${i}" autocomplete="off"></label>`).join(' ')}</div><div class="mute">繁體、簡體都可以；標點、空格不影響判分。</div><div class="row" style="margin-top:.5rem"><button class="btn pri" id="qsubmit">提交答案</button></div>`}
  else{body=`<textarea id="qta" placeholder="先自己寫（或在心裡默背）一遍，再按「看答案自評」"></textarea><div class="row"><button class="btn pri" id="qsubmit">看答案自評</button></div>`}
  $('#main').innerHTML=`<div class="box"><div class="row" style="justify-content:space-between"><b>${esc(Q.title)}</b><span class="mute">第 ${Q.done+1} 題 / ${total}　·　答對 ${Q.ok}</span></div>
  ${Q.inf?'':`<div class="progress"><i style="width:${Q.done/Q.queue.length*100}%"></i></div>`}
  <div><span class="tag">${KN[q.k]}</span>${tagsHTML(q.tag)}${S.wrong[q.id]?`<span class="tag t錯題">錯題本 ${S.wrong[q.id].st}/3</span>`:''}</div>
  <div class="qtext">${esc(q.q)}</div><div id="qbody">${body}</div><div id="qfb"></div>
  <div class="row" style="margin-top:.8rem;justify-content:flex-end"><button class="btn sm" id="qquit">結束本輪</button></div></div>`;
  $('#qquit').onclick=()=>endQuiz();
  const qb=$('#qbody');
  if(q.k==='單')qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.ans)return;Q.cur.sel=new Set([+b.dataset.j]);answer()});
  if(q.k==='多'){qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.ans)return;const j=+b.dataset.j;Q.cur.sel.has(j)?Q.cur.sel.delete(j):Q.cur.sel.add(j);b.classList.toggle('sel')});}
  if(q.k==='判')qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.ans)return;Q.cur.tf=b.dataset.tf==='1';answer()});
  const sb=$('#qsubmit');if(sb)sb.onclick=answer;
  const f=qb.querySelector('input.blank');if(f)f.focus();
  qb.querySelectorAll('input.blank').forEach((inp,i,arr)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(i<arr.length-1)arr[i+1].focus();else answer()}}));
}
function explainHTML(q){return `${q.e?`<div class="sec"><span class="lab p">解析</span>${esc(q.e)}</div>`:''}<div class="src">出處：${esc(srcText(q))}${q.card?` · <a href="#" data-card="${q.card}">看相關知識卡</a>`:''}</div>`}
function bindCardLinks(root){root.querySelectorAll('[data-card]').forEach(a=>a.onclick=e=>{e.preventDefault();showCard(a.dataset.card)})}
function answer(){
  if(Q.ans)return;const {q,ord}=Q.cur;const fb=$('#qfb');
  if(SELF(q.k)){Q.ans=true;$('#qsubmit').remove();
    fb.innerHTML=`<div class="fb self">${q.sum?`<div class="sec"><span class="lab p">先記一句白話</span>${esc(q.sum)}</div>`:''}
     ${q.model?`<div class="sec"><span class="lab o">參考原文</span><div class="model">${esc(q.model)}</div></div>`:''}
     <div class="sec"><span class="lab m">得分要點</span>（逐點對照：寫出／背出了就打勾）<div class="pts">${q.pts.map((p,i)=>`<label><input type="checkbox" data-p="${i}"><span>${i+1}. ${esc(p)}</span></label>`).join('')}</div></div>
     <div class="row"><button class="btn pri" id="selfdone">完成自評</button><span class="mute">打勾 ≥ 80% 算答對</span></div>${explainHTML(q)}</div>`;
    bindCardLinks(fb);
    $('#selfdone').onclick=()=>{const n=fb.querySelectorAll('.pts input:checked').length;const ok=n/q.pts.length>=0.8;$('#selfdone').parentNode.innerHTML=`<span class="big" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✔ 自評：答對':'✘ 自評：未達標'}（${n}/${q.pts.length}）</span>`;finish(ok)};
    return;}
  let ok=false,ansText='';
  if(q.k==='單'||q.k==='多'){
    const corr=new Set((Array.isArray(q.a)?q.a:[q.a]));const sel=Q.cur.sel;
    if(!sel.size){toast('請先選擇答案');return}
    ok=[...Array(ord.length).keys()].every(j=>corr.has(ord[j])===sel.has(j));
    document.querySelectorAll('#qbody .opt').forEach(b=>{const j=+b.dataset.j;b.classList.remove('sel');if(corr.has(ord[j]))b.classList.add('right');else if(sel.has(j))b.classList.add('wrong')});
    ansText=ord.map((oi,j)=>corr.has(oi)?'ABCDEFGH'[j]:'').join('');
  }else if(q.k==='判'){ok=Q.cur.tf===q.a;ansText=q.a?'正確':'錯誤';
    document.querySelectorAll('#qbody .opt').forEach(b=>{const v=b.dataset.tf==='1';if(v===q.a)b.classList.add('right');else if(v===Q.cur.tf)b.classList.add('wrong')})}
  else if(q.k==='填'){const ins=[...document.querySelectorAll('#qbody input.blank')];
    const res=ins.map((inp,i)=>fillOK(inp.value,q.a[i]));ok=res.every(Boolean);
    ins.forEach((inp,i)=>{inp.disabled=true;inp.style.borderColor=res[i]?'var(--ok)':'var(--bad)';inp.style.background=res[i]?'#e6f5ea':'#fdecea'});
    ansText=q.a.map((a,i)=>('①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮'[i]||i+1)+' '+String(a).split('|').join(' 或 ')).join('　');}
  Q.ans=true;const sb=$('#qsubmit');if(sb)sb.remove();
  fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="big">${ok?'✔ 答對了！':'✘ 答錯了'}</div>${ok&&q.k!=='填'?'':`<div class="sec"><b>正確答案：</b>${esc(ansText)}</div>`}${explainHTML(q)}</div>`;
  bindCardLinks(fb);finish(ok);
}
function finish(ok){
  const q=Q.cur.q;record(q,ok);Q.done++;if(ok)Q.ok++;else{Q.wrongs.push(q.id);const r=Q.reins[q.id]||0;if(r<(Q.inf?2:1)){Q.reins[q.id]=r+1;if(Q.inf)Q.pend.push({id:q.id,at:Q.done+4});else Q.queue.splice(Math.min(Q.queue.length,Q.i+4),0,q.id)}}
  const fb=$('#qfb');const d=document.createElement('div');d.className='row';d.style.marginTop='.7rem';
  d.innerHTML=`<button class="btn pri" id="qnext">下一題 →</button>${!ok?'<span class="mute">已加入錯題本，稍後會再出現</span>':''}`;fb.appendChild(d);
  $('#qnext').onclick=nextQ;
}
function endQuiz(){
  const done=Q.done,ok=Q.ok,ws=[...new Set(Q.wrongs)];Q.active=false;
  $('#main').innerHTML=`<div class="box"><h2>本輪結束</h2><div class="score">${ok} / ${done}</div><p>正確率 ${done?Math.round(ok/done*100):0}%</p>
  ${ws.length?`<h3>本輪答錯的題（已收入錯題本）</h3><ol>${ws.map(id=>`<li>${esc(QMAP[id].q.slice(0,60))}　<span class="src">${esc(srcText(QMAP[id]))}</span></li>`).join('')}</ol>`:'<p>全對，太棒了！</p>'}
  <div class="row"><button class="btn pri" id="again">再刷一輪</button>${ws.length?'<button class="btn" id="redo">只重做這些錯題</button>':''}<button class="btn" id="towb">去錯題本</button></div></div>`;
  $('#again').onclick=()=>R.quiz();$('#towb').onclick=()=>go('wrong');
  const rd=$('#redo');if(rd)rd.onclick=()=>startQuiz(shuffle(ws.slice()),{title:'重做錯題'});
}
// ---------- 錯題本 ----------
R.wrong=function(){
  const ids=Object.keys(S.wrong).filter(id=>QMAP[id]).sort((a,b)=>S.wrong[b].cnt-S.wrong[a].cnt||S.wrong[b].t-S.wrong[a].t);
  $('#main').innerHTML=`<div class="box"><h2>錯題本</h2><p>目前 <b>${ids.length}</b> 題　·　已畢業（連對 3 次移出）<b>${S.grad}</b> 題</p>
  <p class="mute">答錯的題會自動收進來；之後在任何模式中同一題連續答對 3 次，就會自動移出。錯題在無限模式中出現機率是一般題的 6 倍。</p>
  <div class="row"><button class="btn pri" id="wgo" ${ids.length?'':'disabled'}>練錯題（全部）</button><button class="btn" id="winf" ${ids.length?'':'disabled'}>錯題無限循環</button></div></div>
  ${ids.length?`<div class="box"><table><tr><th>題目</th><th>錯</th><th>連對</th><th></th></tr>${ids.map(id=>{const q=QMAP[id],w=S.wrong[id];return`<tr><td><span class="tag">${KN[q.k]}</span>${esc(q.q.slice(0,70))}<div class="src">${esc(srcText(q))}</div></td><td>${w.cnt}</td><td>${w.st}/3</td><td><button class="btn sm" data-v="${id}">看</button> <button class="btn sm" data-rm="${id}">移除</button></td></tr>`}).join('')}</table></div>`:''}`;
  const ws=()=>Object.keys(S.wrong).filter(id=>QMAP[id]);
  $('#wgo').onclick=()=>{go('quiz');startQuiz(shuffle(ws()),{title:'錯題練習'})};
  $('#winf').onclick=()=>{go('quiz');startQuiz(ws(),{inf:true,pool:ws(),title:'錯題無限循環'})};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete S.wrong[b.dataset.rm];save();R.wrong()});
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const q=QMAP[b.dataset.v];modal(`<div class="qtext">${esc(q.q)}</div>${ansBlock(q)}${explainHTML(q)}`);bindCardLinks(document.querySelector('.modal'))});
};
function ansBlock(q){
  if(q.k==='單'||q.k==='多'){const a=Array.isArray(q.a)?q.a:[q.a];return `<ol>${q.o.map((o,i)=>`<li style="${a.includes(i)?'color:var(--ok);font-weight:700':''}">${esc(o)}${a.includes(i)?' ✔':''}</li>`).join('')}</ol>`}
  if(q.k==='判')return `<p><b>答案：</b>${q.a?'正確':'錯誤'}</p>`;
  if(q.k==='填')return `<p><b>答案：</b>${q.a.map(a=>esc(String(a).split('|')[0])).join('；')}</p>`;
  return `${q.sum?`<p><b>白話：</b>${esc(q.sum)}</p>`:''}<ol>${q.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`;
}
// ---------- 模擬卷 ----------
const PTS={'單':2,'多':3,'判':1,'填':2,'簡':10,'論':10};
let EX=null;
function defE(){return{ls:LESSONS.slice(),n:{'單':20,'多':10,'判':0,'填':0,'簡':2,'論':1}}}
R.exam=function(){
  if(EX&&!EX.saved){drawExam();return}
  const ec=S.ecfg||defE();const sel=new Set(ec.ls);
  const hist=(S.exams||[]).slice(-10).reverse();
  $('#main').innerHTML=`<div class="box"><h2>模擬卷</h2><p class="mute">隨機組一份混合試卷。客觀題自動判分；簡答、論述題交卷後逐點對照自評。配分僅供練習參考。</p>
  <h3>範圍</h3>${picker(sel,'ep')}
  <h3>題量與配分</h3><div class="row">${['單','多','判','填','簡','論'].map(k=>`<label>${KN[k]} <input type="number" min="0" max="60" style="width:4.2rem" data-n="${k}" value="${ec.n[k]||0}"> 題×${PTS[k]}分</label>`).join('')}</div>
  <p class="mute" id="etot"></p><div class="row"><button class="btn pri" id="ego">產生試卷</button></div></div>
  ${hist.length?`<div class="box"><h3>最近成績</h3><table><tr><th>時間</th><th>得分</th><th>範圍</th></tr>${hist.map(h=>`<tr><td>${esc(h.d)}</td><td><b>${h.sc}</b> / ${h.tot}</td><td class="mute">${esc(h.scope)}</td></tr>`).join('')}</table></div>`:''}`;
  const getN=()=>{const n={};document.querySelectorAll('[data-n]').forEach(i=>n[i.dataset.n]=Math.max(0,+i.value||0));return n};
  const upd=()=>{const n=getN();$('#etot').textContent='滿分：'+Object.keys(n).reduce((s,k)=>s+n[k]*PTS[k],0)+' 分'};
  const rb=()=>{const el=$('#ep');el.outerHTML=picker(sel,'ep');bindPicker($('#ep'),sel,rb)};bindPicker($('#ep'),sel,rb);
  document.querySelectorAll('[data-n]').forEach(i=>i.oninput=upd);upd();
  $('#ego').onclick=()=>{const n=getN();S.ecfg={ls:[...sel],n};save();buildExam(S.ecfg)};
};
function buildExam(ec){
  const ls=new Set(ec.ls);const items=[];let short=[];
  for(const k of ['單','多','判','填','簡','論']){
    let pool=DATA.qs.filter(q=>ls.has(q.l)&&q.k===k);
    if(k==='簡'&&pool.length<ec.n[k])pool=pool.concat(DATA.qs.filter(q=>ls.has(q.l)&&q.k==='默'));
    const pick=shuffle(pool.slice()).slice(0,ec.n[k]);if(pick.length<ec.n[k])short.push(`${KN[k]}只有 ${pick.length} 題`);
    pick.forEach(q=>items.push({id:q.id,k,ord:q.o?shuffle(q.o.map((_,i)=>i)):null}));
  }
  if(!items.length){toast('範圍內沒有題目');return}
  const scope=ec.ls.length===LESSONS.length?'全部':ec.ls.length<=6?ec.ls.map(pad).join('、')+' 堂':ec.ls.length+' 堂';
  EX={items,sub:false,saved:false,start:Date.now(),scope};if(short.length)toast('範圍內'+short.join('，'));drawExam();
}
function drawExam(){
  let n=0;const sec={};EX.items.forEach(it=>(sec[it.k]=sec[it.k]||[]).push(it));
  const html=Object.keys(sec).map((k,si)=>`<div class="box"><h3>${'一二三四五六'[si]}、${KN[k]}題（每題 ${PTS[k]} 分）</h3>${sec[k].map(it=>{n++;const q=QMAP[it.id];let b='';
    if(k==='單'||k==='多')b=it.ord.map((oi,j)=>`<label class="opt" style="cursor:pointer"><input type="${k==='單'?'radio':'checkbox'}" name="e${n}" value="${j}" ${EX.sub?'disabled':''}> <span class="k">${'ABCDEFGH'[j]}</span>${esc(q.o[oi])}</label>`).join('');
    else if(k==='判')b=`<label class="ck"><input type="radio" name="e${n}" value="1"> 正確</label>　<label class="ck"><input type="radio" name="e${n}" value="0"> 錯誤</label>`;
    else if(k==='填')b=q.a.map((_,i)=>`<input type="text" class="blank" name="e${n}" placeholder="${i+1}">`).join(' ');
    else b=`<textarea name="e${n}" placeholder="作答區（可不寫，交卷後逐點自評）"></textarea>`;
    it.n=n;return `<div class="pq" id="pq${n}"><div class="qtext">${n}. ${esc(q.q)}</div>${b}<div class="efb"></div></div>`}).join('')}</div>`).join('');
  $('#main').innerHTML=`<div class="box"><h2>模擬卷（${EX.items.length} 題，滿分 ${EX.items.reduce((s,it)=>s+PTS[it.k],0)} 分）</h2><p class="mute">範圍：${esc(EX.scope)}　·　作答完按最下面「交卷」。</p></div>${html}
  <div class="box" id="eres"><div class="row"><button class="btn pri" id="esub">交卷</button><button class="btn" id="equit">放棄這份</button></div></div>`;
  $('#esub').onclick=submitExam;$('#equit').onclick=()=>{if(confirm('放棄這份試卷？')){EX=null;R.exam()}};
}
function submitExam(){
  if(!confirm('確定交卷？'))return;EX.sub=true;let obj=0,objTot=0;
  EX.items.forEach(it=>{const q=QMAP[it.id],box=$('#pq'+it.n),fb=box.querySelector('.efb'),k=it.k;let ok=false,ans='';
    box.querySelectorAll('input,textarea').forEach(i=>i.disabled=true);
    if(k==='單'||k==='多'){const corr=new Set(Array.isArray(q.a)?q.a:[q.a]);const sel=new Set([...box.querySelectorAll('input:checked')].map(i=>+i.value));
      ok=it.ord.every((oi,j)=>corr.has(oi)===sel.has(j));ans=it.ord.map((oi,j)=>corr.has(oi)?'ABCDEFGH'[j]:'').join('');
      box.querySelectorAll('label.opt').forEach((l,j)=>{if(corr.has(it.ord[j]))l.classList.add('right');else if(sel.has(j))l.classList.add('wrong')})}
    else if(k==='判'){const s=box.querySelector('input:checked');ok=!!s&&(s.value==='1')===q.a;ans=q.a?'正確':'錯誤'}
    else if(k==='填'){const ins=[...box.querySelectorAll('input')];const r=ins.map((x,i)=>fillOK(x.value,q.a[i]));const part=r.filter(Boolean).length/r.length;ok=part===1;it.part=part;ans=q.a.map(a=>String(a).split('|')[0]).join('；')}
    if(!SELF(k)&&!(q.k==='默')){const sc=k==='填'?PTS[k]*(it.part||0):(ok?PTS[k]:0);it.sc=sc;obj+=sc;objTot+=PTS[k];record(q,ok);
      fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✔ 正確':'✘ 錯誤'}</b>　${ok?'':'正確答案：'+esc(ans)}　（得 ${Math.round(sc*10)/10} 分）${explainHTML(q)}</div>`}
    else{fb.innerHTML=`<div class="fb self">${q.sum?`<div><b>白話：</b>${esc(q.sum)}</div>`:''}<div class="pts">${q.pts.map((p,i)=>`<label><input type="checkbox" data-ex="${it.n}"><span>${i+1}. ${esc(p)}</span></label>`).join('')}</div>${explainHTML(q)}</div>`}
    bindCardLinks(fb);
  });
  EX.obj=obj;
  const res=$('#eres');res.innerHTML=`<h3>客觀題得分：${Math.round(obj*10)/10} / ${objTot}</h3><p>請在上面的簡答／論述題逐點打勾自評，然後按「計算總分並儲存」。</p><div class="row"><button class="btn pri" id="esave">計算總分並儲存</button></div>`;
  res.scrollIntoView({behavior:'smooth'});
  $('#esave').onclick=()=>{let subj=0;
    EX.items.filter(it=>SELF(it.k)||QMAP[it.id].k==='默').forEach(it=>{const q=QMAP[it.id];const n=document.querySelectorAll(`[data-ex="${it.n}"]:checked`).length;const r=n/q.pts.length;subj+=PTS[it.k]*r;record(q,r>=0.8)});
    const tot=EX.items.reduce((s,it)=>s+PTS[it.k],0),sc=Math.round((EX.obj+subj)*10)/10;
    const d=new Date();S.exams.push({d:`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`,sc,tot,scope:EX.scope,min:Math.round((Date.now()-EX.start)/60000)});save();EX.saved=true;
    res.innerHTML=`<div class="score">${sc} / ${tot}</div><p>用時約 ${Math.round((Date.now()-EX.start)/60000)} 分鐘。答錯的客觀題與自評未達 80% 的主觀題已收入錯題本。</p><div class="row"><button class="btn pri" id="enew">再來一份</button><button class="btn" id="ewb">去錯題本</button></div>`;
    $('#enew').onclick=()=>{EX=null;R.exam()};$('#ewb').onclick=()=>go('wrong');};
}
// ---------- 統計 ----------
R.stats=function(){
  const agg=(f)=>{let n=0,c=0,seen=0,tot=0;DATA.qs.forEach(q=>{if(!f(q))return;tot++;const r=S.qs[q.id];if(r){seen++;n+=r.n;c+=r.c}});return{n,c,seen,tot,acc:n?c/n:null}};
  const all=agg(()=>true);
  const pct=x=>x==null?'—':Math.round(x*100)+'%';
  const bar=x=>`<div class="bar"><i style="width:${x==null?0:Math.round(x*100)}%"></i></div>`;
  const chs=DATA.chapters.map((c,i)=>({c,a:agg(q=>q.ch===i),k:DATA.cards.filter(x=>x.ch===i),kk:DATA.cards.filter(x=>x.ch===i&&S.cards[x.id]==='k').length}));
  const les=LESSONS.map(l=>({l,a:agg(q=>q.l===l)})).filter(x=>x.a.n>=3).sort((x,y)=>x.a.acc-y.a.acc).slice(0,8);
  const ks=KORDER.map(k=>({k,a:agg(q=>q.k===k)}));
  const days=Object.keys(S.days).sort().slice(-7);
  $('#main').innerHTML=`<div class="box"><h2>統計</h2><p>已做過 <b>${all.seen}</b> / ${all.tot} 題　·　累計作答 ${all.n} 次　·　總正確率 <b>${pct(all.acc)}</b>　·　錯題本 ${Object.keys(S.wrong).length} 題　·　知識卡已熟 ${DATA.cards.filter(c=>S.cards[c.id]==='k').length} / ${DATA.cards.length}</p>
  ${days.length?`<p class="mute">最近作答：${days.map(d=>d.slice(5)+' '+S.days[d]+'題').join('　')}</p>`:''}</div>
  <div class="box"><h3>各章正確率</h3><table><tr><th>章</th><th>已做／題數</th><th>正確率</th><th style="width:28%"></th><th>卡已熟</th></tr>${chs.map(x=>`<tr><td>${esc(x.c.n)}</td><td>${x.a.seen}/${x.a.tot}</td><td>${pct(x.a.acc)}</td><td>${bar(x.a.acc)}</td><td>${x.kk}/${x.k.length}</td></tr>`).join('')}</table></div>
  <div class="box"><h3>最弱的課堂（至少作答 3 次）</h3>${les.length?`<table>${les.map(x=>`<tr><td>第${pad(x.l)}堂 ${esc(DATA.lt[x.l])}</td><td>${pct(x.a.acc)}（${x.a.c}/${x.a.n}）</td><td><button class="btn sm" data-dl="${x.l}">練這堂</button></td></tr>`).join('')}</table>`:'<p class="mute">做多一點題目後才會顯示。</p>'}</div>
  <div class="box"><h3>各題型正確率</h3><table>${ks.map(x=>`<tr><td>${KN[x.k]}</td><td>${x.a.seen}/${x.a.tot}</td><td>${pct(x.a.acc)}</td><td style="width:35%">${bar(x.a.acc)}</td></tr>`).join('')}</table></div>`;
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const l=+b.dataset.dl;const p=DATA.qs.filter(q=>q.l===l).map(q=>q.id);go('quiz');startQuiz(shuffle(p).slice(0,20),{pool:p,title:`第${pad(l)}堂練習`})});
};
// ---------- 備份 ----------
R.backup=function(){
  $('#main').innerHTML=`<div class="box"><h2>備份進度</h2><p class="mute">進度存在這台電腦這個瀏覽器裡（localStorage）。換電腦、換瀏覽器或清除瀏覽資料前，請先匯出備份。</p>
  <div class="row"><button class="btn pri" id="bexp">匯出進度（下載 JSON 檔）</button><label class="btn">匯入進度…<input type="file" id="bimp" accept=".json,application/json" style="display:none"></label></div>
  <details style="margin-top:.6rem"><summary class="mute">下載不了？改用複製文字</summary><textarea id="btxt" readonly></textarea><div class="row"><button class="btn sm" id="bshow">顯示備份文字</button><button class="btn sm" id="bpaste">把貼上的文字匯入</button></div></details></div>
  <div class="box"><h2>設定</h2><div class="row">字體大小：<button class="btn sm" id="fsm">A－</button><b id="fsv">${S.fs}</b><button class="btn sm" id="fsp">A＋</button></div></div>
  <div class="box"><h2>關於題庫</h2><p class="mute">知識卡 ${DATA.cards.length} 張、題目 ${DATA.qs.length} 題，涵蓋第01–${pad(LESSONS[LESSONS.length-1])}堂（導論至第十章）。內容只取自課程投影片黃色重點、講師口述標記與逐字稿；原文保留投影片簡體字。資料建立：${esc(DATA.built)}。</p>
  <div class="row"><button class="btn bad" id="breset">清除全部進度</button></div></div>`;
  const dump=()=>JSON.stringify({app:'xt-study',v:1,exported:new Date().toISOString(),state:S});
  $('#bexp').onclick=()=>{const b=new Blob([dump()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='思想概論進度_'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('已匯出')};
  const load=t=>{try{const o=JSON.parse(t);const st=o.state||o;if(!st||typeof st!=='object'||!('qs' in st))throw 0;if(!confirm('匯入會覆蓋目前進度，確定嗎？'))return;S=Object.assign(blank(),st);save();document.documentElement.style.setProperty('--fs',S.fs+'px');toast('匯入成功');R.backup()}catch(e){alert('檔案格式不正確')}};
  $('#bimp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f)};
  $('#bshow').onclick=()=>{const t=$('#btxt');t.readOnly=false;t.value=dump();t.select()};
  $('#bpaste').onclick=()=>load($('#btxt').value);
  const fs=d=>{S.fs=Math.min(26,Math.max(14,S.fs+d));document.documentElement.style.setProperty('--fs',S.fs+'px');$('#fsv').textContent=S.fs;save()};
  $('#fsm').onclick=()=>fs(-1);$('#fsp').onclick=()=>fs(1);
  $('#breset').onclick=()=>{if(confirm('真的要清除全部進度（錯題本、已熟、成績）嗎？建議先匯出備份。')){S=blank();save();toast('已清除');R.backup()}};
};
window.__app={S:()=>S,go,startQuiz,QMAP};
go('cards');
})();
</script>
