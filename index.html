 "q": "「维护党中央权威和集中统一领导的各项制度」體現這一制度體系的最高原则。", "a": true, "e": "對。「维护党中央权威和集中统一领导的各项制度」→「最高原则」。", "id": "Q11-015", "l": 11, "ch": 3}, {"s": [3, 4], "src": "逐字稿", "card": "C11-04", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "在黨的領導制度體系中，「为人民执政、靠人民执政各项制度」體現（明確）這一制度體系的：", "o": ["价值追求", "最高原则", "实践要求", "根本任务"], "a": 0, "e": "「为人民执政、靠人民执政各项制度」→「价值追求」。記法：「權威＝最高、為民＝價值、能力＝實踐」。", "id": "Q11-016", "l": 11, "ch": 3}, {"s": [3, 4], "src": "逐字稿", "card": "C11-04", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「为人民执政、靠人民执政各项制度」體現這一制度體系的实践要求。", "a": false, "e": "錯。「为人民执政、靠人民执政各项制度」應對應「价值追求」，「实践要求」對應的是「提高党的执政能力和领导水平制度」。", "id": "Q11-017", "l": 11, "ch": 3}, {"s": [3, 4], "src": "逐字稿", "card": "C11-04", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "在黨的領導制度體系中，「提高党的执政能力和领导水平制度」體現（明確）這一制度體系的：", "o": ["实践要求", "最高原则", "价值追求", "根本任务"], "a": 0, "e": "「提高党的执政能力和领导水平制度」→「实践要求」。記法：「權威＝最高、為民＝價值、能力＝實踐」。", "id": "Q11-018", "l": 11, "ch": 3}, {"s": [3, 4], "src": "逐字稿", "card": "C11-04", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「提高党的执政能力和领导水平制度」體現這一制度體系的实践要求。", "a": true, "e": "對。「提高党的执政能力和领导水平制度」→「实践要求」。", "id": "Q11-019", "l": 11, "ch": 3}, {"s": [5, 6], "src": "", "card": "C11-05", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜健全黨中央對重大工作的領導體制：\n我们党的（＿①＿）；必须完善党中央（＿②＿）；党的领导决策核心：（＿③＿）、（＿④＿）、（＿⑤＿）", "a": ["优良传统和宝贵经验", "重大决策部署落实机制", "党的中央委员会", "中央政治局", "中央政治局常务委员会"], "e": "加強黨中央對重大工作的領導是黨的優良傳統和寶貴經驗；必須完善黨中央重大決策部署落實機制。黨的領導決策核心有三個：黨的中央委員會、中央政治局、中央政治局常務委員會（講師：「不要去忘了這個」）。", "id": "Q11-020", "l": 11, "ch": 3}, {"s": [5, 6], "src": "", "card": "C11-05", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "多", "q": "黨的領導決策核心是：", "o": ["党的中央委员会", "中央政治局", "中央政治局常务委员会", "全国人民代表大会", "中央纪律检查委员会"], "a": [0, 1, 2], "e": "正確：党的中央委员会；中央政治局；中央政治局常务委员会。干擾項：全国人民代表大会；中央纪律检查委员会。", "id": "Q11-021", "l": 11, "ch": 3}, {"s": [7, 8], "src": "", "card": "C11-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜健全黨的全面領導制度（三個「必須完善」）：\n（1）必须完善党在（＿①＿）中发挥领导作用的制度；（2）必须完善党（＿②＿）的机制；（3）必须完善党领导（＿③＿）的具体制度", "a": ["各种组织", "协调各方", "各项事业"], "e": "三點：完善黨在各種組織中發揮領導作用的制度；完善黨協調各方的機制；完善黨領導各項事業的具體制度。講師：小標題一定要捋清楚，否則容易混。", "id": "Q11-022", "l": 11, "ch": 3}, {"s": [7, 8], "src": "", "card": "C11-06", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜健全黨的全面領導制度（三個「必須完善」）", "model": "（1）必须完善党在各种组织中发挥领导作用的制度；（2）必须完善党协调各方的机制；（3）必须完善党领导各项事业的具体制度", "pts": ["必须完善党在各种组织中发挥领导作用的制度", "必须完善党协调各方的机制", "必须完善党领导各项事业的具体制度"], "e": "記法：「組織・各方・事業」。", "id": "Q11-023", "l": 11, "ch": 3}, {"k": "單", "s": [3], "q": "我國的根本政治制度是：", "o": ["人民代表大會制度", "黨的領導制度", "民族區域自治制度", "基層群眾自治制度"], "a": 0, "e": "人民代表大會制度＝根本政治制度；黨的領導制度＝根本領導制度。", "id": "Q11-024", "l": 11, "ch": 3}, {"k": "單", "s": [3], "q": "黨的領導制度是我國的：", "o": ["根本領導制度", "根本政治制度", "基本政治制度", "重要政治制度"], "a": 0, "e": "講師：突出的是「領導」兩個字。", "id": "Q11-025", "l": 11, "ch": 3}, {"k": "多", "s": [3], "q": "以下屬於我國「基本政治制度」的有：", "o": ["中國共產黨領導的多黨合作和政治協商制度", "民族區域自治制度", "基層群眾自治制度", "人民代表大會制度"], "a": [0, 1, 2], "e": "人民代表大會制度是「根本政治制度」，不是基本政治制度。", "id": "Q11-026", "l": 11, "ch": 3}, {"k": "判", "s": [3], "q": "人民代表大會制度是我國的根本領導制度。", "a": false, "e": "錯。人大制度是根本「政治」制度；根本「領導」制度是黨的領導制度。", "id": "Q11-027", "l": 11, "ch": 3}, {"k": "單", "s": [5], "q": "加強黨中央對重大工作的領導，是我們黨的：", "o": ["優良傳統和寶貴經驗", "根本工作方法", "最大政治優勢", "重大建黨原則"], "a": 0, "e": "講師：「這是我們黨的優良傳統和寶貴經驗。」", "id": "Q11-028", "l": 11, "ch": 3}, {"k": "判", "s": [6], "q": "黨的中央委員會、中央政治局、中央政治局常務委員會是黨的領導決策核心。", "a": true, "e": "對。講師：A、B、C 三個「不要去忘了」。", "id": "Q11-029", "l": 11, "ch": 3}, {"k": "判", "s": [0], "src": "逐字稿", "q": "四個全面中，第一個「全面建設社會主義現代化國家」是戰略目標，其餘三個是戰略舉措。", "a": true, "e": "對。講師在本堂複習：「五位一體和四個全面」是非常重要的知識點。", "id": "Q11-030", "l": 11, "ch": 3}, {"s": [4, 5], "src": "", "card": "C12-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民是歷史的創造者，是真正的英雄：\n（1）人民是（＿①＿），是（＿②＿）；（2）尊重人民（＿③＿），充分发挥人民（＿④＿）", "a": ["历史的创造者", "真正的英雄", "历史地位", "主体作用"], "e": "歷史是誰創造的？是人民。人民創造物質財富和精神財富，也是推動社會變革的決定力量。所以要尊重人民的歷史地位，充分發揮人民的主體作用。講師：「標黃色的部分是你重點要去背的部分。」", "id": "Q12-001", "l": 12, "ch": 4}, {"s": [4, 5], "src": "", "card": "C12-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜人民是歷史的創造者，是真正的英雄", "model": "（1）人民是历史的创造者，是真正的英雄；（2）尊重人民历史地位，充分发挥人民主体作用", "pts": ["历史的创造者", "真正的英雄", "历史地位", "主体作用"], "e": "記法：「創造者＋英雄」；「尊重地位、發揮作用」。", "id": "Q12-002", "l": 12, "ch": 4}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜民心是最大的政治 vs 就業是最大的民生：\n（＿①＿）是最大的政治，决定事业兴衰成败；（＿②＿）是最大的民生", "a": ["民心", "就业"], "e": "「民心」是最大的政治，決定事業興衰成敗；講師順帶提醒另一個選擇題考點：「就業」是最大的民生。兩個「最大」不要混。", "id": "Q12-003", "l": 12, "ch": 4}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師強調的選擇題考點：「民心」是：", "o": ["最大的政治", "最大的民生", "最大的国情", "最大的优势"], "a": 0, "e": "「民心」→「最大的政治」。記法：「民心→政治；就業→民生」——「心裏想的是政治，飯碗是民生」。", "id": "Q12-004", "l": 12, "ch": 4}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「民心」是最大的政治。", "a": true, "e": "對。「民心」→「最大的政治」。", "id": "Q12-005", "l": 12, "ch": 4}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師強調的選擇題考點：「就业」是：", "o": ["最大的民生", "最大的政治", "最大的国情", "最大的优势"], "a": 0, "e": "「就业」→「最大的民生」。記法：「民心→政治；就業→民生」——「心裏想的是政治，飯碗是民生」。", "id": "Q12-006", "l": 12, "ch": 4}, {"s": [6], "src": "", "card": "C12-02", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「就业」是最大的政治。", "a": false, "e": "錯。「就业」應對應「最大的民生」，「最大的政治」對應的是「民心」。", "id": "Q12-007", "l": 12, "ch": 4}, {"s": [7], "src": "", "card": "C12-03", "tag": ["必背"], "auto": 1, "k": "填", "q": "填空｜我國國體（要背過）：\n我国是（＿①＿）领导的、以（＿②＿）为基础的（＿③＿）的社会主义国家", "a": ["工人阶级", "工农联盟", "人民民主专政"], "e": "「國體」＝國家的性質：由誰領導、靠誰作基礎。講師：「這一段呢我就要求你們把這個國體給我背過了。」補充：人民代表大會是我國最高的權力機關。", "id": "Q12-008", "l": 12, "ch": 4}, {"s": [7], "src": "", "card": "C12-03", "tag": ["必背"], "auto": 1, "k": "默", "q": "默寫｜我國國體（要背過）", "model": "我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家", "pts": ["工人阶级", "工农联盟", "人民民主专政"], "e": "記法：「工人領、工農基、人民專政」。", "id": "Q12-009", "l": 12, "ch": 4}, {"s": [8], "src": "", "card": "C12-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜江山就是人民，人民就是江山：\n（＿①＿）；打江山、守江山，守的是（＿②＿）", "a": ["江山就是人民，人民就是江山", "人民的心"], "e": "國家（江山）就是人民，人民就是國家。這是由黨的性質和宗旨決定的。打江山、守江山，守的是人民的心。", "id": "Q12-010", "l": 12, "ch": 4}, {"s": [9], "src": "", "card": "C12-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜人民立場是黨的根本政治立場；顯著標誌：\n人民立场是中国共产党的（＿①＿）；是我们党区别于其他政党的（＿②＿）", "a": ["根本政治立场", "显著标志"], "e": "人民立場是中國共產黨的「根本政治立場」，也是我們黨區別於其他政黨的「顯著標誌」。講師：兩個都是選擇題考點。", "id": "Q12-011", "l": 12, "ch": 4}, {"s": [9], "src": "逐字稿（第11、12堂）", "card": "C12-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：「三個根本」：\n党的领导制度——（＿①＿）；人民代表大会制度——（＿②＿）；人民立场——（＿③＿）", "a": ["根本领导制度", "根本政治制度", "根本政治立场"], "e": "講師要求把「三個根本」串起來同步記憶：黨的領導制度＝根本領導制度；人民代表大會制度＝根本政治制度；人民立場＝根本政治立場。", "id": "Q12-012", "l": 12, "ch": 4}, {"s": [9], "src": "逐字稿（第11、12堂）", "card": "C12-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「三個根本」串聯記憶：「党的领导制度」是：", "o": ["根本领导制度", "根本政治立场", "根本政治制度", "基本政治制度"], "a": 0, "e": "「党的领导制度」→「根本领导制度」。記法：「黨→領導制度；人大→政治制度；人民→政治立場」。", "id": "Q12-013", "l": 12, "ch": 4}, {"s": [9], "src": "逐字稿（第11、12堂）", "card": "C12-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「党的领导制度」是根本领导制度。", "a": true, "e": "對。「党的领导制度」→「根本领导制度」。", "id": "Q12-014", "l": 12, "ch": 4}, {"s": [9], "src": "逐字稿（第11、12堂）", "card": "C12-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「三個根本」串聯記憶：「人民代表大会制度」是：", "o": ["根本政治制度", "根本领导制度", "根本政治立场", "基本政治制度"], "a": 0, "e": "「人民代表大会制度」→「根本政治制度」。記法：「黨→領導制度；人大→政治制度；人民→政治立場」。", "id": "Q12-015", "l": 12, "ch": 4}, {"s": [9], "src": "逐字稿（第11、12堂）", "card": "C12-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「人民代表大会制度」是根本政治立场。", "a": false, "e": "錯。「人民代表大会制度」應對應「根本政治制度」，「根本政治立场」對應的是「人民立场」。", "id": "Q12-016", "l": 12, "ch": 4}, {"s": [9], "src": "逐字稿（第11、12堂）", "card": "C12-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「三個根本」串聯記憶：「人民立场」是：", "o": ["根本政治立场", "根本政治制度", "根本领导制度", "基本政治制度"], "a": 0, "e": "「人民立场」→「根本政治立场」。記法：「黨→領導制度；人大→政治制度；人民→政治立場」。", "id": "Q12-017", "l": 12, "ch": 4}, {"s": [9], "src": "逐字稿（第11、12堂）", "card": "C12-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「人民立场」是根本政治立场。", "a": true, "e": "對。「人民立场」→「根本政治立场」。", "id": "Q12-018", "l": 12, "ch": 4}, {"s": [10], "src": "", "card": "C12-07", "tag": ["必背", "論述題考點", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜如何堅持人民立場（三個標題）：\n坚持人民立场，就要始终牢记党的（＿①＿）；就要始终保持党同人民群众的（＿②＿）；就要（＿③＿）", "a": ["初心和使命", "血肉联系", "热爱人民、尊重人民、敬畏人民"], "e": "堅持人民立場就要：始終牢記黨的初心和使命；始終保持黨同人民群眾的血肉聯繫；熱愛人民、尊重人民、敬畏人民。講師：大題考點，背標題就夠了；注意是「血肉聯繫」，不是普通聯繫。", "id": "Q12-019", "l": 12, "ch": 4}, {"s": [10], "src": "", "card": "C12-07", "tag": ["必背", "論述題考點", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜如何堅持人民立場（三個標題）", "model": "坚持人民立场，就要始终牢记党的初心和使命；就要始终保持党同人民群众的血肉联系；就要热爱人民、尊重人民、敬畏人民", "pts": ["始终牢记党的初心和使命", "始终保持党同人民群众的血肉联系", "热爱人民、尊重人民、敬畏人民"], "e": "記法：「初心・血肉・愛敬畏」。", "id": "Q12-020", "l": 12, "ch": 4}, {"s": [10], "src": "", "card": "C12-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜初心使命；最大政治優勢 vs 最大危險：\n为中国人民（＿①＿），为中华民族（＿②＿）；最大政治优势是（＿③＿）；最大危险是（＿④＿）", "a": ["谋幸福", "谋复兴", "密切联系群众", "脱离群众"], "e": "黨的初心和使命：為中國人民謀幸福，為中華民族謀復興。黨最大的政治優勢是「密切聯繫群眾」；黨執政後最大的危險是「脫離群眾」。", "id": "Q12-021", "l": 12, "ch": 4}, {"s": [10], "src": "", "card": "C12-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「党的最大政治优势」是：", "o": ["密切联系群众", "脱离群众", "不平衡不充分的发展"], "a": 0, "e": "「党的最大政治优势」→「密切联系群众」。記法：「靠近群眾＝優勢，離開群眾＝危險」。", "id": "Q12-022", "l": 12, "ch": 4}, {"s": [10], "src": "", "card": "C12-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「党的最大政治优势」是密切联系群众。", "a": true, "e": "對。「党的最大政治优势」→「密切联系群众」。", "id": "Q12-023", "l": 12, "ch": 4}, {"s": [10], "src": "", "card": "C12-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「党执政后的最大危险」是：", "o": ["脱离群众", "密切联系群众", "不平衡不充分的发展"], "a": 0, "e": "「党执政后的最大危险」→「脱离群众」。記法：「靠近群眾＝優勢，離開群眾＝危險」。", "id": "Q12-024", "l": 12, "ch": 4}, {"s": [10], "src": "", "card": "C12-08", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「党执政后的最大危险」是密切联系群众。", "a": false, "e": "錯。「党执政后的最大危险」應對應「脱离群众」，「密切联系群众」對應的是「党的最大政治优势」。", "id": "Q12-025", "l": 12, "ch": 4}, {"k": "單", "s": [6], "q": "講師強調的選擇題考點：「＿＿是最大的政治」。", "o": ["民心", "就業", "民生", "發展"], "a": 0, "e": "民心是最大的政治；就業是最大的民生。", "id": "Q12-026", "l": 12, "ch": 4}, {"k": "單", "s": [9], "q": "中國共產黨的根本政治立場是：", "o": ["人民立場", "階級立場", "群眾路線", "實事求是"], "a": 0, "e": "人民立場是中國共產黨的根本政治立場。", "id": "Q12-027", "l": 12, "ch": 4}, {"k": "判", "s": [10], "q": "黨執政後的最大危險是脫離群眾。", "a": true, "e": "對。最大政治優勢是密切聯繫群眾，最大危險是脫離群眾。", "id": "Q12-028", "l": 12, "ch": 4}, {"k": "判", "s": [9], "q": "人民立場是中國共產黨的根本領導制度。", "a": false, "e": "錯。「三個根本」：人民立場＝根本政治立場；黨的領導制度＝根本領導制度。", "id": "Q12-029", "l": 12, "ch": 4}, {"k": "單", "s": [9], "q": "我們黨區別於其他政黨的顯著標誌是：", "o": ["人民立場", "民主集中制", "自我革命", "群眾路線"], "a": 0, "e": "講師：人民立場「是我們黨區別於其他政黨的顯著標誌」，選擇題考點。", "id": "Q12-030", "l": 12, "ch": 4}, {"k": "填", "s": [10], "q": "堅持人民立場，就要始終牢記黨的（＿①＿）；就要始終保持黨同人民群眾的（＿②＿）；就要熱愛人民、尊重人民、（＿③＿）人民。", "a": ["初心和使命", "血肉联系", "敬畏"], "e": "三個標題。", "id": "Q12-031", "l": 12, "ch": 4}, {"k": "單", "s": [0], "src": "逐字稿", "q": "我國最高的權力機關是：", "o": ["全國人民代表大會", "國務院", "中國人民政治協商會議", "中央政治局"], "a": 0, "e": "講師：「人民代表大會是我國最高的……權力機關。」", "id": "Q12-032", "l": 12, "ch": 4}, {"k": "論", "s": [10], "q": "論述：新時代如何堅持人民立場？", "sum": "一句白話：記住黨是為人民謀幸福的，跟人民像血和肉一樣連在一起，並且愛人民、尊重人民、敬畏人民。", "pts": ["始终牢记党的初心和使命——为中国人民谋幸福，为中华民族谋复兴", "始终保持党同人民群众的血肉联系——最大政治优势是密切联系群众，最大危险是脱离群众", "热爱人民、尊重人民、敬畏人民"], "e": "講師：「一個大題的考點……我們很多大題大家真的只需要去背標題就夠了。」", "id": "Q12-033", "l": 12, "ch": 4}, {"s": [3, 4, 5], "src": "", "card": "C13-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民對美好生活的嚮往就是黨的奮鬥目標：\n人民对美好生活的向往就是党的（＿①＿）；（1）让人民过上好日子是党（＿②＿）；（2）新时代人民对美好生活的向往", "a": ["奋斗目标", "一贯的追求"], "e": "讓人民過上好日子是黨一直以來的追求（為人民謀幸福是黨始終堅守的初心）。新時代人民對美好生活的嚮往：講師說這裏答題不只背標題，要結合「全面建成小康社會」和「社會主要矛盾轉化」稍微擴充。", "id": "Q13-001", "l": 13, "ch": 4}, {"s": [6], "src": "", "card": "C13-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民是黨的生命之根、執政之基、力量之源：\n人民是我们党的（＿①＿）、（＿②＿）、（＿③＿）；依靠人民创造历史伟业，必须尊重人民（＿④＿）", "a": ["生命之根", "执政之基", "力量之源", "主体地位"], "e": "人民對黨來說就像「根、地基、電源」。依靠人民創造歷史偉業，必須尊重人民主體地位；堅持人民主體地位、調動人民積極性，是黨立於不敗之地的強大根基。", "id": "Q13-002", "l": 13, "ch": 4}, {"s": [6], "src": "", "card": "C13-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "多", "q": "人民是我們黨的：", "o": ["生命之根", "执政之基", "力量之源", "最高裁决者之本", "精神之魂"], "a": [0, 1, 2], "e": "正確：生命之根；执政之基；力量之源。干擾項：最高裁决者之本；精神之魂。", "id": "Q13-003", "l": 13, "ch": 4}, {"s": [7], "src": "", "card": "C13-03", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜必須尊重人民首創精神（四點）：\n①始终把人民群众作为（＿①＿）；②就要（＿②＿），坚持顶层设计和基层探索相统一，大胆探索、勇于开拓，鼓励创新、（＿③＿）；③就要激发人民群众的（＿④＿）；④就要及时发现、总结、概括人民群众实践中形成的（＿⑤＿），使之上升为理论和政策", "a": ["智慧和力量的源泉", "尊重实践、尊重创造", "宽容失败", "创新创造活力", "新鲜经验"], "e": "「首創精神」＝人民自己想出新辦法的精神。四點：①把人民當作智慧和力量的源泉；②尊重實踐、尊重創造，頂層設計和基層探索相統一，鼓勵創新、寬容失敗；③激發人民的創新創造活力；④及時總結人民實踐中的新鮮經驗，上升為理論和政策。講師：可以作為簡答題。", "id": "Q13-004", "l": 13, "ch": 4}, {"s": [7], "src": "", "card": "C13-03", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜必須尊重人民首創精神（四點）", "model": "①始终把人民群众作为智慧和力量的源泉；②就要尊重实践、尊重创造，坚持顶层设计和基层探索相统一，大胆探索、勇于开拓，鼓励创新、宽容失败；③就要激发人民群众的创新创造活力；④就要及时发现、总结、概括人民群众实践中形成的新鲜经验，使之上升为理论和政策", "pts": ["始终把人民群众作为智慧和力量的源泉", "尊重实践、尊重创造，坚持顶层设计和基层探索相统一，鼓励创新、宽容失败", "激发人民群众的创新创造活力", "及时发现、总结、概括人民群众实践中形成的新鲜经验，使之上升为理论和政策"], "e": "記法：「源泉・尊重・激發・總結」：先當源泉，再尊重，再激發，最後總結經驗。", "id": "Q13-005", "l": 13, "ch": 4}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人民是最高裁決者和最終評判者（出卷人・答卷人・閱卷人）：\n人民是党的工作的（＿①＿）和（＿②＿）；时代是（＿③＿），我们是（＿④＿），人民是（＿⑤＿）；让（＿⑥＿）是我们党做好一切工作的价值取向和根本标准；牢固树立和践行正确的（＿⑦＿）", "a": ["最高裁决者", "最终评判者", "出卷人", "答卷人", "阅卷人", "群众满意", "政绩观"], "e": "黨的工作做得好不好，由人民打分。「時代是出卷人，我們是答卷人，人民是閱卷人。」要以人民滿意不滿意作為檢驗工作的最終評判標準；讓群眾滿意是黨做好一切工作的價值取向和根本標準；要樹立和踐行正確的政績觀。", "id": "Q13-006", "l": 13, "ch": 4}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「時代是出卷人，我們是答卷人，人民是閱卷人」中，「时代」是：", "o": ["出卷人", "阅卷人", "答卷人", "监考人"], "a": 0, "e": "「时代」→「出卷人」。記法：考試比喻：「時代出題、黨答題、人民改卷」。", "id": "Q13-007", "l": 13, "ch": 4}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「时代」是出卷人。", "a": true, "e": "對。「时代」→「出卷人」。", "id": "Q13-008", "l": 13, "ch": 4}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「時代是出卷人，我們是答卷人，人民是閱卷人」中，「我们（党）」是：", "o": ["答卷人", "阅卷人", "出卷人", "监考人"], "a": 0, "e": "「我们（党）」→「答卷人」。記法：考試比喻：「時代出題、黨答題、人民改卷」。", "id": "Q13-009", "l": 13, "ch": 4}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「我们（党）」是阅卷人。", "a": false, "e": "錯。「我们（党）」應對應「答卷人」，「阅卷人」對應的是「人民」。", "id": "Q13-010", "l": 13, "ch": 4}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "「時代是出卷人，我們是答卷人，人民是閱卷人」中，「人民」是：", "o": ["阅卷人", "出卷人", "答卷人", "监考人"], "a": 0, "e": "「人民」→「阅卷人」。記法：考試比喻：「時代出題、黨答題、人民改卷」。", "id": "Q13-011", "l": 13, "ch": 4}, {"s": [8], "src": "", "card": "C13-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「人民」是阅卷人。", "a": true, "e": "對。「人民」→「阅卷人」。", "id": "Q13-012", "l": 13, "ch": 4}, {"k": "單", "s": [8], "q": "「時代是出卷人，我們是答卷人，人民是＿＿」。", "o": ["閱卷人", "出題人", "監考人", "答卷人"], "a": 0, "e": "人民是閱卷人——人民是黨的工作的最高裁決者和最終評判者。", "id": "Q13-013", "l": 13, "ch": 4}, {"k": "單", "s": [8], "q": "黨的工作的最高裁決者和最終評判者是：", "o": ["人民", "黨中央", "歷史", "國際社會"], "a": 0, "e": "知識點3標題。", "id": "Q13-014", "l": 13, "ch": 4}, {"k": "判", "s": [6], "q": "人民是我們黨的生命之根、執政之基、力量之源。", "a": true, "e": "對。講師原話。", "id": "Q13-015", "l": 13, "ch": 4}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師指出，檢驗工作的最終評判標準是：", "o": ["人民滿意不滿意", "經濟增長快不快", "上級認可不認可", "國際評價好不好"], "a": 0, "e": "原話：「以人民滿意不滿意作為檢驗工作的最終評判標準。」", "id": "Q13-016", "l": 13, "ch": 4}, {"k": "單", "s": [3], "q": "「讓人民過上好日子」是黨的：", "o": ["一貫的追求", "根本工作方法", "最大政治優勢", "根本政治立場"], "a": 0, "e": "投影片黃字：讓人民過上好日子是黨一貫的追求。", "id": "Q13-017", "l": 13, "ch": 4}, {"k": "多", "s": [7], "q": "尊重人民首創精神，就要：", "o": ["尊重實踐、尊重創造", "鼓勵創新、寬容失敗", "激發人民群眾的創新創造活力", "只依靠頂層設計而不需要基層探索"], "a": [0, 1, 2], "e": "原文要求「堅持頂層設計和基層探索相統一」，所以 D 錯。", "id": "Q13-018", "l": 13, "ch": 4}, {"k": "簡", "s": [7], "q": "簡答：依靠人民創造歷史偉業，為什麼必須尊重人民首創精神？應怎樣尊重？", "sum": "一句白話：人民是聰明和力量的來源，所以要尊重他們的試驗和創造，激發他們的創造力，並把他們的經驗變成政策。", "pts": ["始终把人民群众作为智慧和力量的源泉", "尊重实践、尊重创造，坚持顶层设计和基层探索相统一，鼓励创新、宽容失败", "激发人民群众的创新创造活力", "及时发现、总结、概括人民群众实践中形成的新鲜经验，使之上升为理论和政策"], "e": "講師：「這個其實是可以作為一個簡答題出來。」", "id": "Q13-019", "l": 13, "ch": 4}, {"s": [3], "src": "", "card": "C14-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜群眾路線是黨始終堅持的根本工作方法：\n群众路线是我们党始终坚持的（＿①＿）；一切为了群众，一切依靠群众，（＿②＿），把党的正确主张变为群众的自觉行动", "a": ["根本工作方法", "从群众中来，到群众中去"], "e": "群眾路線＝一切為了群眾、一切依靠群眾，從群眾中來、到群眾中去，把黨的正確主張變為群眾的自覺行動。它是黨始終堅持的「根本工作方法」（也是黨的生命線，見第05堂辨析）。", "id": "Q14-001", "l": 14, "ch": 4}, {"s": [3], "src": "", "card": "C14-01", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "默", "q": "默寫｜群眾路線是黨始終堅持的根本工作方法", "model": "群众路线是我们党始终坚持的根本工作方法；一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动", "pts": ["根本工作方法", "从群众中来，到群众中去"], "e": "記法：「為・靠・來・去」四字。", "id": "Q14-002", "l": 14, "ch": 4}, {"s": [3], "src": "", "card": "C14-02", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜毛澤東思想「三個活的靈魂」：\n①（＿①＿） ②（＿②＿） ③（＿③＿）", "a": ["实事求是", "群众路线", "独立自主"], "e": "投影片手寫串聯：毛澤東思想活的靈魂有三個——實事求是、群眾路線、獨立自主。", "id": "Q14-003", "l": 14, "ch": 4}, {"s": [3], "src": "", "card": "C14-02", "tag": ["選擇題考點"], "auto": 1, "k": "多", "q": "毛澤東思想「活的靈魂」包括：", "o": ["实事求是", "群众路线", "独立自主", "统一战线", "自我革命"], "a": [0, 1, 2], "e": "正確：实事求是；群众路线；独立自主。干擾項：统一战线；自我革命。", "id": "Q14-004", "l": 14, "ch": 4}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜貫徹群眾路線：知行合一；調查研究：\n知是（＿①＿）是（＿②＿），行是（＿③＿）是（＿④＿）；（＿⑤＿）是贯彻群众路线的有效途径", "a": ["基础", "前提", "重点", "关键", "调查研究"], "e": "貫徹群眾路線要知行合一：「知」是基礎、是前提；「行」是重點、是關鍵。調查研究是貫徹群眾路線的有效途徑。", "id": "Q14-005", "l": 14, "ch": 4}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "貫徹群眾路線要知行合一，其中「知」是：", "o": ["基础、前提", "重点、关键", "根本、目的"], "a": 0, "e": "「知」→「基础、前提」。記法：「知＝地基，行＝重點」。", "id": "Q14-006", "l": 14, "ch": 4}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "貫徹群眾路線，「知」是基础、前提。", "a": true, "e": "對。「知」→「基础、前提」。", "id": "Q14-007", "l": 14, "ch": 4}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "貫徹群眾路線要知行合一，其中「行」是：", "o": ["重点、关键", "基础、前提", "根本、目的"], "a": 0, "e": "「行」→「重点、关键」。記法：「知＝地基，行＝重點」。", "id": "Q14-008", "l": 14, "ch": 4}, {"s": [4], "src": "", "card": "C14-03", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "貫徹群眾路線，「行」是基础、前提。", "a": false, "e": "錯。「行」應對應「重点、关键」，「基础、前提」對應的是「知」。", "id": "Q14-009", "l": 14, "ch": 4}, {"s": [5, 7], "src": "", "card": "C14-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜把為人民造福的事情真正辦好辦實（三點）：\n（1）为人民造福，要落实到新时代中国特色社会主义的（＿①＿）之中；（2）要着力解决好人民群众（＿②＿）的利益问题；（3）要（＿③＿）", "a": ["各项事业、全部工作", "最关心最直接最现实", "一件事情接着一件事情办，一年接着一年干"], "e": "①造福人民要落實到各項事業、全部工作之中；②要着力解決人民最關心最直接最現實的利益問題；③要一件事情接着一件事情辦，一年接着一年幹。講師補充：要讓人民群眾在每一個司法案件中感受到公平正義；人民群眾是共產黨的安身立命之本。", "id": "Q14-010", "l": 14, "ch": 4}, {"s": [5, 7], "src": "", "card": "C14-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜把為人民造福的事情真正辦好辦實（三點）", "model": "（1）为人民造福，要落实到新时代中国特色社会主义的各项事业、全部工作之中；（2）要着力解决好人民群众最关心最直接最现实的利益问题；（3）要一件事情接着一件事情办，一年接着一年干", "pts": ["为人民造福，要落实到新时代中国特色社会主义的各项事业、全部工作之中", "要着力解决好人民群众最关心最直接最现实的利益问题", "要一件事情接着一件事情办，一年接着一年干"], "e": "記法：「全部落實・三個最・一件接一件」。", "id": "Q14-011", "l": 14, "ch": 4}, {"s": [8], "src": "", "card": "C14-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜共同富裕是關係黨的執政基礎的重大政治問題：\n实现共同富裕不仅是（＿①＿），而且是关系党的（＿②＿）的（＿③＿）", "a": ["经济问题", "执政基础", "重大政治问题"], "e": "講師：「首先要背過這個小標題」——實現共同富裕不僅是經濟問題，而且是關係黨的執政基礎的重大政治問題。", "id": "Q14-012", "l": 14, "ch": 4}, {"s": [8], "src": "", "card": "C14-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜共同富裕是關係黨的執政基礎的重大政治問題", "model": "实现共同富裕不仅是经济问题，而且是关系党的执政基础的重大政治问题", "pts": ["经济问题", "执政基础", "重大政治问题"], "e": "記法：「不只經濟，更是政治」。", "id": "Q14-013", "l": 14, "ch": 4}, {"s": [9], "src": "", "card": "C14-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜從全局角度把握共同富裕（四個「不是」）：\n共同富裕是（＿①＿）共同富裕，是人民群众（＿②＿）都富裕，不是（＿③＿）的富裕，也不是整齐划一的（＿④＿），不是所有人都（＿⑤＿），也不是所有地区同时达到一个富裕水准", "a": ["全体人民", "物质生活和精神生活", "少数人", "平均主义", "同时富裕"], "e": "共同富裕是全體人民、物質生活和精神生活都富裕；不是少數人富裕，不是整齊劃一的平均主義，不是所有人同時富裕，也不是所有地區同時達到一個富裕水準。允許一部分人先富起來，同時積極推動先富帶後富。是一個長期的歷史過程。", "id": "Q14-014", "l": 14, "ch": 4}, {"s": [9], "src": "", "card": "C14-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "默", "q": "默寫｜從全局角度把握共同富裕（四個「不是」）", "model": "共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义，不是所有人都同时富裕，也不是所有地区同时达到一个富裕水准", "pts": ["是全体人民共同富裕", "是物质生活和精神生活都富裕", "不是少数人的富裕", "不是整齐划一的平均主义", "不是所有人都同时富裕，也不是所有地区同时达到一个富裕水准"], "e": "記法：「是：全體＋物質精神」；「不是：少數、平均、同時（人）、同時（地區）」。", "id": "Q14-015", "l": 14, "ch": 4}, {"s": [10, 11], "src": "", "card": "C14-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜推進共同富裕的原則與思路；橄欖型分配結構：\n（＿①＿）；（＿②＿）；初次分配、再分配、（＿③＿）协调配套；形成（＿④＿）的（＿⑤＿）分配结构", "a": ["推进共同富裕的原则", "推进共同富裕的思路", "三次分配", "中间大两头小", "橄榄型"], "e": "扎實推進共同富裕，必須堅持正確的原則和科學的思路。講師講到要構建初次分配、再分配、三次分配協調配套的基礎性制度安排，形成「中間大、兩頭小」的橄欖型分配結構（中等收入的人最多）。", "id": "Q14-016", "l": 14, "ch": 4}, {"k": "單", "s": [3], "q": "黨始終堅持的根本工作方法是：", "o": ["群眾路線", "實事求是", "調查研究", "民主集中制"], "a": 0, "e": "群眾路線是我們黨始終堅持的根本工作方法。", "id": "Q14-017", "l": 14, "ch": 4}, {"k": "單", "s": [4], "q": "貫徹群眾路線的有效途徑是：", "o": ["調查研究", "批評與自我批評", "民主集中制", "依法治國"], "a": 0, "e": "講師：「調查研究是貫徹群眾路線的有效途徑。」", "id": "Q14-018", "l": 14, "ch": 4}, {"k": "判", "s": [9], "q": "共同富裕就是所有人同時富裕、所有地區同時達到一個富裕水準。", "a": false, "e": "錯。原文明確：不是所有人都同時富裕，也不是所有地區同時達到一個富裕水準。", "id": "Q14-019", "l": 14, "ch": 4}, {"k": "判", "s": [9], "q": "共同富裕是人民群眾物質生活和精神生活都富裕。", "a": true, "e": "對。原文。", "id": "Q14-020", "l": 14, "ch": 4}, {"k": "單", "s": [11], "q": "講師說推進共同富裕要形成「中間大、兩頭小」的：", "o": ["橄欖型分配結構", "金字塔型分配結構", "啞鈴型分配結構", "平均型分配結構"], "a": 0, "e": "中間大兩頭小＝橄欖型。", "id": "Q14-021", "l": 14, "ch": 4}, {"k": "單", "s": [8], "q": "實現共同富裕不僅是經濟問題，而且是關係黨的＿＿的重大政治問題。", "o": ["執政基礎", "生命線", "根本宗旨", "長期執政"], "a": 0, "e": "講師：首先要背過這個小標題。", "id": "Q14-022", "l": 14, "ch": 4}, {"k": "多", "s": [9], "q": "根據投影片，以下哪些「不是」共同富裕？", "o": ["少數人的富裕", "整齊劃一的平均主義", "所有人都同時富裕", "全體人民共同富裕"], "a": [0, 1, 2], "e": "共同富裕「是」全體人民共同富裕；不是少數人富裕、不是平均主義、不是同時富裕。", "id": "Q14-023", "l": 14, "ch": 4}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，人民群眾是共產黨的：", "o": ["安身立命之本", "精神之魂", "最大法寶", "行動指南"], "a": 0, "e": "原話：「人民群眾是什麼？是共產黨的安身立命之本。」", "id": "Q14-024", "l": 14, "ch": 4}, {"s": [4], "src": "", "card": "C15-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜改革開放是決定當代中國命運的關鍵一招：\n改革开放是决定当代中国命运的（＿①＿）", "a": ["关键一招"], "e": "節標題本身就是選擇題考點：改革開放是決定當代中國命運的「關鍵一招」（像下棋最關鍵的一步）。", "id": "Q15-001", "l": 15, "ch": 5}, {"s": [5], "src": "", "card": "C15-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜改革開放是重要法寶、必由之路；「四個只有」：\n改革开放是我们前进的（＿①＿）；改革开放是坚持和发展中国特色社会主义的（＿②＿）；只有社会主义才能（＿③＿），只有改革开放才能（＿④＿）", "a": ["重要法宝", "必由之路", "救中国", "发展中国、发展社会主义、发展马克思主义"], "e": "改革開放是黨和人民前進的重要法寶，是堅持和發展中國特色社會主義的必由之路。講師：只有社會主義才能救中國，只有改革開放才能發展中國、發展社會主義、發展馬克思主義。", "id": "Q15-002", "l": 15, "ch": 5}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：十一屆三中全會 vs 十八屆三中全會：\n（＿①＿）——提出改革开放（1978）；（＿②＿）——全面深化改革", "a": ["十一届三中全会", "十八届三中全会"], "e": "兩個「三中全會」別混：1978年十一屆三中全會＝開啟（正式提出）改革開放；十八屆三中全會＝開啟「全面深化」改革。講師：「兩個選擇題考點，注意。」", "id": "Q15-003", "l": 15, "ch": 5}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「改革开放的正式提出（1978）」對應的會議是：", "o": ["十一届三中全会", "十八届三中全会", "十八届四中全会", "十九届六中全会"], "a": 0, "e": "「改革开放的正式提出（1978）」→「十一届三中全会」。記法：「11開始、18全面」：數字小的是開頭。", "id": "Q15-004", "l": 15, "ch": 5}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「改革开放的正式提出（1978）」對應十一届三中全会。", "a": true, "e": "對。「改革开放的正式提出（1978）」→「十一届三中全会」。", "id": "Q15-005", "l": 15, "ch": 5}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「全面深化改革的开启」對應的會議是：", "o": ["十八届三中全会", "十一届三中全会", "十八届四中全会", "十九届六中全会"], "a": 0, "e": "「全面深化改革的开启」→「十八届三中全会」。記法：「11開始、18全面」：數字小的是開頭。", "id": "Q15-006", "l": 15, "ch": 5}, {"s": [5, 6], "src": "", "card": "C15-03", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「全面深化改革的开启」對應十一届三中全会。", "a": false, "e": "錯。「全面深化改革的开启」應對應「十八届三中全会」，「十一届三中全会」對應的是「改革开放的正式提出（1978）」。", "id": "Q15-007", "l": 15, "ch": 5}, {"s": [6], "src": "", "card": "C15-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜改革開放是重要法寶（三點）：\n（1）改革开放是坚持和发展中国特色社会主义的（＿①＿）；（2）全面深化改革开放是完成新时代目标任务的（＿②＿）；（3）中国要前进，就要（＿③＿）", "a": ["必由之路", "必然要求", "全面深化改革开放"], "e": "知識點1三點：①改革開放是堅持和發展中特的必由之路；②全面深化改革開放是完成新時代目標任務的必然要求（講師：標題必須記住）；③中國要前進，就要全面深化改革開放。", "id": "Q15-008", "l": 15, "ch": 5}, {"s": [6], "src": "", "card": "C15-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜改革開放是重要法寶（三點）", "model": "（1）改革开放是坚持和发展中国特色社会主义的必由之路；（2）全面深化改革开放是完成新时代目标任务的必然要求；（3）中国要前进，就要全面深化改革开放", "pts": ["改革开放是坚持和发展中国特色社会主义的必由之路", "全面深化改革开放是完成新时代目标任务的必然要求", "中国要前进，就要全面深化改革开放"], "e": "記法：「必由之路・必然要求・要前進」。", "id": "Q15-009", "l": 15, "ch": 5}, {"s": [7, 8, 9, 10], "src": "", "card": "C15-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新時代全面深化改革開放是一場深刻革命：\n（1）全面深化改革开放是（＿①＿）的变革；（2）着力解决（＿②＿）、应对（＿③＿），把全面深化改革开放引向深入；（3）是在多年改革开放基础上的深化，是一场（＿④＿）的（＿⑤＿）", "a": ["涉险滩、闯难关", "新矛盾", "新挑战", "全面、系统、整体", "制度创新"], "e": "就其艱鉅性、複雜性和系統性來說，新時代全面深化改革開放是一場深刻的革命。三點：①是涉險灘、闖難關的變革；②着力解決新矛盾、應對新挑戰，引向深入；③是在多年改革開放基礎上的深化，是一場全面、系統、整體的制度創新。", "id": "Q15-010", "l": 15, "ch": 5}, {"s": [7, 8, 9, 10], "src": "", "card": "C15-05", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜新時代全面深化改革開放是一場深刻革命", "model": "（1）全面深化改革开放是涉险滩、闯难关的变革；（2）着力解决新矛盾、应对新挑战，把全面深化改革开放引向深入；（3）是在多年改革开放基础上的深化，是一场全面、系统、整体的制度创新", "pts": ["全面深化改革开放是涉险滩、闯难关的变革", "着力解决新矛盾、应对新挑战，把全面深化改革开放引向深入", "是在多年改革开放基础上的深化，是一场全面、系统、整体的制度创新"], "e": "記法：「險灘難關・新矛盾新挑戰・全面系統整體的制度創新」。", "id": "Q15-011", "l": 15, "ch": 5}, {"s": [11], "src": "", "card": "C15-06", "tag": ["必背", "論述題考點"], "auto": 1, "k": "填", "q": "填空｜堅持全面深化改革開放的正確方向（只答標黃）：\n（1）必须坚持和改善（＿①＿）、坚持和完善（＿②＿）；（2）必须坚持（＿③＿），促进社会公平正义、增进人民福祉；（3）必须有利于进一步（＿④＿）、进一步（＿⑤＿）、进一步（＿⑥＿）", "a": ["党的全面领导", "中国特色社会主义制度", "以人民为中心", "解放思想", "解放和发展社会生产力", "解放和增强社会活力"], "e": "方向有三：①堅持和改善黨的全面領導、堅持和完善中特制度；②堅持以人民為中心，促進公平正義、增進人民福祉；③有利於「三個進一步解放」。講師：大題考點，只答標黃部分。", "id": "Q15-012", "l": 15, "ch": 5}, {"s": [11], "src": "", "card": "C15-06", "tag": ["必背", "論述題考點"], "auto": 1, "k": "默", "q": "默寫｜堅持全面深化改革開放的正確方向（只答標黃）", "model": "（1）必须坚持和改善党的全面领导、坚持和完善中国特色社会主义制度；（2）必须坚持以人民为中心，促进社会公平正义、增进人民福祉；（3）必须有利于进一步解放思想、进一步解放和发展社会生产力、进一步解放和增强社会活力", "pts": ["必须坚持和改善党的全面领导、坚持和完善中国特色社会主义制度", "必须坚持以人民为中心，促进社会公平正义、增进人民福祉", "必须有利于进一步解放思想、进一步解放和发展社会生产力、进一步解放和增强社会活力"], "e": "記法：「黨和制度・人民・三個解放（思想・生產力・活力）」。", "id": "Q15-013", "l": 15, "ch": 5}, {"s": [11], "src": "逐字稿", "card": "C15-07", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜改革是社會主義制度的自我完善和發展：\n改革是社会主义制度的（＿①＿），而不是（＿②＿）", "a": ["自我完善和发展", "改弦易张"], "e": "講師：問「改革是什麼」的選擇題，就找這句——改革是社會主義制度的自我完善和發展，而不是改弦易張（不是換掉社會主義制度）。", "id": "Q15-014", "l": 15, "ch": 5}, {"k": "單", "s": [5], "q": "改革開放是在哪一次會議上正式提出的？", "o": ["十一屆三中全會", "十八屆三中全會", "十二大", "十四大"], "a": 0, "e": "講師：「問你改革開放是在哪一次會議中正式提出來的，叫做十一屆三中全會。」", "id": "Q15-015", "l": 15, "ch": 5}, {"k": "單", "s": [6], "q": "開啟全面深化改革的會議是：", "o": ["十八屆三中全會", "十一屆三中全會", "十八屆四中全會", "十九屆六中全會"], "a": 0, "e": "十八屆三中全會＝全面深化改革；十八屆四中全會＝全面依法治國。", "id": "Q15-016", "l": 15, "ch": 5}, {"k": "單", "s": [4], "q": "決定當代中國命運的關鍵一招是：", "o": ["改革開放", "全面從嚴治黨", "依法治國", "科技創新"], "a": 0, "e": "節標題：改革開放是決定當代中國命運的關鍵一招。", "id": "Q15-017", "l": 15, "ch": 5}, {"k": "判", "s": [11], "q": "改革是對社會主義制度的改弦易張。", "a": false, "e": "錯。改革是社會主義制度的自我完善和發展，而不是改弦易張。", "id": "Q15-018", "l": 15, "ch": 5}, {"k": "單", "s": [10], "q": "全面深化改革開放是在多年改革開放基礎上的深化，是一場全面、系統、整體的：", "o": ["制度創新", "社會革命", "理論創新", "經濟轉型"], "a": 0, "e": "原文：是一場全面、系統、整體的制度創新。", "id": "Q15-019", "l": 15, "ch": 5}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，新時代全面深化改革開放「就其艱鉅性、複雜性和系統性來說」，是一場：", "o": ["深刻的革命", "偉大的鬥爭", "全新的探索", "歷史的轉折"], "a": 0, "e": "知識點2標題：新時代全面深化改革開放是一場深刻革命。", "id": "Q15-020", "l": 15, "ch": 5}, {"k": "填", "s": [11], "q": "必須有利於進一步（＿①＿）、進一步解放和發展（＿②＿）、進一步解放和增強（＿③＿）。", "a": ["解放思想", "社会生产力", "社会活力"], "e": "三個「進一步解放」。", "id": "Q15-021", "l": 15, "ch": 5}, {"k": "論", "s": [11], "q": "論述：怎樣堅持全面深化改革開放的正確方向？", "sum": "一句白話：改革要跟着黨、守住中特制度，為人民，並讓思想、生產力和社會活力都更解放。", "pts": ["必须坚持和改善党的全面领导、坚持和完善中国特色社会主义制度", "必须坚持以人民为中心，促进社会公平正义、增进人民福祉", "必须有利于进一步解放思想、进一步解放和发展社会生产力、进一步解放和增强社会活力", "改革是社会主义制度的自我完善和发展，而不是改弦易张"], "e": "講師：大題考點，「只打標黃部分」。", "id": "Q15-022", "l": 15, "ch": 5}, {"s": [3], "src": "", "card": "C16-01", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜全面深化改革的總目標（兩句都要講）：\n（＿①＿）、（＿②＿）", "a": ["完善和发展中国特色社会主义制度", "推进国家治理体系和治理能力现代化"], "e": "全面深化改革要達到什麼？兩句話：完善和發展中國特色社會主義制度；推進國家治理體系和治理能力現代化。講師：「兩句話必須要說才是完整的」，選擇、多選都考。", "id": "Q16-001", "l": 16, "ch": 5}, {"s": [3], "src": "", "card": "C16-01", "tag": ["必背", "選擇題考點", "多選題考點"], "auto": 1, "k": "默", "q": "默寫｜全面深化改革的總目標（兩句都要講）", "model": "完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化", "pts": ["完善和发展中国特色社会主义制度", "推进国家治理体系和治理能力现代化"], "e": "記法：「前句管方向，後句管指向」：制度（根本方向）＋治理（鮮明指向和時代要求）。", "id": "Q16-002", "l": 16, "ch": 5}, {"s": [3, 4], "src": "逐字稿", "card": "C16-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜總目標兩句話的含義：\n完善和发展中国特色社会主义制度，规定了改革的（＿①＿）；推进国家治理体系和治理能力现代化，明确了改革的（＿②＿）", "a": ["根本方向", "鲜明指向和时代要求"], "e": "第一句「完善和發展中國特色社會主義制度」規定了改革的根本方向；第二句「推進國家治理體系和治理能力現代化」明確了改革的鮮明指向和時代要求。講師：簡述總目標，一、二、三、四都必須答。", "id": "Q16-003", "l": 16, "ch": 5}, {"s": [3, 4], "src": "逐字稿", "card": "C16-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "全面深化改革總目標中，「完善和发展中国特色社会主义制度」：", "o": ["规定了改革的根本方向", "明确了改革的鲜明指向和时代要求", "是改革的根本动力"], "a": 0, "e": "「完善和发展中国特色社会主义制度」→「规定了改革的根本方向」。記法：「制度→方向；治理→指向」。", "id": "Q16-004", "l": 16, "ch": 5}, {"s": [3, 4], "src": "逐字稿", "card": "C16-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "「完善和发展中国特色社会主义制度」规定了改革的根本方向。", "a": true, "e": "對。「完善和发展中国特色社会主义制度」→「规定了改革的根本方向」。", "id": "Q16-005", "l": 16, "ch": 5}, {"s": [3, 4], "src": "逐字稿", "card": "C16-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "單", "q": "全面深化改革總目標中，「推进国家治理体系和治理能力现代化」：", "o": ["明确了改革的鲜明指向和时代要求", "规定了改革的根本方向", "是改革的根本动力"], "a": 0, "e": "「推进国家治理体系和治理能力现代化」→「明确了改革的鲜明指向和时代要求」。記法：「制度→方向；治理→指向」。", "id": "Q16-006", "l": 16, "ch": 5}, {"s": [3, 4], "src": "逐字稿", "card": "C16-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "判", "q": "「推进国家治理体系和治理能力现代化」规定了改革的根本方向。", "a": false, "e": "錯。「推进国家治理体系和治理能力现代化」應對應「明确了改革的鲜明指向和时代要求」，「规定了改革的根本方向」對應的是「完善和发展中国特色社会主义制度」。", "id": "Q16-007", "l": 16, "ch": 5}, {"s": [5, 6], "src": "", "card": "C16-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜「六個緊緊圍繞」路線圖：\n经济——市场在资源配置中起（＿①＿）、更好发挥政府作用；政治——（＿②＿）有机统一；文化——（＿③＿）；社会——民生；生态——美丽中国；党的建设", "a": ["决定性作用", "党的领导、人民当家作主、依法治国", "社会主义核心价值体系"], "e": "六個緊緊圍繞：前五個對應「五位一體」（經濟、政治、文化、社會、生態），第六個是黨的建設（「永遠都用來兜底」）。經濟：使市場在資源配置中起決定性作用、更好發揮政府作用；政治：黨的領導、人民當家作主、依法治國有機統一；文化：社會主義核心價值體系；社會：民生；生態：美麗中國；最後：黨的建設。", "id": "Q16-008", "l": 16, "ch": 5}, {"s": [7], "src": "", "card": "C16-04", "tag": ["必背"], "auto": 1, "k": "填", "q": "填空｜國家治理體系與治理能力的關係（官方表述要背）：\n国家治理体系和治理能力是一个（＿①＿），（＿②＿），有了好的国家治理体系才能提高国家治理能力，提高国家治理能力才能充分发挥国家治理体系的（＿③＿）", "a": ["有机整体", "相辅相成", "效能"], "e": "治理體系＝管國家的一整套制度；治理能力＝運用制度管理各方面事務的能力。兩者是一個有機整體、相輔相成：有好的體系才能提高能力，提高能力才能發揮體系的效能。例子：好的防疫制度（體系）要靠執行得好（能力）才有效。", "id": "Q16-009", "l": 16, "ch": 5}, {"s": [7], "src": "", "card": "C16-04", "tag": ["必背"], "auto": 1, "k": "默", "q": "默寫｜國家治理體系與治理能力的關係（官方表述要背）", "model": "国家治理体系和治理能力是一个有机整体，相辅相成，有了好的国家治理体系才能提高国家治理能力，提高国家治理能力才能充分发挥国家治理体系的效能", "pts": ["有机整体", "相辅相成", "效能"], "e": "記法：「體系是硬件，能力是軟件」；「有機整體・相輔相成・互相成就」。", "id": "Q16-010", "l": 16, "ch": 5}, {"s": [8, 10, 11], "src": "", "card": "C16-05", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜推進國家治理體系和治理能力現代化（三個小標題）：\n（1）坚定（＿①＿）；（2）发挥（＿②＿）；（3）把中国特色社会主义制度优势转化为（＿③＿）", "a": ["中国特色社会主义制度自信", "中国特色社会主义制度优势", "国家治理效能"], "e": "三點：堅定中特制度自信；發揮中特制度優勢；把中特制度優勢轉化為國家治理效能。講師：「一定要把這個小標題背過。」", "id": "Q16-011", "l": 16, "ch": 5}, {"s": [8, 10, 11], "src": "", "card": "C16-05", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜推進國家治理體系和治理能力現代化（三個小標題）", "model": "（1）坚定中国特色社会主义制度自信；（2）发挥中国特色社会主义制度优势；（3）把中国特色社会主义制度优势转化为国家治理效能", 大改革于法有据"], "e": "記法：「系統・頂層＋石頭・改發穩・膽大步穩・於法有據」。", "id": "Q16-017", "l": 16, "ch": 5}, {"s": [15, 16, 18, 19], "src": "", "card": "C16-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "全面深化改革開放要堅持的正確方法論包括：", "o": ["增强全面深化改革的系统性、整体性、协同性", "加强顶层设计和摸着石头过河相结合", "统筹改革发展稳定", "胆子要大，步子要稳", "只靠顶层设计"], "a": [0, 1, 2, 3], "e": "正確：增强全面深化改革的系统性、整体性、协同性；加强顶层设计和摸着石头过河相结合；统筹改革发展稳定；胆子要大，步子要稳。干擾項：只靠顶层设计。", "id": "Q16-018", "l": 16, "ch": 5}, {"s": [15, 16, 18, 19], "src": "", "card": "C16-07", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "全面深化改革開放要堅持的正確方法論包括：", "o": ["统筹改革发展稳定", "胆子要大，步子要稳", "增强全面深化改革的系统性、整体性、协同性", "加强顶层设计和摸着石头过河相结合", "只靠顶层设计"], "a": [0, 1, 2, 3], "e": "正確：统筹改革发展稳定；胆子要大，步子要稳；增强全面深化改革的系统性、整体性、协同性；加强顶层设计和摸着石头过河相结合。干擾項：只靠顶层设计。", "id": "Q16-019", "l": 16, "ch": 5}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜方法論的重要表述（摸着石頭過河、改革發展穩定、改革與法治）：\n摸着石头过河是富有（＿①＿）、符合（＿②＿）的改革方法；改革是（＿③＿），发展是（＿④＿），稳定是（＿⑤＿）；先立后破；改革和法治如（＿⑥＿）", "a": ["中国特色", "中国国情", "强大动力", "关键", "前提", "鸟之两翼、车之两轮"], "e": "摸着石頭過河是富有中國特色、符合中國國情的改革方法。改革是經濟社會發展的強大動力，發展是解決一切經濟社會問題的關鍵，穩定是改革發展的前提。重大改革要於法有據，「先立後破」；改革和法治如鳥之兩翼、車之兩輪。", "id": "Q16-020", "l": 16, "ch": 5}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "統籌改革發展穩定：「改革」是：", "o": ["经济社会发展的强大动力", "改革发展的前提", "解决一切经济社会问题的关键"], "a": 0, "e": "「改革」→「经济社会发展的强大动力」。記法：「改革＝動力、發展＝關鍵、穩定＝前提」（動・關・前）。", "id": "Q16-021", "l": 16, "ch": 5}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "統籌改革發展穩定：「改革」是经济社会发展的强大动力。", "a": true, "e": "對。「改革」→「经济社会发展的强大动力」。", "id": "Q16-022", "l": 16, "ch": 5}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "統籌改革發展穩定：「发展」是：", "o": ["解决一切经济社会问题的关键", "经济社会发展的强大动力", "改革发展的前提"], "a": 0, "e": "「发展」→「解决一切经济社会问题的关键」。記法：「改革＝動力、發展＝關鍵、穩定＝前提」（動・關・前）。", "id": "Q16-023", "l": 16, "ch": 5}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "統籌改革發展穩定：「发展」是改革发展的前提。", "a": false, "e": "錯。「发展」應對應「解决一切经济社会问题的关键」，「改革发展的前提」對應的是「稳定」。", "id": "Q16-024", "l": 16, "ch": 5}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "統籌改革發展穩定：「稳定」是：", "o": ["改革发展的前提", "解决一切经济社会问题的关键", "经济社会发展的强大动力"], "a": 0, "e": "「稳定」→「改革发展的前提」。記法：「改革＝動力、發展＝關鍵、穩定＝前提」（動・關・前）。", "id": "Q16-025", "l": 16, "ch": 5}, {"s": [16, 18, 19], "src": "逐字稿", "card": "C16-08", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "統籌改革發展穩定：「稳定」是改革发展的前提。", "a": true, "e": "對。「稳定」→「改革发展的前提」。", "id": "Q16-026", "l": 16, "ch": 5}, {"k": "單", "s": [3], "q": "全面深化改革的總目標是：", "o": ["完善和發展中國特色社會主義制度、推進國家治理體系和治理能力現代化", "全面建成社會主義現代化強國", "建設中國特色社會主義法治體系、建設社會主義法治國家", "解放和發展社會生產力"], "a": 0, "e": "兩句話都要有才完整。C 是全面依法治國總目標。", "id": "Q16-027", "l": 16, "ch": 5}, {"k": "單", "s": [5], "q": "「六個緊緊圍繞」中，經濟體制改革要使市場在資源配置中起：", "o": ["決定性作用", "基礎性作用", "主導作用", "輔助作用"], "a": 0, "e": "講師：「選擇題，市場在資源配置中是什麼作用？決定性作用。」", "id": "Q16-028", "l": 16, "ch": 5}, {"k": "判", "s": [7], "q": "有了好的國家治理體系才能提高國家治理能力，提高國家治理能力才能充分發揮國家治理體系的效能。", "a": true, "e": "對。兩者是有機整體、相輔相成。", "id": "Q16-029", "l": 16, "ch": 5}, {"k": "判", "s": [19], "q": "重大改革要「先破後立」。", "a": false, "e": "錯。講師：重大改革要於法有據，「先立後破」，有序進行。", "id": "Q16-030", "l": 16, "ch": 5}, {"k": "單", "s": [16], "q": "「富有中國特色、符合中國國情的改革方法」是：", "o": ["摸着石頭過河", "頂層設計", "一刀切", "休克療法"], "a": 0, "e": "講師原話。", "id": "Q16-031", "l": 16, "ch": 5}, {"k": "多", "s": [3], "q": "全面深化改革的總目標包括：", "o": ["完善和發展中國特色社會主義制度", "推進國家治理體系和治理能力現代化", "全面建成小康社會", "實現共同富裕"], "a": [0, 1], "e": "兩句話必須都說。", "id": "Q16-032", "l": 16, "ch": 5}, {"k": "單", "s": [5, 6], "q": "「六個緊緊圍繞」中最後一個（兜底的）是：", "o": ["黨的建設制度改革", "生態文明體制改革", "社會體制改革", "文化體制改革"], "a": 0, "e": "講師：前五個是五位一體，第六個黨的建設「永遠都用來兜底」。", "id": "Q16-033", "l": 16, "ch": 5}, {"k": "填", "s": [7], "q": "國家治理體系和治理能力是一個（＿①＿），（＿②＿），有了好的國家治理體系才能提高國家治理能力，提高國家治理能力才能充分發揮國家治理體系的（＿③＿）。", "a": ["有机整体", "相辅相成", "效能"], "e": "講師：官方表述「要背過」。", "id": "Q16-034", "l": 16, "ch": 5}, {"k": "簡", "s": [3, 4], "q": "簡述全面深化改革的總目標。", "sum": "一句白話：改革要把中國特色社會主義制度弄得更好，並讓國家的管理體系和能力現代化。", "pts": ["完善和发展中国特色社会主义制度", "推进国家治理体系和治理能力现代化（两句话合起来才完整）", "前一句规定了改革的根本方向", "后一句明确了改革的鲜明指向和时代要求"], "e": "講師：簡述總目標「一二三四都是必須打的……這是一套完整的答題思路」。投影片（3）意義段請按課本補充。", "id": "Q16-035", "l": 16, "ch": 5}, {"k": "論", "s": [12, 13, 14], "q": "論述：我國國家制度和國家治理體系具有哪些顯著優勢？", "sum": "一句白話：我國制度的長處，從黨的領導、人民、法治、全國一盤棋，到經濟、文化、軍隊、一國兩制、對外開放等十三方面。", "pts": ["集中统一领导", "人民当家作主", "全面依法治国", "全国一盘棋", "各民族一律平等", "公有制为主体、多种所有制经济共同发展", "共同的理想信念、价值理念、道德观念", "以人民为中心的发展思想", "改革创新、与时俱进", "德才兼备、选贤任能", "党指挥枪", "“一国两制”", "独立自主和对外开放相统一"], "e": "講師：「如果說他考到一個論述題……那就是要把這十三個打出來。」", "id": "Q16-036", "l": 16, "ch": 5}, {"s": [3], "src": "", "card": "C17-01", "tag": ["必背", "論述題考點"], "auto": 1, "k": "填", "q": "填空｜改革開放永無止境（三個原因）：\n改革开放永无止境是（＿①＿）的深刻反映；是总结（＿②＿）得出的重要结论；是推进（＿③＿）的必然要求", "a": ["社会基本矛盾运动规律", "世界社会主义实践经验", "党和人民事业发展"], "e": "為什麼改革開放永遠不會停？①它是社會基本矛盾運動規律的深刻反映（社會總在變，矛盾總在出現）；②是總結世界社會主義實踐經驗得出的重要結論；③是推進黨和人民事業發展的必然要求。講師：大題考點。", "id": "Q17-001", "l": 17, "ch": 5}, {"s": [3], "src": "", "card": "C17-01", "tag": ["必背", "論述題考點"], "auto": 1, "k": "默", "q": "默寫｜改革開放永無止境（三個原因）", "model": "改革开放永无止境是社会基本矛盾运动规律的深刻反映；是总结世界社会主义实践经验得出的重要结论；是推进党和人民事业发展的必然要求", "pts": ["社会基本矛盾运动规律的深刻反映", "总结世界社会主义实践经验得出的重要结论", "推进党和人民事业发展的必然要求"], "e": "記法：「規律・經驗・要求」：理論上（規律）、歷史上（經驗）、現實上（要求）。", "id": "Q17-002", "l": 17, "ch": 5}, {"s": [4, 5], "src": "", "card": "C17-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜堅定不移把全面深化改革引向深入（七點）：\n聚焦（＿①＿）；深化（＿②＿）改革；深化（＿③＿）改革；深化（＿④＿）改革；深化（＿⑤＿）改革；深化（＿⑥＿）改革；健全加强党的全面领导、全面从严治党制度体系", "a": ["全面建设社会主义现代化国家中的重大问题", "社会主义市场经济体制", "人民当家作主制度体系", "文化体制", "社会体制", "生态文明体制"], "e": "講師的背誦技巧：「問題導向＋五位一體＋黨建」。①聚焦全面建設社會主義現代化國家中的重大問題；②經濟：深化社會主義市場經濟體制改革；③政治：深化人民當家作主制度體系改革；④文化體制改革；⑤社會體制改革；⑥生態文明體制改革；⑦健全加強黨的全面領導、全面從嚴治黨制度體系。", "id": "Q17-003", "l": 17, "ch": 5}, {"s": [4, 5], "src": "", "card": "C17-02", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜堅定不移把全面深化改革引向深入（七點）", "model": "聚焦全面建设社会主义现代化国家中的重大问题；深化社会主义市场经济体制改革；深化人民当家作主制度体系改革；深化文化体制改革；深化社会体制改革；深化生态文明体制改革；健全加强党的全面领导、全面从严治党制度体系", "pts": ["聚焦全面建设社会主义现代化国家中的重大问题", "深化社会主义市场经济体制改革", "深化人民当家作主制度体系改革", "深化文化体制改革", "深化社会体制改革", "深化生态文明体制改革", "健全加强党的全面领导、全面从严治党制度体系"], "e": "記法：「1問題＋5位一體（經政文社生）＋1黨建」＝7。", "id": "Q17-004", "l": 17, "ch": 5}, {"s": [6], "src": "", "card": "C17-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜開放也是改革：\n（＿①＿）；改革不停顿，开放不止步；中国开放的大门只会（＿②＿）", "a": ["开放也是改革", "越开越大"], "e": "講師：「注意，開放也是一種改革。」改革不停頓，開放不止步；中國開放的大門只會越開越大，永遠不會關上。開放帶來進步，封閉必然落後。", "id": "Q17-005", "l": 17, "ch": 5}, {"s": [7, 9, 11], "src": "", "card": "C17-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜堅定不移擴大高水平對外開放：\n（2）坚定不移扩大对外开放；（3）继续扩大对外开放，构建更高水平（＿①＿）；（4）中国的发展离不开世界，世界的繁荣也需要中国", "a": ["开放型经济新体制"], "e": "要堅定不移擴大對外開放；繼續擴大對外開放，構建更高水平開放型經濟新體制。講師講到經濟全球化遭遇逆流（單邊主義、保護主義、孤立主義），要推動貿易和投資自由化便利化、共建「一帶一路」。最後一句「中國的發展離不開世界，世界的繁榮也需要中國」——講師說這裏不需要背。", "id": "Q17-006", "l": 17, "ch": 5}, {"k": "單", "s": [3], "q": "改革開放永無止境，是＿＿的深刻反映。", "o": ["社會基本矛盾運動規律", "社會主要矛盾變化", "經濟全球化趨勢", "科技革命規律"], "a": 0, "e": "第一個原因：社會基本矛盾運動規律的深刻反映。", "id": "Q17-007", "l": 17, "ch": 5}, {"k": "判", "s": [6], "q": "對外開放與改革是兩回事，開放不屬於改革。", "a": false, "e": "錯。講師：「開放也是一種改革。」", "id": "Q17-008", "l": 17, "ch": 5}, {"k": "多", "s": [3], "q": "改革開放永無止境的原因有：", "o": ["是社會基本矛盾運動規律的深刻反映", "是總結世界社會主義實踐經驗得出的重要結論", "是推進黨和人民事業發展的必然要求", "是應對外部壓力的權宜之計"], "a": [0, 1, 2], "e": "三個原因；D 是錯誤說法。", "id": "Q17-009", "l": 17, "ch": 5}, {"k": "單", "s": [4, 5], "q": "講師把「堅定不移把全面深化改革引向深入」的七點總結為一種背誦技巧，即：", "o": ["問題導向＋五位一體＋黨建兜底", "四個全面＋兩個結合", "三個代表＋科學發展觀", "十四個堅持依次背"], "a": 0, "e": "第一點聚焦重大問題，中間五點是經濟、政治、文化、社會、生態，最後是黨的建設。", "id": "Q17-010", "l": 17, "ch": 5}, {"k": "判", "s": [0], "src": "逐字稿", "q": "講師說：「開放給我們帶來進步，封閉必然會給我們帶來落後。」", "a": true, "e": "對。講師原話。", "id": "Q17-011", "l": 17, "ch": 5}, {"k": "填", "s": [9], "q": "繼續擴大對外開放，構建更高水平（＿①＿）。", "a": ["开放型经济新体制"], "e": "黃字小標。", "id": "Q17-012", "l": 17, "ch": 5}, {"k": "論", "s": [3], "q": "論述：為什麼說改革開放永無止境？", "sum": "一句白話：社會一直在變、世界社會主義的經驗告訴我們要變、黨和人民的事業也要求一直變，所以改革開放不會停。", "pts": ["改革开放永无止境是社会基本矛盾运动规律的深刻反映", "改革开放永无止境是总结世界社会主义实践经验得出的重要结论", "改革开放永无止境是推进党和人民事业发展的必然要求"], "e": "講師：「這是一個大題啊，大題考點。」論述時每點後面展開一兩句。", "id": "Q17-013", "l": 17, "ch": 5}, {"k": "判", "s": [6], "q": "開放也是改革；改革不停頓，開放不止步。", "a": true, "e": "對。", "id": "Q17-014", "l": 17, "ch": 5}, {"k": "單", "s": [11], "q": "「中國的發展離不開世界，世界的繁榮也需要中國」出自哪一部分？", "o": ["堅定不移擴大高水平對外開放", "堅定不移把全面深化改革引向深入", "改革開放永無止境", "構建新發展格局"], "a": 0, "e": "屬於擴大高水平對外開放。", "id": "Q17-015", "l": 17, "ch": 5}, {"k": "判", "s": [6], "q": "中國開放的大門只會越開越大。", "a": true, "e": "對。", "id": "Q17-016", "l": 17, "ch": 5}, {"k": "單", "s": [3], "q": "「改革開放永無止境」是哪一規律的深刻反映？", "o": ["社會基本矛盾運動規律", "價值規律", "市場經濟規律", "共產黨執政規律"], "a": 0, "e": "「是社會基本矛盾運動規律的深刻反映」。", "id": "Q17-017", "l": 17, "ch": 5}, {"s": [6], "src": "", "card": "C18-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜正確認識歷史方位和發展階段是根本依據：\n正确认识（＿①＿），是我们党明确各个阶段中心任务、制定正确路线方针政策的（＿②＿）", "a": ["历史方位和发展阶段", "根本依据"], "e": "先弄清楚「我們在哪個歷史位置、哪個發展階段」，黨才能定好每個階段的中心任務和正確政策。", "id": "Q18-001", "l": 18, "ch": 6}, {"s": [6], "src": "逐字稿", "card": "C18-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜經濟發展新常態的「三期疊加」：\n（＿①＿）、（＿②＿）、（＿③＿）", "a": ["增长速度换挡期", "结构调整阵痛期", "前期刺激政策消化期"], "e": "「三期疊加」＝三個時期同時出現：增長速度換擋期（增速變慢）、結構調整陣痛期（調整很痛苦）、前期刺激政策消化期（要消化以前的政策副作用）。講師：「把這三期記住了。」", "id": "Q18-002", "l": 18, "ch": 6}, {"s": [6], "src": "逐字稿", "card": "C18-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "多", "q": "「三期疊加」是指：", "o": ["增长速度换挡期", "结构调整阵痛期", "前期刺激政策消化期", "战略机遇期", "经济高速增长期"], "a": [0, 1, 2], "e": "正確：增长速度换挡期；结构调整阵痛期；前期刺激政策消化期。干擾項：战略机遇期；经济高速增长期。", "id": "Q18-003", "l": 18, "ch": 6}, {"s": [7], "src": "逐字稿", "card": "C18-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜新發展階段的定位；1956年進入社會主義初級階段：\n新发展阶段是社会主义初级阶段中的一个（＿①＿）；从（＿②＿）（三大改造完成）我国正式进入社会主义初级阶段", "a": ["重要阶段", "1956年"], "e": "新發展階段是社會主義初級階段中的一個重要階段。講師：1956年三大改造完成，我國正式進入社會主義初級階段。", "id": "Q18-004", "l": 18, "ch": 6}, {"s": [8], "src": "逐字稿", "card": "C18-04", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜發展理念的重要性：管全局、管根本、管方向、管長遠：\n发展理念是发展行 9", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜高質量發展的定義（五個「成為」）：\n（＿①＿）、协调成为（＿②＿）、绿色成为（＿③＿）、开放成为（＿④＿）、共享成为（＿⑤＿）的发展", "a": ["创新成为第一动力", "内生特点", "普遍形态", "必由之路", "根本目的"], "e": "高質量發展＝能很好滿足人民美好生活需要、體現新發展理念的發展：創新成為第一動力、協調成為內生特點、綠色成為普遍形態、開放成為必由之路、共享成為根本目的。講師：要重點記一下。", "id": "Q18-033", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "高質量發展是「创新成為＿＿」的發展，橫線處是：", "o": ["第一动力", "必由之路", "根本目的", "内生特点"], "a": 0, "e": "「创新」→「第一动力」。記法：再用一次「創協綠開共」：動力・內生・普遍・必由・目的。", "id": "Q18-034", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "高質量發展中，「创新」成為第一动力。", "a": true, "e": "對。「创新」→「第一动力」。", "id": "Q18-035", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "高質量發展是「协调成為＿＿」的發展，橫線處是：", "o": ["内生特点", "普遍形态", "第一动力", "根本目的"], "a": 0, "e": "「协调」→「内生特点」。記法：再用一次「創協綠開共」：動力・內生・普遍・必由・目的。", "id": "Q18-036", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "高質量發展中，「协调」成為普遍形态。", "a": false, "e": "錯。「协调」應對應「内生特点」，「普遍形态」對應的是「绿色」。", "id": "Q18-037", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "高質量發展是「绿色成為＿＿」的發展，橫線處是：", "o": ["普遍形态", "第一动力", "必由之路", "根本目的"], "a": 0, "e": "「绿色」→「普遍形态」。記法：再用一次「創協綠開共」：動力・內生・普遍・必由・目的。", "id": "Q18-038", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "高質量發展中，「绿色」成為普遍形态。", "a": true, "e": "對。「绿色」→「普遍形态」。", "id": "Q18-039", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "高質量發展是「开放成為＿＿」的發展，橫線處是：", "o": ["必由之路", "内生特点", "根本目的", "普遍形态"], "a": 0, "e": "「开放」→「必由之路」。記法：再用一次「創協綠開共」：動力・內生・普遍・必由・目的。", "id": "Q18-040", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "高質量發展中，「开放」成為根本目的。", "a": false, "e": "錯。「开放」應對應「必由之路」，「根本目的」對應的是「共享」。", "id": "Q18-041", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "高質量發展是「共享成為＿＿」的發展，橫線處是：", "o": ["根本目的", "内生特点", "普遍形态", "必由之路"], "a": 0, "e": "「共享」→「根本目的」。記法：再用一次「創協綠開共」：動力・內生・普遍・必由・目的。", "id": "Q18-042", "l": 18, "ch": 6}, {"s": [13], "src": "", "card": "C18-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "高質量發展中，「共享」成為根本目的。", "a": true, "e": "對。「共享」→「根本目的」。", "id": "Q18-043", "l": 18, "ch": 6}, {"s": [14, 15], "src": "", "card": "C18-10", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜高質量發展的要求（五方面）：\n从（＿①＿）看；从（＿②＿）看；从（＿③＿）看；从（＿④＿）看；从（＿⑤＿）看", "a": ["供给", "需求", "投入产出", "分配", "宏观经济循环"], "e": "講師：從供給、需求、投入產出、分配、宏觀經濟循環這幾方面把它背過。", "id": "Q18-044", "l": 18, "ch": 6}, {"s": [14, 15], "src": "", "card": "C18-10", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜高質量發展的要求（五方面）", "model": "从供给看；从需求看；从投入产出看；从分配看；从宏观经济循环看", "pts": ["供给", "需求", "投入产出", "分配", "宏观经济循环"], "e": "記法：「供・需・投・分・環」——按經濟流程：生產（供給）→消費（需求）→效率（投入產出）→分錢（分配）→整體循環。", "id": "Q18-045", "l": 18, "ch": 6}, {"s": [16, 17], "src": "", "card": "C18-11", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜高質量發展的戰略意義（只背黃色）：\n（1）为全面建设社会主义现代化国家提供更为坚实的（＿①＿）；（2）是不断满足人民对美好生活需要的（＿②＿）；（3）是维护国家长治久安的（＿③＿）", "a": ["物质基础", "重要保证", "必然要求"], "e": "①為全面建設社會主義現代化國家提供更為堅實的物質基礎；②是不斷滿足人民對美好生活需要的重要保證；③是維護國家長治久安的必然要求。", "id": "Q18-046", "l": 18, "ch": 6}, {"s": [16, 17], "src": "", "card": "C18-11", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜高質量發展的戰略意義（只背黃色）", "model": "（1）为全面建设社会主义现代化国家提供更为坚实的物质基础；（2）是不断满足人民对美好生活需要的重要保证；（3）是维护国家长治久安的必然要求", "pts": ["为全面建设社会主义现代化国家提供更为坚实的物质基础", "是不断满足人民对美好生活需要的重要保证", "是维护国家长治久安的必然要求"], "e": "記法：「基礎・保證・要求」。", "id": "Q18-047", "l": 18, "ch": 6}, {"k": "單", "s": [9], "q": "引領發展的第一動力是：", "o": ["創新", "協調", "開放", "科學技術"], "a": 0, "e": "創新是引領發展的第一動力（科學技術是第一生產力，第22堂辨析）。", "id": "Q18-048", "l": 18, "ch": 6}, {"k": "單", "s": [10], "q": "共享發展注重的是解決：", "o": ["社會公平正義問題", "發展內外聯動問題", "發展不平衡問題", "發展動力問題"], "a": 0, "e": "共享→社會公平正義。", "id": "Q18-049", "l": 18, "ch": 6}, {"k": "判", "s": [9], "q": "協調是持續健康發展的內在要求，協調發展注重的是解決發展不平衡問題。", "a": true, "e": "對。投影片原文。", "id": "Q18-050", "l": 18, "ch": 6}, {"k": "判", "s": [10], "q": "開放是中國特色社會主義的本質要求。", "a": false, "e": "錯。開放＝國家繁榮發展的必由之路；共享才是中國特色社會主義的本質要求。", "id": "Q18-051", "l": 18, "ch": 6}, {"k": "多", "s": [10], "q": "講師出的多選題：共享發展必須堅持（　　）", "o": ["全民共享", "全面共享", "共建共享", "漸進共享"], "a": [0, 1, 2, 3], "e": "講師原題：「A 全民共享 B 全面共享 C 共建共享 D 漸進共享」，四項全選。", "id": "Q18-052", "l": 18, "ch": 6}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師把新發展理念比喻為：", "o": ["指揮棒、紅綠燈", "生命線、幸福線", "主心骨、領航者", "發射器、放大器"], "a": 0, "e": "講師：「新發展理念是什麼？是指揮棒，是紅綠燈。」", "id": "Q18-053", "l": 18, "ch": 6}, {"k": "填", "s": [6], "q": "「三期疊加」：增長速度（＿①＿）期、結構調整（＿②＿）期、前期刺激政策（＿③＿）期。", "a": ["换挡", "阵痛", "消化"], "e": "講師：「把這三期記住了。」", "id": "Q18-054", "l": 18, "ch": 6}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，我國從哪一年正式進入社會主義初級階段？", "o": ["1956年", "1949年", "1978年", "1953年"], "a": 0, "e": "講師：從1956年三大改造完成，正式進入社會主義初級階段。", "id": "Q18-055", "l": 18, "ch": 6}, {"k": "論", "s": [9, 10], "q": "論述：如何理解新發展理念的科學內涵？", "sum": "一句白話：五個理念分別給發展「動力、平衡、環保、對外、公平」，各自解決一個發展問題。", "pts": ["创新是引领发展的第一动力，创新发展注重的是解决发展动力问题", "协调是持续健康发展的内在要求，协调发展注重的是解决发展不平衡问题", "绿色是永续发展的必要条件和人民对美好生活追求的重要体现，绿色发展注重的是解决人与自然和谐共生问题", "开放是国家繁荣发展的必由之路，开放发展注重的是解决发展内外联动问题", "共享是中国特色社会主义的本质要求，共享发展注重的是解决社会公平正义问题"], "e": "講師：「總共有五個必須要背過」，每條背到「解決……問題」。", "id": "Q18-056", "l": 18, "ch": 6}, {"s": [3], "src": "", "card": "C19-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜社會主義基本經濟制度的地位：\n社会主义基本经济制度是我国（＿①＿）在制度上的体现，在经济制度体系中具有（＿②＿）地位，是中国特色社会主义制度的（＿③＿）", "a": ["生产关系", "基础性决定性", "重要支柱"], "e": "基本經濟制度是我國「生產關係」（誰擁有、怎樣分、怎樣配置資源）在制度上的體現，在經濟制度體系中起基礎性、決定性作用，是中特制度的重要支柱。", "id": "Q19-001", "l": 19, "ch": 6}, {"s": [4, 5], "src": "", "card": "C19-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜十八大以來對基本經濟制度的新概括（三項）：\n（＿①＿），（＿②＿），（＿③＿）", "a": ["公有制为主体、多种所有制经济共同发展", "按劳分配为主体、多种分配方式并存", "社会主义市场经济体制"], "e": "基本經濟制度包括三項：①公有制為主體、多種所有制經濟共同發展（所有制）；②按勞分配為主體、多種分配方式並存（分配）；③社會主義市場經濟體制（資源配置）。", "id": "Q19-002", "l": 19, "ch": 6}, {"s": [4, 5], "src": "", "card": "C19-02", "tag": ["必背", "多選題考點"], "auto": 1, "k": "多", "q": "十八大以來概括的社會主義基本經濟制度包括：", "o": ["公有制为主体、多种所有制经济共同发展", "按劳分配为主体、多种分配方式并存", "社会主义市场经济体制", "计划经济体制", "平均分配制度"], "a": [0, 1, 2], "e": "正確：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。干擾項：计划经济体制；平均分配制度。", "id": "Q19-003", "l": 19, "ch": 6}, {"s": [6], "src": "", "card": "C19-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜所有制結構是基本經濟制度的基礎：\n（＿①＿）是基本经济制度的基础，决定（＿②＿）和（＿③＿）", "a": ["所有制结构", "分配方式", "资源配置方式"], "e": "「誰擁有生產資料」決定了怎麼分配、怎麼配置資源，所以所有制結構是基礎。講師：後段（系統性影響）不用背，理解意思即可。", "id": "Q19-004", "l": 19, "ch": 6}, {"s": [7], "src": "", "card": "C19-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜公有制和非公有制都是重要組成部分；兩個毫不動搖：\n公有制经济和非公有制经济都是（＿①＿）的重要组成部分，都是我国经济社会发展的（＿②＿）；毫不动摇地（＿③＿）公有制经济，毫不动摇地（＿④＿）非公有制经济发展", "a": ["社会主义市场经济", "重要基础", "巩固和发展", "鼓励、支持、引导"], "e": "公有制經濟和非公有制經濟都是「社會主義市場經濟」的重要組成部分，都是經濟社會發展的重要基礎。所以要「兩個毫不動搖」：毫不動搖鞏固和發展公有制經濟，毫不動搖鼓勵、支持、引導非公有制經濟發展。講師：必須背過。", "id": "Q19-005", "l": 19, "ch": 6}, {"s": [7], "src": "", "card": "C19-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜公有制和非公有制都是重要組成部分；兩個毫不動搖", "model": "公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础；毫不动摇地巩固和发展公有制经济，毫不动摇地鼓励、支持、引导非公有制经济发展", "pts": ["社会主义市场经济", "重要基础", "巩固和发展", "鼓励、支持、引导"], "e": "記法：「都是・都是・兩個毫不動搖」：公＝鞏固發展；非公＝鼓勵支持引導。", "id": "Q19-006", "l": 19, "ch": 6}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜公有制主體地位、國有經濟主導作用、戰略支撐作用：\n公有制——（＿①＿）；国有经济——（＿②＿）；发挥国有经济的（＿③＿）；国有企业是中国特色社会主义的重要（＿④＿）", "a": ["主体地位", "主导作用", "战略支撑作用", "物质基础和政治基础"], "e": "公有制＝「主體地位」；國有經濟＝「主導作用」；還要發揮國有經濟的「戰略支撐作用」。國有企業是中特的重要物質基礎和政治基礎，是黨執政興國的重要支柱和依靠力量。", "id": "Q19-007", "l": 19, "ch": 6}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師：「公有制」在我國經濟中居於（發揮）：", "o": ["主体地位", "主导作用", "补充作用", "决定性作用"], "a": 0, "e": "「公有制」→「主体地位」。記法：「公＝主體、國有＝主導」（體大、導帶路）。", "id": "Q19-008", "l": 19, "ch": 6}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「公有制」的地位／作用是主体地位。", "a": true, "e": "對。「公有制」→「主体地位」。", "id": "Q19-009", "l": 19, "ch": 6}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師：「国有经济」在我國經濟中居於（發揮）：", "o": ["主导作用", "主体地位", "补充作用", "决定性作用"], "a": 0, "e": "「国有经济」→「主导作用」。記法：「公＝主體、國有＝主導」（體大、導帶路）。", "id": "Q19-010", "l": 19, "ch": 6}, {"s": [8], "src": "逐字稿", "card": "C19-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「国有经济」的地位／作用是主体地位。", "a": false, "e": "錯。「国有经济」應對應「主导作用」，「主体地位」對應的是「公有制」。", "id": "Q19-011", "l": 19, "ch": 6}, {"s": [9, 10], "src": "", "card": "C19-06", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜非公有制經濟與民營經濟：\n非公有制经济是（＿①＿）的重要组成部分；（＿②＿）是非公有制经济的（＿③＿）；是推进中国式现代化的（＿④＿）", "a": ["社会主义市场经济", "民营经济", "主要经济组织形式", "生力军"], "e": "講師提醒「很喜歡考選擇題」：非公有制經濟是「社會主義市場經濟」的重要組成部分。民營經濟是非公有制經濟的主要（經濟）組織形式；是推進中國式現代化的生力軍、高質量發展的重要基礎。", "id": "Q19-012", "l": 19, "ch": 6}, {"s": [11], "src": "", "card": "C19-07", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜公有制經濟與非公有制經濟的關係：\n公有制经济与非公有制经济（＿①＿）、（＿②＿）", "a": ["相辅相成", "相得益彰"], "e": "兩者不是對立的，而是相輔相成、相得益彰（互相幫助、互相成就）。", "id": "Q19-013", "l": 19, "ch": 6}, {"s": [12], "src": "", "card": "C19-08", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜基本分配制度：\n（＿①＿）的（＿②＿），由社会主义性质和基本国情决定", "a": ["按劳分配为主体、多种分配方式并存", "基本分配制度"], "e": "按勞分配為主體、多種分配方式並存的基本分配制度，是由社會主義性質和初級階段基本國情決定的。", "id": "Q19-014", "l": 19, "ch": 6}, {"s": [15], "src": "", "card": "C19-09", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜構建高水平社會主義市場經濟體制：\n（1）处理好（＿①＿）的关系——使市场在资源配置中起（＿②＿），更好发挥政府作用；（2）加快建设（＿③＿）", "a": ["政府和市场", "决定性作用", "高标准市场体系"], "e": "關鍵是處理好政府和市場的關係：使市場在資源配置中起決定性作用，更好發揮政府作用；並加快建設高標準市場體系。", "id": "Q19-015", "l": 19, "ch": 6}, {"k": "單", "s": [9, 10], "q": "非公有制經濟的主要經濟組織形式是：", "o": ["民營經濟", "個體經濟", "外資經濟", "混合所有制經濟"], "a": 0, "e": "講師：「考點，選擇，民營經濟是非公有制經濟主要組織形式。」", "id": "Q19-016", "l": 19, "ch": 6}, {"k": "單", "s": [7], "q": "公有制經濟和非公有制經濟都是＿＿的重要組成部分。", "o": ["社會主義市場經濟", "公有制經濟", "國有經濟", "計劃經濟"], "a": 0, "e": "原文：都是社會主義市場經濟的重要組成部分。", "id": "Q19-017", "l": 19, "ch": 6}, {"k": "判", "s": [9], "q": "非公有制經濟是社會主義市場經濟的重要組成部分。", "a": true, "e": "對。講師提醒這題很喜歡考。", "id": "Q19-018", "l": 19, "ch": 6}, {"k": "單", "s": [8], "q": "在我國，國有經濟發揮：", "o": ["主導作用", "主體作用", "補充作用", "決定性作用"], "a": 0, "e": "公有制＝主體地位；國有經濟＝主導作用。", "id": "Q19-019", "l": 19, "ch": 6}, {"k": "單", "s": [15], "q": "構建高水平社會主義市場經濟體制，關鍵是處理好：", "o": ["政府和市場的關係", "公平和效率的關係", "改革和發展的關係", "中央和地方的關係"], "a": 0, "e": "講師：「關鍵是要處理好什麼？政府和市場的關係。」", "id": "Q19-020", "l": 19, "ch": 6}, {"k": "判", "s": [15], "q": "在社會主義市場經濟中，政府在資源配置中起決定性作用。", "a": false, "e": "錯。是「市場」在資源配置中起決定性作用，同時更好發揮政府作用。", "id": "Q19-021", "l": 19, "ch": 6}, {"k": "填", "s": [7], "q": "毫不動搖地（＿①＿）公有制經濟，毫不動搖地（＿②＿）非公有制經濟發展。", "a": ["巩固和发展", "鼓励、支持、引导|鼓励支持引导"], "e": "「兩個毫不動搖」。", "id": "Q19-022", "l": 19, "ch": 6}, {"k": "單", "s": [6], "q": "基本經濟制度的基礎是：", "o": ["所有制結構", "分配制度", "市場經濟體制", "宏觀調控"], "a": 0, "e": "所有制結構是基本經濟制度的基礎，決定分配方式和資源配置方式。", "id": "Q19-023", "l": 19, "ch": 6}, {"s": [3, 4], "src": "", "card": "C20-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜構建新發展格局：把握未來發展主動權的戰略部署（四個標題）：\n（1）构建新发展格局是对我国客观经济规律和发展趋势的（＿①＿）；（2）是把握未来发展主动权的（＿②＿）；（3）是（＿③＿）；（4）是以全国统一大市场基础上的（＿④＿）", "a": ["自觉把握", "先手棋", "开放的国内国际双循环", "国内大循环为主体"], "e": "講師：只記標題。①是對客觀經濟規律和發展趨勢的自覺把握；②是把握未來發展主動權的先手棋（不是被迫，也不是權宜之計）；③是開放的國內國際雙循環；④是以全國統一大市場基礎上的國內大循環為主體。", "id": "Q20-001", "l": 20, "ch": 6}, {"s": [3, 4], "src": "", "card": "C20-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜構建新發展格局：把握未來發展主動權的戰略部署（四個標題）", "model": "（1）构建新发展格局是对我国客观经济规律和发展趋势的自觉把握；（2）是把握未来发展主动权的先手棋；（3）是开放的国内国际双循环；（4）是以全国统一大市场基础上的国内大循环为主体", "pts": ["对我国客观经济规律和发展趋势的自觉把握", "把握未来发展主动权的先手棋", "开放的国内国际双循环", "以全国统一大市场基础上的国内大循环为主体"], "e": "記法：講師回顧口訣：「第一自覺把握、第二先手棋、第三雙循環、第四國內大循環為主體」。", "id": "Q20-002", "l": 20, "ch": 6}, {"s": [5], "src": "", "card": "C20-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜以國內大循環為主體：國內大循環起主導作用：\n加强（＿①＿）在双循环中的（＿②＿）", "a": ["国内大循环", "主导作用"], "e": "國內和國際兩個循環都存在，但起「主導作用」的是國內大循環。講師：選擇題考點。", "id": "Q20-003", "l": 20, "ch": 6}, {"s": [5, 6], "src": "", "card": "C20-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜以國內大循環為主體、國內國際雙循環相互促進（三點）：\n（1）加强国内大循环在双循环中的主导作用；（2）发挥（＿①＿）；（3）构建新发展格局必须保证经济循环的（＿②＿）", "a": ["比较优势", "畅通无阻"], "e": "①加強國內大循環在雙循環中的主導作用；②發揮比較優勢；③構建新發展格局必須保證經濟循環的暢通無阻。", "id": "Q20-004", "l": 20, "ch": 6}, {"s": [7, 8], "src": "逐字稿", "card": "C20-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜大力推動構建新發展格局（實體經濟、科技自立自強）：\n扩大内需战略同深化（＿①＿）有机结合；实体经济是一国经济的（＿②＿）、财富源泉；构建新发展格局最本质的特征是实现（＿③＿）", "a": ["供给侧结构性改革", "立身之本", "高水平的自立自强"], "e": "怎樣推動：擴大內需戰略同深化供給側結構性改革有機結合；着力發展實體經濟（講師選擇題：實體經濟是一國經濟的立身之本、財富源泉）；加快科技自立自強（構建新發展格局最本質的特徵是實現高水平的自立自強）；推動產業鏈供應鏈優化升級。", "id": "Q20-005", "l": 20, "ch": 6}, {"k": "單", "s": [5], "q": "在國內國際雙循環中起主導作用的是：", "o": ["國內大循環", "國際循環", "兩者同等", "對外貿易"], "a": 0, "e": "講師：「雖然這兩個循環都存在，但是有一個是起主導作用的，哪一個？國內大循環。」", "id": "Q20-006", "l": 20, "ch": 6}, {"k": "單", "s": [3], "q": "構建新發展格局是把握未來發展主動權的：", "o": ["先手棋", "權宜之計", "被迫之舉", "關鍵一招"], "a": 0, "e": "講師：是先手棋，「不是被迫也不是權宜」。「關鍵一招」是改革開放。", "id": "Q20-007", "l": 20, "ch": 6}, {"k": "判", "s": [4], "q": "構建新發展格局是封閉的國內循環。", "a": false, "e": "錯。是「開放的國內國際雙循環」。", "id": "Q20-008", "l": 20, "ch": 6}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師指出，構建新發展格局最本質的特徵是：", "o": ["實現高水平的自立自強", "擴大內需", "發展實體經濟", "擴大對外開放"], "a": 0, "e": "原話：「構建新發展格局最本質的特徵是什麼？是實現高水平的自立自強。」", "id": "Q20-009", "l": 20, "ch": 6}, {"k": "單", "s": [0], "src": "逐字稿", "q": "「一國經濟的立身之本、財富源泉」是指：", "o": ["實體經濟", "數字經濟", "虛擬經濟", "民營經濟"], "a": 0, "e": "講師：「選擇題來了，實體經濟是什麼？是一國經濟的立身之本……」", "id": "Q20-010", "l": 20, "ch": 6}, {"k": "填", "s": [4], "q": "構建新發展格局是以全國統一大市場基礎上的（＿①＿）為主體。", "a": ["国内大循环"], "e": "第四個標題。", "id": "Q20-011", "l": 20, "ch": 6}, {"k": "簡", "s": [3, 4], "q": "簡答：為什麼說構建新發展格局是把握未來發展主動權的戰略部署？", "sum": "一句白話：它是看清經濟規律後主動下的一步好棋，是開放的雙循環，並以國內大循環為主。", "pts": ["构建新发展格局是对我国客观经济规律和发展趋势的自觉把握", "构建新发展格局是把握未来发展主动权的先手棋", "构建新发展格局是开放的国内国际双循环", "构建新发展格局是以全国统一大市场基础上的国内大循环为主体"], "e": "講師：「仍然是只記標題部分。」", "id": "Q20-012", "l": 20, "ch": 6}, {"k": "單", "s": [3], "q": "構建新發展格局是把握未來發展主動權的：", "o": ["先手棋", "總抓手", "牛鼻子", "生命線"], "a": 0, "e": "「先手棋」。", "id": "Q20-013", "l": 20, "ch": 6}, {"k": "判", "s": [5], "q": "新發展格局中，國際大循環在雙循環中起主導作用。", "a": false, "e": "錯。要加強「國內大循環」在雙循環中的主導作用。", "id": "Q20-014", "l": 20, "ch": 6}, {"k": "單", "s": [0], "src": "逐字稿", "q": "實體經濟是一國經濟的：", "o": ["立身之本、財富源泉", "根本動力", "第一動力", "戰略支撐"], "a": 0, "e": "實體經濟是一國經濟的立身之本、財富源泉。", "id": "Q20-015", "l": 20, "ch": 6}, {"k": "判", "s": [4], "q": "新發展格局是封閉的國內循環。", "a": false, "e": "錯。是「開放的國內國際雙循環」。", "id": "Q20-016", "l": 20, "ch": 6}, {"s": [3, 4], "src": "", "card": "C21-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜建設現代化產業體系（六個黃色標題）：\n（1）巩固（＿①＿）领先地位；（2）大力发展（＿②＿）；（3）构建优质高效的（＿③＿）；（4）发展（＿④＿）；（5）加快发展（＿⑤＿）；（6）构建现代化（＿⑥＿）", "a": ["优势产业", "战略性新兴产业", "服务业新体系", "现代流通产业", "数字经济", "基础设施体系"], "e": "講師：需要背過，六個黃色標題是簡答題考點。①鞏固優勢產業領先地位；②大力發展戰略性新興產業（具有先導性）；③構建優質高效的服務業新體系（現代服務業是重要支撐）；④發展現代流通產業（連通生產和消費）；⑤加快發展數字經濟；⑥構建現代化基礎設施體系。", "id": "Q21-001", "l": 21, "ch": 6}, {"s": [3, 4], "src": "", "card": "C21-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜建設現代化產業體系（六個黃色標題）", "model": "（1）巩固优势产业领先地位；（2）大力发展战略性新兴产业；（3）构建优质高效的服务业新体系；（4）发展现代流通产业；（5）加快发展数字经济；（6）构建现代化基础设施体系", "pts": ["巩固优势产业领先地位", "大力发展战略性新兴产业", "构建优质高效的服务业新体系", "发展现代流通产业", "加快发展数字经济", "构建现代化基础设施体系"], "e": "記法：「優・新・服・流・數・基」：老強項→新產業→服務業→流通→數字→基建。", "id": "Q21-002", "l": 21, "ch": 6}, {"s": [3, 4], "src": "", "card": "C21-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "建設現代化產業體系包括：", "o": ["巩固优势产业领先地位", "大力发展战略性新兴产业", "构建优质高效的服务业新体系", "发展现代流通产业", "限制民营企业发展"], "a": [0, 1, 2, 3], "e": "正確：巩固优势产业领先地位；大力发展战略性新兴产业；构建优质高效的服务业新体系；发展现代流通产业。干擾項：限制民营企业发展。", "id": "Q21-003", "l": 21, "ch": 6}, {"s": [3, 4], "src": "", "card": "C21-01", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "多", "q": "建設現代化產業體系包括：", "o": ["构建现代化基础设施体系", "构建优质高效的服务业新体系", "大力发展战略性新兴产业", "加快发展数字经济", "限制民营企业发展"], "a": [0, 1, 2, 3], "e": "正確：构建现代化基础设施体系；构建优质高效的服务业新体系；大力发展战略性新兴产业；加快发展数字经济。干擾項：限制民营企业发展。", "id": "Q21-004", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜鄉村振興戰略的「總目標・總方針・總要求・制度保障」：\n（＿①＿）是总目标；坚持（＿②＿）是总方针；（＿③＿）是总要求；建立健全（＿④＿）是制度保障", "a": ["农业农村现代化", "农业农村优先发展", "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕", "城乡融合发展体制机制和政策体系"], "e": "講師：四個選擇題考點，背。總目標＝農業農村現代化；總方針＝堅持農業農村優先發展；總要求＝產業興旺、生態宜居、鄉風文明、治理有效、生活富裕（20字）；制度保障＝建立健全城鄉融合發展體制機制和政策體系。另：農業強國是社會主義現代化強國的根基。", "id": "Q21-005", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜鄉村振興戰略的「總目標・總方針・總要求・制度保障」", "model": "农业农村现代化是总目标；坚持农业农村优先发展是总方针；产业兴旺、生态宜居、乡风文明、治理有效、生活富裕是总要求；建立健全城乡融合发展体制机制和政策体系是制度保障", "pts": ["农业农村现代化", "农业农村优先发展", "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕", "城乡融合发展体制机制和政策体系"], "e": "記法：「目標＝現代化、方針＝優先、要求＝20字、保障＝城鄉融合」。20字口訣「產・生・鄉・治・富」。", "id": "Q21-006", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "實施鄉村振興戰略的「总目标」是：", "o": ["农业农村现代化", "坚持农业农村优先发展", "建立健全城乡融合发展体制机制和政策体系", "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕"], "a": 0, "e": "「总目标」→「农业农村现代化」。記法：「目標＝現代化、方針＝優先、要求＝20字、保障＝城鄉融合」。20字口訣「產・生・鄉・治・富」。", "id": "Q21-007", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "鄉村振興戰略的总目标是农业农村现代化。", "a": true, "e": "對。「总目标」→「农业农村现代化」。", "id": "Q21-008", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "實施鄉村振興戰略的「总方针」是：", "o": ["坚持农业农村优先发展", "农业农村现代化", "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕", "建立健全城乡融合发展体制机制和政策体系"], "a": 0, "e": "「总方针」→「坚持农业农村优先发展」。記法：「目標＝現代化、方針＝優先、要求＝20字、保障＝城鄉融合」。20字口訣「產・生・鄉・治・富」。", "id": "Q21-009", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "鄉村振興戰略的总方针是产业兴旺、生态宜居、乡风文明、治理有效、生活富裕。", "a": false, "e": "錯。「总方针」應對應「坚持农业农村优先发展」，「产业兴旺、生态宜居、乡风文明、治理有效、生活富裕」對應的是「总要求」。", "id": "Q21-010", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "實施鄉村振興戰略的「总要求」是：", "o": ["产业兴旺、生态宜居、乡风文明、治理有效、生活富裕", "坚持农业农村优先发展", "建立健全城乡融合发展体制机制和政策体系", "农业农村现代化"], "a": 0, "e": "「总要求」→「产业兴旺、生态宜居、乡风文明、治理有效、生活富裕」。記法：「目標＝現代化、方針＝優先、要求＝20字、保障＝城鄉融合」。20字口訣「產・生・鄉・治・富」。", "id": "Q21-011", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "鄉村振興戰略的总要求是产业兴旺、生态宜居、乡风文明、治理有效、生活富裕。", "a": true, "e": "對。「总要求」→「产业兴旺、生态宜居、乡风文明、治理有效、生活富裕」。", "id": "Q21-012", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "單", "q": "實施鄉村振興戰略的「制度保障」是：", "o": ["建立健全城乡融合发展体制机制和政策体系", "坚持农业农村优先发展", "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕", "农业农村现代化"], "a": 0, "e": "「制度保障」→「建立健全城乡融合发展体制机制和政策体系」。記法：「目標＝現代化、方針＝優先、要求＝20字、保障＝城鄉融合」。20字口訣「產・生・鄉・治・富」。", "id": "Q21-013", "l": 21, "ch": 6}, {"s": [5], "src": "", "card": "C21-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "鄉村振興戰略的制度保障是农业农村现代化。", "a": false, "e": "錯。「制度保障」應對應「建立健全城乡融合发展体制机制和政策体系」，「农业农村现代化」對應的是「总目标」。", "id": "Q21-014", "l": 21, "ch": 6}, {"s": [6, 7], "src": "", "card": "C21-03", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜鄉村振興要處理好的四組關係：\n①处理好（＿①＿）的关系；②处理好（＿②＿）的关系；③处理好（＿③＿）的关系；④处理好（＿④＿）的关系", "a": ["长期目标和短期目标", "顶层设计和基层探索", "充分发挥市场决定性作用和更好发挥政府作用", "增强群众获得感和适应发展阶段"], "e": "全面實施鄉村振興戰略是一項艱巨複雜的事業，必須統籌謀劃、科學推進。要處理好四組關係：①長期目標和短期目標；②頂層設計和基層探索（落實黨中央的頂層設計，同時發揮億萬農民的主體作用和首創精神）；③充分發揮市場決定性作用和更好發揮政府作用；④增強群眾獲得感和適應發展階段。講師也說：耕地紅線是不能夠忍讓的。", "id": "Q21-015", "l": 21, "ch": 6}, {"s": [6, 7], "src": "", "card": "C21-03", "tag": ["選擇題考點"], "auto": 1, "k": "多", "q": "全面實施鄉村振興戰略要處理好的關係包括：", "o": ["长期目标和短期目标", "顶层设计和基层探索", "充分发挥市场决定性作用和更好发挥政府作用", "增强群众获得感和适应发展阶段", "活力和秩序"], "a": [0, 1, 2, 3], "e": "正確：长期目标和短期目标；顶层设计和基层探索；充分发挥市场决定性作用和更好发挥政府作用；增强群众获得感和适应发展阶段。干擾項：活力和秩序。", "id": "Q21-016", "l": 21, "ch": 6}, {"s": [8], "src": "", "card": "C21-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜促進區域協調發展：\n深入实施（＿①＿）、（＿②＿）、（＿③＿）；推进（＿④＿）的新型城镇化，加快农业转移人口市民化；（＿⑤＿）", "a": ["区域协调发展战略", "区域重大战略", "主体功能区战略", "以人为核心", "合理分工、优化发展"], "e": "講師：「如何促進區域協調？把這幾個給我背過。」深入實施區域協調發展戰略、區域重大戰略、主體功能區戰略；推進以人為核心的新型城鎮化，加快農業轉移人口市民化；合理分工、優化發展。", "id": "Q21-017", "l": 21, "ch": 6}, {"s": [8], "src": "", "card": "C21-04", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜促進區域協調發展", "model": "深入实施区域协调发展战略、区域重大战略、主体功能区战略；推进以人为核心的新型城镇化，加快农业转移人口市民化；合理分工、优化发展", "pts": ["深入实施区域协调发展战略、区域重大战略、主体功能区战略", "推进以人为核心的新型城镇化，加快农业转移人口市民化", "合理分工、优化发展"], "e": "記法：「三戰略＋城鎮化（以人為核心）＋分工」。", "id": "Q21-018", "l": 21, "ch": 6}, {"k": "單", "s": [5], "q": "實施鄉村振興戰略的總方針是：", "o": ["堅持農業農村優先發展", "農業農村現代化", "產業興旺、生態宜居、鄉風文明、治理有效、生活富裕", "建立健全城鄉融合發展體制機制和政策體系"], "a": 0, "e": "總方針＝優先發展；總目標＝現代化；總要求＝20字；制度保障＝城鄉融合。", "id": "Q21-019", "l": 21, "ch": 6}, {"k": "判", "s": [5], "q": "農業強國是社會主義現代化強國的根基。", "a": true, "e": "對。講師：「農業強國是社會主義現代化強國的根基。」", "id": "Q21-020", "l": 21, "ch": 6}, {"k": "填", "s": [5], "q": "鄉村振興總要求：產業（＿①＿）、生態（＿②＿）、鄉風（＿③＿）、治理（＿④＿）、生活（＿⑤＿）。", "a": ["兴旺", "宜居", "文明", "有效", "富裕"], "e": "20字總要求。", "id": "Q21-021", "l": 21, "ch": 6}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師指出，具有先導性的產業是：", "o": ["戰略性新興產業", "傳統優勢產業", "現代流通產業", "現代服務業"], "a": 0, "e": "原話：「戰略性的新興產業是具有先導性的。」", "id": "Q21-022", "l": 21, "ch": 6}, {"k": "單", "s": [0], "src": "逐字稿", "q": "講師說，連通着生產和消費的是：", "o": ["現代流通產業", "數字經濟", "基礎設施", "戰略性新興產業"], "a": 0, "e": "講師：流通「連通着生產和消費」。", "id": "Q21-023", "l": 21, "ch": 6}, {"k": "判", "s": [8], "q": "推進新型城鎮化要以人為核心。", "a": true, "e": "對。推進以人為核心的新型城鎮化。", "id": "Q21-024", "l": 21, "ch": 6}, {"k": "簡", "s": [3, 4], "q": "簡答：如何建設現代化產業體系？", "sum": "一句白話：守住強項、發展新產業、做好服務業和流通、發展數字經濟、建好基礎設施。", "pts": ["巩固优势产业领先地位", "大力发展战略性新兴产业", "构建优质高效的服务业新体系", "发展现代流通产业", "加快发展数字经济", "构建现代化基础设施体系"], "e": "講師：「把這個黃色的標題給老師背過，簡答題是可以去考的。」", "id": "Q21-025", "l": 21, "ch": 6}, {"s": [6], "src": "", "card": "C22-01", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜教育、科技、人才一體推進的深層次原因：\n建设教育强国、科技强国、人才强国具有（＿①＿）和（＿②＿）", "a": ["内在一致性", "相互支撑性"], "e": "為什麼要把教育、科技、人才一起推進？因為建設教育強國、科技強國、人才強國有「內在一致性和相互支撐性」——三者目標一致、互相幫忙。（發展現狀、支撐與貢獻兩段講師說了解即可，不用背。）", "id": "Q22-001", "l": 22, "ch": 7}, {"s": [10], "src": "", "card": "C22-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜科教興國戰略：科學技術是第一生產力：\n（＿①＿）——全面落实（＿②＿）的思想；（＿③＿）在国家发展全局中居于（＿④＿）", "a": ["科教兴国战略", "科学技术是第一生产力", "创新", "核心位置"], "e": "科教興國戰略就是要全面落實「科學技術是第一生產力」的思想，堅持教育優先發展；同頁黃字：創新在國家發展全局中居於核心位置。", "id": "Q22-002", "l": 22, "ch": 7}, {"s": [11], "src": "", "card": "C22-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜人才強國戰略：人才資源是第一資源；黨管人才：\n（＿①＿）——树立（＿②＿）的理念；坚持（＿③＿）的原则", "a": ["人才强国战略", "人才资源是第一资源", "党管人才"], "e": "人才強國戰略要鞏固樹立「人才資源是第一資源」的理念；實施人才強國戰略要堅持「黨管人才」原則。講師：選擇題。", "id": "Q22-003", "l": 22, "ch": 7}, {"s": [12], "src": "", "card": "C22-04", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜創新驅動發展戰略：創新是第一動力：\n（＿①＿）——坚持（＿②＿）", "a": ["创新驱动发展战略", "创新是第一动力"], "e": "創新驅動發展戰略就是要堅持「創新是第一動力」（新發展理念的內容）。講師：只需要把黃色部分記住。", "id": "Q22-004", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜易混辨析：三個「第一」——生產力・資源・動力：\n（＿①＿）是第一生产力；（＿②＿）是第一资源；（＿③＿）是第一动力", "a": ["科学技术", "人才资源", "创新"], "e": "講師特別強調：「創新是第一動力，科學技術才是第一生產力，一定要把這個給區分開」；另外人才資源是第一資源。對應三大戰略：科教興國↔第一生產力；人才強國↔第一資源；創新驅動↔第一動力。", "id": "Q22-005", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師辨析三個「第一」：「科学技术」是：", "o": ["第一生产力", "第一资源", "第一动力", "第一要务"], "a": 0, "e": "「科学技术」→「第一生产力」。記法：「科技生產、人才資源、創新動力」——「科・人・創」配「產・源・動」。", "id": "Q22-006", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「科学技术」是第一生产力。", "a": true, "e": "對。「科学技术」→「第一生产力」。", "id": "Q22-007", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師辨析三個「第一」：「人才资源」是：", "o": ["第一资源", "第一生产力", "第一动力", "第一要务"], "a": 0, "e": "「人才资源」→「第一资源」。記法：「科技生產、人才資源、創新動力」——「科・人・創」配「產・源・動」。", "id": "Q22-008", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「人才资源」是第一动力。", "a": false, "e": "錯。「人才资源」應對應「第一资源」，「第一动力」對應的是「创新」。", "id": "Q22-009", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "單", "q": "講師辨析三個「第一」：「创新」是：", "o": ["第一动力", "第一资源", "第一生产力", "第一要务"], "a": 0, "e": "「创新」→「第一动力」。記法：「科技生產、人才資源、創新動力」——「科・人・創」配「產・源・動」。", "id": "Q22-010", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-05", "tag": ["必背", "選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「创新」是第一动力。", "a": true, "e": "對。「创新」→「第一动力」。", "id": "Q22-011", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-06", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "填", "q": "填空｜三大戰略對應：\n科教兴国战略——（＿①＿）；人才强国战略——（＿②＿）；创新驱动发展战略——（＿③＿）", "a": ["第一生产力", "第一资源", "第一动力"], "e": "三大戰略：科教興國戰略、人才強國戰略、創新驅動發展戰略，各自對應一個「第一」。", "id": "Q22-012", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-06", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「科教兴国战略」的核心要求是：", "o": ["全面落实科学技术是第一生产力的思想", "坚持创新是第一动力", "树立人才资源是第一资源的理念"], "a": 0, "e": "「科教兴国战略」→「全面落实科学技术是第一生产力的思想」。記法：同上口訣。", "id": "Q22-013", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-06", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「科教兴国战略」就是要全面落实科学技术是第一生产力的思想。", "a": true, "e": "對。「科教兴国战略」→「全面落实科学技术是第一生产力的思想」。", "id": "Q22-014", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-06", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "單", "q": "「人才强国战略」的核心要求是：", "o": ["树立人才资源是第一资源的理念", "全面落实科学技术是第一生产力的思想", "坚持创新是第一动力"], "a": 0, "e": "「人才强国战略」→「树立人才资源是第一资源的理念」。記法：同上口訣。", "id": "Q22-015", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "card": "C22-06", "tag": ["選擇題考點", "易混"], "auto": 1, "k": "判", "q": "「人才强国战略」就是要坚持创新是第一动力。", "a": false, "e": "錯。「人才强国战略」應對應「树立人才资源是第一资源的理念」，「坚持创新是第一动力」對應的是「创新驱动发展战略」。", "id": "Q22-016", "l": 22, "ch": 7}, {"s": [10, 11, 12], "src": "", "c 发展的基础能力"], "a": 0, "e": "「人才引领驱动」→「经济社会发展和国家现代化的基本规律」。記法：「教育＝先手棋、科技＝基礎能力、人才＝基本規律」。", "id": "Q22-024", "l": 22, "ch": 7}, {"s": [13], "src": "", "card": "C22-07", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "判", "q": "「人才引领驱动」是经济社会发展和国家现代化的基本规律。", "a": true, "e": "對。「人才引领驱动」→「经济社会发展和国家现代化的基本规律」。", "id": "Q22-025", "l": 22, "ch": 7}, {"k": "單", "s": [10], "q": "科教興國戰略就是要全面落實＿＿的思想。", "o": ["科學技術是第一生產力", "創新是第一動力", "人才資源是第一資源", "發展是第一要務"], "a": 0, "e": "科教興國↔第一生產力。", "id": "Q22-026", "l": 22, "ch": 7}, {"k": "判", "s": [12], "q": "創新是第一生產力。", "a": false, "e": "錯。講師：「創新是第一動力，科學技術才是第一生產力，一定要把這個給區分開。」", "id": "Q22-027", "l": 22, "ch": 7}, {"k": "單", "s": [11], "q": "實施人才強國戰略要堅持的原則是：", "o": ["黨管人才", "市場配置人才", "政府主導人才", "企業培養人才"], "a": 0, "e": "講師：「要堅持黨管人才的原則……選擇題。」", "id": "Q22-028", "l": 22, "ch": 7}, {"k": "單", "s": [10], "q": "在國家發展全局中居於核心位置的是：", "o": ["創新", "教育", "人才", "開放"], "a": 0, "e": "投影片黃字：創新在國家發展全局中居於核心位置。", "id": "Q22-029", "l": 22, "ch": 7}, {"k": "判", "s": [6], "q": "講師說，「我國教育科技人才事業的發展成就」一段需要逐字背誦。", "a": false, "e": "錯。講師說「了解一下即可」；「支撐與貢獻」一段也「不需要大家去背」。", "id": "Q22-030", "l": 22, "ch": 7}, {"s": [3], "src": "", "card": "C23-01", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜教育是民族振興、社會進步的基石；國之大計、黨之大計：\n教育是（＿①＿）的（＿②＿）；教育是（＿③＿）", "a": ["民族振兴、社会进步", "基石", "国之大计、党之大计"], "e": "教育像房子的「基石」：國家要振興、社會要進步，都要靠教育打底。教育是國之大計、黨之大計。", "id": "Q23-001", "l": 23, "ch": 7}, {"s": [4], "src": "", "card": "C23-02", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜辦好中國特色社會主義教育：黨的全面領導是根本保證：\n必须坚持（＿①＿），坚持党的教育方针……是办好教育的（＿②＿）", "a": ["党对教育工作的全面领导", "根本保证"], "e": "必須堅持黨對教育工作的全面領導，堅持黨的教育方針……是辦好教育的根本保證。講師：把這一段背到這裏就可以了。", "id": "Q23-002", "l": 23, "ch": 7}, {"s": [7, 8], "src": "", "card": "C23-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "填", "q": "填空｜落實立德樹人根本任務：教育的根本問題：\n（＿①＿）是教育的（＿②＿），也是建设教育强国的（＿③＿）", "a": ["培养什么人、怎样培养人、为谁培养人", "根本问题", "核心课题"], "e": "培養什麼人、怎樣培養人、為誰培養人，是教育的根本問題，也是建設教育強國的核心課題。", "id": "Q23-003", "l": 23, "ch": 7}, {"s": [7, 8], "src": "", "card": "C23-03", "tag": ["必背", "選擇題考點"], "auto": 1, "k": "默", "q": "默寫｜落實立德樹人根本任務：教育的根本問題", "model": "培养什么人、怎样培养人、为谁培养人是教育的根本问题，也是建设教育强国的核心课题", "pts": ["培养什么人", "怎样培养人", "为谁培养人"], "e": "記法：「什麼人・怎樣培養・為誰」三問。", "id": "Q23-004", "l": 23, "ch": 7}, {"s": [8], "src": "逐字稿", "card": "C23-04", "tag": ["必背", "多選題考點"], "auto": 1, "k": "填", "q": "填空｜全員育人・全過程育人・全方位育人：\n（＿①＿）、（＿②＿）、（＿③＿）", "a": ["全员育人", "全过程育人", "全方位育人"], "e": "講師：多選題——全員育人、全過程育人、全方位育人（家庭、學校、社會協同）。", "id": "Q23-005", "l": 23, "ch": 7}, {"s": [8], "src": "逐字稿", "card": "C23-04", "tag": ["必背", "多選題考點"], "auto": 1, "k": "多", "q": "講師提到的多選題考點「三全育人」是：", "o": ["全员育人", "全过程育人", "全方位育人", "全民育人", "全程考试"], "a": [0, 1, 2], "e": "正確：全员育人；全过程育人；全方位育人。干擾項：全民育人；全程考试。", "id": "Q23-006", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "", "card": "C23-05", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜辦好人民滿意的教育（五個黃色標題）：\n（1）大力促进（＿①＿）；（2）加快建设（＿②＿）；（3）提升教育服务（＿③＿）能力；（4）坚持深化（＿④＿）；（5）坚持把（＿⑤＿）作为基础工作", "a": ["教育公平", "高质量教育体系", "经济社会发展", "教育改革创新", "教师队伍建设"], "e": "講師：背黃色標題。①大力促進教育公平；②加快建設高質量教育體系；③提升教育服務經濟社會發展能力；④堅持深化教育改革創新；⑤堅持把教師隊伍建設作為基礎工作。人民滿意才是教育的根本尺度。", "id": "Q23-007", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "", "card": "C23-05", "tag": ["必背", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜辦好人民滿意的教育（五個黃色標題）", "model": "（1）大力促进教育公平；（2）加快建设高质量教育体系；（3）提升教育服务经济社会发展能力；（4）坚持深化教育改革创新；（5）坚持把教师队伍建设作为基础工作", "pts": ["大力促进教育公平", "加快建设高质量教育体系", "提升教育服务经济社会发展能力", "坚持深化教育改革创新", "坚持把教师队伍建设作为基础工作"], "e": "記法：「公平・質量・服務・改革・教師」＝「公・質・服・改・師」。", "id": "Q23-008", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "逐字稿", "card": "C23-06", "tag": ["選擇題考點"], "auto": 1, "k": "填", "q": "填空｜教育的幾個「定位句」：\n（＿①＿）是社会公平的（＿②＿）；（＿③＿）是各级各类教育的（＿④＿）；教育大计，（＿⑤＿）", "a": ["教育公平", "重要基础", "高质量发展", "生命线", "教师为本"], "e": "教育公平是社會公平的重要基礎（講師：選擇）；高質量發展是各級各類教育的生命線；服務高質量發展是建設教育強國的重要任務；教育大計，教師為本，強教必先強師。", "id": "Q23-009", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "逐字稿", "card": "C23-06", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師：「教育公平」是：", "o": ["社会公平的重要基础", "教育的根本尺度", "各级各类教育的生命线"], "a": 0, "e": "「教育公平」→「社会公平的重要基础」。記法：「公平＝基礎、質量＝生命線、教師＝根本」。", "id": "Q23-010", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "逐字稿", "card": "C23-06", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「教育公平」是社会公平的重要基础。", "a": true, "e": "對。「教育公平」→「社会公平的重要基础」。", "id": "Q23-011", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "逐字稿", "card": "C23-06", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師：「高质量发展」是：", "o": ["各级各类教育的生命线", "教育的根本尺度", "社会公平的重要基础"], "a": 0, "e": "「高质量发展」→「各级各类教育的生命线」。記法：「公平＝基礎、質量＝生命線、教師＝根本」。", "id": "Q23-012", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "逐字稿", "card": "C23-06", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「高质量发展」是教育的根本尺度。", "a": false, "e": "錯。「高质量发展」應對應「各级各类教育的生命线」，「教育的根本尺度」對應的是「人民满意」。", "id": "Q23-013", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "逐字稿", "card": "C23-06", "tag": ["選擇題考點"], "auto": 1, "k": "單", "q": "講師：「人民满意」是：", "o": ["教育的根本尺度", "各级各类教育的生命线", "社会公平的重要基础"], "a": 0, "e": "「人民满意」→「教育的根本尺度」。記法：「公平＝基礎、質量＝生命線、教師＝根本」。", "id": "Q23-014", "l": 23, "ch": 7}, {"s": [9, 10, 11], "src": "逐字稿", "card": "C23-06", "tag": ["選擇題考點"], "auto": 1, "k": "判", "q": "「人民满意」是教育的根本尺度。", "a": true, "e": "對。「人民满意」→「教育的根本尺度」。", "id": "Q23-015", "l": 23, "ch": 7}, {"k": "單", "s": [3], "q": "民族振興、社會進步的基石是：", "o": ["教育", "科技", "人才", "文化"], "a": 0, "e": "講師：「教育是什麼？選擇題。教育是民族振興社會進步的基石。」", "id": "Q23-016", "l": 23, "ch": 7}, {"k": "單", "s": [9], "q": "社會公平的重要基礎是：", "o": ["教育公平", "司法公正", "分配公平", "機會均等"], "a": 0, "e": "講師：「教育公平是社會公平的重要基礎。」", "id": "Q23-017", "l": 23, "ch": 7}, {"k": "多", "s": [8], "q": "落實立德樹人根本任務，必須解決好的教育根本問題是：", "o": ["培養什麼人", "怎樣培養人", "為誰培養人", "培養多少人"], "a": [0, 1, 2], "e": "三問：什麼人、怎樣培養、為誰培養。", "id": "Q23-018", "l": 23, "ch": 7}, {"k": "判", "s": [4], "q": "堅持黨對教育工作的全面領導，是辦好教育的根本保證。", "a": true, "e": "對。講師：背到這裏就可以了。", "id": "Q23-019", "l": 23, "ch": 7}, {"k": "填", "s": [9, 10, 11], "q": "辦好人民滿意的教育：大力促進教育（＿①＿）；加快建設（＿②＿）教育體系；提升教育服務經濟社會發展能力；堅持深化教育改革創新；堅持把（＿③＿）建設作為基礎工作。", "a": ["公平", "高质量", "教师队伍"], "e": "五個黃色標題。", "id": "Q23-020", "l": 23, "ch": 7}, {"k": "簡", "s": [9, 10, 11], "q": "簡答：如何辦好人民滿意的教育？", "sum": "一句白話：教育要公平、要高質量、要服務經濟社會、要不斷改革、要建好老師隊伍。", "pts": ["大力促进教育公平", "加快建设高质量教育体系", "提升教育服务经济社会发展能力", "坚持深化教育改革创新", "坚持把教师队伍建设作为基础工作"], "e": "講師：「仍然是背黃色。」", "id": "Q23-021", "l": 23, "ch": 7}, {"s": [3, 4, 5], "src": "", "card": "C24-01", "tag": ["必背", "選擇題考點", "簡答題考點"], "auto": 1, "k": "填", "q": "填空｜科技強則國家強（三點）：\n实现高水平科技自立自强是国家强盛和民族复兴的（＿①＿）；是应对风险挑战和维护国家利益的（＿②＿）；是构建新发展格局、推动高质量发展、满足人民美好生活需要的（＿③＿）", "a": ["战略基石", "必然选择", "内在要求"], "e": "實現高水平科技自立自強：①是國家強盛和民族復興的戰略基石（選擇題）；②是應對風險挑戰和維護國家利益的必然選擇（背這一句）；③是構建新發展格局、推動高質量發展、滿足人民美好生活需要的內在要求。講師：內文理解即可，背黃色標題。", "id": "Q24-001", "l": 24, "ch": 7}, {"s": [3, 4, 5], "src": "", "card": "C24-01", "tag": ["必背", "選擇題考點", "簡答題考點"], "auto": 1, "k": "默", "q": "默寫｜科技強則國家強（三點）", "model": "实现高水平科技自立自强是国家强盛和民族复兴的战略基石；是应对风险挑战和维护国家利益的必然选择；是构建新发展格局、推动高质量发展、满足人民美好生活需要的内在要求", "pts": ["实现高水平科技自立自强是国家强盛和民族复兴的战略基石", "实现高水平科技自立自强是应对风险挑战和维护国家利益的必然选择", "实现高水平科技自立自强是构建新发展格局、推动高质量发展、满足人民美好生活需要的内在要求"], "e": "記法：「基石・選擇・要求」。", "id": "Q24-002", "l": 24, "ch": 7}, {"s": [3, 4, 5], "src": "", "card": "C24-01", "tag": ["必背", "選擇題考點", "簡答題考點"], "auto": 1, "k": "單", "q": "實現高水平科技自立自強是「国家强盛和民族复兴」的：", "o": ["战略基石", "必然选择", "内在要求"], "a": 0, "e": "「国家强盛和民族复兴」→「战略基石」。記法：「基石・選擇・要求」。", "id": "Q24-003", "l": 24, "ch": 7}, {"s": [3, 4, 5], "src": "", "card": "C24-01", "tag": ["必背", "選擇題考點", "簡答題考點"], "auto": 1, "k": "判", "q": "實現高水平科技自立自強是国家强盛和民族复兴的战略基石。", "a": true, "e": "對。「国家强盛和民族复兴」→「战略基石」。", "id": "Q24-004", "l": 24, "ch": 7}, {"s": [3, 4, 5], "src": "", "card": "C24-01", "tag": ["必背", "選擇題考點", "簡答題考點"], "auto": 1, "k": "單", "q": "實現高水平科技自立自強是「应对风险挑战和维护国家利益」的：", "o": ["必然选择", "战略基石", "内在要求"], "a": 0, "e": "「应对风险挑战和维护国家利益」→「必然选择」。記法：「基石・選擇・要求」。", "id": "Q24-005", "l": 24, "ch": 7}, {"s": [3, 4, 5], "src": "", "card": "C24-01", "tag": ["必背", "選擇題考點", "簡答題考點"], "auto": 1, "k": "判", "q": "實現高水平科技自立自強是应对风险挑战和维护国家利益的内在要求。", "a": false, "e": "錯。「应对风险挑战和维护国家利益」應對應「必然选择」，「内在要求」對應的是「构建新发展格局、推动高质量发展、满足人民美好生活需要」。", "id": "Q24-006", "l": 24, "ch":
